<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 자원 교환소</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f9f5ec;
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      padding: 1rem 0;
      width: 100%;
      max-width: 600px;
    }
    header h1 {
      font-size: 1.8rem;
      color: #3f2f1f;
    }
    .info, .status-box, .inventory-box, .buttons, .navigation {
      width: 100%;
      max-width: 600px;
    }
    .info {
      background-color: #fff;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-bottom: 1rem;
    }
    .inventory-box, .status-box {
      background-color: #fff;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 1rem;
    }
    .inventory-box h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: #333;
    }
    .inventory-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
    }
    .inventory-item:last-child {
      border-bottom: none;
    }
    input[type="checkbox"] {
      margin-right: 0.5rem;
    }
    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }
    .buttons button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #cfa765;
      color: white;
      cursor: pointer;
    }
    .buttons button:hover {
      background-color: #a98445;
    }
    .navigation {
      text-align: center;
      margin-top: 2rem;
    }
    .navigation a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background-color: #6ca244;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    .navigation a:hover {
      background-color: #568a36;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔄 OrcaX 자원 교환소</h1>
    <div id="nicknameBox"></div>
  </header>

  <div class="info" id="infoBox">정보 불러오는 중...</div>

  <div class="status-box">
    <div>💧 물: <span id="waterCount">0</span></div>
    <div>🌿 거름: <span id="fertilizerCount">0</span></div>
  </div>

  <div class="inventory-box">
    <h3>📦 가공 제품 보관함</h3>
    <div id="inventoryItems"></div>
  </div>

  <div class="buttons">
    <button onclick="exchangeSelected('water')">선택 제품 → 물 교환</button>
    <button onclick="exchangeSelected('fertilizer')">선택 제품 → 거름 교환</button>
  </div>

  <div class="navigation">
    <a href="gamja-shop.html">🛒 씨감자 상점</a>
    <a href="gamja-market.html">💰 거래소 이동</a>
    <a href="gamja-result.html">🏭 가공공장 이동</a>
  </div>

  
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const nickname = localStorage.getItem("nickname");
    if (!nickname) {
      alert("로그인 정보가 없습니다. 로그인 페이지로 이동합니다.");
      window.location.href = "orcax-farm_000.html";
      return;
    }

    document.getElementById("nicknameBox").textContent = "👤 " + nickname + " 님";

    const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nickname })
    });

    const data = await res.json();
    if (!data.success) {
      alert("서버에 사용자 정보가 없습니다. 다시 로그인 해주세요.");
      window.location.href = "orcax-farm_000.html";
      return;
    }

    document.getElementById("productCount").textContent = data.user.productCount;
    document.getElementById("waterCount").textContent = data.user.water;
    document.getElementById("fertilizerCount").textContent = data.user.fertilizer;
  });

  async function exchange(resource) {
    const nickname = localStorage.getItem("nickname");
    const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/exchange", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nickname, resource })
    });

    const result = await res.json();
    if (result.success) {
      alert(`${resource} 교환 성공!`);
      location.reload();
    } else {
      alert("교환 실패: " + result.message);
    }
  }
</script>

</body>
</html>
