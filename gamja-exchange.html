
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 자원 교환소</title>
  <style>
    body { font-family: 'Arial'; background: #f8f8f8; text-align: center; padding: 20px; }
    .status { margin-top: 10px; font-weight: bold; }
    .resource-block, .product-block, .actions { margin: 20px auto; max-width: 600px; }
    .product-item { padding: 10px; background: #fff; border: 1px solid #ddd; margin-bottom: 5px; }
    button { margin: 5px; padding: 10px 20px; font-weight: bold; }
    .warn { color: red; }
  </style>
</head>
<body>
  <h1>OrcaX 자원 교환소</h1>
  <div class="status" id="serverStatus">서버 연결 상태 확인 중...</div>
  <div id="userInfo" class="status"></div>

  <div class="resource-block">
    <p>물: <span id="water">0</span> | 거름: <span id="fertilizer">0</span> | ORCX: <span id="token">0</span></p>
  </div>

  <div class="product-block">
    <h3>보관 중인 가공 제품</h3>
    <div id="productList">불러오는 중...</div>
  </div>

  <div class="actions">
    <button onclick="exchangeSelected('water')">물로 교환</button>
    <button onclick="exchangeSelected('fertilizer')">거름으로 교환</button>
  </div>

  <div class="actions">
    <button onclick="location.href='gamja-shop.html'">씨감자 상점</button>
    <button onclick="location.href='gamja-result.html'">가공 공장</button>
    <button onclick="location.href='gamja-market.html'">거래소</button>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname");

    const serverStatus = document.getElementById("serverStatus");
    const userInfo = document.getElementById("userInfo");
    const waterEl = document.getElementById("water");
    const fertilizerEl = document.getElementById("fertilizer");
    const tokenEl = document.getElementById("token");
    const productList = document.getElementById("productList");

    let userData = { water: 0, fertilizer: 0, token: 0, inventory: [] };

    async function fetchUserData() {
      if (!nickname) {
        userInfo.innerHTML = '<span class="warn">닉네임 정보 없음</span>';
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/userdata`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname })
        });
        const data = await res.json();
        if (data.success) {
          userData = data.user;
          waterEl.textContent = userData.water;
          fertilizerEl.textContent = userData.fertilizer;
          tokenEl.textContent = userData.token;
          userInfo.innerHTML = `${nickname} 님 | 농장 이름: ${userData.farmName}`;
        } else {
          userInfo.innerHTML = '<span class="warn">유저 정보 없음</span>';
        }
      } catch (err) {
        serverStatus.innerHTML = '<span class="warn">서버 연결 실패</span>';
      }
    }

    async function fetchProducts() {
      try {
        const res = await fetch(`${API_BASE}/api/products/${encodeURIComponent(nickname)}`);
        const data = await res.json();
        if (data.success) {
          userData.inventory = data.products;
          renderProductList();
        } else {
          productList.innerHTML = '<span class="warn">제품 정보 없음</span>';
        }
      } catch (err) {
        productList.innerHTML = '<span class="warn">제품 목록 불러오기 실패</span>';
      }
    }

    function renderProductList() {
      if (!userData.inventory || userData.inventory.length === 0) {
        productList.innerHTML = '<p>보관 중인 제품이 없습니다.</p>';
        return;
      }
      productList.innerHTML = "";
      userData.inventory.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "product-item";
        div.innerHTML = `<input type="checkbox" id="product${index}" data-index="${index}"> ${item.name} (${item.type}) × ${item.count}`;
        productList.appendChild(div);
      });
    }

    async function exchangeSelected(resourceType) {
      const selected = [...document.querySelectorAll("input[type='checkbox']:checked")];
      if (selected.length === 0) return alert("제품을 선택해주세요.");

      selected.forEach(el => {
        const i = parseInt(el.dataset.index);
        if (userData.inventory[i].count > 0) {
          userData.inventory[i].count--;
          if (resourceType === "water") userData.water++;
          if (resourceType === "fertilizer") userData.fertilizer++;
        }
      });

      await saveUserData();
      alert("교환 완료!");
      renderProductList();
      waterEl.textContent = userData.water;
      fertilizerEl.textContent = userData.fertilizer;
    }

    async function saveUserData() {
      await fetch(`${API_BASE}/api/userdata`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(userData)
      });
      await fetch(`${API_BASE}/api/products/${encodeURIComponent(nickname)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ products: userData.inventory })
      });
    }

    serverStatus.textContent = "서버 연결됨";
    fetchUserData();
    fetchProducts();
  </script>
</body>
</html>
