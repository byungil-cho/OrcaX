<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>OrcaX 자원 교환소</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>
    body {
      font-family: 'Arial', sans-serif;
      background: #fef9e8;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #504030;
      margin: 1rem 0 0.5rem;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem 0.5rem 0;
      color: #503020;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
    }
    .status-box {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 1rem;
      margin-top: 2rem;
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    .status-item {
      margin: 0.5rem 0;
    }
    button {
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      background: #cfa765;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #af934f;
    }
    .inventory-box {
      margin-top: 1rem;
      background: #fffaf0;
      padding: 1rem;
      border: 1px dashed #aaa;
      border-radius: 5px;
      max-width: 400px;
    }
    .inventory-box h3 {
      margin-bottom: 0.5rem;
    }
    .inventory-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
    }
    .inventory-item input[type="checkbox"] {
      margin-right: 0.5rem;
    }
    .navigation-links {
      text-align: center;
      margin-top: 2rem;
    }
    .navigation-links a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background: #76b947;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .navigation-links a:hover {
      background: #5c9e35;
    }
  
#statusWrapper {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 0.9rem;
  color: #333;
  text-align: right;
  background: #fff8dc;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  box-shadow: 0 0 6px rgba(0,0,0,0.1);
}
</style>
</head>
<body><div id="statusWrapper"><div id="powerStatus">🔌 전원 상태: 연결됨</div><div id="farmNameBox">🌱 농장 이름: 불러오는 중...</div></div>
<div id="nicknameBox"></div>
<h1>🔄 OrcaX 자원 교환소</h1>
<div id="container">
<div class="status-box">
<div class="status-item">💧 물: <span id="waterCount">0</span></div>
<div class="status-item">🌿 거름: <span id="fertilizerCount">0</span></div>
<div class="status-item">🥔 감자 가공 제품으로 교환 가능합니다.</div>
<button onclick="exchangeSelected('water')">선택 제품 → 물 교환</button>
<button onclick="exchangeSelected('fertilizer')">선택 제품 → 거름 교환</button>
</div>
<div class="inventory-box">
<h3>📦 가공 제품 보관함</h3>
<div id="inventoryItems"></div>
</div>
<div class="navigation-links">
<a href="gamja-shop.html">🛒 씨감자 상점 (2 ORCX 교환)</a>
<a href="gamja-market.html">💰 거래소 이동</a>
<a href="gamja-result.html">🏭 가공공장 이동</a>
</div>
</div>
<script>
const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

    const nickname = localStorage.getItem("nickname") || "방문자";
    document.getElementById("nicknameBox").textContent = `👤 ${nickname} 님`;

    let userData = {
      nickname,
      water: 0,
      fertilizer: 0,
      inventory: []
    };

    function fetchUserData() {
      fetch(`https://climbing-wholly-grouper.ngrok-free.app/api/userdata?nickname=${encodeURIComponent(nickname)}`)
        .then(res => res.json())
        .then(data => {
          userData.water = data.water ?? 0;
          userData.fertilizer = data.fertilizer ?? 0;
          userData.inventory = (data.inventory ?? []).filter(
            item => typeof item.type === "string" && item.type !== "undefined" && item.count > 0
          );
          updateDisplay();
        })
        .catch(err => console.error("불러오기 실패", err));
    }

    function updateDisplay() {
      document.getElementById("waterCount").textContent = userData.water;
      document.getElementById("fertilizerCount").textContent = userData.fertilizer;
      renderInventory();
    }

    function renderInventory() {
      const inventoryEl = document.getElementById("inventoryItems");
      inventoryEl.innerHTML = "";
      userData.inventory.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "inventory-item";
        div.innerHTML = `
          <input type="checkbox" value="${index}"> ${item.type} × ${item.count}
        `;
        inventoryEl.appendChild(div);
      });
    }

    function exchangeSelected(type) {
      const checkboxes = document.querySelectorAll(".inventory-item input[type='checkbox']:checked");
      if (checkboxes.length === 0) return alert("교환할 제품을 선택하세요.");
      const indexes = Array.from(checkboxes).map(cb => parseInt(cb.value)).sort((a, b) => b - a);
      indexes.forEach(idx => {
        const item = userData.inventory[idx];
        if (item.count > 1) {
          item.count--;
        } else {
          userData.inventory.splice(idx, 1);
        }
      });
      if (type === 'water') userData.water += indexes.length;
      else if (type === 'fertilizer') userData.fertilizer += indexes.length;

      fetch(`${API_BASE}/api/update-user", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(userData)
      })
        .then(res => res.json())
        .then(() => {
          alert(`선택한 제품이 ${type === 'water' ? '물' : '거름'}으로 교환되었습니다.`);
          updateDisplay();
        })
        .catch(() => alert("❌ 저장 실패: 서버 오류"));
    }

    fetchUserData();
  

// 전원 상태 확인 로직 (예시로 항상 연결됨 처리)
document.getElementById("powerStatus").textContent = "🔌 전원 상태: 연결됨";

// 로컬 스토리지에서 농장명 불러오기
const farmName = localStorage.getItem("farmName");
if (farmName) {
  document.getElementById("farmNameBox").textContent = `🌱 농장 이름: ${farmName}`;
} else {
  document.getElementById("farmNameBox").textContent = "🌱 농장 이름: 없음";
}


// 전원 상태 기본값
document.getElementById("powerStatus").textContent = "🔌 전원 상태: 연결됨";

// 농장 이름 불러오기
const farmName = localStorage.getItem("farmName");
if (farmName) {
  document.getElementById("farmNameBox").textContent = `🌱 농장 이름: ${farmName}`;
} else {
  document.getElementById("farmNameBox").textContent = "🌱 농장 이름: 없음";
}
</script>
</body>
</html>
</html>
