<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <title>OrcaX 자원 교환소</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #fef9e8;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #504030;
      margin: 1rem 0 0.5rem;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem 0.5rem 0;
      color: #503020;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
    }
    .status-box {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 1rem;
      margin-top: 2rem;
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    .status-item {
      margin: 0.5rem 0;
    }
    button {
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      background: #cfa765;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #af934f;
    }
    .inventory-box {
      margin-top: 1rem;
      background: #fffaf0;
      padding: 1rem;
      border: 1px dashed #aaa;
      border-radius: 5px;
      max-width: 400px;
    }
    .inventory-box h3 {
      margin-bottom: 0.5rem;
    }
    .inventory-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
    }
    .inventory-item input[type="checkbox"] {
      margin-right: 0.5rem;
    }
    .navigation-links {
      text-align: center;
      margin-top: 2rem;
    }
    .navigation-links a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background: #76b947;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .navigation-links a:hover {
      background: #5c9e35;
    }
  </style>
</head>
<body>
  <div id="infoBox" style="text-align:center; margin: 0.5rem; font-weight: bold;"></div>
  <div id="nicknameBox"></div>
  <h1>🔄 OrcaX 자원 교환소</h1>
  <div id="container">
    <div class="status-box">
      <div class="status-item">💧 물: <span id="waterCount">0</span></div>
      <div class="status-item">🌿 거름: <span id="fertilizerCount">0</span></div>
      <div class="status-item">🥔 감자 및 보리 가공 제품으로 교환 가능합니다.</div>
      <button onclick="exchangeSelected('water')">선택 제품 → 물 교환</button>
      <button onclick="exchangeSelected('fertilizer')">선택 제품 → 거름 교환</button>
    </div>
    <div class="inventory-box">
      <h3>📦 가공 제품 보관함</h3>
      <div id="inventoryItems"></div>
    </div>
    <div class="navigation-links">
      <a href="gamja-shop.html">🛒 씨감자 상점 (2 ORCX 교환)</a>
      <a href="gamja-market.html">💰 거래소 이동</a>
      <a href="gamja-result.html">🏭 가공공장 이동</a>
    </div>
  </div>
  <script>
const nickname = localStorage.getItem("nickname");
const nicknameBox = document.getElementById("nicknameBox");
const infoBox = document.getElementById("infoBox");

const WATER_PER_ITEM = 5;
const FERTILIZER_PER_ITEM = 3;

const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

const userData = {
  nickname,
  water: 0,
  fertilizer: 0,
  token: 0,
  inventory: []
};

if (!nickname) {
  alert("로그인 정보가 없습니다. 입구로 이동합니다.");
  window.location.href = "orcax-farm_000.html";
} else {
  nicknameBox.textContent = `👤 ${nickname} 님`;
  fetchUserData();
}

function fetchUserData() {
  fetch(`${API_BASE}/api/userdata?nickname=${encodeURIComponent(nickname)}`)
    .then(res => res.json())
    .then(user => {
      userData.water = user.water ?? 0;
      userData.fertilizer = user.fertilizer ?? 0;
      userData.token = user.token ?? 0;
      userData.inventory = Array.isArray(user.inventory) ? user.inventory.filter(item => item.category) : [];

      infoBox.innerHTML = `
        💧 물: <strong>${userData.water}</strong> |
        🌿 거름: <strong>${userData.fertilizer}</strong> |
        💰 ORCX: <strong>${userData.token}</strong>
      `;

      loadProductStorage();
    })
    .catch(err => {
      console.error("유저 정보 불러오기 실패", err);
      infoBox.textContent = "❌ 유저 정보 없음";
    });
}

function loadProductStorage() {
  const merged = {};
  userData.inventory.forEach(item => {
    if (!item.type || item.count < 1) return;
    const key = `${item.type} (${item.category})`;
    if (merged[key]) {
      merged[key].count += item.count;
    } else {
      merged[key] = { ...item, type: key };
    }
  });

  const mergedList = Object.values(merged);
  const list = document.getElementById("inventoryItems");
  list.innerHTML = "";

  if (mergedList.length === 0) {
    const div = document.createElement("div");
    div.textContent = "제품이 없습니다.";
    list.appendChild(div);
    return;
  }

  mergedList.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "inventory-item";
    div.innerHTML = `
      <label>
        <input type="checkbox" data-idx="${i}" />
        ${item.type} × ${item.count}
      </label>
    `;
    list.appendChild(div);
  });
}

function exchangeSelected(type) {
  const checkboxes = document.querySelectorAll("#inventoryItems input[type='checkbox']:checked");
  if (checkboxes.length === 0) {
    alert("교환할 제품을 선택하세요.");
    return;
  }

  const indexes = Array.from(checkboxes).map(cb => parseInt(cb.dataset.idx));
  let itemCount = 0;

  const list = Object.values(userData.inventory.reduce((acc, item) => {
    const key = `${item.type} (${item.category})`;
    if (!acc[key]) acc[key] = { ...item };
    else acc[key].count += item.count;
    return acc;
  }, {}));

  indexes.forEach(i => {
    itemCount += list[i].count;
  });

  const waterAdd = itemCount * WATER_PER_ITEM;
  const fertAdd = itemCount * FERTILIZER_PER_ITEM;

  const message = type === "water"
    ? `💧 물 ${waterAdd}개로 교환됩니다. 진행할까요?`
    : `🌿 거름 ${fertAdd}개로 교환됩니다. 진행할까요?`;

  if (!confirm(message)) return;

  indexes.sort((a, b) => b - a).forEach(i => {
    const key = list[i].type;
    const idx = userData.inventory.findIndex(x => `${x.type} (${x.category})` === key);
    if (idx !== -1) {
      if (userData.inventory[idx].count > 1) {
        userData.inventory[idx].count--;
      } else {
        userData.inventory.splice(idx, 1);
      }
    }
  });

  if (type === "water") userData.water += waterAdd;
  if (type === "fertilizer") userData.fertilizer += fertAdd;

  saveUserData();
}

function saveUserData() {
  fetch(`${API_BASE}/api/userdata`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(userData)
  })
    .then(() => {
      alert("✅ 교환 완료!");
      fetchUserData();
    })
    .catch(err => {
      alert("❌ 서버 저장 실패");
      console.error(err);
    });
}
</script>
</body>
</html>
