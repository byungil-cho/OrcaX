<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감자 자원 교환소</title>
  <style>
    body {
      background-color: #fffef3;
      font-family: 'Noto Sans KR', sans-serif;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #ffe490;
      padding: 1rem;
      font-size: 1.6rem;
      font-weight: bold;
    }
    .status {
      margin-top: 1rem;
      font-weight: bold;
    }
    .warn { color: red; }
    .resources {
      background: #f9f2d0;
      display: inline-block;
      padding: 1rem;
      margin: 1rem auto;
      border-radius: 10px;
      font-size: 1.1rem;
    }
    .products {
      margin: 1rem auto;
      max-width: 600px;
    }
    .product-item {
      background: #e0f7d9;
      margin: 0.4rem;
      padding: 0.6rem;
      border-radius: 8px;
    }
    button {
      margin: 0.5rem;
      padding: 0.6rem 1.2rem;
      font-weight: bold;
      background-color: #90e0a9;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #69db7c;
    }
  </style>
</head>
<body>
  <header>감자 자원 교환소</header>
  <div class="status" id="serverStatus">서버 연결 확인 중...</div>
  <div class="status" id="userInfo">유저 정보 확인 중...</div>

  <div class="resources">
    💧 물: <span id="water">0</span> | 🌿 거름: <span id="fertilizer">0</span> | 🪙 ORCX: <span id="token">0</span>
  </div>

  <div class="products" id="productList">불러오는 중...</div>

  <div>
    <button onclick="exchange('water')">💧 물로 교환</button>
    <button onclick="exchange('fertilizer')">🌿 거름으로 교환</button>
  </div>

  <div>
    <button onclick="location.href='gamja-shop.html'">씨감자 상점</button>
    <button onclick="location.href='gamja-result.html'">가공 공장</button>
    <button onclick="location.href='gamja-market.html'">거래소</button>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname");
    const farmName = localStorage.getItem("farmName");

    const serverStatus = document.getElementById("serverStatus");
    const userInfo = document.getElementById("userInfo");
    const water = document.getElementById("water");
    const fertilizer = document.getElementById("fertilizer");
    const token = document.getElementById("token");
    const productList = document.getElementById("productList");

    let userData = {};
    let products = [];

    if (!nickname) {
      alert("로그인이 필요합니다");
      location.href = "orcax-farm_000.html";
    }

    async function loadUserData() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, farmName })
        });
        const data = await res.json();
        if (data.success) {
          userData = data.user;
          water.textContent = userData.water;
          fertilizer.textContent = userData.fertilizer;
          token.textContent = userData.token;
          userInfo.innerHTML = `👤 <b>${nickname}</b> (${farmName}) 님`;
        } else {
          userInfo.innerHTML = "<span class='warn'>유저 정보 없음</span>";
        }
      } catch {
        serverStatus.innerHTML = "<span class='warn'>❌ 서버 연결 실패</span>";
      }
    }

    async function loadProducts() {
      try {
        const res = await fetch(`${API_BASE}/api/products/${encodeURIComponent(nickname)}`);
        const data = await res.json();
        if (data.success) {
          products = data.products;
          renderProducts();
        } else {
          productList.innerHTML = "<span class='warn'>제품 없음</span>";
        }
      } catch {
        productList.innerHTML = "<span class='warn'>불러오기 실패</span>";
      }
    }

    function renderProducts() {
      if (!products.length) {
        productList.innerHTML = "<p>보관 중인 제품이 없습니다.</p>";
        return;
      }
      productList.innerHTML = "";
      products.forEach((item, i) => {
        const div = document.createElement("div");
        div.className = "product-item";
        div.innerHTML = `<input type='checkbox' data-idx='${i}'> ${item.name} (${item.type}) × ${item.count}`;
        productList.appendChild(div);
      });
    }

    async function exchange(type) {
      const checked = [...document.querySelectorAll("input[type='checkbox']:checked")];
      if (!checked.length) return alert("제품을 선택하세요.");
      checked.forEach(box => {
        const idx = box.dataset.idx;
        if (products[idx].count > 0) {
          products[idx].count--;
          if (type === "water") userData.water++;
          if (type === "fertilizer") userData.fertilizer++;
        }
      });
      await saveAll();
      renderProducts();
      water.textContent = userData.water;
      fertilizer.textContent = userData.fertilizer;
    }

    async function saveAll() {
      await fetch(`${API_BASE}/api/userdata`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...userData, farmName })
      });
      await fetch(`${API_BASE}/api/products/${encodeURIComponent(nickname)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ products })
      });
    }

    serverStatus.textContent = "✅ 서버 연결됨";
    loadUserData();
    loadProducts();
  </script>
</body>
</html>
