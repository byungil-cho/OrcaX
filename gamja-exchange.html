<!-- gamja-exchange_final.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 자원 교환소</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f9f5ec;
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      padding: 1rem 0;
      width: 100%;
      max-width: 600px;
    }
    header h1 {
      font-size: 1.8rem;
      color: #3f2f1f;
    }
    .info, .status-box, .inventory-box, .buttons, .navigation {
      width: 100%;
      max-width: 600px;
    }
    .info {
      background-color: #fff;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-bottom: 1rem;
    }
    .inventory-box, .status-box {
      background-color: #fff;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 1rem;
    }
    .inventory-box h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: #333;
    }
    .inventory-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
    }
    .inventory-item:last-child {
      border-bottom: none;
    }
    input[type="checkbox"] {
      margin-right: 0.5rem;
    }
    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }
    .buttons button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #cfa765;
      color: white;
      cursor: pointer;
    }
    .buttons button:hover {
      background-color: #a98445;
    }
    .navigation {
      text-align: center;
      margin-top: 2rem;
    }
    .navigation a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background-color: #6ca244;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    .navigation a:hover {
      background-color: #568a36;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔄 OrcaX 자원 교환소</h1>
    <div id="nicknameBox"></div>
  </header>

  <div class="info" id="infoBox">정보 불러오는 중...</div>

  <div class="status-box">
    <div>💧 물: <span id="waterCount">0</span></div>
    <div>🌿 거름: <span id="fertilizerCount">0</span></div>
  </div>

  <div class="inventory-box">
    <h3>📦 가공 제품 보관함</h3>
    <div id="inventoryItems"></div>
  </div>

  <div class="buttons">
    <button onclick="exchangeSelected('water')">선택 제품 → 물 교환</button>
    <button onclick="exchangeSelected('fertilizer')">선택 제품 → 거름 교환</button>
  </div>

  <div class="navigation">
    <a href="gamja-shop.html">🛒 씨감자 상점</a>
    <a href="gamja-market.html">💰 거래소 이동</a>
    <a href="gamja-result.html">🏭 가공공장 이동</a>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    const nicknameBox = document.getElementById("nicknameBox");
    const infoBox = document.getElementById("infoBox");

    const WATER_PER_ITEM = 5;
    const FERTILIZER_PER_ITEM = 3;

    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

    const userData = {
      nickname,
      water: 0,
      fertilizer: 0,
      token: 0,
      inventory: []
    };

    if (!nickname) {
      alert("로그인 정보가 없습니다. 입구로 이동합니다.");
      window.location.href = "orcax-farm_000.html";
    } else {
      nicknameBox.textContent = `👤 ${nickname} 님`;
      fetchUserData();
    }

    function fetchUserData() {
      fetch(`${API_BASE}/api/userdata?nickname=${encodeURIComponent(nickname)}`)
        .then(res => res.json())
        .then(user => {
          userData.nickname = user.nickname || nickname;
          userData.water = user.water ?? 0;
          userData.fertilizer = user.fertilizer ?? 0;
          userData.token = user.token ?? 0;
          return fetch(`${API_BASE}/api/products/${encodeURIComponent(userData.nickname)}`);
        })
        .then(res => res.json())
        .then(products => {
          userData.inventory = products;
          updateDisplay();
        })
        .catch(err => {
          console.error("유저 정보 불러오기 실패", err);
          infoBox.textContent = "❌ 유저 정보 없음";
        });
    }

    function saveUserData() {
      fetch(`${API_BASE}/api/userdata`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nickname: userData.nickname,
          water: userData.water,
          fertilizer: userData.fertilizer,
          token: userData.token
        })
      })
        .then(() => {
          return fetch(`${API_BASE}/api/products/${encodeURIComponent(userData.nickname)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(userData.inventory.filter(item => item.count >= 0))
          });
        })
        .then(() => {
          alert("✅ 교환 완료!");
          fetchUserData();
        })
        .catch(err => {
          alert("❌ 서버 저장 실패");
          console.error(err);
        });
    }

    function exchangeSelected(type) {
      const checkboxes = document.querySelectorAll("#inventoryItems input[type='checkbox']:checked");
      if (checkboxes.length === 0) {
        alert("교환할 제품을 선택하세요.");
        return;
      }

      let itemCount = 0;
      checkboxes.forEach(cb => {
        const key = cb.dataset.type;
        const [typeText, categoryRaw] = key.split(" (");
        const category = categoryRaw.replace(")", "");

        userData.inventory.forEach(item => {
          const itemCat = item.category || '미분류';
          if (item.type === typeText && itemCat === category && item.count > 0) {
            item.count = Math.max(0, item.count - 1);
            itemCount++;
          }
        });
      });

      if (type === "water") userData.water += itemCount * WATER_PER_ITEM;
      if (type === "fertilizer") userData.fertilizer += itemCount * FERTILIZER_PER_ITEM;

      saveUserData();
      updateDisplay();
    }

    function updateDisplay() {
      infoBox.innerHTML = `💧 물: <strong>${userData.water}</strong> | 🌿 거름: <strong>${userData.fertilizer}</strong> | 💰 ORCX: <strong>${userData.token}</strong>`;
      loadProductStorage();
    }

    function loadProductStorage() {
      const merged = {};
      userData.inventory.forEach(item => {
        if (!item.type) return;
        const cat = item.category || '미분류';
        const key = `${item.type} (${cat})`;
        if (merged[key]) {
          merged[key].count += Number(item.count);
        } else {
          merged[key] = { ...item, type: key, count: Number(item.count) };
        }
      });

      const mergedList = Object.entries(merged);
      const list = document.getElementById("inventoryItems");
      list.innerHTML = "";

      if (mergedList.length === 0) {
        const div = document.createElement("div");
        div.textContent = "제품이 없습니다.";
        list.appendChild(div);
        return;
      }

      mergedList.forEach(([key, item], i) => {
        const div = document.createElement("div");
        div.className = "inventory-item";
        div.innerHTML = `
          <label style="opacity: ${item.count === 0 ? 0.4 : 1}">
            <input type="checkbox" data-type="${key}" ${item.count === 0 ? "disabled" : ""}/>
            ${key} × ${item.count}
          </label>
        `;
        list.appendChild(div);
      });
    }
  </script>
</body>
</html>
