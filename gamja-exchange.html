
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 자원 교환소</title>
  <style>
    body {
      background-color: #fefce8;
      color: #333;
      font-family: 'Noto Sans KR', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h1 {
      background-color: #facc15;
      color: #1e293b;
      padding: 1rem;
      margin: 0;
    }
    .status {
      margin: 1rem;
      font-weight: bold;
    }
    .warn {
      color: red;
    }
    .resources {
      margin: 1rem auto;
      padding: 0.5rem;
      background: #fff8dc;
      display: inline-block;
      border-radius: 8px;
    }
    .product-list {
      margin-top: 1rem;
    }
    .product-item {
      margin: 0.3rem auto;
      background: #e0f2fe;
      padding: 0.5rem;
      border-radius: 6px;
      max-width: 320px;
    }
    .buttons {
      margin: 1rem;
    }
    button {
      margin: 0.3rem;
      padding: 0.5rem 1rem;
      font-weight: bold;
      background-color: #4ade80;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #22c55e;
    }
  </style>
</head>
<body>
  <h1>감자 자원 교환소</h1>
  <div class="status" id="serverStatus">🔄 서버 연결 확인 중...</div>
  <div class="status" id="userInfo">닉네임 불러오는 중...</div>

  <div class="resources">
    💧 물: <span id="water">0</span> |
    🌿 거름: <span id="fertilizer">0</span> |
    🪙 ORCX: <span id="token">0</span>
  </div>

  <div class="product-list" id="productList">제품 불러오는 중...</div>

  <div class="buttons">
    <button onclick="exchange('water')">💧 물로 교환</button>
    <button onclick="exchange('fertilizer')">🌿 거름으로 교환</button>
  </div>

  <div class="buttons">
    <button onclick="location.href='gamja-shop.html'">씨감자 상점</button>
    <button onclick="location.href='gamja-result.html'">가공 공장</button>
    <button onclick="location.href='gamja-market.html'">거래소</button>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname");
    const userInfo = document.getElementById("userInfo");
    const serverStatus = document.getElementById("serverStatus");
    const water = document.getElementById("water");
    const fertilizer = document.getElementById("fertilizer");
    const token = document.getElementById("token");
    const productList = document.getElementById("productList");

    let userData = {};
    let products = [];

    if (!nickname) {
      alert("로그인이 필요합니다. 로그인 페이지로 이동합니다.");
      location.href = "orcax-farm_000.html";
    }

    async function loadUserData() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname })
        });
        const data = await res.json();
        if (data.success && data.user) {
          userData = data.user;
          water.textContent = userData.water ?? 0;
          fertilizer.textContent = userData.fertilizer ?? 0;
          token.textContent = userData.token ?? 0;
          userInfo.textContent = `${nickname} 님 | 농장: ${userData.farmName || '❓ 미지정'}`;
        } else {
          userInfo.innerHTML = '<span class="warn">❌ 유저 정보 없음</span>';
        }
      } catch (e) {
        serverStatus.innerHTML = '<span class="warn">❌ 서버 연결 실패</span>';
      }
    }

    async function loadProducts() {
      try {
        const res = await fetch(`${API_BASE}/api/products/${encodeURIComponent(nickname)}`);
        const data = await res.json();
        if (data.success) {
          products = data.products;
          renderProducts();
        } else {
          productList.innerHTML = '<span class="warn">❌ 제품 없음</span>';
        }
      } catch (e) {
        productList.innerHTML = '<span class="warn">❌ 불러오기 실패</span>';
      }
    }

    function renderProducts() {
      if (!products.length) {
        productList.innerHTML = '<p>보관 중인 제품이 없습니다.</p>';
        return;
      }
      productList.innerHTML = "";
      products.forEach((item, i) => {
        const div = document.createElement("div");
        div.className = "product-item";
        div.innerHTML = `<input type="checkbox" data-idx="${i}"> ${item.name} (${item.type}) × ${item.count}`;
        productList.appendChild(div);
      });
    }

    async function exchange(type) {
      const checked = [...document.querySelectorAll("input[type='checkbox']:checked")];
      if (!checked.length) return alert("제품을 선택하세요.");
      checked.forEach(box => {
        const idx = box.dataset.idx;
        if (products[idx].count > 0) {
          products[idx].count--;
          if (type === "water") userData.water++;
          if (type === "fertilizer") userData.fertilizer++;
        }
      });
      await saveAll();
      renderProducts();
      water.textContent = userData.water;
      fertilizer.textContent = userData.fertilizer;
    }

    async function saveAll() {
      await fetch(`${API_BASE}/api/userdata`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(userData)
      });
      await fetch(`${API_BASE}/api/products/${encodeURIComponent(nickname)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ products })
      });
    }

    serverStatus.textContent = "✅ 서버 연결됨";
    loadUserData();
    loadProducts();
  </script>
</body>
</html>
