<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>OrcaX 자원 교환소</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>
    body {
      font-family: 'Arial', sans-serif;
      background: #fef9e8;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #504030;
      margin: 1rem 0 0.5rem;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem 0.5rem 0;
      color: #503020;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
    }
    .status-box {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 1rem;
      margin-top: 2rem;
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    .status-item {
      margin: 0.5rem 0;
    }
    button {
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      background: #cfa765;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #af934f;
    }
    .inventory-box {
      margin-top: 1rem;
      background: #fffaf0;
      padding: 1rem;
      border: 1px dashed #aaa;
      border-radius: 5px;
      max-width: 400px;
    }
    .inventory-box h3 {
      margin-bottom: 0.5rem;
    }
    .inventory-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
    }
    .inventory-item input[type="checkbox"] {
      margin-right: 0.5rem;
    }
    .navigation-links {
      text-align: center;
      margin-top: 2rem;
    }
    .navigation-links a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background: #76b947;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .navigation-links a:hover {
      background: #5c9e35;
    }
  
#statusWrapper {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 0.9rem;
  color: #333;
  text-align: right;
  background: #fff8dc;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  box-shadow: 0 0 6px rgba(0,0,0,0.1);
}
</style>
</head>
<body><div id="statusWrapper"><div id="powerStatus">🔌 전원 상태: 연결됨</div><div id="farmNameBox">🌱 농장 이름: 불러오는 중...</div></div>
<div id="nicknameBox"></div>
<h1>🔄 OrcaX 자원 교환소</h1>
<div id="container">
<div class="status-box">
<div>💧 물: <span id="waterCount">-</span></div>
<div>💩 거름: <span id="fertilizerCount">-</span></div>
<div>🥔 감자: <span id="potatoCount">-</span></div>
</div>
<div class="inventory-box">
<h3>📦 가공 제품 보관함</h3>
<div id="inventoryItems"></div>
</div>
<div class="navigation-links">
<a href="gamja-shop.html">🛒 씨감자 상점 (2 ORCX 교환)</a>
<a href="gamja-market.html">💰 거래소 이동</a>
<a href="gamja-result.html">🏭 가공공장 이동</a>
</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const nickname = localStorage.getItem("nickname");
  const farmName = localStorage.getItem("farmName") || "이름없음농장";

  if (!nickname) {
    document.getElementById("farmNameBox").textContent = "🌱 농장 이름: 없음";
    return;
  }

  fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata?nickname=" + nickname)
    .then(res => res.json())
    .then(result => {
      if (result.success) {
        const { water, fertilizer, potatoCount, farmName: fn, inventory } = result.data;
        document.getElementById("waterCount").textContent = water;
        document.getElementById("fertilizerCount").textContent = fertilizer;
        document.getElementById("potatoCount").textContent = potatoCount;

        const farmBox = document.getElementById("farmNameBox");
        if (farmBox) farmBox.textContent = `🌱 농장 이름: ${farmName || fn || "없음"}`;

        const list = document.getElementById("inventoryItems");
        if (Array.isArray(inventory)) {
          list.innerHTML = "";
          inventory.forEach(item => {
            const li = document.createElement("li");
            li.textContent = `${item.name} × ${item.count}`;
            list.appendChild(li);
          });
        }
      }
    }).catch(err => {
      console.error("데이터 불러오기 실패:", err);
    });
});
</script>
</body>
</html>
