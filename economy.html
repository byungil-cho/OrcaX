<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>교환소 - OrcaX</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
</head>
<body>
  <main class="container">
    <h2>💱 자원 교환소</h2>
    <p id="diag">🔄 서버 상태 확인 중...</p>

    <!-- 팝콘 교환 -->
    <section>
      <h3>🍿 팝콘 교환</h3>
      <form id="popcornWaterForm">
        <label>팝콘 → 물 (1:1)</label>
        <input type="number" id="popcornWaterAmount" placeholder="팝콘 수량" required />
        <button type="submit">교환하기</button>
      </form>

      <form id="popcornNftForm">
        <label>팝콘 1000개 → NFT (로얄스크린골프 오전 무료이용권)</label>
        <button type="submit">NFT 교환하기</button>
      </form>
    </section>

    <!-- 토큰으로 자원 구매 -->
    <section>
      <h3>🪙 토큰으로 구매</h3>
      <form id="buyForm">
        <label>구매할 자원 선택</label>
        <select id="buyResource">
          <option value="salt">소금 (10 토큰)</option>
          <option value="sugar">설탕 (20 토큰)</option>
          <option value="seed">씨옥수수 (100 토큰)</option>
        </select>
        <input type="number" id="buyAmount" placeholder="수량" required />
        <button type="submit">구매하기</button>
      </form>
    </section>

    <!-- 💳 대출 신청 -->
    <section>
      <h3>💳 대출 신청</h3>
      <form id="loanForm">
        <label>대출 받을 토큰 수량 (단위: 1000/2000/3000)</label>
        <input type="number" id="loanAmount" placeholder="예: 1000" required />
        <button type="submit">대출 신청</button>
      </form>
      <p id="loanStatus">📦 현재 대출: <strong>조회 중...</strong></p>
    </section>

  </main>

  <script>
    const BASE_API = 'https://climbing-wholly-grouper.jp.ngrok.io';
    const kakaoId = localStorage.getItem('kakaoId');
    const URL_USERDATA = BASE_API + '/api/userdata';
    const URL_LOAN = BASE_API + '/api/loan';

    const diagEl = document.getElementById('diag');

    if (!kakaoId) {
      alert('로그인이 필요합니다.');
      window.location.href = 'index9.html';
    } else {
      fetch(URL_USERDATA, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kakaoId })
      })
      .then(r => r.json())
      .then(data => {
        const user = data?.user;
        if (!user) throw new Error('유저 없음');

        diagEl.textContent = `✅ 연결됨 (${user.nickname || kakaoId})`;
        console.log('유저 자원:', user);

        const loan = user.loan?.amount || 0;
        document.querySelector('#loanStatus strong').textContent = `${loan} 토큰`;
      })
      .catch(err => {
        diagEl.textContent = '❌ 서버 오류, API 응답 실패';
        console.warn('유저 로딩 오류:', err);
        alert('서버와 연결 실패했습니다.');
      });

      document.getElementById('loanForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const amt = parseInt(document.getElementById('loanAmount').value);
        if (![1000, 2000, 3000].includes(amt)) return alert('1000, 2000, 3000 중 하나를 입력해주세요');

        fetch(URL_LOAN, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId, amount: amt })
        })
        .then(r => r.json())
        .then(data => {
          alert('대출 완료! 현재 대출: ' + data?.loan?.amount + ' 토큰');
          document.querySelector('#loanStatus strong').textContent = `${data?.loan?.amount} 토큰`;
        })
        .catch(err => alert('요청 실패: ' + err));
      });
    }
  </script>
</body>
</html>
