<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥔 감자 농장</title>
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center top;
      background-size: cover;
      color: #3e2723;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 100vh;
    }
    .container {
      width: 95%;
      max-width: 500px;
      padding: 1rem;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      margin-top: 2rem;
    }
    header {
      background-color: rgba(255, 235, 59, 0.85);
      padding: 1rem;
      font-size: 2rem;
      color: #3e2723;
      width: 100%;
      text-align: center;
      border-radius: 8px;
    }
    .nickname {
      margin-top: 0.5rem;
      font-size: 1.25rem;
      color: #4e342e;
    }
    .info-bar {
      margin-top: 1rem;
      font-size: 1rem;
      color: #5d4037;
    }
    .potato-field {
      margin-top: 2rem;
      font-size: 1.5rem;
      background-color: rgba(255,255,255,0.6);
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .status {
      font-size: 1.2rem;
      margin-top: 1rem;
      color: #5d4037;
    }
    .grow-buttons {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .grow-buttons button, #harvest-btn {
      padding: 0.75rem 1.25rem;
      background-color: #81c784;
      color: #1b5e20;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }
    .grow-buttons button:hover, #harvest-btn:hover {
      background-color: #66bb6a;
    }
    .storage-section {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .storage-box {
      background-color: #fff9c4;
      padding: 1rem;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 6px rgba(0,0,0,0.2);
    }
    .storage-box h3 {
      margin-top: 0;
      color: #3e2723;
    }
    .nav-buttons {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .nav-buttons a {
      padding: 0.75rem 1.5rem;
      background-color: #ffee58;
      color: #3e2723;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }
    .nav-buttons a:hover {
      background-color: #fff176;
    }
  </style>
</head>
<body>
  <header>🥔 감자 농장 - Potato Farm</header>
  <div class="container">
    <div class="nickname">👤 농장주: <span id="nickname">-</span></div>
    <div class="info-bar">
      🌐 전원 상태: <span id="power-status">확인 중...</span> |
      🏧 농장이름: <span id="farm-name">-</span> |
      🐋 토큰: <span id="token">-</span>
    </div>

    <div class="potato-field">
      🌱 감자가 자로고 있습니다...
      <div class="status">성장 포인트: <span id="growth">0</span></div>
      <div class="grow-buttons">
        <button onclick="applyWater()">💧 물 주기</button>
        <button onclick="applyFertilizer()">💩 거름 주기</button>
      </div>
      <div id="harvest-container" style="margin-top: 1.5rem;"></div>
    </div>

    <div class="storage-section">
      <div class="storage-box">
        <h3>📦 자재 보관함</h3>
        <div id="materials">-</div>
      </div>
      <div class="storage-box">
        <h3>🛒 제품 보관함</h3>
        <div id="products">-</div>
      </div>
    </div>

    <div class="nav-buttons">
      <a href="gamja-result.html">감자 보리 가공공장</a>
      <a href="gamja-shop.html">씨감자 씨보리 구매</a>
      <a href="orcax-farm_000.html">메인 페이지</a>
    </div>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname") || "이렁농부";
    const farmName = localStorage.getItem("farmName") || "감자농장";
    const token = localStorage.getItem("token") || 0;
    const materials = localStorage.getItem("materials") || "자재 없음";
    const products = localStorage.getItem("products") || "제품 없음";
    let growth = parseInt(localStorage.getItem("growth") || 0);
    let potato = parseInt(localStorage.getItem("감자") || 0);

    document.getElementById("nickname").textContent = nickname;
    document.getElementById("farm-name").textContent = farmName;
    document.getElementById("token").textContent = token;
    document.getElementById("growth").textContent = growth;
    document.getElementById("power-status").textContent = "전기 공급중입니다.";
    document.getElementById("materials").textContent = materials;
    document.getElementById("products").textContent = products;

    function applyWater() {
      growth += 1;
      updateGrowth();
    }

    function applyFertilizer() {
      growth += 1;
      updateGrowth();
    }

    function updateGrowth() {
      localStorage.setItem("growth", growth);
      document.getElementById("growth").textContent = growth;
      if (growth >= 5 && !document.getElementById("harvest-btn")) {
        const btn = document.createElement("button");
        btn.textContent = "🥔 수확하기";
        btn.id = "harvest-btn";
        btn.onclick = function() {
          const yieldAmount = [3, 5, 7][Math.floor(Math.random() * 3)];
          potato += yieldAmount;
          localStorage.setItem("감자", potato);
          alert(`🎉 감자 ${yieldAmount}개를 수확했습니다!`);
          growth = 0;
          localStorage.setItem("growth", growth);
          document.getElementById("growth").textContent = growth;
          document.getElementById("harvest-container").innerHTML = "";
        };
        document.getElementById("harvest-container").appendChild(btn);
      }
    }
  </script>
</body>
</html>
