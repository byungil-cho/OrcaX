<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>🏭 OrcaX 감자 가공공장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #fff9e6;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 1.8rem;
      color: #5e3c00;
    }
    .status {
      color: red;
      margin-bottom: 1rem;
      font-weight: bold;
    }
    .box {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 450px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    .info {
      margin: 0.5rem 0;
      font-size: 1.1rem;
    }
    input[type="text"] {
      padding: 0.5rem;
      font-size: 1rem;
      width: 60%;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin: 0.5rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .action-btn {
      background-color: #d4a373;
      color: #fff;
    }
    .action-btn:hover {
      background-color: #bc8a5f;
    }
    .bottom-links {
      margin-top: 2rem;
    }
    .bottom-links button {
      background-color: #4caf50;
      color: white;
    }
    .storage {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🏭 OrcaX 감자 가공공장</h1>
  <div class="status" id="statusMsg">⚠ 전기 공급이 끊겼습니다 (서버 응답 없음)</div>

  <div class="box">
    <div class="info">🥔 감자: <span id="potato">0</span></div>
    <div class="info">💧 물: <span id="water">0</span></div>
    <div class="info">🌿 거름: <span id="fertilizer">0</span></div>

    <input type="text" id="productName" placeholder="제품 이름 입력" />
    <button class="action-btn" onclick="processProduct()">제품 가공하기</button><br/>
    <button class="action-btn" onclick="exchangeWater()">선택 제품 → 물 교환</button>
    <button class="action-btn" onclick="exchangeFertilizer()">선택 제품 → 거름 교환</button>

    <div class="storage">
      <button onclick="loadStorage()" class="action-btn">📦 가공 제품 보관함 불러오기</button>
      <div id="storageResult">보관함 미확인</div>
    </div>
  </div>

  <div class="bottom-links">
    <button onclick="location.href='gamja-shop.html'">🛒 씨감자 상점</button>
    <button onclick="location.href='gamja-exchange.html'">♻ 자원 교환소</button>
    <button onclick="location.href='gamja-market.html'">💰 거래소 이동</button>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");

    if (!nickname) {
      alert("로그인 정보 없음: 로그인 페이지로 이동합니다.");
      window.location.href = "orcax-farm_000.html";
    }

    async function processProduct() {
      const name = document.getElementById("productName").value.trim();
      if (!name) return alert("제품 이름을 입력해주세요.");
      try {
        const res = await fetch("https://climbing-wholly-grouper.ngrok-free.app/api/harvest", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, productName: name })
        });
        const data = await res.json();
        alert(data.message || "가공 완료!");
      } catch (err) {
        alert("서버 오류로 가공 실패: " + err.message);
      }
    }

    async function loadStorage() {
      const result = document.getElementById("storageResult");
      try {
        const res = await fetch(`https://climbing-wholly-grouper.ngrok-free.app/api/storage?nickname=${nickname}`);
        const data = await res.json();
        if (data.success) {
          result.innerText = data.items.join(", ") || "보관된 제품이 없습니다.";
        } else {
          result.innerText = data.message || "불러오기 실패";
        }
      } catch (err) {
        result.innerText = "❌ 서버 오류: " + err.message;
      }
    }

    function exchangeWater() {
      alert("물 교환 기능은 별도 구현 예정입니다.");
    }

    function exchangeFertilizer() {
      alert("거름 교환 기능은 별도 구현 예정입니다.");
    }
  </script>
</body>
</html>
