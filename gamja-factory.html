<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 감자밭</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f9ec;
      text-align: center;
      padding: 1rem;
    }
    h1 {
      font-size: 1.8rem;
      color: #256029;
    }
    .status-box {
      background: #fff;
      border: 1px solid #c8e6c9;
      border-radius: 12px;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 400px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .info {
      font-size: 1rem;
      margin: 0.4rem 0;
    }
    .btn {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      margin: 0.5rem;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
    }
    #statusIndicator {
      font-weight: bold;
      margin-bottom: 1rem;
      color: #cc0000;
    }
  </style>
</head>
<body>
  <div id="nicknameBox" style="text-align:right; font-weight:bold;"></div>
  <h1>🌱 OrcaX 감자 농사터</h1>
  <div id="statusIndicator">🔌 서버 연결 상태 확인 중...</div>

  <div class="status-box">
    <div class="info">💧 물: <span id="waterCount">-</span></div>
    <div class="info">🧴 거름: <span id="fertilizerCount">-</span></div>
    <div class="info">🥔 감자: <span id="potatoCount">-</span></div>
    <div class="info">🪙 토큰: <span id="tokenCount">-</span></div>
    <div class="info">🌿 성장 포인트: <span id="growthPoint">0</span></div>
  </div>
  <div>
    <button class="btn" id="waterBtn">💧 물 주기</button>
    <button class="btn" id="fertilizerBtn">🧴 거름 주기</button>
    <button class="btn" id="harvestBtn">🥔 수확하기</button>
    <button class="btn" onclick="location.href='gamja-result.html'">🏭 가공공장</button>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname");
    const farmName = localStorage.getItem("farmName");
    const statusEl = document.getElementById("statusIndicator");

    if (!nickname || !farmName) {
      alert("로그인 또는 농장이름 정보가 없습니다.");
      window.location.href = "orcax-farm_000.html";
    }

    document.getElementById("nicknameBox").innerText = `👤 ${nickname} (${farmName}) 님`;

    const waterEl = document.getElementById("waterCount");
    const fertEl = document.getElementById("fertilizerCount");
    const potatoEl = document.getElementById("potatoCount");
    const tokenEl = document.getElementById("tokenCount");
    const growthEl = document.getElementById("growthPoint");

    let growthPoint = 0;

    async function loadStatus() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata?nickname=${nickname}`);
        if (!res.ok) throw new Error("연결 실패");
        const data = await res.json();

        // ✅ 조건문 수정 → success 키 대신 nickname 확인
        if (data.nickname) {
          waterEl.textContent = data.water ?? 0;
          fertEl.textContent = data.fertilizer ?? 0;
          potatoEl.textContent = data.potatoCount ?? 0;
          tokenEl.textContent = data.token ?? 0;
          statusEl.textContent = "✅ 전기 공급 중 (서버 연결됨)";
          statusEl.style.color = "green";
        } else {
          throw new Error("데이터 없음");
        }
      } catch (err) {
        statusEl.textContent = "❌ 전기 공급 끊김 (서버 응답 없음)";
        statusEl.style.color = "red";
        console.error("서버 오류:", err);
      }
    }

    async function useResource(type) {
      const countEl = type === "water" ? waterEl : fertEl;
      if (parseInt(countEl.textContent) > 0) {
        growthPoint++;
        growthEl.textContent = growthPoint;
        await fetch(`${API_BASE}/api/use-resource`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, type })
        });
        await loadStatus();
      } else {
        alert(`${type === "water" ? "💧 물" : "🧴 거름"}이 부족합니다!`);
      }
    }

    async function harvest() {
      if (growthPoint >= 5) {
        const res = await fetch(`${API_BASE}/api/harvest`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname })
        });
        const data = await res.json();
        if (data.success) {
          alert(`🥔 감자 ${data.harvested}개 수확 성공!`);
          growthPoint = 0;
          growthEl.textContent = "0";
          await loadStatus();
        } else {
          alert("수확 실패: " + data.message);
        }
      } else {
        alert("🌿 성장 포인트가 부족합니다. 최소 5 필요!");
      }
    }

    document.getElementById("waterBtn").onclick = () => useResource("water");
    document.getElementById("fertilizerBtn").onclick = () => useResource("fertilizer");
    document.getElementById("harvestBtn").onclick = harvest;

    loadStatus();
  </script>
</body>
</html>
