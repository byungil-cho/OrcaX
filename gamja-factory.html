<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 농장</title>
  <style>
    body {
      background-image: url('background.jpg');
      background-size: cover;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    .panel {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px;
      margin: 30px auto;
      width: 80%;
      border-radius: 10px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>🌱 농장 관리</h1>
  <div class="panel">
    <h2>씨감자 🌱 씨보리</h2>
    <button onclick="giveWater()">💧 물 주기</button>
    <button disabled>💩 거름 주기</button>
    <button disabled>🍠 수확하기</button>
    <p>🌟 성장포인트: <span id="growth">0</span></p>
  </div>

  <div class="panel">
    <h2>📦 농자재 보관함</h2>
    <p>씨감자: <span id="seedPotato">0</span></p>
    <p>씨보리: <span id="seedBarley">0</span></p>
    <p>💧 물: <span id="water">0</span></p>
    <p>💩 거름: <span id="fertilizer">0</span></p>
    <p>🍀 보유 토큰: <span id="orcx">0</span></p>
  </div>

  <div class="panel">
    <h2>📥 작물 보관소</h2>
    <p>감자: <span id="potato">0</span></p>
    <p>보리: <span id="barley">0</span></p>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";
    const kakaoId = localStorage.getItem("kakaoId") || "testUser";

    const resources = {
      seedPotato: 0,
      seedBarley: 0,
      water: 0,
      fertilizer: 0,
      orcx: 0,
      potato: 0,
      barley: 0
    };

    async function fetchUserState() {
      try {
        const res = await fetch(`${API_BASE}/userdata?kakaoId=${kakaoId}`, {
          method: 'GET',
          headers: {
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          }
        });
        if (!res.ok) throw new Error("불러오기 실패");

        const data = await res.json();
        if (data.seedPotato !== undefined) resources.seedPotato = data.seedPotato;
        if (data.seedBarley !== undefined) resources.seedBarley = data.seedBarley;
        if (data.water !== undefined) resources.water = data.water;
        if (data.fertilizer !== undefined) resources.fertilizer = data.fertilizer;
        if (data.orcx !== undefined) resources.orcx = data.orcx;
        if (data.potato !== undefined) resources.potato = data.potato;
        if (data.barley !== undefined) resources.barley = data.barley;

        updateUI();
      } catch (err) {
        alert("데이터를 불러오지 못했습니다. 네가 또 뭔가 망가뜨린 듯.");
        console.error(err);
      }
    }

    function updateUI() {
      document.getElementById("seedPotato").innerText = resources.seedPotato;
      document.getElementById("seedBarley").innerText = resources.seedBarley;
      document.getElementById("water").innerText = resources.water;
      document.getElementById("fertilizer").innerText = resources.fertilizer;
      document.getElementById("orcx").innerText = resources.orcx;
      document.getElementById("potato").innerText = resources.potato;
      document.getElementById("barley").innerText = resources.barley;
    }

    function giveWater() {
      alert("물 줬다고 착각 마라. 아무 기능도 없으니까.");
    }

    fetchUserState();
  </script>
</body>
</html>
