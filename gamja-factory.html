<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: url("https://byungil-cho.github.io/OrcaX/farm-101.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    .main-container {
      background: rgba(0,0,0,0.3);
      max-width: 600px;
      margin: 36px auto 0 auto;
      border-radius: 24px;
      padding: 32px 10px 24px 10px;
      box-shadow: 0 0 12px 2px rgba(0,0,0,0.20);
    }
    .title { font-size: 2.6rem; font-weight: bold; margin-bottom: 0.5rem; }
    .subtitle { margin-bottom: 1.1rem; }
    .status-row { margin: 0.8rem 0 1.3rem 0; }
    .box {
      display: inline-block;
      padding: 10px 16px;
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      font-size: 1.1rem;
      margin: 0.4rem 0.25rem;
      min-width: 100px;
    }
    .input-radio { margin: 0 8px; }
    .grow-pt { font-weight: bold; color: #ffec73; font-size: 1.4rem; }
    .btn {
      padding: 10px 22px;
      border: none;
      border-radius: 10px;
      background: #00aaff;
      color: #fff;
      font-size: 1.3rem;
      margin: 0 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-fert { background: #ccee56; color: #444; }
    .btn:disabled { background: #aaa; color: #fff; cursor: not-allowed; }
    .link-row { margin-top: 1.6rem; }
    .main-link {
      color: #ffe368;
      margin: 0 18px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.13rem;
    }
    .storage-box span { color: #ffe368; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="title">🥔 감자 농장</div>
    <div class="subtitle">
      농장이름: <span id="farm-name"></span><br/>
      <span id="server-status" style="color:#58ff83;">🔌 서버 연결 확인 중...</span>
    </div>
    <div style="margin-bottom:8px;">농장 관리</div>
    <label><input type="radio" name="crop" class="input-radio" value="potato" checked />씨감자</label>
    <label><input type="radio" name="crop" class="input-radio" value="barley" />씨보리</label>
    <div class="status-row">
      <button class="btn" id="water-btn">💧 물 주기</button>
      <button class="btn btn-fert" id="fertilizer-btn">🌾 거름 주기</button>
      <button class="btn" id="harvest-btn" disabled>🌽 수확하기</button>
    </div>
    <div>성장포인트: <span class="grow-pt" id="growth-point">0</span></div>
    <div class="box storage-box" style="margin-top:18px;line-height:2.1;">
      씨감자: <span id="seed-potato">-</span> &nbsp;
      씨보리: <span id="seed-barley">-</span> &nbsp;
      물: <span id="water">-</span> &nbsp;
      거름: <span id="fertilizer">-</span> &nbsp;
      ORCX: <span id="orcx">-</span>
      <br>
      감자: <span id="storage-gamja">-</span> &nbsp;
      보리: <span id="storage-bori">-</span>
    </div>
    <div class="link-row">
      <a href="gamja-main.html" class="main-link">감자 대시보드</a>
      <a href="gamja-shop.html" class="main-link">씨앗 상점</a>
      <a href="gamja-factory.html" class="main-link">가공식품공장</a>
    </div>
  </div>
  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    let user = null;
    let selectedCrop = 'potato'; // 기본값: 감자

    // 라디오 선택시 작물 변경
    document.querySelectorAll('input[name="crop"]').forEach(radio => {
      radio.addEventListener('change', function() {
        selectedCrop = this.value;
        loadUserStatus();
      });
    });

    // 농장이름
    function loadFarmName() {
      let name = localStorage.getItem("farmName") || "개똥농장";
      document.getElementById("farm-name").innerText = name;
    }

    // 유저 불러오기(카카오 로그인 정보)
    async function getUser() {
      let kakaoId = localStorage.getItem("kakaoId");
      if (!kakaoId) {
        document.getElementById("server-status").innerText = "❌ 로그인 필요";
        return null;
      }
      // /api/user/v2data에서 유저 정보 불러오기
      const res = await fetch(API_BASE + '/api/user/v2data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kakaoId })
      });
      const data = await res.json();
      if (!data || !data.kakaoId) {
        document.getElementById("server-status").innerText = "❌ 서버 연결 실패";
        return null;
      }
      document.getElementById("server-status").innerText = "✅ 서버 연결 성공";
      return data;
    }

    // 상태 불러오기(성장포인트, 자원, 보관함)
    async function loadUserStatus() {
      user = await getUser();
      if (!user) return;
      document.getElementById("seed-potato").innerText = user.seedPotato ?? 0;
      document.getElementById("seed-barley").innerText = user.seedBarley ?? 0;
      document.getElementById("water").innerText = user.water ?? 0;
      document.getElementById("fertilizer").innerText = user.fertilizer ?? 0;
      document.getElementById("orcx").innerText = user.orcx ?? 0;
      // 성장포인트 crop별 분기
      const growVal = (user.growth && user.growth[selectedCrop]) ? user.growth[selectedCrop] : 0;
      document.getElementById("growth-point").innerText = growVal;
      // 감자/보리 보관함
      document.getElementById("storage-gamja").innerText = (user.growth && user.growth.potato) ? user.growth.potato : 0;
      document.getElementById("storage-bori").innerText = (user.growth && user.growth.barley) ? user.growth.barley : 0;
      // 수확버튼 활성화: 성장포인트 5 이상
      document.getElementById("harvest-btn").disabled = !(growVal >= 5);
    }

    // 물주기/거름주기/수확 요청
    async function useResource(resource) {
      if (!user) return;
      const res = await fetch(API_BASE + '/api/factory/growth-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kakaoId: user.kakaoId, cropType: selectedCrop, resource })
      });
      await loadUserStatus();
    }

    document.getElementById("water-btn").onclick = () => useResource('water');
    document.getElementById("fertilizer-btn").onclick = () => useResource('fertilizer');

    // 수확 처리
    document.getElementById("harvest-btn").onclick = async function() {
      if (!user) return;
      const res = await fetch(API_BASE + '/api/factory/harvest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kakaoId: user.kakaoId, cropType: selectedCrop })
      });
      const result = await res.json();
      if (result && result.success) {
        alert("수확 성공! (" + result.harvested + "개)");
      }
      await loadUserStatus();
    };

    // 최초 실행
    loadFarmName();
    loadUserStatus();
  </script>
</body>
</html>
