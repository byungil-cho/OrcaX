<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 5%;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      display: inline-block;
      border-radius: 12px;
    }
    .section {
      background-color: #ffffff20;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .water { background-color: #4FC3F7; }
    .fertilizer { background-color: #AED581; }
    .harvest { background-color: #FF8A65; }
    .status { margin-top: 10px; font-weight: bold; color: #00FF00; }
    .nav a {
      display: inline-block;
      margin: 10px 15px;
      color: #FFD700;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>감자 농장</h1>
    <div id="userInfo">농장주: <span id="nickname">-</span><br>농장이름: <span id="farmName">-</span></div>
    <div class="status" id="serverStatus">⏳ 서버 연결 확인 중...</div>

    <div class="section">
      <h2>🌱 농장 관리</h2>
      <label><input type="radio" name="cropType" value="seedPotato" checked /> 씨감자</label>
      <label><input type="radio" name="cropType" value="seedBarley" /> 씨보리</label>
      <br>
      <button class="water" onclick="giveWater()" disabled>💧 물 주기</button>
      <button class="fertilizer" onclick="giveFertilizer()" disabled>🌿 거름 주기</button>
      <button class="harvest" id="harvestBtn" onclick="harvestCrop()" disabled>🥔 수확하기</button>
      <div>🌟 성장포인트: <span id="growth">0</span></div>
    </div>

    <div class="section">
      <h2>📦 농자재 보관함</h2>
      씨감자: <span id="seedPotato">0</span><br>
      씨보리: <span id="seedBarley">0</span><br>
      물: <span id="water">0</span><br>
      거름: <span id="fertilizer">0</span><br>
      ORCX: <span id="orcx">0</span>
    </div>

    <div class="section">
      <h2>🌾 작물 보관소</h2>
      감자: <span id="potato">0</span><br>
      보리: <span id="barley">0</span>
    </div>

    <div class="nav">
      <a href="gamja-farm.html">🏠 메인 농장</a>
      <a href="gamja-shop.html">🌱 씨앗 상점</a>
      <a href="gamja-result.html">⚙️ 작물 가공공장</a>
    </div>
  </div>

  <script>
    // ==== 핵심 세팅 ====
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";

    // ==== 로그인 체크 (카카오ID 필수) ====
    const kakaoId = localStorage.getItem("kakaoId");
    const nickname = localStorage.getItem("nickname") || "-";
    const farmName = localStorage.getItem("farmName") || "-";
    document.getElementById("nickname").textContent = nickname;
    document.getElementById("farmName").textContent = farmName;

    // 카카오ID 없으면 index9로 강제 이동
    if (!kakaoId) {
      alert("로그인이 필요합니다. 로그인 페이지로 이동합니다.");
      window.location.href = "index9.html";
    }

    // ==== 전역 상태 ====
    let userData = {
      seedPotato: 0,
      seedBarley: 0,
      water: 0,
      fertilizer: 0,
      orcx: 0,
      potato: 0,
      barley: 0
    };
    let growthPoint = 0;

    // ==== UI 갱신 함수 ====
    function updateDisplay() {
      document.getElementById("seedPotato").textContent = userData.seedPotato;
      document.getElementById("seedBarley").textContent = userData.seedBarley;
      document.getElementById("water").textContent = userData.water;
      document.getElementById("fertilizer").textContent = userData.fertilizer;
      document.getElementById("orcx").textContent = userData.orcx;
      document.getElementById("potato").textContent = userData.potato;
      document.getElementById("barley").textContent = userData.barley;
      document.getElementById("growth").textContent = growthPoint;

      // 버튼 활성/비활성 제어
      const selectedSeed = document.querySelector('input[name="cropType"]:checked').value;
      const hasSeed = userData[selectedSeed] > 0;
      document.querySelector(".water").disabled = !hasSeed || userData.water < 1;
      document.querySelector(".fertilizer").disabled = !hasSeed || userData.fertilizer < 1;
      document.getElementById("harvestBtn").disabled = !hasSeed || growthPoint < 5;
    }

    // ==== 서버에서 유저 상태 불러오기 ====
    async function fetchUserState() {
      try {
        const res = await fetch(`${API_BASE}/userdata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId })
        });
        const data = await res.json();
        const user = data.users?.[0];
        if (user) {
          userData.seedPotato = user.seedPotato || 0;
          userData.seedBarley = user.seedBarley || 0;
          userData.water = user.water || 0;
          userData.fertilizer = user.fertilizer || 0;
          userData.orcx = user.orcx || 0;
          userData.potato = user.potato || 0;
          userData.barley = user.barley || 0;
          document.getElementById("serverStatus").textContent = "✅ 서버 연결 성공";
        } else {
          document.getElementById("serverStatus").textContent = "❌ 유저 정보 없음";
        }
        updateDisplay();
      } catch (err) {
        console.error("서버 상태 로딩 실패", err);
        document.getElementById("serverStatus").textContent = "❌ 서버 연결 실패";
      }
    }

    // ==== 물 주기 ====
    async function giveWater() {
      const selectedSeed = document.querySelector('input[name="cropType"]:checked').value;
      if (userData[selectedSeed] < 1) return alert("씨앗이 없습니다!");
      if (userData.water < 1) return alert("물 부족!");
      // 서버 자원 사용 요청
      try {
        const patchRes = await fetch(`${API_BASE}/users/use-resource`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId, water: -1 })
        });
        if (patchRes.ok) {
          userData.water--;
          growthPoint++;
          updateDisplay();
        } else {
          alert("물 사용 실패");
        }
      } catch (e) {
        alert("서버 오류");
      }
    }

    // ==== 거름 주기 ====
    async function giveFertilizer() {
      const selectedSeed = document.querySelector('input[name="cropType"]:checked').value;
      if (userData[selectedSeed] < 1) return alert("씨앗이 없습니다!");
      if (userData.fertilizer < 1) return alert("거름 부족!");
      // 서버 자원 사용 요청
      try {
        const patchRes = await fetch(`${API_BASE}/users/use-resource`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId, fertilizer: -1 })
        });
        if (patchRes.ok) {
          userData.fertilizer--;
          growthPoint += 2;
          updateDisplay();
        } else {
          alert("거름 사용 실패");
        }
      } catch (e) {
        alert("서버 오류");
      }
    }

    // ==== 수확하기 ====
    async function harvestCrop() {
      if (growthPoint < 5) return;
      const cropType = document.querySelector('input[name="cropType"]:checked').value;
      const yieldOptions = [3, 5, 7];
      const reward = yieldOptions[Math.floor(Math.random() * yieldOptions.length)];

      if (userData[cropType] < 1) return alert("씨앗이 없습니다!");

      // 씨앗 사용 (서버 보관소 반환)
      try {
        // (1) 씨앗 서버에 반환
        await fetch(`${API_BASE}/storage/return-seed`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ seedType: cropType, count: 1 })
        });
        userData[cropType]--;

        // (2) 작물 보관소 증가 (서버 갱신)
        const cropName = cropType === "seedPotato" ? "potato" : "barley";
        userData[cropName] += reward;
        await fetch(`${API_BASE}/users/update-crops`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId, [cropName]: reward })
        });

        growthPoint = 0;
        updateDisplay();
        alert(`🎉 수확 성공! ${reward}개를 얻었습니다.`);
      } catch (e) {
        alert("수확 실패(서버 오류)");
      }
    }

    // ==== 작물 타입 변경 시 버튼 업데이트 ====
    document.querySelectorAll('input[name="cropType"]').forEach(radio => {
      radio.addEventListener("change", updateDisplay);
    });

    // ==== 페이지 로딩 시 ====
    fetchUserState();

  </script>
</body>
</html>
