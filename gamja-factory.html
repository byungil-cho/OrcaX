<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 감자농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: url("https://byungil-cho.github.io/OrcaX/farm-101.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    .main-area {
      max-width: 480px;
      margin: 3rem auto 1rem auto;
      background: rgba(50,30,10,0.16);
      border-radius: 30px;
      box-shadow: 0 2px 32px 0 #5a3715aa;
      padding: 2.2rem 1rem 2.4rem 1rem;
    }
    h1 { font-size: 2.2rem; margin-bottom: 1.1rem; color: #ffdf8d; text-shadow: 1px 2px 8px #502e01; }
    .nickname, .info-bar { font-size: 1.1rem; margin-bottom: 0.6rem; }
    .field-row { background: #fff9eec9; color: #442909; padding: 1.2rem 0.3rem; border-radius: 18px; margin: 1.4rem 0 1.4rem 0; box-shadow: 0 2px 10px #fff7; }
    .status { font-size: 1.14rem; margin: 0.7rem 0 1.2rem 0; font-weight: bold; }
    .grow-buttons button, #harvest-btn {
      margin: 0.12rem 0.5rem;
      padding: 0.83rem 1.32rem;
      font-size: 1.16rem;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      background: #fffcf6e9;
      box-shadow: 0 1px 8px 0 #bdbdbd45;
      font-weight: bold;
      transition: background 0.14s;
    }
    .grow-buttons button:active, #harvest-btn:active { background: #f9e7c7e8; }
    .storage-section {
      display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.2rem;
    }
    .storage-section div {
      background: #fffbeabd;
      border-radius: 12px;
      padding: 0.7rem 0.3rem;
      font-size: 1.12rem;
      color: #3b2206;
      font-weight: 500;
      box-shadow: 0 1px 7px #fff6;
    }
    .storage-section strong { color: #bb7e28; }
    .nav-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.9rem; margin-top: 1.3rem; }
    .nav-buttons a {
      background: #fff6;
      border-radius: 15px;
      padding: 0.7rem 1.2rem;
      text-decoration: none;
      color: #795548;
      font-weight: bold;
      font-size: 1.09rem;
      box-shadow: 0 1px 8px 0 #0001;
      margin-bottom: 0.5rem;
      transition: background 0.14s, color 0.15s;
    }
    .nav-buttons a:hover { background: #ffefc7; color: #ae7c26; }
    @media (max-width: 600px) {
      .main-area { max-width: 99vw; min-width: 0; padding: 1.2rem 0.3rem 1.4rem 0.3rem; }
      h1 { font-size: 1.29rem; }
    }
  </style>
</head>
<body>
  <div class="main-area">
    <h1>🥔 OrcaX 감자농장</h1>
    <div class="nickname">👤 농장주: <span id="nickname">-</span></div>
    <div class="info-bar">
      🌐 전원 상태: <span id="power-status">확인 중...</span> |
      💰 토큰: <span id="token">-</span>
    </div>
    <div class="field-row">
      🌱 <span id="crop-status">감자가 자라고 있습니다...</span>
      <div class="status">성장 포인트: <span id="growth">0</span></div>
      <div class="grow-buttons">
        <button onclick="growPotato('water')">💧 물 주기</button>
        <button onclick="growPotato('fertilizer')">💩 거름 주기</button>
      </div>
      <div id="harvest-container" style="margin-top: 1.5rem;"></div>
    </div>
    <div class="storage-section">
      <div>
        <strong>📦 자재 보관함</strong><br>
        물: <span id="water">0</span>, 거름: <span id="fertilizer">0</span>, 씨감자: <span id="seedPotato">0</span>
      </div>
      <div>
        <strong>🛒 감자 보관함</strong><br>
        감자: <span id="potato">0</span>
      </div>
    </div>
    <div class="nav-buttons">
      <a href="gamja-result.html">가공공장</a>
      <a href="gamja-shop.html">씨감자 상점</a>
      <a href="orcax-farm_000.html">메인페이지</a>
    </div>
  </div>
<script>
const API_URL = "https://climbing-wholly-grouper.jp.ngrok.io";
let kakaoId = localStorage.getItem("kakaoId") || "";
let nickname = localStorage.getItem("nickname") || "익명농부";

document.getElementById("nickname").textContent = nickname;
document.getElementById("power-status").textContent = "전기 공급중입니다.";

// 항상 서버(DB)에서만 값 불러오기!
async function fetchUserState() {
  if (!kakaoId) return;
  const res = await fetch(API_URL + "/api/userdata", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kakaoId })
  });
  const data = await res.json();
  if (data.success) {
    const user = data.user;
    document.getElementById("token").textContent = user.orcx ?? 0;
    document.getElementById("water").textContent = user.water ?? 0;
    document.getElementById("fertilizer").textContent = user.fertilizer ?? 0;
    document.getElementById("seedPotato").textContent = user.seedPotato ?? 0;
    document.getElementById("potato").textContent = user.potato ?? 0;
    document.getElementById("growth").textContent = user.growth?.potato ?? 0;

    if ((user.growth?.potato ?? 0) === 0) {
      document.getElementById("crop-status").textContent = "감자가 자라기 시작합니다...";
    } else if ((user.growth?.potato ?? 0) < 4) {
      document.getElementById("crop-status").textContent = "감자가 무럭무럭 자라는 중입니다...";
    } else {
      document.getElementById("crop-status").textContent = "감자 수확 준비 완료!";
    }
    showHarvestBtn(user.growth?.potato ?? 0);
  } else {
    alert("유저 정보를 불러오지 못했습니다!");
  }
}

// 성장: 서버에 저장(PATCH)
async function growPotato(action) {
  if (!kakaoId) return alert("로그인 정보 없음");
  const res = await fetch(API_URL + "/api/factory/grow", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kakaoId, cropType: "potato", action })
  });
  const data = await res.json();
  if (data.success) {
    fetchUserState(); // 서버값만 반영
  } else {
    alert(data.message || "성장 실패");
  }
}

// 수확: 서버에 저장(PATCH)
async function harvestPotato() {
  if (!kakaoId) return alert("로그인 정보 없음");
  const res = await fetch(API_URL + "/api/factory/harvest", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kakaoId, cropType: "potato" })
  });
  const data = await res.json();
  if (data.success) {
    alert(`🎉 감자 ${data.reward}개 수확!`);
    fetchUserState();
  } else {
    alert(data.message || "수확 실패");
  }
}

// 수확 버튼 표시
function showHarvestBtn(growth) {
  const c = document.getElementById("harvest-container");
  c.innerHTML = "";
  if (growth >= 4) {
    const btn = document.createElement("button");
    btn.textContent = "🥔 수확하기";
    btn.id = "harvest-btn";
    btn.onclick = harvestPotato;
    c.appendChild(btn);
  }
}

window.addEventListener("DOMContentLoaded", fetchUserState);
</script>
</body>
</html>
