<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자농장 공장</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      font-size: 1.2em;
    }
    .row span:first-child {
      width: 50%;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      font-size: 1em;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🌾 감자 가공 공장</h2>
    <div class="row"><span>🥔 감자:</span> <span id="potato">0</span></div>
    <div class="row"><span>💧 물:</span> <span id="water">0</span></div>
    <div class="row"><span>💩 거름:</span> <span id="fertilizer">0</span></div>
    <div class="row"><span>🌱 씨감자:</span> <span id="seed">0</span></div>
    <div class="row"><span>🔥 성장포인트:</span> <span id="grow">0</span></div>
    <div class="row"><span>🐳 ORCX:</span> <span id="token">0</span></div>
    
    <button id="plantBtn">🌱 씨감자 심기</button>
    <button id="waterBtn">💧 물 주기</button>
    <button id="fertilizeBtn">💩 거름 주기</button>
    <button id="harvestBtn">🥔 수확하기</button>
  </div>
  <audio id="gamjaSound" src="/OrcaX/gamja.wav"></audio>

  <script>
    const nickname = localStorage.getItem("nickname") || "";

    async function updateAction(action) {
      try {
        const res = await fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/farm/${action}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname })
        });
        const result = await res.json();
        if (result.success) {
          document.getElementById("potato").innerText = result.potatoCount ?? 0;
          document.getElementById("water").innerText = result.water ?? 0;
          document.getElementById("fertilizer").innerText = result.fertilizer ?? 0;
          document.getElementById("seed").innerText = result.seed ?? 0;
          document.getElementById("token").innerText = result.token ?? 0;
          document.getElementById("grow").innerText = result.growPoint ?? 0;
          if (action === 'harvest') {
            document.getElementById("gamjaSound").play();
            alert("수확 완료! 감자가 창고에 보관되었습니다.");
          }
        } else {
          alert("작업 실패: " + result.message);
        }
      } catch (err) {
        alert("서버 통신 오류: " + err);
      }
    }

    document.getElementById("plantBtn").onclick = () => updateAction("plant");
    document.getElementById("waterBtn").onclick = () => updateAction("water");
    document.getElementById("fertilizeBtn").onclick = () => updateAction("fertilize");
    document.getElementById("harvestBtn").onclick = () => updateAction("harvest");
  </script>
</body>
</html>
