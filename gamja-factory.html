
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장 가공 공장 입구</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #d9f7be, #fff);
      color: #333;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .container {
      max-width: 520px;
      margin: 60px auto;
      padding: 24px;
      background-color: #fffdf2;
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }
    .status p {
      font-size: 1.1rem;
      margin: 8px 0;
    }
    .actions button {
      display: block;
      width: 85%;
      margin: 12px auto;
      padding: 16px;
      font-size: 1.1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #91c788;
      color: white;
      transition: background 0.3s;
    }
    .actions button:hover {
      background-color: #6ba96a;
    }

    .bird {
      position: absolute;
      top: 10px;
      left: -50px;
      font-size: 2rem;
      animation: fly 10s linear infinite;
    }

    @keyframes fly {
      0% { left: -50px; top: 20px; }
      50% { left: 50%; top: 5px; transform: rotate(-10deg);}
      100% { left: 110%; top: 25px; }
    }
  </style>
</head>
<body>
  <div class="bird">🕊️</div>

  <div class="container">
    <div class="title">🥔 감자 가공 공장 입구</div>
    <div class="status">
      <p>👤 닉네임: <span id="nickname">-</span></p>
      <p>🏡 농장이름: <span id="farmName">-</span></p>
      <p>📦 감자 수량: <span id="potatoCount">불러오는 중...</span></p>
      <p>⚡ 전기 상태: <span id="serverStatus">확인 중...</span></p>
    </div>
    <div class="actions">
      <button onclick="goToFactory()">🏭 가공 공장으로 이동</button>
      <button onclick="goToStorage()">📦 보관소로 이동</button>
    </div>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    const farmName = localStorage.getItem("farmName");
    document.getElementById("nickname").textContent = nickname || "없음";
    document.getElementById("farmName").textContent = farmName || "미지정";

    fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata?nickname=" + nickname)
      .then(res => res.json())
      .then(data => {
        document.getElementById("potatoCount").textContent = data.potato + "개";
        document.getElementById("serverStatus").textContent = "전원 연결됨";
      })
      .catch(() => {
        document.getElementById("potatoCount").textContent = "불러오기 실패";
        document.getElementById("serverStatus").textContent = "전기 차단됨";
      });

    function goToFactory() {
      window.location.href = "gamja-result.html";
    }

    function goToStorage() {
      window.location.href = "storage.html";
    }
  </script>
</body>
</html>
