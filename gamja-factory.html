<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f9ec;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      color: #256029;
    }
    .status-box {
      background: #ffffff;
      border: 1px solid #c8e6c9;
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1rem;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .info {
      font-size: 1rem;
      margin: 0.3rem 0;
    }
    .btn {
      margin: 1rem 0.4rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background-color: #388e3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #2e7d32;
    }
  </style>
</head>
<body>

<div id="nicknameBox" style="text-align:right; font-weight:bold; margin: 0.5rem 1rem; color: #503020;"></div>
<div id="statusBox" style="text-align:center; margin-top:0.5rem; color: green;"></div>

  <h1>💧 OrcaX 감자 농장</h1>
  <div id="connection">🔌 서버 연결 상태 확인 중...</div>
  <div class="status-box">
    <div class="info">💧 물: <span id="water">-</span></div>
    <div class="info">🧴 거름: <span id="fertilizer">-</span></div>
    <div class="info">🥔 감자: <span id="potato">-</span></div>
    <div class="info">🪙 ORCX 토큰: <span id="token">-</span></div>
    <div class="info">🎯 농장명: <span id="farm">-</span></div>
  </div>
  <div>
    <button class="btn" onclick="giveWater()">💧 물 주기</button>
    <button class="btn" onclick="giveFertilizer()">🧴 거름 주기</button>
    <button class="btn" onclick="harvest()">🥔 감자 수확하기</button>
    <button class="btn" onclick="goToFactory()">🏭 감자 가공공장 이동</button>
  </div>

<script>
  const nickname = localStorage.getItem("nickname");
  const farmName = localStorage.getItem("farmName") || "이름없는농장";
  document.getElementById("farm").innerText = farmName;

  if (!nickname) {
    alert("❌ 카카오 로그인 후 이용 가능합니다.");
    window.location.href = "orcax-farm_000.html";
  }

  document.getElementById("nicknameBox").innerText = "👤 닉네임: " + nickname;

  let userData = {
    nickname,
    water: 0,
    fertilizer: 0,
    potatoCount: 0,
    token: 0
  };

  async function loadStatus() {
    const connection = document.getElementById("connection");
    try {
      const res = await fetch(`https://climbing-wholly-grouper.ngrok-free.app/api/userdata?nickname=${nickname}`);
      if (!res.ok) throw new Error("서버 응답 오류");
      const data = await res.json();
      const user = data.user;
      userData.water = user.water ?? 0;
      userData.fertilizer = user.fertilizer ?? 0;
      userData.potatoCount = user.potatoCount ?? 0;
      userData.token = user.token ?? 0;
      updateDisplay();
      connection.innerText = "✅ 서버 연결됨";
    } catch (err) {
      connection.innerText = `❌ 서버 오류: ${err.message}`;
    }
  }

  function updateDisplay() {
    document.getElementById("water").innerText = userData.water;
    document.getElementById("fertilizer").innerText = userData.fertilizer;
    document.getElementById("potato").innerText = userData.potatoCount;
    document.getElementById("token").innerText = userData.token;
  }

  function giveWater() {
    if (userData.water <= 0) return alert("💧 물이 부족합니다!");
    userData.water--;
    updateDisplay();
  }

  function giveFertilizer() {
    if (userData.fertilizer <= 0) return alert("🧴 거름이 부족합니다!");
    userData.fertilizer--;
    updateDisplay();
  }

  async function harvest() {
    userData.potatoCount++;
    alert("🥔 감자를 수확했습니다!");

    updateDisplay();

    try {
      await fetch("https://climbing-wholly-grouper.ngrok-free.app/api/update-user", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(userData)
      });
    } catch (err) {
      alert("❌ 수확한 감자 서버 저장 실패: " + err.message);
    }
  }

  function goToFactory() {
    window.location.href = "gamja-result.html";
  }

  loadStatus();
</script>

</body>
</html>
