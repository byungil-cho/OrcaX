<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #e8f5e9, #fff);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      position: relative;
    }
    .container {
      max-width: 600px;
      margin: 60px auto;
      background: #fffef3;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
      z-index: 1;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .resources, .actions, .status {
      margin-bottom: 20px;
    }
    .resources p, .status p {
      font-size: 1.1rem;
      margin: 6px 0;
    }
    .actions button {
      width: 80%;
      margin: 10px auto;
      padding: 14px;
      font-size: 1.1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #a5d6a7;
      color: white;
      transition: background 0.3s;
    }
    .actions button:hover {
      background-color: #81c784;
    }
    .bird {
      position: absolute;
      top: 20px;
      right: -60px;
      font-size: 2rem;
      animation: fly-left 12s linear infinite;
      z-index: 2;
    }
    @keyframes fly-left {
      0% { right: -60px; top: 20px; }
      50% { right: 50%; top: 10px; transform: rotate(10deg);}
      100% { right: 110%; top: 25px; }
    }
    .duck {
      position: absolute;
      top: 70%;
      left: -60px;
      font-size: 2rem;
      animation: swim-over 18s linear infinite;
      z-index: 2;
    }
    @keyframes swim-over {
      0% { left: -60px; top: 70%; }
      25% { left: 25%; top: 68%; }
      50% { left: 50%; top: 72%; }
      75% { left: 75%; top: 69%; }
      100% { left: 110%; top: 70%; }
    }
    .link {
      text-align: center;
      margin-bottom: 10px;
      font-size: 1rem;
    }
    .link a {
      color: #333;
      background: #ffd54f;
      padding: 6px 14px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="bird">🕊️</div>
  <div class="duck">🦆</div>

  <div class="link">
    <a href="gamja-farm.html">← 감자농장 입구로 돌아가기</a>
  </div>

  <div class="container">
    <h1>🥔 감자 농장</h1>

    <div class="status">
      <p>👤 닉네임: <span id="nickname">-</span></p>
      <p>🏡 농장이름: <span id="farmName">-</span></p>
      <p>⚡ 전기 상태: <span id="serverStatus">확인 중...</span></p>
    </div>

    <div class="resources">
      <p>🥔 씨감자: <span id="seed">-</span>개</p>
      <p>💧 물: <span id="water">-</span>개</p>
      <p>🌾 거름: <span id="fertilizer">-</span>개</p>
      <p>🍟 감자 수량: <span id="potato">-</span>개</p>
      <p>🌱 성장 포인트: <span id="growthPoint">-</span></p>
    </div>

    <div class="actions">
      <button onclick="plant()">🥔 씨감자 심기</button>
      <button onclick="water()">💧 물 주기</button>
      <button onclick="fertilize()">🌾 거름 주기</button>
      <button onclick="harvest()">🌾 수확하기</button>
      <button onclick="goToFactory()">🏭 가공공장 가기</button>
    </div>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    const farmName = localStorage.getItem("farmName");
    document.getElementById("nickname").textContent = nickname || "없음";
    document.getElementById("farmName").textContent = farmName || "미지정";

    function fetchData() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata?nickname=" + nickname)
        .then(res => res.json())
        .then(data => {
          document.getElementById("seed").textContent = data.potatoSeed;
          document.getElementById("water").textContent = data.water;
          document.getElementById("fertilizer").textContent = data.fertilizer;
          document.getElementById("potato").textContent = data.potato;
          document.getElementById("growthPoint").textContent = data.growPoint;
          document.getElementById("serverStatus").textContent = "전원 연결됨";
        })
        .catch(() => {
          document.getElementById("serverStatus").textContent = "전기 차단됨";
        });
    }

    function plant() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/farm/plant", {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname })
      }).then(fetchData);
    }

    function water() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/farm/water", {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname })
      }).then(fetchData);
    }

    function fertilize() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/farm/fertilize", {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname })
      }).then(fetchData);
    }

    function harvest() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/farm/harvest", {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname })
      }).then(fetchData);
    }

    function goToFactory() {
      window.location.href = "gamja-result.html";
    }

    fetchData();
  </script>
</body>
</html>
