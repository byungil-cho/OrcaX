<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
      background: url("https://byungil-cho.github.io/OrcaX/farm-101.png") no-repeat center center fixed;
      background-size: cover;
    }
    main {
      padding: 2rem 1rem;
    }
    .center-box {
      background: rgba(0,0,0,0.45);
      border-radius: 2rem;
      display: inline-block;
      padding: 2rem 3vw;
      margin-top: 4vw;
      min-width: 350px;
      box-shadow: 0 6px 32px 0 rgba(0,0,0,0.16);
    }
    h1 {
      font-size: 2.8rem;
      margin-bottom: 0.7rem;
    }
    .sub {
      font-size: 1.3rem;
      margin-bottom: 0.4rem;
    }
    .check {
      font-size: 1rem;
      margin-bottom: 0.8rem;
      color: #3cff69;
      font-weight: bold;
    }
    .fail { color: #f44; }
    .farm-type {
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
    }
    .radio-group { margin: 1rem 0; }
    .radio-group label { margin: 0 0.7rem; }
    button {
      font-size: 1.3rem;
      margin: 0.6rem 0.5rem 0 0.5rem;
      padding: 0.65rem 2.5rem;
      border-radius: 0.9rem;
      border: none;
      cursor: pointer;
      font-family: 'Do Hyeon', sans-serif;
      font-weight: bold;
    }
    .water { background: #21b0ff; color: #fff; }
    .fertilizer { background: #b6e43c; color: #333; }
    .harvest { background: #bdbdbd; color: #666; }
    .section-title {
      margin-top: 1.5rem;
      font-weight: bold;
      font-size: 1.22rem;
      letter-spacing: 0.03em;
    }
    .store {
      font-size: 1.08rem;
      margin: 1rem 0 0.7rem 0;
    }
    .yellow { color: #ffe160; }
    .menu-link {
      color: #ffe160;
      margin: 1.2rem 1.3rem 0 1.3rem;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.09rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="center-box">
      <h1>🥔 감자 농장</h1>
      <div class="sub" id="farmName"></div>
      <div class="check" id="serverCheck">🔄 서버 연결 확인 중...</div>
      <div class="farm-type">
        농장 관리
        <div class="radio-group">
          <label><input type="radio" name="seedType" value="potato" checked> 씨감자</label>
          <label><input type="radio" name="seedType" value="barley"> 씨보리</label>
        </div>
      </div>
      <div>
        <button class="water" id="waterBtn">💧 물 주기</button>
        <button class="fertilizer" id="fertilizerBtn">🌿 거름 주기</button>
        <button class="harvest" id="harvestBtn" disabled>🌾 수확하기</button>
      </div>
      <div style="margin:1rem 0 0.5rem 0;font-size:1.1rem;">
        성장포인트:<span id="growthPoint">0</span>
      </div>

      <div class="section-title">농자재 보관함</div>
      <div class="store" id="myInventory">로딩 중...</div>
      <div class="section-title yellow">감자: <span id="potatoBox">0</span> &nbsp; 보리: <span id="barleyBox">0</span></div>

      <div style="margin-top:1.3rem;">
        <a href="gamja-farm.html" class="menu-link">감자 대시보드</a>
        <a href="gamja-shop.html" class="menu-link">씨앗 상점</a>
        <a href="gamja-result.html" class="menu-link">가공식품공장</a>
      </div>
    </div>
  </main>

  <script>
    // 서버 기본 URL
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";

    let user = null;
    let seedType = "potato"; // 기본 감자

    function setFarmName() {
      const farmName = localStorage.getItem("farmName") || "개똥농장";
      document.getElementById('farmName').innerText = `농장이름: ${farmName}`;
    }

    function setServerStatus(ok) {
      const el = document.getElementById('serverCheck');
      if(ok) {
        el.textContent = "✅ 서버 연결 성공";
        el.classList.remove("fail");
      } else {
        el.textContent = "❌ 서버 연결 실패";
        el.classList.add("fail");
      }
    }

    function renderInventory(user) {
      if (!user) return;
      const inv = user;
      // 씨감자, 씨보리, 물, 거름, 토큰
      const inventoryHTML = `
        씨감자: <b>${inv.seedPotato||0}</b>
        &nbsp; 씨보리: <b>${inv.seedBarley||0}</b>
        &nbsp; 물: <b>${inv.water||0}</b>
        &nbsp; 거름: <b>${inv.fertilizer||0}</b>
        &nbsp; ORCX: <b>${inv.orcx||0}</b>
      `;
      document.getElementById("myInventory").innerHTML = inventoryHTML;

      // 수확 감자, 보리 (growth)
      document.getElementById("potatoBox").innerText = (user.growth?.potato ?? 0);
      document.getElementById("barleyBox").innerText = (user.growth?.barley ?? 0);
    }

    // 성장포인트 표시
    function renderGrowthPoint(val) {
      document.getElementById("growthPoint").innerText = val ?? 0;
    }

    // 라디오 선택 변경
    document.querySelectorAll('input[name="seedType"]').forEach(el => {
      el.addEventListener('change', (e) => {
        seedType = e.target.value;
        // 필요 시 감자/보리별 로직 분기 가능
      });
    });

    // 데이터 불러오기
    async function fetchUser() {
      try {
        const kakaoId = localStorage.getItem("kakaoId");
        if (!kakaoId) throw new Error("카카오ID 없음");
        const res = await fetch(`${API_BASE}/user/v2data`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ kakaoId })
        });
        if (!res.ok) throw new Error("서버 연결 실패");
        const data = await res.json();
        user = data.user;
        setServerStatus(true);
        renderInventory(user);
        renderGrowthPoint(user.growthPoint || 0);
      } catch(e) {
        setServerStatus(false);
        document.getElementById("myInventory").innerHTML = "연결 실패";
      }
    }

    // 버튼 기능
    document.getElementById("waterBtn").onclick = async () => {
      if (!user) return;
      await useResource("water");
    };
    document.getElementById("fertilizerBtn").onclick = async () => {
      if (!user) return;
      await useResource("fertilizer");
    };

    // 자원 사용 (물/거름)
    async function useResource(type) {
      try {
        const res = await fetch(`${API_BASE}/factory/use-resource`, {
          method: "PATCH",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            kakaoId: localStorage.getItem("kakaoId"),
            seedType,
            resourceType: type
          })
        });
        if (!res.ok) throw new Error("실패");
        await fetchUser(); // 다시 불러오기
      } catch {
        alert(type + " 사용 실패!");
      }
    }

    // 페이지 최초 진입 시
    setFarmName();
    fetchUser();
  </script>
</body>
</html>
