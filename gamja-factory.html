<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌾 감자 제국 농장</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('https://i.imgur.com/6Zz2e6n.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fffdd0;
      margin: 0;
      padding: 0;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.6);
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #f6e58d;
      font-size: 2rem;
    }

    .resource {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed #ccc;
    }

    .label {
      font-weight: bold;
      color: #dff9fb;
    }

    .value {
      color: #f9ca24;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      font-size: 1.1rem;
      background: #44bd32;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #4cd137;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🥔 감자 제국 농장</h1>

    <div class="resource"><span class="label">씨감자:</span> <span class="value" id="seedPotato">0</span></div>
    <div class="resource"><span class="label">씨보리:</span> <span class="value" id="seedBarley">0</span></div>
    <div class="resource"><span class="label">물:</span> <span class="value" id="water">0</span></div>
    <div class="resource"><span class="label">거름:</span> <span class="value" id="fertilizer">0</span></div>
    <div class="resource"><span class="label">감자:</span> <span class="value" id="potato">0</span></div>
    <div class="resource"><span class="label">보리:</span> <span class="value" id="barley">0</span></div>
    <div class="resource"><span class="label">🍀 ORCX 토큰:</span> <span class="value" id="orcx">0</span></div>

    <button onclick="fetchUserData()">🔄 데이터 다시 불러오기</button>
  </div>

  <script>
    async function fetchUserData() {
      const kakaoId = localStorage.getItem("kakaoId") || "guestUser";

      try {
        const res = await fetch("/api/userdata", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId }),
        });

        if (!res.ok) throw new Error("서버 응답 실패");

        const data = await res.json();

        if (data.seedPotato !== undefined) document.getElementById("seedPotato").textContent = data.seedPotato;
        if (data.seedBarley !== undefined) document.getElementById("seedBarley").textContent = data.seedBarley;
        if (data.water !== undefined) document.getElementById("water").textContent = data.water;
        if (data.fertilizer !== undefined) document.getElementById("fertilizer").textContent = data.fertilizer;
        if (data.potato !== undefined) document.getElementById("potato").textContent = data.potato;
        if (data.barley !== undefined) document.getElementById("barley").textContent = data.barley;
        if (data.orcx !== undefined) document.getElementById("orcx").textContent = data.orcx;

      } catch (err) {
        alert("감자 밭 서버에서 엎어진 듯? 다시 시도하라 이놈아.");
        console.error(err);
      }
    }

    window.onload = fetchUserData;
  </script>
</body>
</html>
