<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f0f8ff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .status, .power-status {
      font-size: 1.1rem;
      margin: 10px 0;
    }
    .assets {
      background: #fffbe6;
      border: 2px solid #ccc;
      padding: 16px;
      margin: 16px auto;
      max-width: 360px;
      border-radius: 12px;
      transition: transform 0.3s ease;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .assets:hover {
      transform: scale(1.05);
    }
    .asset-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 1.2rem;
    }
    .farm-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 360px;
      margin: 20px auto;
    }
    .farm-buttons button {
      padding: 14px;
      font-size: 1.1rem;
      border: none;
      border-radius: 10px;
      background: #90ee90;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .farm-buttons button:hover {
      background: #76c776;
    }
    .nav-links a {
      display: inline-block;
      margin: 10px;
      padding: 8px 12px;
      background: #f5deb3;
      border-radius: 8px;
      text-decoration: none;
      color: #000;
      font-weight: bold;
    }
    .bug {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 2rem;
      animation: fly 5s infinite linear;
    }
    @keyframes fly {
      0% { right: -50px; top: 30px; }
      50% { right: 50%; top: 60px; }
      100% { right: 100%; top: 30px; }
    }
  </style>
</head>
<body>
  <div class="bug">🪿</div>
  <h2 id="nicknameHeader">🐳 감자 농장</h2>
  <div class="status" id="status">서버 연결 확인 중...</div>
  <div class="power-status" id="power">🔌 전기 상태 확인 중...</div>
  <div class="status" id="farmStatus">🌾 농장명 불러오는 중...</div>
  <div class="assets" id="assetsBox">
    <div class="asset-row">🥔 감자 <span id="potato">-</span></div>
    <div class="asset-row">💧 물 <span id="water">-</span></div>
    <div class="asset-row">🧪 거름 <span id="fertilizer">-</span></div>
    <div class="asset-row">🌱 씨감자 <span id="seed">-</span></div>
    <div class="asset-row">🐳 ORCX <span id="token">-</span></div>
    <div class="asset-row">🌿 성장 포인트 <span id="grow">-</span></div>
    <div class="asset-row">🍟 감자칩 <span id="chips">-</span></div>
  </div>
  <div class="farm-buttons"> ... 버튼 유지 ... </div>
  <div class="nav-links"> ... 링크 유지 ... </div>
  <input type="file" id="audioUpload" accept="audio/*" style="display:none">
  <audio id="gamjaSound" src="https://byungil-cho.github.io/OrcaX/sound-gamja.mp3" style="display:none"></audio>
  <script>
    window.onload = async function() {
      const nickname = localStorage.getItem("nickname");
      const farmName = localStorage.getItem("farmName");

      if (!nickname || nickname.trim() === "") {
        alert("닉네임 정보가 없습니다. 처음 화면으로 이동합니다.");
        location.href = "orcax-farm_000.html";
        return;
      }

      const header = document.getElementById("nicknameHeader");
      if (header) header.innerHTML += ` <span style="font-size: 1rem;">(${nickname})님 환영합니다!`;

      const farmStatus = document.getElementById("farmStatus");
      if (farmName && farmStatus) farmStatus.innerText = `🌾 현재 농장명: ${farmName}`;

      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/status");
        const data = await res.json();
        if (data.success || data.status === "ok") {
          document.getElementById("status").innerText = "🟢 서버 연결됨";
          document.getElementById("power").innerText = "⚡ 전기 공급 중!";
        } else {
          document.getElementById("status").innerText = "🔴 서버 연결 실패";
          document.getElementById("power").innerText = "❌ 전기 공급 안됨";
        }
      } catch (e) {
        document.getElementById("status").innerText = "🔴 서버 오류";
        document.getElementById("power").innerText = "❌ 전기 공급 안됨";
      }

      try {
        const res = await fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata?nickname=${nickname}`);
        const user = await res.json();
        if (user && user.nickname) {
          document.getElementById("potato").innerText = user.potatoCount ?? 0;
          document.getElementById("water").innerText = user.water ?? 0;
          document.getElementById("fertilizer").innerText = user.fertilizer ?? 0;
          document.getElementById("seed").innerText = user.seed ?? 0;
          document.getElementById("token").innerText = user.token ?? 0;
          document.getElementById("grow").innerText = user.growPoint ?? 0;
          document.getElementById("chips").innerText = user.product_chips ?? 0;
        }
      } catch (e) {
        console.error("자산 불러오기 실패", e);
      }
    };
  </script>
</body>
</html>
