<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: url('https://byungil-cho.github.io/OrcaX/farm-201.png') no-repeat center center fixed;
      background-size: cover;
      font-family: "Pretendard", sans-serif;
      color: white;
      overflow-y: auto;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      margin-top: 60px;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 10px;
    }
    .farm-name {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    .status {
      color: #00ff00;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .actions button {
      margin: 10px;
      padding: 15px 25px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .harvest-btn { background: #91c788; }
    .water-btn { background: #8ecae6; }
    .fertilizer-btn { background: #f4a261; }
    .storage {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      margin-top: 30px;
    }
    .storage-title {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span id="nicknameDisplay"></span>님의 감자 농장</h1>
    <div class="farm-name">농장이름: <span id="farmName"></span></div>
    <div class="status" id="serverStatus">✅ 서버 전원 ON</div>
    <div class="actions">
      <button class="harvest-btn" onclick="harvest()">🥔 수확하기</button>
      <button class="water-btn" onclick="grow('water')">💧 물 주기</button>
      <button class="fertilizer-btn" onclick="grow('fertilizer')">🌿 거름 주기</button>
    </div>
    <div>성장 포인트: <span id="growthPoint">0</span></div>

    <div class="storage">
      <div class="storage-title">자재 보관함</div>
      씨감자: <span id="seedPotato">0</span> | 씨보리: <span id="seedBarley">0</span><br>
      물: <span id="water">0</span> | 거름: <span id="fertilizer">0</span><br>
      ORCX: <span id="orcx">0</span>
    </div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname") || "";

    async function fetchUserData() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata?nickname=${nickname}`);
        const data = await res.json();
        if (data.success && data.users && data.users.length > 0) {
          const user = data.users[0];
          document.getElementById("seedPotato").textContent = user.seedPotato || 0;
          document.getElementById("seedBarley").textContent = user.seedBarley || 0;
          document.getElementById("water").textContent = user.water || 0;
          document.getElementById("fertilizer").textContent = user.fertilizer || 0;
          document.getElementById("orcx").textContent = user.orcx || 0;
          document.getElementById("growthPoint").textContent = user.growthPoint || 0;
          document.getElementById("farmName").textContent = user.farmName || "이름 없음";
          document.getElementById("nicknameDisplay").textContent = user.nickname || nickname;
        }
      } catch (err) {
        alert("사용자 정보를 불러오는 중 오류 발생");
      }
    }

    async function grow(type) {
      try {
        const res = await fetch(`${API_BASE}/api/farm/grow`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, cropType: type })
        });
        const data = await res.json();
        if (data.success) {
          await fetchUserData();
        } else {
          alert(`${type} 주기 실패: ${data.error}`);
        }
      } catch (err) {
        alert(`${type} 주기 요청 실패`);
      }
    }

    async function harvest() {
      try {
        const res = await fetch(`${API_BASE}/api/farm/harvest`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, amount: 1 })
        });
        const data = await res.json();
        if (data.success) {
          alert("수확 완료: " + data.harvested);
          await fetchUserData();
        } else {
          alert("수확 실패: " + data.error);
        }
      } catch (err) {
        alert("수확 요청 실패");
      }
    }

    fetchUserData();
  </script>
</body>
</html>
