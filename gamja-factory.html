<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감자 농사 시작</title>
  <style>
    body {
      background-color: #f6ffe6;
      font-family: sans-serif;
      text-align: center;
      padding: 1rem;
    }
    h1 {
      color: #6b8e23;
      font-size: 1.5rem;
    }
    button {
      padding: 0.8rem 1.2rem;
      margin: 0.5rem;
      background-color: #ffaa00;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff8800;
    }
    #potatoImage {
      margin-top: 1rem;
    }
    #potatoImage img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      animation: float 2s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    #yieldResult, #timeStatus, #powerStatus {
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    #powerStatus {
      color: green;
    }
  </style>
</head>
<body>
  <h1>🥔 감자가 자라고 있습니다</h1>
  <p>💧 물 주기: <span id="waterCount">0</span> / 🧪 거름 주기: <span id="fertilizerCount">0</span></p>
  <button onclick="giveWater()">💧 물 주기</button>
  <button onclick="giveFertilizer()">🧪 거름 주기</button>
  <br>
  <button onclick="harvest()">🌾 수확하기</button>
  <div id="potatoImage">
    <img src="https://byungil-cho.github.io/OrcaX/farm-101_01.png" alt="감자">
  </div>
  <p id="yieldResult"></p>
  <p id="timeStatus"></p>
  <p id="powerStatus">🔌 전기 상태 확인 중...</p>
  <button onclick="goToFactory()">🏭 가공 공장으로 가기</button>

  <script>
    let water = 0;
    let fertilizer = 0;
    let yieldCount = 0;
    const harvestCooldown = 2 * 60 * 60 * 1000;
    const lastTime = localStorage.getItem('lastHarvest') || 0;

    function updateTimeStatus() {
      const now = Date.now();
      const elapsed = now - lastTime;
      const remaining = harvestCooldown - elapsed;
      const el = document.getElementById('timeStatus');
      if (remaining > 0) {
        const mins = Math.ceil(remaining / 60000);
        el.textContent = `⏳ 다음 무료 농사까지 ${mins}분 남음`;
      } else {
        el.textContent = `✅ 무료 농사 가능!`;
      }
    }

    function giveWater() {
      water++;
      document.getElementById('waterCount').textContent = water;
    }

    function giveFertilizer() {
      fertilizer++;
      document.getElementById('fertilizerCount').textContent = fertilizer;
    }

    function harvest() {
      const now = Date.now();
      const last = parseInt(localStorage.getItem('lastHarvest') || 0);
      if (now - last < harvestCooldown) {
        alert('🚫 무료 수확은 2시간 후에 가능합니다!');
        return;
      }
      if (water >= 2 && fertilizer >= 1) {
        yieldCount = 5 + Math.floor(Math.random() * 6);
        document.getElementById('yieldResult').textContent = `🎉 감자 ${yieldCount}개 수확 성공!`;
        localStorage.setItem('harvestInfo', JSON.stringify({ yield: yieldCount }));
        localStorage.setItem('lastHarvest', now);
      } else {
        alert('⚠️ 물과 거름을 충분히 주세요!');
      }
    }

    function goToFactory() {
      const harvestInfo = localStorage.getItem('harvestInfo');
      if (!harvestInfo) {
        alert('먼저 감자를 수확하세요!');
        return;
      }
      window.location.href = 'gamja-result.html';
    }

    function checkPowerStatus() {
      fetch('/api/power/status')
        .then(res => res.json())
        .then(data => {
          const el = document.getElementById('powerStatus');
          if (data && data.connected) {
            el.textContent = '🔌 전기 연결됨';
            el.style.color = 'green';
          } else {
            el.textContent = '⚠️ 전기 연결 안됨';
            el.style.color = 'red';
          }
        })
        .catch(() => {
          const el = document.getElementById('powerStatus');
          el.textContent = '⚠️ 전기 상태 확인 실패';
          el.style.color = 'gray';
        });
    }

    updateTimeStatus();
    checkPowerStatus();
    setInterval(updateTimeStatus, 60000);
  </script>
</body>
</html>
