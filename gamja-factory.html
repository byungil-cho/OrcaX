<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🥔 감자 농장 - Potato Farm</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Do Hyeon', sans-serif;
      height: 100%;
    }
    body {
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center top fixed;
      background-size: cover;
      overflow: auto;
    }
    .scroll-area {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 3rem;
      box-sizing: border-box;
    }
    header {
      padding: 1rem;
      font-size: 2rem;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      text-align: center;
    }
    .nickname, .info-bar {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      text-align: center;
    }
    .info-bar { font-size: 0.95rem; }
    .potato-field, .storage-section, .product-section, .nav-buttons {
      margin: 1rem;
      padding: 1rem;
      background: rgba(255,255,255,0.8);
      border-radius: 1rem;
    }
    .potato-btns button {
      margin: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.75rem;
      background: #a5d6a7;
      cursor: pointer;
    }
    .storage-section ul, .product-section ul {
      list-style: none;
      padding: 0;
    }
    .storage-section li, .product-section li {
      margin-bottom: 0.5rem;
      font-weight: bold;
    }
    .nav-buttons a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #4caf50;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
    }
    .server-status {
      text-align: center;
      margin-top: 1rem;
      font-weight: bold;
      color: #fff700;
    }
  </style>
</head>
<body>
  <div class="scroll-area">
    <header>감자 농장</header>
    <div class="nickname">농장주: <span id="nickname">로딩 중...</span></div>
    <div class="info-bar">농장이름: <span id="farmName">로딩 중...</span></div>
    <div class="server-status" id="serverStatus">🔌 서버 상황 확인 중...</div>

    <div class="potato-field">
      <h2>🌾 농사 목록</h2>
      <div class="potato-btns">
        <button onclick="startFarming()">🥔 수활하기</button>
        <button onclick="applyWater()">💧 물 주기</button>
        <button onclick="applyFertilizer()">🌿 거름 주기</button>
      </div>
    </div>

    <div class="storage-section">
      <h2>📦 자재 보관함</h2>
      <ul id="storage-list"></ul>
    </div>

    <div class="product-section">
      <h2>🍟 농산물 보관함</h2>
      <ul id="product-list"></ul>
    </div>

    <div class="nav-buttons">
      <a href="gamja-result.html">감자 가공공장</a>
      <a href="gamja-main.html">복기</a>
    </div>
  </div>

  <script>
    // (기존 스크립트는 유지)
  </script>
</body>
</html>
