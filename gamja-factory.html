<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #f0f9eb;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      color: #2c5e1a;
    }
    #statusBox {
      margin-top: 1rem;
      font-weight: bold;
      color: #c0392b;
    }
    .resources {
      background: #ffffff;
      border: 1px solid #ccc;
      padding: 1rem;
      margin: 2rem auto;
      border-radius: 10px;
      max-width: 400px;
    }
    .resources div {
      margin: 0.3rem 0;
      font-size: 1.1rem;
    }
    button {
      padding: 0.6rem 1.5rem;
      margin: 0.5rem;
      border: none;
      border-radius: 8px;
      background-color: #3b8c3b;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #2c6b2c;
    }
  </style>
</head>
<body>
  <h1>💧 OrcaX 감자 농장</h1>
  <div id="statusBox">🔌 서버 전원 상태 확인 중...</div>
  <div class="resources">
    <div>💧 물: <span id="water">-</span></div>
    <div>🧪 거름: <span id="fertilizer">-</span></div>
    <div>🥔 감자: <span id="potato">-</span></div>
    <div>🪙 ORCX 토큰: <span id="orcx">-</span></div>
    <div>🧭 농장명: <span id="farmName">-</span></div>
  </div>
  <button>💧 물 주기</button>
  <button>🧪 거름 주기</button>
  <button>🥔 감자 수확하기</button>
  <button>🏭 감자 가공공장 이동</button>

  <script>
    const nickname = localStorage.getItem("nickname") || "방문자";
    const farmName = localStorage.getItem("farmName") || "이름없는농장";
    document.getElementById("farmName").textContent = farmName;

    const statusBox = document.getElementById("statusBox");

    function fetchFarmData() {
      fetch(`https://climbing-wholly-grouper.ngrok-free.app/api/userdata?nickname=${encodeURIComponent(nickname)}`)
        .then(res => {
          if (!res.ok) throw new Error("서버 응답 없음");
          statusBox.textContent = "✅ 전기 공급 중 (서버 연결됨)";
          statusBox.style.color = "green";
          return res.json();
        })
        .then(data => {
          document.getElementById("water").textContent = data.water || 0;
          document.getElementById("fertilizer").textContent = data.fertilizer || 0;
          document.getElementById("potato").textContent = data.potato || 0;
          document.getElementById("orcx").textContent = data.tokens || 0;
        })
        .catch(() => {
          statusBox.textContent = "⚠️ 전기 공급이 끊겼습니다 (서버 응답 없음)";
          statusBox.style.color = "red";
        });
    }

    fetchFarmData();
  </script>
</body>
</html>
