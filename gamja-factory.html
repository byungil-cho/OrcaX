<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f1f9e8;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #305030;
      margin: 1rem 0 0.5rem;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem 0.5rem 0;
      color: #305030;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
    }
    .status-box {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 1rem;
      margin-top: 2rem;
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    .status-item {
      margin: 0.5rem 0;
    }
    .action-buttons button {
      margin: 0.3rem;
      background: #507040;
    }
    button {
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      background: #85b765;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #739c54;
    }
    @media (max-width: 480px) {
      #nicknameBox {
        font-size: 0.9rem;
        margin-right: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="nicknameBox"></div>
  <h1>🐳 OrcaX 감자 농장</h1>
  <div id="container">
    <div class="status-box">
      <div class="status-item">💧 물: <span id="waterCount">0</span></div>
      <div class="status-item">🧪 거름: <span id="fertilizerCount">0</span></div>
      <div class="status-item">🥔 감자: <span id="potatoCount">0</span></div>
      <div class="status-item">🪙 ORCX 토큰: <span id="orcxCount">0</span></div>
      <div class="status-item">🏷 농장명: <span id="farmNameDisplay">불러오는 중...</span></div>
      <div class="action-buttons">
        <button onclick="useWater()">💧 물 주기</button>
        <button onclick="useFertilizer()">🧪 거름 주기</button>
        <button onclick="harvestPotato()">🥔 감자 수확하기</button>
        <button onclick="goToFactory()">🏭 감자 가공공장 이동</button>
      </div>
    </div>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname") || "방문자";
    const farmName = localStorage.getItem("farmName") || "미등록 농장";
    document.getElementById("nicknameBox").textContent = `👤 ${nickname} 님`;
    document.getElementById("farmNameDisplay").textContent = farmName;

    let userData = {
      nickname,
      farmName,
      water: 0,
      fertilizer: 0,
      potato: 0,
      orcx: 0
    };

    function fetchUserData() {
      fetch(`https://climbing-wholly-grouper.ngrok-free.app/api/userdata?nickname=${encodeURIComponent(nickname)}`)
        .then(res => res.json())
        .then(data => {
          if (data && Object.keys(data).length > 0) {
            userData = data;
          } else {
            userData = {
              nickname,
              farmName,
              water: 10,
              fertilizer: 10,
              potato: 0,
              orcx: 5
            };
            saveUserData();
          }
          updateDisplay();
        })
        .catch(err => console.error("불러오기 실패", err));
    }

    function saveUserData() {
      fetch("https://climbing-wholly-grouper.ngrok-free.app/api/userdata", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(userData)
      }).catch(err => console.error("저장 실패", err));
    }

    function updateDisplay() {
      document.getElementById("waterCount").textContent = userData.water;
      document.getElementById("fertilizerCount").textContent = userData.fertilizer;
      document.getElementById("potatoCount").textContent = userData.potato;
      document.getElementById("orcxCount").textContent = userData.orcx;
    }

    let tempWater = false;
    let tempFertilizer = false;

    function useWater() {
      if (userData.water > 0) {
        userData.water--;
        tempWater = true;
        alert("물 1개 사용했습니다");
        updateDisplay();
        saveUserData();
      } else {
        alert("물이 부족합니다");
      }
    }

    function useFertilizer() {
      if (userData.fertilizer > 0) {
        userData.fertilizer--;
        tempFertilizer = true;
        alert("거름 1개 사용했습니다");
        updateDisplay();
        saveUserData();
      } else {
        alert("거름이 부족합니다");
      }
    }

    function harvestPotato() {
      if (tempWater && tempFertilizer) {
        userData.potato++;
        tempWater = false;
        tempFertilizer = false;
        alert("감자 1개 수확 완료!");
        updateDisplay();
        saveUserData();
      } else {
        alert("물을 주고 거름을 준 후 수확하세요");
      }
    }

    function goToFactory() {
      localStorage.setItem("nickname", userData.nickname);
      localStorage.setItem("farmName", userData.farmName);
      localStorage.setItem("potato", userData.potato);
      window.location.href = "gamja-result.html";
    }

    fetchUserData();
  </script>
</body>
</html>
