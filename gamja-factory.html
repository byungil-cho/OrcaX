<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>🥔 감자 농장</title>
<style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center top fixed;
      background-size: cover;
      color: #3e2723;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .scroll-area {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 1rem 0;
    }
    header {
      padding: 1rem;
      font-size: 2rem;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      text-align: center;
    }
    .nickname, .info-bar {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      text-align: center;
    }
    .info-bar { font-size: 0.95rem; }
    .potato-field, .storage-section, .nav-buttons {
      margin-top: 2rem;
      text-align: center;
    }
    .status {
      font-size: 1.2rem;
      margin-top: 1rem;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }
    .grow-buttons {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .grow-buttons button, #harvest-btn {
      padding: 0.75rem 1.25rem;
      background-color: rgba(255,255,255,0.8);
      color: #1b5e20;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }
    .storage-section > div {
      margin: 0.5rem auto;
      padding: 0.75rem;
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      width: 80%;
      color: #3e2723;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .nav-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .nav-buttons a {
      background-color: rgba(255, 255, 255, 0.85);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      text-decoration: none;
      color: #3e2723;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div class="scroll-area">
<header>🥔 감자 농장 - Potato Farm</header>
<div class="nickname">👤 농장주: <span id="nickname">-</span></div>
<div class="info-bar">
      🌐 전원 상태: <span id="power-status">확인 중...</span> |
      🏧 농장이름: <span id="farm-name">-</span> |
      🐋 토큰: <span id="token">-</span><br/>
      🧺 씨감자: <span id="seed">-</span> | 💧 물: <span id="water">-</span> | 🌾 거름: <span id="fertilizer">-</span>
</div>
<div class="potato-field">
      🌱 감자가 자라고 있습니다...
      <div class="status">성장 포인트: <span id="growth">0</span></div>
<div class="grow-buttons">
<button onclick="applyWater()">💧 물 주기</button>
<button onclick="applyFertilizer()">💩 거름 주기</button>
</div>
<div id="harvest-container" style="margin-top: 1.5rem;"></div>
</div>
<div class="storage-section">
<div><strong>🧺 자재 보관소</strong><br/><div id="materials">자재 연동 예정</div></div>
<div><strong>📦 제품 창고</strong><br/><div id="products">제품 연동 예정</div></div>
</div>
<div class="nav-buttons">
<a href="gamja-result.html">감자 보리 가공공장</a>
<a href="gamja-shop.html">씨감자 씨보리 구매</a>
<a href="orcax-farm_000.html">메인 페이지</a>
</div>
</div>
<script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname") || "농부X";
    const farmName = localStorage.getItem("farmName") || "감자농장";

    let seedCount = 0;
    let water = 0;
    let fertilizer = 0;
    let growth = 0;

    document.getElementById("nickname").textContent = nickname;
    document.getElementById("farm-name").textContent = farmName;
    document.getElementById("power-status").textContent = "전기 공급중입니다.";

    async function fetchUserData() {
      try {
        const res = await fetch(`${API_BASE}/api/user/${encodeURIComponent(nickname)}`);
        const user = await res.json();
        document.getElementById("token").textContent = user.token || 0;
        document.getElementById("seed").textContent = user.seed_potato || 0;
        document.getElementById("water").textContent = user.water || 0;
        document.getElementById("fertilizer").textContent = user.fertilizer || 0;
        document.getElementById("growth").textContent = user.growth || 0;

        seedCount = user.seed_potato;
        water = user.water;
        fertilizer = user.fertilizer;
        growth = user.growth || 0;

        const materialItems = (user["목록"] || [])
          .filter(item => item && item.name && item.count !== undefined && item.name.includes("감자"))
          .map(item => `${item.name}: ${item.count}`)
          .join("<br>");
        document.getElementById("materials").innerHTML = materialItems || "보관된 감자 없음";

        const productItems = (user.exchangeLogs || [])
          .map(item => typeof item === "object" && item.name ? `${item.name}: ${item.count || 1}` : (typeof item === "string" ? item : ""))
          .join("<br>");
        document.getElementById("products").innerHTML = productItems || "보관된 제품 없음";

        checkHarvestReady();
      } catch {
        alert("❌ 유저 정보 로딩 실패");
      }
    }

    async function updateServerResources() {
      try {
        await fetch(`${API_BASE}/api/user/${encodeURIComponent(nickname)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            seed_potato: seedCount,
            water,
            fertilizer,
            growth
          })
        });
      } catch {
        alert("❌ 서버에 자원 업데이트 실패");
      }
    }

    function applyWater() {
      if (seedCount < 1) return alert("씨감자가 없으면 농사가 불가능합니다.");
      if (water < 1) return alert("물이 부족합니다.");
      growth += 1;
      water -= 1;
      updateStatus();
      updateServerResources();
    }

    function applyFertilizer() {
      if (seedCount < 1) return alert("씨감자가 없으면 농사가 불가능합니다.");
      if (fertilizer < 1) return alert("거름이 부족합니다.");
      growth += 1;
      fertilizer -= 1;
      updateStatus();
      updateServerResources();
    }

    function updateStatus() {
      document.getElementById("growth").textContent = growth;
      document.getElementById("water").textContent = water;
      document.getElementById("fertilizer").textContent = fertilizer;
      checkHarvestReady();
    }

    function checkHarvestReady() {
      if (growth >= 5 && !document.getElementById("harvest-btn")) {
        const btn = document.createElement("button");
        btn.textContent = "🥔 수확하기";
        btn.id = "harvest-btn";
        btn.onclick = handleHarvest;
        document.getElementById("harvest-container").appendChild(btn);
      }
    }

    async function handleHarvest() {
      if (seedCount < 1) return alert("씨감자가 없으면 수확할 수 없습니다.");
      const yieldAmount = [3, 5, 7][Math.floor(Math.random() * 3)];
      growth = 0;
      seedCount -= 1;
      document.getElementById("growth").textContent = growth;
      document.getElementById("harvest-container").innerHTML = "";
      document.getElementById("seed").textContent = seedCount;

      try {
        await fetch(`${API_BASE}/api/farm/harvest`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, harvested: yieldAmount })
        });

        await fetch(`${API_BASE}/api/user/${encodeURIComponent(nickname)}/inventory`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ item: { name: "감자", count: yieldAmount } })
        });

        await updateServerResources();
        alert(`🎉 감자 ${yieldAmount}개 수확 완료!`);
        fetchUserData();
      } catch {
        alert("❌ 수확 결과 저장 실패");
      }
    }

    fetchUserData();
</script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const nickname = localStorage.getItem("nickname");
    if (!nickname) return;

    try {
      const res = await fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/user/${nickname}`);
      const data = await res.json();

      if (data) {
        // 상단 자원 상태 표시
        document.getElementById("resourceStatus").innerText =
          `💰 토큰: ${data.token || 0}개 | 🌱 씨감자: ${data.seed_potato || 0}개 | 💧 물: ${data.water || 0}개 | 🌿 거름: ${data.fertilizer || 0}개`;

        // 자재 보관소에 수확한 감자만 표시
        const inventory = data.inventory || [];
        const potatoCount = inventory.filter(item => item.name === "감자").reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById("potatoStorage").innerText = `🥔 감자 보유량: ${potatoCount}개`;
      }
    } catch (err) {
      console.error("서버 연동 실패:", err);
    }
  });
</script>
<script>
fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/userdata')
  .then(res => res.json())
  .then(data => {
    document.getElementById('seedCountDisplay').textContent = data.seedCount ?? 0;
    document.getElementById('waterCountDisplay').textContent = data.water ?? 0;
    document.getElementById('fertilizerCountDisplay').textContent = data.fertilizer ?? 0;
    document.getElementById('tokenCountDisplay').textContent = data.token ?? 0;
    document.getElementById('potatoCountDisplay').textContent = data.potato ?? 0;
  });
</script><script>
function harvestAndSavePotatoes() {
  const nickname = localStorage.getItem("nickname") || "default";
  const harvested = Math.floor(Math.random() * 3) * 2 + 3; // 3, 5, 7 중 하나
  fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/harvest', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nickname, harvested })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert(`감자 ${harvested}개 수확 성공!`);
      refreshPotatoCount();
    } else {
      alert("수확 실패: " + data.message);
    }
  });
}

function refreshPotatoCount() {
  fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/userdata')
    .then(res => res.json())
    .then(data => {
      document.getElementById('potatoCountDisplay').textContent = data.potato ?? 0;
    });
}
</script></body>
</html>
