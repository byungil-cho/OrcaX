<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 5%;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.3);
      display: inline-block;
      border-radius: 12px;
    }
    .section {
      background-color: #ffffff20;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .water { background-color: #4FC3F7; }
    .fertilizer { background-color: #AED581; }
    .harvest { background-color: #FF8A65; }
    .status { margin-top: 10px; font-weight: bold; color: #00FF00; }
    .nav a {
      display: inline-block;
      margin: 10px 15px;
      color: #FFD700;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>감자 농장</h1>
    <div id="userInfo">농장주: <span id="nickname">-</span><br>농장이름: <span id="farmName">-</span></div>
    <div class="status" id="serverStatus">⏳ 서버 연결 확인 중...</div>

    <div class="section">
      <h2>🌱 농장 관리</h2>
      <label><input type="radio" name="cropType" value="seedPotato" checked /> 씨감자</label>
      <label><input type="radio" name="cropType" value="seedBarley" /> 씨보리</label>
      <br>
      <button class="water" onclick="giveWater()" disabled>💧 물 주기</button>
      <button class="fertilizer" onclick="giveFertilizer()" disabled>🌿 거름 주기</button>
      <button class="harvest" id="harvestBtn" onclick="harvestCrop()" disabled>🥔 수확하기</button>
      <div>🌟 성장포인트: <span id="growth">0</span></div>
    </div>

    <div class="section">
      <h2>📦 농자재 보관함</h2>
      씨감자: <span id="seedPotato">0</span><br>
      씨보리: <span id="seedBarley">0</span><br>
      물: <span id="water">0</span><br>
      거름: <span id="fertilizer">0</span><br>
      ORCX: <span id="orcx">0</span>
    </div>

    <div class="section">
      <h2>🌾 작물 보관소</h2>
      감자: <span id="potato">0</span><br>
      보리: <span id="barley">0</span>
    </div>

    <div class="nav">
      <a href="gamja-farm.html">🏠 농장 대시보드</a>
      <a href="gamja-shop.html">🌱 씨앗 상점</a>
      <a href="gamja-result.html">⚙️ 작물 가공공장</a>
    </div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";
    const kakaoId = localStorage.getItem("kakaoId");
    const nickname = localStorage.getItem("nickname") || "-";
    const farmName = localStorage.getItem("farmName") || "-";
    document.getElementById("nickname").textContent = nickname;
    document.getElementById("farmName").textContent = farmName;

    if (!kakaoId) {
      alert("로그인이 필요합니다. 로그인 페이지로 이동합니다.");
      window.location.href = "index9.html";
    }

    // 유저 데이터
    let user = null;
    let growthPoint = 0;

    function updateDisplay() {
      document.getElementById("seedPotato").textContent = user.seedPotato ?? 0;
      document.getElementById("seedBarley").textContent = user.seedBarley ?? 0;
      document.getElementById("water").textContent = user.water ?? 0;
      document.getElementById("fertilizer").textContent = user.fertilizer ?? 0;
      document.getElementById("orcx").textContent = user.orcx ?? 0;
      document.getElementById("potato").textContent = user.potato ?? 0;
      document.getElementById("barley").textContent = user.bori ?? 0;
      document.getElementById("growth").textContent = growthPoint;

      const selectedSeed = document.querySelector('input[name="cropType"]:checked').value;
      const hasSeed = user[selectedSeed] > 0;
      document.querySelector(".water").disabled = !hasSeed || (user.water ?? 0) < 1;
      document.querySelector(".fertilizer").disabled = !hasSeed || (user.fertilizer ?? 0) < 1;
      document.getElementById("harvestBtn").disabled = !hasSeed || growthPoint < 5;
    }

    // 유저 상태 불러오기 (DB에서만)
    async function fetchUserState() {
      try {
        const response = await fetch(`${API_BASE}/userdata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId }),
        });
        const data = await response.json();
        user = data.user;
        if (!user) {
          document.getElementById("serverStatus").textContent = "❌ 유저 정보 없음";
          alert("유저 정보를 찾을 수 없습니다.");
          return;
        }
        growthPoint = user.growthPoint ?? 0; // 서버에서 직접 불러옴
        document.getElementById("serverStatus").textContent = "✅ 서버 연결 성공";
        updateDisplay();
      } catch (err) {
        console.error("서버 상태 로딩 실패", err);
        document.getElementById("serverStatus").textContent = "❌ 서버 연결 실패";
      }
    }

    // 물 주기(서버에 저장)
    async function giveWater() {
      const selectedSeed = document.querySelector('input[name="cropType"]:checked').value;
      if ((user[selectedSeed] ?? 0) < 1) return alert("씨앗이 없습니다!");
      if ((user.water ?? 0) < 1) return alert("물 부족!");
      try {
        // 서버에 PATCH (실제 DB에 저장)
        const response = await fetch(`${API_BASE}/factory/grow`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId, cropType: selectedSeed, action: "water" }),
        });
        const data = await response.json();
        if (data.success) {
          // 서버값 다시 반영!
          growthPoint = data.growthPoint ?? 0;
          await fetchUserState();
        } else {
          alert(data.message || "서버 처리 실패!");
        }
      } catch (e) {
        alert("서버 오류");
      }
    }

    // 거름 주기(서버에 저장)
    async function giveFertilizer() {
      const selectedSeed = document.querySelector('input[name="cropType"]:checked').value;
      if ((user[selectedSeed] ?? 0) < 1) return alert("씨앗이 없습니다!");
      if ((user.fertilizer ?? 0) < 1) return alert("거름 부족!");
      try {
        // 서버에 PATCH (실제 DB에 저장)
        const response = await fetch(`${API_BASE}/factory/grow`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId, cropType: selectedSeed, action: "fertilizer" }),
        });
        const data = await response.json();
        if (data.success) {
          growthPoint = data.growthPoint ?? 0;
          await fetchUserState();
        } else {
          alert(data.message || "서버 처리 실패!");
        }
      } catch (e) {
        alert("서버 오류");
      }
    }

    // 수확하기(서버에 저장)
    async function harvestCrop() {
      if (growthPoint < 5) return;
      const selectedSeed = document.querySelector('input[name="cropType"]:checked').value;
      if ((user[selectedSeed] ?? 0) < 1) return alert("씨앗이 없습니다!");
      try {
        // 서버에 PATCH (수확/DB에 저장)
        const response = await fetch(`${API_BASE}/factory/harvest`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId, cropType: selectedSeed }),
        });
        const data = await response.json();
        if (data.success) {
          alert(`🎉 수확 성공! ${data.reward}개를 얻었습니다.`);
          growthPoint = 0;
          await fetchUserState();
        } else {
          alert(data.message || "수확 실패");
        }
      } catch (e) {
        alert("수확 실패(서버 오류)");
      }
    }

    document.querySelectorAll('input[name="cropType"]').forEach(radio => {
      radio.addEventListener("change", updateDisplay);
    });

    fetchUserState();
  </script>
</body>
</html>
