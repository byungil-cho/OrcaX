<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f9ec;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      color: #256029;
    }
    .status-box {
      background: #ffffff;
      border: 1px solid #c8e6c9;
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1rem;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .info {
      font-size: 1rem;
      margin: 0.3rem 0;
    }
    .btn {
      margin: 1rem 0.4rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background-color: #388e3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #2e7d32;
    }
  </style>
</head>
<body>
  <h1>💧 OrcaX 감자 농장</h1>
  <div id="connection">🔌 서버 연결 상태 확인 중...</div>
  <div class="status-box">
    <div class="info">💧 물: <span id="water">-</span></div>
    <div class="info">🧴 거름: <span id="fertilizer">-</span></div>
    <div class="info">🥔 감자: <span id="potato">-</span></div>
    <div class="info">🪙 ORCX 토큰: <span id="token">-</span></div>
    <div class="info">🎯 농장명: <span id="farm">-</span></div>
  </div>
  <div>
    <button class="btn" onclick="giveWater()">💧 물 주기</button>
    <button class="btn" onclick="giveFertilizer()">🧴 거름 주기</button>
    <button class="btn" onclick="harvest()">🥔 감자 수확하기</button>
    <button class="btn" onclick="goToFactory()">🏭 감자 가공공장 이동</button>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname") || "";
    const farmName = localStorage.getItem("farmName") || "이름없는농장";
    document.getElementById("farm").innerText = farmName;

    async function loadStatus() {
      const connection = document.getElementById("connection");
      if (!nickname) {
        connection.innerText = "❌ 닉네임 없음 (로그인 필요)";
        return;
      }

      try {
        const res = await fetch(`https://climbing-wholly-grouper.ngrok-free.app/api/userdata?nickname=${nickname}`);
        if (!res.ok) throw new Error("서버 응답 오류");

        const data = await res.json();
        connection.innerHTML = "✅ 전기 공급 중 (서버 연결됨)";
        document.getElementById("water").innerText = data.water ?? 0;
        document.getElementById("fertilizer").innerText = data.fertilizer ?? 0;
        document.getElementById("potato").innerText = data.potatoCount ?? 0;
        document.getElementById("token").innerText = data.token ?? 0;
      } catch (err) {
        connection.innerHTML = `❌ 서버 오류: ${err.message}`;
      }
    }

    function giveWater() {
      alert("물 주기 기능은 아직 구현되지 않았습니다.");
    }

    function giveFertilizer() {
      alert("거름 주기 기능은 아직 구현되지 않았습니다.");
    }

    function harvest() {
      alert("감자 수확 기능은 아직 구현되지 않았습니다.");
    }

    function goToFactory() {
      window.location.href = "gamja-result.html";
    }

    loadStatus();
  </script>
</body>
</html>
