<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>🥔 감자 농장 - Potato Farm</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Do Hyeon', sans-serif;
      height: 100%;
    }
    body {
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center top fixed;
      background-size: cover;
      overflow: auto;
    }
    .scroll-area {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 3rem;
      box-sizing: border-box;
    }
    header {
      padding: 1rem;
      font-size: 2rem;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      text-align: center;
    }
    .nickname, .info-bar {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      text-align: center;
    }
    .info-bar { font-size: 0.95rem; }
    .potato-field, .storage-section, .product-section, .nav-buttons {
      margin: 1rem;
      padding: 1rem;
      background: rgba(255,255,255,0.8);
      border-radius: 1rem;
    }
    .potato-btns button {
      margin: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.75rem;
      background: #a5d6a7;
      cursor: pointer;
    }
    .storage-section ul, .product-section ul {
      list-style: none;
      padding: 0;
    }
    .storage-section li, .product-section li {
      margin-bottom: 0.5rem;
      font-weight: bold;
    }
    .nav-buttons a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #4caf50;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
    }
    .server-status {
      text-align: center;
      margin-top: 1rem;
      font-weight: bold;
      color: #fff700;
    }
  </style>
</head>
<body>
<div class="scroll-area">
  <header>감자 농장</header>
  <div class="nickname">농장주: <span id="nickname">로딩 중...</span></div>
  <div class="info-bar">농장이름: <span id="farmName">로딩 중...</span></div>
  <div class="server-status" id="serverStatus">🔌 서버 상태 확인 중...</div>

  <div class="potato-field">
    <h2>🌾 감자가 자라고 있습니다.</h2>
    <div class="potato-btns">
      <button onclick="startFarming()">🥔 수확하기</button>
      <button onclick="applyWater()">💧 물 주기</button>
      <button onclick="applyFertilizer()">🌿 거름 주기</button>
    </div>
  </div>

  <div class="storage-section">
    <h2>📦 농자재 보관함</h2>
    <ul id="storage-list"></ul>
  </div>
  <div class="product-section">
    <h2>🍟 가공식품 보관함</h2>
    <ul id="product-list"></ul>
  </div>
  <div class="nav-buttons">
    <a href="gamja-result.html">감자 가공공장</a>
    <a href="gamja-main.html">뒤로가기</a>
  </div>
</div>

<script>
const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

function checkServerStatus() {
  fetch(`${API_BASE}/`)
    .then(res => {
      if (res.ok) {
        document.getElementById("serverStatus").textContent = "✅ 서버 전원 ON";
      } else {
        throw new Error();
      }
    })
    .catch(() => {
      document.getElementById("serverStatus").textContent = "❌ 서버 연결 실패";
    });
}

async function fetchUserData() {
  const nickname = localStorage.getItem("nickname");
  const farmName = localStorage.getItem("farmName") || "농장";
  if (!nickname) {
    alert("닉네임이 없습니다. 다시 로그인해주세요.");
    window.location.href = "/OrcaX/index9.html";
    return;
  }

  document.getElementById("nickname").textContent = nickname;
  document.getElementById("farmName").textContent = farmName;

  try {
    const res = await fetch(`${API_BASE}/api/userdata?nickname=${encodeURIComponent(nickname)}`);
    const data = await res.json();
    const user = data.users[0];

    const growthInfo = document.createElement("div");
    growthInfo.style.textAlign = "center";
    growthInfo.style.marginTop = "0.5rem";
    growthInfo.style.fontWeight = "bold";
    growthInfo.innerText = `🌱 성장 포인트: ${user.growthPoint || 0}`;
    document.querySelector(".potato-field").appendChild(growthInfo);

    const storageList = document.getElementById("storage-list");
    storageList.innerHTML = "";
    const 자재 = [
      { label: "씨감자", value: localStorage.getItem("씨감자") || 0 },
      { label: "씨보리", value: localStorage.getItem("씨보리") || 0 },
      { label: "물", value: user.water },
      { label: "거름", value: user.fertilizer },
      { label: "ORCX", value: user.orcx }
    ];
    자재.forEach(item => {
      const li = document.createElement("li");
      li.textContent = `${item.label}: ${item.value}`;
      storageList.appendChild(li);
    });

    const productList = document.getElementById("product-list");
    productList.innerHTML = "";
    user.inventory.forEach(item => {
      const type = item.type || item.name || "정의되지 않음";
      const li = document.createElement("li");
      li.textContent = `${type}: ${item.count}`;
      productList.appendChild(li);
    });
  } catch (err) {
    console.error(err);
    alert("❌ 유저 정보 불러오기 실패");
  }
}

async function startFarming() {
  const nickname = localStorage.getItem("nickname");
  if (!nickname) return;

  let seedCount = parseInt(localStorage.getItem("씨감자") || 0);
  if (seedCount < 1) {
    alert("❌ 씨감자가 없습니다.");
    return;
  }

  localStorage.setItem("씨감자", seedCount - 1);
  const amount = [1, 2, 3][Math.floor(Math.random() * 3)];

  try {
    const res = await fetch(`${API_BASE}/api/farm/harvest`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nickname: encodeURIComponent(nickname), amount })
    });
    const result = await res.json();
    if (result.success) {
      alert(`🥔 감자 ${amount}개 수확 완료!`);
      fetchUserData();
    } else {
      alert("❌ 서버 수확 실패");
    }
  } catch (err) {
    console.error(err);
    alert("❌ 수확 중 오류 발생");
  }
}

async function applyWater() {
  const nickname = localStorage.getItem("nickname") || "";
  try {
    const res = await fetch(`${API_BASE}/api/farm/grow`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nickname: encodeURIComponent(nickname), cropType: "gamja" })
    });
    const result = await res.json();
    if (result.success) {
      alert("💧 물과 거름을 주었습니다. 성장 포인트 +1!");
      fetchUserData();
    } else {
      alert("❌ 물주기 실패");
    }
  } catch (err) {
    console.error(err);
    alert("❌ 물 주기 오류");
  }
}

async function applyFertilizer() {
  applyWater(); // 같은 grow API로 처리
}

window.addEventListener("DOMContentLoaded", () => {
  checkServerStatus();
  fetchUserData();
});
</script>
</body>
</html>
