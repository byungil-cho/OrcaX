<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: #fffbe6;
      color: #333;
      text-align: center;
    }
    .status {
      font-weight: bold;
      color: green;
      margin-bottom: 1rem;
    }
    .assets {
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: 12px;
      background: #ffffff;
      display: inline-block;
      text-align: left;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      transition: font-size 0.3s ease;
    }
    .farm-buttons button {
      margin: 0.4rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background-color: #6cbb3c;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .farm-buttons button:hover {
      background-color: #5aaa30;
    }
    .farm-buttons {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    #growPoint {
      font-weight: bold;
      margin-top: 1rem;
    }
    @media (max-width: 600px) {
      .assets {
        font-size: clamp(0.85rem, 3.5vw, 1.15rem);
      }
    }
    #audioUpload {
      margin-top: 1.5rem;
    }
    .nav-links {
      margin-top: 2rem;
    }
    .nav-links a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background-color: #444;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
    }
    .nav-links a:hover {
      background-color: #222;
    }
  </style>
</head>
<body>
  <h2>🌾 감자 농장</h2>
  <div class="status" id="status">서버 연결 확인 중...</div>

  <div class="assets" id="assetsBox">
    감자: -<br>
    물: -<br>
    거름: -<br>
    씨감자: -<br>
    ORCX: -<br>
    🌱 성장 포인트: <span id="grow">0</span>
  </div>

  <div class="farm-buttons">
    <button onclick="water()">💧 물 주기</button>
    <button onclick="fertilize()">🧪 거름 주기</button>
    <button onclick="plant()">🥔 씨감자 심기</button>
    <button onclick="harvest()">🎉 수확하기</button>
  </div>

  <div class="nav-links">
    <a href="gamja-result.html">가공공장</a>
    <a href="gamja-shop.html">씨감자 상점</a>
    <a href="gamja-exchange.html">교환소</a>
    <a href="orcax-farm_000.html">농장 입구</a>
  </div>

  <input type="file" id="audioUpload" accept="audio/*">
  <audio id="gamjaSound" controls></audio>

  <script>
    const nickname = localStorage.getItem("nickname");
    const farmName = localStorage.getItem("farmName") || "농장";

    if (!nickname) {
      alert("로그인 정보가 없습니다. 처음 화면으로 이동합니다.");
      location.href = "orcax-farm_000.html";
    } else {
      document.getElementById("status").textContent = `✅ ${nickname} (${farmName})님 환영합니다!`;
      fetchUserData();
    }

    function fetchUserData() {
      const encoded = encodeURIComponent(nickname);
      fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata/${encoded}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            const u = data.user;
            document.getElementById("assetsBox").innerHTML =
              `감자: ${u.potatoCount || 0}<br>` +
              `물: ${u.water || 0}<br>` +
              `거름: ${u.fertilizer || 0}<br>` +
              `씨감자: ${u.seedPotato || 0}<br>` +
              `ORCX: ${u.token || 0}<br>` +
              `🌱 성장 포인트: <span id="grow">${u.growPoint || 0}</span>`;
          } else {
            document.getElementById("status").textContent = "❌ 유저 정보를 불러오지 못했습니다.";
          }
        })
        .catch(() => {
          document.getElementById("status").textContent = "❌ 서버 오류 발생.";
        });
    }

    function farmAction(endpoint, successMessage) {
      fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/farm/${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert(`✅ ${successMessage}`);
            fetchUserData();
          } else {
            alert(`❌ ${data.message}`);
          }
        })
        .catch(() => alert("❌ 서버 오류 발생"));
    }

    function water() { farmAction("water", "물 주기 완료!"); }
    function fertilize() { farmAction("fertilize", "거름 주기 완료!"); }
    function plant() { farmAction("plant", "씨감자 심기 완료!"); }
    function harvest() {
      const audio = document.getElementById("gamjaSound");
      if (audio && audio.src) {
        audio.play();
      }
      farmAction("harvest", "감자 수확 완료!");
    }

    document.getElementById("audioUpload").addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (file) {
        const audioURL = URL.createObjectURL(file);
        const audioElement = document.getElementById("gamjaSound");
        audioElement.src = audioURL;
        audioElement.load();
      }
    });
  </script>
</body>
</html>
