<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 감자농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: white;
    }
    main {
      background-color: rgba(0, 0, 0, 0.3);
      margin: 3rem auto;
      padding: 2rem;
      max-width: 480px;
      border-radius: 20px;
    }
    h1 { margin-bottom: 1rem; font-size: 2rem; }
    .info-block { margin: 1.5rem 0; font-size: 1.3rem; }
    .control-block { margin: 2rem 0; }
    button {
      background-color: #28a745; color: white; border: none;
      padding: 0.8rem 1.5rem; font-size: 1.2rem; cursor: pointer; border-radius: 8px;
    }
    button:disabled { background: #aaa; color: #444; }
    .water-btn { background-color: #17a2b8; }
    .fert-btn { background-color: #b6d142; color: #222; }
    .harvest-btn { background-color: #ff7575; }
    .radio-box { margin: 0.8rem 0; }
    nav { display: flex; justify-content: space-around; padding: 1rem; }
    nav a { color: #ffcc00; text-decoration: none; font-weight: bold; }
    .status { margin-top: 1.5rem; color: #00ff00; }
    .storage { margin-top: 2rem; font-size: 1.2rem; background:rgba(0,0,0,0.15); border-radius:1em; padding:1em; }
  </style>
</head>
<body>
  <main>
    <h1>🥔 감자 농장</h1>
    <div class="info-block" id="farmNameBlock">농장이름: -</div>
    <div class="status" id="statusMsg">📡 서버 연결 확인 중...</div>
    <div class="control-block">
      <div>농장 관리</div>
      <div class="radio-box">
        <input type="radio" id="seedPotato" name="cropType" value="seedPotato" checked>
        <label for="seedPotato">씨감자</label>
        <input type="radio" id="seedBarley" name="cropType" value="seedBarley">
        <label for="seedBarley">씨보리</label>
      </div>
      <button class="water-btn" onclick="giveWater()">💧 물 주기</button>
      <button class="fert-btn" onclick="giveFertilizer()">🌿 거름 주기</button>
      <button class="harvest-btn" id="harvestBtn" onclick="harvestCrop()" disabled>🌾 수확하기</button>
      <div style="margin-top:1rem;">
        성장포인트: <span id="growthPoint">0</span>
      </div>
    </div>
    <div class="storage" id="storageBlock">
      <div>농자재 보관함</div>
      씨감자: <span id="myPotato">0</span>
      &nbsp; 씨보리: <span id="myBarley">0</span>
      &nbsp; 물: <span id="myWater">0</span>
      &nbsp; 거름: <span id="myFert">0</span>
      &nbsp; ORCX: <span id="myOrcx">0</span>
      <br>
      <span style="color:#ff0">감자: <span id="myCropPotato">0</span></span>
      &nbsp; <span style="color:#ff0">보리: <span id="myCropBarley">0</span></span>
    </div>
    <nav>
      <a href="gamja-farm.html">감자 대시보드</a>
      <a href="gamja-shop.html">씨앗 상점</a>
      <a href="gamja-result.html">가공식품공장</a>
    </nav>
  </main>
  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";
    const kakaoId = localStorage.getItem("kakaoId") || "";
    if (!kakaoId) {
      alert("로그인이 필요합니다. 메인으로 이동합니다.");
      window.location.href = "index9.html";
    }

    // 상태 저장용
    let user = {};
    let growthPoint = 0;

    // cropType 선택값 가져오기
    function getSelectedCropType() {
      const el = document.querySelector('input[name="cropType"]:checked');
      return el ? el.value : "seedPotato";
    }

    // 농장/보관함 정보 불러오기
    async function fetchUserData() {
      try {
        const res = await fetch(`${API_BASE}/user/v2data`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: kakaoId })
        });
        const data = await res.json();
        user = data.user || {};
        document.getElementById("myPotato").innerText = user.seedPotato ?? 0;
        document.getElementById("myBarley").innerText = user.seedBarley ?? 0;
        document.getElementById("myWater").innerText = user.water ?? 0;
        document.getElementById("myFert").innerText = user.fertilizer ?? 0;
        document.getElementById("myOrcx").innerText = user.orcx ?? 0;
        document.getElementById("farmNameBlock").innerText = "농장이름: " + (localStorage.getItem("farmName") || "-");
        // 🚩 수확 감자/보리 실시간 표시
        document.getElementById("myCropPotato").innerText = (user.growth && user.growth.potato != null) ? user.growth.potato : 0;
        document.getElementById("myCropBarley").innerText = (user.growth && user.growth.barley != null) ? user.growth.barley : 0;
        document.getElementById("statusMsg").innerText = "✅ 서버 연결 성공";
      } catch (e) {
        document.getElementById("statusMsg").innerText = "❌ 유저정보 불러오기 실패";
      }
    }

    // 성장포인트 조회
    async function fetchGrowthPoint() {
      try {
        const res = await fetch(`${API_BASE}/factory/growth-status`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId })
        });
        const data = await res.json();
        const cropType = getSelectedCropType();
        growthPoint = data.growth ? (cropType === "seedPotato" ? data.growth.potato : data.growth.barley) : 0;
        document.getElementById("growthPoint").innerText = growthPoint;
        // 수확 버튼 활성화(포인트 5 이상, 씨앗도 1개 이상)
        if (growthPoint >= 5 && (user[cropType] ?? 0) > 0) {
          document.getElementById("harvestBtn").disabled = false;
        } else {
          document.getElementById("harvestBtn").disabled = true;
        }
      } catch (e) {
        document.getElementById("growthPoint").innerText = 0;
      }
    }

    // 물주기
    async function giveWater() {
      const cropType = getSelectedCropType();
      if (!kakaoId) return alert("로그인 필요");
      if (!cropType) return alert("씨앗 종류를 선택하세요!");
      if ((user[cropType] ?? 0) < 1) return alert("씨앗이 없습니다!");
      if ((user.water ?? 0) < 1) return alert("물 부족!");
      try {
        const patchRes = await fetch(`${API_BASE}/factory/use-resource`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            kakaoId,
            cropType,
            water: -1 // 물 1개 사용
          })
        });
        const data = await patchRes.json();
        if (data.success) {
          await fetchUserData();
          await fetchGrowthPoint();
        } else {
          alert(data.message || "물 사용 실패");
        }
      } catch (e) {
        alert("서버 오류(물)");
      }
    }

    // 거름주기
    async function giveFertilizer() {
      const cropType = getSelectedCropType();
      if (!kakaoId) return alert("로그인 필요");
      if (!cropType) return alert("씨앗 종류를 선택하세요!");
      if ((user[cropType] ?? 0) < 1) return alert("씨앗이 없습니다!");
      if ((user.fertilizer ?? 0) < 1) return alert("거름 부족!");
      try {
        const patchRes = await fetch(`${API_BASE}/factory/use-resource`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            kakaoId,
            cropType,
            fertilizer: -1 // 거름 1개 사용
          })
        });
        const data = await patchRes.json();
        if (data.success) {
          await fetchUserData();
          await fetchGrowthPoint();
        } else {
          alert(data.message || "거름 사용 실패");
        }
      } catch (e) {
        alert("서버 오류(거름)");
      }
    }

    // 수확하기
    async function harvestCrop() {
      const cropType = getSelectedCropType();
      if (!kakaoId) return alert("로그인 필요");
      if (!cropType) return alert("씨앗 종류를 선택하세요!");
      try {
        const res = await fetch(`${API_BASE}/factory/harvest`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId, cropType })
        });
        const data = await res.json();
        if (data.success) {
          alert(`수확 성공! +${data.reward}개`);
          await fetchUserData();
          await fetchGrowthPoint();
        } else {
          alert(data.message || "수확 실패");
        }
      } catch (e) {
        alert("서버 오류(수확)");
      }
    }

    // cropType 바뀔 때마다 성장포인트 조회
    document.querySelectorAll('input[name="cropType"]').forEach(el => {
      el.addEventListener('change', fetchGrowthPoint);
    });

    // 첫 로딩
    fetchUserData().then(fetchGrowthPoint);
  </script>
</body>
</html>
