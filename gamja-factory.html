<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: url("https://byungil-cho.github.io/OrcaX/farm-101.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    .storage {
      background: rgba(0,0,0,0.4);
      margin: 1rem auto 0 auto;
      border-radius: 12px;
      padding: 10px 0 4px 0;
      max-width: 430px;
      font-size: 1.1rem;
      letter-spacing: 1px;
      line-height: 1.7;
      box-shadow: 0 0 8px #222;
    }
    .storage span {
      color: #ff0;
      font-weight: bold;
      margin-right: 12px;
    }
    #storageBlock {
      margin-bottom: 1.5rem;
    }
    .main-btn { margin: 10px 10px 20px 10px; }
    .main-btn button {
      border: none;
      border-radius: 8px;
      padding: 10px 30px;
      font-size: 1.15rem;
      margin: 6px 6px;
      cursor: pointer;
      font-family: 'Do Hyeon', sans-serif;
    }
    .water { background: #13bbf6; color: #fff; }
    .fertilizer { background: #d1fa7b; color: #444; }
    .harvest { background: #ccc; color: #999; }
    .harvest.active { background: #ffc107; color: #fff; }
    .nav {
      margin-top: 30px;
      font-size: 1.1rem;
    }
    .nav a {
      color: #ffd600;
      margin: 0 18px;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 1.5px;
    }
    .nav a:hover { color: #fff; }
    .server-status { color: #36ff85; font-size: 1rem; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🥔 감자 농장</h1>
    <div>농장이름: <span id="farmName">-</span></div>
    <div class="server-status" id="serverStatus">🔄 서버연결 확인 중...</div>
    <div style="margin-top: 16px; margin-bottom: 8px;">
      <b>농장 관리</b><br/>
      <input type="radio" name="seedType" id="selPotato" value="potato" checked> 씨감자
      <input type="radio" name="seedType" id="selBarley" value="barley"> 씨보리
    </div>
    <div class="main-btn">
      <button class="water" id="btnWater">💧 물 주기</button>
      <button class="fertilizer" id="btnFertilizer">🌿 거름 주기</button>
      <button class="harvest" id="btnHarvest" disabled>🌾 수확하기</button>
    </div>
    <div>성장포인트: <span id="growthPoint">0</span></div>

    <!-- 농자재/수확물 보관함 -->
    <div class="storage" id="storageBlock">
      <div>농자재 보관함</div>
      씨감자: <span id="myPotato">0</span>
      씨보리: <span id="myBarley">0</span>
      물: <span id="myWater">0</span>
      거름: <span id="myFert">0</span>
      ORCX: <span id="myOrcx">0</span>
      <br>
      <span>감자: <span id="myCropPotato">0</span></span>
      <span>보리: <span id="myCropBarley">0</span></span>
    </div>

    <div class="nav">
      <a href="gamja-farm.html">감자 대시보드</a>
      <a href="gamja-shop.html">씨앗 상점</a>
      <a href="gamja-result.html">가공식품공장</a>
    </div>
  </div>
  <script>
    // 1. 페이지 진입시 사용자 정보 불러오기
    let userData = null;
    async function fetchUserData() {
      try {
        const res = await fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/user/v2data', {
          method: "POST",
          credentials: "include"
        });
        const data = await res.json();
        userData = data.user || data;
        // 농장이름, 서버상태 등 표시
        document.getElementById("farmName").innerText = userData.farmName || "이름없음";
        document.getElementById("serverStatus").innerText = "✅ 서버 연결 성공";
        // 자원 및 수확물 보관함
        document.getElementById("myPotato").innerText = userData.inventory?.seedPotato ?? 0;
        document.getElementById("myBarley").innerText = userData.inventory?.seedBarley ?? 0;
        document.getElementById("myWater").innerText = userData.inventory?.water ?? 0;
        document.getElementById("myFert").innerText = userData.inventory?.fertilizer ?? 0;
        document.getElementById("myOrcx").innerText = userData.wallet?.orcx ?? 0;
        // ✅ 감자/보리 수확분
        document.getElementById("myCropPotato").innerText = userData.storage?.gamja ?? userData.potato ?? 0;
        document.getElementById("myCropBarley").innerText = userData.storage?.bori ?? userData.barley ?? 0;
      } catch (e) {
        document.getElementById("serverStatus").innerText = "❌ 서버 연결 실패";
      }
    }
    fetchUserData();

    // 버튼 이벤트 등 (예시)
    document.getElementById("btnWater").onclick = async () => {
      // ... 물 주기 로직
      await fetchUserData(); // 자원/보관함 갱신
    };
    document.getElementById("btnFertilizer").onclick = async () => {
      // ... 거름 주기 로직
      await fetchUserData(); // 자원/보관함 갱신
    };
    document.getElementById("btnHarvest").onclick = async () => {
      // ... 수확하기 로직
      await fetchUserData(); // 자원/보관함 갱신
    };
  </script>
</body>
</html>
