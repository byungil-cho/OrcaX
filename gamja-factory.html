<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감자 농장 입장</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    input {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: none;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    .button-row {
      display: flex;
      gap: 1rem;
    }
    button {
      padding: 0.8rem 2rem;
      font-size: 1rem;
      background-color: #f9a825;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #f57f17;
    }
    .status {
      margin: 1rem;
      text-align: center;
    }
    .potato-img {
      width: 160px;
      height: 160px;
      margin-top: 1rem;
      border-radius: 50%;
      overflow: hidden;
      animation: wiggle 1s infinite alternate;
    }
    .potato-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @keyframes wiggle {
      0% { transform: rotate(-1deg); }
      100% { transform: rotate(1deg); }
    }
  </style>
</head>
<body>
  <h1>[이름없는농장] 감자가 자라고 있습니다</h1>
  <div class="status">
    <div>👤 <span id="nickname">-</span>님 어서오세요!</div>
    <div>⏳ 농사 대기 시간: <span id="wait-time">--</span>분 남음</div>
    <div>🕒 마지막 작업 이후 <span id="last-action">--</span>분 경과</div>
    <p>물을 주거나 거름을 주세요!</p>
  </div>
  <div class="button-row">
    <button onclick="addWater()">💧 물 주기</button>
    <button onclick="addFertilizer()">🌾 거름 주기</button>
  </div>
  <div class="status">
    💧 물: <span id="water-count">0</span>번 | 🌾 거름: <span id="fertilizer-count">0</span>번
  </div>
  <button onclick="harvest()">🥔 수확하기</button>
  <div class="potato-img"><img src="https://byungil-cho.github.io/OrcaX/farm-101_01.png" alt="감자 이미지"></div>
  <div class="status" id="result"></div>

  <script>
    const nickname = localStorage.getItem('nickname') || '이름없는농장';
    document.getElementById('nickname').textContent = nickname;

    let water = 0;
    let fertilizer = 0;
    let startTime = Date.now();

    function updateStatus() {
      document.getElementById('water-count').textContent = water;
      document.getElementById('fertilizer-count').textContent = fertilizer;
      const minutesPassed = Math.floor((Date.now() - startTime) / 60000);
      document.getElementById('last-action').textContent = minutesPassed;
      document.getElementById('wait-time').textContent = Math.max(0, 120 - minutesPassed);
    }

    function addWater() {
      water++;
      startTime = Date.now();
      updateStatus();
    }

    function addFertilizer() {
      fertilizer++;
      startTime = Date.now();
      updateStatus();
    }

    function harvest() {
      const total = water + fertilizer;
      if (total >= 3) {
        const harvested = Math.floor(Math.random() * 6) + 5; // 5~10개 수확
        document.getElementById('result').innerText = `🎉 수확 완료! [${nickname}]에서 감자 ${harvested}개를 수확했습니다.`;
        water = 0;
        fertilizer = 0;
        startTime = Date.now();
        updateStatus();

        setTimeout(() => {
          window.location.href = 'gamja-result.html';
        }, 10000);
      } else {
        alert('물을 더 주거나 거름이 부족합니다!');
      }
    }

    updateStatus();
  </script>
</body>
</html>
