<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 보리농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: url("https://byungil-cho.github.io/OrcaX/farm-101.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    header {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 1rem;
    }
    main {
      padding: 2rem;
    }
    .resource-box {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem auto;
      width: 90%;
      max-width: 400px;
    }
    a {
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌾 OrcaX 보리 농장</h1>
    <div>
      <a href="index9.html" style="margin: 0 10px;">메인으로</a>
      <a href="gamja-shop.html" style="margin: 0 10px;">씨앗구매</a>
      <a href="bori-factory.html" style="margin: 0 10px;">보리농사 짓기</a>
    </div>
    <p id="serverStatus">🔌 서버 상태 확인 중...</p>
  </header>
  <main>
    <div class="resource-box">
      <h2>👤 닉네임: <span id="nickname">로딩 중...</span></h2>
      <p>💧 물: <span id="water">-</span> 개</p>
      <p>🧪 거름: <span id="fertilizer">-</span> 개</p>
      <p>🌱 씨보리: <span id="seedBarley">-</span> 개</p>
      <p>🪙 ORCX 토큰: <span id="orcx">-</span> 개</p>
      <p>📦 보리 보관량: <span id="bori">-</span> 개</p>
    </div>
  </main>

  <script>
    async function fetchUserData() {
      const kakaoId = localStorage.getItem('kakaoId');
      if (!kakaoId) {
        alert("카카오 로그인이 필요합니다.");
        window.location.href = "index9.html";
        return;
      }

      try {
        const res = await fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/farm?kakaoId=${kakaoId}`);
        const data = await res.json();

        if (data && data.nickname) {
          document.getElementById('nickname').textContent = data.nickname;
          document.getElementById('water').textContent = data.water ?? 0;
          document.getElementById('fertilizer').textContent = data.fertilizer ?? 0;
          document.getElementById('seedBarley').textContent = data.seedBarley ?? 0;
          document.getElementById('orcx').textContent = data.orcx ?? 0;
          document.getElementById('bori').textContent = data.bori ?? 0;
        } else {
          alert("사용자 정보를 불러올 수 없습니다.");
        }
      } catch (error) {
        console.error("데이터 요청 실패:", error);
        alert("서버 연결에 실패했습니다.");
      }
    }

    async function checkServerStatus() {
      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/ping");
        if (res.ok) {
          document.getElementById('serverStatus').textContent = "🟢 서버 연결됨";
        } else {
          document.getElementById('serverStatus').textContent = "🔴 서버 연결 실패";
        }
      } catch {
        document.getElementById('serverStatus').textContent = "🔴 서버 연결 실패";
      }
    }

    fetchUserData();
    checkServerStatus();
  </script>
</body>
</html>
