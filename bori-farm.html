<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 보리 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #f9fff6; font-family: 'Do Hyeon', sans-serif; color: #222; margin: 0; }
    header { background: #8fc372; color: #fff; padding: 1rem; text-align: center; }
    main { padding: 2rem 1rem; max-width: 600px; margin: 2rem auto; background: #fff; border-radius: 18px; box-shadow: 0 4px 18px #d3efc2aa; }
    .info-box { background: #f3fbe9; border-radius: 12px; padding: 1.2rem; margin-bottom: 2rem; }
    h1 { margin-top: 0; color: #6b9530; }
    .stat-label { font-weight: bold; margin-right: 7px; }
    .stat-row { margin: 0.6rem 0; }
    #nickname { color: #225200; }
    @media (max-width:600px) { main{padding:1.2rem 0.5rem;} }
  </style>
</head>
<body>
  <header>
    <h1>🌾 OrcaX 보리 농장</h1>
  </header>
  <main>
    <div class="info-box">
      <div><span class="stat-label">닉네임:</span> <span id="nickname">-</span></div>
      <div class="stat-row"><span class="stat-label">내 ORCX 토큰:</span> <span id="tokens">0</span></div>
      <div class="stat-row"><span class="stat-label">물:</span> <span id="water">0</span></div>
      <div class="stat-row"><span class="stat-label">거름:</span> <span id="fertilizer">0</span></div>
      <div class="stat-row"><span class="stat-label">씨보리:</span> <span id="seedBarley">0</span></div>
      <div class="stat-row"><span class="stat-label">보리 저장고:</span> <span id="barleyStorage">0</span></div>
    </div>

    <!-- 이 아래에 농사짓기, 수확하기, 가공 등 기능 UI가 들어갑니다 -->
    <div style="margin-top:2.2rem; text-align:center; color:#666;">
      <b>※ 보리 농장 입장은<br>ORCX 토큰 5만 이상 보유 시에만 가능합니다.</b>
    </div>
  </main>
  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";
    // 예시: 로그인된 카카오 ID를 localStorage에서 읽는다(실제 구현에 맞게 조정)
    const kakaoId = localStorage.kakaoId || "";

    async function fetchUserData() {
      if (!kakaoId) {
        document.getElementById("nickname").textContent = "로그인 필요";
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/userdata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId })
        });
        const result = await res.json();

        if (result.success) {
          const user = result.user;
          document.getElementById("nickname").textContent = user.nickname || "알 수 없음";
          document.getElementById("water").textContent = user.inventory?.water || 0;
          document.getElementById("fertilizer").textContent = user.inventory?.fertilizer || 0;
          document.getElementById("seedBarley").textContent = user.inventory?.seedBarley || 0;
          document.getElementById("tokens").textContent = user.orcx || user.wallet?.orcx || 0;
          document.getElementById("barleyStorage").textContent = user.barley || 0;

          // 🟢 토큰 5만 미만이면 입장 차단 및 강제 이동!
          const myTokens = Number(user.orcx || user.wallet?.orcx || 0);
          if (myTokens < 50000) {
            alert("ORCX 토큰이 5만 이상일 때만 보리 농장 입장 가능합니다!");
            window.location.href = "index9.html"; // 또는 로그인/메인 등 원하는 페이지로
            return;
          }

        } else {
          document.getElementById("nickname").textContent = "유저 정보 없음";
        }
      } catch (err) {
        document.getElementById("nickname").textContent = "연결 오류";
      }
    }

    // 진입시 자동 불러오기
    window.onload = fetchUserData;
  </script>
</body>
</html>
