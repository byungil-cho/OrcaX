<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bori Farm Entrance (Login Check)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url('https://byungil-cho.github.io/OrcaX/farm-201.png') no-repeat center center/cover;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.2);
    }
    .label {
      position: absolute;
      top: 5%;
      left: 5%;
      padding: 0.75rem 1.5rem;
      background-color: #ffee55cc;
      color: #222;
      font-weight: bold;
      font-size: 1.25rem;
      border-radius: 8px;
    }
    .entry-button {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      padding: 1rem 2rem;
      background-color: #ffee55;
      border: none;
      border-radius: 8px;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
    }
    .entry-button:hover {
      background-color: #ffcc00;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="overlay"></div>
    <div class="label">Bori Farm Entrance</div>
    <button class="entry-button" onclick="enterBoriFarm()">Enter the Field</button>
  </div>
  <script>
    function enterBoriFarm() {
      const nickname = localStorage.getItem("nickname");
      if (!nickname) {
        alert("\uB85C\uADF8\uC778 \uC815\uBCF4\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4. \uC785\uAD6C\uB85C \uB3CC\uC544\uAC00\uB4DC\uB9B4\uAC8C\uC694.");
        window.location.href = "orcax-farm_000.html";
        return;
      }

      fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata/${encodeURIComponent(nickname)}`)
        .then(res => res.json())
        .then(data => {
          const u = data.user;
          console.log("[Bori Farm Access]", u);
          window.location.href = "bori-main.html";
        })
        .catch(err => {
          alert("\uC11C\uBC84 \uC5F0\uB3D9\uC5D0 \uC2E4\uD328\uD588\uC2B5\uB2C8\uB2E4. \uB2E4\uC2DC \uC2DC\uB3C4\uD574\uC8FC\uC138\uC694.");
          console.error(err);
        });
    }
  </script>
</body>
</html>
