<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌾 보리 농장 - Barley Farm</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      margin: 0;
      padding: 0;
      background: url('https://byungil-cho.github.io/OrcaX/farm-201.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
    }
    .container {
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      max-width: 500px;
      margin: 80px auto;
      border-radius: 20px;
    }
    h1 {
      font-size: 2rem;
    }
    .user-info {
      margin-bottom: 20px;
    }
    .label {
      font-weight: bold;
    }
    .btn {
      background-color: #00c896;
      border: none;
      color: white;
      padding: 15px 30px;
      font-size: 1rem;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn:hover {
      background-color: #00a57a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌾 보리 농장에 오신 것을 환영합니다!</h1>
    <div class="user-info">
      <p><span class="label">닉네임:</span> <span id="nickname">로딩 중...</span></p>
      <p><span class="label">카카오ID:</span> <span id="kakaoId">로딩 중...</span></p>
      <p><span class="label">ORCX:</span> <span id="orcx">-</span></p>
      <p><span class="label">물:</span> <span id="water">-</span></p>
      <p><span class="label">거름:</span> <span id="fertilizer">-</span></p>
    </div>
    <button class="btn" onclick="goToFactory()">🌾 보리농사 짓기 이동</button>
  </div>

  <script>
    const nickname = localStorage.getItem('nickname');
    const kakaoId = localStorage.getItem('userId');

    if (!nickname || !kakaoId) {
      alert('로그인이 필요합니다.');
      window.location.href = 'index9.html';
    }

    document.getElementById('nickname').textContent = nickname;
    document.getElementById('kakaoId').textContent = kakaoId;

    fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata?kakaoId=${kakaoId}`, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store'
    })
      .then(response => response.json())
      .then(data => {
        const user = data.user;
        if (user) {
          document.getElementById('orcx').textContent = user.orcx || 0;
          document.getElementById('water').textContent = user.water || 0;
          document.getElementById('fertilizer').textContent = user.fertilizer || 0;
        }
      })
      .catch(err => {
        console.error('데이터 불러오기 실패:', err);
      });

    function goToFactory() {
      window.location.href = 'bori-factory.html';
    }
  </script>
</body>
</html>
