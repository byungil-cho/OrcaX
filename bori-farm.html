<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 보리 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: url("https://byungil-cho.github.io/OrcaX/farm-101.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    header {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 1rem;
    }
    main {
      padding: 2rem;
    }
    h1 {
      margin-bottom: 1rem;
    }
    .resource-box {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 300px;
    }
    .status {
      color: red;
    }
    nav a {
      color: #fff;
      margin: 0 10px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌾 OrcaX 보리 농장</h1>
    <div id="server-status" class="status">서버 연결 확인 중...</div>
    <nav>
      <a href="index9.html">메인으로</a> |
      <a href="gamja-shop.html">씨앗구매</a> |
      <a href="bori-factory.html">보리농사 짓기</a>
    </nav>
  </header>
  <main>
    <div class="resource-box">
      <p>👤 닉네임: <span id="nickname">-</span></p>
      <p>💧 물: <span id="water">0</span>개</p>
      <p>🪱 거름: <span id="fertilizer">0</span>개</p>
      <p>🌾 씨보리: <span id="seedBarley">0</span>개</p>
      <p>🪙 ORCX 토큰: <span id="tokens">0</span>개</p>
      <p>📦 보리 보관량: <span id="barleyStorage">0</span>개</p>
    </div>
  </main>

  <script>
  async function loadUserData() {
      const kakaoId = localStorage.getItem("kakaoId");
      const nickname = localStorage.getItem("nickname");

      if (!kakaoId || !nickname) {
        alert("로그인이 필요합니다. 메인 페이지로 이동합니다.");
        window.location.href = "index9.html";
        return;
      }

      document.getElementById("nickname").innerText = nickname;

      try {
        const response = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ kakaoId }),
        });
        const result = await res.json();

        if (result.success) {
          const user = result.user;
          document.getElementById("nickname").textContent = user.nickname || "알 수 없음";
          document.getElementById("water").innerText = user.inventory?.water ?? 0;
          document.getElementById("fertilizer").innerText = user.inventory?.fertilizer ?? 0;
          document.getElementById("orcx").innerText = user.wallet?.orcx ?? 0;
          document.getElementById("potato").innerText = user.storage?.gamja ?? 0;
          document.getElementById("bori").innerText = user.storage?.bori ?? 0;
          document.getElementById("seedPotato").innerText = user.inventory?.seedPotato ?? 0;
          document.getElementById("seedBarley").innerText = user.inventory?.seedBarley ?? 0;

        } else {
          document.getElementById("nickname").textContent = "유저 정보 없음";
        }
      } catch (err) {
        document.getElementById("nickname").textContent = "연결 오류";
      }
    }

    async function checkServer() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata`,);
        if (res.status === 200) {
          document.getElementById("server-status").textContent = "✅ 서버 연결됨";
          document.getElementById("server-status").style.color = "lightgreen";
        } else {
          throw new Error("Ping failed");
        }
      } catch {
        document.getElementById("server-status").textContent = "❌ 서버 연결 실패";
        document.getElementById("server-status").style.color = "red";
      }
    }

    checkServer();
    fetchUserData();
  </script>
</body>
</html>
