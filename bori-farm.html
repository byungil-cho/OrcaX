<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>보리 농장 대시보드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <style>
    body {
      background-image: url("img/bori-background.png");
      background-size: cover;
      background-position: center;
      font-family: 'Nanum Gothic', sans-serif;
      color: white;
      text-align: center;
    }
    .dashboard {
      background-color: rgba(0, 0, 0, 0.3);
      margin: 2rem auto;
      padding: 2rem;
      border-radius: 1rem;
      max-width: 500px;
    }
    .footer {
      margin-top: 2rem;
    }
    .error {
      color: red;
      font-weight: bold;
    }
    .success {
      color: lightgreen;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="dashboard">
      <h2>🌾 보리 농장 대시보드</h2>
      <p>👨‍🌾 농장주: <span id="nickname">-</span></p>
      <p>🌾 농장이름: 하늘농장</p>
      
      <h3>📦 농자재 보관함</h3>
      <p>💧 물: <span id="water">-</span></p>
      <p>🧪 거름: <span id="fertilizer">-</span></p>
      <p>🪙 ORCX: <span id="token">-</span></p>

      <h3>🥔 작물 보관소</h3>
      <p>감자: <span id="potato">-</span></p>
      <p>보리: <span id="barley">-</span></p>

      <h3>🌱 씨앗 보유</h3>
      <p>씨감자: <span id="seedPotato">-</span></p>
      <p>씨보리: <span id="seedBarley">-</span></p>
    </div>

    <div class="footer">
      <button onclick="location.href='bori-factory.html'">🌾 보리 농장 </button>
      <button onclick="location.href='gamja-shop.html'">🛒 씨앗 상점</button>
      <button onclick="location.href='index9.html'">🏡 메인으로</button>
      <p id="status" class="error">⛔ 유저 정보 불러오기 실패</p>
    </div>
  </main>

  <script>
    const kakaoId = localStorage.getItem("kakaoId");

    async function loadUserData() {
      try {
        const res = await fetch("/api/user/v2data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: kakaoId })
        });

        const result = await res.json();

        if (result.success) {
          const user = result.user;
          document.getElementById("nickname").textContent = user.nickname;
          document.getElementById("token").textContent = user.token;
          document.getElementById("seedPotato").textContent = user.inventory.seedPotato;
          document.getElementById("seedBarley").textContent = user.inventory.seedBarley;

          // 보관소 정보 추가 (임시 0 처리)
          document.getElementById("potato").textContent = 0;
          document.getElementById("barley").textContent = 0;
          document.getElementById("water").textContent = 10;
          document.getElementById("fertilizer").textContent = 10;

          document.getElementById("status").textContent = "✅ 유저 정보 불러오기 성공";
          document.getElementById("status").className = "success";
        } else {
          throw new Error("유저 없음");
        }
      } catch (err) {
        document.getElementById("status").textContent = "⛔ 유저 정보 불러오기 실패";
        document.getElementById("status").className = "error";
        console.error("불러오기 실패", err);
      }
    }

    loadUserData();
  </script>
</body>
</html>
