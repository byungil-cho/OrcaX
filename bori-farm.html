<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보리 농장 대시보드</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-201.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 5%;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      display: inline-block;
      border-radius: 12px;
    }
    .section {
      background-color: #ffffff20;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
    }
    .footer {
      margin-top: 20px;
    }
    .footer a {
      color: #FFD700;
      font-weight: bold;
      margin: 0 10px;
      text-decoration: none;
    }
    .status {
      margin-top: 10px;
      color: #00ffcc;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>보리 농장 대시보드</h1>
    <div id="userInfo">
      농장주: <span id="nickname">-</span><br>
      농장이름: <span id="farmName">-</span>
    </div>

    <div class="section">
      <h2>📦 농자재 보관함</h2>
      물: <span id="water">-</span><br>
      거름: <span id="fertilizer">-</span><br>
      ORCX: <span id="orcx">-</span>
    </div>

    <div class="section">
      <h2>🌾 작물 보관소</h2>
      감자: <span id="gamja">-</span><br>
      보리: <span id="bori">-</span>
    </div>

    <div class="section">
      <h2>🌱 씨앗 보유</h2>
      씨감자: <span id="seedPotato">-</span><br>
      씨보리: <span id="seedBarley">-</span>
    </div>

    <div class="footer">
      <a href="bori-main.html">🌾 농장 작명소</a>
      <a href="gamja-shop.html">🛒 씨앗 상점</a>
      <a href="index9.html">🏠 메인으로</a>
    </div>

    <div class="status" id="statusMessage">⏳ 데이터 불러오는 중...</div>
  </div>

  <script>
    const API = "https://climbing-wholly-grouper.jp.ngrok.io/api";
    const nickname = localStorage.getItem("nickname") || "범고래X";
    const farmName = localStorage.getItem("farmName") || "하늘농장";
    const kakaoId = localStorage.getItem("userId") || "unknown";

    document.getElementById("nickname").textContent = nickname;
    document.getElementById("farmName").textContent = farmName;

    async function fetchUserData() {
      const statusEl = document.getElementById("statusMessage");
      statusEl.textContent = "📡 서버 연결 중...";

      try {
        const res = await fetch(`${API}/userdata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, kakaoId })
        });

        const data = await res.json();
        if (data.success) {
          const inv = data.user.inventory || {};
          const storage = data.user.storage || {};
          const wallet = data.user.wallet || {};

          document.getElementById("water").textContent = inv.water ?? "-";
          document.getElementById("fertilizer").textContent = inv.fertilizer ?? "-";
          document.getElementById("orcx").textContent = wallet.orcx ?? "-";
          document.getElementById("gamja").textContent = storage.gamja ?? "-";
          document.getElementById("bori").textContent = storage.bori ?? "-";
          document.getElementById("seedPotato").textContent = inv.seedPotato ?? "-";
          document.getElementById("seedBarley").textContent = inv.seedBarley ?? "-";

          statusEl.textContent = "✅ 데이터 로딩 완료";
        } else {
          statusEl.textContent = "❌ 유저 정보 불러오기 실패";
        }
      } catch (err) {
        console.error("데이터 요청 실패:", err);
        document.getElementById("statusMessage").textContent = "❌ 서버 연결 오류";
      }
    }

    fetchUserData();
  </script>
</body>
</html>
