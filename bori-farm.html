<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보리 농장 대시보드</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-201.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 5%;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.3);
      display: inline-block;
      border-radius: 12px;
    }
    .section {
      background-color: #ffffff20;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
    }
    .footer {
      margin-top: 20px;
    }
    .footer a {
      color: #FFD700;
      font-weight: bold;
      margin: 0 10px;
      text-decoration: none;
    }
    .status {
      margin-top: 10px;
      color: #00ffcc;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>보리 농장 대시보드</h1>
    <div id="userInfo">
      농장주: <span id="nickname">-</span><br>
      농장이름: <span id="farmName">-</span>
    </div>

    <div class="section">
      <h2>📦 농자재 보관함</h2>
      물: <span id="water">0</span><br>
      거름: <span id="fertilizer">0</span><br>
      ORCX: <span id="orcx">0</span>
    </div>

    <div class="section">
      <h2>🌾 작물 보관소</h2>
      감자: <span id="potato">0</span><br>
      보리: <span id="barley">0</span>
    </div>

    <div class="section">
      <h2>🌱 씨앗 보유</h2>
      씨감자: <span id="seedPotato">0</span><br>
      씨보리: <span id="seedBarley">0</span>
    </div>

    <div class="footer">
      <a href="bori-factory.html">🌾 보리 농장</a>
      <a href="gamja-shop.html">🛒 씨앗 상점</a>
      <a href="index9.html">🌱 메인으로</a>
    </div>

    <div class="status" id="statusMessage">⏳ 데이터 불러오는 중...</div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname") || "-";
    const farmName = localStorage.getItem("farmName") || "-";
    const kakaoId = localStorage.getItem("kakaoId") || "unknown";

    document.getElementById("nickname").textContent = nickname;
    document.getElementById("farmName").textContent = farmName;

    async function initUser() {
      try {
        await fetch(`${API_BASE}/api/init-user`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, kakaoId })
        });
      } catch (err) {
        console.warn("⚠️ 유저 초기화 실패", err);
      }
    }

    async function loadUserData() {
      const statusEl = document.getElementById("statusMessage");
      statusEl.textContent = "📡 서버 연결 중...";

      try {
        const res = await fetch(`${API_BASE}/api/userdata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId })
        });

        const data = await res.json();
        const user = data.user;

        if (!user) {
          statusEl.textContent = "❌ 유저 정보 없음";
          return;
        }

        document.getElementById("water").textContent = user.water ?? 0;
        document.getElementById("fertilizer").textContent = user.fertilizer ?? 0;
        document.getElementById("orcx").textContent = user.orcx ?? 0;
        document.getElementById("potato").textContent = user.potato ?? 0;
        document.getElementById("barley").textContent = user.barley ?? 0;
        document.getElementById("seedPotato").textContent = user.seedPotato ?? 0;
        document.getElementById("seedBarley").textContent = user.seedBarley ?? 0;

        statusEl.textContent = "✅ 서버 연결 완료";
      } catch (err) {
        console.error("데이터 로딩 오류:", err);
        document.getElementById("statusMessage").textContent = "❌ 데이터 로딩 실패";
      }
    }

    initUser().then(loadUserData);
  </script>
</body>
</html>
