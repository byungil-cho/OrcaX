<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 보리 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: url("https://byungil-cho.github.io/OrcaX/farm-101.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    header {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 1rem;
    }
    main {
      padding: 2rem;
    }
    h1 {
      margin-bottom: 1rem;
    }
    .resource-box {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem auto;
      width: 300px;
    }
    a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌾 OrcaX 보리 농장</h1>
    <div>
      <a href="index9.html">메인으로</a>
      <a href="gamja-shop.html">씨앗구매</a>
      <a href="bori-factory.html">보리농사 짓기</a>
    </div>
    <div id="server-status" style="margin-top: 10px;">🔴 서버 연결 실패</div>
  </header>
  <main>
    <div id="nickname">🧑‍🌾 닉네임: 로딩 중...</div>
    <div class="resource-box">
      <p>💧 물: <span id="water">-</span> 개</p>
      <p>🌱 거름: <span id="fertilizer">-</span> 개</p>
      <p>🌾 씨보리: <span id="seedBarley">-</span> 개</p>
      <p>🪙 ORCX 토큰: <span id="orcx">-</span> 개</p>
      <p>📦 보리 보관량: <span id="boriStorage">-</span> 개</p>
    </div>
  </main>

  <script>
    const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io';

    async function checkServerStatus() {
      try {
        const res = await fetch(`${API_BASE}/api/init-user`);
        document.getElementById('server-status').innerText = res.ok ? '🟢 서버 연결됨' : '🔴 서버 연결 실패';
      } catch {
        document.getElementById('server-status').innerText = '🔴 서버 연결 실패';
      }
    }

    async function fetchUserData() {
      const kakaoId = localStorage.getItem('kakaoId');
      if (!kakaoId) return;

      try {
        const response = await fetch(`${API_BASE}/api/userdata`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId }),
        });
        const data = await response.json();

        document.getElementById('nickname').innerText = `🧑‍🌾 닉네임: ${data.nickname || '알 수 없음'}`;
        document.getElementById('water').innerText = data.water || 0;
        document.getElementById('fertilizer').innerText = data.fertilizer || 0;
        document.getElementById('seedBarley').innerText = data.seedBarley || 0;
        document.getElementById('orcx').innerText = data.orcx || 0;
        document.getElementById('boriStorage').innerText = (data.bori || 0);
      } catch (e) {
        console.error('유저 데이터 불러오기 실패', e);
      }
    }

    checkServerStatus();
    fetchUserData();
  </script>
</body>
</html>
