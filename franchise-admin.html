<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 가맹 신청서 접수 목록</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 20px;
      color: #333;
      text-align: center;
    }

    h1 {
      color: #003b6f;
      font-size: 1.6rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0 auto;
      max-width: 700px;
      text-align: left;
    }

    li {
      background: #fff;
      margin: 10px auto;
      padding: 15px;
      border-left: 4px solid #0077cc;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      font-size: 0.95rem;
      word-break: break-word;
    }

    .empty {
      font-size: 1.05rem;
      color: #666;
      margin-top: 20px;
    }

    a {
      color: #0077cc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      h1 {
        font-size: 1.3rem;
        flex-direction: column;
      }
      li {
        font-size: 0.9rem;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <h1>📋 OrcaX 가맹 신청서 접수 목록</h1>
  <p class="empty">🔄 데이터를 불러오는 중입니다...</p>
  <ul id="list"></ul>

  <script>
    fetch("https://orcax-franchise-backend.onrender.com/api/apply")
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("list");
        const emptyMsg = document.querySelector(".empty");

        if (!data || data.length === 0) {
          emptyMsg.textContent = "📭 아직 접수된 신청서가 없습니다.";
          return;
        }

        emptyMsg.remove();

        data.forEach(item => {
          const li = document.createElement("li");
          li.innerHTML = `
            <strong>🏷️ 이름:</strong> ${item.name}<br>
            <strong>📞 전화:</strong> ${item.phone}<br>
            <strong>📛 사업자번호:</strong> ${item.corpnum}<br>
            <strong>📍 지역:</strong> ${item.region}<br>
            <strong>🏠 주소:</strong> ${item.address}<br>
            <strong>📂 업종:</strong> ${item.type}<br>
            <strong>📝 비고:</strong> ${item.note || "(없음)"}<br>
            ${item.fileUrl ? `<strong>🖼️ 파일:</strong> <a href="https://orcax-franchise-backend.onrender.com${item.fileUrl}" target="_blank">[보기]</a>` : ""}
          `;
          list.appendChild(li);
        });
      })
      .catch(err => {
        document.querySelector(".empty").textContent = "❌ 데이터를 불러오지 못했습니다.";
        console.error("데이터 요청 실패:", err);
      });
  </script>
</body>
</html>
