<!-- 표 헤더/본문 모두, 원하는 모든 컬럼 추가 -->
<table class="list-table" id="franchiseTable" style="display:none;">
  <thead>
    <tr>
      <th>이름</th>
      <th>상호명</th>
      <th>연락처</th>
      <th>사업자번호</th>
      <th>지역</th>
      <th>주소</th>
      <th>업종</th>
      <th>비고</th>
      <th>신청일</th>
    </tr>
  </thead>
  <tbody id="franchiseList"></tbody>
</table>
<script>
  const API_URL = 'https://orcax-franchise-backend.onrender.com/api/apply';
  async function loadFranchises() {
    const table = document.getElementById('franchiseTable');
    const list = document.getElementById('franchiseList');
    const errorDiv = document.getElementById('error');
    table.style.display = 'none';
    errorDiv.style.display = 'none';
    list.innerHTML = '';
    try {
      const res = await fetch(API_URL, { credentials: 'include' });
      if (!res.ok) throw new Error('서버 응답 실패');
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) {
        errorDiv.innerText = "등록된 신청서가 없습니다.";
        errorDiv.style.display = 'block';
        return;
      }
      data.forEach(f => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${f.name || ''}</td>
          <td>${f.storeName || ''}</td>
          <td>${f.phone || ''}</td>
          <td>${f.corpnum || ''}</td>
          <td>${f.region || ''}</td>
          <td>${f.address || ''}</td>
          <td>${f.type || ''}</td>
          <td>${f.note || ''}</td>
          <td>${(f.createdAt || '').split('T')[0]}</td>
        `;
        list.appendChild(tr);
      });
      table.style.display = 'table';
    } catch (e) {
      errorDiv.innerText = "❌ 데이터를 불러오지 못했습니다.";
      errorDiv.style.display = 'block';
    }
  }
  loadFranchises();
</script>
