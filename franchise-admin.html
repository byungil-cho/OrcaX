<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 가맹 신청서 접수 목록</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: #e9f3fa;
      font-family: 'Noto Sans KR', sans-serif;
      color: #222;
      margin: 0;
      padding: 0;
    }
    .container {
      background: #fff;
      max-width: 700px;
      margin: 40px auto 0 auto;
      border-radius: 12px;
      padding: 40px 24px 32px 24px;
      box-shadow: 0 6px 32px 0 rgba(32,80,110,0.09);
    }
    h2 { text-align: left; color: #224b85; font-size: 2em; margin-top: 0; margin-bottom: 0.6em; }
    .status { font-size: 1.15em; margin-bottom: 20px; color: #23af50; font-weight: 600; }
    .error { color: #e25252; font-size: 1.1em; margin-bottom: 22px; font-weight: bold; text-align: center; }
    .list-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; font-size: 1.03em; }
    .list-table th, .list-table td { padding: 10px 8px; border-bottom: 1px solid #e2e7ee; text-align: left; }
    .list-table th { background: #f4f8fb; color: #1a3864; font-weight: 700; }
    .list-table tr:last-child td { border-bottom: 0; }
    @media (max-width: 700px) {
      .container { max-width: 100%; padding: 16px; }
      h2 { font-size: 1.3em; }
      .list-table th, .list-table td { padding: 7px 4px; font-size: 0.95em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📝 OrcaX 가맹 신청서 접수 목록</h2>
    <div id="status" class="status">● 서버 접속 정상</div>
    <div id="error" class="error" style="display:none;"></div>
   <!-- 표 헤더/본문 모두, 원하는 모든 컬럼 추가 -->
<table class="list-table" id="franchiseTable" style="display:none;">
  <thead>
    <tr>
      <th>이름</th>
      <th>상호명</th>
      <th>연락처</th>
      <th>사업자번호</th>
      <th>지역</th>
      <th>주소</th>
      <th>업종</th>
      <th>비고</th>
      <th>신청일</th>
    </tr>
  </thead>
  <tbody id="franchiseList"></tbody>
</table>
<script>
  const API_URL = 'https://orcax-franchise-backend.onrender.com/api/apply';
  async function loadFranchises() {
    const table = document.getElementById('franchiseTable');
    const list = document.getElementById('franchiseList');
    const errorDiv = document.getElementById('error');
    table.style.display = 'none';
    errorDiv.style.display = 'none';
    list.innerHTML = '';
    try {
      const res = await fetch(API_URL, { credentials: 'include' });
      if (!res.ok) throw new Error('서버 응답 실패');
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) {
        errorDiv.innerText = "등록된 신청서가 없습니다.";
        errorDiv.style.display = 'block';
        return;
      }
      data.forEach(f => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${f.name || ''}</td>
          <td>${f.storeName || ''}</td>
          <td>${f.phone || ''}</td>
          <td>${f.corpnum || ''}</td>
          <td>${f.region || ''}</td>
          <td>${f.address || ''}</td>
          <td>${f.type || ''}</td>
          <td>${f.note || ''}</td>
          <td>${(f.createdAt || '').split('T')[0]}</td>
        `;
        list.appendChild(tr);
      });
      table.style.display = 'table';
    } catch (e) {
      errorDiv.innerText = "❌ 데이터를 불러오지 못했습니다.";
      errorDiv.style.display = 'block';
    }
  }
  loadFranchises();
</script>

</body>
</html>
