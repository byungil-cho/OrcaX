<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>가맹점 신청 관리자</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 1000px; margin: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
    th, td { border: 1px solid #ccc; padding: 0.75rem; text-align: center; }
    th { background-color: #f0f0f0; }
    h2 { color: #007bff; }
    .file-link { color: #0066ff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <h2>가맹점 신청 관리 페이지</h2>
  <table>
    <thead>
      <tr>
        <th>상호명</th>
        <th>연락처</th>
        <th>지역</th>
        <th>업종</th>
        <th>신청일</th>
        <th>사업자등록증</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="6">📡 신청 데이터를 불러오는 중...</td></tr>
    </tbody>
  </table>

  <script>
    async function loadApplications() {
      try {
        const res = await fetch("https://orcax-franchise-backend.onrender.com/admin/applications");
        const data = await res.json();
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";

        data.forEach(app => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${app.name}</td>
            <td>${app.phone}</td>
            <td>${app.region}</td>
            <td>${app.type}</td>
            <td>${new Date(app.createdAt).toLocaleString()}</td>
            <td>
              ${app.file && app.file.originalname
                ? `<a class="file-link" href="https://orcax-franchise-backend.onrender.com/admin/file/${app._id}" target="_blank">📎 파일 보기</a>`
                : "없음"}
            </td>
          `;
          tbody.appendChild(tr);
        });

      } catch (err) {
        document.getElementById("table-body").innerHTML =
          `<tr><td colspan="6">❌ 데이터를 불러오는 데 실패했습니다.</td></tr>`;
        console.error(err);
      }
    }

    loadApplications();
  </script>
</body>
</html>
