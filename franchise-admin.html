<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 가맹 신청서 접수 목록</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      padding: 40px;
      color: #333;
    }
    h1 {
      color: #003b6f;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #fff;
      margin: 10px 0;
      padding: 15px;
      border-left: 5px solid #0077cc;
      box-shadow: 0 0 5px rgba(0,0,0,0.05);
    }
    .empty {
      font-size: 18px;
      margin-top: 30px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>📋 OrcaX 가맹 신청서 접수 목록</h1>
  <p class="empty">🔄 데이터를 불러오는 중입니다...</p>
  <ul id="list"></ul>

  <script>
    fetch("https://orcax-franchise-backend.onrender.com/api/apply")
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("list");
        const emptyMsg = document.querySelector(".empty");

        if (!data || data.length === 0) {
          emptyMsg.textContent = "📭 아직 접수된 신청서가 없습니다.";
          return;
        }

        emptyMsg.remove(); // 데이터 있으면 "불러오는 중..." 메시지 제거

        data.forEach(item => {
          const li = document.createElement("li");
          li.innerHTML = `
            <strong>🏷️ 이름:</strong> ${item.name}<br>
            <strong>📞 전화:</strong> ${item.phone}<br>
            <strong>📛 사업자번호:</strong> ${item.corpnum}<br>
            <strong>📍 지역:</strong> ${item.region}<br>
            <strong>🏠 주소:</strong> ${item.address}<br>
            <strong>📂 업종:</strong> ${item.type}<br>
            <strong>📝 비고:</strong> ${item.note || "(없음)"}<br>
            ${item.fileUrl ? `<strong>🖼️ 파일:</strong> <a href="https://orcax-franchise-backend.onrender.com${item.fileUrl}" target="_blank">[보기]</a>` : ""}
          `;
          list.appendChild(li);
        });
      })
      .catch(err => {
        document.querySelector(".empty").textContent = "❌ 데이터를 불러오지 못했습니다.";
        console.error("데이터 요청 실패:", err);
      });
  </script>
</body>
</html>
