
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 카카오 로그인</title>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      padding: 100px 20px;
      color: #111;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      margin-bottom: 40px;
    }
    .login-btn {
      background-color: #FEE500;
      color: #000;
      padding: 16px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }
    .login-btn:hover {
      background-color: #ffd600;
    }
    .server-status {
      margin-top: 30px;
      font-size: 16px;
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>OrcaX 카카오 로그인</h1>
  <p>계속하려면 카카오 계정으로 로그인하세요.</p>
  <a class="login-btn" href="https://kauth.kakao.com/oauth/authorize?client_id=284b798a9d9be8202f9c2e129fa6f329&redirect_uri=https://byungil-cho.github.io/OrcaX/kakao-callback.html&response_type=code">
    카카오로 로그인
  </a>
  <div class="server-status" id="serverStatus">서버 상태 확인 중...</div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    fetch(`${API_BASE}/`)
      .then(res => {
        if (res.ok) {
          document.getElementById("serverStatus").textContent = "✅ 서버 전원 ON: 감자밭 연결 완료";
          document.getElementById("serverStatus").style.color = "green";
        } else {
          throw new Error("서버 응답 실패");
        }
      })
      .catch(() => {
        document.getElementById("serverStatus").textContent = "❌ 서버 전원 OFF: 감자밭 연결 실패";
      });
  </script>
</body>
</html>
