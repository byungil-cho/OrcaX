<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 회원가입</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #f2f2f2;
      text-align: center;
    }
    .btn {
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: #fee500;
      color: #000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>📋 OrcaX 계약 동의 완료</h1>
  <p>이제 카카오톡 계정으로 로그인해주세요.</p>
  <button class="btn" onclick="goKakaoLogin()">카카오로 로그인</button>

  <script>
    function goKakaoLogin() {
      const client_id="284b798a9d9be8202f9c2e129fa6f329"; // 네 진짜 REST API 키
      const redirect_uri="https://byungil-cho.github.io/OrcaX/kakao-callback.html"; // 등록된 Redirect URI
      const url=`https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=${client_id}&redirect_uri=${encodeURIComponent(redirect_uri)}`;
      window.location.href = url;
    }
  </script>
</body>
</html>
