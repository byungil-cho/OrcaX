<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>보리 공장</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #statusBox {
      font-weight: bold;
      margin-bottom: 10px;
    }
    #resourceInfo {
      background: #333;
      padding: 10px;
      margin: 20px auto;
      border-radius: 8px;
      max-width: 400px;
      display: none;
    }
    #water-btn {
      background-color: #00aaff;
      color: white;
    }
    #fertilizer-btn {
      background-color: #ffc107;
      color: black;
    }
    #harvest-btn {
      background-color: #ffeb3b;
      color: black;
    }
    #next-btn {
      background-color: #66ff66;
      color: black;
      display: none;
    }
  </style>
</head>
<body>
  <div id="statusBox">🔌 서버 연결 확인 중...</div>
  <h1>🌾 보리가 자라고 있습니다</h1>
  <div id="nicknameBox"></div>
  <div id="resourceInfo">
    <p>🥔 감자: <span id="potatoCount">0</span></p>
    <p>🌾 보리: <span id="barleyCount">0</span></p>
    <p>💧 물: <span id="waterCount">0</span> / 🌿 거름: <span id="fertilizerCount">0</span></p>
    <p>🪙 ORCX: <span id="tokenCount">0</span></p>
  </div>

  <button id="water-btn">💧 물 주기</button>
  <button id="fertilizer-btn">🌿 거름 주기</button>
  <button id="harvest-btn">🌾 수확하기</button>

  <div style="margin-top: 30px;">
    <button id="next-btn" onclick="location.href='gamja-result.html'">🚛 감자 가공공장으로 이동</button>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname");

    if (!nickname) {
      alert("로그인이 필요합니다. 로그인 페이지로 이동합니다.");
      window.location.href = "orcax-farm_000.html";
    }

    document.getElementById("nicknameBox").innerText = "👤 로그인 닉네임: " + nickname;

    const statusBox = document.getElementById("statusBox");
    const resourceBox = document.getElementById("resourceInfo");

    async function fetchUserData() {
      try {
        const res = await fetch(API_BASE + "/api/userdata?nickname=" + nickname);
        const data = await res.json();
        if (data.nickname) {
          document.getElementById("potatoCount").innerText = data.potatoCount ?? 0;
          document.getElementById("barleyCount").innerText = data.barleyCount ?? 0;
          document.getElementById("waterCount").innerText = data.water ?? 0;
          document.getElementById("fertilizerCount").innerText = data.fertilizer ?? 0;
          document.getElementById("tokenCount").innerText = data.token ?? 0;
          statusBox.innerText = "✅ 전기 공급 중 (서버 연결됨)";
          statusBox.style.color = "lightgreen";
          resourceBox.style.display = "block";
        } else {
          throw new Error("유저 정보 없음");
        }
      } catch (err) {
        statusBox.innerText = "❌ 서버 연결 실패 (전기 끊김)";
        statusBox.style.color = "red";
        console.error(err);
      }
    }

    document.getElementById("water-btn").onclick = async () => {
      await fetch(API_BASE + "/api/water-barley", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
      });
      fetchUserData();
    };

    document.getElementById("fertilizer-btn").onclick = async () => {
      await fetch(API_BASE + "/api/fertilize-barley", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
      });
      fetchUserData();
    };

    document.getElementById("harvest-btn").onclick = async () => {
      const res = await fetch(API_BASE + "/api/harvest-barley", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
      });

      if (res.ok) {
        alert("🌾 보리를 수확했습니다!");
        document.getElementById("next-btn").style.display = "inline-block";
      } else {
        alert("❌ 수확 중 오류가 발생했습니다.");
      }
      fetchUserData();
    };

    fetchUserData();
  </script>
</body>
</html>
