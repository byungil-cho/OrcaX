<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>보리 공장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #1e1e1e;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    h1 {
      font-size: 2rem;
      color: #fff;
    }
    .status {
      color: #00ff66;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .actions button {
      padding: 10px 20px;
      margin: 1rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .water-btn {
      background-color: #03a9f4;
      color: white;
    }
    .fert-btn {
      background-color: #ffca28;
      color: black;
    }
    .harvest-btn {
      margin-top: 1rem;
      background-color: #ffeb3b;
      color: black;
      font-weight: bold;
    }
    .factory-image {
      font-size: 6rem;
      margin: 2rem 0 1rem;
    }
    .move-button {
      margin-top: 1rem;
      padding: 10px 16px;
      font-size: 1rem;
      background-color: #795548;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <p class="status">✅ 전기 공급 중 (서버 연결됨)</p>
  <h1>🌾 보리가 자라고 있습니다</h1>
  <p>물을 주거나 거름을 주세요!</p>

  <div class="actions">
    <button class="water-btn" onclick="giveWater()">💧 물 주기</button>
    <button class="fert-btn" onclick="giveFertilizer()">🌾 거름 주기</button>
  </div>

  <div class="factory-image">🏪</div>

  <p id="statusText">물: 0번 / 거름: 0번</p>
  <button class="harvest-btn" onclick="harvestBarley()">🌾 수확하기</button>

  <p id="resultText"></p>

  <!-- ✅ 이동 버튼 추가 -->
  <div id="moveLink" style="display:none;">
    <a href="bori-result.html">
      <button class="move-button">📦 보리 가공공장으로 이동</button>
    </a>
  </div>

  <script>
    let waterCount = 0;
    let fertCount = 0;

    function updateStatus() {
      document.getElementById("statusText").innerText = `물: ${waterCount}번 / 거름: ${fertCount}번`;
    }

    function giveWater() {
      waterCount++;
      updateStatus();
    }

    function giveFertilizer() {
      fertCount++;
      updateStatus();
    }

    function harvestBarley() {
      const nickname = localStorage.getItem("nickname") || "범고래X";
      const amount = 5;

      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/harvest-barley", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname, amount }),
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById("resultText").innerText = `🌾 ${amount}말의 보리를 수확했습니다!`;
          document.getElementById("moveLink").style.display = "block"; // ✅ 버튼 표시
        } else {
          alert("수확 실패: " + data.message);
        }
      })
      .catch(err => {
        console.error(err);
        alert("서버 오류 발생");
      });
    }
  </script>
</body>
</html>
