<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>보리 재배</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #water-btn {
      background-color: #00aaff;
      color: white;
    }
    #fertilizer-btn {
      background-color: #ffc107;
      color: black;
    }
    #harvest-btn {
      background-color: #ffeb3b;
      color: black;
    }
    #next-btn {
      background-color: #66ff66;
      color: black;
      display: none;
    }
  </style>
</head>
<body>
  <h3>✅ 전기 공급 중 (서버 연결됨)</h3>
  <h1>🌾 보리가 자라고 있습니다</h1>
  <p>물을 주거나 거름을 주세요!</p>

  <button id="water-btn">💧 물 주기</button>
  <button id="fertilizer-btn">🌾 거름 주기</button>

  <div style="margin: 30px 0;">
    <img src="https://cdn-icons-png.flaticon.com/512/860/860797.png" width="120" alt="농장" />
    <p id="status">물: 0번 / 거름: 0번</p>
  </div>

  <button id="harvest-btn">🌾 수확하기</button>

  <div style="margin-top: 30px;">
    <button id="next-btn" onclick="location.href='gamja-result.html'">🚛 감자 가공공장으로 이동</button>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname") || "손님";
    let waterCount = 0;
    let fertilizerCount = 0;

    document.getElementById("water-btn").onclick = async () => {
      waterCount++;
      updateStatus();
      await fetch("/api/water-barley", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
      });
    };

    document.getElementById("fertilizer-btn").onclick = async () => {
      fertilizerCount++;
      updateStatus();
      await fetch("/api/fertilize-barley", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
      });
    };

    document.getElementById("harvest-btn").onclick = async () => {
      const res = await fetch("/api/harvest-barley", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
      });

      if (res.ok) {
        alert("🌾 보리를 수확했습니다!");
        document.getElementById("next-btn").style.display = "inline-block";
      } else {
        alert("❌ 수확 중 오류가 발생했습니다.");
      }
    };

    function updateStatus() {
      document.getElementById("status").innerText =
        `물: ${waterCount}번 / 거름: ${fertilizerCount}번`;
    }

    updateStatus();
  </script>
</body>
</html>
