<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 보리 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: 'Do Hyeon', sans-serif; background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed; background-size: cover; color: #fff; margin: 0; padding: 0; }
    .main { max-width: 420px; margin: 2.2rem auto; background: rgba(0,0,0,0.45); border-radius: 24px; padding: 2rem 1rem 1.4rem 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.18);}
    h1 { font-size: 2.2rem; margin-bottom: 1rem; text-align: center; }
    .links { text-align: center; margin-bottom: 1rem; }
    .links a { color: #fff; text-decoration: underline; margin: 0 10px; font-size: 1.2rem; }
    .server-status { text-align: center; margin-bottom: 1rem; font-size: 1.1rem; }
    .databox { font-size: 1.13rem; margin: .15rem 0 .2rem 0; text-align: center; }
    .box { background: rgba(0,0,0,0.18); border-radius: 12px; padding: 1rem; margin-bottom: 1.2rem; text-align: center; }
    .label { color: #ffd900; font-size: 1.17rem; font-weight: bold; margin-bottom: .2rem; display: block; }
    .action-btns { display: flex; gap: 1rem; margin-top: 1.2rem; justify-content: center; }
    .action-btns button { flex: 1; background: #ffe689; color: #222; border: none; border-radius: 10px; padding: .8rem 0; font-size: 1.13rem; font-family: inherit; font-weight: 700; margin: 0 .1rem; box-shadow: 0 2px 8px rgba(0,0,0,.12); cursor: pointer; transition: background .14s;}
    .action-btns button:active { background: #ffd900; }
    @media (max-width: 600px) {
      .main { margin: 0.5rem; padding: 1rem 0.5rem; }
      h1 { font-size: 1.4rem; }
      .links a { font-size: 1rem; }
      .action-btns button { font-size: 0.97rem; padding: .6rem 0; }
    }
  </style>
</head>
<body>
  <div class="main">
    <h1>OrcaX 보리 농장</h1>
    <div class="links">
      <a href="index9.html">메인으로</a> |
      <a href="gamja-factory.html">감자농장</a> |
      <a href="gamja-shop.html">상점</a>
    </div>
    <div id="server-status" class="server-status">서버 연결 중...</div>
    <div class="databox">
      닉네임: <span id="nickname">-</span> | 농장이름: <span id="farmName">-</span><br>
      ORCX: <span id="orcx">0</span>
    </div>
    <div class="box">
      <span class="label">🪴 자재 보관함</span>
      물: <span id="water">0</span>,
      거름: <span id="fertilizer">0</span><br>
      씨보리: <span id="seedBarley">0</span>
    </div>
    <div class="box">
      <span class="label">🥚 제품 보관함</span>
      보리: <span id="barleyStorage">0</span>
    </div>
    <div class="databox">
      성장 포인트: <span id="growth">0</span>
    </div>
    <div class="action-btns">
      <button id="waterBtn">물 주기</button>
      <button id="fertBtn">거름 주기</button>
      <button id="harvestBtn">수확</button>
    </div>
  </div>
  <script>
    // 1. 서버에서 실시간 유저 데이터 불러오기
    async function fetchUserData() {
      try {
        document.getElementById("server-status").innerHTML = '서버 연결 중...';
        const res = await fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/userdata', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId: localStorage.getItem("kakaoId") })
        });
        const result = await res.json();
        if (!result.success) {
          document.getElementById("server-status").innerHTML = "<span style='color:#fa5050;'>✗ 서버 연결 실패</span>";
          return;
        }
        const user = result.user;
        document.getElementById("server-status").innerHTML = "<span style='color:#1effa3;'>✔ 서버 연결 성공</span>";
        document.getElementById("nickname").textContent = user.nickname ?? "-";
        document.getElementById("farmName").textContent = localStorage.getItem("farmName") ?? "-";
        document.getElementById("orcx").textContent = user.orcx || user.wallet?.orcx || 0;
        document.getElementById("water").textContent = user.inventory?.water || 0;
        document.getElementById("fertilizer").textContent = user.inventory?.fertilizer || 0;
        document.getElementById("seedBarley").textContent = user.inventory?.seedBarley || 0;
        document.getElementById("barleyStorage").textContent = user.barley || user.storage?.bori || 0;
        document.getElementById("growth").textContent = user.growth?.barley ?? 0;
      } catch (err) {
        document.getElementById("server-status").innerHTML = "<span style='color:#fa5050;'>✗ 서버 연결 실패</span>";
      }
    }

    // 2. 서버에 “물/거름 사용” 기록
    async function useResource(type) {
      const url = 'https://climbing-wholly-grouper.jp.ngrok.io/api/factory/use-resource';
      const data = {
        kakaoId: localStorage.getItem("kakaoId"),
        cropType: "barley",
        water: type === "water" ? 1 : 0,
        fertilizer: type === "fertilizer" ? 2 : 0  // 거름 1번에 2씩 사용
      };
      const res = await fetch(url, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if(result.success) {
        await fetchUserData();
      } else {
        alert(result.message || (type === "water" ? "물 부족!" : "거름 부족!"));
      }
    }

    // 3. 서버에 “수확” 기록
    async function harvest() {
      const res = await fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/factory/harvest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          kakaoId: localStorage.getItem("kakaoId"),
          cropType: "barley"
        })
      });
      const result = await res.json();
      if(result.success) {
        await fetchUserData();
        alert("보리 " + (result.reward || "?") + "개 수확!");
      } else {
        alert(result.message || "수확 불가!");
      }
    }

    window.onload = function() {
      document.getElementById('waterBtn').onclick = () => useResource("water");
      document.getElementById('fertBtn').onclick = () => useResource("fertilizer");
      document.getElementById('harvestBtn').onclick = () => harvest();
      fetchUserData();
    };
  </script>
</body>
</html>
