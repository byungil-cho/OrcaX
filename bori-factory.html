<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 보리 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Do Hyeon', sans-serif; background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed; background-size: cover; margin: 0; color: #fff; text-align: center; }
    .wrapper { background: rgba(0,0,0,0.38); border-radius: 36px; width: 480px; margin: 40px auto 0; padding: 32px 0 44px; }
    h1 { margin-bottom: 0.8em; }
    .status { color: #3ef374; font-size: 1.2em; }
    .error { color: #ff6c6c; }
    .section-title { color: #ffe871; font-weight: bold; margin-top: 1.7em; }
    button { margin: 1.2em 0.6em 0; padding: 0.85em 2.2em; border: none; border-radius: 12px; font-size: 1.2em; background: #ffe871; color: #333; cursor: pointer; font-family: inherit;}
    button:active { background: #ffd500; }
    @media (max-width:600px) {
      .wrapper { width: 95vw; padding: 2vw 0 6vw; }
      button { width: 90vw; margin: 1.2em auto 0; display:block;}
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>OrcaX 보리 농장</h1>
    <div id="server-status" class="status">⏳ 서버 연결 중...</div>
    <div>
      <a href="index.html" style="color:#fff;font-weight:bold;">메인으로</a> |
      <a href="gamja-factory.html" style="color:#fff;font-weight:bold;">감자농장</a> |
      <a href="bori-shop.html" style="color:#fff;font-weight:bold;">상점</a>
    </div>
    <div id="info" style="margin:1.2em 0 1.2em;">
      <div>닉네임: <span id="nickname">-</span> | 농장이름: <span id="farmname">-</span></div>
      <div>ORCX: <span id="orcx">0</span></div>
    </div>
    <div class="section-title">🌱 자재 보관함</div>
    <div>물: <span id="water">0</span>, 거름: <span id="fertilizer">0</span></div>
    <div>씨보리: <span id="seedBarley">0</span></div>
    <div class="section-title">🥚 제품 보관함</div>
    <div>보리: <span id="barley">0</span></div>
    <div style="margin-top:1.8em;">성장 포인트: <span id="growth">0</span></div>
    <button id="water-btn">물 주기</button>
    <button id="fertilizer-btn">거름 주기</button>
    <button id="harvest-btn">수확</button>
    <div id="msg" class="error"></div>
  </div>
  <script>
    const API = "https://climbing-wholly-grouper.jp.ngrok.io";
    let kakaoId = localStorage.getItem("kakaoId") || prompt("카카오ID 입력(테스트)");
    localStorage.setItem("kakaoId", kakaoId);

    function showMsg(msg) { document.getElementById("msg").textContent = msg || ""; }
    function setStatus(ok) {
      document.getElementById('server-status').innerHTML = ok ? "✔️ 서버 연결 성공" : "<span class='error'>❌ 서버 연결 실패</span>";
    }

    // 서버에서 정보 불러오기
    async function fetchUser() {
      try {
        let res = await fetch(API + "/api/userdata", {
          method: "POST",
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ kakaoId })
        });
        let data = await res.json();
        if (!data.success) { setStatus(false); showMsg(data.message); return; }
        setStatus(true);
        const u = data.user;
        document.getElementById("nickname").textContent = u.nickname || "-";
        document.getElementById("orcx").textContent = u.orcx;
        document.getElementById("water").textContent = u.inventory.water;
        document.getElementById("fertilizer").textContent = u.inventory.fertilizer;
        document.getElementById("seedBarley").textContent = u.inventory.seedBarley;
        document.getElementById("barley").textContent = u.barley || 0;
        document.getElementById("growth").textContent = u.growth.barley || 0;
        showMsg("");
      } catch(e) {
        setStatus(false);
        showMsg("서버 연결 불가");
      }
    }

    // 자원 사용 (물/거름)
    async function useResource(w, f) {
      showMsg('');
      let res = await fetch(API + "/api/factory/use-resource", {
        method: "PATCH",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ kakaoId, cropType: "barley", water: w, fertilizer: f })
      });
      let data = await res.json();
      if (data.success) {
        await fetchUser();
      } else {
        showMsg(data.message);
      }
    }

    // 수확하기
    async function harvest() {
      showMsg('');
      let res = await fetch(API + "/api/factory/harvest", {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ kakaoId, cropType: "barley" })
      });
      let data = await res.json();
      if (data.success) {
        await fetchUser();
        showMsg("수확 성공! +" + data.reward + " 보리 획득");
      } else {
        showMsg(data.message);
      }
    }

    // 버튼 연결
    document.getElementById("water-btn").onclick = () => useResource(1, 0);
    document.getElementById("fertilizer-btn").onclick = () => useResource(0, 1);
    document.getElementById("harvest-btn").onclick = () => harvest();

    fetchUser();
  </script>
</body>
</html>
