<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌾 보리 농장</title>
  <style>
/* (기존 스타일 그대로, 생략) */
body {
  margin: 0;
  font-family: 'Do Hyeon', sans-serif;
  background: url('https://byungil-cho.github.io/OrcaX/farm-201.png') no-repeat center top fixed;
  background-size: cover;
  color: #2d1800;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
/* ...이하 스타일 기존과 동일 (생략) ... */
.scroll-area {
  background: rgba(255,255,255,0.25);
  border-radius: 28px;
  box-shadow: 0 4px 32px 0 rgba(50,30,10,0.20);
  margin: 2rem auto;
  padding: 2rem 1.2rem 2rem 1.2rem;
  max-width: 440px;
  width: 95vw;
  min-width: 270px;
  text-align: center;
  backdrop-filter: blur(3.5px);
}
header {
  font-size: 2.2rem;
  margin-bottom: 0.8rem;
  font-weight: bold;
  color: #53340f;
  letter-spacing: 0.5px;
  text-shadow: 1px 2px 12px #ffe9bc, 0 0 2px #633e17;
}
.nickname, .info-bar {
  font-size: 1.12rem;
  margin-bottom: 0.5rem;
  letter-spacing: -0.5px;
  color: #2e1b09;
  font-weight: 600;
  text-shadow: 0 1px 10px #ffecc2ad, 0 0 1px #fff7;
}
.barley-field {
  margin: 1.3rem 0 1.3rem 0;
  color: #321d0c;
}
.status {
  font-size: 1.17rem;
  margin-bottom: 1.1rem;
  font-weight: bold;
  text-shadow: 0 2px 12px #fff6;
}
.grow-buttons button,
#harvest-btn {
  margin: 0.18rem 0.45rem;
  padding: 0.8rem 1.5rem;
  font-size: 1.14rem;
  border-radius: 19px;
  border: none;
  cursor: pointer;
  background: #fffbf8e9;
  box-shadow: 0 1px 8px 0 #bdbdbd45;
  font-weight: bold;
  transition: background 0.14s;
}
.grow-buttons button:active,
#harvest-btn:active {
  background: #f9e7c7e8;
}
.storage-section {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  margin-bottom: 1.1rem;
}
.storage-section div {
  background: #fff9eebd;
  border-radius: 13px;
  padding: 0.65rem 0.3rem;
  font-size: 1.12rem;
  word-break: keep-all;
  color: #3c2107;
  box-shadow: 0 2px 7px #fff6;
  font-weight: 500;
}
.storage-section strong {
  color: #bb7e28;
}
.seedbarley-box {
  margin-top: 0.25rem;
  color: #3b240a;
  font-weight: 700;
  font-size: 1.07rem;
  background: #ffeec2a3;
  border-radius: 8px;
  padding: 0.28rem 0;
  box-shadow: 0 1px 5px #f9eab32c;
}
.nav-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.8rem;
  margin-top: 1.4rem;
}
.nav-buttons a {
  background: #fff6;
  border-radius: 15px;
  padding: 0.7rem 1.2rem;
  text-decoration: none;
  color: #795548;
  font-weight: bold;
  font-size: 1.09rem;
  box-shadow: 0 1px 8px 0 #0001;
  margin-bottom: 0.5rem;
  transition: background 0.14s, color 0.15s;
}
.nav-buttons a:hover {
  background: #ffefc7;
  color: #ae7c26;
}
@media (max-width: 600px) {
  .scroll-area {
    max-width: 99vw;
    min-width: 0;
    padding: 1.1rem 0.3rem 1.3rem 0.3rem;
  }
  header { font-size: 1.34rem; }
}
  </style>
</head>
<body>
  <div class="scroll-area">
    <header>🌾 보리 농장 - Barley Farm</header>

    <div class="nickname">👤 농장주: <span id="nickname">-</span></div>
    <div class="info-bar">
      🌐 전원 상태: <span id="power-status">확인 중...</span> |
      🌾 농장이름: <span id="farm-name">-</span> |
      💰 토큰: <span id="token">-</span>
    </div>

    <div class="barley-field">
      🌱 <span id="barley-status">보리가 자라고 있습니다...</span>
      <div class="status">성장 포인트: <span id="growth">0</span></div>
      <div class="grow-buttons">
        <button onclick="applyWater()">💧 물 주기</button>
        <button onclick="applyFertilizer()">💩 거름 주기</button>
      </div>
      <div id="harvest-container" style="margin-top: 1.5rem;"></div>
    </div>

    <div class="storage-section">
      <div>
        <strong>📦 자재 보관함</strong><br>
        물: <span id="water">0</span>,
        거름: <span id="fertilizer">0</span>
        <div class="seedbarley-box">씨보리: <span id="seed-barley">0</span></div>
      </div>
      <div>
        <strong>🛒 제품 보관함</strong><br>
        보리: <span id="barley">0</span>
      </div>
    </div>

    <div class="nav-buttons">
      <a href="gamja-result.html">감자 보리 가공공장</a>
      <a href="gamja-shop.html">씨감자 씨보리 구매</a>
      <a href="orcax-farm_000.html">메인 페이지</a>
    </div>
  </div>

<script>
const API_URL = "https://climbing-wholly-grouper.jp.ngrok.io";

let kakaoId = localStorage.getItem("kakaoId") || "";
let nickname = localStorage.getItem("nickname") || "익명농부";
let farmName = localStorage.getItem("farmName") || "보리농장";

document.getElementById("nickname").textContent = nickname;
document.getElementById("farm-name").textContent = farmName;
document.getElementById("power-status").textContent = "전기 공급중입니다.";

// 유저 데이터 서버에서 불러오기
async function fetchUserData() {
  if (!kakaoId) return;
  const res = await fetch(API_URL + "/api/userdata", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kakaoId })
  });
  const data = await res.json();
  // --- 실장 디버깅용 로그 추가 ---
  console.log("USERDATA 응답:", data);
  // ---------------------------------
  if (data.success) {
    document.getElementById("token").textContent = data.user.orcx;
    document.getElementById("growth").textContent = data.user.growth?.barley ?? 0;
    // inventory 필드가 있는 경우, 아니면 기본값 fallback
    document.getElementById("water").textContent = (data.user.inventory && data.user.inventory.water !== undefined) ? data.user.inventory.water : (data.user.water ?? 0);
    document.getElementById("fertilizer").textContent = (data.user.inventory && data.user.inventory.fertilizer !== undefined) ? data.user.inventory.fertilizer : (data.user.fertilizer ?? 0);
    // 씨보리(씨앗) 값 표시
    if (data.user.seedBarley !== undefined) {
      document.getElementById("seed-barley").textContent = data.user.seedBarley;
    } else {
      document.getElementById("seed-barley").textContent = "❌(누락)";
      console.warn("서버 응답에 seedBarley가 포함되어 있지 않습니다!");
    }
    document.getElementById("barley").textContent = data.user.barley ?? 0;
    // 상태에 따라 문구 변경
    if ((data.user.growth?.barley ?? 0) === 0) {
      document.getElementById("barley-status").textContent = "보리가 자라기 시작합니다...";
    } else if ((data.user.growth?.barley ?? 0) < 4) {
      document.getElementById("barley-status").textContent = "보리가 무럭무럭 자라는 중입니다...";
    } else {
      document.getElementById("barley-status").textContent = "보리 수확 준비 완료!";
    }
  } else {
    alert("유저 정보를 불러오지 못했습니다!");
  }
}
fetchUserData();

// 물 주기 버튼
async function applyWater() {
  await growBarley("water");
}
// 거름 주기 버튼
async function applyFertilizer() {
  await growBarley("fertilizer");
}

// 성장 포인트 +1 서버 연동
async function growBarley(action) {
  if (!kakaoId) return alert("로그인 정보 없음");
  const res = await fetch(API_URL + "/api/factory/grow", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kakaoId, cropType: "barley", action })
  });
  const data = await res.json();
  if (data.success) {
    document.getElementById("growth").textContent = data.growth?.barley ?? 0;
    document.getElementById("water").textContent = data.inventory.water ?? 0;
    document.getElementById("fertilizer").textContent = data.inventory.fertilizer ?? 0;
    // growBarley 응답에 user.seedBarley가 있으면 업데이트
    if (data.user && data.user.seedBarley !== undefined) {
      document.getElementById("seed-barley").textContent = data.user.seedBarley;
    }
    if ((data.growth?.barley ?? 0) === 0) {
      document.getElementById("barley-status").textContent = "보리가 자라기 시작합니다...";
    } else if ((data.growth?.barley ?? 0) < 4) {
      document.getElementById("barley-status").textContent = "보리가 무럭무럭 자라는 중입니다...";
    } else {
      document.getElementById("barley-status").textContent = "보리 수확 준비 완료!";
    }
    showHarvestBtn(data.growth?.barley ?? 0);
  } else {
    alert(data.message || "성장 실패");
  }
}

// 수확하기 버튼 동작
function showHarvestBtn(growth) {
  const c = document.getElementById("harvest-container");
  c.innerHTML = "";
  if (growth >= 4) {
    const btn = document.createElement("button");
    btn.textContent = "🌾 수확하기";
    btn.id = "harvest-btn";
    btn.onclick = async function() {
      const res = await fetch(API_URL + "/api/factory/harvest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kakaoId, cropType: "barley" })
      });
      const data = await res.json();
      if (data.success) {
        alert(`🎉 보리 ${data.reward}말을 수확했습니다!`);
        document.getElementById("growth").textContent = 0;
        fetchUserData();
        c.innerHTML = "";
      } else {
        alert(data.message || "수확 실패");
      }
    };
    c.appendChild(btn);
  }
}

// 페이지 진입 시 성장 포인트에 따라 수확 버튼 표시
window.addEventListener("DOMContentLoaded", async () => {
  await fetchUserData();
  const g = document.getElementById("growth").textContent;
  showHarvestBtn(Number(g));
});
</script>
</body>
</html>
