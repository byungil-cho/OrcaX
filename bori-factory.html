<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌾 보리 농장</title>
  <style>
body {
  margin: 0;
  font-family: 'Do Hyeon', sans-serif;
  background: url('https://byungil-cho.github.io/OrcaX/farm-201.png') no-repeat center top fixed;
  background-size: cover;
  color: #3e2723;
  min-height: 100vh;
  /* 👉 화면 꽉 채우기 */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.scroll-area {
  background: rgba(255,255,255,0.1);
  border-radius: 24px;
  box-shadow: 0 4px 24px 0 rgba(0,0,0,0.12);
  margin: 2rem auto;
  padding: 2rem 1.2rem 2rem 1.2rem;
  max-width: 420px;
  width: 92vw;
  min-width: 280px;
  text-align: center;
  backdrop-filter: blur(3px);
}
header {
  font-size: 2.2rem;
  margin-bottom: 1rem;
  font-weight: bold;
}
.nickname, .info-bar {
  font-size: 1.12rem;
  margin-bottom: 0.7rem;
  letter-spacing: -1px;
}
.barley-field {
  margin: 1.2rem 0 1.2rem 0;
}
.status {
  font-size: 1.16rem;
  margin-bottom: 1rem;
}
.grow-buttons button,
#harvest-btn {
  margin: 0.2rem 0.5rem;
  padding: 0.8rem 1.4rem;
  font-size: 1.15rem;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  background: #fafafab7;
  box-shadow: 0 1px 6px 0 #bdbdbd4a;
  transition: background 0.16s;
}
.grow-buttons button:active,
#harvest-btn:active {
  background: #e6e6e6de;
}
.storage-section {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  margin-bottom: 1.2rem;
}
.storage-section div {
  background: #fff8;
  border-radius: 12px;
  padding: 0.6rem;
  font-size: 1.08rem;
  word-break: keep-all;
}
.nav-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.8rem;
  margin-top: 1.6rem;
}
.nav-buttons a {
  background: #fff6;
  border-radius: 14px;
  padding: 0.7rem 1.2rem;
  text-decoration: none;
  color: #795548;
  font-weight: bold;
  font-size: 1.08rem;
  box-shadow: 0 1px 8px 0 #0001;
  margin-bottom: 0.5rem;
}
@media (max-width: 600px) {
  .scroll-area {
    max-width: 98vw;
    min-width: 0;
    padding: 1.1rem 0.3rem 1.3rem 0.3rem;
  }
  header { font-size: 1.26rem; }
}
</style>
</head>
<body>
  <div class="scroll-area">
    <header>🌾 보리 농장 - Barley Farm</header>

    <div class="nickname">👤 농장주: <span id="nickname">-</span></div>
    <div class="info-bar">
      🌐 전원 상태: <span id="power-status">확인 중...</span> |
      🌾 농장이름: <span id="farm-name">-</span> |
      💰 토큰: <span id="token">-</span>
    </div>

    <div class="barley-field">
      🌱 보리가 자라고 있습니다...
      <div class="status">성장 포인트: <span id="growth">0</span></div>
      <div class="grow-buttons">
        <button onclick="applyWater()">💧 물 주기</button>
        <button onclick="applyFertilizer()">💩 거름 주기</button>
      </div>
      <div id="harvest-container" style="margin-top: 1.5rem;"></div>
    </div>

    <div class="storage-section">
      <div><strong>📦 자재 보관함</strong><br><div id="materials">-</div></div>
      <div><strong>🛒 제품 보관함</strong><br><div id="products">-</div></div>
    </div>

    <div class="nav-buttons">
      <a href="gamja-result.html">감자 보리 가공공장</a>
      <a href="gamja-shop.html">씨감자 씨보리 구매</a>
      <a href="orcax-farm_000.html">메인 페이지</a>
    </div>
  </div>

<script>
const API_URL = "https://climbing-wholly-grouper.jp.ngrok.io"; // 주인님 고정 도메인

let kakaoId = localStorage.getItem("kakaoId") || ""; // 로그인시 저장된 kakaoId 사용
let nickname = localStorage.getItem("nickname") || "익명농부";
let farmName = localStorage.getItem("farmName") || "보리농장";

document.getElementById("nickname").textContent = nickname;
document.getElementById("farm-name").textContent = farmName;
document.getElementById("power-status").textContent = "전기 공급중입니다.";

// 유저 데이터 서버에서 불러오기
async function fetchUserData() {
  if (!kakaoId) return;
  const res = await fetch(API_URL + "/api/userdata", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kakaoId })
  });
  const data = await res.json();
  if (data.success) {
    document.getElementById("token").textContent = data.user.orcx;
    document.getElementById("growth").textContent = data.user.growth?.barley ?? 0;
    document.getElementById("materials").textContent = 
      `물: ${data.user.inventory.water ?? 0}, 거름: ${data.user.inventory.fertilizer ?? 0}`;
    document.getElementById("products").textContent = 
      `보리: ${data.user.barley ?? 0}`;
  } else {
    alert("유저 정보를 불러오지 못했습니다!");
  }
}
fetchUserData();

// 물 주기 버튼
async function applyWater() {
  await growBarley("water");
}
// 거름 주기 버튼
async function applyFertilizer() {
  await growBarley("fertilizer");
}

// 성장 포인트 +1 서버 연동
async function growBarley(action) {
  if (!kakaoId) return alert("로그인 정보 없음");
  const res = await fetch(API_URL + "/api/factory/grow", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kakaoId, cropType: "barley", action }) // cropType: barley 고정
  });
  const data = await res.json();
  if (data.success) {
    document.getElementById("growth").textContent = data.growth?.barley ?? 0;
    document.getElementById("materials").textContent = 
      `물: ${data.inventory.water ?? 0}, 거름: ${data.inventory.fertilizer ?? 0}`;
    showHarvestBtn(data.growth?.barley ?? 0);
  } else {
    alert(data.message || "성장 실패");
  }
}

// 수확하기 버튼 동작
function showHarvestBtn(growth) {
  const c = document.getElementById("harvest-container");
  c.innerHTML = "";
  if (growth >= 4) {
    const btn = document.createElement("button");
    btn.textContent = "🌾 수확하기";
    btn.id = "harvest-btn";
    btn.onclick = async function() {
      const res = await fetch(API_URL + "/api/factory/harvest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kakaoId, cropType: "barley" })
      });
      const data = await res.json();
      if (data.success) {
        alert(`🎉 보리 ${data.reward}말을 수확했습니다!`);
        document.getElementById("growth").textContent = 0;
        fetchUserData();
        c.innerHTML = "";
      } else {
        alert(data.message || "수확 실패");
      }
    };
    c.appendChild(btn);
  }
}

// 페이지 진입 시 성장 포인트에 따라 수확 버튼 표시
window.addEventListener("DOMContentLoaded", async () => {
  await fetchUserData();
  // 현재 성장 포인트로 수확 버튼 보이기
  const g = document.getElementById("growth").textContent;
  showHarvestBtn(Number(g));
});
</script>
</body>
</html>
