<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OrcaX 보리 농장</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }
    .container {
      max-width: 450px;
      margin: 2rem auto;
      padding: 1rem;
      background: rgba(0,0,0,0.38);
      border-radius: 18px;
      text-align: center;
    }
    .status {
      margin: 0.8rem 0 1.5rem 0;
      font-weight: bold;
      font-size: 1.15rem;
    }
    .status.success { color: #44ffbc; }
    .status.fail { color: #ff648a; }
    h1 { margin: 1rem 0 0.5rem; font-size: 2.1rem; }
    .menu-link { color: #fff; font-weight: bold; margin: 0 0.5em; text-decoration: underline; cursor: pointer; }
    .menu-link:hover { color: #44ffbc; }
    .section { margin-bottom: 1.2rem; }
    .box {
      background: rgba(34,34,34,0.25);
      padding: 0.7em 0.5em;
      border-radius: 12px;
      margin: 0.2em 0 0.7em;
    }
    .label { font-size: 1.18rem; color: #ffd34e; font-weight: 700; }
    .btns { display: flex; gap: 1rem; justify-content: center; margin: 1.2rem 0; }
    button {
      flex: 1 1 0;
      padding: 0.7em 0;
      font-size: 1.1rem;
      border: none;
      border-radius: 12px;
      background: #fff8db;
      color: #333;
      font-family: inherit;
      font-weight: bold;
      transition: background 0.2s;
      cursor: pointer;
    }
    button:hover { background: #ffe28b; }
    @media (max-width: 600px) {
      .container { max-width: 98vw; padding: 0.6rem; }
      h1 { font-size: 1.35rem; }
      button { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OrcaX 보리 농장</h1>
    <div>
      <a class="menu-link" href="index9.html">메인으로</a> |
      <a class="menu-link" href="gamja-factory.html">감자농장</a> |
      <a class="menu-link" href="gamja-shop.html">상점</a>
    </div>
    <div id="serverStatus" class="status">서버 상태 확인중...</div>
    <div style="margin-top:1rem;">
      <span id="nickname">닉네임:</span> | 
      <span id="farmName">농장이름:</span>
    </div>
    <div id="orcx" style="margin-bottom:0.8rem;">ORCX: 0</div>
    <div class="section box">
      <div class="label">📦 자재 보관함</div>
      <div>물: <span id="water">0</span>, 거름: <span id="fertilizer">0</span></div>
      <div>씨보리: <span id="seedBarley">0</span></div>
    </div>
    <div class="section box">
      <div class="label">🥔 제품 보관함</div>
      <div>보리: <span id="barley">0</span></div>
    </div>
    <div style="margin-bottom:0.7rem;">성장 포인트: <span id="growPoint">0</span></div>
    <div class="btns">
      <button id="waterBtn">물 주기</button>
      <button id="fertBtn">거름 주기</button>
      <button id="harvestBtn">수확</button>
    </div>
  </div>
  <script>
    const serverStatusEl = document.getElementById('serverStatus');
    const API_URL = 'https://climbing-wholly-grouper.jp.ngrok.io';

    // 서버 상태 확인
    async function checkServer() {
      try {
        const res = await fetch(API_URL + '/api/ping', {method: 'GET'});
        if (res.ok) {
          serverStatusEl.textContent = '✔ 서버 연결 성공';
          serverStatusEl.classList.remove('fail');
          serverStatusEl.classList.add('success');
        } else {
          throw new Error('서버 연결 실패');
        }
      } catch(e) {
        serverStatusEl.textContent = '✗ 서버 연결 실패';
        serverStatusEl.classList.remove('success');
        serverStatusEl.classList.add('fail');
      }
    }

    // 유저 데이터 불러오기
    async function loadUser() {
      try {
        const res = await fetch(API_URL + '/api/userdata', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({})
        });
        if(!res.ok) return;
        const user = await res.json();
        document.getElementById('nickname').textContent = `닉네임: ${user.nickname || '-'}`;
        document.getElementById('farmName').textContent = `농장이름: ${user.farmName || '-'}`;
        document.getElementById('orcx').textContent = `ORCX: ${user.orcx || 0}`;
        document.getElementById('water').textContent = user.water || 0;
        document.getElementById('fertilizer').textContent = user.fertilizer || 0;
        document.getElementById('seedBarley').textContent = user.seedBarley || 0;
        document.getElementById('barley').textContent = (user.storage && user.storage.bori) ? user.storage.bori : 0;
        document.getElementById('growPoint').textContent = (user.growth && user.growth.barley) ? user.growth.barley : 0;
      } catch (e) { /* 오류 무시 */ }
    }

    // 버튼 이벤트 - (예시, 실제 동작 구현 필요)
    document.getElementById('waterBtn').onclick = () => alert('물 주기!');
    document.getElementById('fertBtn').onclick = () => alert('거름 주기!');
    document.getElementById('harvestBtn').onclick = () => alert('수확!');

    checkServer();
    loadUser();
  </script>
</body>
</html>
