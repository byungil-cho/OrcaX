<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OrcaX Home</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .logo {
      max-width: 300px;
      margin-bottom: 2rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #00bfff;
    }

    p {
      color: #ccc;
      margin-bottom: 2rem;
    }

    .btn {
      background: #00bfff;
      border: none;
      color: black;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      margin: 0 10px;
      transition: 0.2s ease;
      min-width: 120px;
      text-align: center;
    }

    .btn:hover {
      background: #00a3cc;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <img src="https://byungil-cho.github.io/OrcaX/logo_01.jpg" alt="OrcaX 로고" class="logo" />
  <h1>Welcome to OrcaX</h1>
  <p>신뢰와 혁신이 만나는 공간</p>
  <div class="button-group">
    <button class="btn" onclick="location.href='https://byungil-cho.github.io/OrcaX/index.html'">범고래</button>
    <button class="btn" onclick="location.href='https://byungil-cho.github.io/OrcaX/NEXT/frontend/aboutyou.html'">X ?</button>
  </div>
</body>
</html>
