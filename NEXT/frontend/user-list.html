<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입자 명부</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ccc;
      text-align: center;
    }
    th {
      background-color: #3498db;
      color: white;
    }
    #error {
      text-align: center;
      color: red;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>가입자 명부</h1>
  <table>
    <thead>
      <tr>
        <th>이름</th>
        <th>전화</th>
        <th>이메일</th>
        <th>닉네임</th>
        <th>가입일</th>
      </tr>
    </thead>
    <tbody id="user-table"></tbody>
  </table>
  <div id="error"></div>

  <script>
    fetch("https://orcax-franchise-backend.onrender.com/api/apply")
      .then(res => {
        if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
        return res.json();
      })
      .then(users => {
        if (!Array.isArray(users)) throw new Error("잘못된 형식의 데이터");
        const table = document.getElementById("user-table");
        table.innerHTML = users.map(u => {
          const email = u.email || u.mail || "";
          const nickname = u.nickname || u.nick || "";
          return `<tr>
            <td>${u.name || ''}</td>
            <td>${u.phone || ''}</td>
            <td>${email}</td>
            <td>${nickname}</td>
            <td>${u.createdAt ? new Date(u.createdAt).toLocaleString() : ''}</td>
          </tr>`;
        }).join("");
      })
      .catch(err => {
        console.error(err);
        document.getElementById("error").textContent = `명부 로드 실패: ${err.message}`;
      });
  </script>
</body>
</html>
