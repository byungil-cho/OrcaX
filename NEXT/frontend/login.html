<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }

    h2 {
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      background-color: #3498db;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 1rem;
    }

    .btn.gray {
      background-color: #ccc;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>로그인</h2>
    <input type="text" id="nickname" placeholder="닉네임 입력" />
    <button class="btn" onclick="login()">로그인</button>
    <button class="btn gray" onclick="goSignup()">회원가입 하러 가기</button>
  </div>

  <script>
    // 로그인 상태 유지 확인
    window.onload = function () {
      const user = localStorage.getItem("user");
      if (user) {
        alert("이미 로그인된 사용자입니다.");
        location.href = "index.html"; // 로그인된 사용자는 오픈방으로 이동
      }
    };

    function login() {
      const nickname = document.getElementById("nickname").value.trim();
      if (!nickname) {
        alert("닉네임을 입력하세요!");
        return;
      }

      localStorage.setItem("user", nickname);
      alert(`${nickname}님 환영합니다!`);
      location.href = "index.html";
    }

    function goSignup() {
      location.href = "signup-form.html";
    }
  </script>
</body>
</html>
