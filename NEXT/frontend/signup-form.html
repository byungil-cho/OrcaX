<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-container {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #3498db;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #error {
      color: red;
      text-align: center;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>회원가입</h2>
    <input type="text" id="name" placeholder="이름" required />
    <input type="text" id="phone" placeholder="전화번호" required />
    <input type="email" id="email" placeholder="이메일" required />
    <input type="text" id="nickname" placeholder="닉네임" required />
    <input type="password" id="password" placeholder="비밀번호" required />
    <input type="password" id="confirm" placeholder="비밀번호 확인" required />
    <div id="error"></div>
    <button onclick="submitSignup()">가입하기</button>
  </div>

  <script>
    async function submitSignup() {
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const nickname = document.getElementById("nickname").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      const errorDiv = document.getElementById("error");
      errorDiv.textContent = "";

      if (!name || !phone || !email || !nickname || !password || !confirm) {
        errorDiv.textContent = "모든 항목을 입력하세요.";
        return;
      }

      if (password !== confirm) {
        errorDiv.textContent = "비밀번호가 일치하지 않습니다.";
        return;
      }

      try {
        const res = await fetch("https://orcax-franchise-backend.onrender.com/api/apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, phone, email, nickname, password })
        });

        if (!res.ok) throw new Error("서버 오류");

        alert("회원가입이 완료되었습니다!");
        location.href = "user-list.html";
      } catch (err) {
        console.error(err);
        errorDiv.textContent = "서버 오류가 발생했습니다.";
      }
    }
  </script>
</body>
</html>
