<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2f2f2;
      padding: 2rem;
    }
    .form-box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background-color: #3498db;
      border: none;
      color: white;
      border-radius: 6px;
      font-size: 1rem;
    }
    #nickname-status, #error-message {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    #nickname-status { color: green; }
    #error-message { color: red; }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>회원가입</h2>
    <input type="text" id="name" placeholder="이름" required />
    <input type="text" id="phone" placeholder="전화번호" required />
    <input type="email" id="email" placeholder="이메일" required />
    <input type="text" id="nickname" placeholder="닉네임" onblur="checkNickname()" required />
    <div id="nickname-status"></div>
    <input type="password" id="password" placeholder="비밀번호" required />
    <input type="password" id="confirm" placeholder="비밀번호 확인" required />
    <div id="error-message"></div>
    <button onclick="submitSignup()">가입하기</button>
  </div>

  <script>
    const BASE_URL = "http://localhost:3040"; // 배포 시 수정 필요

    async function checkNickname() {
      const nickname = document.getElementById('nickname').value;
      if (!nickname) return;
      try {
        const res = await fetch(`${BASE_URL}/api/users/check?nickname=${encodeURIComponent(nickname)}`);
        const result = await res.json();
        const status = document.getElementById('nickname-status');
        status.textContent = result.exists ? '이미 사용 중인 닉네임입니다.' : '사용 가능한 닉네임입니다.';
        status.style.color = result.exists ? 'red' : 'green';
      } catch (e) {
        console.error("중복 확인 실패", e);
      }
    }

    async function submitSignup() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const nickname = document.getElementById('nickname').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const errorBox = document.getElementById('error-message');
      errorBox.textContent = "";

      if (password !== confirm) {
        errorBox.textContent = "비밀번호가 일치하지 않습니다.";
        return;
      }

      try {
        const res = await fetch(`${BASE_URL}/api/users/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, phone, email, nickname, password })
        });

        const result = await res.json();
        if (res.ok) {
          alert("가입이 완료되었습니다. 로그인 페이지로 이동합니다.");
          window.location.href = "login.html";
        } else {
          errorBox.textContent = result.message || "가입 실패";
        }
      } catch (err) {
        errorBox.textContent = "서버 오류 발생";
        console.error(err);
      }
    }
  </script>
</body>
</html>
