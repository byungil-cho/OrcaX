<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌳 OrcaX 농장 입구</title>
  <style>
    body { margin:0; padding:0; background:url('https://byungil-cho.github.io/OrcaX/farm-000_01.png') no-repeat center center fixed; background-size:cover; font-family:'Pretendard',sans-serif; color:white; text-align:center; }
    .container { padding-top:12vh; }
    h1 { font-size:2.2rem; margin-bottom:0.5rem; background:rgba(0,0,0,0.6); display:inline-block; padding:0.5rem 1rem; border-radius:10px; }
    .nickname { margin-top:1.5rem; font-size:1.2rem; font-weight:bold; background:rgba(0,0,0,0.6); display:inline-block; padding:0.4rem 1rem; border-radius:10px; }
    .field-section { margin-top:2rem; display:flex; justify-content:center; gap:3rem; flex-wrap:wrap; }
    .field { cursor:pointer; }
    .field img { width:180px; border-radius:10px; box-shadow:0 0 10px black; }
    .field span { display:block; margin-top:0.5rem; background:rgba(0,0,0,0.5); padding:0.2rem 0.6rem; border-radius:6px; font-weight:bold; }
    .kakao-btn { margin-top:2.5rem; background:#FEE500; color:#000; border:none; padding:1rem 2rem; border-radius:8px; font-size:1.1rem; cursor:pointer; font-weight:bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐳 OrcaX 농장 입구</h1>
    <div id="nicknameDisplay" class="nickname" style="display:none;"></div>

    <div class="field-section">
      <div class="field" onclick="enterFarm('gamja-farm.html')">
        <img src="https://byungil-cho.github.io/OrcaX/farm-101.png" alt="감자 밭">
        <span>🥔 감자 밭</span>
      </div>
      <div class="field" onclick="enterFarm('bori-farm.html')">
        <img src="https://byungil-cho.github.io/OrcaX/farm-201.png" alt="보리 밭">
        <span>🌾 보리 밭</span>
      </div>
    </div>

    <button id="loginBtn" class="kakao-btn" onclick="goKakaoLogin()">카카오 로그인</button>
    <button id="logoutBtn" class="kakao-btn" style="display:none;background:#ff4d4d;" onclick="logout()">로그아웃</button>
  </div>

  <script>
    const CLIENT_ID = '284b798a9d9be8202f9c2e129fa6f329';
    const REDIRECT_URI = 'https://byungil-cho.github.io/OrcaX/kakao-callback.html';

    function showLoginState() {
      const kakaoId = localStorage.getItem('kakaoId');
      const nickname = localStorage.getItem('nickname');
      if (kakaoId) {
        const el = document.getElementById('nicknameDisplay');
        el.textContent = `👤 ${nickname || ''}님`; el.style.display = 'inline-block';
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'inline-block';
      } else {
        document.getElementById('loginBtn').style.display = 'inline-block';
        document.getElementById('logoutBtn').style.display = 'none';
      }
    }

    function goKakaoLogin() {
      const authUrl = `https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
      window.location.href = authUrl;
    }

    function logout() {
      localStorage.removeItem('kakaoId');
      localStorage.removeItem('nickname');
      localStorage.removeItem('registered');
      location.reload();
    }

    function enterFarm(page) {
      if (!localStorage.getItem('kakaoId')) {
        alert('로그인 후 입장 가능합니다.');
      } else {
        window.location.href = page;
      }
    }

    document.addEventListener('DOMContentLoaded', showLoginState);
  </script>
</body>
</html>
