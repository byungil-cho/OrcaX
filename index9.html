<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌳 OrcaX 농장 입구</title>
  <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('https://byungil-cho.github.io/OrcaX/farm-000_01.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      color: white;
    }
    .container { padding-top: 12vh; }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      background-color: rgba(0,0,0,0.6);
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 10px;
    }
    .nickname {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      background-color: rgba(0, 0, 0, 0.6);
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 10px;
    }
    .field-section {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
    }
    .field {
      display: inline-block;
      cursor: pointer;
    }
    .field img {
      width: 180px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px black;
    }
    .field span {
      display: block;
      margin-top: 0.5rem;
      background: rgba(0,0,0,0.5);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-weight: bold;
    }
    .bottom-links {
      margin-top: 3rem;
      font-size: 0.9rem;
    }
    .bottom-links a {
      display: inline-block;
      background: rgba(255,255,255,0.8);
      padding: 0.4rem 0.8rem;
      color: #222;
      margin: 0 0.5rem;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .kakao-btn {
      margin-top: 2.5rem;
      background: #FEE500;
      color: #000;
      border: none;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
    }
    @media (max-width: 768px) {
      .field img { width: 140px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐳 OrcaX 농장 입구</h1>
    <div id="nicknameDisplay" class="nickname" style="display: none;"></div>

    <div class="field-section">
      <div class="field" onclick="enterFarm('https://byungil-cho.github.io/OrcaX/gamja-farm.html')">
        <img src="https://byungil-cho.github.io/OrcaX/farm-101.png" alt="감자 밭">
        <span>🥔 감자 밭</span>
      </div>
      <div class="field" onclick="enterFarm('https://byungil-cho.github.io/OrcaX/bori-farm.html')">
        <img src="https://byungil-cho.github.io/OrcaX/farm-201.png" alt="보리 밭">
        <span>🌾 보리 밭</span>
      </div>
    </div>

    <div class="bottom-links">
      <a href="index.html">⬅ 농장 밖으로</a>
      <a href="auction-house.html">📊 경매장 입장</a>
    </div>

    <button id="loginBtn" class="kakao-btn">카카오 로그인</button>
    <button id="logoutBtn" class="kakao-btn" style="display: none; background-color: #ff4d4d;">로그아웃</button>
  </div>

  <script>
    const CLIENT_ID = '284b798a9d9be8202f9c2e129fa6f329';
    const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io';

    // SDK 초기화
    Kakao.init(CLIENT_ID);

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const nicknameEl = document.getElementById('nicknameDisplay');

    // 로그인 상태 표시
    function showLoginState() {
      const kakaoId = localStorage.getItem('kakaoId');
      const nickname = localStorage.getItem('nickname');
      if (kakaoId && nickname) {
        nicknameEl.textContent = '👤 ' + nickname + '님, 환영합니다!';
        nicknameEl.style.display = 'inline-block';
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
      }
    }

    // 카카오 로그인 via JS SDK
    loginBtn.addEventListener('click', () => {
      Kakao.Auth.login({
        success: authObj => {
          Kakao.API.request({
            url: '/v2/user/me',
            success: res => {
              const kakaoId = String(res.id);
              const nickname = res.properties.nickname;
              localStorage.setItem('kakaoId', kakaoId);
              localStorage.setItem('nickname', nickname);
              localStorage.setItem('lastLogin', Date.now().toString());
              registerUser(kakaoId, nickname);
              showLoginState();
            },
            fail: err => {
              console.error('프로필 요청 실패', err);
              alert('로그인 정보 취득에 실패했습니다.');
            }
          });
        },
        fail: err => {
          console.error('카카오 로그인 실패', err);
          alert('로그인에 실패했습니다.');
        }
      });
    });

    // 로그아웃
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('kakaoId');
      localStorage.removeItem('nickname');
      localStorage.removeItem('lastLogin');
      alert('로그아웃 되었습니다.');
      location.reload();
    });

    // 농장 입장
    function enterFarm(url) {
      const kakaoId = localStorage.getItem('kakaoId');
      if (!kakaoId) {
        alert('로그인 후 입장하실 수 있습니다.');
      } else {
        window.location.href = url;
      }
    }

    // 서버에 유저 등록
    async function registerUser(kakaoId, nickname) {
      try {
        const res = await fetch(`${API_BASE}/api/login/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId, nickname })
        });
        console.log('서버 응답:', await res.json());
      } catch (err) {
        console.error('서버 등록 오류:', err);
      }
    }

    // 초기 로드 시 로그인 상태 확인
    showLoginState();
  </script>
</body>
</html>
