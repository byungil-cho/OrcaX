<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌳 OrcaX 농장 입구</title>
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('https://byungil-cho.github.io/OrcaX/farm-000_01.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      color: white;
    }
    .container { padding-top: 12vh; }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      background-color: rgba(0,0,0,0.6);
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 10px;
    }
    .nickname {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      background-color: rgba(0, 0, 0, 0.6);
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 10px;
    }
    .field-section {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
    }
    .field {
      cursor: pointer;
    }
    .field img {
      width: 180px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px black;
    }
    .field span {
      display: block;
      margin-top: 0.5rem;
      background: rgba(0,0,0,0.5);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-weight: bold;
    }
    .bottom-links {
      margin-top: 3rem;
      font-size: 0.9rem;
    }
    .bottom-links a {
      display: inline-block;
      background: rgba(255,255,255,0.8);
      padding: 0.4rem 0.8rem;
      color: #222;
      margin: 0 0.5rem;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .kakao-btn {
      margin-top: 2.5rem;
      background: #FEE500;
      color: #000;
      border: none;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
    }
    @media (max-width: 768px) {
      .field img { width: 140px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐳 OrcaX 농장 입구</h1>
    <div id="nicknameDisplay" class="nickname" style="display: none;"></div>

    <div class="field-section">
      <div class="field" onclick="enterFarm('gamja-farm.html')">
        <img src="https://byungil-cho.github.io/OrcaX/farm-101.png" alt="감자 밭">
        <span>🥔 감자 밭</span>
      </div>
      <div class="field" onclick="enterFarm('bori-farm.html')">
        <img src="https://byungil-cho.github.io/OrcaX/farm-201.png" alt="보리 밭">
        <span>🌾 보리 밭</span>
      </div>
    </div>

    <div class="bottom-links">
      <a href="index.html">⬅ 농장 밖으로</a>
      <a href="auction-house.html">📊 경매장 입장</a>
      <a href="game.html" target="_blank">🎮 게임설명(Game Guide)</a>
    </div>

    <button id="loginBtn" class="kakao-btn" onclick="goKakaoLogin()">카카오 로그인</button>
    <button id="logoutBtn" class="kakao-btn" style="display: none; background-color: #ff4d4d;" onclick="logout()">로그아웃</button>
  
    <!-- 옥수수 농장 빠른입장 (이미지 로테이션) -->
    <div id="cornTeaser" style="margin-top: 1.5rem;">
      <a id="cornLink" href="corn-farm.html" style="display:inline-block">
        <img id="cornRot" src="img/farm_01.png" alt="옥수수 농장" 
             style="width:200px;height:auto;border-radius:10px;box-shadow:0 0 10px black;">
      </a>
      <div style="margin-top:0.4rem;font-weight:bold;background:rgba(0,0,0,0.5);display:inline-block;padding:0.2rem 0.6rem;border-radius:6px;">
      
      </div>
    </div>


  <script>
    const BASE_URL = "https://climbing-wholly-grouper.jp.ngrok.io";

    function goKakaoLogin() {
      const client_id = "284b798a9d9be8202f9c2e129fa6f329";
      const redirect_uri = "https://byungil-cho.github.io/OrcaX/kakao-callback.html";
      window.location.href = `https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=${client_id}&redirect_uri=${encodeURIComponent(redirect_uri)}`;
    }

    function logout() {
      localStorage.clear();
      alert("로그아웃 되었습니다.");
      location.reload();
    }

    function enterFarm(url) {
      const nickname = localStorage.getItem("nickname");
      if (!nickname) {
        alert("로그인 후 입장하실 수 있습니다.");
        goKakaoLogin();
      } else {
        window.location.href = url;
      }
    }

    function init() {
      const nickname = localStorage.getItem("nickname");
      const kakaoId = localStorage.getItem("kakaoId");

      const el = document.getElementById("nicknameDisplay");

      if (nickname && kakaoId) {
        el.textContent = `👤 ${nickname}님, 환영합니다!`;
        el.style.display = "inline-block";
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("logoutBtn").style.display = "inline-block";

        // 서버 기록 (선택 사항)
        fetch(`${BASE_URL}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, kakaoId })
        }).catch(err => console.error("서버 등록 오류:", err));

        fetch(`${BASE_URL}/api/init-user`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, kakaoId })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            console.log("✅ 초기 자산 지급 완료:", data.message);
          } else {
            console.warn("⚠️ 초기화 실패 또는 이미 존재:", data.message || data.error);
          }
        })
        .catch(err => console.error("❌ init-user 오류:", err));
      } else {
        el.style.display = "none";
        document.getElementById("loginBtn").style.display = "inline-block";
        document.getElementById("logoutBtn").style.display = "none";
      }
    }

    window.addEventListener("pageshow", function(event) {
      if (event.persisted || performance.getEntriesByType("navigation")[0].type === "back_forward") {
        location.reload(); // 뒤로가기 캐시 대응
      }
    });


    // 옥수수 농장 이미지 로테이션 (01 → 03 → 05 → 09)
    (function(){
      const seq = ['img/farm_01.png','img/farm_03.png','img/farm_05.png','img/farm_09.png'];
      let i = 0;
      setInterval(()=>{
        i = (i + 1) % seq.length;
        const el = document.getElementById('cornRot');
        if (el) el.src = seq[i];
      }, 2500);
    })();


    window.onload = init;
  </script>
</body>
</html>
