<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 감자마켓</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Do Hyeon', sans-serif; background: #eef6ef; margin:0; }
    header { background: #666; color:#fff; padding:20px 0; text-align:center; font-size:2rem;}
    .status { margin:16px auto; width:95%; max-width:400px; padding:10px; border-radius:8px; background:#fff;}
    .fail { background:#ffdbe0; color:#d90000; font-weight:bold; font-size:1.2em; border:2px solid #ff5555;}
    .success { background:#d7f7dd; color:#228800; font-weight:bold; font-size:1.2em;}
    .content-box {background:#eee; border-radius:18px; padding:24px; margin:20px auto; width:95%; max-width:480px;}
    .box-disabled {opacity:0.5; pointer-events:none;}
    .info-label {font-size:1.1em; font-weight:bold;}
    #log {margin:10px 0; font-size:1em;}
    .btn {background:#25b74b; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:1.1em;}
    .btn:disabled {opacity:0.4;}
    input[type="text"] {padding:8px; font-size:1em;}
  </style>
</head>
<body>
  <header>🥔 OrcaX 감자마켓 🥔</header>
  <div class="status" id="serverStatus">서버 연결 확인중...</div>
  <div style="text-align:center;margin-top:6px;">
    <span class="info-label">닉네임:</span> <span id="nickname">-</span>
    | <span class="info-label">카카오ID:</span> <span id="kakaoId">-</span>
  </div>

  <div class="content-box" id="box1">
    <div class="info-label">내 제품 보관함</div>
    <div id="myProducts">-</div>
  </div>

  <div class="content-box" id="box2">
    <div class="info-label">감자/보리 가공식품 시세 전광판</div>
    <div id="marketPrice">-</div>
  </div>

  <div class="content-box" id="box3">
    <div class="info-label">제품 판매 (ORCX 교환)</div>
    <input type="text" id="sellProduct" placeholder="판매할 제품명">
    <input type="number" id="sellCount" min="1" value="1" style="width:60px;">
    <button class="btn" id="sellBtn">판매</button>
    <div id="log"></div>
  </div>

  <script>
    // 유저 정보/상태
    let kakaoId = localStorage.getItem("kakaoId") || "";
    let nickname = localStorage.getItem("nickname") || "-";

    document.getElementById("kakaoId").textContent = kakaoId;
    document.getElementById("nickname").textContent = nickname;

    // 서버연결 및 데이터 불러오기
    async function fetchUserData() {
      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({kakaoId})
        });
        const data = await res.json();
        if(data.success) {
          document.getElementById("serverStatus").textContent = "서버 연결 성공!";
          document.getElementById("serverStatus").className = "status success";
          document.getElementById("nickname").textContent = data.user.nickname || "-";
          document.getElementById("kakaoId").textContent = data.user.kakaoId || "-";
          document.getElementById("myProducts").textContent =
            Object.keys(data.user.products||{}).length > 0
              ? Object.entries(data.user.products).map(([k,v]) => `${k}: ${v}개`).join(", ")
              : "아직 보관 중인 제품 없음";
          // 가격표 더미 예시
          document.getElementById("marketPrice").textContent = "감자스넥 3ORCX, 감자칩 5ORCX";
        } else {
          showFail("서버 연결 실패! (유저 정보 없음)");
        }
      } catch(e) {
        showFail("서버 연결 실패!");
      }
    }
    function showFail(msg) {
      document.getElementById("serverStatus").textContent = msg;
      document.getElementById("serverStatus").className = "status fail";
      // 모든 박스 비활성화
      for(let id of ["box1","box2","box3"]) document.getElementById(id).classList.add("box-disabled");
    }
    fetchUserData();

    // 판매 버튼 예시
    document.getElementById("sellBtn").onclick = function() {
      const prod = document.getElementById("sellProduct").value.trim();
      const cnt = Number(document.getElementById("sellCount").value) || 1;
      if(!prod) { document.getElementById("log").textContent = "제품명을 입력하세요."; return; }
      document.getElementById("log").textContent = `판매 요청: ${prod} ${cnt}개 (서버연동 필요)`;
      // 실제 판매연동 시 POST 호출 추가
    }
  </script>
</body>
</html>
