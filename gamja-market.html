<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 감자마켓</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Do Hyeon', sans-serif; background: #eef6ef; margin:0; }
    header { background: #666; color:#fff; padding:20px 0; text-align:center; font-size:2rem;}
    .status { margin:16px auto; width:95%; max-width:400px; padding:10px; border-radius:8px; background:#fff;}
    .fail { background:#ffdbe0; color:#d90000; font-weight:bold; font-size:1.2em; border:2px solid #ff5555;}
    .success { background:#d7f7dd; color:#228800; font-weight:bold; font-size:1.2em;}
    .content-box {background:#eee; border-radius:18px; padding:24px; margin:20px auto; width:95%; max-width:480px;}
    .box-disabled {opacity:0.5; pointer-events:none;}
    .info-label {font-size:1.1em; font-weight:bold;}
    #log {margin:10px 0; font-size:1em;}
    .btn {background:#25b74b; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:1.1em;}
    .btn:disabled {opacity:0.4;}
    input[type="text"] {padding:8px; font-size:1em;}
  </style>
</head>
<body>
  <header>🥔 OrcaX 감자마켓 🥔</header>
  <div class="status" id="serverStatus">서버 연결 확인중...</div>
  <div style="text-align:center;margin-top:6px;">
    <span class="info-label">닉네임:</span> <span id="nickname">-</span>
    | <span class="info-label">카카오ID:</span> <span id="kakaoId">-</span>
  </div>

  <div class="content-box" id="box1">
    <div class="info-label">내 제품 보관함</div>
    <div id="myProducts">-</div>
  </div>

  <div class="content-box" id="box2">
    <div class="info-label">감자/보리 가공식품 시세 전광판</div>
    <div id="marketPrice">-</div>
  </div>

  <div class="content-box" id="box3">
    <div class="info-label">제품 판매 (ORCX 교환)</div>
    <input type="text" id="sellProduct" placeholder="판매할 제품명">
    <input type="number" id="sellCount" min="1" value="1" style="width:60px;">
    <button class="btn" id="sellBtn">판매</button>
    <div id="log"></div>
  </div>

  <script>
// [1] 내 가공제품 전체 불러오기
async function fetchUserProducts() {
  const kakaoId = localStorage.getItem("kakaoId");
  const res = await fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/marketdata/get-user-products', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ kakaoId })
  });
  const data = await res.json();
  if(data.success){
    // 보관함/목록에 제품들 표시
    // 예시: data.products = { '감자칩':2, '감자스넥':1 }
    //      data.orcx = 내 잔고
  } else {
    // 서버연결실패 표시
  }
}

// [2] 전광판(전체 시세/거래)
async function fetchMarketBoard() {
  const res = await fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/marketdata/get-market-board');
  const data = await res.json();
  if(data.success){
    // data.board: { prices, sold, history 등 }
    // 시세판/통계에 표시
  }
}

// [3] 제품 판매(ORCX 교환)
async function sellProduct(productName, amount) {
  const kakaoId = localStorage.getItem("kakaoId");
  const res = await fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/marketdata/sell-product', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ kakaoId, productName, amount })
  });
  const data = await res.json();
  if(data.success){
    // 잔고 갱신, 보관함 재조회
  } else {
    alert("판매실패: " + data.message);
  }
}

// [4] 교환(예: 감자칩 1개 → 물 3개)
async function exchangeProduct(productName, amount, exchangeItem, exchangeRate) {
  const kakaoId = localStorage.getItem("kakaoId");
  const res = await fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/marketdata/exchange', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ kakaoId, productName, amount, exchangeItem, exchangeRate })
  });
  const data = await res.json();
  if(data.success){
    // 내 자원/보관함 갱신
  } else {
    alert("교환실패: " + data.message);
  }
}
</script>

</body>
</html>
