<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>GamjaX 감자 마켓</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Arial', sans-serif; background: #f1f9e8; padding: 1rem; margin: 0; }
    h1, h2 { text-align: center; color: #305030; margin: 1rem 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #b5d7a6; padding: 0.5rem; text-align: center; font-size: 0.9rem; }
    th { background-color: #d9f2c4; }
    #notice { margin-top: 1rem; color: #4b6042; text-align: center; }
    #myStorage { margin-top: 2rem; }
    #userInfo {
      position: sticky; top: 0; z-index: 999;
      background: #edf7e2; padding: 0.5rem 1rem;
      border-bottom: 2px solid #c7e1b5;
      font-size: 0.95rem; text-align: right;
    }
    button {
      margin: 1rem auto; display: block;
      padding: 0.6rem 1.2rem; font-size: 1rem;
      background: #85b765; color: white; border: none;
      border-radius: 5px; cursor: pointer;
    }
    button:hover { background-color: #739c54; }
    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }
    .nav-buttons button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background-color: #85b765;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .nav-buttons button:hover {
      background-color: #739c54;
    }
    @media screen and (max-width: 600px) {
      th, td { font-size: 0.75rem; padding: 0.4rem; }
      button { font-size: 0.9rem; padding: 0.5rem 1rem; }
    }
  </style>
</head>
<body>
  <div id="userInfo">
    👤 <span id="nickname"></span> (<span id="farmName"></span>) | 💰 <span id="tokenBalance">0</span> ORCAX
  </div>

  <h1>🥔 GamjaX 감자 마켓</h1>
  <table id="priceTable">
    <thead>
      <tr>
        <th>제품명</th>
        <th>판매량</th>
        <th>시세 (토큰)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="notice"></p>

  <div id="myStorage">
    <h2>🥔 <span id='userFarmTitle'></span> 감자 창고 <span style='font-size:0.9rem;'>(개인 전용)</span></h2>
    <table id="storageTable">
      <thead>
        <tr>
          <th>선택</th>
          <th>제품명</th>
          <th>보유 수량</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button onclick="sellSelectedItems()">✅ 선택한 감자 판매</button>
  </div>

  <div class="nav-buttons">
    <button onclick="location.href='gamja-farm.html'">🌱 감자 농장 가기</button>
    <button onclick="location.href='gamja-factory.html'">🏣 감자 가공 공장</button>
    <button onclick="location.href='gamja-shop.html'">🛒 감자 상점</button>
  </div>

  <div id="newsTicker" style="width: 100%; overflow: hidden; white-space: nowrap; background: #406040; color: #fff; padding: 0.5rem; font-size: 0.9rem; position: fixed; bottom: 0; left: 0;">
    <div id="tickerText" style="display: inline-block; padding-left: 100%; animation: scroll-left 15s linear infinite;">
      🥔 감자 대란! 감자치프, 감자피자, 감자콘 등 새로운 제품이 입고되었습니다. 지금 바로 판매하거나 수확하세요!
    </div>
  </div>

  <style>
    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>

  <script>
    const kakaoId = localStorage.getItem("kakaoId") || "익명손님";
    const nickname = localStorage.getItem("nickname") || "감자";
    const farmNameInput = localStorage.getItem("farmName") || "이름없는";
    const displayFarmName = farmNameInput + " 감자농장";

    async function fetchMarketData() {
      try {
        const res = await fetch("/api/market/prices");
        const data = await res.json();
        const tbody = document.querySelector("#priceTable tbody");
        tbody.innerHTML = "";

        data.prices.forEach(item => {
          const name = item.type || item.name || "이름없음";
          const row = `<tr><td>${name}</td><td>${item.count}</td><td>${item.price}</td></tr>`;
          tbody.insertAdjacentHTML("beforeend", row);
        });

        document.getElementById("notice").textContent = data.notice;
      } catch (e) {
        console.error("시세 불러오기 실패:", e);
        document.getElementById("notice").textContent = "시세 정보를 불러오지 못했습니다.";
      }
    }

    async function fetchMyStorage() {
      try {
        const res = await fetch(`/api/storage/${nickname}`);
        const data = await res.json();
        const tbody = document.querySelector("#storageTable tbody");
        tbody.innerHTML = "";

        data.forEach(item => {
          const name = item.type || item.name || "이름없음";
          const row = `<tr>
            <td><input type='checkbox' name='product' value='${name}' data-count='${item.count}'></td>
            <td>${name}</td>
            <td>${item.count}</td>
          </tr>`;
          tbody.insertAdjacentHTML("beforeend", row);
        });
      } catch (e) {
        console.error("보관소 불러오기 실패:", e);
        const tbody = document.querySelector("#storageTable tbody");
        tbody.innerHTML = `<tr><td colspan='3'>불러오기 실패</td></tr>`;
      }
    }

    async function fetchTokenBalance() {
      try {
        const res = await fetch(`/api/user/token/${nickname}`);
        const data = await res.json();
        document.getElementById("tokenBalance").textContent = data.token || 0;
      } catch (e) {
        console.error("토큰 잔액 불러오기 실패:", e);
      }
    }

    async function sellSelectedItems() {
      const checkboxes = document.querySelectorAll("input[name='product']:checked");
      for (const cb of checkboxes) {
        const type = cb.value;
        const count = parseInt(cb.dataset.count);
        await fetch("/api/market/sell", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId: nickname, type, count })
        });
      }
      await fetchMyStorage();
      await fetchTokenBalance();
    }

    document.getElementById("userFarmTitle").textContent = displayFarmName;
    document.getElementById("nickname").textContent = nickname;
    document.getElementById("farmName").textContent = farmNameInput; // ✅ 수정: 중복 감자농장 방지
    fetchMarketData();
    fetchMyStorage();
    fetchTokenBalance();
    setInterval(fetchMarketData, 600000);
    setInterval(fetchMyStorage, 600000);
    setInterval(fetchTokenBalance, 600000);
  </script>
</body>
</html>
