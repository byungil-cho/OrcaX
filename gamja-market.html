<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>GamjaX 감자 마켓</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Arial', sans-serif; background: #f1f9e8; padding: 1rem; margin: 0; }
    h1, h2 { text-align: center; color: #305030; margin: 1rem 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #b5d7a6; padding: 0.5rem; text-align: center; font-size: 0.9rem; }
    th { background-color: #d9f2c4; }
    #notice { margin-top: 1rem; color: #4b6042; text-align: center; }
    #myStorage { margin-top: 2rem; }
    #userInfo {
      position: sticky; top: 0; z-index: 999;
      background: #edf7e2; padding: 0.5rem 1rem;
      border-bottom: 2px solid #c7e1b5;
      font-size: 0.95rem; text-align: right;
    }
    button {
      margin: 1rem auto; display: block;
      padding: 0.6rem 1.2rem; font-size: 1rem;
      background: #85b765; color: white; border: none;
      border-radius: 5px; cursor: pointer;
    }
    button:hover { background-color: #739c54; }
    @media screen and (max-width: 600px) {
      th, td { font-size: 0.75rem; padding: 0.4rem; }
      button { font-size: 0.9rem; padding: 0.5rem 1rem; }
    }
    #newsTicker {
      width: 100%; overflow: hidden; white-space: nowrap; background: #406040;
      color: #fff; padding: 0.5rem; font-size: 0.9rem; position: fixed; bottom: 0; left: 0;
    }
    #tickerText {
      display: inline-block; padding-left: 100%; animation: scroll-left 15s linear infinite;
    }
    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    .nav-buttons {
      margin: 2rem auto; display: flex; justify-content: center; gap: 1rem;
    }
    .nav-buttons button {
      background: #6d9e53;
    }
  </style>
</head>
<body>
  <div id="userInfo">
    👤 <span id="nickname">닉네임</span> 감자 농장 | 💰 <span id="tokenBalance">0</span> ORCAX
  </div>

  <h1>🥔 GamjaX 감자 마켓</h1>
  <table id="priceTable">
    <thead>
      <tr>
        <th>제품명</th>
        <th>판매량</th>
        <th>시세 (토큰)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="notice"></p>

  <div id="myStorage">
    <h2>🥔 <span id='userFarmTitle'></span> 감자 창고 <span style='font-size:0.9rem;'>(개인 전용)</span></h2>
    <table id="storageTable">
      <thead>
        <tr>
          <th>선택</th>
          <th>제품명</th>
          <th>보유 수량</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button onclick="sellSelectedItems()">✅ 선택한 감자 판매</button>
  </div>

  <div class="nav-buttons">
    <button onclick="location.href='gamja-farm.html'">🌱 감자 농장 가기</button>
    <button onclick="location.href='gamja-factory.html'">🏭 감자 가공 공장</button>
    <button onclick="location.href='gamja-shop.html'">🛒 감자 상점</button>
  </div>

  <div id="newsTicker">
    <div id="tickerText">🥔 뉴스 로딩 중...</div>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname") || "감자";
    const farmName = localStorage.getItem("farmName") || "이름없는";

    if (!nickname || nickname === "감자") {
      alert("⚠️ 닉네임이 저장되지 않았습니다. 닉네임을 먼저 설정해주세요.");
    }

    document.getElementById("nickname").textContent = nickname;
    document.getElementById("userFarmTitle").textContent = nickname + " 감자농장";

    async function fetchMarketData() {
      try {
        const res = await fetch("/api/market/prices");
        const data = await res.json();
        const tbody = document.querySelector("#priceTable tbody");
        tbody.innerHTML = "";
        data.prices.slice(0, 30).forEach(item => {
          const row = `<tr><td>${item.type}</td><td>${item.count}</td><td>${item.price}</td></tr>`;
          tbody.insertAdjacentHTML("beforeend", row);
        });
        document.getElementById("notice").textContent = data.notice;
        updateNewsTicker(data.news);
      } catch (e) {
        document.getElementById("notice").textContent = "❌ 시세 정보를 불러오지 못했습니다.";
      }
    }

    async function fetchMyStorage() {
      try {
        const res = await fetch(`/api/storage/${encodeURIComponent(nickname)}`);
        const data = await res.json();
        const tbody = document.querySelector("#storageTable tbody");
        tbody.innerHTML = "";
        data.forEach(item => {
          const row = `<tr>
            <td><input type='checkbox' name='product' value='${item.type}' data-count='${item.count}'></td>
            <td>${item.type}</td>
            <td>${item.count}</td>
          </tr>`;
          tbody.insertAdjacentHTML("beforeend", row);
        });
      } catch (e) {
        const tbody = document.querySelector("#storageTable tbody");
        tbody.innerHTML = `<tr><td colspan='3'>❌ 보관소 불러오기 실패</td></tr>`;
      }
    }

    async function fetchTokenBalance() {
      try {
        const res = await fetch(`/api/user/token/${encodeURIComponent(nickname)}`);
        const data = await res.json();
        document.getElementById("tokenBalance").textContent = data.token || 0;
      } catch (e) {
        console.error("토큰 잔액 불러오기 실패:", e);
      }
    }

    async function sellSelectedItems() {
      const checkboxes = document.querySelectorAll("input[name='product']:checked");
      for (const cb of checkboxes) {
        const type = cb.value;
        const count = parseInt(cb.dataset.count);
        await fetch("/api/market/sell", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, type, count })
        });
      }
      await fetchMyStorage();
      await fetchTokenBalance();
    }

    function updateNewsTicker(newsArray = []) {
      const tickerText = document.getElementById("tickerText");
      if (newsArray.length > 0) {
        tickerText.innerHTML = newsArray.map(msg => `🆕 ${msg}`).join(' ▪ ');
      } else {
        tickerText.textContent = "🥔 새로운 소식이 없습니다.";
      }
    }

    fetchMarketData();
    fetchMyStorage();
    fetchTokenBalance();
    setInterval(fetchMarketData, 600000);
    setInterval(fetchMyStorage, 600000);
    setInterval(fetchTokenBalance, 600000);
  </script>
</body>
</html>
