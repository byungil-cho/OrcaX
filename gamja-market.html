<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>감자 제품 거래소</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #fff7e8;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #4a3d28;
      margin: 1rem 0 0.5rem;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem 0.5rem 0;
      color: #5b4229;
    }
    #statusBox {
      text-align: center;
      color: #cc0000;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    #marketContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
    }
    .product-box, .inventory-box {
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 1rem;
      margin: 1rem 0;
      text-align: center;
      width: 90%;
      max-width: 500px;
    }
    .product-item, .inventory-item {
      padding: 0.5rem 0;
      border-bottom: 1px dashed #ccc;
    }
    .product-item:last-child, .inventory-item:last-child {
      border-bottom: none;
    }
    .inventory-item input[type="checkbox"] {
      margin-right: 0.5rem;
    }
    .navigation-links {
      text-align: center;
      margin-top: 2rem;
    }
    .navigation-links a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background: #6baf3a;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .navigation-links a:hover {
      background: #51952e;
    }
    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background: #cf7b2d;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #b36522;
    }
  </style>
</head>
<body>
  <div id="nicknameBox"></div>
  <h1>🥔 감자 제품 거래소</h1>
  <div id="statusBox">🔌 서버 전원 상태 확인 중...</div>
  <div id="marketContainer">
    <div class="product-box" id="productList">
      <div>📈 실시간 전광판 시세</div>
    </div>
    <div class="inventory-box">
      <h3>📦 내 제품 보관함</h3>
      <div id="inventoryItems"></div>
      <button onclick="sellSelectedProducts()">선택 제품 판매하기</button>
    </div>
  </div>
  <div class="navigation-links">
    <a href="gamja-shop.html">🛒 씨감자 상점</a>
    <a href="gamja-exchange.html">🔁 자원 교환소</a>
    <a href="gamja-result.html">🏭 가공공장</a>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    const statusBox = document.getElementById("statusBox");
    const nicknameBox = document.getElementById("nicknameBox");

    if (!nickname) {
      alert("로그인 정보가 없습니다. 입구로 이동합니다.");
      window.location.href = "orcax-farm_000.html";
    } else {
      nicknameBox.textContent = `👤 ${nickname} 님`;
      console.log("✅ 닉네임 확인:", nickname);
    }

    let productPrices = {};
    let userData = { nickname, inventory: [], token: 0 };

    function fetchMarketData() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/market")
        .then(res => {
          if (!res.ok) throw new Error("❌ 시세 서버 응답 없음");
          statusBox.textContent = "✅ 전기 공급 중 (서버 연결됨)";
          statusBox.style.color = "green";
          return res.json();
        })
        .then(data => {
          console.log("📈 시세 데이터:", data);
          const productList = document.getElementById("productList");
          productList.innerHTML = "<div>📈 실시간 전광판 시세</div>";
          data.forEach(item => {
            const div = document.createElement("div");
            div.className = "product-item";
            div.textContent = `${item.name} - ${item.price} ORCX`;
            productPrices[item.name] = item.price;
            productList.appendChild(div);
          });
        })
        .catch(err => {
          statusBox.textContent = "⚠️ 전기 공급 끊김 (서버 오류)";
          statusBox.style.color = "red";
          console.error("거래소 시세 불러오기 실패", err);
        });
    }

    function fetchUserData() {
      fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata?nickname=${encodeURIComponent(nickname)}`)
        .then(res => {
          if (!res.ok) throw new Error("❌ 유저 데이터 응답 없음");
          return res.json();
        })
        .then(data => {
          console.log("📦 유저 데이터:", data);
          userData.inventory = data.inventory ?? [];
          userData.token = data.token ?? 0;
          userData.water = data.water ?? 0;
          userData.fertilizer = data.fertilizer ?? 0;
          userData.potatoCount = data.potatoCount ?? 0;
          userData.seedPotato = data.seedPotato ?? 0;
          renderInventory();
        })
        .catch(err => {
          console.error("내 제품 불러오기 실패", err);
          statusBox.textContent = "⚠️ 유저 정보 불러오기 실패";
          statusBox.style.color = "red";
        });
    }

    function renderInventory() {
      const container = document.getElementById("inventoryItems");
      container.innerHTML = "";
      userData.inventory.forEach((item, index) => {
        container.innerHTML += `
          <div class="inventory-item">
            <input type="checkbox" value="${index}"> ${item.type} × ${item.count}
          </div>`;
      });
    }

    function sellSelectedProducts() {
      const checkboxes = document.querySelectorAll(".inventory-item input[type='checkbox']:checked");
      if (checkboxes.length === 0) return alert("판매할 제품을 선택하세요.");

      let total = 0;
      const indexes = Array.from(checkboxes).map(cb => parseInt(cb.value));
      indexes.sort((a, b) => b - a);

      indexes.forEach(index => {
        const item = userData.inventory[index];
        const price = productPrices[item.type] || 0;
        total += price;

        if (item.count > 1) {
          item.count--;
        } else {
          userData.inventory.splice(index, 1);
        }
      });

      userData.token += total;

      const payload = {
        nickname,
        token: userData.token,
        inventory: userData.inventory,
        water: userData.water,
        fertilizer: userData.fertilizer,
        potatoCount: userData.potatoCount,
        seedPotato: userData.seedPotato
      };

      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(() => {
        alert(`판매 완료! 총 ${total} ORCX 적립되었습니다.`);
        renderInventory();
      }).catch(err => {
        console.error("판매 후 저장 실패", err);
        alert("❌ 판매 저장 실패!");
      });
    }

    fetchMarketData();
    fetchUserData();
  </script>
</body>
</html>
