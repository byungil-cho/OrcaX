<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 감자마켓</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 나눔스퀘어라운드 + Pretendard 폰트CDN -->
  <link href="https://cdn.jsdelivr.net/gh/wan2land/d2coding/d2coding-full.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Square+Round:wght@400;700&family=Pretendard:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'NanumSquareRound', 'Pretendard', 'Noto Sans KR', 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      color: #fff;
      text-shadow: 0 1px 6px rgba(30,40,70,0.14), 0 1px 8px #0007;
    }
    header {
      background: rgba(0,0,0,0.18);
      color: #ffe166;
      padding: 1rem 0 0.7rem 0;
      text-align: center;
      font-size: 2rem;
      letter-spacing: 1px;
      text-shadow: 0 2px 12px #23457c, 0 1px 12px #0006;
      border-bottom: 1px solid #ffe16622;
    }
    .top-menu {
      background: rgba(34, 44, 70, 0.22);
      padding: 0.5rem 0;
      text-align: center;
      font-size: 1.08rem;
      margin-bottom: 7px;
      border-bottom: 1px solid #ffe16633;
    }
    .top-menu a {
      color: #ffe166;
      text-decoration: none;
      padding: 0.36rem 1.02rem;
      border-radius: 16px;
      margin: 0 0.1rem;
      background: rgba(33,123,179,0.10);
      transition: background 0.15s;
      font-weight: bold;
      display: inline-block;
    }
    .top-menu a:hover {
      background: #ffe166;
      color: #22336e;
    }
    .main-box {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      border-radius: 30px;
      background: rgba(16,22,34,0.36); /* 더 연하게! */
      box-shadow: 0 2px 18px #23457c14;
      color: #fff;
    }
    .section {
      margin-bottom: 2rem;
      padding: 1rem 1.5rem;
      border-radius: 20px;
      background: rgba(255,255,255,0.11); /* 더 연하게! */
      box-shadow: 0 2px 10px #0001;
    }
    .title {
      font-weight: bold;
      font-size: 1.23rem;
      margin-bottom: 1rem;
      color: #ffe166;
      text-shadow: 0 2px 9px #233a5070;
      font-family: 'NanumSquareRound', 'Pretendard', sans-serif;
    }
    .gray { color: #ccc; }
    .board-list, .inv-list { display: flex; flex-wrap: wrap; gap: 12px;}
    .item-card {
      padding: 0.65rem 1.07rem;
      border-radius: 15px;
      background: rgba(255,255,255,0.09); /* 더 연하게! */
      box-shadow:0 1px 6px #ddebe822;
      min-width: 110px;
      color: #ffe166;
      text-align:center;
      font-weight: 600;
    }
    .item-card b {
      color: #fff;
      text-shadow: 0 1px 8px #23457c66;
      font-weight: 700;
    }
    button, .btn {
      font-family: inherit;
      border: none;
      background: #ffe166;
      color: #233a50;
      padding: 7px 18px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      margin-left: 7px;
      font-weight: bold;
      box-shadow: 0 1px 9px #233a5033;
      transition: background 0.13s, color 0.13s;
    }
    .btn-swap { background: #b6e4ff; color: #1e2747; }
    .btn:disabled { background: #ccc; cursor: default; color: #888;}
    .center { text-align: center; }
    .flex { display: flex; align-items: center; }
    .label { min-width: 85px; font-weight: bold; color: #ffe166;}
    #log { margin-top: 1rem; color: #ffe166; text-align: center;}
    .resource-bar {
      display: flex; justify-content: center; align-items: center;
      gap: 18px; margin-top: 7px; margin-bottom: 4px;
      font-size: 1.08rem;
    }
    .res-item {
      background: rgba(0,0,0,0.09); /* 연하게! */
      color: #ffe166;
      border-radius: 10px;
      padding: 2px 13px 2px 9px;
      box-shadow: 0 1px 6px #ddebe822;
      display: flex;
      align-items: center;
      font-weight: 600;
    }
    .res-label { font-size: 1rem; color: #ffe166; margin-right: 3px; }
    input, select {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid #888;
      border-radius: 7px;
      padding: 0.25rem 0.7rem;
      font-size: 1rem;
      margin-right: 5px;
      font-family: inherit;
    }
    input[type="number"]::placeholder { color: #ffe16688;}
    @media (max-width: 600px) {
      .main-box { padding: 1rem; }
      .item-card { min-width: 90px;}
      .top-menu a { padding: 0.4rem 0.5rem; font-size: 0.95rem; }
      .resource-bar { font-size: 0.99rem;}
    }
  </style>
</head>
<body>
  <header>
    🥔 OrcaX 감자마켓 🥔
    <div class="top-menu">
      <a href="index9.html">메인</a>
      <a href="gamja-farm.html">농장</a>
      <a href="gamja-shop.html">숍</a>
      <a href="auction-house.html">파이페이지</a>
    </div>
  </header>
  <div class="main-box">
    <div class="section center">
      <div id="srvStatus" class="gray">서버 연결 확인중...</div>
      <div class="resource-bar">
        <span class="res-item">
          <span class="res-label">닉네임</span> <span id="nick">-</span>
        </span>
        <span class="res-item">
          <span class="res-label">물</span> <span id="myWater">-</span>
        </span>
        <span class="res-item">
          <span class="res-label">거름</span> <span id="myFertilizer">-</span>
        </span>
        <span class="res-item">
          <span class="res-label">토큰</span> <span id="myToken">-</span>
        </span>
      </div>
    </div>
    <div class="section">
      <div class="title">감자/보리 가공식품 시세 전광판</div>
      <div class="board-list" id="priceBoard">-</div>
<style>
  /* ...기존 스타일 위에 추가... */
  .board-list .item-card {
    color: #43a047 !important;
    border: 1.5px solid #4caf5022;
    background: rgba(255,255,255,0.13);
    box-shadow: 0 1px 8px #43a04733;
    font-size: 1.18rem;
  }
  .board-list .item-card .price {
    color: #fff !important;
    font-weight: 900;
    text-shadow: 0 1px 7px #1e1e1e44;
    margin-left: 5px;
  }
</style>
    </div>
    <div class="section">
      <div class="title">내 제품 보관함</div>
      <div class="inv-list" id="inventory">-</div>
    </div>
    <div class="section">
      <div class="title">제품 판매 (ORCX 교환)</div>
      <div class="flex" style="gap:10px;">
        <select id="sellProduct"></select>
        <input type="number" id="sellQty" value="1" min="1" style="width:55px;">
        <button id="sellBtn">판매</button>
      </div>
      <div class="flex" style="gap:10px; margin-top:10px;">
        <select id="swapProduct"></select>
        <input type="number" id="swapQty" value="1" min="1" style="width:55px;">
        <select id="swapType">
          <option value="water">물로 교환</option>
          <option value="fertilizer">거름으로 교환</option>
        </select>
        <button class="btn btn-swap" id="swapBtn">교환</button>
      </div>
      <div id="log"></div>
    </div>
  </div>
  <script>
    // 이하 기존 JS 모두 100% 유지 (기능/서버/API 모두 동일)
    const API = "https://climbing-wholly-grouper.jp.ngrok.io/api/market";
    const USERDATA_API = "https://climbing-wholly-grouper.jp.ngrok.io/api/userdata";
    const kakaoId = localStorage.getItem("kakaoId") || "";
    const nickname = localStorage.getItem("nickname") || "-";
    let myProducts = {};   // {제품명: 수량}
    let priceList = [];
    let boardProductSet = new Set();
    let myWater = 0;
    let myFertilizer = 0;
    let myToken = 0;

    document.getElementById("nick").textContent = nickname;

    async function loadUserResource() {
      try {
        const response = await fetch(USERDATA_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId })
        });
        const data = await response.json();
        const user = data.user || data.users || data || {};
        myWater = user.water ?? user.inventory?.water ?? data.water ?? data.inventory?.water ?? 0;
        myFertilizer = user.fertilizer ?? user.inventory?.fertilizer ?? data.fertilizer ?? data.inventory?.fertilizer ?? 0;
        myToken = user.orcx ?? user.token ?? data.orcx ?? data.token ?? 0;
        renderMyResource();
      } catch (e) {
        myWater = 0; myFertilizer = 0; myToken = 0;
        renderMyResource();
      }
    }

    async function loadData() {
      document.getElementById("srvStatus").textContent = "서버 연결 확인중...";
      try {
        let res = await fetch(`${API}/price-board`);
        let data = await res.json();
        if(!data.success) throw "전광판 오류";
        priceList = data.priceList || [];
        boardProductSet = new Set(priceList.map(x=>x.name));
        renderPriceBoard();

        res = await fetch(`${API}/user-inventory`, {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ kakaoId })
        });
        data = await res.json();
        if(!data.success) throw "보관함 오류";
        myProducts = data.products || {};
        renderInventory();

        document.getElementById("srvStatus").textContent = "✅ 서버 연결 성공!";
      } catch(e) {
        document.getElementById("srvStatus").textContent = "❌ 서버 연결 실패!";
        document.getElementById("inventory").innerHTML = "-";
        document.getElementById("priceBoard").innerHTML = "-";
        document.getElementById("log").textContent = (e.message||e) + "";
      }
      fillSelectOptions();
    }

    function renderMyResource() {
      document.getElementById("myWater").textContent = myWater;
      document.getElementById("myFertilizer").textContent = myFertilizer;
      document.getElementById("myToken").textContent = myToken;
    }

    function renderInventory() {
      const list = Object.entries(myProducts)
        .filter(([_, qty]) => qty > 0)
        .map(([name, qty]) =>
          `<div class="item-card">${name} <b>${qty}</b>개</div>`
        );
      document.getElementById("inventory").innerHTML = list.length ? list.join("") : `<span class="gray">보유 제품 없음</span>`;
    }

    function renderPriceBoard() {
      const list = priceList
        .map(item =>
          `<div class="item-card">${item.name} <b>${item.price} ORCX</b></div>`
        );
      document.getElementById("priceBoard").innerHTML = list.length ? list.join("") : `<span class="gray">전광판 없음</span>`;
    }

    function fillSelectOptions() {
      const sellSel = document.getElementById("sellProduct");
      sellSel.innerHTML = "";
      for (const [name, qty] of Object.entries(myProducts)) {
        if (qty > 0 && boardProductSet.has(name)) {
          sellSel.innerHTML += `<option value="${name}">${name} (${qty})</option>`;
        }
      }
      const swapSel = document.getElementById("swapProduct");
      swapSel.innerHTML = "";
      for (const [name, qty] of Object.entries(myProducts)) {
        if (qty > 0) {
          swapSel.innerHTML += `<option value="${name}">${name} (${qty})</option>`;
        }
      }
    }

    document.getElementById("sellBtn").onclick = async function() {
      const prod = document.getElementById("sellProduct").value;
      const qty = Number(document.getElementById("sellQty").value) || 1;
      if (!prod) return logMsg("판매할 제품 선택!");
      const res = await fetch(`${API}/sell`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ kakaoId, product: prod, qty })
      });
      const data = await res.json();
      if (data.success) {
        logMsg(`✅ 판매 성공! (남은수량: ${data.left})`);
        myProducts[prod] = data.left;
        renderInventory();
        fillSelectOptions();
        await loadUserResource();
        await loadData();
      } else {
        logMsg("❌ " + (data.message || "판매 실패"));
      }
    };

    document.getElementById("swapBtn").onclick = async function() {
      const prod = document.getElementById("swapProduct").value;
      const qty = Number(document.getElementById("swapQty").value) || 1;
      const exchangeItem = document.getElementById("swapType").value;
      if (!prod) return logMsg("교환할 제품 선택!");
      const res = await fetch(`${API}/exchange`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ kakaoId, product: prod, qty, exchangeItem })
      });
      const data = await res.json();
      if (data.success) {
        logMsg(`✅ 교환 성공! (남은수량: ${data.left})`);
        myProducts[prod] = data.left;
        renderInventory();
        fillSelectOptions();
        await loadUserResource();
        await loadData();
      } else {
        logMsg("❌ " + (data.message || "교환 실패"));
      }
    };

    function logMsg(msg) {
      document.getElementById("log").textContent = msg;
      setTimeout(()=>{document.getElementById("log").textContent="";}, 3500);
    }

    loadUserResource();
    loadData();
  </script>
</body>
</html>
