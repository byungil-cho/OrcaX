<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>파크골프 커뮤니티 안내</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #eef6fa;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      color: #18363d;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 620px;
      margin: 42px auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(24,54,61,0.08);
      padding: 36px 28px 28px 28px;
    }
    h2 {
      margin-top: 0;
      color: #2b607c;
      font-weight: 700;
      letter-spacing: -1px;
    }
    .desc {
      font-size: 1.08em;
      margin-bottom: 24px;
      line-height: 1.85;
    }
    .images {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }
    .images img {
      width: 46%;
      border-radius: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 10px;
    }
    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 28px;
    }
    .back {
      display: inline-block;
      text-decoration: none;
      background: #3290a6;
      color: #fff;
      font-weight: bold;
      border-radius: 10px;
      padding: 12px 28px;
      transition: background 0.2s;
    }
    .back:hover {
      background: #24758a;
    }
    @media (max-width: 700px) {
      .container { padding: 18px 8px 16px 8px; }
      .images img { width: 100%; }
      .button-row { flex-direction: column; gap: 12px; }
      .back { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>파크골프 커뮤니티 안내</h2>
    <div class="desc">
      본 파크골프 커뮤니티는 <b>로얄스크린골프 회원 전용</b> 내부 동호회입니다.<br>
      외부 모집이나 홍보 없이 기존 회원 누구나 무료로 자유 이용할 수 있습니다.<br>
      <br>
      동호회 회원들과 함께 건강한 여가와 교류의 시간을 즐기세요.<br>
      파크골프 코스, 라운드 이벤트, 자유 연습 등 다양한 활동이 준비되어 있습니다.<br>
      <br>
      문의 및 운영 안내: <br>
      - 담당자 연락처: 010-7236-2157<br>
      - 네이버 카페: <a href="https://cafe.naver.com/rsgc" target="_blank">https://cafe.naver.com/rsgc</a>
    </div>
    <div class="images">
      <img src="img/park_overview1.jpg" alt="파크골프장 조감도">
      <img src="img/park_golf_event.jpg" alt="파크골프 동호회 행사">
      <!-- 필요한 경우 이미지 더 추가 -->
    </div>
    <div class="button-row">
      <a href="https://byungil-cho.github.io/OrcaX/index.html" class="back">메인으로 돌아가기</a>
      <a href="farm_002.html" class="back">계절별 코스</a>
    </div>
  </div>
</body>
</html>
