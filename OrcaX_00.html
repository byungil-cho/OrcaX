<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>범고래 재단 창립 멤버 (보호됨)</title>
  <style>
    body {
      background-color: #001f3f;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }
    .hidden { display: none; }
    .password-box {
      margin-top: 150px;
    }
    input[type="password"] {
      padding: 10px;
      font-size: 1em;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      background-color: #00e0ff;
      border: none;
      color: #001f3f;
      cursor: pointer;
    }
    .members {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .card {
      background-color: #012a4a;
      padding: 20px;
      border-radius: 10px;
      width: 220px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    .card img {
      width: 100px;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    .card h3 {
      margin: 10px 0 5px;
    }
    .card p {
      margin: 0;
      color: #aaaaaa;
    }
    .footer {
      margin-top: 50px;
      font-size: 0.95em;
      color: #888888;
    }
  </style>
</head>
<body>

  <div class="password-box" id="password-box">
    <h2>비밀번호를 입력하세요</h2>
    <input type="password" id="password" placeholder="비밀번호 입력" />
    <button onclick="checkPassword()">확인</button>
    <p id="error-msg" style="color: red;"></p>
  </div>

  <div class="container hidden" id="content">
    <h1>범고래 재단 창립 멤버</h1>
    <p>본 명단은 파3 골프 동호회의 창립 멤버로 구성되었으며,<br>
      범고래 재단 1차 목표 달성 시 각 멤버에게 <strong>재단 지분 0.2%</strong><br>
      즉 <strong>1,000만 ORCX 토큰</strong>이 분배됩니다.</p>

    <div class="members">
      <div class="card"><img src="logo_01.jpg" alt="OrcaX 로고"><h3>정갑식</h3><p>회장</p></div>
      <div class="card"><img src="logo_01.jpg" alt="OrcaX 로고"><h3>최남실</h3><p>부회장</p></div>
      <div class="card"><img src="2025_003.jpg" alt="OrcaX 로고"><h3>조병일</h3><p>사무총장</p></div>
      <div class="card"><img src="logo_01.jpg" alt="OrcaX 로고"><h3>이병진</h3><p>홍보이사</p></div>
      <div class="card"><img src="logo_01.jpg" alt="OrcaX 로고"><h3>김정태</h3><p>홍보이사</p></div>
      <div class="card"><img src="logo_01.jpg" alt="OrcaX 로고"><h3>신휘철</h3><p>감사</p></div>
      <div class="card"><img src="logo_01.jpg" alt="OrcaX 로고"><h3>임동연</h3><p>감사</p></div>
      <div class="card"><img src="2025_008.jpg" alt="OrcaX 로고"><h3>서병원</h3><p>추진이사</p></div>
      <div class="card"><img src="2025_009.jpg" alt="OrcaX 로고"><h3>정성균</h3><p>추진이사</p></div>
    </div>

    <div class="footer">
      ※ 상기 명단은 2025년 기준 파3 골프 동호회 등록자를 기준으로 하며,<br>
      OrcaX 토큰은 조건 충족 시 스마트컨트랙트를 통해 자동 지급됩니다.
    </div>
  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");
      if (input === "5588") {
        document.getElementById("password-box").style.display = "none";
        document.getElementById("content").classList.remove("hidden");
      } else {
        errorMsg.textContent = "비밀번호가 올바르지 않습니다.";
      }
    }
  </script>
</body>
</html>
