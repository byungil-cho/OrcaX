<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌾 나의 농장 현황판</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #222;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .initial-box {
      background-color: #444;
      padding: 1rem;
      border-radius: 10px;
      max-width: 500px;
      margin: 0 auto 2rem auto;
    }
    #initial-yield {
      font-size: 1.2rem;
      color: #f0c741;
      font-weight: bold;
    }
    .input-section {
      margin-bottom: 2rem;
    }
    input[type="text"], button {
      padding: 0.5rem;
      font-size: 1rem;
      width: 100%;
      max-width: 300px;
      border-radius: 5px;
      margin: 0.5rem auto;
      display: block;
    }
    button {
      background-color: #f0c741;
      color: #000;
      border: none;
      cursor: pointer;
    }
    .result-box {
      background-color: #333;
      padding: 1rem;
      border-radius: 10px;
      max-width: 500px;
      margin: 0 auto;
      text-align: left;
    }
    .result-box ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    .result-box li {
      margin: 0.25rem 0;
    }
    #server-status {
      margin-top: 1rem;
      font-weight: bold;
      color: #00ff88;
    }
    @media screen and (max-width: 480px) {
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <h1>🌾 나의 농장 현황판</h1>
  <div class="initial-box">
    <p id="initial-yield">보유 감자: <span id="yield-count">-</span>개</p>
  </div>
  <div class="input-section">
    <input type="text" id="productInput" placeholder="제품 종류 (예: 칩, 전, 튀김 등)" />
    <button onclick="makeProduct()">제품 만들기</button>
  </div>
  <div id="server-status">🔄 전기 공급 상태 확인 중...</div>
  <div class="result-box">
    <h2>📦 제품 보관함:</h2>
    <ul id="storage-list">
      <li>데이터 불러오는 중...</li>
    </ul>
  </div>
  <script>
    const BASE_URL = "https://orcax-farm-6000.onrender.com";
    let currentGamjaCount = 0;
    let products = {};

    fetch(BASE_URL + "/api/ping")
      .then(res => {
        if (res.ok) {
          document.getElementById("server-status").innerText = "🟢 공장에 전기 들어왔어요~!";
          loadInventory();
        } else {
          document.getElementById("server-status").innerText = "🔴 공장 전기 끊킴";
        }
      })
      .catch(err => {
        document.getElementById("server-status").innerText = "🔴 공장 전기 끊킴: 감자 창고가 잠겼습니다!";
      });

    function loadInventory() {
      fetch(BASE_URL + "/api/gamja")
        .then(res => res.json())
        .then(data => {
          currentGamjaCount = data.total || 0;
          document.getElementById("yield-count").innerText = currentGamjaCount;
          products = data.items || {};
          updateStorageList(products);
        })
        .catch(err => {
          document.getElementById("storage-list").innerHTML = "<li>❌ 감자 보관함을 불러올 수 없습니다.</li>";
        });
    }

    function updateStorageList(items = []) {
      const ul = document.getElementById("storage-list");
      ul.innerHTML = "";
      if (items.length === 0) {
        ul.innerHTML = "<li>제품 없음</li>";
      } else {
        items.forEach(item => {
          const li = document.createElement("li");
          li.textContent = `${item.name}: ${item.count}개`;
          ul.appendChild(li);
        });
      }
    }

    function makeProduct() {
      const input = document.getElementById("productInput").value.trim();
      if (!input) return alert("제품명을 입력해주세요!");
      if (currentGamjaCount <= 0) {
        alert("❌ 감자가 부족합니다. 수확량을 확인해주세요!");
        return;
      }
      const formattedName = `감자${input}`;
      fetch(BASE_URL + "/api/create-product", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: formattedName })
      })
        .then(res => res.json())
        .then(data => {
          alert("✅ 제품 제작 완료: " + data.name);
          currentGamjaCount = Math.max(0, currentGamjaCount - 1);
          document.getElementById("yield-count").innerText = currentGamjaCount;
          loadInventory();
        })
        .catch(err => alert("❌ 제품 제작 실패"));
    }
  </script>
</body>
</html>
