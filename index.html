    body { background: #111; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; text-align: center; }
    h1 { color: #00e0ff; margin-bottom: 10px; font-size: 2em; cursor: pointer; display: inline-block; }
    h2 { color: #ffcc00; margin-bottom: 30px; font-size: 1.2em; }
    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
    .grid a { display: flex; flex-direction: column; align-items: center; background: #333; padding: 10px; border-radius: 10px; text-decoration: none; color: #aaa; width: 140px; transition: background 0.3s; pointer-events: auto; }
    .grid a img { width: 120px; height: auto; border-radius: 8px; margin-bottom: 8px; border: 2px solid transparent; }
    .grid a.active { background: #222; color: #fff; pointer-events: auto; }
    .grid a.active img { border-color: #00ccff; }
    .grid a:hover.active { background: #00cc99; }

    @media (max-width: 768px) {
      h1 { font-size: 1.5em; }
      h2 { font-size: 1em; }
      .grid a { width: 100px; padding: 8px; }
      .grid a img { width: 90px; }
    }
    @media (max-width: 480px) {
      .container { padding: 10px; }
      .grid { gap: 10px; }
      .grid a { width: 90px; padding: 6px; }
      .grid a img { width: 80px; }
    }
  </style>
</head>

  <!-- 채팅 위젯 -->
  <div id="chat-widget" style="position:fixed;bottom:20px;right:20px;z-index:9999;">
    <button onclick="toggleChat()" style="background:#00cc99;color:white;border:none;padding:12px 16px;border-radius:50%;font-size:20px;cursor:pointer;">💬</button>
    <div id="chat-box" style="display:none;width:300px;background:white;border-radius:12px;box-shadow:0 0 12px rgba(0,0,0,0.2);margin-top:10px;">
      <div style="background:#00cc99;color:white;padding:10px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;">
        📎 메시지 보내기
        <span style="cursor:pointer;" onclick="toggleChat()">✖</span>
      </div>
      <div style="padding:10px;">
        <input id="sender" type="text" placeholder="닉네임" style="width:100%;padding:6px;margin:4px 0;border-radius:4px;" />
        <input id="message" type="text" placeholder="메시지를 입력하세요" style="width:100%;padding:6px;margin:4px 0;border-radius:4px;" />
        <button onclick="sendMessage()" style="width:100%;padding:6px;background:#00b894;color:white;border:none;border-radius:4px;">전송</button>
      </div>
      <div id="chat-log" style="padding:10px;height:180px;overflow-y:auto;font-size:0.9em;background:#f9f9f9;border-top:1px solid #eee;"></div>
    </div>
  </div>

  <script>
    const apiBase = "https://f07e-210-104-209-108.ngrok-free.app/api/messages";
    const colorMap = {};

    function getColorForUser(user) {
      if (!colorMap[user]) {
        colorMap[user] = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      }
      return colorMap[user];
    }

    function toggleChat() {
      const box = document.getElementById("chat-box");
      box.style.display = (box.style.display === "none") ? "block" : "none";
      if (box.style.display === "block") loadMessages();
    }

    function sendMessage() {
      const sender = document.getElementById("sender").value.trim();
      const message = document.getElementById("message").value.trim();
      if (!sender || !message) return alert("닉네임과 메시지를 입력하세요!");

      fetch(apiBase, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "ngrok-skip-browser-warning": "true"
        },
        body: JSON.stringify({ nickname: sender, content: message, type: 'user' })
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById("message").value = '';
        loadMessages();
      })
      .catch(err => {
        alert("❌ 메시지 전송 실패: " + err.message);
      });
    }

    function loadMessages() {
      fetch(apiBase, {
        headers: { "ngrok-skip-browser-warning": "true" }
      })
      .then(res => res.json())
      .then(messages => {
        const log = document.getElementById("chat-log");
        log.innerHTML = '';
        messages.slice(-10).forEach(msg => {
          const color = getColorForUser(msg.nickname || msg.sender || "익명");
          const nickname = msg.nickname || msg.sender || "익명";
          const content = msg.content || msg.message || "";
          const div = document.createElement('div');
          div.innerHTML = `<strong style="color:${color}">${nickname}:</strong> ${content}`;
          log.appendChild(div);
        });
        log.scrollTop = log.scrollHeight;
      });
    }

    function requestAdminAccess() {
      const input = prompt("관리자 비밀번호를 입력하세요:");
      if (input === "orcax2025") {
        window.location.href = "https://byungil-cho.github.io/OrcaX/admin-log.html";
      } else if (input) {
        alert("❌ 비밀번호가 틀렸습니다.");
      }
    }

    window.onload = function() {
      loadMessages();
      setInterval(loadMessages, 5000);
    };
  </script>
</body>
</html>
