
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f9ec;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      color: #256029;
    }
    .status-box {
      background: #ffffff;
      border: 1px solid #c8e6c9;
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1rem;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .info {
      font-size: 1rem;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <h1>🌱 감자 농장 메인 페이지</h1>
  <div class="status-box">
    <div class="info"><strong>닉네임:</strong> <span id="nicknameBox"></span></div>
    <div class="info">💧 물: <span id="waterCount">-</span></div>
    <div class="info">🧴 거름: <span id="fertilizerCount">-</span></div>
    <div class="info">💰 토큰: <span id="tokenCount">-</span></div>
    <div class="info">🥔 감자 수: <span id="potatoCount">-</span></div>
  </div>

  <script>
    const nickname = new URLSearchParams(window.location.search).get("nickname");
    if (!nickname) {
      alert("카카오 인증이 필요합니다. 농장 입장은 금지되어 있습니다.");
      window.location.href = "gamja-farm.html";
    }

    document.getElementById("nicknameBox").textContent = nickname;

    async function fetchUserData() {
      try {
        const response = await fetch(`https://orcax-farm-6000.onrender.com/api/userdata?nickname=${nickname}`);
        const data = await response.json();
        if (data.success && data.user) {
          const user = data.user;
          document.getElementById("waterCount").textContent = user.water;
          document.getElementById("fertilizerCount").textContent = user.fertilizer;
          document.getElementById("tokenCount").textContent = user.token;
          document.getElementById("potatoCount").textContent = user.potatoCount;
        } else {
          alert("서버에서 사용자 정보를 불러오지 못했습니다.");
        }
      } catch (error) {
        alert("서버 연결 오류: " + error);
      }
    }

    fetchUserData();
  </script>
</body>
</html>
