<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자농장 메인</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fdf6e3;
      text-align: center;
      padding: 2rem;
    }
    button {
      font-size: 1.2rem;
      padding: 1rem 2rem;
      background: #bada55;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    h1 {
      color: #754c24;
    }
    input {
      padding: 0.8rem;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <h1>🥔 감자농장에 오신 걸 환영합니다!</h1>
  <input type="text" id="nickname" placeholder="농장 이름을 입력하세요" />
  <br>
  <button id="startFarm">농장 시작하기</button>

  <script>
    document.getElementById("startFarm").addEventListener("click", () => {
      const name = document.getElementById("nickname").value.trim();
      if (!name) {
        alert("이름을 입력해라 이노마!");
        return;
      }
      localStorage.setItem("nickname", name);
      location.href = "gamja-farm.html"; // <-- 이거다, 감자놈아!
    });
  </script>
</body>
</html>
