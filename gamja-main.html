<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>🌱 OrcaX 감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(to bottom right, #f0f9ec, #dcedc8);
      margin: 0;
      padding: 1rem;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #2e7d32;
      margin-bottom: 1rem;
      word-break: keep-all;
    }

    .status-box {
      background: #ffffff;
      border: 2px solid #a5d6a7;
      border-radius: 16px;
      padding: 1.2rem;
      margin: 0 auto;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
    }

    .info {
      font-size: 1rem;
      margin: 0.4rem 0;
      color: #37474f;
    }

    #farmNameBox {
      color: #43a047;
      font-weight: bold;
    }

    .potato-emoji {
      font-size: 2.5rem;
      margin-top: 1rem;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #789262;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.4rem;
      }

      .status-box {
        padding: 1rem;
      }

      .info {
        font-size: 0.95rem;
      }

      .potato-emoji {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <h1>🌱 OrcaX 감자 농장</h1>

  <div class="status-box">
    <p class="info"><strong>👤 닉네임:</strong> <span id="nicknameBox">-</span></p>
    <p class="info"><strong>🌾 농장이름:</strong> <span id="farmNameBox">-</span></p>
    <p class="info">💧 물: <span id="waterCount">-</span></p>
    <p class="info">🧴 거름: <span id="fertilizerCount">-</span></p>
    <p class="info">💰 토큰: <span id="tokenCount">-</span></p>
    <p class="info">🥔 감자 수: <span id="potatoCount">-</span></p>
    <div class="potato-emoji">🥔</div>
  </div>

  <footer>© 2025 OrcaX 감자연합. 감자는 당신 편.</footer>

  <script>
    const nickname = new URLSearchParams(window.location.search).get("nickname");
    if (!nickname) {
      alert("카카오 인증이 없거나 잘못된 접근입니다.");
      window.location.href = "orcax-farm_000.html";
    }

    document.getElementById("nicknameBox").textContent = nickname;
    document.getElementById("farmNameBox").textContent = `${nickname}의 감자농장`;

    async function fetchUserData() {
      try {
        const response = await fetch(`https://orcax-farm-6000.onrender.com/api/userdata?nickname=${nickname}`);
        const data = await response.json();
        if (!data.success || !data.user) {
          alert("등록되지 않은 유저입니다.");
          window.location.href = "orcax-farm_000.html";
          return;
        }

        const user = data.user;
        document.getElementById("waterCount").textContent = user.water;
        document.getElementById("fertilizerCount").textContent = user.fertilizer;
        document.getElementById("tokenCount").textContent = user.token;
        document.getElementById("potatoCount").textContent = user.potatoCount;
      } catch (error) {
        alert("서버 연결 실패. 입구로 돌아갑니다.");
        window.location.href = "orcax-farm_000.html";
      }
    }

    fetchUserData();
  </script>
</body>
</html>
