<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장 시작</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      background: #f2f2f2;
    }

    h1 {
      font-size: 2rem;
      color: #256029;
    }

    input[type="text"] {
      padding: 0.6rem;
      font-size: 1rem;
      width: 60%;
      max-width: 300px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 1rem;
    }

    .confirm-btn {
      display: block;
      margin: 2rem auto 1rem;
      padding: 0.7rem 2rem;
      font-size: 1.2rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .confirm-btn:hover {
      background-color: #45a049;
    }

    .server-check {
      margin-top: 2rem;
      font-size: 0.95rem;
      color: gray;
    }

    .online { color: green; font-weight: bold; }
    .offline { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🌱 나만의 감자 농장을 시작해보세요!</h1>
  <p>원하는 농장 이름을 입력하고 입장하세요.</p>
  <input type="text" id="farmNameInput" placeholder="예: 돌고래 농장" />
  <button class="confirm-btn" onclick="startFarm()">농장 입장</button>

  <div class="server-check" id="serverStatus">🔌 서버 상태 확인 중...</div>

  <script>
    const nickname = localStorage.getItem("nickname");
    if (!nickname) {
      alert("로그인 정보가 없습니다. 로그인 페이지로 이동합니다.");
      window.location.href = "orcax-farm_000.html";
    }

    function startFarm() {
      const farmName = document.getElementById("farmNameInput").value.trim();
      if (!farmName) {
        alert("농장 이름을 입력해주세요.");
        return;
      }
      localStorage.setItem("farmName", farmName);
      window.location.href = "gamja-factory.html";
    }

    async function checkServerPower() {
      const statusBox = document.getElementById("serverStatus");
      try {
        const res = await fetch("https://orcax-farm-6000.onrender.com/api/ping");
        if (res.ok) {
          statusBox.textContent = "✅ 서버 전원 ON: 감자밭 연결 가능!";
          statusBox.classList.add("online");
        } else {
          throw new Error();
        }
      } catch (e) {
        statusBox.textContent = "❌ 서버 전원 OFF: 감자밭 연결 실패";
        statusBox.classList.add("offline");
      }
    }

    checkServerPower();
  </script>
</body>
</html>
