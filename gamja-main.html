<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f1f9e8;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #305030;
      margin: 1rem 0 0.5rem;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem 0.5rem 0;
      color: #305030;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
    }
    #farmNameDisplay {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color: #444;
    }
    #previewName {
      font-size: 1.4rem;
      font-weight: bold;
      color: #507040;
      margin-bottom: 2rem;
    }
    input[type="text"] {
      padding: 0.5rem;
      font-size: 1rem;
      width: 250px;
      margin-bottom: 1rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      background: #85b765;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #739c54;
    }
    @media (max-width: 480px) {
      input[type="text"] {
        width: 80%;
      }
      #nicknameBox {
        font-size: 0.9rem;
        margin-right: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="nicknameBox"></div>

  <h1>🐳 OrcaX 감자 농장에 오신 것을 환영합니다!</h1>
  <div id="container">
    <div id="farmNameDisplay">농장명을 입력해 주세요</div>
    <input type="text" id="farmNameInput" placeholder="예: 아름다운" oninput="previewFarmName()">
    <div id="previewName" style="display: none;"></div>
    <button onclick="startFarm()">🌱 농장 시작하기</button>
  </div>

  <script>
  async function loginAndStartFarm() {
    const input = document.getElementById("farmNameInput").value.trim();
    if (!input) {
      alert("농장명을 입력해주세요!");
      return;
    }

    const nickname = prompt("카카오 닉네임을 입력하세요:");
    if (!nickname) {
      alert("닉네임이 필요합니다.");
      return;
    }

    try {
      // 1. 서버에 로그인 요청 (없으면 생성됨)
      const res = await fetch("https://climbing-wholly-grouper.ngrok-free.app/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
      });

      const data = await res.json();
      if (!data.success) throw new Error("로그인 실패");

      // 2. nickname과 농장명 localStorage 저장
      localStorage.setItem("nickname", nickname);
      localStorage.setItem("farmName", input + "감자농장");

      // 3. 다음 페이지로 이동
      window.location.href = "gamja-factory.html";
    } catch (err) {
      alert("❌ 로그인 실패: " + err.message);
    }
  }
</script>

</body>
</html>
