<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자농장 메인</title>
  <script src="js/gamja-utils.js" type="module"></script>
  <script src="js/gamja-core.js" type="module" defer></script>
  <style>
    body { font-family: sans-serif; background: #fdf6e3; text-align: center; padding: 2rem; }
    button { font-size: 1.2rem; padding: 1rem 2rem; background: #bada55; border: none; border-radius: 10px; }
    h1 { color: #754c24; }
  </style>
</head>
<body>
  <h1>🥔 감자농장에 오신 걸 환영합니다!</h1>
  <input type="text" id="nickname" placeholder="농장 이름을 입력하세요" />
  <button id="startFarm">농장 시작하기</button>

  <script type="module">
    import { saveNickname } from './js/gamja-utils.js';

    document.getElementById("startFarm").addEventListener("click", () => {
      const name = document.getElementById("nickname").value.trim();
      if (!name) return alert("이름을 입력해라 이노마!");
      saveNickname(name);
      location.href = "farm.html"; // 🔥 링크 수정됨: 원래 gamja-factory.html → farm.html
    });
  </script>
</body>
</html>
