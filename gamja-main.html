
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 감자 농장</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #222;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }
    .container {
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .stage {
      margin: 2rem 0;
    }
    .button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      margin-top: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #ffaa00;
      color: #000;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .button:hover {
      background-color: #ff8800;
    }
    .input-group {
      margin-top: 2rem;
      display: none;
    }
    input[type="text"] {
      padding: 0.75rem;
      font-size: 1.2rem;
      border-radius: 8px;
      border: none;
      width: 300px;
      text-align: center;
    }
    .result {
      margin-top: 3rem;
      background-color: #333;
      padding: 2rem;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>나만의 감자 농장</h1>

    <div class="stage" id="farmStage">
      <p>나만의 농장 이름을 지어주세요. 이 이름은 감자 제국에서 당신의 브랜드가 됩니다.</p>
      <button class="button" onclick="startNaming()">🌾 농장 이름 짓기</button>
    </div>

    <div class="input-group" id="nameStage">
      <label for="farmName">농장 이름을 입력하세요</label><br>
      <input type="text" id="farmName" placeholder="예: 아름다운농장" />
      <button class="button" onclick="submitFarmName()">감자밭으로 이동</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script>
    function startNaming() {
      document.getElementById('farmStage').style.display = 'none';
      document.getElementById('nameStage').style.display = 'block';
    }

    function submitFarmName() {
      const name = document.getElementById('farmName').value.trim();
      if (!name) {
        alert('농장 이름을 입력해주세요!');
        return;
      }
      localStorage.setItem("farmName", name);
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `🌾 당신의 농장은 <strong>[${name}]</strong> 입니다.`;
      resultDiv.style.display = 'block';
      setTimeout(() => {
        window.location.href = 'gamja-factory.html';
      }, 2000);
    }
  </script>
</body>
</html>
