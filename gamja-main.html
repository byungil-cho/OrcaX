<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>GamjaX 감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Arial', sans-serif; background: #f1f9e8; padding: 1rem; margin: 0; }
    h1, h2 { text-align: center; color: #305030; margin: 1rem 0; }
    #container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
    #farmNameDisplay { font-size: 1.5rem; margin-bottom: 2rem; }
    input[type="text"] {
      padding: 0.5rem;
      font-size: 1rem;
      width: 250px;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.6rem 1.2rem; font-size: 1rem;
      background: #85b765; color: white; border: none;
      border-radius: 5px; cursor: pointer;
    }
    button:hover { background-color: #739c54; }
  </style>
</head>
<body>
  <div id="container">
    <h1>GamjaX 감자 농장에 오신 것을 환영합니다!</h1>
    <div id="farmNameDisplay">감자 농장을 시작하려면 <strong>농장명</strong>을 입력하세요</div>
    <input type="text" id="farmNameInput" placeholder="예: 홍">
    <button onclick="startFarm()">농장 시작하기</button>
  </div>

  <script>
    function startFarm() {
      const input = document.getElementById("farmNameInput").value.trim();
      if (!input) {
        alert("농장명을 입력해주세요");
        return;
      }
      const farmName = input + "감자농장";
      localStorage.setItem("farmName", farmName); // 로컬에만 저장
      window.location.href = "gamja-factory.html";
    }

    // 기존 카카오 로그인에서 닉네임이 localStorage에 저장된 상태여야 함
    const kakaoNickname = localStorage.getItem("nickname") || "방문자";
  </script>
</body>
</html>
