<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감자 농장 입장</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-image: url('images/gamja-field.jpg'); /* 배경 이미지 - 감자 밭 */
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #406c35;
      text-shadow: 1px 1px 3px #fff;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    input {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: none;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    button {
      padding: 0.8rem 1.4rem;
      font-size: 1rem;
      background-color: #98c37b;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #6eaa5c;
    }
  </style>
</head>
<body>
  <h1>감자 농장에 오신 걸 환영합니다!</h1>
  <input type="text" id="nicknameInput" placeholder="닉네임 입력">
  <button onclick="startGame()">시작하기</button>

  <script>
    function startGame() {
      const nickname = document.getElementById('nicknameInput').value.trim();
      if (!nickname) {
        alert('닉네임을 입력하세요.');
        return;
      }
      localStorage.setItem('nickname', nickname);

      // 기본 자원 지급
      localStorage.setItem('gamja_tokens', '5');
      localStorage.setItem('gamja_water', '10');
      localStorage.setItem('gamja_fertilizer', '10');

      // 추후 서버에 사용자 등록도 가능하도록 API 연동 준비
      // 예: fetch('/api/user/register', { method: 'POST', body: JSON.stringify({ nickname }) })

      window.location.href = 'gamja-factory.html';
    }
  </script>
</body>
</html>
