<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 감자 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f1f9e8;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #305030;
      margin: 1rem 0 0.5rem;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem 0.5rem 0;
      color: #305030;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
    }
    #farmNameDisplay {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color: #444;
    }
    #previewName {
      font-size: 1.4rem;
      font-weight: bold;
      color: #507040;
      margin-bottom: 2rem;
    }
    input[type="text"] {
      padding: 0.5rem;
      font-size: 1rem;
      width: 250px;
      margin-bottom: 1rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      background: #85b765;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #739c54;
    }
    @media (max-width: 480px) {
      input[type="text"] {
        width: 80%;
      }
      #nicknameBox {
        font-size: 0.9rem;
        margin-right: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="nicknameBox"></div>

  <h1>🐳 OrcaX 감자 농장에 오신 것을 환영합니다!</h1>
  <div id="container">
    <div id="farmNameDisplay">농장명을 입력해 주세요</div>
    <input type="text" id="farmNameInput" placeholder="예: 아름다운" oninput="previewFarmName()">
    <div id="previewName" style="display: none;"></div>
    <button onclick="startFarm()">🌱 농장 시작하기</button>
  </div>

  <script>
    // 닉네임 표시
    const nickname = localStorage.getItem("nickname") || "방문자";
    document.getElementById("nicknameBox").textContent = `👤 ${nickname} 님`;

    // 입력 시 미리보기 표시
    function previewFarmName() {
      const input = document.getElementById("farmNameInput").value.trim();
      const preview = document.getElementById("previewName");
      if (input) {
        preview.textContent = input + "감자농장";
        preview.style.display = "block";
      } else {
        preview.style.display = "none";
      }
    }

    // 저장 후 다음 화면 이동
    function startFarm() {
      const input = document.getElementById("farmNameInput").value.trim();
      if (!input) {
        alert("농장명을 입력해주세요!");
        return;
      }
      const farmName = input + "감자농장";
      localStorage.setItem("farmName", farmName);
      window.location.href = "gamja-factory.html";
    }
  </script>
</body>
</html>
