<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>큰딸의 어린시절 마지막 페이지 – 가족의 소중한 추억</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px;
    }
    h1 {
      text-align: center;
      color: #3a5e9e;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #999;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
      line-height: 1.4;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #3a5e9e;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 95vw;
      max-height: 90vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 80vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
    }
    @media (max-width: 680px) {
      .album-container { padding: 12px 4px; }
      h1 { font-size: 1.3rem; }
      .desc { font-size: 0.9rem; }
      .big-img-box { max-width: 98vw; max-height: 90vh; padding: 12px; }
      .big-img { max-width: 95vw; max-height: 60vh; }
      .thumb {
        width: 80px;
        height: 80px;
        border-radius: 12px;
      }
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .nav-links a {
      color: #3a5e9e;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover {
      background: #e6f0ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>큰딸의 어린시절 마지막 추억</h1>
    <div class="desc">
      큰딸의 성장 마지막 페이지.<br>
      가족의 품, 자연, 웃음, 그리고 사랑이 담긴 23장의 소중한 사진을 모았습니다.
    </div>
    <div class="thumbnails" id="thumbnails"></div>
    <div class="nav-links">
      <a href="house_01_002_01.html">이전</a>
      <a href="house_01.html">메인</a>
      <a href="house_01_003.html">동생 보러가기</a>
    </div>
  </div>

  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()" />
      <div id="bigCaption" class="caption"></div>
    </div>
  </div>

  <script>
    const images = [
      { src: "img/+-1_01_28.jpg", caption: "숲속에서 아버지와 두 딸이 친구와 함께한 추억의 한 장면. 모두가 웃으며 자연을 만끽하는 순간." },
      { src: "img/+-1_01_29.jpg", caption: "엄마와 딸이 나무 벤치에 앉아 환하게 웃는다. 따스한 햇살 아래 행복이 가득한 하루." },
      { src: "img/+-1_01_30.jpg", caption: "쌍둥이처럼 닮은 자매와 엄마, 세 사람이 나란히 앉아 음료를 마시며 여유로운 시간을 보낸다." },
      { src: "img/+-1_01_31.jpg", caption: "노란 한복을 입은 큰딸과 엄마, 그리고 귀여운 동생의 모습. 꽃다발과 한복이 봄날의 기운을 담고 있다." },
      { src: "img/+-1_01_32.jpg", caption: "엄마, 아빠, 두 딸이 산길에서 함께한 가족 나들이. 모두의 얼굴에 행복이 가득 묻어난다." },
      { src: "img/+-1_01_33.jpg", caption: "할머니와 두 손녀가 케이크 앞에서 환하게 웃는 생일날의 추억. 모두가 함께한 소중한 시간." },
      { src: "img/+-1_01_34.jpg", caption: "결혼식장에서 하얀 드레스를 입은 신부와 두 소녀. 서로 닮은 세 사람이 나란히 앉아 있다." },
      { src: "img/+-1_01_35.jpg", caption: "봄날 벚꽃길을 함께 걷는 두 자매. 활짝 웃는 얼굴에 봄기운이 가득하다." },
      { src: "img/+-1_01_36.jpg", caption: "화려한 놀이공원에서 할머니와 두 손녀가 함께한 즐거운 하루." },
      { src: "img/+-1_01_37.jpg", caption: "노란 꽃다발을 들고 향기를 맡으며 행복해하는 큰딸. 어린 시절의 순수함이 전해진다." },
      { src: "img/+-1_01_38.jpg", caption: "꽃밭에서 꽃씨를 뿌리는 듯한 포즈의 큰딸. 자연과 하나 되는 순간." },
      { src: "img/+-1_01_39.jpg", caption: "핑크색 꽃과 초록 잎이 어우러진 정원에서 두 자매가 나란히 서 있다." },
      { src: "img/+-1_01_40.jpg", caption: "가을 단풍나무 아래에서 두 자매가 꼭 껴안고 웃으며, 계절의 색깔을 닮아가는 모습." },
      { src: "img/+-1_01_41.jpg", caption: "계곡에서 엄마와 두 딸이 시원하게 피서를 즐기는 한여름의 추억." },
      { src: "img/+-1_01_42.jpg", caption: "한복을 곱게 차려입고 소파에 앉은 할아버지와 두 손녀. 가족애가 묻어나는 장면." },
      { src: "img/+-1_01_43.jpg", caption: "귀여운 선글라스와 털목도리, 두 자매의 멋진 패션쇼! 장난기 가득한 표정이 웃음을 준다." },
      { src: "img/+-1_01_44.jpg", caption: "바닷가에서 바람을 맞으며 걷는 두 자매. 겨울 바다의 추억이 담겨 있다." },
      { src: "img/+-1_01_45.jpg", caption: "푸른 하늘 아래, 나무 옆에서 장난스러운 포즈의 두 자매. 자연 속에서 자유로운 모습." },
      { src: "img/+-1_01_46.jpg", caption: "잔디밭에서 함께 웃고 있는 두 자매. 큰딸의 익살스러운 표정과 동생의 해맑은 웃음이 인상적이다." },
      { src: "img/+-1_01_47.jpg", caption: "온 가족이 한자리에 모여 찍은 설날 단체사진. 모두 한복을 곱게 차려입고 환하게 웃는다." },
      { src: "img/+-1_01_48.jpg", caption: "시골길을 홀로 걷는 큰딸의 모습. 어린 시절의 평화로운 한 장면." },
      { src: "img/+-1_01_49.jpg", caption: "유치원 발표회에서 악기를 연주하는 큰딸. 진지한 표정에 열정이 느껴진다." },
      { src: "img/+-1_01_50.jpg", caption: "노란 우비를 입고 장난스럽게 브이 포즈! 비 오는 날마저 즐겁게 만드는 큰딸의 미소." }
    ];

    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="photo${idx+1}">`;
      el.onclick = () => showBig(idx);
      thumbs.appendChild(el);
    });

    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }

    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }

    function escHandler(e) {
      if (e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
