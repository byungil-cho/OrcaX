<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>신혼의 시작 – 우리의 가족 앨범</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px 32px 18px;
    }
    h1 {
      text-align: center;
      color: #3a5e9e;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #999;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #3a5e9e;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top:0; left:0; width:100vw; height:100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity:0;}
      to {opacity:1;}
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 84vw;
      max-height: 80vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from {transform: scale(0.94);}
      to {transform: scale(1);}
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 70vw;
      max-height: 56vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
    }
    @media (max-width: 680px) {
      .album-container {padding: 12px 4px;}
      h1 {font-size: 1.17rem;}
      .big-img-box {max-width: 99vw; max-height: 94vh;}
      .big-img {max-width: 94vw; max-height: 60vh;}
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .nav-links a {
      color: #3a5e9e;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
    }
    .nav-links a:hover {
      background: #e6f0ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>신혼의 시작 – 우리의 가족 앨범</h1>
    <div class="desc">
      1990년 6월, 두 사람이 하나 되어 걷기 시작한 첫 여정.<br>
      결혼식, 전통혼례, 신혼여행, 그리고 가족의 추억.<br>
      사랑과 설렘, 가족의 온기가 깃든 소중한 순간을 모았습니다.
    </div>
    <div class="thumbnails" id="thumbnails">
      <!-- 썸네일 자동삽입 -->
    </div>
    <div class="nav-links">
      <a href="house_01_002.html">이전</a>
      <a href="house_01_004.html">다음</a>
    </div>
  </div>
  <!-- 오버레이/큰이미지 -->
  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()">
      <div id="bigCaption" class="caption"></div>
      <div id="bigCaptionSm" class="caption sm"></div>
    </div>
  </div>
  <script>
    // 이미지 정보(20장)
    const images = [
      { src: "img/house_01_03_01.jpg",  caption: "결혼식장의 첫 설렘, 신랑 신부의 행복한 미소." },
      { src: "img/house_01_03_02.jpg",  caption: "주례와 가족, 모두가 지켜보는 사랑의 약속." },
      { src: "img/house_01_03_03.jpg",  caption: "신부 대기실에서의 단아한 순간과 피아노 연주." },
      { src: "img/house_01_03_04.jpg",  caption: "가족, 친지들과 함께한 대가족의 기념사진." },
      { src: "img/house_01_03_05.jpg",  caption: "전통 혼례복 차림의 엄숙한 예식." },
      { src: "img/house_01_03_06.jpg",  caption: "신랑의 환한 미소, 설레는 신혼의 첫발." },
      { src: "img/house_01_03_07.jpg",  caption: "신부의 우아한 모습, 신혼여행의 시작." },
      { src: "img/house_01_03_08.jpg",  caption: "호텔에서 남긴 다정한 커플의 사진." },
      { src: "img/house_01_03_09.jpg",  caption: "호텔 프론트에서 신부의 단독 포즈." },
      { src: "img/house_01_03_10.jpg",  caption: "꽃 프레임 속 두 사람, 신혼의 설렘." },
      { src: "img/house_01_03_11.jpg",  caption: "장엄한 풍경 아래 남긴 여행의 추억 한 장." },
      { src: "img/house_01_03_12.jpg",  caption: "자동차 미러에 비친 신혼부부의 웃음." },
      { src: "img/house_01_03_13.jpg",  caption: "바다와 밭, 자연 속 신부의 아름다운 모습." },
      { src: "img/house_01_03_14.jpg",  caption: "꽃과 함께 웃는 신부, 행복이 가득한 순간." },
      { src: "img/house_01_03_15.jpg",  caption: "돌담길을 따라 걷는 신혼부부." },
      { src: "img/house_01_03_16.jpg",  caption: "발랄한 신혼여행, 청자켓과 모자 스타일." },
      { src: "img/house_01_03_17.jpg",  caption: "진갑잔치, 가족 모두의 기념사진(1991.3.16)" },
      { src: "img/house_01_03_18.jpg",  caption: "한복 입은 가족, 세대가 어우러진 따뜻한 풍경." },
      { src: "img/house_01_03_19.jpg",  caption: "1980~90년대 동네 풍경, 시간의 기록." },
      { src: "img/house_01_03_20.jpg",  caption: "묘소에서 두 사위와, 세대가 이어지는 대화." }
    ];
    // 추가 한줄 설명(분위기, 느낌)
    const captions_sm = [
      "새로운 시작, 설렘 가득한 첫날.",
      "가족과 지인들의 축복 속에서.",
      "피아노 소리와 함께 담은 신부의 미소.",
      "가족의 사랑이 한 자리에.",
      "옛 전통과 현대의 조화.",
      "신랑의 밝은 표정이 모든 걸 말해준다.",
      "여행길의 첫 추억.",
      "호텔의 따뜻한 공기처럼 다정하게.",
      "프론트에서 느끼는 일상 속의 설렘.",
      "꽃처럼 피어나는 행복.",
      "장엄한 자연, 두 사람의 약속.",
      "거울 속에 담긴 부부의 웃음.",
      "제주 바다, 자연과 어우러진 모습.",
      "꽃향기처럼 번지는 미소.",
      "돌담길 따라 사랑이 흐른다.",
      "활기찬 신혼여행의 한 장면.",
      "가족 모두 함께한 소중한 시간.",
      "한복 속에 담긴 가족애.",
      "옛 시절 동네의 따뜻함.",
      "세대를 이어주는 가족의 의미."
    ];
    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="photo${idx+1}">`;
      el.onclick = ()=>showBig(idx);
      thumbs.appendChild(el);
    });

    // 큰 이미지 보여주기
    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('bigCaptionSm').textContent = captions_sm[idx];
      document.getElementById('overlay').style.display = 'flex';
      // 큰 사진 클릭하면 닫히기
      document.getElementById('bigImg').onclick = hideBig;
      // ESC 키 닫기
      document.addEventListener('keydown', escHandler);
    }
    // 닫기
    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }
    // ESC 키 핸들러
    function escHandler(e){
      if(e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
