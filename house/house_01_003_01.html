<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>작은딸 성장앨범 – 맞춤 설명 23장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px;
    }
    h1 {
      text-align: center;
      color: #3a5e9e;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #999;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
      line-height: 1.4;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #3a5e9e;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 95vw;
      max-height: 90vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 80vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
    }
    @media (max-width: 680px) {
      .album-container { padding: 12px 4px; }
      h1 { font-size: 1.3rem; }
      .desc { font-size: 0.9rem; }
      .big-img-box { max-width: 98vw; max-height: 90vh; padding: 12px; }
      .big-img { max-width: 95vw; max-height: 60vh; }
      .thumb {
        width: 80px;
        height: 80px;
        border-radius: 12px;
      }
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .nav-links a {
      color: #3a5e9e;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover {
      background: #e6f0ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>작은딸의 성장앨범 – 23장의 실제 추억</h1>
    <div class="desc">
      실제 사진을 하나하나 보며, 기억과 상황에 맞는 설명을 정성스럽게 담았습니다.<br>
      작은딸의 성장과 가족의 따뜻한 순간이 함께하는 앨범입니다.
    </div>
    <div class="thumbnails" id="thumbnails"></div>
    <div class="nav-links">
      <a href="house_01_003.html">이전</a>
      <a href="house_01_003_02.html">다음</a>
      <a href="house_01.html">메인</a>
    </div>
  </div>

  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()" />
      <div id="bigCaption" class="caption"></div>
      <div id="bigCaptionSm" class="caption sm"></div>
    </div>
  </div>

  <script>
    // 실제 올리신 파일명, 사진 내용에 맞춘 설명
    const images = [
      { src: "img/house_01_003_22.jpg", caption: "언니와 함께 한복을 곱게 차려입고 생일파티에서 환하게 웃는 모습.", sm: "생일날, 한복 차림 자매의 미소" },
      { src: "img/house_01_003_23.jpg", caption: "작은 손 위에 앉은 새와 함께, 유치원 체험학습의 호기심 가득한 눈빛.", sm: "유치원 체험학습, 새와 만남" },
      { src: "img/house_01_003_24.jpg", caption: "놀이동산에서 할머니, 언니와 함께 타는 썰매. 겨울의 설렘과 즐거움.", sm: "겨울 썰매, 가족과 함께" },
      { src: "img/house_01_003_25.jpg", caption: "엄마 품에 안겨 밝게 웃는 일상. 가족의 사랑이 느껴지는 순간.", sm: "엄마 품, 평범한 일상의 행복" },
      { src: "img/house_01_003_26.jpg", caption: "벚꽃길 아래에서 언니와 나란히, 봄날의 환한 미소가 가득한 모습.", sm: "벚꽃길, 자매의 봄 소풍" },
      { src: "img/house_01_003_27.jpg", caption: "생일케이크와 함께 가족 모두가 환하게 웃던 집안의 소소한 파티.", sm: "생일파티, 온가족" },
      { src: "img/house_01_003_28.jpg", caption: "엄마와 언니, 그리고 나.바닷가를 따라 가족과 함께 산책하며 평범한 일상 속 작은 행복을 느끼던 소중한 순간..", sm: "엄마와 두 딸이 바닷가를 산책하는 장면" },
      { src: "img/house_01_003_29.jpg", caption: "유치원 선생님과 함께 추억 속에 담긴 사진.", sm: "유치원 선생님과 함께" },
      { src: "img/house_01_003_30.jpg", caption: "돌 위에서 미소 짓는 어린 나의 겨울날 추억..", sm: "포근한 겨울날의 미소" },
      { src: "img/house_01_003_31.jpg", caption: "아빠와 벤치에 앉아 도란도란 대화 나누던 여유로운 오후.", sm: "아빠와 벤치에서, 산책" },
      { src: "img/house_01_003_32.jpg", caption: "아빠 무릎에 앉아 세상을 바라보는, 든든함과 사랑이 느껴지는 순간.", sm: "아빠 무릎, 든든한 가족" },
      { src: "img/house_01_003_33.jpg", caption: "아빠와 손잡고 산길을 오르내리며 자연을 만끽하는 풍경.", sm: "산길 걷기, 아빠와 함께" },
      { src: "img/house_01_003_34.jpg", caption: "엄마와 언니, 그리고 나.바닷가를 따라 가족과 함께 산책하며 평범한 일상 속 작은 행복을 느끼던 소중한 순간..", sm: "엄마와 두 딸이 바닷가를 산책하는 장면" },
      { src: "img/house_01_003_36.jpg", caption: "도자기 가마터에서 엄마, 언니와 특별한 체험을 하던 즐거운 하루.", sm: "도자기 체험, 가족" },
      { src: "img/house_01_003_37.jpg", caption: "생일케이크와 함께 가족 모두가 환하게 웃던 집안의 소소한 파티.", sm: "생일파티, 온가족" },
      { src: "img/house_01_003_38.jpg", caption: "봄꽃이 만발한 꽃길에서 해맑게 웃던, 순수한 나들이의 한 장면.", sm: "봄나들이, 꽃길 미소" },
      { src: "img/house_01_003_39.jpg", caption: "귀여운 머리띠를 하고 의자에 앉아 순수하게 웃는 어린 시절.", sm: "머리띠, 어린이의 미소" },
      { src: "img/house_01_003_40.jpg", caption: "나무 장작더미 옆에서 햇살을 맞으며 활짝 웃던 어린 시절의 밝은 모습.", sm: "장작더미, 햇살과 웃음" },
      { src: "img/house_01_003_35.jpg", caption: "엄마와 함께 봄나들이와서 추억의 사진.", sm: "엄마와 함께 한시간" },
      { src: "img/house_01_003_42.jpg", caption: "파도가 넘실대는 바닷가에서 아빠, 언니와 함께한 추억의 순간.", sm: "바닷가, 가족과 추억" },
      { src: "img/house_01_003_43.jpg", caption: "도자기 가마 앞에서 엄마, 언니와 함께 찍은 유쾌한 가족 사진.", sm: "도자기 가마, 가족" },
      { src: "img/house_01_003_44.jpg", caption: "할머니와 손잡고 바닷가를 걸으며 나눈 소중한 교감.", sm: "할머니, 바닷가 산책" },
     ];

    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="photo${idx+1}">`;
      el.onclick = () => showBig(idx);
      thumbs.appendChild(el);
    });

    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('bigCaptionSm').textContent = images[idx].sm;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }

    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }

    function escHandler(e) {
      if (e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
