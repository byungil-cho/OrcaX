<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>영원의 집 1호 – 고등학교 시절 추억 앨범</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans+KR:400,500,700,900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 60% 16%, #23457c 0%, #0d2945 100%);
      font-family: 'Noto Sans KR', 'Spoqa Han Sans', sans-serif;
      color: #e9eaf6;
      min-height: 100vh;
    }
    .album-main-title {
      text-align: center;
      font-size: 2.1rem;
      margin-top: 34px;
      font-weight: 700;
      color: #355da8;
      letter-spacing: 0.04em;
      line-height: 1.18;
    }
    .album-desc {
      text-align: center;
      font-size: 1.04rem;
      color: #b8bec9;
      font-weight: 400;
      margin-bottom: 26px;
      margin-top: 10px;
      line-height: 1.6;
    }
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 16px;
      max-width: 880px;
      margin: 0 auto 34px auto;
      padding: 0 3vw;
    }
    .album-item {
      background: rgba(22,30,48, 0.88);
      border-radius: 13px;
      box-shadow: 0 2px 10px 0 rgba(25,37,73, 0.15);
      padding: 12px 7px 13px 7px;
      text-align: center;
      min-width: 0;
      cursor: default;
      transition: none;
      user-select: none;
    }
    .album-thumb {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      margin: 0 auto 7px auto;
      box-shadow: 0 1px 7px 0 rgba(20,28,52, 0.14);
      display: block;
      pointer-events: none;
    }
    .album-era {
      font-size: 0.90rem;
      color: #7ec0f7;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
      margin-bottom: 2px;
      margin-top: 2px;
      letter-spacing: 0.02em;
    }
    .album-caption {
      font-size: 0.91rem;
      color: #cfd6e2;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 400;
      line-height: 1.43;
      margin-bottom: 0;
      letter-spacing: 0.01em;
      min-height: 32px;
    }
    .nav-btns {
      margin: 34px 0 13px 0;
      text-align: center;
    }
    .nav-btn {
      background: linear-gradient(90deg,#3697ff 0%, #64bbe7 100%);
      color: #fff;
      border: none;
      border-radius: 15px;
      font-size: 1.01rem;
      padding: 10px 24px;
      margin: 0 13px;
      box-shadow: 0 2px 8px 0 rgba(38,80,158, 0.11);
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: background 0.15s;
      display: inline-block;
    }
    .nav-btn:hover { background: linear-gradient(90deg,#60b9ff 0%, #4be2ff 100%); color: #17305a;}
    @media (max-width: 700px) {
      .album-grid { gap: 9px; }
      .album-item { padding: 8px 2px 9px 2px; }
      .album-thumb { width: 80px; height: 80px; }
      .album-era { font-size: 0.84rem; }
      .album-caption { font-size: 0.87rem; min-height: 22px;}
      .album-main-title { font-size: 1.16rem; margin-top: 16px;}
      .album-desc { font-size: 0.93rem;}
    }
  </style>
</head>
<body>
  <div class="album-main-title">
    고등학교 시절 추억 앨범
  </div>
  <div class="album-desc">
    초등학교부터 고등학교 졸업, 그리고 고향에서의 젊은 시절까지.<br>
    사진 한 장 한 장에 담긴 추억과 성장의 순간들,<br>
    가족, 친구들과 함께 한 소중했던 학창시절의 이야기를 한 자리에 모았습니다.
  </div>
  <div class="album-grid" id="albumGrid"></div>
  <div class="nav-btns">
    <a href="house_01_02.html" class="nav-btn">다음 사진 앨범으로</a>
    <a href="story.html" class="nav-btn">스토리로 돌아가기</a>
  </div>
  <script>
    const albumData = [
      { src: "img/house_01_01_01.jpg", era: "초등학교 시절 증명사진", caption: "어린 시절의 모습. 순수하고 맑았던 초등학교 시절 증명사진." },
      { src: "img/house_01_01_02.jpg", era: "중학교 시절 증명사진", caption: "조금씩 성장해가던, 중학교 때의 풋풋함이 담긴 증명사진." },
      { src: "img/house_01_01_03.jpg", era: "고등학교 시절 증명사진", caption: "자유와 청춘의 기운이 느껴지는 고등학교 시절의 모습." },
      { src: "img/house_01_01_04.jpg", era: "고등학교 졸업 후, 20대 초반", caption: "졸업 후, 사회로 나가기 전의 설렘과 각오가 담긴 사진." },
      { src: "img/house_01_01_05.jpg", era: "고등학교 시절", caption: "집에서 친구와 함께 찍은 정겨운 한 컷. 1980년대 시골의 소박한 풍경과 따뜻함이 느껴진다." },
      { src: "img/house_01_01_06.jpg", era: "고등학교 시절", caption: "평범한 일상 속에서의 나, 그 시절의 패션과 감성." },
      { src: "img/house_01_01_07.jpg", era: "고등학교 시절", caption: "고향 들판에서 자유를 만끽하며. 푸른 자연이 배경이 되었던 소중한 시간." },
      { src: "img/house_01_01_08.jpg", era: "고등학교 시절", caption: "자전거를 타며, 친구들과 함께 했던 즐거운 추억." },
      { src: "img/house_01_01_09.jpg", era: "고등학교 시절", caption: "수학여행 또는 친구들과의 여행길, 명소에서의 단체 사진." },
      { src: "img/house_01_01_10.jpg", era: "고등학교 시절", caption: "교복을 입고 버스에 기대어 선명한 청춘의 한 페이지." },
      { src: "img/house_01_01_11.jpg", era: "고등학교 시절", caption: "맨발로 개울가에서, 우정으로 하나 되었던 학창시절." },
      { src: "img/house_01_01_12.jpg", era: "고등학교 시절", caption: "봄이 오면, 들판과 숲에서 친구들과 함께한 시간." },
      { src: "img/house_01_01_13.jpg", era: "고등학교 시절", caption: "군복 차림으로, 미래의 꿈을 품었던 순간." },
      { src: "img/house_01_01_14.jpg", era: "고등학교 시절", caption: "친구와 함께한 봄날의 들판, 자연과 어우러진 우정." },
      { src: "img/house_01_01_15.jpg", era: "고등학교 시절", caption: "오토바이 위에서 젊음을 즐기던 한때." },
      { src: "img/house_01_01_16.jpg", era: "고등학교 시절", caption: "셋이 함께한 포즈, 변치 않는 우정과 추억의 시작." },
      { src: "img/house_01_01_17.jpg", era: "고등학교 시절", caption: "황금 들녘, 친구들과의 미소 가득한 단체사진." },
      { src: "img/house_01_01_18.jpg", era: "고등학교 시절", caption: "흙바닥 운동장에서 장난기 넘치던 씨름 한판!" },
      { src: "img/house_01_01_19.jpg", era: "고등학교 시절", caption: "교복 입고 버스 앞에서, 늘 함께였던 친구들." },
      { src: "img/house_01_01_20.jpg", era: "고등학교 시절", caption: "수련회 혹은 현장학습에서의 단체 포즈." },
      { src: "img/house_01_01_21.jpg", era: "고등학교 시절", caption: "동물원 견학, 어린 시절의 호기심과 활력이 가득." },
      { src: "img/house_01_01_22.jpg", era: "고등학교 시절", caption: "야외 단체사진, 친구들과 함께한 소중한 시간." },
      { src: "img/house_01_01_23.jpg", era: "고등학교 시절", caption: "여행지에서 편안하게 기대어, 청춘의 여유와 낭만." }
    ];
    const albumGrid = document.getElementById("albumGrid");
    function renderAlbum() {
      albumGrid.innerHTML = "";
      albumData.forEach((item) => {
        const albumItem = document.createElement("div");
        albumItem.className = "album-item";
        albumItem.tabIndex = -1;
        albumItem.style.cursor = "default";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.caption;
        img.className = "album-thumb";
        img.draggable = false;
        albumItem.appendChild(img);

        const era = document.createElement("div");
        era.className = "album-era";
        era.textContent = item.era;
        albumItem.appendChild(era);

        const cap = document.createElement("div");
        cap.className = "album-caption";
        cap.textContent = item.caption;
        albumItem.appendChild(cap);

        albumGrid.appendChild(albumItem);
      });
    }
    renderAlbum();
  </script>
</body>
</html>
