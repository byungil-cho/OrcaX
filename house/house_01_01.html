<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>영원의 집 1호 – 고등학교 시절 추억 앨범</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans+KR:400,500,700,900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0;
      background: radial-gradient(circle at 60% 16%, #23457c 0%, #0d2945 100%);
      font-family: 'Noto Sans KR', 'Spoqa Han Sans', sans-serif;
      color: #e9eaf6;
      min-height: 100vh;
    }
    .album-main-title {
      text-align: center;
      font-size: 2.1rem;
      margin-top: 34px;
      font-weight: 700;
      color: #355da8;
      letter-spacing: 0.04em;
      line-height: 1.18;
    }
    .album-desc {
      text-align: center;
      font-size: 1.04rem;
      color: #b8bec9;
      font-weight: 400;
      margin-bottom: 26px;
      margin-top: 10px;
      line-height: 1.6;
    }
    .album-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px 16px;
      max-width: 950px;
      margin: 0 auto 34px auto;
      padding: 0 2vw;
    }
    @media (max-width: 1050px) { .album-grid { max-width: 680px; } }
    @media (max-width: 900px)  { .album-grid { grid-template-columns: repeat(3, 1fr); max-width: 500px;}}
    @media (max-width: 700px)  { .album-grid { grid-template-columns: repeat(2, 1fr); max-width: 95vw; gap: 11px 7px; } }
    .album-item {
      background: rgba(28,36,53, 0.91);
      border-radius: 15px;
      box-shadow: 0 3px 12px 0 rgba(20,30,55,0.14);
      padding: 16px 5px 13px 5px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: box-shadow 0.15s, transform 0.13s;
    }
    .album-item:hover {
      box-shadow: 0 7px 24px 0 rgba(34,65,139,0.18);
      transform: translateY(-2px) scale(1.025);
      background: rgba(35,50,85, 0.99);
    }
    .album-thumb-wrap {
      width: 120px;
      height: 120px;
      background: #f7fafc1a;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      margin-top: 6px;
      box-shadow: 0 2px 7px 0 rgba(22,34,62,0.12);
      position: relative;
    }
    .album-thumb {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 1px 6px 0 rgba(20,28,52, 0.10);
      display: block;
      background: #191e2e;
      pointer-events: none; /* 작은사진 클릭 안되게 */
    }
    .album-era {
      font-size: 0.93rem;
      color: #7ec0f7;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
      margin-bottom: 2px;
      letter-spacing: 0.02em;
    }
    .album-caption {
      font-size: 0.89rem;
      color: #cfd6e2;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.01em;
      min-height: 32px;
      text-align: center;
    }
    /* 큰사진 오버레이 */
    .overlay {
      position: fixed; top:0; left:0; width:100vw; height:100vh;
      background: rgba(17,25,44, 0.93);
      z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      animation: fadeIn 0.19s;
    }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
    .overlay-img {
      width: min(98vw, 660px);
      height: min(65vw, 460px);
      max-height: 68vh;
      object-fit: contain;
      border-radius: 24px;
      margin-bottom: 15px;
      box-shadow: 0 6px 28px 0 rgba(29,48,86, 0.26);
      background: #181c25;
      display: block;
    }
    .overlay-era {
      font-size: 1.17rem;
      color: #8bc0ff;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
      margin-bottom: 6px;
      margin-top: 2px;
      text-align: center;
    }
    .overlay-caption {
      font-size: 1.05rem;
      color: #e7ecfa;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 400;
      text-align: center;
      line-height: 1.54;
      margin-bottom: 19px;
      margin-top: 3px;
      max-width: 98vw;
    }
    .overlay-close {
      background: #355da8;
      color: #fff;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
      font-size: 1.01rem;
      border: none;
      border-radius: 18px;
      padding: 10px 38px;
      margin-top: 11px;
      cursor: pointer;
      box-shadow: 0 2px 12px 0 rgba(16,34,63, 0.18);
      transition: background 0.14s;
    }
    .overlay-close:hover {
      background: #78b9f7;
      color: #18386b;
    }
    .nav-btns {
      margin: 34px 0 13px 0;
      text-align: center;
    }
    .nav-btn {
      background: linear-gradient(90deg,#3697ff 0%, #64bbe7 100%);
      color: #fff;
      border: none;
      border-radius: 15px;
      font-size: 1.01rem;
      padding: 10px 24px;
      margin: 0 13px;
      box-shadow: 0 2px 8px 0 rgba(38,80,158, 0.11);
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: background 0.15s;
      display: inline-block;
    }
    .nav-btn:hover { background: linear-gradient(90deg,#60b9ff 0%, #4be2ff 100%); color: #17305a;}
  </style>
</head>
<body>
  <div class="album-main-title">고등학교 시절 추억 앨범</div>
  <div class="album-desc">
    초등학교부터 고등학교 졸업, 그리고 고향에서의 젊은 시절까지.<br>
    사진 한 장 한 장에 담긴 추억과 성장의 순간들,<br>
    가족, 친구들과 함께 한 소중했던 학창시절의 이야기를 한 자리에 모았습니다.
  </div>
  <div class="album-grid" id="albumGrid"></div>
  <div class="nav-btns">
    <a href="house_01_02.html" class="nav-btn">다음 사진 앨범으로</a>
    <a href="story.html" class="nav-btn">스토리로 돌아가기</a>
  </div>
  <div id="overlay" style="display:none"></div>
  <script>
    const albumData = [
      { src: "img/house_01_01_01.jpg", era: "초등학교 시절 증명사진", caption: "어린 시절의 모습. 순수하고 맑았던 초등학교 시절 증명사진." },
      { src: "img/house_01_01_02.jpg", era: "중학교 시절 증명사진", caption: "조금씩 성장해가던, 중학교 때의 풋풋함이 담긴 증명사진." },
      { src: "img/house_01_01_03.jpg", era: "고등학교 시절 증명사진", caption: "자유와 청춘의 기운이 느껴지는 고등학교 시절의 모습." },
      { src: "img/house_01_01_04.jpg", era: "고등학교 졸업 후, 20대 초반", caption: "졸업 후, 사회로 나가기 전의 설렘과 각오가 담긴 사진." },
      { src: "img/house_01_01_05.jpg", era: "고등학교 시절", caption: "집에서 친구와 함께 찍은 정겨운 한 컷. 1980년대 시골의 소박한 풍경과 따뜻함이 느껴진다." },
      { src: "img/house_01_01_06.jpg", era: "고등학교 시절", caption: "평범한 일상 속에서의 나, 그 시절의 패션과 감성." },
      { src: "img/house_01_01_07.jpg", era: "고등학교 시절", caption: "고향 들판에서 자유를 만끽하며. 푸른 자연이 배경이 되었던 소중한 시간." },
      { src: "img/house_01_01_08.jpg", era: "고등학교 시절", caption: "자전거를 타며, 친구들과 함께 했던 즐거운 추억." },
      { src: "img/house_01_01_09.jpg", era: "고등학교 시절", caption: "수학여행 또는 친구들과의 여행길, 명소에서의 단체 사진." },
      { src: "img/house_01_01_10.jpg", era: "고등학교 시절", caption: "교복을 입고 버스에 기대어 선명한 청춘의 한 페이지." },
      { src: "img/house_01_01_11.jpg", era: "고등학교 시절", caption: "맨발로 개울가에서, 우정으로 하나 되었던 학창시절." },
      { src: "img/house_01_01_12.jpg", era: "고등학교 시절", caption: "봄이 오면, 들판과 숲에서 친구들과 함께한 시간." },
      { src: "img/house_01_01_13.jpg", era: "고등학교 시절", caption: "군복 차림으로, 미래의 꿈을 품었던 순간." },
      { src: "img/house_01_01_14.jpg", era: "고등학교 시절", caption: "친구와 함께한 봄날의 들판, 자연과 어우러진 우정." },
      { src: "img/house_01_01_15.jpg", era: "고등학교 시절", caption: "오토바이 위에서 젊음을 즐기던 한때." },
      { src: "img/house_01_01_16.jpg", era: "고등학교 시절", caption: "셋이 함께한 포즈, 변치 않는 우정과 추억의 시작." },
      { src: "img/house_01_01_17.jpg", era: "고등학교 시절", caption: "황금 들녘, 친구들과의 미소 가득한 단체사진." },
      { src: "img/house_01_01_18.jpg", era: "고등학교 시절", caption: "흙바닥 운동장에서 장난기 넘치던 씨름 한판!" },
      { src: "img/house_01_01_19.jpg", era: "고등학교 시절", caption: "교복 입고 버스 앞에서, 늘 함께였던 친구들." },
      { src: "img/house_01_01_20.jpg", era: "고등학교 시절", caption: "수련회 혹은 현장학습에서의 단체 포즈." },
      { src: "img/house_01_01_21.jpg", era: "고등학교 시절", caption: "동물원 견학, 어린 시절의 호기심과 활력이 가득." },
      { src: "img/house_01_01_22.jpg", era: "고등학교 시절", caption: "야외 단체사진, 친구들과 함께한 소중한 시간." },
      { src: "img/house_01_01_23.jpg", era: "고등학교 시절", caption: "여행지에서 편안하게 기대어, 청춘의 여유와 낭만." }
    ];

    const albumGrid = document.getElementById("albumGrid");
    const overlay = document.getElementById("overlay");

    function renderAlbum() {
      albumGrid.innerHTML = "";
      albumData.forEach((item, idx) => {
        const albumItem = document.createElement("div");
        albumItem.className = "album-item";
        albumItem.tabIndex = 0;

        // 작은 사진만 클릭 안되게, 카드(배경) 전체는 클릭 가능
        const thumbWrap = document.createElement("div");
        thumbWrap.className = "album-thumb-wrap";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.caption;
        img.className = "album-thumb";
        img.draggable = false;
        img.tabIndex = -1;
        img.onclick = (e) => { e.stopPropagation(); }; // 작은 사진 클릭해도 아무 반응 X
        thumbWrap.appendChild(img);

        albumItem.appendChild(thumbWrap);

        // 설명 등
        const era = document.createElement("div");
        era.className = "album-era";
        era.textContent = item.era;
        albumItem.appendChild(era);

        const cap = document.createElement("div");
        cap.className = "album-caption";
        cap.textContent = item.caption;
        albumItem.appendChild(cap);

        // 카드 클릭시만 오버레이 큰사진
        albumItem.onclick = () => showOverlay(idx);

        albumGrid.appendChild(albumItem);
      });
    }

    function showOverlay(idx) {
      const item = albumData[idx];
      overlay.innerHTML = `
        <img src="${item.src}" alt="${item.caption}" class="overlay-img">
        <div class="overlay-era">${item.era}</div>
        <div class="overlay-caption">${item.caption}</div>
        <button class="overlay-close" onclick="hideOverlay()">닫기</button>
      `;
      overlay.style.display = "flex";
      overlay.onclick = function(e) {
        if (e.target === overlay) hideOverlay();
      }
      document.body.style.overflow = 'hidden';
    }
    function hideOverlay() {
      overlay.style.display = "none";
      overlay.innerHTML = "";
      document.body.style.overflow = 'auto';
    }
    renderAlbum();
    // ESC키로도 닫기
    window.addEventListener('keydown', function(e) {
      if (overlay.style.display === "flex" && (e.key === "Escape" || e.key === "Esc")) {
        hideOverlay();
      }
    });
  </script>
</body>
</html>
