<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>막내딸의 유년 시절 – 자매의 소중한 추억</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px;
    }
    h1 {
      text-align: center;
      color: #295cc6;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #557;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
      line-height: 1.4;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #295cc6;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 95vw;
      max-height: 90vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 80vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
    }
    @media (max-width: 680px) {
      .album-container { padding: 12px 4px; }
      h1 { font-size: 1.3rem; }
      .desc { font-size: 0.9rem; }
      .big-img-box { max-width: 98vw; max-height: 90vh; padding: 12px; }
      .big-img { max-width: 95vw; max-height: 60vh; }
      .thumb {
        width: 80px;
        height: 80px;
        border-radius: 12px;
      }
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .nav-links a {
      color: #295cc6;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      background: #f0f6ff;
    }
    .nav-links a:hover {
      background: #d2e3ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>막내딸의 유년 시절 – 자매의 소중한 추억</h1>
    <div class="desc">
      막내딸과 언니가 함께한 유년 시절.<br>
      함께 웃고 장난치며 보낸 소중한 순간들이 고스란히 담겼습니다.<br>
      봄날의 꽃, 겨울의 눈, 자매만의 특별한 이야기.
    </div>
    <div class="thumbnails" id="thumbnails"></div>
    <div class="nav-links">
      <a href="house_01_003_02.html">이전</a>
      <a href="house_01.html">메인</a>
      <a href="house_01_002.html">우리언니보러가기</a>
    </div>
  </div>

  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()" />
      <div id="bigCaption" class="caption"></div>
      <div id="bigCaptionSm" class="caption sm"></div>
    </div>
  </div>

  <script>
    // 사진 파일명 순서대로 실제 설명 적용
    const images = [
      { src: "img/house_01_003_67.jpg", caption: "푸른 잔디 위, 언니와 함께 장난치며 앉아 있는 막내딸.", sm: "잔디밭의 자매" },
      { src: "img/house_01_003_68.jpg", caption: "전통 초가집 앞에서 언니와 함께 추억을 남긴 날.", sm: "초가집과 추억" },
      { src: "img/house_01_003_69.jpg", caption: "겨울 눈밭 위에서 두 자매가 환하게 웃으며 포즈!", sm: "겨울의 장난" },
      { src: "img/house_01_003_70.jpg", caption: "방바닥에 나란히 엎드려 서로를 바라보며 웃던 어린 시절.", sm: "방 안에서의 장난" },
      { src: "img/house_01_003_71.jpg", caption: "바닷가 돌 위에서 막내딸만의 브이(V) 포즈.", sm: "바닷가에서" },
      { src: "img/house_01_003_72.jpg", caption: "단란한 미소로 자매만의 즐거움을 담은 모습.", sm: "웃음 가득" },
      { src: "img/house_01_003_73.jpg", caption: "푸른 하늘 아래, 언니와 함께 자연 속에서.", sm: "자연과 자매" },
      { src: "img/house_01_003_74.jpg", caption: "작은 손으로 언니와 함께 포즈를 취하며 서있는 막내딸.", sm: "언니와 함께" },
      { src: "img/house_01_003_75.jpg", caption: "언니의 따뜻한 품에 안겨있는 막내딸의 모습.", sm: "자매의 포근함" },
      { src: "img/house_01_003_76.jpg", caption: "잔디밭에서 플립폰을 들고 통화놀이를 하던 순수한 어린 시절.", sm: "플립폰 놀이" },
      { src: "img/house_01_003_77.jpg", caption: "분홍 꽃 앞에서 장난스럽게 미소짓는 두 자매.", sm: "분홍 꽃과 미소" },
      { src: "img/house_01_003_78.jpg", caption: "노란 개나리와 함께 웃으며 포즈를 취한 막내딸.", sm: "개나리와 함께" },
      { src: "img/house_01_003_79.jpg", caption: "언니와 함께 봄꽃 사이에서 환하게 웃는 순간.", sm: "봄꽃 사이에서" },
      { src: "img/house_01_003_80.jpg", caption: "마른 가지들 속에서 언니와 시선을 맞추며 장난치는 모습.", sm: "가지 사이로" },
      { src: "img/house_01_003_81.jpg", caption: "졸업식 날 한복과 꽃다발을 들고, 환하게 웃는 막내딸.", sm: "졸업식 한복" },
      { src: "img/house_01_003_82.jpg", caption: "푸른 잔디 위에서 언니와 함께 엎드려 웃는 모습.", sm: "잔디밭에 누워" },
      { src: "img/house_01_003_83.jpg", caption: "흰색 철쭉 꽃 앞에서 노란 원피스를 입고 활짝 웃는 막내딸.", sm: "철쭉과 노란 원피스" },
      { src: "img/house_01_003_84.jpg", caption: "처음 무대에 올라 피아노를 연주하는 막내딸.", sm: "피아노 발표회" },
      { src: "img/house_01_003_85.jpg", caption: "여름 바닷가에서 튜브를 타고 즐거운 시간을 보내는 자매.", sm: "여름 바다와 튜브" },
      { src: "img/house_01_003_86.jpg", caption: "산속 곰 동상 앞에서 자매가 나란히 선 모습.", sm: "산과 곰 동상" },
      { src: "img/house_01_003_87.jpg", caption: "졸업식 무대에서 친구들과 함께한 단체 사진.", sm: "졸업식 단체 사진" },
      { src: "img/house_01_003_88.jpg", caption: "초등학교 수학여행에서 반 친구들과 함께한 단체사진.", sm: "수학여행 단체 사진" }
    ];

    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="photo${idx+1}">`;
      el.onclick = () => showBig(idx);
      thumbs.appendChild(el);
    });

    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('bigCaptionSm').textContent = images[idx].sm;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }

    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }

    function escHandler(e) {
      if (e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
