<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>house_01_02 사진 앨범</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px;
    }
    h1 {
      text-align: center;
      color: #3a5e9e;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #999;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #3a5e9e;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 95vw;
      max-height: 90vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 80vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
    }
    @media (max-width: 680px) {
      .album-container { padding: 12px 4px; }
      h1 { font-size: 1.3rem; }
      .desc { font-size: 0.9rem; }
      .big-img-box { max-width: 98vw; max-height: 90vh; padding: 12px; }
      .big-img { max-width: 95vw; max-height: 60vh; }
      .thumb {
        width: 80px;
        height: 80px;
        border-radius: 12px;
      }
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .nav-links a {
      color: #3a5e9e;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover {
      background: #e6f0ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>house_01_02 사진 앨범</h1>
    <div class="desc">여기에 house_01_02 앨범에 대한 설명을 적어주세요.</div>
    <div class="thumbnails" id="thumbnails"></div>
    <div class="nav-links">
      <a href="house_01_03.html">다음</a>
    </div>
  </div>

  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()" />
      <div id="bigCaption" class="caption"></div>
      <div id="bigCaptionSm" class="caption sm"></div>
    </div>
  </div>

  <script>
    const images = [
      { src: "img/house_01_02_01.jpg", caption: "사진 1 설명" },
      { src: "img/house_01_02_02.jpg", caption: "사진 2 설명" },
      { src: "img/house_01_02_03.jpg", caption: "사진 3 설명" },
      { src: "img/house_01_02_04.jpg", caption: "사진 4 설명" },
      { src: "img/house_01_02_05.jpg", caption: "사진 5 설명" },
      { src: "img/house_01_02_06.jpg", caption: "사진 6 설명" },
      { src: "img/house_01_02_07.jpg", caption: "사진 7 설명" },
      { src: "img/house_01_02_08.jpg", caption: "사진 8 설명" },
      { src: "img/house_01_02_09.jpg", caption: "사진 9 설명" },
      { src: "img/house_01_02_10.jpg", caption: "사진 10 설명" },
      { src: "img/house_01_02_11.jpg", caption: "사진 11 설명" },
      { src: "img/house_01_02_12.jpg", caption: "사진 12 설명" },
      { src: "img/house_01_02_13.jpg", caption: "사진 13 설명" },
      { src: "img/house_01_02_14.jpg", caption: "사진 14 설명" },
      { src: "img/house_01_02_15.jpg", caption: "사진 15 설명" },
      { src: "img/house_01_02_16.jpg", caption: "사진 16 설명" },
      { src: "img/house_01_02_17.jpg", caption: "사진 17 설명" },
      { src: "img/house_01_02_18.jpg", caption: "사진 18 설명" },
      { src: "img/house_01_02_19.jpg", caption: "사진 19 설명" },
      { src: "img/house_01_02_20.jpg", caption: "사진 20 설명" },
      { src: "img/house_01_02_21.jpg", caption: "사진 21 설명" },
      { src: "img/house_01_02_22.jpg", caption: "사진 22 설명" },
      { src: "img/house_01_02_23.jpg", caption: "사진 23 설명" }
    ];

    const captions_sm = [
      "사진 1 보조 설명",
      "사진 2 보조 설명",
      "사진 3 보조 설명",
      "사진 4 보조 설명",
      "사진 5 보조 설명",
      "사진 6 보조 설명",
      "사진 7 보조 설명",
      "사진 8 보조 설명",
      "사진 9 보조 설명",
      "사진 10 보조 설명",
      "사진 11 보조 설명",
      "사진 12 보조 설명",
      "사진 13 보조 설명",
      "사진 14 보조 설명",
      "사진 15 보조 설명",
      "사진 16 보조 설명",
      "사진 17 보조 설명",
      "사진 18 보조 설명",
      "사진 19 보조 설명",
      "사진 20 보조 설명",
      "사진 21 보조 설명",
      "사진 22 보조 설명",
      "사진 23 보조 설명"
    ];

    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="photo${idx+1}">`;
      el.onclick = () => showBig(idx);
      thumbs.appendChild(el);
    });

    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('bigCaptionSm').textContent = captions_sm[idx];
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }

    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }

    function escHandler(e) {
      if (e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
