<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>영원의 집 – 추억의 가족 앨범</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px;
    }
    h1 {
      text-align: center;
      color: #295cc6;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #557;
      font-size: 1rem;
      margin-bottom: 22px;
      font-weight: 400;
      line-height: 1.4;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      min-height: 220px;
    }
    .thumb, .thumb-empty {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
      cursor: pointer;
      transition: border 0.2s;
      position: relative;
    }
    .thumb:hover {
      border: 2px solid #295cc6;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .thumb-empty {
      cursor: default;
      color: #b7b7b7;
      font-size: 0.98rem;
      justify-content: center;
      align-items: center;
      font-weight: 400;
      border: 2px dashed #d0d0e2;
      background: #f5f5fa;
      text-align: center;
    }
    .thumb-empty::after {
      content: '사진 자리 비움';
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32,32,32,0.87);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 95vw;
      max-height: 90vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 70vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .caption.sm {
      font-size: 0.97rem;
      color: #6a7fa3;
      margin-bottom: 0;
      margin-top: 4px;
      font-weight: 400;
    }
    @media (max-width: 680px) {
  .album-container { padding: 12px 4px; }
  h1 { font-size: 1.28rem; }
  .desc { font-size: 0.91rem; }
  .big-img-box { max-width: 99vw; max-height: 99vh; padding: 2vw; }
  .big-img {
    max-width: 98vw;
    width: 98vw;
    height: auto;
    max-height: none;
  }
  .thumb, .thumb-empty {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    font-size: 0.95rem;
  }
  .thumbnails { gap: 10px; }
}
    .nav-links {
      margin-top: 36px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .nav-links a {
      color: #295cc6;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      background: #f0f6ff;
    }
    .nav-links a:hover {
      background: #d2e3ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>영원의 집 – 가족 인생 앨범</h1>
    <div class="desc">
      세월의 흐름 속, 가족의 성장과 일상, 추억을 담은 기록.<br>
      어린 시절부터 현재까지, 그리고 기억해야 할 순간들을 모았습니다.
    </div>
    <div class="thumbnails" id="thumbnails"></div>
    <div class="nav-links">
      <a href="index.html">메인</a>
      <a href="+1_+1_2.html">다음</a>
    </div>
  </div>
  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()" />
      <div id="bigCaption" class="caption"></div>
      <div id="bigCaptionSm" class="caption sm"></div>
    </div>
  </div>
  <script>
    // 이미지 정보(파일명, 메인설명, 보조설명)
    const images = [
      { src: "img/+1_+1_01.jpg", caption: "학창시절 증명사진", sm: "학생시절의 순수했던 모습" },
      { src: "img/+1_+1_02.jpg", caption: "중·고등학교 교복 증명사진", sm: "교복을 입은 소년" },
      { src: "img/+1_+1_03.jpg", caption: "고등학생 시절 교복 차림", sm: "젊음과 열정이 담긴 시절" },
      { src: "img/+1_+1_04.jpg", caption: "젊은 시절 겨울 야외 사진", sm: "겨울 아침의 추억" },
      { src: "img/+1_+1_05.jpg", caption: "젊은 시절 정장 차림 야외", sm: "새로운 출발, 희망을 담다" },
      { src: "img/+1_+1_06.jpg", caption: "결혼식 기념 가족사진", sm: "행복한 시작의 순간" },
      { src: "img/+1_+1_07.jpg", caption: "친구와 함께 찍은 캠퍼스 사진", sm: "학창 시절 우정" },
      { src: "img/+1_+1_08.jpg", caption: "넥타이와 정장 차림의 아버지", sm: "어른이 된 가족의 첫 모습" },
      { src: "img/+1_+1_09.jpg", caption: "가족묘원 전경(풍경)", sm: "우리 가족의 쉼터" },
      { src: "img/+1_+1_10.jpg", caption: "묘역의 단면 풍경", sm: "고요함과 평안함" },
      { src: "img/+1_+1_11.jpg", caption: "묘역 가까이에서 바라본 풍경", sm: "조용한 명상과 기억" },
      { src: "img/+1_+1_12.jpg", caption: "성묘하는 가족", sm: "함께 기억하는 시간" },
      { src: "img/+1_+1_13.jpg", caption: "어머니 수면중인 모습", sm: "수면의 평안함" },
      { src: "img/+1_+1_14.jpg", caption: "휠체어에 앉은 어머니", sm: "노년의 일상과 건강" },
      { src: "img/+1_+1_15.jpg", caption: "화사한 한복 차림의 어머니 노환", sm: "밝고 따뜻한 인생의 한순간" },
      { src: "img/+1_+1_16.jpg", caption: "화사한 한복 차림의 어머니(다른 각도)", sm: "한복의 미와 어머니의 미소" },
      { src: "img/+1_+1_17.jpg", caption: "어머니의 일상(가정에서 다양한 모습)", sm: "가정 안의 웃음" },
      // 자리 비움
      { empty: true },
      { empty: true },
      { empty: true }
    ];

    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      let el;
      if (img.empty) {
        el = document.createElement('div');
        el.className = "thumb-empty";
        el.title = "사진 준비 중";
      } else {
        el = document.createElement('div');
        el.className = "thumb";
        el.innerHTML = `<img src="${img.src}" alt="album${idx+1}">`;
        el.onclick = () => showBig(idx);
      }
      thumbs.appendChild(el);
    });

    function showBig(idx) {
      if (images[idx].empty) return;
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('bigCaptionSm').textContent = images[idx].sm;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }
    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }
    function escHandler(e) {
      if (e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
