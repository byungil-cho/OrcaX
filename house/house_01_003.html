<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>우리 작은딸 성장앨범</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0; padding: 0;
      background: #f5fafd;
      font-family: 'Pretendard','Noto Sans KR',sans-serif;
      color: #23457c;
    }
    .album-box {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #eaf6ff;
      display: flex; flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-bottom: 90px;
    }
    .album-title {
      font-size: 2rem;
      font-weight: bold;
      margin: 32px 0 14px 0;
      letter-spacing: 2px;
      color: #134c7f;
      text-shadow: 0 1px 0 #fff;
    }
    .album-desc {
      color: #5993c9;
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 18px;
      padding: 0 12px;
    }
    .photo-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .photo-thumb-box {
      width: 74px; height: 74px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 10px #c7eaff55;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid #d0e6f5;
      transition: border-color 0.2s;
    }
    .photo-thumb-box:hover { border-color: #82c6fa; }
    .photo-thumb-box img {
      width: 100%; height: 100%; object-fit: cover;
      border-radius: 12px;
    }
    .modal-bg {
      display: none;
      position: fixed; z-index: 99;
      left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(36,56,100,0.65);
      justify-content: center; align-items: center;
    }
    .modal-bg.active { display: flex; }
    .modal-img-wrap {
      position: relative;
      background: #eaf6ff;
      border-radius: 18px;
      box-shadow: 0 6px 36px #23457c44;
      max-width: 96vw;
      max-height: 90vh;
      width: 92vw; height: 66vw;
      min-width: 320px;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      padding: 1.5em 0 0.5em 0;
    }
    .modal-img-wrap.vert { height: 110vw; width: 70vw; max-width: 430px; max-height: 93vh;}
    .modal-img-wrap.horiz { height: 66vw; width: 94vw; }
    .modal-img-wrap .modal-img {
      border-radius: 13px;
      max-width: 98%; max-height: 57vw;
      box-shadow: 0 2px 16px #6bc5e288;
      background: #fff;
      object-fit: contain;
      margin: 0 auto 8px auto;
      display: block;
    }
    .modal-img-wrap.vert .modal-img { 
      max-height: 90vw;
      aspect-ratio: 3/5;
    }
    .modal-img-wrap.horiz .modal-img {
      max-height: 52vw;
      aspect-ratio: 3/2;
    }
    .modal-desc {
      font-size: 1.09em;
      color: #23457c;
      padding: 10px 14px 12px 14px;
      background: #f5fafdcc;
      border-radius: 12px;
      text-align: center;
      margin: 0;
      word-break: keep-all;
    }
    .nav-links {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      background: #d7ecfd;
      border-top: 1px solid #bfe0fb;
      padding: 12px 16px;
      z-index: 100;
      box-shadow: 0 -3px 24px #bad6f0bb;
    }
    .nav-link-btn {
      color: #298bdb;
      background: #f5fafd;
      border: none;
      border-radius: 10px;
      padding: 7px 18px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      cursor: pointer;
      box-shadow: 0 1px 6px #bee3f8aa;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
      margin: 0 2px;
    }
    .nav-link-btn:hover {
      background: #c8e6ff;
      color: #176cbf;
    }
    @media (max-width: 520px) {
      .album-title { font-size: 1.25rem;}
      .modal-img-wrap { min-width: 0;}
      .nav-links { padding: 7px 4px;}
    }
  </style>
</head>
<body>
  <div class="album-box">
    <div class="album-title">우리 작은딸의 성장기 <span style="font-size:1rem; color:#66aee9;">1/3</span></div>
    <div class="album-desc">
      작은딸이 태어난 순간부터 밝게 자라난 모습까지.<br>
      세상에서 가장 소중한 미소와 가족의 사랑을 한 장 한 장에 담았습니다.<br>
      모두의 추억이 담긴 따뜻한 성장앨범!
    </div>
    <div class="photo-grid" id="photoGrid">
      <!-- 썸네일 자동생성 -->
    </div>
  </div>
  <!-- 팝업/모달 -->
  <div class="modal-bg" id="modalBg">
    <div class="modal-img-wrap vert" id="modalImgWrap">
      <img id="modalImg" class="modal-img" src="" alt="">
      <div class="modal-desc" id="modalDesc"></div>
    </div>
  </div>
  <!-- 네비게이션 -->
  <div class="nav-links">
    <a href="house_01_003_03.html" class="nav-link-btn">◀ 이전페이지</a>
    <a href="house_01.html" class="nav-link-btn">메인으로</a>
    <a href="house_01_003_01.html" class="nav-link-btn">다음페이지 ▶</a>
  </div>
  <script>
    // 사진 설명/비율 데이터
    const photoList = [
      { src: 'img/house_01_003_01.jpg', ratio: 'vert', desc: "이 세상에 태어나자마자 반가운 인사!<br>우리 가족의 소중한 둘째 딸, 작고 귀여운 손과 발이 사랑스럽습니다." },
      { src: 'img/house_01_003_02.jpg', ratio: 'vert', desc: "포근한 이불 위, 해맑게 바라보는 아기의 맑은 눈동자.<br>천사 같은 미소가 집안을 가득 채웁니다." },
      { src: 'img/house_01_003_03.jpg', ratio: 'vert', desc: "고운 드레스와 꽃 장식, 작은 아기와 함께한 스튜디오 촬영.<br>순수한 표정에 엄마 아빠의 사랑이 가득 담겼습니다." },
      { src: 'img/house_01_003_04.jpg', ratio: 'horiz', desc: "언니와 함께한 첫 수박파티!<br>수박보다 더 싱그럽고 발랄한 자매의 미소." },
      { src: 'img/house_01_003_05.jpg', ratio: 'vert', desc: "아기 시절, 엄마의 따뜻한 품 대신 화분 옆에서의 포즈!<br>조그만 손짓과 호기심 가득한 눈빛이 귀엽습니다." },
      { src: 'img/house_01_003_06.jpg', ratio: 'horiz', desc: "삼남매와 함께한 소파 위의 시간.<br>형, 언니와 나란히 앉아있는 모습이 정겹고 훈훈합니다." },
      { src: 'img/house_01_003_07.jpg', ratio: 'vert', desc: "백일잔치의 주인공! 수박과 토마토가 가득한 식탁 앞에서 포즈.<br>조그만 손이 귀엽게 펼쳐져 있네요." },
      { src: 'img/house_01_003_08.jpg', ratio: 'vert', desc: "할머니 품에 안겨 언니와 함께한 명절.<br>할머니의 사랑이 느껴지는 소중한 순간." },
      { src: 'img/house_01_003_09.jpg', ratio: 'horiz', desc: "할머니 품에 안긴 삼남매, 활짝 웃는 가족의 모습.<br>가족 모두의 추억이 고스란히 담겼습니다." },
      { src: 'img/house_01_003_10.jpg', ratio: 'horiz', desc: "형, 언니와 함께한 집안의 즐거운 시간.<br>사이좋은 삼남매의 미소가 흐뭇합니다." },
      { src: 'img/house_01_003_11.jpg', ratio: 'vert', desc: "작은언니와 함께한 장난꾸러기 한 컷.<br>언니를 바라보는 모습이 사랑스럽습니다." },
      { src: 'img/house_01_003_12.jpg', ratio: 'horiz', desc: "첫 돌잔치날, 고운 한복을 입고 과일과 돈다발 앞에서.<br>첫 생일을 축하하며 가족의 축복이 가득했던 날." },
      { src: 'img/house_01_003_13.jpg', ratio: 'horiz', desc: "설날, 한복 입고 밝게 웃는 언니와 함께.<br>귀여운 미소와 해맑은 눈빛이 모두를 행복하게 만듭니다." },
      { src: 'img/house_01_003_14.jpg', ratio: 'horiz', desc: "삼남매가 한자리에 모여 가족의 정을 느끼는 순간.<br>형, 언니와 함께한 사진이 특별합니다." },
      { src: 'img/house_01_003_15.jpg', ratio: 'vert', desc: "귀여운 오렌지색 옷을 입고 벽에 기대 선 모습.<br>조금은 쑥스러운 듯한 표정이 더 사랑스럽습니다." },
      { src: 'img/house_01_003_16.jpg', ratio: 'horiz', desc: "엄마와 삼남매가 함께한 일상 한 장면.<br>따뜻한 가족의 온기가 전해집니다." },
      { src: 'img/house_01_003_17.jpg', ratio: 'vert', desc: "엄마 품에 안긴 귀여운 포즈.<br>엄마의 사랑을 듬뿍 받고 있는 모습이 행복해 보입니다." },
      { src: 'img/house_01_003_18.jpg', ratio: 'horiz', desc: "언니와 함께한 여름날, 시원한 강가에서<br>선글라스를 낀 언니와 쿨하게 포즈!" },
      { src: 'img/house_01_003_19.jpg', ratio: 'vert', desc: "노란 바지를 입고 바닷가에서 브이 포즈!<br>넓은 바다처럼 씩씩하게 자라길 바라며." },
      { src: 'img/house_01_003_20.jpg', ratio: 'horiz', desc: "언니와 바닷가에서 손을 뻗어 즐거움을 표현.<br>자매의 우정이 느껴지는 장면입니다." },
      { src: 'img/house_01_003_21.jpg', ratio: 'horiz', desc: "엄마와 함께한 바닷가 추억.<br>작은딸의 천진난만한 표정, 엄마의 따스한 미소가 어우러집니다." }
    ];

    // 썸네일 자동 생성 + 클릭이벤트
    const grid = document.getElementById('photoGrid');
    photoList.forEach((p, i) => {
      const box = document.createElement('div');
      box.className = 'photo-thumb-box';
      box.innerHTML = `<img src="${p.src}" alt="작은딸앨범${i+1}">`;
      box.onclick = function() {
        const img = document.getElementById('modalImg');
        const desc = document.getElementById('modalDesc');
        const wrap = document.getElementById('modalImgWrap');
        img.src = p.src;
        desc.innerHTML = p.desc;
        wrap.className = 'modal-img-wrap ' + (p.ratio === 'horiz' ? 'horiz' : 'vert');
        document.getElementById('modalBg').classList.add('active');
        document.body.style.overflow = 'hidden';
      }
      grid.appendChild(box);
    });
    // 팝업 닫기
    document.getElementById('modalImgWrap').onclick = closeModal;
    document.getElementById('modalBg').onclick = function(e) {
      if (e.target === this) closeModal();
    };
    window.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
    function closeModal() {
      document.getElementById('modalBg').classList.remove('active');
      document.getElementById('modalImg').src = '';
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
