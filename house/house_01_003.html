<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>우리 작은딸 성장앨범 - 설명 팝업</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {margin:0;background:#f5fafd;font-family:'Pretendard','Noto Sans KR',sans-serif;}
    .photo-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:32px 0;}
    .photo-thumb-box{width:74px;height:74px;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #c7eaff44;background:#fff;cursor:pointer;}
    .photo-thumb-box img{width:100%;height:100%;object-fit:cover;}
    .modal-bg{display:none;position:fixed;z-index:99;left:0;top:0;width:100vw;height:100vh;background:rgba(36,56,100,0.65);justify-content:center;align-items:center;}
    .modal-bg.active{display:flex;}
    .modal-img-wrap{background:#eaf6ff;border-radius:16px;box-shadow:0 6px 36px #23457c44;max-width:95vw;max-height:90vh;width:90vw;padding:2em 0 1em 0;display:flex;flex-direction:column;align-items:center;}
    .modal-img{border-radius:12px;max-width:96%;max-height:60vw;box-shadow:0 2px 16px #6bc5e288;background:#fff;}
    .modal-desc{font-size:1.1em;color:#23457c;padding:12px 14px 0 14px;background:transparent;border-radius:12px;text-align:center;}
  </style>
</head>
<body>
<div class="photo-grid" id="photoGrid"></div>
<div class="modal-bg" id="modalBg">
  <div class="modal-img-wrap" id="modalImgWrap">
    <img id="modalImg" class="modal-img" src="" alt="">
    <div class="modal-desc" id="modalDesc"></div>
  </div>
</div>
<script>
const photoList = [
      { src: 'img/house_01_003_01.jpg', ratio: 'vert', desc: "이 세상에 태어나자마자 반가운 인사!<br>우리 가족의 소중한 둘째 딸, 작고 귀여운 손과 발이 사랑스럽습니다." },
      { src: 'img/house_01_003_02.jpg', ratio: 'vert', desc: "포근한 이불 위, 해맑게 바라보는 아기의 맑은 눈동자.<br>천사 같은 미소가 집안을 가득 채웁니다." },
      { src: 'img/house_01_003_03.jpg', ratio: 'vert', desc: "고운 드레스와 꽃 장식, 작은 아기와 함께한 스튜디오 촬영.<br>순수한 표정에 엄마 아빠의 사랑이 가득 담겼습니다." },
      { src: 'img/house_01_003_04.jpg', ratio: 'horiz', desc: "언니와 함께한 첫 수박파티!<br>수박보다 더 싱그럽고 발랄한 자매의 미소." },
      { src: 'img/house_01_003_05.jpg', ratio: 'vert', desc: "아기 시절, 엄마의 따뜻한 품 대신 화분 옆에서의 포즈!<br>조그만 손짓과 호기심 가득한 눈빛이 귀엽습니다." },
      { src: 'img/house_01_003_06.jpg', ratio: 'horiz', desc: "삼남매와 함께한 소파 위의 시간.<br>형, 언니와 나란히 앉아있는 모습이 정겹고 훈훈합니다." },
      { src: 'img/house_01_003_07.jpg', ratio: 'vert', desc: "백일잔치의 주인공! 수박과 토마토가 가득한 식탁 앞에서 포즈.<br>조그만 손이 귀엽게 펼쳐져 있네요." },
      { src: 'img/house_01_003_08.jpg', ratio: 'vert', desc: "할머니 품에 안겨 언니와 함께한 명절.<br>할머니의 사랑이 느껴지는 소중한 순간." },
      { src: 'img/house_01_003_09.jpg', ratio: 'horiz', desc: "할머니 품에 안긴 삼남매, 활짝 웃는 가족의 모습.<br>가족 모두의 추억이 고스란히 담겼습니다." },
      { src: 'img/house_01_003_10.jpg', ratio: 'horiz', desc: "형, 언니와 함께한 집안의 즐거운 시간.<br>사이좋은 삼남매의 미소가 흐뭇합니다." },
      { src: 'img/house_01_003_11.jpg', ratio: 'vert', desc: "작은언니와 함께한 장난꾸러기 한 컷.<br>언니를 바라보는 모습이 사랑스럽습니다." },
      { src: 'img/house_01_003_12.jpg', ratio: 'horiz', desc: "첫 돌잔치날, 고운 한복을 입고 과일과 돈다발 앞에서.<br>첫 생일을 축하하며 가족의 축복이 가득했던 날." },
      { src: 'img/house_01_003_13.jpg', ratio: 'horiz', desc: "설날, 한복 입고 밝게 웃는 언니와 함께.<br>귀여운 미소와 해맑은 눈빛이 모두를 행복하게 만듭니다." },
      { src: 'img/house_01_003_14.jpg', ratio: 'horiz', desc: "삼남매가 한자리에 모여 가족의 정을 느끼는 순간.<br>형, 언니와 함께한 사진이 특별합니다." },
      { src: 'img/house_01_003_15.jpg', ratio: 'vert', desc: "귀여운 오렌지색 옷을 입고 벽에 기대 선 모습.<br>조금은 쑥스러운 듯한 표정이 더 사랑스럽습니다." },
      { src: 'img/house_01_003_16.jpg', ratio: 'horiz', desc: "엄마와 삼남매가 함께한 일상 한 장면.<br>따뜻한 가족의 온기가 전해집니다." },
      { src: 'img/house_01_003_17.jpg', ratio: 'vert', desc: "엄마 품에 안긴 귀여운 포즈.<br>엄마의 사랑을 듬뿍 받고 있는 모습이 행복해 보입니다." },
      { src: 'img/house_01_003_18.jpg', ratio: 'horiz', desc: "언니와 함께한 여름날, 시원한 강가에서<br>선글라스를 낀 언니와 쿨하게 포즈!" },
      { src: 'img/house_01_003_19.jpg', ratio: 'vert', desc: "노란 바지를 입고 바닷가에서 브이 포즈!<br>넓은 바다처럼 씩씩하게 자라길 바라며." },
      { src: 'img/house_01_003_20.jpg', ratio: 'horiz', desc: "언니와 바닷가에서 손을 뻗어 즐거움을 표현.<br>자매의 우정이 느껴지는 장면입니다." },
      { src: 'img/house_01_003_21.jpg', ratio: 'horiz', desc: "엄마와 함께한 바닷가 추억.<br>작은딸의 천진난만한 표정, 엄마의 따스한 미소가 어우러집니다." }
    ];
// 썸네일 생성
const grid = document.getElementById('photoGrid');
photoList.forEach((p, i) => {
  const box = document.createElement('div');
  box.className = 'photo-thumb-box';
  box.innerHTML = `<img src="${p.src}" alt="앨범${i+1}">`;
  box.onclick = function() {
    document.getElementById('modalImg').src = p.src;
    document.getElementById('modalDesc').innerHTML = p.desc;
    document.getElementById('modalBg').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  grid.appendChild(box);
});
// 팝업 닫기
document.getElementById('modalImgWrap').onclick = closeModal;
document.getElementById('modalBg').onclick = function(e) {
  if (e.target === this) closeModal();
};
window.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
function closeModal() {
  document.getElementById('modalBg').classList.remove('active');
  document.getElementById('modalImg').src = '';
  document.body.style.overflow = '';
}
</script>
</body>
</html>
