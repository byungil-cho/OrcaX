<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>할머니와 아들·딸·며느리들의 추억</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px 32px 18px;
    }
    h1 {
      text-align: center;
      color: #3a5e9e;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #999;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #3a5e9e;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top:0; left:0; width:100vw; height:100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity:0;}
      to {opacity:1;}
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 84vw;
      max-height: 80vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from {transform: scale(0.94);}
      to {transform: scale(1);}
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 70vw;
      max-height: 56vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
      font-weight: 400;
    }
    @media (max-width: 680px) {
      .album-container {padding: 12px 4px;}
      h1 {font-size: 1.17rem;}
      .big-img-box {max-width: 99vw; max-height: 94vh;}
      .big-img {max-width: 94vw; max-height: 60vh;}
      .thumbnails {gap: 11px;}
      .thumb {width: 44vw; max-width: 120px; height: 44vw; min-width: 78px; min-height: 78px;}
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .nav-links a {
      color: #3a5e9e;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
    }
    .nav-links a:hover {
      background: #e6f0ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>할머니와 아들·딸·며느리들의 추억</h1>
    <div class="desc">오래된 사진 속에서 되살아나는 가족의 시간.<br>추억과 사랑이 깃든 소중한 순간들을 한 곳에 모았습니다.</div>
    <div class="thumbnails" id="thumbnails">
      <!-- 썸네일 자동삽입 -->
    </div>
    <div class="nav-links">
      <a href="house_01_007.html">할아버지 추억 보러가기</a>
    </div>
  </div>

  <!-- 오버레이/큰이미지 -->
  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()">
      <div id="bigCaption" class="caption"></div>
      <div id="bigCaptionSm" class="caption sm"></div>
    </div>
  </div>
  <script>
    // 이미지/설명 순서대로 입력 (주인님 실제 파일명/설명만 바꿔서 쓰세요!)
    const images = [
      { src: "img/+2_1_5_01.jpg", caption: "큰며느리와 작은 셋째 아들, 막내아들, 막내딸" },
      { src: "img/+2_1_5_02.jpg", caption: "막내딸과 친구" },
      { src: "img/+2_1_5_03.jpg", caption: "막내아들 고등학교 시절" },
      { src: "img/+2_1_5_04.jpg", caption: "막내아들" },
      { src: "img/+2_1_5_05.jpg", caption: "셋째 아들 고등학교 시절" },
      { src: "img/+2_1_5_06.jpg", caption: "막내아들 대학교 졸업(중앙대학교)" },
      { src: "img/+2_1_5_07.jpg", caption: "큰아들과 막내동생" },
      { src: "img/+2_1_5_08.jpg", caption: "막내아들 졸업, 교수와 함께" },
      { src: "img/+2_1_5_09.jpg", caption: "막내아들 결혼사진" },
      { src: "img/+2_1_5_10.jpg", caption: "막내아들 대학졸업, 큰 형수와 함께" },
      { src: "img/+2_1_5_11.jpg", caption: "막내아들 졸업, 큰형과 함께" },
      { src: "img/+2_1_5_12.jpg", caption: "막내아들 졸업, 막내 며느리, 큰아들, 큰 며느리" },
      { src: "img/+2_1_5_13.jpg", caption: "큰며느리, 막내며느리" },
      { src: "img/+2_1_5_14.jpg", caption: "큰형내외, 막내아들 내외" },
      { src: "img/+2_1_5_15.jpg", caption: "큰며느리" },
      { src: "img/+2_1_5_16.jpg", caption: "큰며느리, 동네 친구들" },
      { src: "img/+2_1_5_17.jpg", caption: "큰며느리, 동네 친구들" },
      { src: "img/+2_1_5_18.jpg", caption: "큰아들, 동네 친구들" }
    ];
    // 각 이미지에 대한 2번째(작은) 설명. 주인님 설명으로 교체하세요!
    const captions_sm = [
      "가족의 시작과 성장, 순수함과 따뜻함이 담긴 순간.",
      "풋풋한 우정, 청춘의 소중한 동행.",
      "학창시절의 동료애와 꿈이 깃든 시절.",
      "자연 속에서 친구들과의 여유로운 한때.",
      "친구들과 함께한 고등학교 시절의 추억.",
      "학사모의 설렘, 가족의 자랑이 된 순간.",
      "형제의 우애가 묻어나는 추억.",
      "스승과 함께한 졸업의 감동.",
      "설렘과 축복이 가득한 결혼의 출발점.",
      "가족의 자부심과 응원이 담긴 졸업사진.",
      "형과 함께하는 감격의 졸업식.",
      "서로의 기쁨을 나누는 따뜻한 가족애.",
      "사랑이 가득한 두 며느리의 모습.",
      "형제와 부부가 함께한 끈끈한 가족사진.",
      "집안의 든든한 기둥, 큰며느리의 일상.",
      "웃음 가득한 동네 친구들과의 우정.",
      "이웃들과 함께한 젊은 날의 추억.",
      "청춘의 한가운데서 웃는 친구들의 모습."
    ];
    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="photo${idx+1}">`;
      el.onclick = ()=>showBig(idx);
      thumbs.appendChild(el);
    });

    // 큰 이미지 보여주기
    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('bigCaptionSm').textContent = captions_sm[idx];
      document.getElementById('overlay').style.display = 'flex';
      // 큰 사진 클릭하면 닫히기
      document.getElementById('bigImg').onclick = hideBig;
      // ESC 키 닫기
      document.addEventListener('keydown', escHandler);
    }
    // 닫기
    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }
    // ESC 키 핸들러
    function escHandler(e){
      if(e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
