<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>할머니와 아들·딸·며느리들의 추억</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at 60% 16%, #23457c 0%, #0d2945 100%);
      font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      color: #fff;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 0 50px 0;
    }
    h1 {
      margin-top: 20px;
      margin-bottom: 12px;
      font-size: 2.15rem;
      color: #5d87c4;
      font-weight: 700;
      text-align: center;
      letter-spacing: -1.2px;
      text-shadow: 1px 2px 8px #1128;
    }
    .desc {
      text-align: center;
      color: #c9ced8;
      font-size: 1.15rem;
      font-weight: 400;
      margin-bottom: 30px;
      letter-spacing: -0.1px;
      line-height: 1.7;
    }
    .album-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px 20px;
      margin-bottom: 40px;
    }
    .photo-card {
      background: rgba(10, 20, 40, 0.76);
      border-radius: 24px;
      box-shadow: 0 6px 18px 0 rgba(32,60,120,0.13);
      padding: 18px 12px 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 370px;
    }
    .thumb-bg {
      width: 120px;
      height: 160px;
      background: #12244a;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px 0 rgba(20,40,80,0.11);
      overflow: hidden;
    }
    .thumb-bg img {
      width: 116px;
      height: 154px;
      object-fit: cover;
      border-radius: 12px;
      background: #dedede;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      transition: transform 0.15s;
    }
    .thumb-bg img:active { transform: scale(0.98);}
    .caption {
      font-size: 1.15rem;
      color: #f8fbff;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
      line-height: 1.2;
    }
    .desc-detail {
      font-size: 1.09rem;
      color: #c9ced8;
      font-weight: 400;
      text-align: center;
      line-height: 1.7;
      min-height: 44px;
      margin-bottom: 0;
      margin-top: 4px;
      letter-spacing: 0.01em;
    }
    .album-link {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 42px 0 0 0;
    }
    .album-link a {
      color: #fff;
      background: #3769c8;
      border-radius: 22px;
      padding: 13px 38px;
      font-size: 1.18rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 12px 0 rgba(40,60,140,0.07);
      transition: background 0.2s;
    }
    .album-link a:hover { background: #1e3670; }

    /* 팝업 */
    .popup-bg {
      position: fixed;
      z-index: 1000;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(24,32,56, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      animation: popupIn .18s;
    }
    @keyframes popupIn { from { opacity: 0;} to {opacity: 1;}}
    .popup-img-wrap {
      max-width: 98vw;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      margin-top: 36px;
    }
    .popup-img {
      max-width: 97vw;
      max-height: 62vh;
      box-shadow: 0 8px 28px 0 rgba(30, 44, 66, 0.26);
      border-radius: 18px;
      display: block;
      margin: 0 auto 16px auto;
      background: #fff;
      object-fit: contain;
    }
    .popup-caption {
      font-size: 1.22rem;
      color: #e7f0fd;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      font-weight: 400;
      text-align: center;
      margin-top: 10px;
      margin-bottom: 10px;
      max-width: 95vw;
      line-height: 1.8;
      word-break: keep-all;
      letter-spacing: 0.01em;
    }

    /* 모바일 전용 */
    @media (max-width: 900px) {
      .container { padding: 10px 0 30px 0;}
      .album-grid { grid-template-columns: repeat(2, 1fr);}
      .photo-card { min-height: 320px; }
      .thumb-bg { width: 38vw; height: 50vw; min-width: 130px; min-height: 160px; }
      .thumb-bg img { width: 98%; height: 98%; min-width: 124px; min-height: 150px; }
      .caption { font-size: 1.05rem; }
      .desc-detail { font-size: 1.01rem; }
    }
    @media (max-width: 600px) {
      .container { padding: 2vw 0 25vw 0;}
      .album-grid { grid-template-columns: 1fr; gap: 24px 0;}
      .photo-card { min-height: 248px; padding: 14px 8px 18px 8px;}
      .thumb-bg { width: 72vw; height: 96vw; min-width: 120px; min-height: 160px; max-width: 300px; max-height: 400px; }
      .thumb-bg img { width: 97%; height: 97%; min-width: 110px; min-height: 140px;}
      .caption { font-size: 1.23rem; }
      .desc-detail { font-size: 1.14rem;}
      .album-link a { font-size: 1.08rem; padding: 11px 20vw;}
      .popup-img-wrap { margin-top: 8vw;}
      .popup-img { max-width: 96vw; max-height: 44vh;}
      .popup-caption { font-size: 1.13rem; max-width: 96vw;}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>할머니와 아들·딸·며느리들의 추억</h1>
    <div class="desc">
      가족의 역사가 깃든 따스한 순간들.<br>
      졸업식, 결혼식, 우정과 사랑이 담긴 특별한 이야기를 사진과 함께 돌아봅니다.
    </div>
    <div class="album-grid">
      <!-- 18개 사진(설명, 캡션, 데이터 등 이전 소스와 동일하게 채워 넣으세요) -->
      <!-- 아래 2개만 예시로 보여주고 나머지는 위 소스 참고하여 이어서 입력하면 됨 -->
      <div class="photo-card">
        <div class="thumb-bg">
          <img src="img/+2_1_5_01.jpg" data-img="img/+2_1_5_01.jpg" data-caption="가족의 시작과 성장, 어린 시절의 순수함과 따뜻함이 고스란히 남아있는 한 컷. 서로를 바라보는 시선 속에 엄마의 사랑과 남매의 정이 녹아있습니다." alt="">
        </div>
        <div class="caption">큰며느리와 작은 셋째 아들, 막내아들, 막내딸</div>
        <div class="desc-detail">가족의 시작과 성장, 어린 시절의 순수함과 따뜻함이 남아있는 한 컷. 서로를 바라보는 시선 속에 엄마의 사랑과 남매의 정이 녹아 있습니다.</div>
      </div>
      <div class="photo-card">
        <div class="thumb-bg">
          <img src="img/+2_1_5_02.jpg" data-img="img/+2_1_5_02.jpg" data-caption="교복을 입고 나란히 선 두 소녀의 모습. 풋풋한 우정과 청춘의 빛나는 하루를 함께한, 소중한 동행의 추억입니다." alt="">
        </div>
        <div class="caption">막내딸과 친구</div>
        <div class="desc-detail">교복을 입고 나란히 선 두 소녀의 모습. 풋풋한 우정과 청춘의 빛나는 하루를 함께한 소중한 동행의 추억입니다.</div>
      </div>
      <!-- ... (나머지 16개도 위 방식으로 동일하게 쭉 입력) ... -->
    </div>
    <div class="album-link">
      <a href="house_01_007.html">← 할아버지 추억 앨범 보러가기</a>
    </div>
  </div>
  <!-- 팝업 레이어 -->
  <div class="popup-bg" id="popupBg">
    <div class="popup-img-wrap">
      <img class="popup-img" id="popupImg" src="" alt="큰사진">
      <div class="popup-caption" id="popupCaption"></div>
    </div>
  </div>
  <script>
    document.querySelectorAll('.thumb-bg img').forEach(function(img) {
      img.addEventListener('click', function(e) {
        var popup = document.getElementById('popupBg');
        var popupImg = document.getElementById('popupImg');
        var popupCaption = document.getElementById('popupCaption');
        popupImg.src = img.getAttribute('data-img');
        popupCaption.textContent = img.getAttribute('data-caption');
        popup.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      });
    });
    document.getElementById('popupBg').addEventListener('click', function() {
      this.style.display = 'none';
      document.body.style.overflow = '';
    });
  </script>
</body>
</html>
