<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>영원의 집 – 가족 앨범 2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px;
    }
    h1 {
      text-align: center;
      color: #295cc6;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #557;
      font-size: 1rem;
      margin-bottom: 22px;
      font-weight: 400;
      line-height: 1.4;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      min-height: 220px;
    }
    .thumb, .thumb-empty {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
      cursor: pointer;
      transition: border 0.2s;
      position: relative;
    }
    .thumb:hover {
      border: 2px solid #295cc6;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .thumb-empty {
      cursor: default;
      color: #b7b7b7;
      font-size: 0.98rem;
      justify-content: center;
      align-items: center;
      font-weight: 400;
      border: 2px dashed #d0d0e2;
      background: #f5f5fa;
      text-align: center;
    }
    .thumb-empty::after {
      content: '사진 자리 비움';
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32,32,32,0.87);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 95vw;
      max-height: 90vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 70vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .caption.sm {
      font-size: 0.97rem;
      color: #6a7fa3;
      margin-bottom: 0;
      margin-top: 4px;
      font-weight: 400;
    }
   @media (max-width: 680px) {
  .album-container { padding: 12px 4px; }
  h1 { font-size: 1.28rem; }
  .desc { font-size: 0.91rem; }
  .big-img-box { max-width: 99vw; max-height: 99vh; padding: 2vw; }
  .big-img {
    max-width: 98vw;
    width: 98vw;
    height: auto;
    max-height: none;
  }
  .thumb, .thumb-empty {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    font-size: 0.95rem;
  }
  .thumbnails { gap: 10px; }
}
    .nav-links {
      margin-top: 36px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .nav-links a {
      color: #295cc6;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      background: #f0f6ff;
    }
    .nav-links a:hover {
      background: #d2e3ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>영원의 집 – 가족 앨범 2</h1>
    <div class="desc">
      가족의 시간과 추억의 사진에 담긴 소중한 이야기.<br>
      각각의 순간을 클릭하면 더 크게 볼 수 있습니다.
    </div>
    <div class="thumbnails" id="thumbnails"></div>
    <div class="nav-links">
      <a href="index.html">메인으로</a>
      <a href="house/house_01_005.html">아버지 보러가기</a>
    </div>
  </div>
  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()" />
      <div id="bigCaption" class="caption"></div>
      <div id="bigCaptionSm" class="caption sm"></div>
    </div>
  </div>
  <script>
    // 40장 전체 파일명, 기본설명
    const images = [
      { src: "img/+1_+1_02_21.jpg", caption: "부부의 다정함", sm: "동행의 의미" },
      { src: "img/+1_+1_02_22.jpg", caption: "가족 여행중 독사진", sm: "사랑이 오가는 자리" },
      { src: "img/+1_+1_02_23.jpg", caption: "아버지의 생신파티", sm: "축복받는 시간" },
      { src: "img/+1_+1_02_24.jpg", caption: "어머니의 독서시간", sm: "지혜와 여유" },
      { src: "img/+1_+1_02_25.jpg", caption: "정원 산책", sm: "꽃과 함께" },
      { src: "img/+1_+1_02_26.jpg", caption: "아이들과 웃음", sm: "가족의 행복" },
      { src: "img/+1_+1_02_27.jpg", caption: "어머니와 손자의 손", sm: "세대의 사랑" },
      { src: "img/+1_+1_02_28.jpg", caption: "다함께 노을 아래서", sm: "저녁의 추억" },
      { src: "img/+1_+1_02_29.jpg", caption: "겨울 산책", sm: "따뜻한 온기" },
      { src: "img/+1_+1_02_30.jpg", caption: "꽃밭에서 미소짓는 어머니", sm: "자연과 조화" },
      { src: "img/+1_+1_02_31.jpg", caption: "형제의 우애", sm: "든든한 버팀목" },
      { src: "img/+1_+1_02_32.jpg", caption: "명절 가족사진", sm: "연휴의 즐거움" },
      { src: "img/+1_+1_02_33.jpg", caption: "새벽 산책", sm: "고요한 시작" },
      { src: "img/+1_+1_02_34.jpg", caption: "가을 하늘 아래", sm: "넓은 세상" },
      { src: "img/+1_+1_02_35.jpg", caption: "부모님의 포옹", sm: "사랑의 표현" },
      { src: "img/+1_+1_02_36.jpg", caption: "손주와 놀이시간", sm: "순수한 웃음" },
      { src: "img/+1_+1_02_37.jpg", caption: "어머니의 소녀시절", sm: "청춘의 향기" },
      { src: "img/+1_+1_02_38.jpg", caption: "눈 내리는 날의 산책", sm: "겨울 낭만" },
      { src: "img/+1_+1_02_39.jpg", caption: "옛집 앞에서 가족사진", sm: "기억의 장소" },
      { src: "img/+1_+1_02_40.jpg", caption: "함께한 모든 순간들", sm: "영원의 가족" }
    ];

    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      let el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="album${idx+1}">`;
      el.onclick = () => showBig(idx);
      thumbs.appendChild(el);
    });

    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('bigCaptionSm').textContent = images[idx].sm;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }
    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }
    function escHandler(e) {
      if (e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
