<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>유년 시절의 추억 – 봄, 여름 그리고 겨울</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px;
    }
    h1 {
      text-align: center;
      color: #295cc6;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #557;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
      line-height: 1.4;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #295cc6;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 95vw;
      max-height: 90vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 80vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
    }
    @media (max-width: 680px) {
      .album-container { padding: 12px 4px; }
      h1 { font-size: 1.3rem; }
      .desc { font-size: 0.9rem; }
      .big-img-box { max-width: 98vw; max-height: 90vh; padding: 12px; }
      .big-img { max-width: 95vw; max-height: 60vh; }
      .thumb {
        width: 80px;
        height: 80px;
        border-radius: 12px;
      }
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .nav-links a {
      color: #295cc6;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      background: #f0f6ff;
    }
    .nav-links a:hover {
      background: #d2e3ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>유년 시절의 추억 – 봄, 여름 그리고 겨울</h1>
    <div class="desc">
      어린 시절의 환한 미소, 친구들과의 소풍, 계절을 닮은 사진들.<br>
      가족과 함께 보낸 소중한 시간, 그리고 추억 속의 나를 모았습니다.
    </div>
    <div class="thumbnails" id="thumbnails"></div>
    <div class="nav-links">
      <a href="house_01_003_01.html">이전</a>
      <a href="house_01_003_03.html">다음</a>
      <a href="house_01.html">메인</a>
    </div>
  </div>

  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()" />
      <div id="bigCaption" class="caption"></div>
      <div id="bigCaptionSm" class="caption sm"></div>
    </div>
  </div>

  <script>
    // 실제 파일명 + house_01_003_02.html에서 작성한 설명을 1:1 매칭
    const images = [
      { src: "img/house_01_003_45.jpg", caption: "유치원 졸업식날, 처음 받는 학사모가 조금은 어색했던 날.", sm: "졸업식의 설렘" },
      { src: "img/house_01_003_46.jpg", caption: "노란색 유니폼을 입고 친구들과 함께한 봄 소풍.", sm: "유치원 봄 소풍" },
      { src: "img/house_01_003_47.jpg", caption: "롯데월드에서 모두가 함께 모여 찍은 유치원 봄 소풍 기념 사진.", sm: "롯데월드 봄 소풍" },
      { src: "img/house_01_003_48.jpg", caption: "파란 기차 앞에서 친구들과 다함께 포즈!", sm: "기차 앞에서 단체 사진" },
      { src: "img/house_01_003_49.jpg", caption: "소풍날 받은 꽃다발을 품에 안고, 살짝 긴장한 듯한 모습.", sm: "꽃다발과 함께" },
      { src: "img/house_01_003_50.jpg", caption: "한복을 곱게 차려입고, 언니와 함께 찍은 졸업식 날.", sm: "한복 입은 자매" },
      { src: "img/house_01_003_51.jpg", caption: "졸업식 날, 자매의 환한 미소와 꼭 끌어안은 순간.", sm: "자매의 웃음" },
      { src: "img/house_01_003_52.jpg", caption: "봄꽃이 만개한 정원에서 브이(V)를 그리며 찍은 사진.", sm: "꽃과 함께" },
      { src: "img/house_01_003_53.jpg", caption: "비옷을 입고 강가의 바위에 앉아 자연과 함께한 시간.", sm: "비옷, 강가" },
      { src: "img/house_01_003_54.jpg", caption: "빗속의 산책, 핑크색과 노란색 비옷을 입고 숲에서 장난치는 두 자매.", sm: "비옷, 자매 산책" },
      { src: "img/house_01_003_55.jpg", caption: "푸른 숲을 배경으로 높이 손을 들어 올린 즐거운 순간.", sm: "푸른 숲, 브이!" },
      { src: "img/house_01_003_56.jpg", caption: "돌탑이 가득한 산 위에서, 서로를 응원하며 남긴 추억.", sm: "산 위의 돌탑" },
      { src: "img/house_01_003_57.jpg", caption: "강가 바위 위에 나란히 앉아, 자연을 벗삼아 쉬는 모습.", sm: "강가의 자매" },
      { src: "img/house_01_003_58.jpg", caption: "환하게 웃으며 자연을 가득 담은 자매의 모습.", sm: "자연과 웃음" },
      { src: "img/house_01_003_59.jpg", caption: "안개 낀 산 정상에서 브이(V) 포즈로 남긴 나만의 추억.", sm: "산 정상에서" },
      { src: "img/house_01_003_60.jpg", caption: "비옷을 입고 앉아, 강가에서 조용히 브이 포즈를 남긴 순간.", sm: "강가에서 브이" },
      { src: "img/house_01_003_61.jpg", caption: "비가 내린 산길, 핑크색 비옷과 함께 산책의 추억.", sm: "산길 산책" },
      { src: "img/house_01_003_62.jpg", caption: "봄꽃의 향기를 코끝으로 느끼며, 호기심 가득한 표정.", sm: "꽃향기와 호기심" },
      { src: "img/house_01_003_63.jpg", caption: "노란 개나리 앞에서 익살스럽게 장난치는 모습.", sm: "개나리, 장난" },
      { src: "img/house_01_003_64.jpg", caption: "마당 한가운데에서 나무를 꼭 안고 활짝 웃는 모습.", sm: "나무와 웃음" },
      { src: "img/house_01_003_65.jpg", caption: "눈 내린 들판에서 두 자매의 겨울 여행, 즐거운 추억.", sm: "눈 위의 자매" },
      { src: "img/house_01_003_66.jpg", caption: "겨울 햇살 아래 벤치에 나란히 앉은 두 자매의 포근한 하루.", sm: "겨울 벤치" }
    ];

    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="photo${idx+1}">`;
      el.onclick = () => showBig(idx);
      thumbs.appendChild(el);
    });

    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('bigCaptionSm').textContent = images[idx].sm;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }

    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }

    function escHandler(e) {
      if (e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
