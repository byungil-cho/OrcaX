<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>아내의 가족 - 이유하 백일 기념 앨범</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px;
    }
    h1 {
      text-align: center;
      color: #3a5e9e;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #999;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
      line-height: 1.4;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #3a5e9e;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .thumb.empty {
      background: #f6f6f6;
      border: 2px dashed #d2d2d2;
      cursor: default;
      pointer-events: none;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 95vw;
      max-height: 90vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 80vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
    }
    @media (max-width: 680px) {
      .album-container { padding: 12px 4px; }
      h1 { font-size: 1.3rem; }
      .desc { font-size: 0.9rem; }
      .big-img-box { max-width: 98vw; max-height: 90vh; padding: 12px; }
      .big-img { max-width: 95vw; max-height: 60vh; }
      .thumb {
        width: 80px;
        height: 80px;
        border-radius: 12px;
      }
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .nav-links a {
      color: #3a5e9e;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover {
      background: #e6f0ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>이유하 백일 – 아내와 가족의 소중한 기록</h1>
    <div class="desc">
      우리 아내와 가족이 함께한 이유하의 백일잔치.<br>
      따뜻한 축하와 사랑이 가득한 그날의 추억을 사진으로 남겼습니다.
    </div>
    <div class="thumbnails" id="thumbnails"></div>
    <div class="nav-links">
      <a href="0_0_01.html">이전</a>
      <a href="house_01.html">메인</a>
      <a href="0_0_01_01.html">다음</a>
    </div>
  </div>

  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()" />
      <div id="bigCaption" class="caption"></div>
    </div>
  </div>

  <script>
    const images = [
      {
        src: "img/0_0_01.jpg",
        caption: "이유하의 백일을 맞아 가족 모두가 모여 축하하는 모습. 밝은 미소와 따뜻한 분위기가 가득하다."
      },
      {
        src: "img/0_0_02.jpg",
        caption: "아내와 외할머니가 이유하에게 사랑을 담아 한복을 입혀주는 순간. 섬세한 손길에 가족의 애정이 전해진다."
      },
      {
        src: "img/0_0_03.jpg",
        caption: "외할머니 품에 안겨 백일 한복을 차려입은 이유하. 백일의 주인공다운 당당한 포즈!"
      },
      {
        src: "img/0_0_04.jpg",
        caption: "가족과 함께 백일상을 배경으로 기념촬영. 축복과 기쁨이 함께하는 순간."
      },
      {
        src: "img/0_0_05.jpg",
        caption: "모두가 밝게 웃으며 이유하의 백일을 축하한다. 가족의 사랑과 행복이 가득한 장면."
      },
      {
        src: "img/0_0_06.jpg",
        caption: "외할머니와 유하 아빠, 그리고 유하 이모와 이모부와 유하 엄마 아빠와 함께 이유하를 중심으로 환하게 웃는 가족사진."
      },
      // 아래는 자리만 차지하는 14개(이미지 없음, 나중 연결)
      { src: "", caption: "img/0_0_07.jpg" },
      { src: "", caption: "img/0_0_08.jpg" },
      { src: "", caption: "img/0_0_09.jpg" },
      { src: "", caption: "img/0_0_10.jpg" },
      { src: "", caption: "img/0_0_11.jpg" },
      { src: "", caption: "img/0_0_12.jpg" },
      { src: "", caption: "img/0_0_13.jpg" },
      { src: "", caption: "img/0_0_14.jpg" },
      { src: "", caption: "img/0_0_15.jpg" },
      { src: "", caption: "img/0_0_16.jpg" },
      { src: "", caption: "img/0_0_17.jpg" },
      { src: "", caption: "img/0_0_18.jpg" },
      { src: "", caption: "img/0_0_19.jpg" },
      { src: "", caption: "img/0_0_20.jpg" }
    ];

    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      if (img.src) {
        el.className = "thumb";
        el.innerHTML = `<img src="${img.src}" alt="photo${idx+1}">`;
        el.onclick = () => showBig(idx);
      } else {
        el.className = "thumb empty";
        el.innerHTML = `<span style="color:#bbb; font-size:0.9rem;">${img.caption}</span>`;
      }
      thumbs.appendChild(el);
    });

    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }

    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }

    function escHandler(e) {
      if (e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
