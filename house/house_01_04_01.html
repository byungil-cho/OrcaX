<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나의 군 생활 ② – 비무장지대의 추억</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px 32px 18px;
    }
    h1 {
      text-align: center;
      color: #3a5e9e;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #999;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #3a5e9e;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top:0; left:0; width:100vw; height:100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity:0;}
      to {opacity:1;}
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 84vw;
      max-height: 80vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from {transform: scale(0.94);}
      to {transform: scale(1);}
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 70vw;
      max-height: 56vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
    }
    @media (max-width: 680px) {
      .album-container {padding: 12px 4px;}
      h1 {font-size: 1.17rem;}
      .big-img-box {max-width: 99vw; max-height: 94vh;}
      .big-img {max-width: 94vw; max-height: 60vh;}
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .nav-links a {
      color: #3a5e9e;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
    }
    .nav-links a:hover {
      background: #e6f0ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>나의 군 생활 ② – 비무장지대의 추억</h1>
    <div class="desc">
      분단의 최전선에서<br>
      청춘과 전우애, 그리고 도전의 기억이 담긴 비무장지대(DMZ) 시절의 기록입니다.
    </div>
    <div class="thumbnails" id="thumbnails">
      <!-- 썸네일 자동삽입 -->
    </div>
    <div class="nav-links">
      <a href="story.html">메인</a>
      <a href="house_01_04.html">이전</a>
    </div>
  </div>
  <!-- 오버레이/큰이미지 -->
  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()">
      <div id="bigCaption" class="caption"></div>
      <div id="bigCaptionSm" class="caption sm"></div>
    </div>
  </div>
  <script>
    // 25장, 파일명/설명
    const images = [
      { src: "img/house_01_04_25.jpg", caption: "트로피를 들고, 부대 대회 종합우승의 영광." },
      { src: "img/house_01_04_26.jpg", caption: "야외 운동장, 노력과 땀방울의 순간." },
      { src: "img/house_01_04_27.jpg", caption: "운동 후의 여유, 기합과 근성." },
      { src: "img/house_01_04_28.jpg", caption: "동기와 함께, 청춘의 한 컷." },
      { src: "img/house_01_04_29.jpg", caption: "기타를 들고 자연과 함께한 소박한 휴식." },
      { src: "img/house_01_04_30.jpg", caption: "임진강을 배경으로, 진지 근무의 긴장감." },
      { src: "img/house_01_04_31.jpg", caption: "물가에서, 경계근무 중의 사색." },
      { src: "img/house_01_04_32.jpg", caption: "나룻배와 함께, 수색 근무의 순간." },
      { src: "img/house_01_04_33.jpg", caption: "동기들과 산속에서, 잠시의 휴식." },
      { src: "img/house_01_04_34.jpg", caption: "초소 앞, 겨울 모자와 함께 단체사진." },
      { src: "img/house_01_04_35.jpg", caption: "최전방, 전우들과 포대 경계근무." },
      { src: "img/house_01_04_36.jpg", caption: "포대 앞, 또 다른 동기들과의 추억." },
      { src: "img/house_01_04_37.jpg", caption: "포대 언덕, 전우애가 빛나던 시간." },
      { src: "img/house_01_04_38.jpg", caption: "최전방 산등성이 위에서, 홀로 근무." },
      { src: "img/house_01_04_39.jpg", caption: "최전방 산등성이, 국방의 의지." },
      { src: "img/house_01_04_40.jpg", caption: "포대 경계철책, 두 전우의 단단한 모습." },
      { src: "img/house_01_04_41.jpg", caption: "탄띠를 두른 전우들과 포대 초소." },
      { src: "img/house_01_04_42.jpg", caption: "포대 초소, 결연한 각오의 단체사진." },
      { src: "img/house_01_04_43.jpg", caption: "최전방 언덕, 무거운 책임감." },
      { src: "img/house_01_04_44.jpg", caption: "포대 경계철책, 군 생활의 일상." },
      { src: "img/house_01_04_45.jpg", caption: "DMZ 철책을 따라 걷는 고독의 순간." },
      { src: "img/house_01_04_46.jpg", caption: "철책 앞에서, 전우와 함께 경계근무." },
      { src: "img/house_01_04_47.jpg", caption: "철책길, 경계근무의 고단함." },
      { src: "img/house_01_04_48.jpg", caption: "밧줄을 잡고, 언덕을 오르던 순간." },
      { src: "img/house_01_04_49.jpg", caption: "최전방, 끝없이 이어진 철책선 위에서." }
    ];
    // 추가 한줄 설명
    const captions_sm = [
      "부대 종합우승, 청춘의 영광을 손에.",
      "노력과 땀이 배인 운동장 한 켠.",
      "운동 후, 여유와 근성의 포즈.",
      "동기와 함께한 풋풋한 순간.",
      "기타와 자연, 조용한 낭만의 시간.",
      "임진강과 함께, 진지 근무의 기록.",
      "강변에서 사색과 긴장의 순간.",
      "나룻배 옆, 수색 근무의 추억.",
      "산속에서 동기들과 잠깐의 휴식.",
      "초소 앞, 겨울을 견딘 전우애.",
      "포대 경계근무, 결연한 청춘.",
      "포대 앞, 동기들과의 전우애.",
      "언덕 위에서 빛났던 동료애.",
      "최전방 근무, 고독 속의 사명감.",
      "국방의 의지로 버틴 산등성이.",
      "철책과 함께한 두 전우의 모습.",
      "탄띠와 함께, 결연한 다짐.",
      "초소에서 결연한 각오로.",
      "최전방 언덕, 무거운 책임감.",
      "철책에서 보낸 평범한 일상.",
      "DMZ 철책길을 걷던 고독한 순간.",
      "철책 앞, 전우와 함께한 경계근무.",
      "철책길, 경계근무의 고단함.",
      "밧줄을 잡고 오른 언덕 위 순간.",
      "끝없이 이어진 철책선 위의 나."
    ];
    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="군생활사진${idx+25}">`;
      el.onclick = ()=>showBig(idx);
      thumbs.appendChild(el);
    });
    // 큰 이미지 보여주기
    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('bigCaptionSm').textContent = captions_sm[idx];
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }
    // 닫기
    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }
    // ESC 키 핸들러
    function escHandler(e){
      if(e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
