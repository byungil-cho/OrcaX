<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>우리 가족의 추억 앨범 – 엄마와 딸들</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px;
    }
    h1 {
      text-align: center;
      color: #3a5e9e;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #999;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
      line-height: 1.4;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #3a5e9e;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 95vw;
      max-height: 90vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 80vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
    }
    @media (max-width: 680px) {
      .album-container { padding: 12px 4px; }
      h1 { font-size: 1.3rem; }
      .desc { font-size: 0.9rem; }
      .big-img-box { max-width: 98vw; max-height: 90vh; padding: 12px; }
      .big-img { max-width: 95vw; max-height: 60vh; }
      .thumb {
        width: 80px;
        height: 80px;
        border-radius: 12px;
      }
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .nav-links a {
      color: #3a5e9e;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover {
      background: #e6f0ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>엄마와 딸들의 시간 – 22장의 가족 기록</h1>
    <div class="desc">
      엄마와 딸들, 그리고 가족이 함께한 소중한 일상.<br>
      그 시절의 온기와 사랑이 담긴 사진들을 한 곳에 모았습니다.
    </div>
    <div class="thumbnails" id="thumbnails"></div>
    <div class="nav-links">
      <a href="house_01_002_01.html">이전</a>
      <a href="house_01.html">메인</a>
      <a href="house_01_003.html">동생 보러가기</a>
    </div>
  </div>

  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()" />
      <div id="bigCaption" class="caption"></div>
    </div>
  </div>

  <script>
    const images = [
      { src: "img/0_0_01_01.jpg", caption: "나무 그늘 아래 서 있는 엄마. 자연 속에서 조용히 생각에 잠긴 모습이 인상적입니다." },
      { src: "img/0_0_01_02.jpg", caption: "집에서 단정하게 앉아있는 젊은 시절의 엄마. 진한 곱슬머리와 차분한 표정이 눈길을 끕니다." },
      { src: "img/0_0_01_03.jpg", caption: "붉은 철쭉꽃 앞에서 앉아 있는 엄마. 꽃과 함께 편안한 봄날을 보내는 장면입니다." },
      { src: "img/0_0_01_04.jpg", caption: "모자를 쓴 채 잔디밭에 앉아 쉬고 있는 엄마. 편안한 청자켓 차림이 인상적입니다." },
      { src: "img/0_0_01_05.jpg", caption: "바닷가에서 푸른색 청자켓을 입고 서 있는 엄마. 잔잔한 파도와 함께 추억을 남깁니다." },
      { src: "img/0_0_01_06.jpg", caption: "엄마와 할머니가 함께 앉아 있는 사진. 따뜻한 가족애가 느껴지는 한 컷입니다." },
      { src: "img/0_0_01_07.jpg", caption: "군복을 입은 가족과 함께 야외에서 찍은 가족 사진. 단란한 분위기가 물씬 풍깁니다." },
      { src: "img/0_0_01_08.jpg", caption: "난간 앞에서 엄마와 딸이 함께 있는 장면. 산책 중인 듯 자연스러운 모습입니다." },
      { src: "img/0_0_01_09.jpg", caption: "엄마와 딸이 공원에서 벤치에 앉아 다정하게 포즈를 취했습니다. 봄날의 여유로움이 묻어납니다." },
      { src: "img/0_0_01_10.jpg", caption: "돌에 새겨진 글씨 앞에서 엄마와 두 딸이 함께 찰칵. 가족의 유쾌한 표정이 포인트입니다." },
      { src: "img/0_0_01_11.jpg", caption: "붉은 꽃나무 앞에서 엄마와 두 딸, 그리고 한 명의 친척이 함께한 사진. 모두가 화사하게 웃고 있습니다." },
      { src: "img/0_0_01_12.jpg", caption: "아빠, 엄마, 딸이 집 앞에서 함께 찍은 가족 사진. 세 사람의 단란한 표정이 인상적입니다." },
      { src: "img/0_0_01_13.jpg", caption: "짚단 앞에서 엄마와 할머니, 그리고 두 딸이 벤치에 나란히 앉아 있는 풍경. 시골의 정취가 살아 있습니다." },
      { src: "img/0_0_01_14.jpg", caption: "커튼 앞에서 엄마가 두 딸을 품에 안고 있는 모습. 포근한 실내에서 가족의 온기가 전해집니다." },
      { src: "img/0_0_01_15.jpg", caption: "밭에서 딸들과 함께 농작업을 하는 엄마. 어린 딸들과 함께 땅을 일구는 모습이 정겹습니다." },
      { src: "img/0_0_01_16.jpg", caption: "잔디밭에서 엄마와 두 딸이 다정하게 앉아 웃고 있습니다. 밝은 미소가 행복을 전합니다." },
      { src: "img/0_0_01_17.jpg", caption: "고택의 마루에 앉아 엄마와 두 딸이 함께 있는 장면. 진지한 표정에서 세월의 무게가 느껴집니다." },
      { src: "img/0_0_01_18.jpg", caption: "나무 옆에 서 있는 엄마의 모습. 옛 시골마을의 고즈넉함이 담겨 있습니다." },
      { src: "img/0_0_01_19.jpg", caption: "엄마와 두 딸이 놀이공원에서 함께한 날. 한복을 입은 딸과 엄마의 다정한 순간입니다." },
      { src: "img/0_0_01_20.jpg", caption: "아기를 안고 있는 엄마. 사랑스러운 포옹과 엄마의 따뜻한 미소가 인상적입니다." },
      { src: "img/0_0_01_21.jpg", caption: "벚꽃길에서 엄마와 두 딸이 함께 손을 잡고 있는 사진. 봄날의 따스함이 그대로 담겼습니다." },
      { src: "img/0_0_01_22.jpg", caption: "비 오는 날 계곡에서 엄마와 두 딸이 알록달록 우비를 입고 환하게 웃고 있습니다. 해맑은 V 포즈가 귀엽습니다." }
    ];

    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="photo${idx+1}">`;
      el.onclick = () => showBig(idx);
      thumbs.appendChild(el);
    });

    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }

    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }

    function escHandler(e) {
      if (e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
