<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>와이프의 옛 추억 – 가족앨범</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px;
    }
    h1 {
      text-align: center;
      color: #3a5e9e;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #999;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
      line-height: 1.4;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #3a5e9e;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 95vw;
      max-height: 90vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 80vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
    }
    @media (max-width: 680px) {
      .album-container { padding: 12px 4px; }
      h1 { font-size: 1.3rem; }
      .desc { font-size: 0.9rem; }
      .big-img-box { max-width: 98vw; max-height: 90vh; padding: 12px; }
      .big-img { max-width: 95vw; max-height: 60vh; }
      .thumb {
        width: 80px;
        height: 80px;
        border-radius: 12px;
      }
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .nav-links a {
      color: #3a5e9e;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover {
      background: #e6f0ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>와이프의 옛 추억 앨범</h1>
    <div class="desc">
      사랑과 웃음이 가득했던 젊은 시절의 추억.<br>
      가족, 친구, 소중한 순간이 담긴 한 장 한 장을 모았습니다.
    </div>
    <div class="thumbnails" id="thumbnails"></div>
    <div class="nav-links">
      <a href="0_0_01.html">이전</a>
      <a href="0_0_01_02.html">다음</a>
      <a href="house_01.html">메인으로</a>
      <a href="house_01_004.html">손녀보러가기</a>
    </div>
  </div>
  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()" />
      <div id="bigCaption" class="caption"></div>
      <div id="bigCaptionSm" class="caption sm"></div>
    </div>
  </div>
  <script>
    // img/파일명, 설명은 사진 분석으로 감성 작성
    const images = [
      { src: "img/0_0_01_01.jpg", caption: "청바지와 파마머리가 인상적인 젊은 시절의 아내. 맑은 햇살 아래 소녀처럼 수줍은 표정이 매력적이다.", sm: "밝은 자연 풍경 속" },
      { src: "img/0_0_01_02.jpg", caption: "단정하게 앉은 모습에서 세련된 90년대의 분위기가 느껴진다. 고전적이고 도도한 느낌의 아내의 방 모습.", sm: "붉은 원피스와 흰 블라우스" },
      { src: "img/0_0_01_03.jpg", caption: "청춘의 편안함과 여유가 느껴진다.", sm: "만개한 진달래 앞에 앉아 " },
      { src: "img/0_0_01_04.jpg", caption: "자연 속에서의 소탈한 미소와 편안한 분위기.", sm: "햇살 좋은 잔디밭에서 데님 재킷" },
      { src: "img/0_0_01_05.jpg", caption: "바람에 흩날리는 머리와 청재킷. 젊은 날의 추억과 낭만이 담긴 한 장.", sm: "바닷가 모래사장" },
      { src: "img/0_0_01_06.jpg", caption: "진한 모녀의 정이 느껴지는 사진. 아내와 장모님의 다정한 동행.", sm: "어머니와 함께한 소중한 한때" },
      { src: "img/0_0_01_07.jpg", caption: "엄마, 딸들, 그리고 군인 가족의 힘찬 포즈.", sm: "군복을 입은 가족과 함께한 사진." },
      { src: "img/0_0_01_08.jpg", caption: "벚꽃 아래 나란히 앉아 따뜻한 미소로 남긴 추억의 순간.", sm: "엄마와 딸의 봄 나들이" },
      { src: "img/0_0_01_09.jpg", caption: "엄마와 두 딸이 환하게 웃으며 남긴 가족사진. 평화롭고 즐거운 가족의 표정.", sm: "큰 돌에 새겨진 글씨 앞에서" },
      { src: "img/0_0_01_10.jpg", caption: "그리고 이모가 함께한 모습. 유쾌한 미소와 즐거운 분위기.", sm: "만개한 꽃을 배경으로 엄마와 세 명의 가족" },
      { src: "img/0_0_01_11.jpg", caption: "딸이 함께한 집 앞 마당에서의 사진. 어린 딸의 해맑은 표정이 인상적이다.", sm: "아빠, 엄마" },
      { src: "img/0_0_01_12.jpg", caption: "그리고 할머니까지 함께한 풍경. 따뜻한 가족애가 묻어난다.", sm: "겨울 외투를 입고 벤치에 앉아있는 가족" },
      { src: "img/0_0_01_13.jpg", caption: "겨울옷과 사랑이 가득한 가족의 분위기.", sm: "아늑한 실내에서 아내와 두 딸이 함께한 모습" },
      { src: "img/0_0_01_14.jpg", caption: "친구들과 운동장에서 자유롭게 웃고 떠드는 즐거운 한때.", sm: "밭에서 온 가족이 열심히 농작업을 하고 있는 장면" },
      { src: "img/0_0_01_15.jpg", caption: "소녀들의 해맑은 모습과 엄마의 정성스러운 손길.", sm: "밭에서 온 가족이 냉일캐기" },
      { src: "img/0_0_01_16.jpg", caption: "봄날 잔디밭에서 엄마와 두 딸이 포근하게 앉아 밝게 웃고 있는 순간.", sm: "유쾌한 가족의 미소" },
      { src: "img/0_0_01_17.jpg", caption: "고택의 마루에 나란히 앉은 엄마와 두 딸.", sm: "자연과 함께한 한적한 시골 풍경." },
      { src: "img/0_0_01_18.jpg", caption: "전통 가옥의 마당에서 엄마가 나무에 기대어 포즈를 취한 모습.", sm: "자연과 함께한 한적한 시골 풍경" },
      { src: "img/0_0_01_19.jpg", caption: "엄마와 두 딸이 나란히 선 유치원 졸업식 날.", sm: "한복과 예쁜 미소로 특별한 날을 남겼다" },
      { src: "img/0_0_01_20.jpg", caption: "막내 아기였던 시절, 엄마의 입마춤 따뜻하게 입마추는 딸의 모습.", sm: "사랑이 가득한 모녀의 첫 추억" },
      { src: "img/0_0_01_21.jpg", caption: "벚꽃길에서 엄마와 두 딸이 손을 잡고 함께한 산책.", sm: "봄날의 평온한 가족 풍경" },
      { src: "img/0_0_01_22.jpg", caption: "봄비 오는 계곡에서 엄마와 두 딸이 알록달록 비옷을 입고 해맑게 브이(V)를 그리며 찍은 사진.", sm: "여행의 추억이 가득하다." }
    ];

    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="photo${idx+1}">`;
      el.onclick = () => showBig(idx);
      thumbs.appendChild(el);
    });

    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('bigCaptionSm').textContent = images[idx].sm;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }

    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }

    function escHandler(e) {
      if (e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
