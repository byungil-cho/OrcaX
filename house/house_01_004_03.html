<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>손녀딸, 사랑의 성장 앨범 (3/3)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Jua 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(130deg, #e7f3fb 0%, #aee7f6 100%);
      font-family: 'Gowun Dodum', 'Pretendard', 'Noto Sans KR', sans-serif;
      color: #222; margin:0; min-height:100vh;
    }
    .container {
      max-width: 670px; margin: 0 auto; padding: 18px 0 38px 0;
      text-align: center;
    }
    h2 {
      margin-bottom: 8px; margin-top: 6px;
      font-family: 'Jua', sans-serif;
      font-size: 2.3rem;
      color: #2196f3;
      letter-spacing: -1px;
      text-shadow: 0 3px 12px #b3dafe73;
    }
    .desc {
      font-size: 1.09rem; color:#44708a;
      margin-bottom: 22px;
      background: rgba(255,255,255,0.67);
      border-radius: 18px;
      padding: 18px 6vw 17px 6vw;
      box-shadow: 0 2px 14px #b3dafe2b;
      font-family: 'Gowun Dodum', 'Pretendard', sans-serif;
      line-height: 1.7;
    }
    .desc .blue {
      color: #2196f3 !important;
      font-family: 'Jua', sans-serif;
      font-size: 1.13em;
      font-weight: bold;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 8px #d0ecfa99;
      display: inline-block;
      margin-top: 7px;
    }
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 26px;
      width: 97vw; max-width: 620px; margin-left:auto; margin-right:auto;
    }
    .thumb-grid img {
      width: 100%; aspect-ratio: 1/1; object-fit: cover;
      border-radius: 20px;
      border: 2.5px solid #b3dafe;
      background: #f7fcff;
      box-shadow: 0 3px 14px #b3d3ef33, 0 0px 0 #b3dafe15;
      cursor: pointer;
      transition: border-color 0.17s, box-shadow 0.17s;
      position: relative;
    }
    .thumb-grid img:hover {
      border-color: #2196f3;
      box-shadow: 0 6px 22px #86bbf766, 0 0px 0 #b3dafe1c;
    }
    .caption { display:none; }
    .link-bar {
      display: flex; justify-content: center; gap: 22px; margin-top:32px;
    }
    .link-bar a {
      background: linear-gradient(90deg,#a3d8fd 10%, #4fc3f7 90%);
      color: #fff;
      text-decoration: none; font-size:1.11rem;
      padding: 10px 30px; border-radius: 24px;
      font-family: 'Jua', sans-serif;
      font-weight: bold; letter-spacing:-0.5px;
      box-shadow: 0 2px 8px #b3dafe36;
      border: 1.5px solid #b3dafe;
      transition: background 0.14s, color 0.14s;
    }
    .link-bar a:hover { background:#2196f3; color:#e3f3ff; }
    /* 팝업 */
    .modal-bg {
      position: fixed; top:0; left:0; width:100vw; height:100vh;
      background: rgba(211, 237, 255, 0.96);
      z-index: 1111; display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.15s;
      padding: 0;
      box-sizing: border-box;
    }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

    .modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      padding: 0;
      box-sizing: border-box;
    }
    .modal-img {
      width: 100vw;
      max-width: 820px;
      height: auto;
      max-height: 92vh;
      border-radius: 38px;
      box-shadow: 0 12px 38px #b3dafe88, 0 2px 24px #b3dafe22;
      object-fit: contain;
      background: #f7fcff;
      display: block;
      margin-bottom: 16px;
      cursor: pointer;
      border: 4px solid #2196f3;
      transition: box-shadow 0.16s;
    }
    .modal-img:active {
      box-shadow: 0 4px 12px #2196f388, 0 2px 12px #b3dafe77;
    }
    .modal-caption {
      color: #222; /* 검정 */
      font-size: 1.04rem;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      text-shadow: none;
      padding: 0 18px 2px 18px;
      text-align: center;
      line-height: 1.8;
      font-weight: normal;
      max-width: 98vw;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
      background: #fff;
      border-radius: 13px;
      box-shadow: 0 1px 10px #b3dafe2f;
      display: inline-block;
    }
    @media (max-width: 850px) {
      .container { max-width:100vw;}
      .thumb-grid { grid-template-columns: repeat(3, 1fr); max-width: 100vw;}
    }
    @media (max-width: 620px) {
      .thumb-grid { grid-template-columns: repeat(3, 1fr);}
    }
    @media (max-width: 500px) {
      .modal-img {
        width: 100vw;
        max-width: 100vw;
        height: auto;
        max-height: 77vh;
        border-radius: 18px;
      }
      .modal-caption { font-size: 0.95rem; }
    }
    @media (max-width: 420px) {
      .thumb-grid { grid-template-columns: repeat(2, 1fr);}
      .modal-caption { font-size: 0.87rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>손녀딸, 사랑의 성장 앨범</h2>
    <div class="desc">
      가족 모두의 사랑을 듬뿍 받고 자란 우리 손녀딸!<br>
      사진 한 장 한 장에 웃음, 추억, 그리고 할아버지의 따뜻한 마음이 담겨 있습니다.<br>
      <span class="blue">손녀딸의 작은 미소와 행복한 순간을 <b>함께 기억</b>해주세요.</span>
    </div>
    <div class="thumb-grid" id="thumbGrid"></div>
    <div class="link-bar">
      <a href="house_01_004_02.html">이전</a>
      <a href="house_01.html">메인으로 가기</a>
    </div>
  </div>
  <div id="modal" style="display:none;">
    <div class="modal-bg" onclick="closeModal()">
      <div class="modal-content">
        <img id="modalImg" class="modal-img" src="" alt="크게보기" onclick="closeModal()">
        <div id="modalCap" class="modal-caption"></div>
      </div>
    </div>
  </div>
  <script>
    // 사진+설명 데이터
    const photos = [
      { src: "img/+-2_-1_34.jpg", cap: "포근한 아침, 햇살 아래에서 예쁜 미소와 함께 첫 인사를 건네요." },
      { src: "img/+-2_-1_35.jpg", cap: "작은 손에 꽃을 쥐고, 천진난만하게 웃는 모습이 너무 사랑스러워요." },
      { src: "img/+-2_-1_36.jpg", cap: "파스텔빛 방 안, 인형을 꼭 안고 세상을 궁금해하는 눈빛." },
      { src: "img/+-2_-1_37.jpg", cap: "커다란 밀짚모자 아래에서 햇살처럼 빛나는 얼굴." },
      { src: "img/+-2_-1_38.jpg", cap: "살짝 수줍은 표정에 담긴 행복, 사랑스러움이 가득합니다." },
      { src: "img/+-2_-1_39.jpg", cap: "포근한 쿠션 위, 호기심 가득한 눈동자로 세상을 바라봐요." },
      { src: "img/+-2_-1_40.jpg", cap: "곰돌이 인형들과 친구가 되어 서랍장 위에서 깜찍한 포즈!" },
      { src: "img/+-2_-1_41.jpg", cap: "인형들 사이에서 세상 제일 행복한 미소를 짓는 손녀딸." },
      { src: "img/+-2_-1_42.jpg", cap: "곰인형들 틈에서 작고 소중한 보물처럼 반짝이는 미소." },
      { src: "img/+-2_-1_43.jpg", cap: "곰인형을 품에 꼭 안고 할아버지를 바라보는 따뜻한 눈빛." },
      { src: "img/+-2_-1_44.jpg", cap: "상큼한 턱받이, 엄마 품에서 안심한 듯 평화로운 표정." },
      { src: "img/+-2_-1_45.jpg", cap: "하늘빛 모자, 사랑이 넘치는 엄마와의 행복한 순간." },
      { src: "img/+-2_-1_46.jpg", cap: "하얀 원피스와 미소, 가족과 함께여서 더욱 빛나는 우리." },
      { src: "img/+-2_-1_47.jpg", cap: "환한 웃음, 사랑하는 가족의 품에서 자라나는 행복." }
    ];
    // 썸네일 생성
    const thumbGrid = document.getElementById('thumbGrid');
    photos.forEach((ph,i)=>{
      const img = document.createElement('img');
      img.src = ph.src;
      img.alt = `손녀딸사진${i+1}`;
      img.onclick = ()=>openModal(i);
      thumbGrid.appendChild(img);
    });

    function openModal(idx){
      const m = document.getElementById('modal');
      document.getElementById('modalImg').src = photos[idx].src;
      document.getElementById('modalCap').innerText = photos[idx].cap;
      m.style.display = 'flex';
      document.body.style.overflow = "hidden";
    }
    function closeModal(){
      document.getElementById('modal').style.display = 'none';
      document.body.style.overflow = "";
    }
    // ESC로 닫기
    document.addEventListener('keydown', function(e){
      if(e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
