<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>손녀딸 사랑의 포토북 (3/3)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 감성 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(130deg, #ffe8ef 0%, #aee7f6 100%);
      font-family: 'Gowun Dodum', 'Jua', 'Pretendard', 'Noto Sans KR', sans-serif;
      color: #3b2c21; margin:0; min-height:100vh;
    }
    .container {
      max-width: 670px; margin: 0 auto; padding: 18px 0 38px 0;
      text-align: center;
    }
    h2 {
      margin-bottom: 8px; margin-top:6px;
      font-family: 'Jua', 'Pretendard', sans-serif;
      font-size: 2rem; color: #d64a6e;
      letter-spacing: -1px;
      text-shadow: 0 2px 8px #ffdde9b0;
    }
    .desc {
      font-size: 1.07rem; color:#7f5a46;
      margin-bottom: 22px;
      background: rgba(255,255,255,0.62);
      border-radius: 16px;
      padding: 14px 6vw 13px 6vw;
      box-shadow: 0 2px 14px #ffe3f277;
      font-family: 'Gowun Dodum', 'Pretendard', sans-serif;
      line-height: 1.7;
    }
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 26px;
      width: 97vw; max-width: 620px; margin-left:auto; margin-right:auto;
    }
    .thumb-grid img {
      width: 100%; aspect-ratio: 1/1; object-fit: cover;
      border-radius: 20px;
      border: 2.5px solid #f8c8e0;
      background: #fff5fa;
      box-shadow: 0 3px 14px #b6d3ef33, 0 0px 0 #ffe3f2;
      cursor: pointer;
      transition: border-color 0.17s, box-shadow 0.17s;
      position: relative;
    }
    .thumb-grid img:hover {
      border-color: #8bd1f7;
      box-shadow: 0 6px 22px #85c1e366, 0 0px 0 #ffe3f2;
    }
    .caption { display:none; }
    .link-bar {
      display: flex; justify-content: center; gap: 22px; margin-top:32px;
    }
    .link-bar a {
      background: linear-gradient(90deg,#ff90c3 10%, #86e1f7 90%);
      color: #fff;
      text-decoration: none; font-size:1.11rem;
      padding: 10px 30px; border-radius: 24px;
      font-family: 'Jua', 'Pretendard', sans-serif;
      font-weight: bold; letter-spacing:-0.5px;
      box-shadow: 0 2px 8px #ffd2eb6c;
      border: 1.5px solid #ffe3f2;
      transition: background 0.14s, color 0.14s;
    }
    .link-bar a:hover { background:#fa8ea1; color:#fff8ef; }
    /* 팝업 */
    .modal-bg {
      position: fixed; top:0; left:0; width:100vw; height:100vh;
      background: rgba(242, 212, 228, 0.96);
      z-index: 1111; display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.15s;
      padding: 0;
      box-sizing: border-box;
    }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

    .modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      padding: 0;
      box-sizing: border-box;
    }
    .modal-img {
      width: 100vw;
      max-width: 820px;
      height: auto;
      max-height: 92vh;
      border-radius: 38px;
      box-shadow: 0 12px 38px #fcb8e2d1, 0 2px 24px #4dc3ea77;
      object-fit: contain;
      background: #fff2fb;
      display: block;
      margin-bottom: 16px;
      cursor: pointer;
      border: 4px solid #e9b1c7;
      transition: box-shadow 0.16s;
    }
    .modal-img:active {
      box-shadow: 0 4px 12px #ed6e9a88, 0 2px 12px #5dc7f5aa;
    }
    .modal-caption {
      color: #d74a7b;
      font-size: 1.27rem;
      font-family: 'Jua', 'Pretendard', sans-serif;
      text-shadow: 0 1px 8px #ffd6ea72;
      padding: 0 18px 2px 18px;
      text-align: center;
      line-height: 1.7;
      font-weight: bold;
      max-width: 98vw;
      margin-bottom: 8px;
    }
    @media (max-width: 850px) {
      .container { max-width:100vw;}
      .thumb-grid { grid-template-columns: repeat(3, 1fr); max-width: 100vw;}
    }
    @media (max-width: 620px) {
      .thumb-grid { grid-template-columns: repeat(3, 1fr);}
    }
    @media (max-width: 500px) {
      .modal-img {
        width: 100vw;
        max-width: 100vw;
        height: auto;
        max-height: 77vh;
        border-radius: 18px;
      }
      .modal-caption { font-size: 1.08rem; }
    }
    @media (max-width: 420px) {
      .thumb-grid { grid-template-columns: repeat(2, 1fr);}
      .modal-caption { font-size: 0.97rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>손녀딸, 사랑의 성장 앨범</h2>
    <div class="desc">
      가족 모두의 사랑을 듬뿍 받고 자란 우리 손녀딸!<br>
      사진 한 장 한 장에 웃음, 추억, 그리고 할아버지의 따뜻한 마음이 담겨 있습니다.<br>
      <span style="color:#e06597;">손녀딸의 작은 미소와 행복한 순간을 <b>함께 기억</b>해주세요.</span>
    </div>
    <div class="thumb-grid" id="thumbGrid"></div>
    <div class="link-bar">
      <a href="house_01_004_02.html">이전</a>
      <a href="house_01.html">메인으로 가기</a>
    </div>
  </div>
  <div id="modal" style="display:none;">
    <div class="modal-bg" onclick="closeModal()">
      <div class="modal-content">
        <img id="modalImg" class="modal-img" src="" alt="크게보기" onclick="closeModal()">
        <div id="modalCap" class="modal-caption"></div>
      </div>
    </div>
  </div>
  <script>
    // 사진+설명 데이터
    const photos = [
      { src: "img/+-2_-1_34.jpg", cap: "포근한 아침, 햇살 아래에서 예쁜 미소와 함께 첫 인사를 건네요." },
      { src: "img/+-2_-1_35.jpg", cap: "작은 손에 꽃을 쥐고, 천진난만하게 웃는 모습이 너무 사랑스러워요." },
      { src: "img/+-2_-1_36.jpg", cap: "파스텔빛 방 안, 인형을 꼭 안고 세상을 궁금해하는 눈빛." },
      { src: "img/+-2_-1_37.jpg", cap: "커다란 밀짚모자 아래에서 햇살처럼 빛나는 얼굴." },
      { src: "img/+-2_-1_38.jpg", cap: "살짝 수줍은 표정에 담긴 행복, 사랑스러움이 가득합니다." },
      { src: "img/+-2_-1_39.jpg", cap: "포근한 쿠션 위, 호기심 가득한 눈동자로 세상을 바라봐요." },
      { src: "img/+-2_-1_40.jpg", cap: "곰돌이 인형들과 친구가 되어 서랍장 위에서 깜찍한 포즈!" },
      { src: "img/+-2_-1_41.jpg", cap: "인형들 사이에서 세상 제일 행복한 미소를 짓는 손녀딸." },
      { src: "img/+-2_-1_42.jpg", cap: "곰인형들 틈에서 작고 소중한 보물처럼 반짝이는 미소." },
      { src: "img/+-2_-1_43.jpg", cap: "곰인형을 품에 꼭 안고 할아버지를 바라보는 따뜻한 눈빛." },
      { src: "img/+-2_-1_44.jpg", cap: "상큼한 턱받이, 엄마 품에서 안심한 듯 평화로운 표정." },
      { src: "img/+-2_-1_45.jpg", cap: "하늘빛 모자, 사랑이 넘치는 엄마와의 행복한 순간." },
      { src: "img/+-2_-1_46.jpg", cap: "하얀 원피스와 미소, 가족과 함께여서 더욱 빛나는 우리." },
      { src: "img/+-2_-1_47.jpg", cap: "환한 웃음, 사랑하는 가족의 품에서 자라나는 행복." }
    ];
    // 썸네일 생성
    const thumbGrid = document.getElementById('thumbGrid');
    photos.forEach((ph,i)=>{
      const img = document.createElement('img');
      img.src = ph.src;
      img.alt = `손녀딸사진${i+1}`;
      img.onclick = ()=>openModal(i);
      thumbGrid.appendChild(img);
    });

    function openModal(idx){
      const m = document.getElementById('modal');
      document.getElementById('modalImg').src = photos[idx].src;
      document.getElementById('modalCap').innerText = photos[idx].cap;
      m.style.display = 'flex';
      document.body.style.overflow = "hidden";
    }
    function closeModal(){
      document.getElementById('modal').style.display = 'none';
      document.body.style.overflow = "";
    }
    // ESC로 닫기
    document.addEventListener('keydown', function(e){
      if(e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
