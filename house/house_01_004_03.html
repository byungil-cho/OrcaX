<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>손녀딸 추억앨범</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: linear-gradient(140deg, #23457c 0%, #0d2945 100%);
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      color: #fff; margin:0; min-height:100vh;
    }
    .container {
      max-width: 520px; margin: 0 auto; padding: 32px 0 50px 0;
      text-align: center;
    }
    h2 { margin-bottom: 16px; font-size:1.3rem; }
    .thumb-list {
      display: flex; flex-wrap: wrap;
      gap: 8px; justify-content: center;
      margin-bottom: 24px;
    }
    .thumb {
      width: 72px; height: 72px;
      object-fit: cover; border-radius: 10px;
      border: 2px solid #194c9e;
      cursor: pointer; background: #fff;
      transition: box-shadow 0.18s;
      box-shadow: 0 1px 8px #0a305d55;
    }
    .thumb:hover { box-shadow:0 4px 16px #3ad1ff22; border-color:#3ad1ff; }
    .caption {
      font-size: 1.05rem;
      color: #e4e9ef;
      margin-bottom: 7px;
      min-height: 36px;
    }
    .link-bar {
      display: flex; justify-content: center; gap: 22px; margin-top:24px;
    }
    .link-bar a {
      background: #23457c; color: #fff;
      text-decoration: none; font-size:1.06rem;
      padding: 7px 20px; border-radius: 16px;
      transition: background 0.13s; font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.09);
    }
    .link-bar a:hover { background: #185cc4; }

    /* 큰사진 팝업 */
    .modal-bg {
      position: fixed; top:0; left:0; width:100vw; height:100vh;
      background: rgba(20,38,72,0.91);
      z-index: 1111; display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.18s;
    }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
    .modal-img {
      max-width: 97vw; max-height: 85vh;
      border-radius: 18px;
      box-shadow: 0 8px 32px #0007;
      object-fit: contain;
      background: #222;
      display: block;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .modal-caption {
      color: #ffeeb9;
      font-size: 1.14rem;
      text-align: center;
      margin-bottom: 12px;
      padding: 0 16px;
    }
    @media (max-width: 500px) {
      .container { padding: 10px 0 30px 0;}
      .thumb { width: 54px; height:54px; }
      .modal-img { max-width:99vw; max-height:67vh; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>손녀딸 사랑의 성장 앨범 (2)</h2>
    <div class="thumb-list" id="thumbList"></div>
    <div class="caption" id="thumbCaption"></div>
    <div class="link-bar">
      <a href="house_01_004_01.html">이전</a>
      <a href="house_01.html">메인으로 가기</a>
    </div>
  </div>
  <div id="modal" style="display:none;">
    <div class="modal-bg" onclick="closeModal()">
      <div style="display:flex;flex-direction:column;align-items:center;">
        <img id="modalImg" class="modal-img" src="" alt="크게보기" onclick="closeModal()">
        <div id="modalCap" class="modal-caption"></div>
      </div>
    </div>
  </div>
  <script>
    // 데이터
    const photos = [
      { src: "img/+-2_-1_34.jpg", cap: "하늘하늘 예쁜 원피스와 레이스 보닛, 사랑스러운 첫 촬영" },
      { src: "img/+-2_-1_35.jpg", cap: "보닛을 쓰고 천진난만한 표정으로 활짝 웃는 순간" },
      { src: "img/+-2_-1_36.jpg", cap: "커다란 밀짚모자와 노란 뜨개 파인애플, 자연 속 작은 아기천사" },
      { src: "img/+-2_-1_37.jpg", cap: "햇살 아래 밀짚모자를 쓴 채, 평온하고 귀여운 모습" },
      { src: "img/+-2_-1_38.jpg", cap: "밀짚모자와 함께한 포근한 분위기의 정면샷" },
      { src: "img/+-2_-1_39.jpg", cap: "포근한 쿠션 위, 레이스 보닛을 쓰고 바라보는 동그란 눈망울" },
      { src: "img/+-2_-1_40.jpg", cap: "곰돌이 옷을 입고 서랍장 속 인형 친구들과 함께 찰칵" },
      { src: "img/+-2_-1_41.jpg", cap: "포근한 곰돌이 인형들 사이에서 환하게 웃는 모습" },
      { src: "img/+-2_-1_42.jpg", cap: "수많은 곰돌이 인형들 사이, 귀여운 곰돌이로 변신" },
      { src: "img/+-2_-1_43.jpg", cap: "곰돌이 인형을 꼭 안고 있는 사랑스러운 손녀딸" },
      { src: "img/+-2_-1_44.jpg", cap: "상큼한 그린 턱받이, 엄마와 함께한 자연스러운 일상" },
      { src: "img/+-2_-1_45.jpg", cap: "연하늘색 모자와 미소 가득, 엄마와 함께하는 행복" },
      { src: "img/+-2_-1_46.jpg", cap: "하얀 원피스에 사랑스러운 미소, 깔끔한 분위기의 기념사진" },
      { src: "img/+-2_-1_47.jpg", cap: "하얀 보닛을 쓰고 가족과 함께한 환한 웃음" }
    ];
    // 썸네일 생성
    const thumbList = document.getElementById('thumbList');
    const thumbCaption = document.getElementById('thumbCaption');
    photos.forEach((ph,i)=>{
      const img = document.createElement('img');
      img.src = ph.src;
      img.className = 'thumb';
      img.alt = `작은사진${i+1}`;
      img.onclick = ()=>openModal(i);
      thumbList.appendChild(img);
    });

    function openModal(idx){
      const m = document.getElementById('modal');
      document.getElementById('modalImg').src = photos[idx].src;
      document.getElementById('modalCap').innerText = photos[idx].cap;
      m.style.display = 'flex';
      document.body.style.overflow = "hidden";
    }
    function closeModal(){
      document.getElementById('modal').style.display = 'none';
      document.body.style.overflow = "";
    }
    // ESC로 닫기
    document.addEventListener('keydown', function(e){
      if(e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
