<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>큰딸의 어린시절 1 – 20장의 성장 기록</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      background: #f8f7f5;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #222;
    }
    .album-container {
      max-width: 900px;
      margin: 24px auto 16px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 32px 18px;
    }
    h1 {
      text-align: center;
      color: #3a5e9e;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 2rem;
    }
    .desc {
      text-align: center;
      color: #999;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 400;
      line-height: 1.4;
    }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(60,60,60,0.07);
      cursor: pointer;
      background: #f0f0f0;
      border: 2px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border 0.2s;
    }
    .thumb:hover {
      border: 2px solid #3a5e9e;
    }
    .thumb img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32,32,32,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .big-img-box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.13);
      max-width: 95vw;
      max-height: 90vh;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.2s;
    }
    @keyframes popIn {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    .big-img {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 80vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(40,40,40,0.14);
      margin-bottom: 18px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .caption {
      color: #222;
      font-size: 1.03rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .caption.sm {
      font-size: 0.98rem;
      color: #444;
      margin-bottom: 0;
      margin-top: 6px;
    }
    @media (max-width: 680px) {
      .album-container { padding: 12px 4px; }
      h1 { font-size: 1.3rem; }
      .desc { font-size: 0.9rem; }
      .big-img-box { max-width: 98vw; max-height: 90vh; padding: 12px; }
      .big-img { max-width: 95vw; max-height: 60vh; }
      .thumb {
        width: 80px;
        height: 80px;
        border-radius: 12px;
      }
    }
    .nav-links {
      margin-top: 40px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .nav-links a {
      color: #3a5e9e;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.03rem;
      padding: 8px 20px;
      border-radius: 14px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover {
      background: #e6f0ff;
      color: #0d2345;
    }
  </style>
</head>
<body>
  <div class="album-container">
    <h1>큰딸의 어린시절 1 – 20장의 성장 기록</h1>
    <div class="desc">
      사랑스러웠던 큰딸의 아기 시절부터 유년 시절까지, 가족의 추억이 오롯이 담긴 사진들.<br>
      한 장 한 장, 가족의 사랑과 따뜻함이 깃든 순간들입니다.
    </div>
    <div class="thumbnails" id="thumbnails"></div>
    <div class="nav-links">
      <a href="house_01_003_02.html">이전</a>
      <a href="house_01_002_02.html">다음</a>
      <a href="house_01.html">메인</a>
    </div>
  </div>

  <div class="overlay" id="overlay" style="display:none;">
    <div class="big-img-box">
      <img id="bigImg" class="big-img" src="" alt="" onclick="hideBig()" />
      <div id="bigCaption" class="caption"></div>
      <div id="bigCaptionSm" class="caption sm"></div>
    </div>
  </div>

  <script>
    // img/파일명으로 수정
    const images = [
      { src: "img/+-1_01_08.jpg", caption: "방긋방긋, 갓 태어난 큰딸의 귀여운 모습.", sm: "아기의 미소" },
      { src: "img/+-1_01_09.jpg", caption: "폭신한 아기 의자에 앉아 신기하게 주위를 바라보는 모습.", sm: "아기 의자에 앉아" },
      { src: "img/+-1_01_10.jpg", caption: "보행기에 타고 온 집안을 탐험하던 시절.", sm: "보행기 첫 외출" },
      { src: "img/+-1_01_11.jpg", caption: "언니(누나)의 품에 꼭 안긴 아기 시절의 따뜻한 순간.", sm: "언니와 함께" },
      { src: "img/+-1_01_12.jpg", caption: "엄마 품에 안겨 장난감을 만지작거리며 행복한 미소.", sm: "엄마 품, 장난감 놀이" },
      { src: "img/+-1_01_13.jpg", caption: "첫 걸음마를 뗄 무렵, 호기심 가득한 눈빛.", sm: "첫 걸음마" },
      { src: "img/+-1_01_14.jpg", caption: "정성껏 차린 첫돌 상 앞에서, 한복이 참 잘 어울렸던 그날.", sm: "첫돌 한복" },
      { src: "img/+-1_01_15.jpg", caption: "생애 첫 한복, 부끄럽지만 귀여운 표정으로 돌잔치.", sm: "한복 입은 첫돌" },
      { src: "img/+-1_01_16.jpg", caption: "엄마와 함께한 돌잔치, 사랑이 가득했던 순간.", sm: "돌잔치, 엄마와" },
      { src: "img/+-1_01_17.jpg", caption: "튤립이 만발한 봄날, 친구와 함께한 포근한 미소.", sm: "튤립 공원에서" },
      { src: "img/+-1_01_19.jpg", caption: "햇살 가득한 날, 예쁜 모자를 쓰고 앉아있는 모습.", sm: "모자 쓴 큰딸" },
      { src: "img/+-1_01_20.jpg", caption: "할머니와 사촌과 함께한 따뜻한 집안 풍경.", sm: "할머니와 집에서" },
      { src: "img/+-1_01_21.jpg", caption: "장난감을 높이 들어올리며 환하게 웃던 어린 시절.", sm: "장난감과 환한 웃음" },
      { src: "img/+-1_01_22.jpg", caption: "사촌과 나란히 앉아, 진지하게 무언가를 바라보는 모습.", sm: "사촌과 함께" },
      { src: "img/+-1_01_23.jpg", caption: "엄마, 동생과 함께 평상에 앉아 남긴 가족 나들이 사진.", sm: "가족 나들이" },
      { src: "img/+-1_01_24.jpg", caption: "초록 들판에서 자매가 나란히 앉아 노는 행복한 시간.", sm: "들판에서 자매" },
      { src: "img/+-1_01_25.jpg", caption: "해맑은 표정과 익살스러운 포즈로 유쾌함을 뽐내던 둘.", sm: "유쾌한 어린시절" },
      { src: "img/+-1_01_26.jpg", caption: "햇살 아래에서 데님 원피스를 맞춰입은 귀여운 자매.", sm: "데님 자매" },
      { src: "img/+-1_01_27.jpg", caption: "봄꽃 가득한 정원에서, 엄마와 자매가 활짝 웃던 날.", sm: "정원의 봄날" },
      { src: "img/+-1_01_18.jpg", caption: "튤립 정원에서 친구와 함께 찍은 마지막 추억 한 컷.", sm: "튤립정원에서 친구와" }
    ]

    const thumbs = document.getElementById('thumbnails');
    images.forEach((img, idx) => {
      const el = document.createElement('div');
      el.className = "thumb";
      el.innerHTML = `<img src="${img.src}" alt="photo${idx+1}">`;
      el.onclick = () => showBig(idx);
      thumbs.appendChild(el);
    });

    function showBig(idx) {
      document.getElementById('bigImg').src = images[idx].src;
      document.getElementById('bigCaption').textContent = images[idx].caption;
      document.getElementById('bigCaptionSm').textContent = images[idx].sm;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('bigImg').onclick = hideBig;
      document.addEventListener('keydown', escHandler);
    }

    function hideBig() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('bigImg').onclick = null;
      document.removeEventListener('keydown', escHandler);
    }

    function escHandler(e) {
      if (e.key === "Escape") hideBig();
    }
  </script>
</body>
</html>
