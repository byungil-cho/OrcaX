<!-- withdraw.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 출금 요청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #001f3f;
      color: white;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
    }
    input {
      padding: 1rem;
      margin: 1rem;
      font-size: 1rem;
      width: 80%;
      max-width: 400px;
    }
    button {
      padding: 1rem 2rem;
      font-size: 1rem;
      background: #00cc99;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #009f7a;
    }
  </style>
</head>
<body>
  <h1>💸 OrcaX 출금 요청</h1>
  <p>50000 ORCAX 이상 보유 시 지갑 주소와 출금 수량을 입력하세요.</p>
  <input type="text" id="email" placeholder="이메일 (자동 입력됨)" readonly>
  <br>
  <input type="text" id="wallet" placeholder="지갑 주소 입력">
  <br>
  <input type="number" id="amount" placeholder="출금 수량">
  <br>
  <button onclick="submitWithdraw()">출금 요청 보내기</button>

  <script>
    const emailField = document.getElementById('email');
    fetch('/api/me')
      .then(res => res.json())
      .then(data => {
        if (data?.user?.email) emailField.value = data.user.email;
      });

    function submitWithdraw() {
      const email = document.getElementById('email').value;
      const wallet = document.getElementById('wallet').value;
      const amount = document.getElementById('amount').value;

      if (!wallet || !amount) return alert('모든 필드를 입력해주세요.');

      fetch('/api/withdraw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, wallet, amount })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('출금 요청이 접수되었습니다.');
          document.getElementById('wallet').value = '';
          document.getElementById('amount').value = '';
        } else {
          alert(data.message || '요청 실패');
        }
      });
    }
  </script>
</body>
</html>
