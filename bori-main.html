
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bori Farm - My Barley</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #222;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }
    .container {
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .stage {
      margin: 2rem 0;
    }
    .button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      margin-top: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #f5c842;
      color: #000;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .button:hover {
      background-color: #e0b636;
    }
    .input-group {
      margin-top: 2rem;
      display: none;
    }
    input[type="text"] {
      padding: 0.75rem;
      font-size: 1.2rem;
      border-radius: 8px;
      border: none;
      width: 300px;
      text-align: center;
    }
    .result {
      margin-top: 3rem;
      background-color: #333;
      padding: 2rem;
      border-radius: 10px;
      display: none;
    }
    #nicknameBox {
      text-align: right;
      margin-top: -2rem;
      margin-bottom: 1rem;
      font-weight: bold;
      color: #f5c842;
    }
    #statusBox {
      text-align: center;
      color: #00ffcc;
      font-weight: bold;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="nicknameBox"></div>
    <h1>나만의 보리 농사</h1>

    <div id="statusBox">🔌 전기 공급 상태 확인 중...</div>

    <div class="stage" id="farmStage">
      <p>보리를 키워보세요! 보리를 심고 키우면 수확할 수 있습니다.</p>
      <button class="button" onclick="growBarley()">🌾 보리 키우기</button>
    </div>

    <div class="input-group" id="nameStage">
      <label for="barleyName">보리 이름을 지어주세요</label><br>
      <input type="text" id="barleyName" placeholder="보리 이름 입력" />
      <button class="button" onclick="submitBarley()">다음 단계로</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    const nicknameBox = document.getElementById("nicknameBox");
    const statusBox = document.getElementById("statusBox");

    if (!nickname) {
      alert("로그인 정보가 없습니다. 입구로 돌아갑니다.");
      window.location.href = "orcax-farm_000.html";
    } else {
      nicknameBox.textContent = `👤 ${nickname} 님`;
    }

    function growBarley() {
      document.getElementById('farmStage').style.display = 'none';
      document.getElementById('nameStage').style.display = 'block';
    }

    function submitBarley() {
      const name = document.getElementById('barleyName').value.trim();
      if (!name) {
        alert('보리 이름을 입력해주세요!');
        return;
      }
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `🌾 당신의 보리 이름은 <strong>${name}보리</strong>입니다.`;
      resultDiv.style.display = 'block';
      setTimeout(() => {
        window.location.href = 'bori-factory.html';
      }, 2000);
    }

    function checkServerStatus() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/status")
        .then(res => {
          if (!res.ok) throw new Error();
          statusBox.textContent = "✅ 전기 공급 중 (서버 연결됨)";
          statusBox.style.color = "lime";
        })
        .catch(() => {
          statusBox.textContent = "⚠️ 전기 공급 끊김 (서버 오류)";
          statusBox.style.color = "red";
        });
    }

    checkServerStatus();
  </script>
</body>
</html>
