<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>옥수수 고객 관리자 페이지</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f7f9fa;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #00cec9;
      padding: 20px;
      color: white;
      text-align: center;
      font-size: 1.8em;
      position: relative;
    }
    .top-button {
      position: absolute;
      left: 20px;
      top: 20px;
    }
    .top-button a {
      background: white;
      color: #00cec9;
      padding: 8px 14px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #2d3436;
    }
    .controls {
      text-align: center;
      margin-bottom: 20px;
    }
    .controls input, .controls button {
      margin: 5px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      font-size: 1.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .empty {
      text-align: center;
      color: #aaa;
      padding: 20px 0;
    }
    .del-btn {
      background: #ff7675;
      border: none;
      color: white;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .del-btn:hover {
      background: #d63031;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-button">
      <a href="/OrcaX/index.html">🚓 현장출동</a>
    </div>
    🌽 옥수수 고객 관리자
  </header>

  <main>
    <h2>📋 등록된 고객 목록</h2>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="고객 이름 또는 활동 검색..." />
      <button id="sortToggle">정렬: 최신순</button>
    </div>
    <ul id="customerList">
      <li class="empty">불러오는 중...</li>
    </ul>
  </main>

  <script>
    let customers = [];
    let sortNewest = true;

    const list = document.getElementById("customerList");
    const searchInput = document.getElementById("searchInput");
    const sortToggle = document.getElementById("sortToggle");

    function renderList() {
      const keyword = searchInput.value.toLowerCase();
      const filtered = customers
        .filter(c => (c.name + c.activity).toLowerCase().includes(keyword))
        .sort((a, b) => sortNewest
          ? new Date(b.createdAt) - new Date(a.createdAt)
          : new Date(a.createdAt) - new Date(b.createdAt)
        );

      list.innerHTML = '';

      if (filtered.length === 0) {
        list.innerHTML = '<li class="empty">🔍 검색 결과가 없습니다.</li>';
        return;
      }

      filtered.forEach(c => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>
            🙋 <strong>${c.name}</strong> - ${c.activity} <br>
            🕓 ${new Date(c.createdAt).toLocaleString('ko-KR')}
          </span>
          <button class="del-btn" onclick="deleteCustomer('${c._id}')">❌</button>
        `;
        list.appendChild(li);
      });
    }

    function deleteCustomer(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      fetch(`/api/customers/${id}`, { method: 'DELETE' })
        .then(res => {
          if (res.ok) {
            customers = customers.filter(c => c._id !== id);
            renderList();
          } else {
            alert('삭제 실패');
          }
        });
    }

    fetch('/api/customers')
      .then(res => res.json())
      .then(data => {
        customers = data;
        renderList();
      })
      .catch(() => {
        list.innerHTML = '<li class="empty">❌ 고객 정보를 불러오지 못했습니다.</li>';
      });

    searchInput.addEventListener('input', renderList);

    sortToggle.addEventListener('click', () => {
      sortNewest = !sortNewest;
      sortToggle.textContent = `정렬: ${sortNewest ? '최신순' : '오래된순'}`;
      renderList();
    });
  </script>

</body>
</html>
