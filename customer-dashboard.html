<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>옥수수 고객 관리자 페이지</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f7f9fa;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #00cec9;
      padding: 20px;
      color: white;
      text-align: center;
      font-size: 1.8em;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2d3436;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      font-size: 1.05em;
      display: flex;
      justify-content: space-between;
    }
    .empty {
      text-align: center;
      color: #aaa;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>🌽 옥수수 고객 관리자</header>

  <main>
    <h2>📋 등록된 고객 목록</h2>
    <ul id="customerList">
      <li class="empty">불러오는 중...</li>
    </ul>
  </main>

  <script>
    fetch('/api/customers')
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById('customerList');
        list.innerHTML = '';

        if (!data.length) {
          list.innerHTML = '<li class="empty">등록된 고객이 없습니다.</li>';
        } else {
          data.forEach(c => {
            const li = document.createElement('li');
            li.innerHTML = `<span>🙋 ${c.name}</span><span>${c.activity}</span>`;
            list.appendChild(li);
          });
        }
      })
      .catch(() => {
        const list = document.getElementById('customerList');
        list.innerHTML = '<li class="empty">고객 목록을 불러오지 못했습니다.</li>';
      });
  </script>

</body>
</html>
