<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>회원가입 | OrcaX 화물</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0, #23457c 0%, #0d2945 100%);
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      color: #fff;
    }
    .signup-container {
      background: rgba(22,36,62,0.97);
      border-radius: 1.7rem;
      padding: 2.0rem 1.1rem 1.2rem 1.1rem;
      margin: 2.5rem auto 0 auto;
      max-width: 400px;
      box-shadow: 0 6px 36px #021e3f50;
    }
    .logo-img {
      width: 52px; height: 52px; border-radius: 1.1rem; margin-bottom: 0.9rem; background: #111c;
    }
    h2 {
      text-align: center;
      margin-bottom: 1.1rem;
      font-size: 1.22rem;
      font-weight: 700;
      color: #ffe37b;
    }
    .input-group {
      margin-bottom: 1.06rem;
    }
    .input-group label {
      display: block;
      font-size: 1.02rem;
      color: #ffe27e;
      margin-bottom: 0.19rem;
      font-weight: 500;
    }
    .input-group input {
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 0.75rem;
      font-size: 1.08rem;
      background: #e8f3ff;
      color: #142741;
      outline: none;
      transition: box-shadow 0.15s;
    }
    .input-group input:focus {
      box-shadow: 0 0 0 2px #2b74ff44;
    }
    .signup-btn, .sns-btn {
      width: 100%;
      padding: 0.92rem;
      font-size: 1.13rem;
      border: none;
      border-radius: 1.25rem;
      background: #0070f3;
      color: #fff;
      font-weight: 600;
      margin-bottom: 0.3rem;
      cursor: pointer;
      box-shadow: 0 2px 8px #00417733;
      transition: background 0.16s;
    }
    .signup-btn:hover, .sns-btn:hover { background: #0056b3;}
    .sns-btn { margin-bottom: 0.45rem;}
    .sns-btn.naver { background: #2db400; color: #fff;}
    .sns-btn.kakao { background: #fee500; color: #181600;}
    .divider {
      margin: 1.08rem 0 0.7rem 0;
      color: #b2c3d3;
      font-size: 1.01rem;
      font-weight: 500;
      text-align:center;
    }
    .terms-wrap {
      font-size: 0.98rem;
      color: #e8eefc;
      background: #1a294422;
      padding: 0.7rem 0.4rem 0.6rem 0.7rem;
      border-radius: 0.6rem;
      margin-bottom: 1.1rem;
    }
    .terms-wrap input[type="checkbox"] {margin-right: 0.3em;}
    @media (max-width:500px) {
      .signup-container {padding: 1.1rem 0.6rem 0.7rem 0.6rem; margin-top: 1.1rem;}
      .logo-img { width: 38px; height: 38px;}
      h2 { font-size: 1.01rem;}
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div style="text-align:center;">
      <img src="img/log_01.jpg" class="logo-img" alt="OrcaX로고" />
    </div>
    <h2>회원가입</h2>
    <button class="sns-btn kakao" type="button" onclick="alert('카카오 간편가입 연동')">카카오로 1초 가입</button>
    <button class="sns-btn naver" type="button" onclick="alert('네이버 간편가입 연동')">네이버로 1초 가입</button>
    <div class="divider">또는 일반 가입</div>
    <form autocomplete="off">
      <div class="input-group">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div class="input-group">
        <label for="phone">연락처</label>
        <input type="tel" id="phone" name="phone" placeholder="010-1234-5678" required />
      </div>
      <div class="input-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="input-group">
        <label for="pw">비밀번호</label>
        <input type="password" id="pw" name="pw" required />
      </div>
      <div class="terms-wrap">
        <label><input type="checkbox" required /> 이용약관 동의</label><br>
        <label><input type="checkbox" required /> 개인정보 처리방침 동의</label>
      </div>
      <button type="submit" class="signup-btn">회원가입 완료</button>
    </form>
  </div>
</body>
</html>
