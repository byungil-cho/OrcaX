<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>기사 회원가입 | OrcaX 화물</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0, #23457c 0%, #0d2945 100%);
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      color: #fff;
    }
    .signup-container {
      background: rgba(22,36,62,0.97);
      border-radius: 1.7rem;
      padding: 2.0rem 1.1rem 1.2rem 1.1rem;
      margin: 2.5rem auto 0 auto;
      max-width: 420px;
      box-shadow: 0 6px 36px #021e3f50;
    }
    .logo-img {
      width: 52px; height: 52px; border-radius: 1.1rem; margin-bottom: 0.9rem; background: #111c;
      transition: filter 0.14s;
      cursor: pointer;
    }
    .logo-img:hover {
      filter: brightness(1.1) drop-shadow(0 2px 8px #ffd70055);
    }
    h2 {
      text-align: center;
      margin-bottom: 1.1rem;
      font-size: 1.21rem;
      font-weight: 700;
      color: #ffe37b;
    }
    .input-group {
      margin-bottom: 1.06rem;
    }
    .input-group label {
      display: block;
      font-size: 1.02rem;
      color: #ffe27e;
      margin-bottom: 0.19rem;
      font-weight: 500;
    }
    .input-group input, .input-group select {
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 0.75rem;
      font-size: 1.08rem;
      background: #e8f3ff;
      color: #142741;
      outline: none;
      transition: box-shadow 0.15s;
    }
    .input-group input:focus, .input-group select:focus {
      box-shadow: 0 0 0 2px #2b74ff44;
    }
    .signup-btn {
      width: 100%;
      padding: 0.92rem;
      font-size: 1.13rem;
      border: none;
      border-radius: 1.25rem;
      background: #22b355;
      color: #fff;
      font-weight: 600;
      margin-bottom: 0.5rem;
      cursor: pointer;
      box-shadow: 0 2px 8px #00417733;
      transition: background 0.16s;
    }
    .signup-btn:hover { background: #19903e;}
    .terms-wrap {
      font-size: 0.98rem;
      color: #e8eefc;
      background: #1a294422;
      padding: 0.7rem 0.4rem 0.6rem 0.7rem;
      border-radius: 0.6rem;
      margin-bottom: 1.1rem;
    }
    .terms-wrap input[type="checkbox"] {margin-right: 0.3em;}
    @media (max-width:500px) {
      .signup-container {padding: 1.1rem 0.6rem 0.7rem 0.6rem; margin-top: 1.1rem;}
      .logo-img { width: 38px; height: 38px;}
      h2 { font-size: 1.01rem;}
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div style="text-align:center;">
      <a href="https://byungil-cho.github.io/OrcaX/Cargo/index.html">
        <img src="img/log_01.jpg" class="logo-img" alt="OrcaX로고" />
      </a>
    </div>
    <h2>기사 회원가입</h2>
    <form autocomplete="off">
      <div class="input-group">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div class="input-group">
        <label for="phone">연락처</label>
        <input type="tel" id="phone" name="phone" placeholder="010-1234-5678" required />
      </div>
      <div class="input-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="input-group">
        <label for="pw">비밀번호</label>
        <input type="password" id="pw" name="pw" required />
      </div>
      <div class="input-group">
        <label for="carNo">차량번호</label>
        <input type="text" id="carNo" name="carNo" placeholder="예: 12가 1234" required />
      </div>
      <div class="input-group">
        <label for="carType">차량종류</label>
        <select id="carType" name="carType" required>
          <option value="">차량 선택</option>
          <option value="0.5t">다마스/0.5톤</option>
          <option value="1t">1톤/1톤카고</option>
          <option value="1.4t">1.4톤/1.4톤카고</option>
          <option value="2.5t">2.5톤 카고</option>
          <option value="4.5t">4.5톤 카고</option>
          <option value="5t">5톤 카고</option>
          <option value="11t">11톤 카고</option>
        </select>
      </div>
      <div class="input-group">
        <label for="license">운전면허 번호</label>
        <input type="text" id="license" name="license" placeholder="예: 11-22-333444-55" required />
      </div>
      <div class="input-group">
        <label for="biz">사업자 등록 여부</label>
        <select id="biz" name="biz" required>
          <option value="">선택</option>
          <option value="Y">예 (사업자 있음)</option>
          <option value="N">아니오 (개인 운송)</option>
        </select>
      </div>
      <div class="terms-wrap">
        <label><input type="checkbox" required /> 이용약관 동의</label><br>
        <label><input type="checkbox" required /> 개인정보 처리방침 동의</label>
      </div>
      <button type="submit" class="signup-btn">기사 회원가입 완료</button>
    </form>
  </div>
</body>
</html>
