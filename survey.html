
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>고객 만족도 설문조사</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #fefefe; color: #222; max-width: 700px; margin: auto; }
    h1 { color: #004a99; text-align: center; }
    label { display: block; margin-top: 20px; font-weight: bold; }
    select, textarea, input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; }
    button { margin-top: 30px; padding: 12px; background: #0077cc; color: white; border: none; width: 100%; font-size: 1em; cursor: pointer; }
    .thanks { display: none; margin-top: 20px; background: #e0ffe0; padding: 15px; border-radius: 5px; text-align: center; }
  </style>
</head>
<body>
  <h1>고객 만족도 설문조사</h1>

  <label for="name">이름 (선택)</label>
  <input type="text" id="name" placeholder="이름을 입력해주세요 (선택)">

  <label for="satisfaction">서비스 전반에 대한 만족도는?</label>
  <select id="satisfaction">
    <option value="">선택하세요</option>
    <option value="매우 만족">매우 만족</option>
    <option value="만족">만족</option>
    <option value="보통">보통</option>
    <option value="불만족">불만족</option>
    <option value="매우 불만족">매우 불만족</option>
  </select>

  <label for="comment">추가 의견이나 건의사항이 있다면 적어주세요:</label>
  <textarea id="comment" rows="5" placeholder="의견을 자유롭게 작성해주세요."></textarea>

  <button onclick="submitSurvey()">설문 제출</button>

  <div class="thanks" id="thanksMessage">🙏 소중한 의견 감사합니다!</div>

  <script>
    function submitSurvey() {
      const name = document.getElementById("name").value;
      const satisfaction = document.getElementById("satisfaction").value;
      const comment = document.getElementById("comment").value;

      if (!satisfaction) {
        alert("만족도를 선택해주세요.");
        return;
      }

      const survey = {
        name,
        satisfaction,
        comment
      };

      console.log("설문 결과:", survey);
      document.getElementById("thanksMessage").style.display = "block";
    }
  </script>
</body>
</html>
