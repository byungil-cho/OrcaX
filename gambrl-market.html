<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌾🥔 감자+보리 통합 거래소</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1rem;
      background: linear-gradient(to bottom, #263238, #37474f);
      color: white;
      text-align: center;
    }
    h1 {
      color: #ffc107;
      margin-bottom: 1rem;
    }
    #nickname {
      margin-bottom: 1rem;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .product-table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
      background: #455a64;
    }
    th, td {
      border: 1px solid #78909c;
      padding: 0.5rem;
    }
    th {
      background-color: #607d8b;
    }
    .sell-btn {
      padding: 0.4rem 0.8rem;
      background-color: #ffc107;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .sell-btn:hover {
      background-color: #ffb300;
    }
    #status {
      margin-top: 1rem;
      font-size: 1rem;
    }
    .nav {
      margin-top: 2rem;
    }
    .nav a {
      margin: 0 10px;
      padding: 8px 12px;
      background: #607d8b;
      color: white;
      border-radius: 6px;
      text-decoration: none;
    }
    .nav a:hover {
      background: #78909c;
    }
    #powerStatus {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: #90ee90;
    }
  </style>
</head>
<body>
  <h1>🌾🥔 감자+보리 통합 거래소</h1>
  <div id="powerStatus">⚡ 전기 상태 확인 중...</div>
  <div id="nickname"></div>
  <table class="product-table">
    <thead>
      <tr>
        <th>제품명</th>
        <th>재료</th>
        <th>수량</th>
        <th>판매가</th>
        <th>판매</th>
      </tr>
    </thead>
    <tbody id="product-list"></tbody>
  </table>
  <div id="status"></div>

  <div class="nav">
    <a href="bori-result.html">🔙 보리 가공 공장</a>
    <a href="potato-result.html">🥔 감자 가공 공장</a>
    <a href="orcax-farm_000.html">🌱 농장 입구</a>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    document.getElementById("nickname").textContent = `👤 ${nickname} 님의 거래소`; 

    // ⚡ 전기 상태 확인
    fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/status")
      .then(res => res.json())
      .then(data => {
        document.getElementById("powerStatus").textContent = data.message;
      })
      .catch(() => {
        document.getElementById("powerStatus").textContent = "❌ 전기 공급 끊김 (서버 오류)";
        document.getElementById("powerStatus").style.color = 'red';
      });

    fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/market/${nickname}`)
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("product-list");
        data.products.forEach(prod => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${prod.product}</td>
            <td>${prod.type === 'barley' ? '🌾 보리' : '🥔 감자'}</td>
            <td>${prod.quantity}</td>
            <td>${prod.price} ORCX</td>
            <td><button class="sell-btn" onclick="sellProduct('${prod._id}', '${prod.product}', ${prod.price})">판매</button></td>
          `;
          tbody.appendChild(tr);
        });
      });

    function sellProduct(id, product, price) {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/sell-product", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ id, nickname })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById("status").textContent = `✅ ${product} 판매 완료! +${price} ORCX 적립됨.`;
          location.reload();
        } else {
          document.getElementById("status").textContent = `❌ ${product} 판매 실패: ${data.message}`;
        }
      });
    }
  </script>
</body>
</html>
