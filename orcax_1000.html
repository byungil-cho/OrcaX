<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaX 이벤트</title>
  <style>
    html {
      -webkit-tap-highlight-color: transparent;
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #f3f3f3;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 1rem;
      background-color: #fff;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .thumbnail {
      width: 100%;
      max-width: 240px;
      height: auto;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s;
    }
    .thumbnail:hover {
      transform: scale(1.02);
    }
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.9);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 1rem;
      box-sizing: border-box;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 70vh;
    }
    .caption {
      margin-top: 1rem;
      font-size: 1rem;
      text-align: center;
    }
    .promo-text {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      text-align: center;
      color: #ccc;
      font-style: italic;
    }
    .footer {
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="ORCAX.jpg" alt="OrcaX의 시작을 알리는 상징적인 로고" class="thumbnail" loading="lazy">
    <img src="OrcaX_T.png" alt="OrcaX 커뮤니티 전용 티셔츠" class="thumbnail" loading="lazy">
    <img src="OrcaX_25000_03.png" alt="특별 이벤트를 기념하는 25,000 ORCX 포스터" class="thumbnail" loading="lazy">
    <img src="holin_01.jpg" alt="홀인원 NFT, 최고의 한 방을 기념하다" class="thumbnail" loading="lazy">
    <img src="OrcaX_ppster_02.jpg" alt="OrcaX 메인 포스터 #2" class="thumbnail" loading="lazy">
    <img src="OrcaX_pt_01.png" alt="OrcaX NFT 설명 프레젠테이션 이미지" class="thumbnail" loading="lazy">
    <img src="OrcaX_poster_003.jpg" alt="OrcaX 시즌3 이벤트 포스터" class="thumbnail" loading="lazy">
    <img src="OrcaX_T_01.png" alt="착용된 OrcaX 티셔츠 실물샷" class="thumbnail" loading="lazy">
    <img src="poster.png" alt="감성 가득한 메인 홍보 포스터" class="thumbnail" loading="lazy">
    <img src="poster_04.png" alt="OrcaX 포스터 버전 4" class="thumbnail" loading="lazy">
    <img src="OrcaX_poster_002.png" alt="OrcaX 포스터 버전 2" class="thumbnail" loading="lazy">
    <img src="phantom_wallet_guide.png" alt="팬텀지갑 설치부터 OrcaX NFT 수령까지!" class="thumbnail" loading="lazy">
    <img src="orcax_rwa_infographic.png" alt="현실과 연결되는 OrcaX RWA 생태계" class="thumbnail" loading="lazy">
    <img src="orcax_ticket_types.png" alt="OrcaX Web3 탑승권, 당신의 등급은?" class="thumbnail" loading="lazy">
    <img src="orcax_farm_flow.png" alt="OrcaX NFT 시스템 연동 흐름도" class="thumbnail" loading="lazy">
    <img src="orcax_puzzle_map.png" alt="OrcaX Puzzle NFT, 전설의 완성 구조!" class="thumbnail" loading="lazy">
    <img src="lsg-01.jpg" alt="솔라나 기반 OrcaX 실물자산토큰 QR 코드 포스터" class="thumbnail" loading="lazy">
    <img src="lsg-02.jpg" alt="폴리곤 기반 OrcaX 실물자산토큰 QR 코드 포스터" class="thumbnail" loading="lazy">
    <img src="lsg-03.png" alt="OrcaX 3D 심볼 로고 – Web3를 상징하는 X와 범고래의 조화" class="thumbnail" loading="lazy">
  </div>

  <div id="lightbox" class="lightbox">
    <img id="lightbox-img" src="" alt="확대 이미지">
    <div id="lightbox-caption" class="caption"></div>
    <div class="promo-text">OrcaX NFT, 손안에 펼쳐지는 Web3 라이프스타일</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxCaption = document.getElementById('lightbox-caption');
      const thumbnails = document.querySelectorAll('.thumbnail');

      thumbnails.forEach(function (thumb) {
        thumb.addEventListener('click', function () {
          lightboxImg.src = this.src;
          lightboxCaption.textContent = this.alt;
          lightbox.style.display = 'flex';
        });
      });

      lightbox.addEventListener('click', function () {
        lightbox.style.display = 'none';
        lightboxImg.src = '';
        lightboxCaption.textContent = '';
      });
    });
  </script>

  <div class="footer">
    © 2025 OrcaX. All rights reserved.
  </div>
</body>
</html>
