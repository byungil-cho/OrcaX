<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaX 이벤트</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #f3f3f3;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #fff;
      padding: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .thumbnail {
      width: 100%;
      max-width: 200px;
      margin: 10px auto;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      display: block;
    }
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
    }
    .footer {
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="ORCAX.jpg" alt="OrcaX 로고" class="thumbnail">
    <img src="OrcaX_T.png" alt="OrcaX 티셔츠" class="thumbnail">
    <img src="OrcaX_25000_03.png" alt="OrcaX 25000 이미지" class="thumbnail">
    <img src="holin_01.jpg" alt="홀인원 이미지" class="thumbnail">
    <img src="OrcaX_ppster_02.jpg" alt="포스터 02" class="thumbnail">
    <img src="OrcaX_pt_01.png" alt="PT 01 이미지" class="thumbnail">
    <img src="OrcaX_poster_003.jpg" alt="포스터 003" class="thumbnail">
    <img src="OrcaX_T_01.png" alt="OrcaX 티셔츠 실사" class="thumbnail">
    <img src="poster.png" alt="포스터 이미지" class="thumbnail">
    <img src="poster_04.png" alt="포스터 04" class="thumbnail">
    <img src="OrcaX_poster_002.png" alt="포스터 002" class="thumbnail">
    <div class="footer">
      © 2025 OrcaX. All rights reserved.
    </div>
  </div>

  <div id="lightbox" class="lightbox">
    <img id="lightbox-img" src="" alt="확대 이미지">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const thumbnails = document.querySelectorAll('.thumbnail');

      thumbnails.forEach(function (thumb) {
        thumb.addEventListener('click', function () {
          lightboxImg.src = this.src;
          lightbox.style.display = 'flex';
        });
      });

      lightbox.addEventListener('click', function () {
        lightbox.style.display = 'none';
      });
    });
  </script>
</body>
</html>
