<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>보리 가공 공장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #e7f7e1;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #3a552c;
    }
    #nicknameBox {
      text-align: right;
      margin-right: 1rem;
      font-weight: bold;
      color: #2a3b1f;
    }
    .product-list {
      margin-top: 1rem;
      background: #fff;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .product {
      padding: 0.5rem 0;
      border-bottom: 1px solid #ddd;
    }
    .product:last-child {
      border-bottom: none;
    }
    #factoryStatus {
      text-align: center;
      margin: 1rem 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🌾 보리 가공 공장</h1>
  <div id="nicknameBox"></div>
  <div id="factoryStatus">🔌 전기 공급 상태: <span id="power">확인 중...</span></div>
  <div class="product-list" id="productList">
    <p>불러오는 중...</p>
  </div>

  <script>
    const nickname = localStorage.getItem('nickname');
    document.getElementById('nicknameBox').innerText = `👤 ${nickname}`;

    async function checkPower() {
      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/power");
        const data = await res.json();
        document.getElementById("power").innerText = data.power ? "✅ 정상" : "❌ 차단됨";
      } catch {
        document.getElementById("power").innerText = "❌ 서버 오류";
      }
    }

    async function loadProducts() {
      try {
        const res = await fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/barley-products/${nickname}`);
        const data = await res.json();
        const listEl = document.getElementById("productList");
        listEl.innerHTML = '';

        if (data.success && data.products.length > 0) {
          data.products.forEach(p => {
            const el = document.createElement('div');
            el.className = 'product';
            el.innerText = `${p.productName} - ${p.quantity}개`;
            listEl.appendChild(el);
          });
        } else {
          listEl.innerHTML = '<p>보관된 보리 제품이 없습니다.</p>';
        }
      } catch (err) {
        document.getElementById("productList").innerHTML = '<p>❌ 서버 연결 실패</p>';
      }
    }

    checkPower();
    loadProducts();
  </script>
</body>
</html>
