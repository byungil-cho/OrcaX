<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보리 가공 공장</title>
  <style>
    body { font-family: 'Arial'; background: #f1fbe8; margin: 0; padding: 2rem; }
    h1 { text-align: center; color: #2f512e; }
    .status { text-align: center; margin-bottom: 1rem; }
    .error { color: red; }
    .ok { color: green; }
    .container { text-align: center; background: white; padding: 1.5rem; max-width: 500px; margin: auto; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .info { font-size: 1.2rem; margin: 1rem 0; }
    .nav-btns { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; }
    button { padding: 0.8rem 1.5rem; font-size: 1rem; border: none; border-radius: 8px; background: #836953; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <h1>보리 가공 공장</h1>
  <div class="status">
    <span id="powerStatus">⚡ 전기 건강: 정상</span>
    <span id="serverStatus">>\u❌ 서버 오류</span>
  </div>
  <div class="container">
    <div class="info" id="barleyInfo">보유 보리 정보를 불\u러오는 중...</div>
  </div>
  <div class="nav-btns">
    <button onclick="location.href='bori-factory.html'">프로세스 가공</button>
    <button onclick="location.href='gamja-result.html'">감자 가공</button>
    <button onclick="location.href='orcax-farm_000.html'">농장 입구</button>
  </div>

  <script>
    const power = document.getElementById("powerStatus");
    const server = document.getElementById("serverStatus");
    const barleyInfo = document.getElementById("barleyInfo");

    const nickname = localStorage.getItem("nickname");
    if (!nickname) {
      power.textContent = "⚠️ 닉네임 없음 (로그인 필요)";
      server.textContent = "❌ 서버 연결 실패";
      barleyInfo.textContent = "닉네임 정보가 없습니다. 다시 로그인 해주세요.";
    } else {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/barley-products/" + nickname)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            server.textContent = "✅ 서버 연결됨";
            server.classList.add("ok");
            barleyInfo.textContent = `🌾 농장 보유 보리: ${data.barley}개`;
          } else {
            throw new Error("서버 응답 오류");
          }
        })
        .catch(err => {
          console.error(err);
          server.textContent = "❌ 서버 연결 실패";
          server.classList.add("error");
          barleyInfo.textContent = "서버에서 보리 정보를 가져오지 못했습니다.";
        });
    }
  </script>
</body>
</html>
