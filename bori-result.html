<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보리 제품 만들기</title>
  <style>
    body {
      background-color: #1b1b1b;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .status {
      color: #00ffc3;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .highlight {
      color: #ffcc00;
    }
    input {
      padding: 10px;
      font-size: 1em;
      width: 200px;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      background-color: #f1c40f;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .box {
      background-color: #2f2f2f;
      margin: 2rem auto;
      padding: 1rem;
      width: 300px;
      border-radius: 10px;
      text-align: left;
    }
    ul {
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="status" id="serverStatus">🛠️ 서버 상태 확인 중...</div>
  <h1>🌾 보리 가공 결과</h1>

  <div class="box">
    <p class="highlight">🌾 들고온 보리 수확량: <span id="barleyAmount">0</span>말</p>
    <input type="text" placeholder="제품 종류 (예: 밥, 차, 떡 등)" id="productInput" />
    <button onclick="makeProduct()">제품 만들기</button>
  </div>

  <div class="box">
    <strong>📦 보관함:</strong>
    <ul id="inventoryList"></ul>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    if (!nickname) {
      alert("로그인 정보가 없습니다. 로그인 페이지로 이동합니다.");
      window.location.href = "orcax-farm_000.html";
    }

    async function checkServer() {
      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/status");
        if (res.ok) {
          document.getElementById("serverStatus").textContent = "✅ 서버 연결 완료";
        } else {
          document.getElementById("serverStatus").textContent = "❌ 전기 공급 끊김 (서버 오류)";
        }
      } catch (err) {
        document.getElementById("serverStatus").textContent = "❌ 전기 공급 끊김 (네트워크 오류)";
      }
    }

    async function loadUserData() {
      try {
        const res = await fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata?nickname=${nickname}`);
        const data = await res.json();
        if (data.success) {
          document.getElementById("barleyAmount").textContent = data.user.barley || 0;
          const inventoryEl = document.getElementById("inventoryList");
          inventoryEl.innerHTML = "";
          (data.user.inventory || []).forEach(item => {
            const li = document.createElement("li");
            li.textContent = `${item.type}: ${item.count}개`;
            inventoryEl.appendChild(li);
          });
        }
      } catch (err) {
        console.error("유저 데이터 불러오기 실패:", err);
      }
    }

    async function makeProduct() {
      const input = document.getElementById("productInput").value.trim();
      if (!input) return alert("제품명을 입력해주세요.");
      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/product/create", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ nickname, product: input })
        });

        const result = await res.json();

        if (!res.ok || !result.success) {
          throw new Error(result.message || "알 수 없는 오류");
        }

        alert(`${input} 제품이 성공적으로 만들어졌습니다!`);
        loadUserData();
      } catch (err) {
        console.error("제품 저장 오류:", err);
        alert("제품 저장 중 오류 발생: " + err.message);
      }
    }

    checkServer();
    loadUserData();
  </script>
</body>
</html>
