<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보리 수확 결과</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #3e2723, #795548);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .result-box {
      background-color: rgba(0, 0, 0, 0.6);
      border: 2px solid #f5c842;
      border-radius: 16px;
      padding: 2rem;
      max-width: 500px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    h1 {
      font-size: 2rem;
      color: #f5c842;
      margin-bottom: 1rem;
    }
    #nickname {
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    #result {
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffeb3b;
      animation: pop 1.5s ease-out infinite alternate;
    }
    @keyframes pop {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }
    .btn {
      margin-top: 2rem;
      padding: 0.8rem 2rem;
      background-color: #f5c842;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #d8ae36;
    }
  </style>
</head>
<body>
  <div class="result-box">
    <h1>🌾 보리 수확 결과</h1>
    <div id="nickname"></div>
    <div id="result"></div>
    <button class="btn" onclick="goBack()">농장으로 돌아가기</button>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    const yieldAmount = localStorage.getItem("bori_yield");

    if (!nickname || !yieldAmount) {
      alert("수확 정보가 없습니다. 다시 농사부터 시작해주세요.");
      window.location.href = "orcax-farm_000.html";
    } else {
      document.getElementById("nickname").textContent = `👤 ${nickname} 님`; 
      document.getElementById("result").textContent = `🌾 ${yieldAmount} 말 수확하셨습니다!`;
    }

    function goBack() {
      window.location.href = "bori-factory.html";
    }
  </script>
</body>
</html>
