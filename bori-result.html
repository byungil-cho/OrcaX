<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌾 보리 가공 공장</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      color: #6d4c41;
    }
    #powerStatus {
      margin-bottom: 1rem;
      font-weight: bold;
    }
    #nicknameBox {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }
    input[type="text"] {
      padding: 0.5rem;
      width: 200px;
    }
    input[type="number"] {
      padding: 0.5rem;
      width: 80px;
    }
    button {
      padding: 0.5rem 1rem;
      background-color: #8d6e63;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #795548;
    }
    .nav {
      margin-top: 2rem;
    }
    .nav a {
      margin: 0 10px;
      padding: 8px 12px;
      background: #ccc;
      color: #333;
      border-radius: 6px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>🌾 보리 가공 공장</h1>
  <div id="powerStatus">⚡ 전기 상태 확인 중...</div>
  <div id="nicknameBox"></div>

  <input type="text" id="productName" placeholder="제품 이름 입력">
  <input type="number" id="quantity" placeholder="수량" min="1">
  <button onclick="convertBarley()">제품 만들기</button>
  <div id="statusBox" style="margin-top: 1rem;"></div>

  <div class="nav">
    <a href="gambrl-market.html">📦 통합 거래소</a>
    <a href="orcax-farm_000.html">🏠 농장 입구</a>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    document.getElementById("nicknameBox").textContent = `👤 ${nickname} 님`;

    fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/status")
      .then(res => res.json())
      .then(data => {
        document.getElementById("powerStatus").textContent = data.message;
      })
      .catch(() => {
        document.getElementById("powerStatus").textContent = "❌ 전기 공급 끊김 (서버 오류)";
        document.getElementById("powerStatus").style.color = 'red';
      });

    function convertBarley() {
      const product = document.getElementById("productName").value;
      const quantity = Number(document.getElementById("quantity").value);

      if (!product || quantity <= 0) {
        document.getElementById("statusBox").textContent = "❌ 제품명과 수량을 정확히 입력하세요.";
        return;
      }

      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/convert-barley", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ nickname, product, quantity })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById("statusBox").textContent = `✅ ${product} ${quantity}개 가공 완료!`;
        } else {
          document.getElementById("statusBox").textContent = `❌ 오류: ${data.message}`;
        }
      });
    }
  </script>
</body>
</html>
