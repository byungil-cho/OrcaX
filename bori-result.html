<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보리 제품 만들기</title>
  <style>
    body {
      background-color: #222;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .initial-box {
      background-color: #444;
      padding: 1rem;
      border-radius: 10px;
      max-width: 500px;
      margin: 0 auto 2rem auto;
    }
    #initial-yield {
      font-size: 1.2rem;
      color: #f0c741;
      font-weight: bold;
    }
    .input-section {
      margin-bottom: 2rem;
    }
    input[type="text"] {
      padding: 0.75rem;
      font-size: 1rem;
      width: 250px;
      border-radius: 8px;
      border: none;
      text-align: center;
    }
    .button {
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      margin-left: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #f5c842;
      color: #000;
      cursor: pointer;
    }
    .button:hover {
      background-color: #e0b636;
    }
    #log {
      margin-top: 2rem;
      background-color: #333;
      padding: 1.5rem;
      border-radius: 10px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .summary {
      margin-top: 2rem;
      background-color: #444;
      padding: 1rem;
      border-radius: 10px;
      text-align: left;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .footer-nav {
      margin-top: 2rem;
    }
    .footer-nav button {
      background-color: #ffaa00;
      border: none;
      color: #000;
      padding: 0.5rem 1rem;
      margin: 0 0.5rem;
      border-radius: 5px;
      cursor: pointer;
    }
    .footer-nav button:hover {
      background-color: #e69a00;
    }
  </style>
</head>
<body>
  <h1>보리 제품 만들기</h1>
  <div class="initial-box">
    <div id="initial-yield"></div>
  </div>

  <div class="input-section">
    <input type="text" id="productInput" placeholder="제품 종류 (예: 밥, 차, 떡 등)" />
    <button class="button" onclick="makeProduct()">제품 만들기</button>
  </div>

  <div id="log"></div>
  <div class="summary" id="inventory"></div>

  <div class="footer-nav" id="footerNav" style="display: none;">
    <p>보리가 모두 소진되었습니다. 이제 어디로 가시겠습니까?</p>
    <button onclick="location.href='orcax-farm_000.html'">농장 입구로 가기</button>
    <button onclick="location.href='bori-main.html'">보리밭으로 가기</button>
    <button onclick="location.href='index.html'">퇴근하기</button>
  </div>

  <script>
    let yieldLeft = parseInt(localStorage.getItem('bori_yield')) || 0;
    let logDiv = document.getElementById('log');
    let yieldDisplay = document.getElementById('initial-yield');
    let inventoryDiv = document.getElementById('inventory');
    let productStorage = JSON.parse(localStorage.getItem('bori_products')) || {};

    yieldDisplay.textContent = `🌾 들고온 보리 수확량: ${yieldLeft}말`;

    function makeProduct() {
      const input = document.getElementById('productInput');
      let product = input.value.trim();
      if (!product) return alert('제품 이름을 입력하세요.');

      if (yieldLeft <= 0) {
        logDiv.innerHTML += `<p>💀 보리가 부족합니다. 더 이상 만들 수 없습니다.</p>`;
        document.getElementById('footerNav').style.display = 'block';
        return;
      }

      if (!product.startsWith('보리')) {
        product = '보리' + product;
      }

      yieldLeft--;
      localStorage.setItem('bori_yield', yieldLeft);

      if (!productStorage[product]) {
        productStorage[product] = 0;
      }
      productStorage[product]++;
      localStorage.setItem('bori_products', JSON.stringify(productStorage));

      logDiv.innerHTML += `<p>✅ ${product} 1개 만들었어요!<br>남은 보리: ${yieldLeft}말</p>`;
      input.value = '';

      updateInventory();

      // ✅ 서버 저장 추가
      const nickname = localStorage.getItem("nickname") || "익명농부";
      fetch("https://climbing-wholly-grouper.ngrok-free.app/api/farm/save", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          nickname: nickname,
          product: product,
          quantity: 1
        })
      })
      .then(res => res.json())
      .then(data => console.log("✅ 서버 저장 완료:", data))
      .catch(err => console.error("❌ 서버 저장 실패:", err));

      if (yieldLeft === 0) {
        document.getElementById('footerNav').style.display = 'block';
      }
    }

    function updateInventory() {
      let html = '<strong>📦 보관함:</strong><ul>';
      for (let key in productStorage) {
        html += `<li>${key}: ${productStorage[key]}개</li>`;
      }
      html += '</ul>';
      inventoryDiv.innerHTML = html;
    }

    updateInventory();
  </script>
</body>
</html>
