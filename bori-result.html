
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>보리 가공 결과</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }
    .status-box {
      display: inline-block;
      padding: 1rem 2rem;
      background: #333;
      border-radius: 10px;
      margin-bottom: 2rem;
    }
    .product {
      margin: 0.5rem 0;
      font-size: 1.2rem;
    }
    .button {
      padding: 0.8rem 1.5rem;
      background-color: #ffc107;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #nicknameBox {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-weight: bold;
      color: #fdd835;
    }
    #serverStatus {
      font-size: 0.9rem;
      color: #00ffcc;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="nicknameBox"></div>
  <div id="serverStatus">🔌 서버 상태 확인 중...</div>
  <h1>🌾 보리 가공 결과</h1>
  <div class="status-box">
    <div id="yieldInfo"></div>
    <div id="productInfo"></div>
  </div>
  <button class="button" onclick="goToMarket()">🏪 거래소 가기</button>

  <script>
    const nickname = localStorage.getItem("nickname");
    const yieldAmount = localStorage.getItem("bori_yield") || 0;
    const productList = JSON.parse(localStorage.getItem("bori_products") || "[]");

    const nicknameBox = document.getElementById("nicknameBox");
    const statusBox = document.getElementById("serverStatus");

    if (!nickname) {
      alert("로그인 정보가 없습니다. 입구로 이동합니다.");
      window.location.href = "orcax-farm_000.html";
    } else {
      nicknameBox.textContent = `👤 ${nickname} 님`;
    }

    document.getElementById("yieldInfo").textContent = `총 ${yieldAmount}말 수확했습니다`;

    const productInfo = document.getElementById("productInfo");
    productList.forEach(product => {
      const item = document.createElement("div");
      item.className = "product";
      item.textContent = `🥫 ${product}`;
      productInfo.appendChild(item);

      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/farm/save", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          nickname: nickname,
          product: product,
          quantity: 1
        })
      })
      .then(res => res.json())
      .then(data => console.log("✅ 저장 성공:", data))
      .catch(err => console.error("❌ 저장 실패:", err));
    });

    function checkServerStatus() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/status")
        .then(res => {
          if (!res.ok) throw new Error();
          statusBox.textContent = "✅ 전기 공급 중 (서버 연결됨)";
          statusBox.style.color = "lime";
        })
        .catch(() => {
          statusBox.textContent = "⚠️ 전기 공급 끊김 (서버 오류)";
          statusBox.style.color = "red";
        });
    }

    function goToMarket() {
      window.location.href = "borl-market.html";
    }

    checkServerStatus();
  </script>
</body>
</html>
