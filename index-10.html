<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🐋 OrcaX 실시간 채팅</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f2fcfe, #e0f1ff);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .chat-container {
      background-color: #fff;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 90%;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 1.1rem;
    }
    #server-status {
      text-align: center;
      font-size: 1.01em;
      font-weight: bold;
      margin-bottom: 0.7rem;
      padding: 0.5em;
      border-radius: 9px;
      letter-spacing: 0.5px;
      background: #f5fafe;
      border: 1px solid #c8e5f7;
    }
    .status-ok { color: #198754; }
    .status-bad { color: #b23c3c; }
    #online-users {
      margin-bottom: 8px;
      color: #176210;
      font-weight: bold;
      text-align: left;
      font-size: 1em;
      background: #f6ffef;
      padding: 6px 10px;
      border-radius: 7px;
      border: 1px solid #c8e5c7;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
    }
    textarea {
      resize: none;
      height: 80px;
    }
    button {
      background: linear-gradient(90deg, #3498db, #2ecc71);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    button:hover {
      opacity: 0.9;
    }
    .delete-btn {
      background: #e74c3c !important;
      margin-bottom: 8px;
      color: #fff !important;
      font-weight: bold;
    }
    #chat-log {
      margin-top: 1rem;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem;
      background: #f9f9f9;
    }
    .message {
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: #333;
    }
    .message.self {
      background-color: #e0f7da;
      padding: 8px;
      border-radius: 8px;
    }
    .scroll-toggle {
      margin-top: 0.3rem;
      font-size: 0.9rem;
      text-align: right;
      cursor: pointer;
      color: #3498db;
    }
    .back-button {
      margin-top: 1rem;
      text-align: center;
    }
    .back-button a {
      color: #fff;
      background-color: #3498db;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
    }
    .back-button a:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <h1>🐋 OrcaX 실시간 채팅</h1>
    <div id="server-status">서버 상태 확인 중...</div>
    <div id="online-users">
      <b>대화방 입장자:</b> <span id="user-list">-</span>
    </div>
    <input type="text" id="sender" placeholder="닉네임을 입력하세요" />
    <textarea id="message" placeholder="메시지를 입력하세요"></textarea>
    <button onclick="sendMessage()">전송하기</button>
    <button class="delete-btn" onclick="deleteAllMessages()">💣 전체 메시지 삭제</button>
    <div class="scroll-toggle" onclick="toggleScroll()">📌 자동 스크롤: <span id="scroll-state">켜짐</span></div>
    <div id="chat-log"></div>
    <div class="back-button">
      <a href="index.html">← 대화방 나가기</a>
    </div>
  </div>

  <script>
    const apiUrl = "https://orcax-franchise-backend.onrender.com/api/messages";
    const usersApi = "https://orcax-franchise-backend.onrender.com/api/online-users";
    let autoScroll = true;
    let currentNickname = "";

    // 서버 상태 체크
    function checkServerStatus() {
      fetch(apiUrl, { method: "GET" })
        .then(res => {
          if (res.ok) {
            document.getElementById("server-status").innerHTML =
              '<span class="status-ok">● 서버 접속 정상</span>';
          } else {
            document.getElementById("server-status").innerHTML =
              '<span class="status-bad">● 서버 접속 불가 (응답 오류)</span>';
          }
        })
        .catch(() => {
          document.getElementById("server-status").innerHTML =
            '<span class="status-bad">● 서버 접속 불가 (오프라인)</span>';
        });
    }

    // 내 닉네임 서버에 등록 (입장)
    function registerUser() {
      const sender = document.getElementById('sender').value.trim();
      if (!sender) return;
      fetch(usersApi, {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname: sender })
      });
    }

    // 실시간 접속자 리스트 불러오기
    function loadUsers() {
      fetch(usersApi)
        .then(res => res.json())
        .then(data => {
          document.getElementById('user-list').innerText =
            (data.users && data.users.length) ? data.users.join(", ") : "없음";
        });
    }

    // 채팅 메시지 전송
    function sendMessage() {
      const sender = document.getElementById("sender").value.trim();
      const message = document.getElementById("message").value.trim();
      if (!sender || !message) {
        alert("닉네임과 메시지를 모두 입력해주세요!");
        return;
      }
      currentNickname = sender;
      localStorage.setItem("nickname", sender);

      fetch(apiUrl, {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender, content: message })
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById("message").value = '';
        loadMessages();
      })
      .catch(err => {
        alert("⚠️ 메시지 전송 실패!");
        console.error("전송 에러:", err);
      });
    }

    // 전체 메시지 삭제
    function deleteAllMessages() {
      if (!confirm("정말 전체 대화내용을 모두 삭제하시겠습니까? (모두에게 적용됨)")) return;
      fetch(apiUrl, { method: "DELETE" })
        .then(res => res.json())
        .then(data => {
          alert(data.message || "모든 메시지 삭제 완료!");
          loadMessages();
        })
        .catch(err => {
          alert("메시지 삭제 실패!");
          console.error(err);
        });
    }

    document.getElementById("message").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // 채팅 메시지 불러오기
    function loadMessages() {
      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          const messages = Array.isArray(data) ? data : data.messages;
          if (!Array.isArray(messages)) return;
          const log = document.getElementById("chat-log");
          log.innerHTML = messages.map(msg =>
            `<div class="message${msg.sender === currentNickname ? ' self' : ''}">
              <strong>[${msg.sender}]</strong> ${msg.content || msg.message}
            </div>`
          ).join('');
          if (autoScroll) log.scrollTop = log.scrollHeight;
        })
        .catch(err => console.error("불러오기 에러:", err));
    }

    function toggleScroll() {
      autoScroll = !autoScroll;
      document.getElementById("scroll-state").innerText = autoScroll ? "켜짐" : "꺼짐";
    }

    // 브라우저 닫을 때 퇴장 통보
    window.addEventListener("beforeunload", function() {
      const sender = document.getElementById('sender').value.trim();
      if (!sender) return;
      navigator.sendBeacon(usersApi + "/exit", JSON.stringify({ nickname: sender }));
    });

    // 최초 진입 시 입장/유저 표시 주기적 호출
    window.onload = () => {
      const saved = localStorage.getItem('nickname');
      if (saved) {
        document.getElementById('sender').value = saved;
        currentNickname = saved;
      }
      checkServerStatus();
      loadMessages();
      loadUsers();
      setInterval(loadMessages, 5000);
      setInterval(loadUsers, 4000);
      setInterval(checkServerStatus, 7000); // 상태 주기적으로 체크
      setTimeout(registerUser, 700); // 입장 0.7초 후 내 닉네임 등록
    };
  </script>
</body>
</html>
