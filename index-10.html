<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🐳 OrcaX Chat Widget</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef9fb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 {
      color: #114b5f;
    }
    #chat-box {
      width: 90%;
      max-width: 600px;
      height: 400px;
      border: 1px solid #ccc;
      padding: 1rem;
      overflow-y: scroll;
      background-color: #fff;
      margin-bottom: 1rem;
    }
    .message {
      margin: 0.5rem 0;
    }
    .error {
      color: red;
    }
    input, button {
      padding: 0.5rem;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <h1>🐳 OrcaX Chat Widget</h1>
  <div id="chat-box">로딩 중...</div>
  <div>
    <input id="sender" type="text" placeholder="닉네임" />
    <input id="message" type="text" placeholder="메시지를 입력하세요" />
    <button onclick="sendMessage()">전송</button>
  </div>

  <script>
    const apiUrl = "https://mature-asp-perfect.ngrok-free.app/send";

    async function loadMessages() {
      try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        const chatBox = document.getElementById("chat-box");
        chatBox.innerHTML = "";
        data.forEach((msg) => {
          const el = document.createElement("div");
          el.className = "message";
          el.textContent = `[${msg.timestamp}] ${msg.sender}: ${msg.message}`;
          chatBox.appendChild(el);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (err) {
        document.getElementById("chat-box").innerHTML = `<div class="error">❌ 메시지를 불러올 수 없습니다</div>`;
      }
    }

    async function sendMessage() {
      const sender = document.getElementById("sender").value.trim();
      const message = document.getElementById("message").value.trim();
      const timestamp = new Date().toLocaleTimeString();

      if (!sender || !message) return alert("이름과 메시지를 모두 입력해주세요");

      try {
        await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sender, message, timestamp }),
        });
        document.getElementById("message").value = "";
        loadMessages();
      } catch (err) {
        alert("⚠️ 메시지 전송 실패! 백엔드 서버를 확인하세요.");
      }
    }

    window.onload = loadMessages;
    setInterval(loadMessages, 5000);
  </script>
</body>
</html>
