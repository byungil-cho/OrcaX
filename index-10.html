
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🐋 OrcaX 실시간 채팅</title>
</head>
<body>
  <div class="chat-container">
    <h1>🐋 OrcaX 실시간 채팅</h1>
    <input type="text" id="sender" placeholder="닉네임을 입력하세요" disabled />
    <textarea id="message" placeholder="메시지를 입력하세요"></textarea>
    <button onclick="sendMessage()">전송하기</button>
    <div id="chat-log"></div>
  </div>

  <script>
    const apiUrl = "http://localhost:3050/api/messages";
    let currentNickname = "";

    window.onload = () => {
      const saved = localStorage.getItem('nickname');
      if (!saved) {
        alert("로그인 후 이용가능합니다.");
        return;
      }
      document.getElementById('sender').value = saved;
      currentNickname = saved;
      loadMessages();
      setInterval(loadMessages, 5000);
    };

    function sendMessage() {
      const sender = document.getElementById("sender").value.trim();
      const message = document.getElementById("message").value.trim();
      if (!sender || !message) {
        alert("닉네임과 메시지를 입력하세요!");
        return;
      }

      fetch(apiUrl, {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender, message })
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById("message").value = '';
        loadMessages();
      })
      .catch(err => {
        alert("⚠️ 메시지 전송 실패!");
        console.error("전송 에러:", err);
      });
    }

    function loadMessages() {
      fetch(apiUrl)
        .then(res => res.json())
        .then(messages => {
          const log = document.getElementById("chat-log");
          log.innerHTML = messages.map(msg =>
            `<div class="message${msg.sender === currentNickname ? ' self' : ''}">
              <strong>[${msg.sender}]</strong> ${msg.message}
            </div>`
          ).join('');
        })
        .catch(err => console.error("메시지 로딩 실패:", err));
    }
  </script>
</body>
</html>
