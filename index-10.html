<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 실시간 채팅 (조용한 버전)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body { background:#e7f3fb; font-family:'Pretendard','Noto Sans KR',sans-serif; }
    .chat-wrap { max-width:520px; margin:28px auto; background:#fff; border-radius:20px; box-shadow:0 6px 36px #bae2ff2b; padding:24px; }
    .status { padding:8px 10px; border-radius:8px; margin-bottom:10px; font-size:.95rem }
    .ok{background:#e2ffe6;color:#116622;border:1px solid #b3f0b9}
    .bad{background:#ffe2e2;color:#7a1010;border:1px solid #f0b3b3}
    .warn{background:#fff7e2;color:#7a5a10;border:1px solid #f0e0b3}
    .profile-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#e6f7ff; padding:10px 12px; border-radius:10px; border:1.5px solid #d2edff; margin:10px 0 14px }
    .nickname { color:#2186d6; font-weight:800; margin-right:8px }
    .me-badge { background:#2ad984; color:#fff; border-radius:6px; padding:2px 6px; font-size:.82rem; margin-left:6px }
    .asset { color:#236b2c; background:#fff; border-radius:5px; padding:3px 7px; min-width:36px; text-align:center; border:1px solid #dfeee3 }
    .chat-title { text-align:center; font-size:1.9rem; font-weight:800; color:#23395d; margin:6px 0 8px }
    .notice { background:#eaf3ff; border-radius:9px; text-align:center; padding:10px 8px; margin-bottom:10px; font-weight:700; color:#1a61bc; font-size:1.02rem;}
    .joiners { background:#f3f6fa; padding:8px 10px; border-radius:7px; margin:8px 0; color:#45749d; font-size:.98rem }
    .joiners .pill { display:inline-block; background:#e7eef9; border:1px solid #cfe0ff; padding:3px 8px; border-radius:999px; margin:3px 4px 0 0 }
    .joiners .me { background:#d6ffea; border-color:#b6f7d7; font-weight:700; }
    #msgInput { width:100%; min-height:70px; padding:10px 8px; border-radius:7px; border:1.5px solid #d0e4fa; margin:10px 0; font-size:1.04rem; resize:vertical }
    .btn { width:100%; padding:11px; border:none; border-radius:9px; font-weight:800; cursor:pointer; margin:6px 0; opacity:1 }
    .btn[disabled] { opacity:.5; cursor:not-allowed }
    .btn-send { background:linear-gradient(90deg,#11c9da 0%,#2ad984 100%); color:#fff; }
    .btn-del  { background:linear-gradient(90deg,#fa4848 0%,#d067a2 100%); color:#fff; font-size:.98rem }
    .chat-msgs { margin:8px 0 6px; max-height:320px; overflow-y:auto; border:1px dashed #e1ecff; border-radius:8px; padding:8px }
    .msg { background:#f8ffe9; border-radius:7px; padding:8px 10px; margin-bottom:5px; font-size:1.02rem; color:#164300; border:1px solid #dcf9d9;}
    .nick { color:#0a5cb3; font-weight:800; margin-right:6px }
    .foot { display:flex; gap:8px; align-items:center; justify-content:space-between; margin-top:10px }
    .auto { font-size:.92rem; color:#1971e6; user-select:none }
    .exit { padding:10px 12px; background:#cfd8fd; color:#173f79; border-radius:8px; border:none; font-weight:800; font-size:1.03rem; cursor:pointer }
    .dbg { display:none !important; } /* 조용모드: 디버그 숨김 */
    .mini { font-size:.88rem; color:#6a7a90; margin-top:6px; }
  </style>
</head>
<body>
<div class="chat-wrap">
  <div id="serverStatus" class="status warn">서버 상태 확인중...</div>
  <div id="assetStatus" class="status warn" style="display:none"></div>
  <div id="chatStatus" class="status warn" style="display:none"></div>

  <div id="profileBar" class="profile-bar">자산 정보 로딩중...</div>

  <div class="chat-title">⚡️ OrcaX 실시간 채팅</div>
  <div class="notice">발자국! 찍고 가세요 😊 한마디 남기면 모두가 즐겁습니다!</div>
  <div id="joiners" class="joiners">참여자 로딩중...</div>

  <textarea id="msgInput" placeholder="메시지를 입력하세요"></textarea>
  <button class="btn btn-send" id="sendBtn" disabled>전송하기</button>
  <button class="btn btn-del" id="clearBtn" disabled>전체 메시지 삭제</button>

  <div id="chatMsgs" class="chat-msgs"></div>

  <div class="foot">
    <span class="auto">📌 자동 새로고침: <span id="scrollState">대기</span></span>
    <button class="exit" onclick="window.location.href='/OrcaX/index.html'">&larr; 대화방 나가기</button>
  </div>

  <div id="debug" class="dbg"></div>
  <div class="mini" id="hint">※ 서버 API가 준비되면 자동으로 연결됩니다.</div>
</div>

<script>
/** ========= CONFIG ========= **/
const BASE = "https://orcax-franchise-backend.onrender.com"; // 호스트만
const AUTH_TOKEN = localStorage.getItem('authToken') || "";
const kakaoId  = localStorage.getItem('kakaoId');
const nickname = localStorage.getItem('nickname');
if (!kakaoId || !nickname) {
  alert('카카오 로그인 필요!');
  location.href = "/OrcaX/index9.html";
  throw new Error('로그인 안됨');
}

/** ========= PATH HELPER ========= **/
const bases = [ `${BASE}/api/apply`, `${BASE}/api`, `${BASE}` ];
const paths = rel => bases.map(b => `${b}/${rel.replace(/^\/+/,'')}`);

/** ========= UTIL ========= **/
const $ = id => document.getElementById(id);
const show = (id, on=true)=>{ $(id).style.display = on ? '' : 'none'; }
function setStatus(id, type, msg){ const n=$(id); n.className=`status ${type}`; n.textContent=msg; show(id,true); }
// 조용모드: 디버그는 콘솔에만
function logDebug(title, payload){ console.debug('[DEBUG]', title, payload); }

async function fetchJSON(urls, opt={}) {
  const list = Array.isArray(urls) ? urls : [urls];
  let last=null;
  for (const u of list){
    try{
      const res = await fetch(u, {
        method: opt.method || 'GET',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          ...(AUTH_TOKEN ? {'Authorization':`Bearer ${AUTH_TOKEN}`} : {}),
          ...(opt.headers || {})
        },
        body: opt.body ? JSON.stringify(opt.body) : null,
        credentials: 'include',
        mode: 'cors'
      });
      const ct = res.headers.get('content-type') || '';
      const isJSON = ct.includes('application/json');
      const raw = await res.text();
      let data=null; if (isJSON) { try{ data = raw ? JSON.parse(raw) : {}; }catch(e){} }
      if (!res.ok || !isJSON) { last = {url:u,status:res.status,ct,preview:raw.slice(0,200)}; logDebug('응답 오류/비JSON', last); continue; }
      return { ok:true, url:u, data };
    } catch(e){ last = { url:u, error:String(e) }; logDebug('네트워크 예외', last); }
  }
  return { ok:false, error:last };
}

/** ========= 서버 상태 ========= **/
(async()=>{
  const r = await fetchJSON(paths('status'));
  if (r.ok && r.data?.status==='OK') setStatus('serverStatus','ok','✅ 서버 연결 정상');
  else setStatus('serverStatus','bad','❌ 서버 연결 실패');
})();

/** ========= 가드: API 존재 여부 프로브 ========= **/
const ready = { me:false, chat:false, presence:false };
async function probe(){
  const meBody = { kakaoId, nickname, id:kakaoId, userId:kakaoId };
  const me = await fetchJSON([ ...paths('me'), ...paths('user/me'), ...paths('profile') ], {method:'POST', body:meBody});
  ready.me = me.ok;

  const chat = await fetchJSON([ ...paths('chat'), ...paths('chat/list') ]);
  ready.chat = chat.ok;

  const pres = await fetchJSON([ ...paths('presence/list'), ...paths('chat/joiners') ]);
  ready.presence = pres.ok;

  return ready;
}

/** ========= 자산/프로필 ========= **/
async function loadProfile(){
  const body = { kakaoId, nickname, id:kakaoId, userId:kakaoId };
  let r = await fetchJSON([ ...paths('me'), ...paths('user/me'), ...paths('profile') ], {method:'POST', body});
  if (!r.ok){
    const q = `?kakaoId=${encodeURIComponent(kakaoId)}&nickname=${encodeURIComponent(nickname)}&id=${encodeURIComponent(kakaoId)}&userId=${encodeURIComponent(kakaoId)}`;
    r = await fetchJSON([ ...paths(`me${q}`), ...paths(`user/me${q}`), ...paths(`profile${q}`) ]);
  }
  if (!r.ok){ setStatus('assetStatus','bad','❌ 자산 API 미구현'); return; }
  const u = r.data || {};
  $('profileBar').innerHTML = `
    <span class="nickname">${u.nickname ?? nickname}</span>
    <span class="me-badge">내 계정</span>
    <span class="asset">💧${u.water ?? 0}</span>
    <span class="asset">🌱${u.fertilizer ?? 0}</span>
    <span class="asset">🪙${u.token ?? 0}</span>
    <span class="asset">🥔${u.potato ?? 0}</span>
    <span class="asset">🌾${u.barley ?? 0}</span>
    <span class="asset">🥔🌱${u.seedPotato ?? 0}</span>
    <span class="asset">🌾🌱${u.seedBarley ?? 0}</span>
  `;
  setStatus('assetStatus','ok','✅ 자산 로드 완료');
}

/** ========= Presence ========= **/
async function registerJoin(){
  const body = { kakaoId, nickname };
  const r = await fetchJSON([ ...paths('presence/join'), ...paths('chat/join') ], { method:'POST', body });
  if (!r.ok) logDebug('JOIN 실패', r.error);
}
async function registerLeave(){
  const body = { kakaoId, nickname };
  let r = await fetchJSON(paths('presence/leave'), { method:'DELETE', body });
  if (!r.ok) r = await fetchJSON(paths('chat/leave'), { method:'POST', body });
}
async function loadJoiners(){
  const r = await fetchJSON([ ...paths('presence/list'), ...paths('chat/joiners') ]);
  if (!r.ok){ $('joiners').textContent='참여자 API 미구현'; return; }
  const arr = r.data?.joiners || r.data || [];
  $('joiners').innerHTML = (arr.length? arr:[]).map(n=>{
    const isMe = (n===nickname);
    return `<span class="pill ${isMe?'me':''}">${isMe?'나 · ':''}${n}</span>`;
  }).join('') || '현재 접속자 없음';
}

/** ========= 채팅 ========= **/
async function loadMessages(){
  const r = await fetchJSON([ ...paths('chat'), ...paths('chat/list') ]);
  if (!r.ok){ setStatus('chatStatus','bad','❌ 채팅 API 미구현'); return; }

  const arr = Array.isArray(r.data) ? r.data
            : Array.isArray(r.data?.items) ? r.data.items
            : null;

  if (!arr){ setStatus('chatStatus','bad','⚠️ 채팅 응답 형식 오류'); return; }

  setStatus('chatStatus','ok','✅ 채팅 연결 OK');
  const box = $('chatMsgs'); box.innerHTML='';
  arr.forEach(m=>{
    const isMe = (m.nickname===nickname);
    const d = document.createElement('div');
    d.className='msg';
    d.textContent = `${isMe?'나':(m.nickname||'익명')}  ${m.message||''}`;
    box.appendChild(d);
  });
  box.scrollTop = box.scrollHeight;
}

$('sendBtn').addEventListener('click', async ()=>{
  const message = $('msgInput').value.trim();
  if (!message) return;
  const payload = { kakaoId, nickname, message };
  const r = await fetchJSON([ ...paths('chat'), ...paths('chat/send') ], { method:'POST', body:payload });
  if (!r.ok){ setStatus('chatStatus','bad','❌ 전송 실패 (API 미구현)'); return; }
  $('msgInput').value = '';
  await loadMessages();
});

$('clearBtn').addEventListener('click', async ()=>{
  if (!confirm('전체 메시지를 삭제하시겠습니까?')) return;
  let r = await fetchJSON(paths('chat/clear'), { method:'DELETE' });
  if (!r.ok) r = await fetchJSON(paths('chat/clear'), { method:'POST' });
  if (!r.ok){ setStatus('chatStatus','bad','❌ 삭제 실패 (API 미구현)'); return; }
  await loadMessages();
});

window.addEventListener('beforeunload', registerLeave);
window.addEventListener('pagehide', registerLeave);

/** ========= 초기화 (조용모드) ========= **/
(async function init(){
  // 서버 상태만 먼저
  const status = await fetchJSON(paths('status'));
  if (!(status.ok && status.data?.status==='OK')) return;

  // API 존재여부 점검
  const r = await probe();

  // 자산
  if (r.me) await loadProfile();
  else setStatus('assetStatus','bad','❌ 자산 API 미구현');

  // Presence
  if (r.presence){
    await registerJoin();
    await loadJoiners();
    setInterval(loadJoiners, 5000); // 존재할 때만 폴링
  } else {
    $('joiners').textContent = '참여자 API 미구현';
  }

  // 채팅
  if (r.chat){
    await loadMessages();
    setInterval(loadMessages, 5000); // 존재할 때만 폴링
    $('sendBtn').disabled = false;
    $('clearBtn').disabled = false;
    $('scrollState').textContent = '켜짐';
  } else {
    $('sendBtn').disabled = true;
    $('clearBtn').disabled = true;
    $('scrollState').textContent = '대기';
    setStatus('chatStatus','bad','❌ 채팅 API 미구현');
  }
})();
</script>
</body>
</html>
