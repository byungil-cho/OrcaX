<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 실시간 채팅</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body { background: #e7f3fb; font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
    .chat-wrap { max-width: 480px; margin: 40px auto 0; background: #fff; border-radius: 20px; box-shadow: 0 6px 36px #bae2ff2b; padding: 30px 22px 22px 22px; }
    .status-bar { padding: 6px 10px; font-size: 0.95rem; border-radius: 7px; margin-bottom: 10px; }
    .status-ok { background: #e2ffe6; color: #116622; border: 1px solid #b3f0b9; }
    .status-fail { background: #ffe2e2; color: #991111; border: 1px solid #f0b3b3; }
    .profile-bar { display: flex; gap: 13px; align-items: center; justify-content: flex-start; background: #e6f7ff; padding: 10px 13px; border-radius: 10px; font-size: 1.1em; font-weight: bold; margin-bottom: 15px; border: 1.5px solid #d2edff; }
    .nickname { color: #2186d6; margin-right: 16px; font-size: 1.16em; }
    .asset { color: #236b2c; background:#fff; border-radius:5px; padding:3px 7px; margin-right:4px; min-width:36px; text-align:center; }
    .chat-title { text-align: center; font-size: 2.1rem; font-weight: bold; color: #23395d; margin-bottom: 8px; }
    .notice { background: #eaf3ff; border-radius: 9px; text-align: center; padding: 10px 0 7px 0; margin-bottom: 13px; font-weight: 700; color: #1a61bc; font-size: 1.08rem;}
    .joiners { background: #f3f6fa; padding: 5px 0 5px 7px; border-radius: 7px; margin-bottom: 9px; color: #45749d; font-size: 1.01rem; }
    #msgInput { width: 100%; min-height: 70px; padding: 10px 8px; border-radius: 7px; border: 1.5px solid #d0e4fa; margin-bottom: 12px; font-size: 1.04rem; resize: vertical; }
    .btn-main, .btn-delete { width: 100%; padding: 12px; border: none; font-size: 1.2rem; border-radius: 9px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .btn-main { background: linear-gradient(90deg, #11c9da 0%, #2ad984 100%); color: #fff;}
    .btn-main:hover { filter: brightness(0.98);}
    .btn-delete { background: linear-gradient(90deg, #fa4848 0%, #d067a2 100%); color: #fff; font-size: 1.05rem;}
    .chat-msgs { margin: 10px 0 13px 0; min-height: 40px; padding: 0 2px; max-height: 300px; overflow-y: auto; }
    .msg-box { background: #f8ffe9; border-radius: 7px; padding: 9px 12px 9px 13px; margin-bottom: 5px; font-size: 1.05rem; color: #164300; border: 1px solid #dcf9d9;}
    .msg-nick { color: #0a5cb3; font-weight: bold; margin-right: 5px; }
    .btn-exit { width: 100%; padding: 11px 0; background: #cfd8fd; color: #173f79; border-radius: 8px; border: none; font-weight: bold; font-size: 1.15rem; margin-top: 12px; cursor: pointer;}
    .btn-exit:hover { background: #bacaf9; }
    .auto-scroll { float: right; font-size: 0.96rem; color: #1971e6; margin-top: 1px; user-select: none;}
  </style>
</head>
<body>
  <div class="chat-wrap">
    <div id="serverStatus" class="status-bar">서버 상태 확인중...</div>
    <div id="profileBar" class="profile-bar">자산 정보 로딩중...</div>
    <div class="chat-title">⚡️ OrcaX 실시간 채팅</div>
    <div class="notice"><span>발자꾹! 찍고 가세요 😊 한마디 남기면 모두가 즐겁습니다!</span></div>
    <div id="joiners" class="joiners"></div>
    <textarea id="msgInput" placeholder="메시지를 입력하세요"></textarea>
    <button class="btn-main" id="sendBtn">전송하기</button>
    <button class="btn-delete" id="clearBtn">전체 메시지 삭제</button>
    <div class="chat-msgs" id="chatMsgs"></div>
    <span class="auto-scroll">📌 자동 스크롤: <span id="scrollState">켜짐</span></span>
    <button class="btn-exit" onclick="window.location.href='/OrcaX/index.html'">&larr; 대화방 나가기</button>
  </div>
<script>
  const API_URL = "https://orcax-franchise-backend.onrender.com";

  // 로그인 확인
  let kakaoId = localStorage.getItem('kakaoId');
  let nickname = localStorage.getItem('nickname');
  if (!kakaoId || !nickname) {
    alert('카카오 로그인 필요!');
    window.location.href = "/OrcaX/index9.html";
    throw new Error('로그인 안됨');
  }

  // 서버 상태 체크
  fetch(`${API_URL}/api/status`)
    .then(res => res.json())
    .then(data => {
      if (data.status === "OK") {
        document.getElementById('serverStatus').textContent = "✅ 서버 연결 정상";
        document.getElementById('serverStatus').className = "status-bar status-ok";
      } else {
        document.getElementById('serverStatus').textContent = "⚠️ 서버 연결 불안정";
        document.getElementById('serverStatus').className = "status-bar status-fail";
      }
    })
    .catch(() => {
      document.getElementById('serverStatus').textContent = "❌ 서버 연결 실패";
      document.getElementById('serverStatus').className = "status-bar status-fail";
    });

  // 자산 정보 로드
  fetch(`${API_URL}/api/me`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kakaoId, nickname })
  })
  .then(res => res.json())
  .then(user => {
    document.getElementById('profileBar').innerHTML = `
      <span class="nickname">${user.nickname}</span>
      <span class="asset">💧${user.water ?? 0}</span>
      <span class="asset">🌱${user.fertilizer ?? 0}</span>
      <span class="asset">🪙${user.token ?? 0}</span>
      <span class="asset">🥔${user.potato ?? 0}</span>
      <span class="asset">🌾${user.barley ?? 0}</span>
      <span class="asset">🥔🌱${user.seedPotato ?? 0}</span>
      <span class="asset">🌾🌱${user.seedBarley ?? 0}</span>
    `;
  })
  .catch(err => {
    document.getElementById('profileBar').innerHTML = "자산 정보를 불러올 수 없습니다.";
  });

  // 채팅 불러오기
  function loadMessages() {
    fetch(`${API_URL}/api/chat`)
      .then(res => res.json())
      .then(data => {
        const chatBox = document.getElementById('chatMsgs');
        chatBox.innerHTML = "";
        data.forEach(msg => {
          const div = document.createElement('div');
          div.className = 'msg-box';
          div.innerHTML = `<span class="msg-nick">${msg.nickname}</span>${msg.message}`;
          chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      });
  }

  // 메시지 전송
  document.getElementById('sendBtn').addEventListener('click', () => {
    const message = document.getElementById('msgInput').value.trim();
    if (!message) return;
    fetch(`${API_URL}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kakaoId, nickname, message })
    }).then(() => {
      document.getElementById('msgInput').value = "";
      loadMessages();
    });
  });

  // 전체 메시지 삭제
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm("전체 메시지를 삭제하시겠습니까?")) return;
    fetch(`${API_URL}/api/chat/clear`, { method: 'DELETE' })
      .then(() => loadMessages());
  });

  // 참여자 표시
  function loadJoiners() {
    fetch(`${API_URL}/api/chat/joiners`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('joiners').textContent = "참여자: " + data.join(', ');
      });
  }

  setInterval(() => {
    loadMessages();
    loadJoiners();
  }, 3000);

  loadMessages();
  loadJoiners();
</script>
</body>
</html>
