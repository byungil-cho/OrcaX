<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 1em; background: #f0f0f0; }
    h1 { text-align: center; }
    #messages { border: 1px solid #ccc; padding: 1em; height: 300px; overflow-y: scroll; background: #fff; }
    .message { margin-bottom: 0.5em; }
    #controls { display: flex; gap: 0.5em; margin-top: 1em; }
    input, button { padding: 0.5em; font-size: 1em; }
    #nickname { width: 40%; }
    #messageInput { flex: 1; }
  </style>
</head>
<body>
  <h1>🐳 OrcaX Chat Widget</h1>

  <div id="messages"></div>

  <div id="controls">
    <input id="nickname" placeholder="닉네임 입력" />
    <input id="messageInput" placeholder="메시지 입력" />
    <button id="sendButton">전송</button>
  </div>

  <script>
    const apiUrl = "https://mature-asp-perfect.ngrok-free.app/send";

    const messagesDiv = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");
    const messageInput = document.getElementById("messageInput");
    const nicknameInput = document.getElementById("nickname");

    async function loadMessages() {
      try {
        const res = await fetch(apiUrl);
        const messages = await res.json();
        messagesDiv.innerHTML = "";
        messages.forEach((msg) => {
          const div = document.createElement("div");
          div.classList.add("message");
          div.textContent = `[${msg.timestamp}] ${msg.sender}: ${msg.message}`;
          messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      } catch (err) {
        messagesDiv.innerHTML = "<p>❌ 메시지를 불러올 수 없습니다</p>";
      }
    }

    sendButton.addEventListener("click", async () => {
      const sender = nicknameInput.value || localStorage.getItem("nickname") || "익명";
      const message = messageInput.value.trim();

      if (!message) return alert("메시지를 입력하세요!");
      if (!nicknameInput.value) alert("닉네임은 로컬 저장된 값으로 사용됩니다.");

      localStorage.setItem("nickname", sender);

      try {
        const res = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sender, message, timestamp: new Date().toISOString() }),
        });

        if (res.ok) {
          messageInput.value = "";
          await loadMessages();
        } else {
          alert("⚠️ 메시지 전송 실패! 백엔드 상태를 확인하세요.");
        }
      } catch (err) {
        alert("❌ 전송 오류: 서버 연결이 안 됐을 수 있습니다.");
      }
    });

    window.onload = loadMessages;
  </script>
</body>
</html>
