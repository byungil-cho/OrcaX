<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 실시간 채팅</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      background: #e7f3fb;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    }
    .chat-wrap {
      max-width: 450px;
      margin: 40px auto 0;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 36px rgba(0,0,0,0.07);
      padding: 32px 32px 24px 32px;
    }
    .chat-title {
      text-align: center;
      font-size: 2.1rem;
      margin-bottom: 10px;
      font-weight: bold;
      color: #23395d;
      letter-spacing: 1px;
    }
    .status-bar {
      margin: 0 auto 15px auto;
      text-align: center;
      padding: 6px 0;
      border-radius: 7px;
      font-weight: 600;
      font-size: 1.1rem;
      background: #f5fcf8;
      border: 1.5px solid #e2ebe6;
      color: #21b573;
    }
    .notice {
      background: #eaf3ff;
      border-radius: 9px;
      text-align: center;
      padding: 10px 0 7px 0;
      margin-bottom: 13px;
      font-weight: 700;
      color: #1a61bc;
      font-size: 1.08rem;
      letter-spacing: 1.2px;
    }
    .joiners {
      background: #f3f6fa;
      padding: 5px 0 5px 7px;
      border-radius: 7px;
      margin-bottom: 9px;
      color: #45749d;
      font-size: 1.01rem;
    }
    .joiners .me {
      color: #0d6d17; font-weight: bold;
    }
    .input-label {
      display: block;
      margin-bottom: 2px;
      font-size: 0.98rem;
      color: #314564;
      font-weight: 600;
    }
    #nicknameInput[readonly] {
      background: #f6f6f6;
      color: #297000;
      font-weight: bold;
      border: 1px solid #b5cfbc;
    }
    #nicknameInput {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 7px;
      border: 1.5px solid #dde5ef;
      font-size: 1.07rem;
      outline: none;
    }
    #msgInput {
      width: 100%;
      min-height: 70px;
      padding: 10px 8px;
      border-radius: 7px;
      border: 1.5px solid #d0e4fa;
      margin-bottom: 12px;
      font-size: 1.04rem;
      resize: vertical;
    }
    .btn-main, .btn-delete {
      width: 100%;
      padding: 12px;
      border: none;
      font-size: 1.25rem;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      transition: box-shadow 0.15s;
    }
    .btn-main {
      background: linear-gradient(90deg, #11c9da 0%, #2ad984 100%);
      color: #fff;
      box-shadow: 0 2px 8px #0001;
    }
    .btn-main:hover { filter: brightness(0.98); }
    .btn-delete {
      background: linear-gradient(90deg, #fa4848 0%, #d067a2 100%);
      color: #fff;
      font-size: 1.06rem;
      margin-bottom: 13px;
    }
    .chat-msgs {
      margin: 10px 0 13px 0;
      min-height: 40px;
      padding: 0 2px;
    }
    .msg-box {
      background: #f8ffe9;
      border-radius: 7px;
      padding: 9px 12px 9px 13px;
      margin-bottom: 5px;
      font-size: 1.05rem;
      color: #164300;
      border: 1px solid #dcf9d9;
    }
    .msg-nick {
      color: #0a5cb3;
      font-weight: bold;
      margin-right: 5px;
    }
    .btn-exit {
      width: 100%;
      padding: 11px 0;
      background: #cfd8fd;
      color: #173f79;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 1.15rem;
      margin-top: 15px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn-exit:hover { background: #bacaf9; }
    .auto-scroll {
      float: right;
      font-size: 0.96rem;
      color: #1971e6;
      margin-top: 1px;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="chat-wrap">
    <div class="chat-title">⚡️ OrcaX 실시간 채팅</div>
    <div id="statusBar" class="status-bar">• 서버 접속 정상</div>
    <div class="notice">
      <span>발자꾹! 찍고 가세요 😊 한마디 남기면 모두가 즐겁습니다!</span>
    </div>
    <div id="joiners" class="joiners"></div>
    <label for="nicknameInput" class="input-label">닉네임</label>
    <input id="nicknameInput" type="text" readonly />
    <textarea id="msgInput" placeholder="메시지를 입력하세요"></textarea>
    <button class="btn-main" id="sendBtn">전송하기</button>
    <button class="btn-delete" id="clearBtn">전체 메시지 삭제</button>
    <div class="chat-msgs" id="chatMsgs"></div>
    <span class="auto-scroll">📌 자동 스크롤: <span id="scrollState">켜짐</span></span>
    <button class="btn-exit" onclick="window.location.href='/OrcaX/index.html'">&larr; 대화방 나가기</button>
  </div>
  <script>
    // 1. 닉네임 로컬스토리지 체크
    document.addEventListener('DOMContentLoaded', function() {
      const nickname = localStorage.getItem('kakaoNickname');
      if (!nickname) {
        alert('로그인이 필요합니다. 먼저 로그인해 주세요!');
        window.location.href = "/OrcaX/index9.html";
        return;
      }
      document.getElementById('nicknameInput').value = nickname;
      updateJoiners([nickname]); // 기본 내 닉네임만 입장자로 표시
      getMessages();
      checkServer();
    });

    // 2. 서버상태 체크 (간단 ping)
    function checkServer() {
      fetch("https://orcax-franchise-backend.onrender.com/api/messages/status")
        .then(res => res.json())
        .then(data => {
          if(data && data.status === "OK") {
            document.getElementById('statusBar').innerHTML = '• 서버 접속 정상';
            document.getElementById('statusBar').style.color = "#21b573";
          } else {
            document.getElementById('statusBar').innerHTML = '• 서버 접속 불가 (오프라인)';
            document.getElementById('statusBar').style.color = "#d42d2d";
          }
        }).catch(e => {
          document.getElementById('statusBar').innerHTML = '• 서버 접속 불가 (오프라인)';
          document.getElementById('statusBar').style.color = "#d42d2d";
        });
    }

    // 3. 메시지 불러오기/입장자 표시
    function getMessages() {
      fetch('https://orcax-franchise-backend.onrender.com/api/messages')
        .then(r => r.json()).then(data => {
          let html = '';
          const joiners = new Set();
          data.forEach(msg => {
            html += `<div class="msg-box"><span class="msg-nick">[${msg.nickname}]</span>${msg.message}</div>`;
            joiners.add(msg.nickname);
          });
          document.getElementById('chatMsgs').innerHTML = html;
          updateJoiners(Array.from(joiners));
          scrollToEnd();
        });
    }
    function updateJoiners(list) {
      const mynick = localStorage.getItem('kakaoNickname');
      let jstr = '';
      if(list && list.length > 0) {
        jstr = list.map(nick =>
          `<span class="${nick === mynick ? 'me' : ''}">${nick === mynick ? '대화방 입장자: ' : ''}${nick}</span>`
        ).join(', ');
      } else {
        jstr = "입장한 사용자가 없습니다.";
      }
      document.getElementById('joiners').innerHTML = jstr;
    }
    // 4. 메시지 전송
    document.getElementById('sendBtn').onclick = function() {
      const nickname = localStorage.getItem('kakaoNickname');
      const msg = document.getElementById('msgInput').value.trim();
      if (!msg) return;
      fetch('https://orcax-franchise-backend.onrender.com/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname, message: msg })
      }).then(() => {
        document.getElementById('msgInput').value = '';
        getMessages();
      });
    };
    // 5. 전체 메시지 삭제
    document.getElementById('clearBtn').onclick = function() {
      if (!confirm('정말 모든 메시지를 삭제할까요?')) return;
      fetch('https://orcax-franchise-backend.onrender.com/api/messages', {
        method: 'DELETE'
      }).then(getMessages);
    };
    // 6. 자동 스크롤
    function scrollToEnd() {
      document.getElementById('chatMsgs').scrollTop = 99999;
    }
    // 자동 새로고침(신규 메시지 polling, 실제 소켓쓰면 필요없음)
    setInterval(getMessages, 2500);
  </script>
</body>
</html>
