<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보리 제품 저장소</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fafafa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      text-align: center;
    }
    h1 {
      margin-top: 2rem;
      color: #4caf50;
    }
    .container {
      max-width: 600px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .product-list {
      list-style: none;
      padding: 0;
    }
    .product-item {
      padding: 0.8rem;
      border-bottom: 1px solid #eee;
      font-size: 1.1rem;
    }
    .product-item:last-child {
      border-bottom: none;
    }
    .btn {
      margin-top: 1.5rem;
      padding: 0.6rem 1.5rem;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>📦 보리 제품 저장소</h1>
  <div class="container">
    <ul class="product-list" id="productList">
      <li>로딩 중...</li>
    </ul>
    <button class="btn" onclick="goBack()">🔙 가공공장으로</button>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");

    if (!nickname) {
      alert("닉네임 정보가 없습니다. 로그인 후 이용해주세요.");
      window.location.href = "orcax-farm_000.html";
    }

    fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/products/${nickname}`)
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("productList");
        list.innerHTML = "";
        if (data.success && data.products.length > 0) {
          data.products.forEach(p => {
            const li = document.createElement("li");
            li.className = "product-item";
            li.textContent = `🛠️ ${p.product} × ${p.amount}`;
            list.appendChild(li);
          });
        } else {
          list.innerHTML = "<li>보관된 제품이 없습니다.</li>";
        }
      })
      .catch(err => {
        document.getElementById("productList").innerHTML = "<li>서버 오류로 불러올 수 없습니다.</li>";
        console.error(err);
      });

    function goBack() {
      window.location.href = "bori-factory.html";
    }
  </script>
</body>
</html>
