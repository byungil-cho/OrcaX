<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🌰 OrcaX 룰렛</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0A0A1A;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-top: 20px;
      color: #00cfff;
    }
    #pointer {
      width: 0;
      height: 0;
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-right: 30px solid red;
      position: absolute;
      left: -30px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
    }
    #wheel-container {
      margin: 40px auto;
      width: 300px;
      height: 300px;
      position: relative;
    }
    #wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid gold;
      background-image: url('roulette_img.png');
      background-size: 150%;
      background-position: center 43%;
      background-repeat: no-repeat;
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(0deg);
      transition: transform 5s ease-out;
    }
    .orca {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 80px;
      height: 80px;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
    .button-container {
      margin-top: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 10px 0;
    }
    #spinBtn {
      background-color: #00cfff;
      color: #000;
    }
    #spinBtn:disabled {
      background-color: gray;
      color: #ccc;
    }
    #result {
      font-size: 1.2rem;
      color: #ffe680;
      margin-top: 10px;
    }
    #totalScore {
      margin-top: 10px;
      font-size: 1.2rem;
      color: #00ffcc;
    }
    .home-btn {
      background-color: #00d5ff;
      color: black;
    }
  </style>
</head>
<body>
  <h1>🌰 <span style="color:white">Orca</span><span style="color:#00cfff">X</span> <span style="color:white">룰렛</span></h1>
  <div id="wheel-container">
    <div id="pointer"></div>
    <div id="wheel"></div>
    <img class="orca" src="logo_80_80.jpg" alt="고래">
  </div>
  <div class="button-container">
    <button id="spinBtn" onclick="spin()">돌리기 (<span id='leftCount'></span>/5)</button>
    <div id="result"></div>
    <div id="totalScore">💰 누적 점수: <strong>0</strong> ORCX</div>
    <button class="home-btn" onclick="location.href='index.html'">← 첫초로 돌아가기</button>
  </div>

  <script>
    const spinBtn = document.getElementById('spinBtn');
    const resultDiv = document.getElementById('result');
    const totalScoreDiv = document.getElementById('totalScore');
    const leftCount = document.getElementById('leftCount');
    const wheel = document.getElementById('wheel');

    const totalKey = 'orcax_totalScore';
    const maxSpinsPerBlock = 5;

    const rewards = [
      '10 ORCX', '꺷', '30 ORCX', '꺷',
      '50 ORCX', '꺷', '100 ORCX', '500 ORCX', '1000 ORCX'
    ];

    function getTotalScore() {
      return parseInt(localStorage.getItem(totalKey) || '0');
    }

    function setTotalScore(value) {
      localStorage.setItem(totalKey, value);
    }

    function updateTotalScoreUI() {
      totalScoreDiv.innerHTML = `💰 누적 점수: <strong>${getTotalScore()}</strong> ORCX`;
    }

    function weightedRandomReward() {
      const pool = [
        ...Array(30).fill('10 ORCX'),
        ...Array(10).fill('30 ORCX'),
        ...Array(5).fill('50 ORCX'),
        ...Array(3).fill('100 ORCX'),
        ...Array(1).fill('500 ORCX'),
        ...Array(1).fill('1000 ORCX'),
        ...Array(20).fill('꺷')
      ];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function spin() {
      const reward = weightedRandomReward();
      const index = rewards.indexOf(reward);
      const degrees = 360 * 5 + (360 / rewards.length) * index + Math.random() * (360 / rewards.length);

      wheel.style.transition = 'transform 5s ease-out';
      wheel.style.transform = `rotate(${degrees}deg)`;

      spinBtn.disabled = true; // 일단 돌리는 동안 중복 클릭 방지

      setTimeout(() => {
        resultDiv.innerHTML = `🎉 결과: <strong>${reward}</strong>!`;
        const match = reward.match(/(\d+)/);
        let score = match ? parseInt(match[1]) : 0;

        if (score > 0) {
          const total = getTotalScore() + score;
          setTotalScore(total);
          updateTotalScoreUI();
        }

        // 서버에 결과 저장
        fetch("https://orcax-roulette-backend.onrender.com/api/roulette/record", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user: localStorage.getItem("orcax_user") || "guest",
            reward: reward,
            score: score,
            timestamp: new Date().toISOString()
          })
        })
        .then(res => {
          if (!res.ok) {
            if (res.status === 429) {
              resultDiv.innerHTML = "⛔ 이번 시간대 룰렛 기회를 모두 소진했습니다.";
            }
            throw new Error("서버 에러");
          }
          return res.json();
        })
        .then(data => {
          console.log("✅ 서버 저장 성공:", data);
        })
        .catch(err => {
          console.error("❌ 서버 저장 실패:", err);
        });

        spinBtn.disabled = false;
      }, 5200);
    }

    updateTotalScoreUI();
  </script>
</body>
</html>
