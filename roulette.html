<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaX 룰렛</title>
  <style>
    body {
      background: #0f0f1c;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 20px;
    }
    .wheel {
      margin: 0 auto;
      width: 300px;
      height: 300px;
      border: 10px solid gold;
      border-radius: 50%;
      position: relative;
      background: #9223aa;
    }
    .arrow {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 30px solid red;
      margin: 10px auto;
    }
    button {
      background: #00cfff;
      color: black;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1.2em;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h1>🐻 Orca<span style="color:deepskyblue">X</span> 룰렛</h1>
  <div class="arrow"></div>
  <div class="wheel" id="wheel">
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Orca" style="width:80px;position:absolute;top:110px;left:110px;">
  </div>

  <button id="spinBtn">돌리기 (0/5)</button>

  <div class="result">
    <p id="result">🎉 결과: <strong>-- ORCX!</strong></p>
    <p id="score">💰 누적 점수: <strong>0 ORCX</strong></p>
    <a href="index.html" style="color:skyblue;display:inline-block;margin-top:10px;">← 첫초로 돌아가기</a>
  </div>

  <script>
    const spinBtn = document.getElementById("spinBtn");
    const resultEl = document.getElementById("result");
    const scoreEl = document.getElementById("score");
    const maxSpins = 5;
    let spinCount = 0;
    let totalScore = 0;

    const rewards = [10, 30, 50, 80, 100, 500, 1000, 0];

    function updateSpinButton() {
      spinBtn.textContent = `돌리기 (${spinCount}/${maxSpins})`;
    }

    function spinWheel() {
      if (spinCount >= maxSpins) return alert("오늘의 기회는 끝났어요!");
      const reward = rewards[Math.floor(Math.random() * rewards.length)];
      totalScore += reward;
      spinCount++;
      updateSpinButton();
      resultEl.innerHTML = `🎉 결과: <strong>${reward} ORCX!</strong>`;
      scoreEl.innerHTML = `💰 누적 점수: <strong>${totalScore} ORCX</strong>`;

      // 서버 기록 저장
      fetch("https://orcax-roulette-backend.onrender.com/api/roulette/record", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: "phantom123abc",
          reward: `${reward} ORCX`,
          score: totalScore,
          timestamp: new Date().toISOString(),
        })
      }).then(res => res.json()).then(data => console.log("✅ 서버 기록 완료", data));
    }

    spinBtn.addEventListener("click", spinWheel);
    updateSpinButton();
  </script>
</body>
</html>
