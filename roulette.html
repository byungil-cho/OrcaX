<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 룰렛</title>
  <style>
    body {
      background-color: #001f3f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: #00e0ff;
      font-size: 2.5rem;
    }
    #spin-count {
      font-size: 1.5rem;
      color: gold;
      margin-top: 1rem;
    }
    #result {
      font-size: 1.2rem;
      margin-top: 1rem;
      color: #ffcc00;
    }
    .wheel {
      width: 200px;
      height: 200px;
      border: 10px solid #00e0ff;
      border-radius: 50%;
      margin: 2rem auto;
      background: conic-gradient(gold, orange, red, pink, purple, blue, cyan, green, gold);
      transition: transform 3s ease-out;
    }
    button {
      padding: 12px 24px;
      margin-top: 1rem;
      font-size: 1.2rem;
      background-color: #00cc99;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #009f7a;
    }
    a.withdraw-link {
      display: inline-block;
      margin-top: 2rem;
      color: #00ccff;
      font-size: 1.1rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>🎡 OrcaX 룰렛</h1>
  <div id="spin-count">🎡 남은 스핀: 계산 중...</div>
  <div class="wheel" id="wheel"></div>
  <div id="loading" style="display: none; margin-top: 1rem; color: #00e0ff; font-size: 1.2rem;">⏳ 룰렛 돌리는 중...</div>
  <div id="result"></div>
  <button onclick="spinRoulette()">스핀!</button>
  <audio id="spin-sound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7a9dbb37a0.mp3?filename=spin-wheel-110411.mp3"></audio>

  <!-- 출금 링크 -->
  <div>
    <a href="/withdraw.html" target="_blank" class="withdraw-link">💸 출금 요청 페이지로 이동</a>
  </div>

  <script>
    const wallet = '0x123abc...'; // TODO: 실제 유저 지갑 주소로 대체

    const spinCountDisplay = document.getElementById('spin-count');
    const result = document.getElementById('result');
    const wheel = document.getElementById("wheel");
    const spinSound = document.getElementById("spin-sound");
    const loading = document.getElementById("loading");

    async function updateUserInfo() {
      try {
        const res = await fetch(`/api/get-score?wallet=${wallet}`);
        const data = await res.json();
        if (data.success) {
          spinCountDisplay.textContent = `🎡 남은 스핀: ${data.spins} | 점수: ${data.score}`;
        }
      } catch (e) {
        console.error('유저 정보 불러오기 실패', e);
      }
    }

    async function spinRoulette() {
      try {
        const res = await fetch('/api/spin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wallet })
        });

        const data = await res.json();

        if (!data.success) {
          alert(data.message || '스핀 실패');
          return;
        }

        spinSound.play();
        loading.style.display = "block";
        result.textContent = "";
        wheel.style.transform = `rotate(${Math.random() * 360 + 1080}deg)`;

        setTimeout(() => {
          loading.style.display = "none";
          result.textContent = "🎉 축하합니다! 보상을 받았습니다!";
          spinCountDisplay.textContent = `🎡 남은 스핀: ${data.spins} | 점수: ${data.totalScore}`;
        }, 3000);

      } catch (err) {
        console.error('[스핀 요청 실패]', err);
        alert('서버 오류');
      }
    }

    updateUserInfo();
  </script>
</body>
</html>
