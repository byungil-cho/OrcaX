<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 룰렛</title>
  <style>
    body {
      background: #0f0f1c;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 20px;
    }
    .wheel {
      margin: 0 auto;
      width: 300px;
      height: 300px;
      border: 10px solid gold;
      border-radius: 50%;
      position: relative;
      background: conic-gradient(#9b59b6 0% 12.5%, #e74c3c 12.5% 25%, #3498db 25% 37.5%, #2ecc71 37.5% 50%, #f1c40f 50% 62.5%, #e67e22 62.5% 75%, #1abc9c 75% 87.5%, #34495e 87.5% 100%);
      transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
    }
    .arrow {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 30px solid red;
      margin: 10px auto;
    }
    button {
      background: #00cfff;
      color: black;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1.2em;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h1>🌰 OrcaX 룰레트</h1>
  <div class="arrow"></div>
  <div class="wheel" id="wheel"></div>
  <button id="spinBtn">돌리기 (<span id="spin-count">0</span>/5)</button>
  <div class="result">
    🎉 결과: <span id="reward">--</span><br />
    💰 누적 점수: <span id="total">0</span> ORCX
  </div>

  <script>
    const wheel = document.getElementById("wheel");
    const spinBtn = document.getElementById("spinBtn");
    const rewardDisplay = document.getElementById("reward");
    const totalDisplay = document.getElementById("total");
    const countDisplay = document.getElementById("spin-count");

    let totalScore = 0;
    let spinsLeft = 5;
    let currentRotation = 0;
    const rewards = [10, 30, 50, 80, 100, 500, 1000, 0];
    const degreesPerSegment = 360 / rewards.length;

    function updateSpinButton() {
      countDisplay.textContent = spinsLeft;
    }

    function doSpin(auto = false) {
      if (!auto && spinsLeft <= 0) {
        alert("더 이상 돌릴 수 없어요!");
        return;
      }

      if (!auto) spinsLeft--;
      updateSpinButton();

      const randIndex = Math.floor(Math.random() * rewards.length);
      const reward = rewards[randIndex];
      const rotateDeg = 360 * 5 + randIndex * degreesPerSegment + degreesPerSegment / 2;

      currentRotation += rotateDeg;
      wheel.style.transform = `rotate(-${currentRotation}deg)`;

      setTimeout(() => {
        rewardDisplay.textContent = `${reward} ORCX!`;
        totalScore += reward;
        totalDisplay.textContent = totalScore;

        fetch("https://orcax-roulette-backend.onrender.com/api/roulette/record", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user: "phantom123abc",
            reward: `${reward} ORCX`,
            score: reward,
            timestamp: new Date().toISOString()
          })
        });

        if (auto) {
          setTimeout(() => {
            window.location.href = 'register.html';
          }, 2000);
        }
      }, 4200);
    }

    spinBtn.onclick = () => doSpin();

    window.addEventListener('load', () => {
      if (localStorage.getItem('puzzleClear') === 'true') {
        localStorage.removeItem('puzzleClear');
        setTimeout(() => doSpin(true), 500);
      }
    });

    updateSpinButton();
  </script>
</body>
</html>
