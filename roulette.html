<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 룰렛</title>
  <style>
    body {
      background-color: #001f3f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: #00e0ff;
      font-size: 2.5rem;
    }
    #spin-count {
      font-size: 1.5rem;
      color: gold;
      margin-top: 1rem;
    }
    #result {
      font-size: 1.2rem;
      margin-top: 1rem;
      color: #ffcc00;
    }
    .wheel {
      width: 200px;
      height: 200px;
      border: 10px solid #00e0ff;
      border-radius: 50%;
      margin: 2rem auto;
      background: conic-gradient(gold, orange, red, pink, purple, blue, cyan, green, gold);
      transition: transform 3s ease-out;
    }
    button {
      padding: 12px 24px;
      margin-top: 1rem;
      font-size: 1.2rem;
      background-color: #00cc99;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #009f7a;
    }
  </style>
</head>
<body>
  <h1>🎡 OrcaX 룰렛</h1>
  <div id="spin-count">🎡 남은 스핀: 계산 중...</div>
  <div class="wheel" id="wheel"></div>
  <div id="loading" style="display: none; margin-top: 1rem; color: #00e0ff; font-size: 1.2rem;">⏳ 룰렛 돌리는 중...</div>
  <div id="result"></div>
  <button onclick="spinRoulette()">스핀!</button>

  <audio id="spin-sound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7a9dbb37a0.mp3?filename=spin-wheel-110411.mp3"></audio>
  <div id="reward" style="margin-top: 1.5rem;"></div>
<div id="reward-image" style="margin-top: 1rem;"></div>

  <script>
    document.getElementById('withdraw-trigger').addEventListener('click', () => {
      document.getElementById('withdraw-modal').style.display = 'block';
    });

    document.getElementById('submit-withdraw').addEventListener('click', async () => {
      const address = document.getElementById('withdraw-address').value.trim();
      const amount = parseInt(document.getElementById('withdraw-amount').value.trim(), 10);
      const status = document.getElementById('withdraw-status');

      if (!address || isNaN(amount)) {
        status.innerText = '❌ 주소와 수량을 모두 입력하세요.';
        return;
      }
      if (amount < 50000) {
        status.innerText = '❌ 최소 출금 수량은 50000 ORCAX 입니다.';
        return;
      }

      try {
        const res = await fetch('https://orcax-roulette-backend.onrender.com/api/withdraw-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ walletAddress: address, amount })
        });
        const data = await res.json();
        if (res.status === 200) {
          status.innerText = '✅ 출금 요청이 성공적으로 접수되었습니다!';
        } else {
          status.innerText = `❌ ${data.message || '출금 요청 실패'}`;
        }
      } catch (err) {
        console.error('[출금 요청 오류]', err);
        status.innerText = '❌ 서버 오류로 출금 요청 실패';
      }
    });
  </script>
</body>
</html>
