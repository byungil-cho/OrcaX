<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>옥수수 농장 입구 - OrcaX</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
    <style>
      body {
        background: url('img/corn-dashboard.jpg') no-repeat center center fixed;
        background-size: cover;
        color: white;
      }
      .overlay {
        background: rgba(0, 0, 0, 0.6);
        padding: 2rem;
        border-radius: 1rem;
        margin-top: 2rem;
      }
      .mini-farm {
        border: 2px solid #fff;
        border-radius: 10px;
        overflow: hidden;
      }
      .badge {
        background-color: #444;
        border-radius: 5px;
        padding: 0.25rem 0.5rem;
        font-size: 0.8rem;
      }
      .grid-resources {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <nav class="container-fluid">
      <ul>
        <li><strong>🌽 OrcaX Corn Dashboard</strong></li>
      </ul>
      <ul>
        <li><a href="index9.html">홈</a></li>
        <li><a href="mypage.html">마이페이지</a></li>
        <li><a href="#">로그아웃</a></li>
      </ul>
    </nav>

    <main class="container">
      <div class="overlay">
        <hgroup>
          <h2>옥수수 농장</h2>
          <h3>현재 보유 자원</h3>
        </hgroup>

        <div class="grid-resources">
          <span class="badge">🌊 물: <span id="water">-</span></span>
          <span class="badge">🌱 거름: <span id="fertilizer">-</span></span>
          <span class="badge">🍿 팝콘: <span id="popcorn">-</span></span>
          <span class="badge">🧂 소금: <span id="salt">-</span></span>
          <span class="badge">🍬 설탕: <span id="sugar">-</span></span>
          <span class="badge">🪙 토큰: <span id="token">-</span></span>
        </div>

        <h3>농장 입장</h3>
        <figure class="mini-farm">
          <a href="corn-farm.html">
            <img src="img/corn-preview.jpg" alt="미니 옥수수 농장 미리보기" />
          </a>
          <figcaption style="text-align:center">클릭 시 실제 농장으로 이동합니다</figcaption>
        </figure>
      </div>
    </main>

    <footer class="container">
      <small><a href="#">© OrcaX Corn Farm System</a></small>
    </footer>

    <script src="js/corn-index.js"></script>
  </body>
</html>
