<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장 메인</title>
  <style>
    html,body{height:100%;margin:0;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif;overflow:hidden}
    .wrap{position:fixed;inset:0;background:url('img/farm_00.png') center/cover no-repeat}

    /* HUD */
    .hud{position:fixed;left:12px;top:12px;z-index:20;color:#fff;background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px);max-width:min(92vw,560px)}
    .nick{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
    .status{width:8px;height:8px;border-radius:999px;background:#e23}
    .online .status{background:#3ecf8e}
    .lvl{display:flex;align-items:center;gap:6px}
    .lvl img{width:24px;height:24px;border-radius:999px;display:block}
    .res{display:flex;flex-wrap:wrap;gap:8px}
    .tag{font-size:12px;line-height:1;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
    .tag b{font-weight:700}
    .actions{margin-top:8px;display:flex;gap:6px}
    .btn{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;cursor:pointer}

    /* 가운데 썸네일 전용 스크롤 */
    .scrollbox{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:min(40vw,260px);height:min(60vh,460px);
      border-radius:14px;background:transparent;border:1px solid rgba(255,255,255,.25);box-shadow:0 20px 40px rgba(0,0,0,.45);
      overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .scrollbox::-webkit-scrollbar{display:none}
    .spacer{height:85vh}
    .link{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 24px rgba(0,0,0,.35)}
    .link img{width:100%;height:100%;object-fit:cover;display:block}
    .caption{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.2);padding:8px 12px;border-radius:999px;font-size:14px;z-index:10;pointer-events:none}
  </style>
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <div class="wrap">

    <!-- HUD -->
    <div class="hud" id="hudRoot">
      <div class="nick" id="hudNick">
        <span class="status"></span>
        <span id="nickText">(로그인 확인 중)</span>
        <span class="lvl" id="lvlWrap" style="display:none">
          <img id="lvlIcon" src="img/mark_01.png" alt="레벨 아이콘" />
          <span id="lvlText">Lv.1</span>
        </span>
      </div>
      <div class="res">
        <span class="tag">💧 물 <b id="r-water">0</b></span>
        <span class="tag">🪴 거름 <b id="r-fert">0</b></span>
        <span class="tag">🌽 옥수수 <b id="r-corn">0</b></span>
        <span class="tag">🍿 팝콘 <b id="r-pop">0</b></span>
        <span class="tag">🧂 소금 <b id="r-salt">0</b></span>
        <span class="tag">🍬 설탕 <b id="r-sugar">0</b></span>
        <span class="tag">🪙 토큰 <b id="r-orcx">0</b></span>
      </div>
      <div class="actions">
        <button class="btn" id="btnRefresh">새로고침</button>
        <button class="btn" id="btnGoFarm">감자 농장 가기</button>
      </div>
    </div>

    <!-- 썸네일 스크롤 -->
    <div class="scrollbox" aria-label="농장 입구 썸네일">
      <div class="spacer"></div>
      <a class="link" href="corn-farm.html" title="내 옥수수 농장으로">
        <img id="farmThumb" src="img/farm_01.png" alt="계절 썸네일" />
      </a>
      <div class="spacer"></div>
    </div>

    <div class="caption">박스 안에서 위/아래 스크롤 · 이미지를 누르면 농장으로 이동</div>
  </div>

 <script>
  // ===== 공통 설정 =====
  const BASE_API = localStorage.getItem('orcax:BASE_API') || new URLSearchParams(location.search).get('api') || '';
  const token = localStorage.getItem('orcax:token') || '';

  const H = {
    water: document.querySelector('#r-water'),
    fert:  document.querySelector('#r-fert'),
    orcx:  document.querySelector('#r-orcx'),
    corn:  document.querySelector('#r-corn'),
    pop:   document.querySelector('#r-pop'),
    salt:  document.querySelector('#r-salt'),
    sugar: document.querySelector('#r-sugar'),
    nick:  document.querySelector('#nickText'),
    lvlW:  document.querySelector('#lvlWrap'),
    lvlI:  document.querySelector('#lvlIcon'),
    lvlT:  document.querySelector('#lvlText'),
    status: document.querySelector('#hudNick')
  };

  const THUMBS = {
    winter:'img/farm_01.png', lateWinter:'img/farm_03.png', spring:'img/farm_05.png',
    summer:'img/farm_07.png', lateSummer:'img/farm_09.png', autumn:'img/farm_10.png', deepWinter:'img/farm_12.png'
  };
  const thumbEl = document.getElementById('farmThumb');

  function setOnline(on){ H.status.classList.toggle('online', !!on); }
  function setNick(n){ H.nick.textContent = n || '(로그인 필요)'; }
  function setRes(x={}) {
    H.water.textContent = x.water ?? 0;
    H.fert.textContent  = x.fertilizer ?? x.fert ?? 0;
    H.orcx.textContent  = x.orcx ?? x.token ?? x.tokens ?? 0;
    H.corn.textContent  = x.corn ?? 0;
    H.pop.textContent   = x.popcorn ?? x.pop ?? 0;
    H.salt.textContent  = x.salt ?? 0;
    H.sugar.textContent = x.sugar ?? 0;
  }
  function showLevel(lv){
    if(!lv){ H.lvlW.style.display='none'; return; }
    const n = lv>=10 ? '10' : ('0'+Math.max(1,Math.min(9,lv)));
    H.lvlI.src = `img/mark_${n}.png`;
    H.lvlT.textContent = `Lv.${lv}`;
    H.lvlW.style.display='inline-flex';
  }
  function seasonKey(s=''){
    s = (s||'').toString().toLowerCase();
    if(/deep|snowman/.test(s)) return 'deepWinter';
    if(/late ?winter|thaw|melt/.test(s)) return 'lateWinter';
    if(/winter|snow|ice/.test(s)) return 'winter';
    if(/spring|seed|plow/.test(s)) return 'spring';
    if(/late ?summer/.test(s)) return 'lateSummer';
    if(/summer|lush|green/.test(s)) return 'summer';
    if(/autumn|fall|harvest|brown/.test(s)) return 'autumn';
    return '';
  }
  function thumbByMonth(d=new Date()){
    const m=d.getMonth()+1;
    return m===12||m===1 ? THUMBS.winter
      : m===2 ? THUMBS.lateWinter
      : (m===3||m===4) ? THUMBS.spring
      : (m>=5&&m<=7) ? THUMBS.summer
      : m===8 ? THUMBS.lateSummer
      : (m===9||m===10) ? THUMBS.autumn
      : THUMBS.deepWinter;
  }
  function setThumbBySeason(s){ thumbEl.src = THUMBS[seasonKey(s)] || thumbByMonth(); }

  async function j(path, opt={}) {
    const url = path.startsWith('http') ? path : (BASE_API + path);
    const headers = {'Content-Type':'application/json', ...(token?{Authorization:`Bearer ${token}`}:{}) , ...(opt.headers||{})};
    const r = await fetch(url, {method: opt.method||'GET', headers,
      body: opt.body?JSON.stringify(opt.body):undefined,
      mode:'cors', credentials:'include', cache:'no-store'});
    if(!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  }
  async function firstOk(tasks){ // [{fn,parse,tag}]
    let lastErr;
    for(const t of tasks){
      try{ const data = await t.fn(); return t.parse? t.parse(data):data; }
      catch(e){ lastErr=e; console.debug('[miss]', t.tag||'', e.message); }
    }
    throw lastErr||new Error('No endpoint matched');
  }

  // 다양한 서버 스키마를 커버하는 파서
  function pick(obj, paths=[]){
    for(const p of paths){
      const v = p.split('.').reduce((a,k)=>a?.[k], obj);
      if(v!==undefined) return v;
    }
    return undefined;
  }
  function parseMe(me={}){
    return {
      nickname: pick(me, ['nickname','nick','profile.nickname','user.nickname']),
      level: Number(pick(me, ['level','profile.level','stats.level','agri.level']))||0,
      inv: {
        water: Number(pick(me, ['inventory.water','inv.water','water']))||0,
        fertilizer: Number(pick(me, ['inventory.fertilizer','inv.fertilizer','fert','manure']))||0,
        orcx: Number(pick(me, ['wallet.orcx','wallet.token','token','tokens']))||0,
        corn: Number(pick(me, ['agri.corn','inventory.corn']))||0,
        popcorn: Number(pick(me, ['food.popcorn','inventory.popcorn']))||0,
        salt: Number(pick(me, ['additives.salt','inventory.salt']))||0,
        sugar: Number(pick(me, ['additives.sugar','inventory.sugar']))||0,
      },
      season: pick(me, ['ui.season','ui.corn.season','farm.season','agri.season','environment.season'])
    };
  }

  async function loadAll(){
    try{
      // 1) 환경/자원 한 번에 주는 서버가 있다면 우선
      const envRes = await firstOk([
        { tag:'/api/summary', fn:()=>j('/api/summary') },
        { tag:'/api/env', fn:()=>j('/api/env') },
        { tag:'/env', fn:()=>j('/env') },
        // 마지막 폴백: me에서 추출
        { tag:'/api/user/me', fn:()=>j('/api/user/me'), parse: d => ({me:d}) },
        { tag:'/me', fn:()=>j('/me'), parse: d => ({me:d}) },
      ]);

      let meParsed, season;
      if(envRes?.me){ meParsed = parseMe(envRes.me); season = meParsed.season; }
      else{
        // 별도 리소스라면 병렬로 시도
        const meData = await firstOk([
          { tag:'/api/user/me', fn:()=>j('/api/user/me') },
          { tag:'/me', fn:()=>j('/me') },
          { tag:'/api/profile', fn:()=>j('/api/profile') },
        ]).catch(()=>null);
        meParsed = meData ? parseMe(meData) : {inv:{}};

        const envData = await firstOk([
          { tag:'/api/env', fn:()=>j('/api/env') },
          { tag:'/env', fn:()=>j('/env') },
          { tag:'/api/farm/env', fn:()=>j('/api/farm/env') },
        ]).catch(()=>null);
        season = pick(envData||{}, ['season','farm.season','environment.season']) || meParsed.season;
      }

      // 표시
      setOnline(true);
      setNick(meParsed?.nickname || localStorage.getItem('orcax:nickname') || '(알 수 없음)');
      setRes(meParsed?.inv || {});
      showLevel(meParsed?.level || Number(localStorage.getItem('orcax:level')||0));
      setThumbBySeason(season);

    }catch(e){
      console.warn('서버 연결 실패:', e.message);
      setOnline(false);
      // 완전 오프라인 폴백
      setNick(localStorage.getItem('orcax:nickname') || '(오프라인)');
      setRes({
        water: Number(localStorage.getItem('orcax:inv:water')||0),
        fertilizer: Number(localStorage.getItem('orcax:inv:fertilizer')||0),
        orcx: Number(localStorage.getItem('orcax:wallet:orcx')||0),
        corn: Number(localStorage.getItem('orcax:agri:corn')||0)
      });
      setThumbBySeason(''); // 월별 기본
      showLevel(Number(localStorage.getItem('orcax:level')||0));
    }
  }

  // 초기 호출 + 버튼들
  loadAll();
  document.getElementById('btnRefresh')?.addEventListener('click', loadAll);
</script>

</body>
</html>
