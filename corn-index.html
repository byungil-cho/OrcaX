<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장 입구</title>
  <style>
    html,body{height:100%;margin:0;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif}
    .bg{position:fixed;inset:0;background:url('img/entrance.jpg') center/cover no-repeat;filter:brightness(1)}
    .top{position:fixed;left:16px;top:16px;right:16px;display:flex;gap:10px;align-items:center;z-index:3}
    .hud{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:16px;
         background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.15)}
    .nick{display:flex;gap:8px;align-items:center;font-weight:700}
    .nick img{width:24px;height:24px;border-radius:50%}
    .badges{display:flex;gap:8px;flex-wrap:wrap}
    .badge{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:999px;font-size:13px}
    .ok{color:#7CFF7C}.err{color:#ff7b7b}
    .btns{display:flex;gap:8px;margin-left:auto}
    .btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:10px;font-size:13px;text-decoration:none}
    .wrap{position:fixed;inset:0;display:grid;place-items:center;z-index:2}
    .card{width:min(56vw,420px);aspect-ratio:9/16;border-radius:20px;border:1px solid rgba(255,255,255,.25);
          background:rgba(0,0,0,.35);backdrop-filter:blur(6px);overflow:hidden;display:flex;align-items:center;justify-content:center}
    .thumb{width:88%;border-radius:14px;display:block;box-shadow:0 16px 40px rgba(0,0,0,.45)}
    .caption{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
             color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);padding:8px 12px;border-radius:999px;font-size:13px;z-index:2}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="top">
    <div class="hud">
      <div class="nick">
        <img id="mark" alt="레벨마크" src="img/mark_01.png">
        <span id="nickname">로그인 확인 중</span>
      </div>
      <div class="badges">
        <div class="badge">💧 물 <b id="water">0</b></div>
        <div class="badge">🧺 거름 <b id="fert">0</b></div>
        <div class="badge">🌽 씨앗 <b id="seed">0</b></div>
        <div class="badge">🌽 옥수수 <b id="corn">0</b></div>
        <div class="badge">🧂 소금 <b id="salt">0</b></div>
        <div class="badge">🍬 설탕 <b id="sugar">0</b></div>
        <div class="badge">🪙 토큰 <b id="token">0</b></div>
        <div class="badge">🍿 팝콘 <b id="pop">0</b></div>
      </div>
    </div>

    <div class="hud">
      <span id="statusDot" class="err">●</span>
      <span id="statusText">오프라인</span>
      <span style="opacity:.6;font-size:12px" id="apiInfo"></span>
    </div>

    <div class="btns">
      <a class="btn" href="https://byungil-cho.github.io/OrcaX/index9.html">감자 농장 가기</a>
      <button class="btn" id="btnRefresh">새로고침</button>
    </div>
  </div>

  <div class="wrap">
    <a class="card" id="goFarm" href="corn-farm.html" title="옥수수 농장으로">
      <img id="thumb" class="thumb" alt="현재 시즌 썸네일" src="img/farm_01.png"/>
    </a>
  </div>

  <div class="caption">박스 안에서 위/아래 스크롤 · 이미지를 누르면 농장으로 이동</div>

<script>
(() => {
  // --- 기본 설정 ------------------------------------------------------------
  const ORIGIN = location.origin + (location.pathname.includes('/OrcaX/') ? '/OrcaX' : '');
  const API_HOST = localStorage.getItem('API_HOST')
                  || localStorage.getItem('KIT_HOST')
                  || 'https://climbing-wholly-grouperjr.ngrok.io'; // 필요시 바꿔도 됨
  const TOKEN = localStorage.getItem('kakaold') || localStorage.getItem('token') || '';

  // 썸네일 시즌 ↔ 이미지 매핑
  const THUMBS = {
    winter     : 'img/farm_01.png',
    lateWinter : 'img/farm_03.png',
    spring     : 'img/farm_05.png',
    summer     : 'img/farm_07.png',
    lateSummer : 'img/farm_09.png',
    autumn     : 'img/farm_10.png',
    deepWinter : 'img/farm_12.png'
  };

  // 레벨에 따른 마크
  const levelToMark = (lv=1) => {
    if (lv >= 60) return 'img/mark_10.png';
    if (lv >= 50) return 'img/mark_09.png';
    if (lv >= 40) return 'img/mark_08.png';
    if (lv >= 35) return 'img/mark_07.png';
    if (lv >= 30) return 'img/mark_06.png';
    if (lv >= 25) return 'img/mark_05.png';
    if (lv >= 20) return 'img/mark_04.png';
    if (lv >= 15) return 'img/mark_03.png';
    if (lv >= 10) return 'img/mark_02.png';
    return 'img/mark_01.png';
  };

  // --- DOM 참조 -------------------------------------------------------------
  const el = {
    nickname: document.getElementById('nickname'),
    mark: document.getElementById('mark'),
    water: document.getElementById('water'),
    fert: document.getElementById('fert'),
    seed: document.getElementById('seed'),
    corn: document.getElementById('corn'),
    salt: document.getElementById('salt'),
    sugar: document.getElementById('sugar'),
    token: document.getElementById('token'),
    pop: document.getElementById('pop'),
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    apiInfo: document.getElementById('apiInfo'),
    thumb: document.getElementById('thumb'),
    btnRefresh: document.getElementById('btnRefresh'),
  };

  el.apiInfo.textContent = ` API:${API_HOST}${TOKEN ? ' / token:있음' : ''}`;

  // --- 헬퍼 ------------------------------------------------------------------
  function setStatus(ok){
    if(ok){
      el.statusDot.classList.remove('err'); el.statusDot.classList.add('ok');
      el.statusText.textContent = '연결됨';
    }else{
      el.statusDot.classList.remove('ok'); el.statusDot.classList.add('err');
      el.statusText.textContent = '오프라인';
    }
  }

  function applySeasonThumb(fromServerKey){
    const saved = localStorage.getItem('farmSeason');
    const key = fromServerKey || saved || 'winter';
    const src = THUMBS[key] || THUMBS.winter;
    el.thumb.src = src;
  }

  // --- 데이터 로딩 -----------------------------------------------------------
  async function load(){
    try{
      const res = await fetch(`${API_HOST}/api/userdata`, {
        method: 'GET',
        headers: {
          'Accept': 'application/json',
          ...(TOKEN ? {'Authorization': `Bearer ${TOKEN}`} : {})
        },
        credentials: 'include'
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();

      // 닉네임/레벨
      const nick = data.nick || data.nickname || '농부';
      const level = data.level ?? data.lv ?? 1;
      el.nickname.textContent = `${nick}`;
      el.mark.src = levelToMark(level);

      // 자원
      const r = data.resources || data.res || {};
      el.water.textContent = r.water ?? r.w ?? 0;
      el.fert.textContent  = r.fertilizer ?? r.fert ?? 0;
      el.seed.textContent  = r.cornSeed ?? r.seed ?? 0;
      el.corn.textContent  = r.corn ?? 0;
      el.salt.textContent  = r.salt ?? 0;
      el.sugar.textContent = r.sugar ?? 0;
      el.token.textContent = (data.tokens ?? data.token ?? 0).toLocaleString();
      el.pop.textContent   = data.popcon ?? data.pop ?? 0;

      // 시즌 동기화 (서버 → 로컬 → 썸네일)
      const seasonFromServer = (data.env && data.env.season)
                            || (data.farm && data.farm.season)
                            || (data.ui && data.ui.seasonKey);
      if(seasonFromServer) localStorage.setItem('farmSeason', seasonFromServer);
      applySeasonThumb(seasonFromServer);

      // 캐시
      localStorage.setItem('cachedUser', JSON.stringify(data));
      setStatus(true);
    }catch(err){
      setStatus(false);
      // 캐시로 표시
      try{
        const cached = JSON.parse(localStorage.getItem('cachedUser')||'{}');
        if(cached.nick || cached.resources){ // 어느정도 형태면 표시
          el.nickname.textContent = cached.nick || '농부';
          el.mark.src = levelToMark(cached.level ?? 1);
          const r = cached.resources || {};
          el.water.textContent = r.water ?? 0;
          el.fert.textContent  = r.fertilizer ?? 0;
          el.seed.textContent  = r.cornSeed ?? 0;
          el.corn.textContent  = r.corn ?? 0;
          el.salt.textContent  = r.salt ?? 0;
          el.sugar.textContent = r.sugar ?? 0;
          el.token.textContent = (cached.tokens ?? 0).toLocaleString();
          el.pop.textContent   = cached.popcon ?? 0;
        }
      }catch(_){}
      applySeasonThumb(); // 최소 썸네일은 반영
    }
  }

  // 이벤트
  el.btnRefresh.addEventListener('click', ()=>location.reload());
  // 첫 표시
  applySeasonThumb(); // 최초 로컬 상태 우선
  load();

  // 3분마다 갱신(너무 빈번하지 않게)
  setInterval(load, 180000);
})();
</script>
</body>
</html>
