<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장 메인</title>
  <style>
    html,body{height:100%;margin:0;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif;overflow:hidden}
    /* 배경은 그대로 유지 */
    .wrap{position:fixed;inset:0;background:url('img/farm_00.png') center/cover no-repeat;}

    /* 상단 HUD */
    .hud{position:fixed;left:12px;top:12px;z-index:20;color:#fff;background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px);max-width:min(92vw,560px)}
    .nick{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
    .status{width:8px;height:8px;border-radius:999px;background:#e23}
    .online .status{background:#3ecf8e}
    .lvl{display:flex;align-items:center;gap:6px}
    .lvl img{width:24px;height:24px;border-radius:999px;display:block}
    .res{display:flex;flex-wrap:wrap;gap:8px}
    .tag{font-size:12px;line-height:1;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
    .tag b{font-weight:700}
    .actions{margin-top:8px;display:flex;gap:6px}
    .btn{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;cursor:pointer}

    /* 가운데 썸네일 전용 스크롤(배경은 고정, 썸네일만 스크롤) */
    .scrollbox{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:min(40vw,260px);height:min(60vh,460px);
      border-radius:14px;background:transparent;border:1px solid rgba(255,255,255,.25);box-shadow:0 20px 40px rgba(0,0,0,.45);
      overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .scrollbox::-webkit-scrollbar{display:none}
    .spacer{height:85vh}
    .link{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 24px rgba(0,0,0,.35)}
    .link img{width:100%;height:100%;object-fit:cover;display:block}
    .caption{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.2);padding:8px 12px;border-radius:999px;font-size:14px;z-index:10;pointer-events:none}
  </style>
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <div class="wrap">

    <!-- HUD -->
    <div class="hud" id="hudRoot">
      <div class="nick" id="hudNick">
        <span class="status"></span>
        <span id="nickText">(로그인 확인 중)</span>
        <span class="lvl" id="lvlWrap" style="display:none">
          <img id="lvlIcon" src="img/mark_01.png" alt="레벨 아이콘" />
          <span id="lvlText">Lv.1</span>
        </span>
      </div>
      <div class="res">
        <span class="tag">💧 물 <b id="r-water">0</b></span>
        <span class="tag">🪴 거름 <b id="r-fert">0</b></span>
        <span class="tag">🌽 옥수수 <b id="r-corn">0</b></span>
        <span class="tag">🍿 팝콘 <b id="r-pop">0</b></span>
        <span class="tag">🧂 소금 <b id="r-salt">0</b></span>
        <span class="tag">🍬 설탕 <b id="r-sugar">0</b></span>
        <span class="tag">🪙 토큰 <b id="r-orcx">0</b></span>
      </div>
      <div class="actions">
        <button class="btn" id="btnRefresh">새로고침</button>
        <button class="btn" id="btnGoFarm">감자 농장 가기</button>
      </div>
    </div>

    <!-- 썸네일 스크롤 (배경은 그대로, 썸네일만 교체 가능) -->
    <div class="scrollbox" aria-label="농장 입구 썸네일">
      <div class="spacer"></div>
      <a class="link" href="corn-farm.html" title="내 옥수수 농장으로">
        <img id="farmThumb" src="img/farm_01.png" alt="계절 썸네일" />
      </a>
      <div class="spacer"></div>
    </div>

    <div class="caption">박스 안에서 위/아래 스크롤 · 이미지를 누르면 농장으로 이동</div>
  </div>

  <script>
    /* ================== 서버 설정(감자와 동일 경로) ================== */
    // gamja-farm.html에서 사용한 ngrok 주소와 동일하게 고정. 필요 시 localStorage로 덮어쓰기 가능.
    const BASE_API = localStorage.getItem('orcax:BASE_API') || 'https://climbing-wholly-grouper.jp.ngrok.io';

    /* ================== 엘리먼트 ================== */
    const nickText = document.getElementById('nickText');
    const hudNick  = document.getElementById('hudNick');
    const lvlWrap  = document.getElementById('lvlWrap');
    const lvlIcon  = document.getElementById('lvlIcon');
    const lvlText  = document.getElementById('lvlText');
    const resEl = {
      water: document.getElementById('r-water'),
      fert : document.getElementById('r-fert'),
      corn : document.getElementById('r-corn'),
      pop  : document.getElementById('r-pop'),
      salt : document.getElementById('r-salt'),
      sugar: document.getElementById('r-sugar'),
      orcx : document.getElementById('r-orcx'),
    };
    const thumbEl = document.getElementById('farmThumb');

    /* ================== 표시 함수 ================== */
    function setOnline(on){ hudNick.classList.toggle('online', !!on); }
    function setNick(name){ nickText.textContent = name || '(로그인 필요)'; }
    function setRes(x){
      resEl.water.textContent = x.water ?? 0;
      resEl.fert .textContent = x.fertilizer ?? 0;
      resEl.corn .textContent = x.corn ?? 0;
      resEl.pop  .textContent = x.popcorn ?? 0;
      resEl.salt .textContent = x.salt ?? 0;
      resEl.sugar.textContent = x.sugar ?? 0;
      resEl.orcx .textContent = x.orcx ?? 0;
    }
    function markPathByLevel(lv){
      if(lv >= 10) return 'img/mark_10.png';
      const n = Math.max(1, Math.min(9, Math.floor(lv||1)));
      return `img/mark_0${n}.png`;
    }
    function showLevel(lv){
      if(!lv || lv<1){ lvlWrap.style.display='none'; return; }
      lvlIcon.src = markPathByLevel(lv);
      lvlText.textContent = `Lv.${lv}`;
      lvlWrap.style.display = 'inline-flex';
    }

    // (선택) 다른 페이지에서 저장해둔 시즌키가 있으면 썸네일만 교체
    const THUMBS = {
      winter:      'img/farm_01.png',
      lateWinter:  'img/farm_03.png',
      spring:      'img/farm_05.png',
      summer:      'img/farm_07.png',
      lateSummer:  'img/farm_09.png',
      autumn:      'img/farm_10.png',
      deepWinter:  'img/farm_12.png'
    };
    function setThumbBySeasonKey(key){
      if(THUMBS[key]) thumbEl.src = THUMBS[key];
    }

    /* ================== 감자 농장 방식 그대로: /api/userdata ================== */
    async function loadUserData() {
      const kakaoId = localStorage.getItem("kakaoId");
      const nickname = localStorage.getItem("nickname") || localStorage.getItem("kakaoNickname");

      if (!kakaoId || !nickname) {
        alert("로그인이 필요합니다. 메인 페이지로 이동합니다.");
        window.location.href = "index9.html";
        return;
      }

      setNick(nickname);

      try {
        const response = await fetch(`${BASE_API}/api/userdata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId }),
          // gamja-farm.html과 동일: 특별한 인증 헤더 없이 호출
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const user = data.user;

        if (!user) {
          alert("유저 정보를 찾을 수 없습니다.");
          return;
        }

        // 연결 OK
        setOnline(true);

        // 자원 표시는 감자 로직 그대로(필드 동일)
        setRes({
          orcx: user.orcx ?? user.wallet?.orcx ?? 0,
          water: user.inventory?.water ?? 0,
          fertilizer: user.inventory?.fertilizer ?? 0,
          corn: user.agri?.corn ?? 0,
          popcorn: user.food?.popcorn ?? 0,
          salt: user.additives?.salt ?? 0,
          sugar: user.additives?.sugar ?? 0
        });

        // 레벨 아이콘 (있으면 사용, 없으면 안 보여줌)
        const level =
          Number(user.level ?? user.profile?.level ?? localStorage.getItem('orcax:level') || 0);
        showLevel(level);

        // (선택) 시즌 키가 로컬에 있으면 썸네일만 교체
        const seasonKey = localStorage.getItem('farmSeason'); // corn-farm에서 저장해 둘 수 있음
        if(seasonKey) setThumbBySeasonKey(seasonKey);

      } catch (error) {
        console.error("유저 데이터를 불러오는 중 오류:", error);
        setOnline(false);
        alert("서버 오류가 발생했습니다. 다시 시도해주세요.");
        // 요청: 오프라인 폴백 없이 그대로 둠.
      }
    }

    window.onload = loadUserData;

    // 버튼들
    document.getElementById('btnRefresh').addEventListener('click', loadUserData);
    document.getElementById('btnGoFarm').addEventListener('click', ()=>{
      location.href = 'https://byungil-cho.github.io/OrcaX/index9.html';
    });

    // 서비스워커(정적 캐시)
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>navigator.serviceWorker.register('service-worker.js'));
    }
  </script>
</body>
</html>
