<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장 메인</title>
  <style>
    html,body{height:100%;margin:0;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif}
    /* 입구 표지 배경은 고정(원하면 교체 가능) */
    .wrap{position:fixed;inset:0;background:url('img/farm_05.png') center/cover no-repeat;}
    .link{
      position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);
      display:block;width:min(40vw,260px);aspect-ratio:16/9;border-radius:14px;
      border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);
      backdrop-filter:blur(4px);box-shadow:0 20px 40px rgba(0,0,0,.45);
      overflow:hidden;
    }
    .link img{width:100%;height:100%;object-fit:cover;display:block}
    .caption{
      position:absolute;left:50%;top:calc(55% + min(22vw,160px));transform:translateX(-50%);
      color:#fff;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);
      padding:8px 12px;border-radius:999px;font-size:14px
    }
  </style>
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <div class="wrap">
    <a class="link" href="corn-farm.html" title="내 옥수수 농장으로">
      <!-- 시즌에 따라 이 썸네일이 자동 교체됩니다 -->
      <img id="entrance-thumb" src="img/farm_01.png" alt="농장 썸네일(시즌 자동 반영)" />
    </a>
    <div class="caption">이미지를 눌러 내 옥수수 농장으로 이동</div>
  </div>

  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>navigator.serviceWorker.register('service-worker.js'));
    }

    /* 시즌→배경 이미지 매핑 (img/파일명 사용) */
    const FARM_BG = {
      winterDeep:  'img/farm_01.png', // 한겨울
      thaw:        'img/farm_03.png', // 해빙기
      spring:      'img/farm_05.png', // 봄
      summer:      'img/farm_07.png', // 여름
      autumn:      'img/farm_09.png', // 가을
      earlySnow:   'img/farm_10.png', // 초설
      winterField: 'img/farm_12.png', // 설경 들판
    };
    function pickFarmBgBySeason(season='SUMMER'){
      switch(String(season).toUpperCase()){
        case 'WINTER':  return FARM_BG.winterDeep;
        case 'SPRING':  return FARM_BG.spring;
        case 'SUMMER':  return FARM_BG.summer;
        case 'AUTUMN':  return FARM_BG.autumn;
        default:        return FARM_BG.summer;
      }
    }

    // 서버가 있으면 서버에서, 없으면 최근 기록/월로 시즌 추정
    const API_HOST = localStorage.getItem('API_HOST') ||
                     new URLSearchParams(location.search).get('api') || ''; // 선택사항

    async function getSeasonFromServer(){
      if(!API_HOST) return null;
      try{
        const r = await fetch(API_HOST + '/farm/state', { credentials:'include' });
        if(!r.ok) return null;
        const j = await r.json();
        return j.season || null; // 'WINTER'|'SPRING'|'SUMMER'|'AUTUMN'
      }catch(e){ return null; }
    }

    function guessSeasonByMonth(m=(new Date).getMonth()){ // 0=Jan
      if(m===11 || m<=1) return 'WINTER';
      if(m>=2 && m<=4)   return 'SPRING';
      if(m>=5 && m<=7)   return 'SUMMER';
      return 'AUTUMN';
    }

    (async ()=>{
      const season =
        await getSeasonFromServer() ||
        localStorage.getItem('farmSeason') ||  // 농장 화면에서 저장해 둔 최근 시즌
        guessSeasonByMonth();

      const src = pickFarmBgBySeason(season);
      const img = document.getElementById('entrance-thumb');
      img.src = src + '?v=' + season; // 캐시 무효화
      img.alt = `농장 썸네일 (${season})`;
    })();
  </script>
</body>
</html>
