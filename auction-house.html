<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaX 경매장</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .user-section {
      margin-bottom: 2rem;
      background: #fff;
      padding: 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
    }
    .market-data {
      background: #fff;
      padding: 1rem;
      margin-bottom: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
    }
    .user-data {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      width: 300px;
      background: #fff;
      padding: 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      z-index: 10;
    }
    .token-display {
      font-weight: bold;
      color: #00695c;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.75rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    button {
      padding: 0.5rem 1rem;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #server-status {
      text-align: center;
      margin-top: 1rem;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>
  <header>
    <h1>OrcaX 종합 경매 데이터실</h1>
    <p class="token-display">보유 ORCX: <span id="userToken">0</span> 토큰</p>
  </header>

  <section class="user-section">
    <button onclick="loadUserData()">내 정보 불러오기</button>
  </section>

  <section class="market-data">
    <h2>실시간 종합 시세</h2>
    <table id="marketItems">
      <tr><th>제품명</th><th>총 수량</th><th>현재 시세</th></tr>
    </table>
  </section>

  <div class="user-data" id="userData">
    <h3>내 보유 품목</h3>
    <table id="userItems">
      <tr><th>제품명</th><th>수량</th><th>시세</th><th>판매</th></tr>
    </table>
  </div>

  <div id="server-status">🔄 서버 상태 확인 중...</div>

  <script>
    function loadUserData() {
      const nickname = localStorage.getItem("nickname");
      const tokenAmount = localStorage.getItem("orcxToken") || 0;

      if (!nickname) {
        alert("⚠️ 로그인 정보가 없습니다. 먼저 로그인 해주세요.");
        return;
      }

      document.querySelector('.token-display').innerHTML = `보유 ORCX: <span id="userToken">${Number(tokenAmount).toLocaleString()}</span> 토큰`;

      alert(`👤 ${nickname}님 환영합니다!`);
    }

    async function checkServerStatus() {
      try {
        const res = await fetch("https://orcax-farm-6000.onrender.com/api/ping");
        if (res.ok) {
          document.getElementById("server-status").innerText = "🟢 서버 연결 성공: 경매장 서버 작동 중!";
        } else {
          document.getElementById("server-status").innerText = "🔴 서버 응답 없음";
        }
      } catch (err) {
        document.getElementById("server-status").innerText = "🔴 서버 연결 실패: 서버에 접근할 수 없습니다.";
      }
    }

    checkServerStatus();
  </script>
</body>
</html>
