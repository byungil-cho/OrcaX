<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>🐋 OrcaX 마이페이지</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>
    body { font-family: 'Arial', sans-serif; background: #f7f7f7; padding: 1rem; margin: 0; }
    h1, h2 { text-align: center; color: #2e2e2e; margin: 1.3rem 0 1.1rem 0; }
    .top-menu {
      background: #575757; padding: 0.5rem 0 0.5rem 0;
      text-align: center; font-size: 1.08rem;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .top-menu a, .top-menu span {
      padding: 0.4rem 1.1rem;
      border-radius: 16px;
      margin: 0 0.15rem;
      font-weight: bold;
      display: inline-block;
    }
    .top-menu a {
      color: #fff; text-decoration: none;
      background: #2ebca0;
      transition: background 0.15s;
    }
    .top-menu a:hover { background: #22a6a0; color: #fff; }
    .top-menu .active-menu {
      background: #888;
      color: #fff;
      cursor: default;
      pointer-events: none;
      border: 2px solid #fff2;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; font-size: 0.97rem; }
    th { background-color: #efefef; }
    #notice { margin-top: 1rem; color: #555; text-align: center; }
    #myStorage { margin-top: 2rem; }
    #userInfo {
      background: #fff; padding: 0.7rem 1rem;
      border-bottom: 2px solid #eee;
      font-size: 1.05rem; text-align: right; margin-bottom:12px;
    }
    button {
      margin: 1.5rem auto 1.1rem auto; display: block;
      padding: 0.65rem 1.4rem; font-size: 1.06rem;
      background: #23b399; color: white; border: none;
      border-radius: 7px; cursor: pointer; font-weight:bold;
    }
    button:hover { background-color: #14807d; }
    @media screen and (max-width: 600px) {
      th, td { font-size: 0.85rem; padding: 0.4rem; }
      button { font-size: 0.95rem; padding: 0.5rem 1rem; }
      .top-menu a, .top-menu span { padding: 0.4rem 0.6rem; font-size: 0.95rem; }
    }
</style>
</head>
<body>
<div class="top-menu">
  <a href="index9.html">메인</a>
  <a href="gamja-farm.html">농장</a>
  <a href="gamja-shop.html">씨앗상점</a>
  <span class="active-menu">마이페이지</span>
  <a href="#" onclick="goToAdmin();return false;">관리자</a>
</div>
<div id="userInfo">
    👤 <span id="nickname">닉네임</span> | 💰 <span id="tokenBalance">0</span> ORCX
</div>
<h1>🐋 OrcaX 마이페이지</h1>
<div style="text-align:center; color:#14807d; margin-bottom:1.3rem;">
    환영합니다!<br>
    아래는 회원님의 OrcaX 자산 및 가공식품 보관 현황입니다.
</div>
<div id="myStorage">
<h2>🗃️ 내 보관 창고 <span style="font-size:0.95rem;">(가공식품 현황)</span></h2>
<table id="storageTable">
<thead>
<tr>
<th>제품명</th>
<th>보유 수량</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
  const nickname = localStorage.getItem("nickname");

  if (!nickname) {
    alert("로그인이 필요합니다. 로그인 페이지로 이동합니다.");
    window.location.href = "index9.html";
    return;
  }

  document.getElementById("nickname").textContent = nickname;

  // ✅ 통합 프로필 전체 불러오기
  fetch(`${API_BASE}/api/user/profile/${nickname}`)
    .then(res => res.json())
    .then(user => {
      // 토큰
      document.getElementById("tokenBalance").textContent = user.orcx || 0;
      // 등급, 레벨, 물, 거름, 씨감자, 씨보리 등 표시 추가
      // (필요한 곳에 각 값 넣기)

      // 보관함 (가공식품)
      const prod = user.products || {};
      const tbody = document.querySelector("#storageTable tbody");
      tbody.innerHTML = "";
      Object.entries(prod).forEach(([type, count]) => {
        if (count > 0) {
          const row = `<tr>
            <td>${type}</td>
            <td>${count}</td>
          </tr>`;
          tbody.insertAdjacentHTML("beforeend", row);
        }
      });
      // 만약 제품이 하나도 없을 경우 메시지
      if (tbody.innerHTML === "") {
        tbody.innerHTML = "<tr><td colspan='2'>보관한 가공식품이 없습니다.</td></tr>";
      }
      // 기타 정보(물, 거름, 씨감자 등)는 별도 표/박스에 추가해도 됨
    })
    .catch(() => {
      const tbody = document.querySelector("#storageTable tbody");
      tbody.innerHTML = "<tr><td colspan='2'>❌ 보관함 불러오기 실패</td></tr>";
    });

  window.goToAdmin = function () {
    const pw = prompt("관리자 비밀번호를 입력하세요:");
    if (pw === "7788") {
      location.href = "admin-users.html";
    } else if (pw !== null) {
      alert("비밀번호가 틀렸습니다.");
    }
  };
});
</script>
</body>
</html>
