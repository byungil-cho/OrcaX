<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>🐋 OrcaX 마이페이지</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>
    body { font-family: 'Arial', sans-serif; background: #f7f7f7; padding: 1rem; margin: 0; }
    h1, h2 { text-align: center; color: #2e2e2e; margin: 1.3rem 0 1.1rem 0; }
    .top-menu {
      background: #575757; padding: 0.5rem 0;
      text-align: center; font-size: 1.08rem;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .top-menu a, .top-menu span {
      padding: 0.4rem 1.1rem;
      border-radius: 16px;
      margin: 0 0.15rem;
      font-weight: bold;
      display: inline-block;
    }
    .top-menu a {
      color: #fff; text-decoration: none;
      background: #2ebca0;
      transition: background 0.15s;
    }
    .top-menu a:hover { background: #22a6a0; color: #fff; }
    .top-menu .active-menu {
      background: #888;
      color: #fff;
      cursor: default;
      pointer-events: none;
      border: 2px solid #fff2;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; font-size: 0.97rem; }
    th { background-color: #efefef; }
    #notice { margin-top: 1rem; color: #555; text-align: center; }
    #myStorage { margin-top: 2rem; }
    #userInfo {
      background: #fff; padding: 0.7rem 1rem;
      border-bottom: 2px solid #eee;
      font-size: 1.05rem; text-align: right; margin-bottom:12px;
    }
    #myAssets {
      margin-bottom: 10px;
      padding: 0.6rem 1.2rem;
      background: #e4f8f7;
      border-radius: 12px;
      font-size: 1.08em;
      text-align: center;
      color: #137877;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 1.4em;
    }
    button {
      margin: 1.5rem auto 1.1rem auto; display: block;
      padding: 0.65rem 1.4rem; font-size: 1.06rem;
      background: #23b399; color: white; border: none;
      border-radius: 7px; cursor: pointer; font-weight:bold;
    }
    button:hover { background-color: #14807d; }
    .withdraw-form {
      margin: 2rem auto 1.5rem auto;
      background: #e8f6ff;
      border: 1.5px solid #bae2fd;
      border-radius: 11px;
      max-width: 420px;
      padding: 1.4rem 1.2rem 1.2rem 1.2rem;
      box-shadow: 0 2px 12px #e0e0e040;
    }
    .withdraw-form h2 { margin: 0 0 1.1rem 0; color: #268bd2; }
    .withdraw-form label { display: block; font-weight:bold; margin-bottom: 5px; margin-top: 13px;}
    .withdraw-form input {
      width: 100%; padding: 0.55rem; border-radius: 5px; border: 1px solid #b2c2cc;
      margin-bottom: 2px; font-size: 1rem;
    }
    .withdraw-form input:disabled { background: #f2f2f2; }
    .withdraw-form .tip { font-size: 0.91em; color: #777; margin-bottom: 10px;}
    .withdraw-form .result-msg { font-size: 0.99em; color: #19713c; margin: 0.5em 0 0.2em 0; text-align:center;}
    @media screen and (max-width: 600px) {
      th, td { font-size: 0.85rem; padding: 0.4rem; }
      button { font-size: 0.95rem; padding: 0.5rem 1rem; }
      .top-menu a, .top-menu span { padding: 0.4rem 0.6rem; font-size: 0.95rem; }
      #myAssets { font-size: 0.98em; gap: 0.7em; padding: 0.45rem 0.2rem;}
      .withdraw-form { padding: 0.7rem 0.7rem;}
    }
</style>
</head>
<body>
<div class="top-menu">
  <a href="index9.html">메인</a>
  <a href="gamja-market.html">마켓</a>
  <a href="gamja-shop.html">씨앗상점</a>
  <span class="active-menu">마이페이지</span>
  <a href="#" onclick="goToAdmin();return false;">관리자</a>
</div>
<div id="userInfo">
    👤 <span id="nickname">닉네임</span> | 💰 <span id="tokenBalance">0</span> ORCX
</div>
<div id="myAssets">
  💧 물 <span id="water">0</span>
  🌱 거름 <span id="fertilizer">0</span>
  🥔 씨감자 <span id="seedPotato">0</span>
  🌾 씨보리 <span id="seedBarley">0</span>
</div>

<h1>
  🐋 OrcaX 마이페이지
  <span id="userLevel" style="font-size:1.08rem; color:#19713c; margin-left:8px;">Lv. 1</span>
</h1>
<div style="text-align:center; color:#14807d; margin-bottom:1.3rem;">
    환영합니다!<br>
    아래는 회원님의 OrcaX 자산 및 가공식품 보관 현황입니다.
</div>

<!-- 🟦 출금신청 폼 (토큰 금액 입력 포함) -->
<div class="withdraw-form" id="withdrawFormBox">
  <h2>💸 출금신청</h2>
  <div class="tip">출금받을 <b>팬텀(솔라나) 지갑 주소</b>와 연락처, 이메일, <b>출금 토큰금액</b>을 입력해 주세요.<br/>신청시 관리자가 직접 확인 후 처리합니다.</div>
  <form id="withdrawForm" autocomplete="off">
    <label for="wNickname">닉네임</label>
    <input type="text" id="wNickname" name="nickname" required disabled>
    <label for="wEmail">이메일</label>
    <input type="email" id="wEmail" name="email" placeholder="example@email.com" required>
    <label for="wPhone">전화번호</label>
    <input type="tel" id="wPhone" name="phone" placeholder="010-1234-5678" required>
    <label for="wWallet">팬텀(솔라나) 지갑주소</label>
    <input type="text" id="wWallet" name="wallet" placeholder="팬텀(Phantom) SOL 주소 입력" required>
    <label for="wAmount">출금할 ORCX 토큰 수량</label>
    <input type="number" id="wAmount" name="amount" min="1" step="1" required>
    <button type="submit">출금신청</button>
    <div class="result-msg" id="withdrawResult"></div>
  </form>
</div>

<div id="myStorage">
<h2>🗃️ 내 보관 창고 <span style="font-size:0.95rem;">(가공식품 현황)</span></h2>
<table id="storageTable">
<thead>
<tr>
<th>제품명</th>
<th>보유 수량</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
<script>
(() => {
  const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io';
  const kakaoId  = localStorage.getItem('kakaoId') || localStorage.getItem('kakaoID') || '';
  const nickname = localStorage.getItem('nickname') || localStorage.getItem('nick') || '';
  const pick = (ids) => ids.map(id => document.getElementById(id)).find(Boolean);
  const set  = (ids, v) => { const el = pick(ids); if (el) el.textContent = String(Number(v||0)); };

  // 닉네임
  set(['nick','nickname','wNickname'], nickname);

  // 마이페이지 자산
  fetch(`${API_BASE}/api/mypage/compat?kakaoId=${encodeURIComponent(kakaoId)}&t=${Date.now()}`)
    .then(r => r.json())
    .then(d => {
      const inv = d.inventory || {};
      set(['tokenBalance','r-tokens','tokens','balance'], d.tokens);
      set(['r-water','water'], inv.water);
      set(['r-fert','fertilizer'], inv.fertilizer);
      set(['seedPotato','r-seedPotato','seed_potato','seed-potato'], inv.seedPotato);
      set(['seedBarley','r-seedBarley','seed_barley','seed-barley'], inv.seedBarley);
      set(['userLevel'], d.level || 1);
    })
    .catch(console.warn);
})();
</script>


</body>
</html>
