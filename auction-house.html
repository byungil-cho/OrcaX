<script>
(() => {
  const API = 'https://climbing-wholly-grouper.jp.ngrok.io';
  const kakaoId  = localStorage.getItem('kakaoId') || localStorage.getItem('kakaoID') || '';
  const nickname = localStorage.getItem('nickname') || localStorage.getItem('nick') || '';

  const setNum = (ids, v) => ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = Number(v ?? 0);
  });
  const setText = (ids, v) => ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.value = v || '';
    else el.textContent = v || '';
  });

  // 닉네임(문자)
  setText(['nickname','topNick','wNickname'], nickname);

  // 헤더 자산(모든 페이지 공통) — 서버 호환 엔드포인트로 고정
  fetch(`${API}/api/mypage/compat?kakaoId=${encodeURIComponent(kakaoId)}&t=${Date.now()}`)
    .then(r => r.json())
    .then(d => {
      const inv = d.inventory || {};
      setNum (['tokenBalance','topTokens','tokens'], d.tokens);
      setNum (['water','r-water'],       inv.water);
      setNum (['fertilizer','r-fert'],   inv.fertilizer);
      setNum (['seedPotato','r-seedPotato'], inv.seedPotato);
      setNum (['seedBarley','r-seedBarley'], inv.seedBarley);
      setText(['userLevel'], String(d.level ?? 1));
    })
    .catch(console.warn);
})();
</script>
