<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>🌽 OrcaX 농장 제품 거래소</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>
    body { font-family: 'Arial', sans-serif; background: #f7f7f7; padding: 1rem; margin: 0; }
    h1, h2 { text-align: center; color: #2e2e2e; margin: 1rem 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; font-size: 0.9rem; }
    th { background-color: #efefef; }
    #notice { margin-top: 1rem; color: #555; text-align: center; }
    #myStorage { margin-top: 2rem; }
    #userInfo {
      position: sticky; top: 0; z-index: 999;
      background: #fff; padding: 0.5rem 1rem;
      border-bottom: 2px solid #eee;
      font-size: 0.95rem; text-align: right;
    }
    button {
      margin: 1rem auto; display: block;
      padding: 0.6rem 1.2rem; font-size: 1rem;
      background: #4CAF50; color: white; border: none;
      border-radius: 5px; cursor: pointer;
    }
    button:hover { background-color: #45a049; }
    @media screen and (max-width: 600px) {
      th, td { font-size: 0.75rem; padding: 0.4rem; }
      button { font-size: 0.9rem; padding: 0.5rem 1rem; }
    }
  </style>
</head>
<body>
<div id="userInfo">
    👤 <span id="nickname">닉네임</span> | 💰 <span id="tokenBalance">0</span> ORCAX
  </div>
<h1>🌽 OrcaX 농장 제품 거래소</h1><p onclick="location.href='orcax-farm_000.html'" style="text-align:center; margin-top:-0.5rem; font-weight:bold; cursor:pointer; color:#4CAF50;">🏠 처음으로 돌아가기</p>
<table id="priceTable">
<thead>
<tr>
<th>제품명</th>
<th>판매량</th>
<th>시세 (토큰)</th>
</tr>
</thead>
<tbody></tbody>
</table>
<p id="notice"></p>
<div id="myStorage">
<h2>🐋 <span id="userFarmTitle"></span> 보관 창고 <span style="font-size:0.9rem;">(개인 전용 창고)</span></h2>
<table id="storageTable">
<thead>
<tr>
<th>선택</th>
<th>제품명</th>
<th>보유 수량</th>
</tr>
</thead>
<tbody></tbody>
</table>
<button onclick="goToAdmin()">🔐 관리자 전용 페이지</button>
</div>
<script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const kakaoId = localStorage.getItem("kakaoId") || "익명손님";
    const farmName = localStorage.getItem("farmName") || "내 농장";
    const nickname = localStorage.getItem("nickname") || "사용자";

    async function fetchMarketData() {
      try {
        const res = await fetch(`${API_BASE}/api/market/prices`);
        const data = await res.json();
        const tbody = document.querySelector("#priceTable tbody");
        tbody.innerHTML = "";

        data.prices.forEach(item => {
          const row = `<tr><td>${item.type}</td><td>${item.count}</td><td>${item.price}</td></tr>`;
          tbody.insertAdjacentHTML("beforeend", row);
        });

        document.getElementById("notice").textContent = data.notice;
      } catch (e) {
        console.error("시세 불러오기 실패:", e);
        document.getElementById("notice").textContent = "시세 정보를 불러오지 못했습니다.";
      }
    }

    async function fetchMyStorage() {
      try {
        const res = await fetch(`${API_BASE}/api/storage/${nickname}`);
        const data = await res.json();
        const tbody = document.querySelector("#storageTable tbody");
        tbody.innerHTML = "";

        data.forEach(item => {
          const row = `<tr>
            <td><input type='checkbox' name='product' value='${item.type}' data-count='${item.count}'></td>
            <td>${item.type}</td>
            <td>${item.count}</td>
          </tr>`;
          tbody.insertAdjacentHTML("beforeend", row);
        });
      } catch (e) {
        console.error("보관소 불러오기 실패:", e);
        const tbody = document.querySelector("#storageTable tbody");
        tbody.innerHTML = `<tr><td colspan='3'>불러오기 실패</td></tr>`;
      }
    }

    async function fetchTokenBalance() {
      try {
        const res = await fetch(`${API_BASE}/api/user/token/${kakaoId}`);
        const data = await res.json();
        document.getElementById("tokenBalance").textContent = data.token || 0;
      } catch (e) {
        console.error("토큰 잔액 불러오기 실패:", e);
      }
    }

    async function sellSelectedItems() {
      const checkboxes = document.querySelectorAll("input[name='product']:checked");
      for (const cb of checkboxes) {
        const type = cb.value;
        const count = parseInt(cb.dataset.count);
        await fetch(`${API_BASE}/api/market/sell`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId, type, count })
        });
      }
      await fetchMyStorage();
      await fetchTokenBalance();
    }

    document.getElementById("userFarmTitle").textContent = farmName;
    document.getElementById("nickname").textContent = nickname;
    fetchMarketData();
    fetchMyStorage();
    fetchTokenBalance();
    setInterval(fetchMarketData, 60000);
    setInterval(fetchMyStorage, 60000);
    setInterval(fetchTokenBalance, 60000);
  
function goToAdmin() {
  const pw = prompt("관리자 비밀번호를 입력하세요:");
  if (pw === "7788") {
    location.href = "admin-users.html";
  } else {
    alert("비밀번호가 틀렸습니다.");
  }
}
</script>
</body>
</html>
