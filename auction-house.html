<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaX 경매장</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .user-section {
      margin-bottom: 2rem;
      background: #fff;
      padding: 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
    }
    .market-data {
      background: #fff;
      padding: 1rem;
      margin-bottom: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
    }
    .user-data {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      width: 300px;
      background: #fff;
      padding: 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      z-index: 10;
    }
    .token-display {
      font-weight: bold;
      color: #00695c;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.75rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    button {
      padding: 0.5rem 1rem;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <header>
    <h1>OrcaX 종합 경매 데이터실</h1>
    <p class="token-display">보유 ORCX: <span id="userToken">0</span> 토큰</p>
  </header>

  <section class="user-section">
    <button onclick="loadUserData()">내 정보 불러오기</button>
  </section>

  <section class="market-data">
    <h2>실시간 종합 시세</h2>
    <table id="marketItems">
      <tr><th>제품명</th><th>총 수량</th><th>현재 시세</th></tr>
      <!-- 전체 시장 데이터 렌더링 -->
    </table>
  </section>

  <div class="user-data" id="userData">
    <h3>내 보유 품목</h3>
    <table id="userItems">
      <tr><th>제품명</th><th>수량</th><th>시세</th><th>판매</th></tr>
      <!-- 유저 품목 목록이 여기에 렌더됨 -->
    </table>
  </div>

  <script>
    function loadUserData() {
      alert("여기서 서버에서 로그인된 유저 데이터를 불러와야 합니다.");
      // document.getElementById("userData").style.display = "block"; // 필요 시 동적 표시
    }
  </script>
</body>
</html>
