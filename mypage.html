<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="./js/pung.module.js"></script>
</head>

<body>
  <div class="mypage">
    <h1>🌽 마이페이지</h1>
    <div class="info">
      <p>닉네임: <span id="nickname">로딩중...</span></p>
      <p>카카오 ID: <span id="kakao">-</span></p>
      <p>현재 ORCX: <span id="orcx">0</span></p>
      <p>옥수수 등급: <span id="cornGrade">-</span></p>
    </div>

    <div class="withdraw">
      <h3>출금 신청</h3>
      <!-- 기존 출금 UI 여기에 위치 -->
    </div>

    <div class="deposit" style="margin-top:10px; font-size: 14px; color: #444;">
      👉 <a href="/admin/loan-request.html?kakaoId=" id="depositLink">입금(대출) 신청하기</a>
    </div>
  </div>

  <script>
    async function loadUserData() {
      const kakaoId = localStorage.getItem("kakaoId") || "testUser";
      const nickname = localStorage.getItem("nickname") || "사용자";

      document.getElementById("nickname").textContent = nickname;
      document.getElementById("kakao").textContent = kakaoId;

      document.getElementById("depositLink").href = "/admin/loan-request.html?kakaoId=" + kakaoId;

      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId })
        });

        const data = await res.json();
        const orcx = data.user?.orcx || 0;
        const grade = data.user?.cornGrade || "YELLOW";

        document.getElementById("orcx").textContent = orcx;
        document.getElementById("cornGrade").textContent = grade;

        localStorage.setItem("cornGrade", grade);
      } catch (err) {
        alert("데이터 로드 실패: " + err.message);
      }
    }

    loadUserData();
  </script>
</body>

</html>
