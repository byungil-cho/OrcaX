<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OrcaX 마이페이지</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
    <style>
      body {
        background: url('img/mypage-bg.png') no-repeat center center fixed;
        background-size: cover;
        color: white;
      }
      main.container {
        padding: 4rem 2rem;
        background-color: rgba(0, 0, 0, 0.4);
        border-radius: 1rem;
        margin-top: 2rem;
      }
      .asset, .loan, .withdraw {
        padding: 1.5rem;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 1rem;
        margin-bottom: 2rem;
      }
      .buttons {
        margin-top: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav class="container-fluid">
      <ul>
        <li><strong>🐧 OrcaX 마이페이지</strong></li>
      </ul>
      <ul>
        <li><a href="index9.html">홈으로</a></li>
        <li><a href="#">농장 밖으로</a></li>
        <li><a href="#">📘 게임설명</a></li>
      </ul>
    </nav>
    <main class="container">
      <div class="grid">
        <section class="asset">
          <hgroup>
            <h2>유저님 보유 자산</h2>
            <h3>Assets</h3>
          </hgroup>
          <p>💰 토큰: <strong id="orcx">-</strong></p>
          <p>💧 물: <strong id="water">-</strong> / 💩 거름: <strong id="fertilizer">-</strong></p>
        </section>

        <section class="loan">
          <hgroup>
            <h2>대출 현황</h2>
            <h3>Loan Status</h3>
          </hgroup>
          <p>📦 현재 대출: <strong id="loanAmount">-</strong></p>
          <p>📈 이자: <strong id="interestRate">-</strong></p>
          <button role="button">💳 상환하기</button>
        </section>

        <section class="withdraw">
          <hgroup>
            <h2>출금 신청</h2>
            <h3>Withdraw</h3>
          </hgroup>
          <form class="grid">
            <input type="text" name="wallet" placeholder="솔라나 지갑 주소" required />
            <button type="submit" id="withdrawBtn" onclick="event.preventDefault()">💸 출금 신청</button>
          </form>
          <p id="withdrawNotice" style="color: #ff6666;"></p>
          <small>※ 50,000 토큰 이상 출금 가능</small>
        </section>
      </div>
    </main>

    <footer class="container">
      <small><a href="#">이용약관</a> • <a href="#">개인정보</a></small>
    </footer>

    <script>
      const BASE_API = 'https://climbing-wholly-grouper.jp.ngrok.io';
      const kakaoId = localStorage.getItem('kakaoId');
      const URL_USERDATA = BASE_API + '/api/userdata';

      if (!kakaoId) {
        alert('로그인이 필요합니다.');
        window.location.href = 'index9.html';
      } else {
        fetch(URL_USERDATA, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId })
        })
        .then(r => r.json())
        .then(data => {
          const user = data?.user;
          if (!user) throw new Error('유저 없음');

          document.querySelector('.asset h2').textContent = `${user.nickname || '유저'}님 보유 자산`;
          document.getElementById('orcx').textContent = user.orcx || 0;
          document.getElementById('water').textContent = user.inventory?.water || 0;
          document.getElementById('fertilizer').textContent = user.inventory?.fertilizer || 0;
          document.getElementById('loanAmount').textContent = user.loan?.amount || '0 토큰';
          document.getElementById('interestRate').textContent = user.loan?.interest ? `${user.loan.interest}% / 일` : '0% / 일';

          // 출금 제한 처리
          if ((user.loan?.amount || 0) > 0) {
            const btn = document.getElementById('withdrawBtn');
            const msg = document.getElementById('withdrawNotice');
            btn.disabled = true;
            msg.textContent = '📛 현재 대출이 있어 출금할 수 없습니다.';
          }
        })
        .catch(err => {
          alert('유저 정보를 불러올 수 없습니다.');
          console.warn(err);
        });
      }
    </script>
  </body>
</html>
