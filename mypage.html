<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 마이페이지</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@1.5.10/css/pico.min.css">
  <script type="module" src="./js/pung.module.js"></script>
</head>

<body>
  <main class="container">
    <h1>🌽 OrcaX 마이페이지</h1>

    <section>
      <hgroup>
        <h2>회원 정보</h2>
        <h3>내 정보 확인</h3>
      </hgroup>
      <ul>
        <li>닉네임: <strong id="nickname">-</strong></li>
        <li>카카오 ID: <strong id="kakao">-</strong></li>
        <li>보유 ORCX: <strong id="orcx">0</strong></li>
        <li>옥수수 등급: <strong id="cornGrade">YELLOW</strong></li>
      </ul>
    </section>

    <section>
      <hgroup>
        <h2>출금 신청</h2>
        <h3>Withdraw</h3>
      </hgroup>
      <form>
        <label for="amount">출금할 ORCX</label>
        <input type="number" id="amount" name="amount" placeholder="1000" required>
        <button type="submit">출금 요청</button>
      </form>
    </section>

    <section class="deposit">
      <hgroup>
        <h2>입금 신청</h2>
        <h3>Deposit (Loan)</h3>
      </hgroup>
      <p>자금이 부족한 경우 OrcaX로부터 대출을 신청할 수 있습니다. 신청은 관리자에게 전달되어 확인 후 승인됩니다.</p>
      <form onsubmit="submitLoanRequest(event)">
        <label for="loanAmount">신청할 대출 금액</label>
        <input type="number" id="loanAmount" name="loanAmount" placeholder="1000" required>
        <button type="submit">📥 대출 신청하기</button>
      </form>
      <small id="loanStatus"></small>
    </section>
  </main>

  <script>
    async function loadUserData() {
      const kakaoId = localStorage.getItem("kakaoId") || "testUser";
      const nickname = localStorage.getItem("nickname") || "사용자";

      document.getElementById("nickname").textContent = nickname;
      document.getElementById("kakao").textContent = kakaoId;

      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId })
        });

        const data = await res.json();
        const orcx = data.user?.orcx || 0;
        const grade = data.user?.cornGrade || "YELLOW";

        document.getElementById("orcx").textContent = orcx;
        document.getElementById("cornGrade").textContent = grade;

        localStorage.setItem("cornGrade", grade);
      } catch (err) {
        alert("데이터 로드 실패: " + err.message);
      }
    }

    async function submitLoanRequest(event) {
      event.preventDefault();
      const kakaoId = localStorage.getItem("kakaoId");
      const amount = parseInt(document.getElementById("loanAmount").value);

      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/request-loan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId, amount })
        });

        if (res.ok) {
          document.getElementById("loanStatus").textContent = `✅ ${amount} ORCX 대출 신청이 전송되었습니다.`;
        } else {
          document.getElementById("loanStatus").textContent = "❌ 신청 실패. 다시 시도해주세요.";
        }
      } catch (err) {
        document.getElementById("loanStatus").textContent = "❌ 네트워크 오류: " + err.message;
      }
    }

    loadUserData();
  </script>
</body>

</html>
