<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="./js/pung.module.js"></script>
  <style>
    .loan-request {
      margin-top: 20px;
      padding: 15px;
      background-color: #f3f3f3;
      border-radius: 8px;
    }
    .loan-request button {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .loan-request button:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <div class="mypage">
    <h1>🌽 마이페이지</h1>
    <div class="info">
      <p>닉네임: <span id="nickname">로딩중...</span></p>
      <p>카카오 ID: <span id="kakao">-</span></p>
      <p>현재 ORCX: <span id="orcx">0</span></p>
      <p>옥수수 등급: <span id="cornGrade">-</span></p>
    </div>

    <div class="loan-request">
      <h3>💰 대출 신청</h3>
      <p>필요한 경우 대출을 신청하실 수 있습니다. 신청 시 관리자가 확인 후 승인합니다.</p>
      <button onclick="requestLoan()">관리자에게 대출 신청</button>
    </div>
  </div>

  <script>
    async function loadUserData() {
      const kakaoId = localStorage.getItem("kakaoId") || "testUser";
      const nickname = localStorage.getItem("nickname") || "사용자";

      document.getElementById("nickname").textContent = nickname;
      document.getElementById("kakao").textContent = kakaoId;

      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId })
        });

        const data = await res.json();
        const orcx = data.user?.orcx || 0;
        const grade = data.user?.cornGrade || "YELLOW";

        document.getElementById("orcx").textContent = orcx;
        document.getElementById("cornGrade").textContent = grade;

        localStorage.setItem("cornGrade", grade);
      } catch (err) {
        alert("데이터 로드 실패: " + err.message);
      }
    }

    function requestLoan() {
      // 관리자 페이지로 리디렉션 또는 fetch 호출 (예시: loan request API)
      window.location.href = "/admin/loan-request.html?kakaoId=" + localStorage.getItem("kakaoId");
    }

    loadUserData();
  </script>
</body>

</html>
