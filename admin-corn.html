<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>옥수수 등급/보상 설정</title>
<style>
  body{font-family:system-ui,Segoe UI,Roboto,Pretendard,sans-serif;padding:16px;background:#0b1020;color:#e6f0ff}
  h1{font-size:20px;margin:0 0 12px}
  .card{background:#0e152b;border:1px solid #213156;border-radius:12px;padding:14px;margin:10px 0}
  label{display:block;font-size:12px;color:#9fb6d6;margin:6px 0 2px}
  input{width:100%;padding:8px;border:1px solid #213156;border-radius:8px;background:#0a1328;color:#e6f0ff}
  .grid{display:grid;gap:10px}
  .cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  button{padding:10px 14px;border-radius:10px;border:1px solid #213156;background:#142044;color:#e6f0ff;cursor:pointer}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:#9fb6d6}
</style>
</head>
<body>
  <h1>옥수수 등급/보상 설정 (A~F)</h1>

  <div class="card">
    <div class="row">
      <div>
        <label>관리자 비밀번호</label>
        <input id="pwd" type="password" placeholder="관리자 비밀번호 (기본: 2025)">
      </div>
      <button id="btn-load">불러오기</button>
      <button id="btn-save">저장하기</button>
      <span id="msg" class="muted"></span>
    </div>
  </div>

  <div id="grades"></div>

  <div class="card">
    <h3>생산 수량 분배 프리셋 (최고,중간,최저,팝콘)</h3>
    <div class="grid cols-4">
      <div>
        <label>5개</label>
        <input id="p5" placeholder="예: 2,1,1,1">
      </div>
      <div>
        <label>7개</label>
        <input id="p7" placeholder="예: 1,3,2,1">
      </div>
      <div>
        <label>9개</label>
        <input id="p9" placeholder="예: 1,3,4,1">
      </div>
    </div>
  </div>

<script>
const API_BASE = (localStorage.getItem('orcax:BASE_API') || 'https://climbing-wholly-grouper.jp.ngrok.io').replace(/\/+$/,'').replace(/\/api\/?$/,'');
const ADMIN_GET = API_BASE + '/api/admin/corn-config';
const ADMIN_SET = API_BASE + '/api/admin/corn-config';

const GLIST = ['A','B','C','D','E','F'];

function el(tag, attrs={}, html=''){
  const d = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) d.setAttribute(k, v);
  d.innerHTML = html;
  return d;
}

function gradeCard(g, data){
  const wrap = el('div', { class:'card' });
  wrap.appendChild(el('h3', {}, `등급 ${g}`));
  const grid = el('div', { class:'grid cols-3' });
  grid.appendChild(el('div', {}, `
    <label>토큰 확률 (0~1)</label>
    <input id="g-${g}-tr" value="${data?.tokenRate ?? ''}">
  `));
  grid.appendChild(el('div', {}, `
    <label>팝콘 확률 (0~1)</label>
    <input id="g-${g}-pr" value="${data?.popcornRate ?? ''}">
  `));
  grid.appendChild(el('div', {}, `
    <label>토큰 테이블 (최고,중간,최저)</label>
    <input id="g-${g}-tt" value="${(data?.tokenTable||[]).join(',')}">
  `));
  wrap.appendChild(grid);
  return wrap;
}

async function jfetch(u, opt={}){
  const r = await fetch(u, { ...opt, headers: { 'Content-Type':'application/json', ...(opt.headers||{}) } });
  const t = await r.text();
  const isJson = (r.headers.get('content-type')||'').includes('application/json');
  const d = t ? (isJson ? JSON.parse(t) : { raw:t }) : {};
  if(!r.ok) throw Object.assign(new Error('HTTP '+r.status), { data:d });
  return d;
}

async function load(){
  document.getElementById('msg').textContent = '불러오는 중...';
  const d = await jfetch(ADMIN_GET);
  const cfg = d.config || {};
  const box = document.getElementById('grades');
  box.innerHTML = '';
  GLIST.forEach(g => box.appendChild(gradeCard(g, cfg.grades?.[g])));

  document.getElementById('p5').value = (cfg.preset?.['5']||[]).join(',');
  document.getElementById('p7').value = (cfg.preset?.['7']||[]).join(',');
  document.getElementById('p9').value = (cfg.preset?.['9']||[]).join(',');
  document.getElementById('msg').textContent = '불러오기 완료';
}

async function save(){
  const pwd = document.getElementById('pwd').value || '';
  const grades = {};
  GLIST.forEach(g=>{
    const tr = parseFloat(document.getElementById(`g-${g}-tr`).value);
    const pr = parseFloat(document.getElementById(`g-${g}-pr`).value);
    const tt = (document.getElementById(`g-${g}-tt`).value||'').split(',').map(s=>parseInt(s.trim(),10));
    grades[g] = { tokenRate: tr, popcornRate: pr, tokenTable: tt };
  });
  const p5 = document.getElementById('p5').value.split(',').map(s=>parseInt(s.trim(),10));
  const p7 = document.getElementById('p7').value.split(',').map(s=>parseInt(s.trim(),10));
  const p9 = document.getElementById('p9').value.split(',').map(s=>parseInt(s.trim(),10));

  const body = JSON.stringify({
    password: pwd,
    updatedBy: 'admin-page',
    grades, preset: { "5":p5, "7":p7, "9":p9 }
  });

  document.getElementById('msg').textContent = '저장 중...';
  await jfetch(ADMIN_SET, { method:'POST', body });
  document.getElementById('msg').textContent = '저장 완료';
}

document.getElementById('btn-load').onclick = load;
document.getElementById('btn-save').onclick = save;
load().catch(e=>{ document.getElementById('msg').textContent='로드 실패'; console.error(e); });
</script>
</body>
</html>
