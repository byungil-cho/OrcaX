
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공지사항</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #fff; color: #222; max-width: 800px; margin: auto; }
    h1 { color: #004a99; text-align: center; }
    .notice { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #f9f9f9; }
    .notice h2 { margin: 0 0 10px 0; }
    .notice p { margin: 5px 0; }
    .notice small { color: #666; }
  </style>
</head>
<body>
  <h1>📢 공지사항</h1>
  <div id="notices"></div>

  <script>
    fetch("https://orcax-franchise-backend.onrender.com/notices")
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById("notices");
        if (data.length === 0) {
          container.innerHTML = "<p>등록된 공지사항이 없습니다.</p>";
          return;
        }

        data.forEach(notice => {
          const div = document.createElement("div");
          div.className = "notice";
          div.innerHTML = `
            <h2>\${notice.title}</h2>
            <p>\${notice.content}</p>
            <small>📅 \${new Date(notice.date).toLocaleDateString("ko-KR", {
              year: 'numeric', month: 'long', day: 'numeric'
            })}</small>
          `;
          container.appendChild(div);
        });
      })
      .catch(error => {
        document.getElementById("notices").innerHTML = "<p style='color:red;'>공지 불러오기 실패: " + error.message + "</p>";
      });
  </script>
</body>
</html>
