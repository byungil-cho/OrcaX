
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🍿 뻥튀기</title>
  <style>
    body { background: #0e0f11; color: #eaeaea; font-family: sans-serif; margin: 0; padding: 20px; }
    .wrap { max-width: 720px; margin: auto; }
    .card { background: #18181b; padding: 20px; border-radius: 16px; margin-top: 20px; }
    .result { margin-top: 10px; border: 1px dashed #2a2a2e; padding: 10px; border-radius: 12px; background: #121214; }
    button { margin-top: 10px; padding: 10px 18px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
    .ready { color: #22c55e; font-weight: bold; }
    .not-ready { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>🍿 뻥튀기</h2>
    <div class="card">
      <p>닉네임: <span id="nickname">-</span></p>
      <p>카카오ID: <span id="kakaoId">-</span></p>
      <p>ORCX: <span id="v-orcx">0</span></p>
      <p>소금: <span id="v-salt">0</span></p>
      <p>설탕: <span id="v-sugar">0</span></p>
      <p>옥수수: <span id="v-corn">0</span></p>
      <div class="result" id="resultBox">데이터 로딩 중…</div>
      <button id="btnRun" disabled>🌽 뻥튀기 실행</button>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const set = (id, value) => { $(id).textContent = value; };

    const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io';
    const kakaoId = localStorage.getItem('kakaoId');

    if (!kakaoId) {
      alert('로그인이 필요합니다.');
      window.location.href = 'index9.html';
    } else {
      set('kakaoId', kakaoId);
      fetch(API_BASE + '/api/user/resources', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kakaoId })
      })
      .then(r => r.json())
      .then(data => {
        const user = data?.user;
        const res = data?.resources;
        if (!user || !res) throw new Error('불완전한 데이터');

        set('nickname', user.nickname || '-');
        set('v-orcx', user.orcx || 0);
        set('v-salt', res.salt || 0);
        set('v-sugar', res.sugar || 0);
        set('v-corn', res.corn || 0);

        const ready = (user.orcx >= 30 && res.salt > 0 && res.sugar > 0 && res.corn > 0);
        $('resultBox').innerHTML = ready
          ? '<span class="ready">✅ 준비 완료 - 뻥튀기 가능</span>'
          : '<span class="not-ready">❌ 재료 부족 - ORCX 30 + 소금 + 설탕 + 옥수수 필요</span>';
        $('btnRun').disabled = !ready;
      })
      .catch(err => {
        $('resultBox').textContent = '🚨 데이터를 불러올 수 없습니다.';
        console.error(err);
      });
    }

    $('btnRun').addEventListener('click', () => {
      $('resultBox').textContent = '🎉 뻥튀기 실행됨! (로직 연결 필요)';
    });
  </script>
</body>
</html>
