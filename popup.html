<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaX 관리자 페이지</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@1.5.10/css/pico.min.css">
  <script type="module" src="./js/admin.js"></script>
</head>

<body>
  <main class="container">
    <h1>🛠️ OrcaX 관리자 패널</h1>

    <nav>
      <ul>
        <li><a href="#" id="tab-withdraw" role="button">출금 요청</a></li>
        <li><a href="#" id="tab-deposit" role="button">입금 요청</a></li>
        <li><a href="#" id="tab-loan-request" role="button">대출 신청</a></li>
        <li><a href="#" id="tab-loan" role="button">대출 현황표</a></li>
      </ul>
    </nav>

    <section id="admin-content">
      <div id="content-withdraw" class="tab-content" hidden>
        <h2>출금 요청 내역</h2>
        <table>
          <thead>
            <tr>
              <th>사용자</th>
              <th>요청 금액</th>
              <th>요청일</th>
              <th>처리</th>
            </tr>
          </thead>
          <tbody id="withdraw-list"></tbody>
        </table>
      </div>

      <div id="content-deposit" class="tab-content" hidden>
        <h2>입금 요청 내역</h2>
        <form onsubmit="submitAdminDeposit(event)">
          <label for="depositUser">사용자 카카오 ID</label>
          <input type="text" id="depositUser" name="depositUser" required>

          <label for="depositAmount">입금 금액 (최소 5만 ORCX)</label>
          <input type="number" id="depositAmount" name="depositAmount" min="50000" required>

          <button type="submit">입금 등록</button>
        </form>

        <hr>

        <table>
          <thead>
            <tr>
              <th>사용자</th>
              <th>입금 금액</th>
              <th>요청일</th>
              <th>처리</th>
            </tr>
          </thead>
          <tbody id="deposit-list"></tbody>
        </table>
      </div>

      <div id="content-loan-request" class="tab-content" hidden>
        <h2>대출 신청 내역</h2>
        <table>
          <thead>
            <tr>
              <th>사용자</th>
              <th>신청 금액</th>
              <th>신청일</th>
              <th>승인/거절</th>
            </tr>
          </thead>
          <tbody id="loan-request-list"></tbody>
        </table>
      </div>

      <div id="content-loan" class="tab-content">
        <h2>진행 중인 대출 현황</h2>
        <table>
          <thead>
            <tr>
              <th>사용자</th>
              <th>대출 금액</th>
              <th>이자율</th>
              <th>남은 ORCX</th>
              <th>상환 상태</th>
            </tr>
          </thead>
          <tbody id="loan-status-list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    function submitAdminDeposit(event) {
      event.preventDefault();
      const kakaoId = document.getElementById("depositUser").value;
      const amount = parseInt(document.getElementById("depositAmount").value);

      if (amount < 50000) {
        alert("입금 금액은 최소 5만 ORCX 이상이어야 합니다.");
        return;
      }

      fetch("/api/admin/deposit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kakaoId, amount })
      }).then(res => {
        if (res.ok) {
          alert("입금 요청이 등록되었습니다.");
          document.getElementById("depositUser").value = "";
          document.getElementById("depositAmount").value = "";
          loadDeposits();
        } else {
          alert("입금 요청 실패.");
        }
      }).catch(err => {
        alert("입금 오류: " + err.message);
      });
    }
  </script>
</body>

</html>
