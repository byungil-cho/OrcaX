<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌽 OrcaX 팝업 시뮬레이터</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="pung.module.js"></script>
</head>
<body>
  <main class="container">
    <h1>🌽 OrcaX 팝업 시뮬레이터</h1>

    <section class="user-info">
      <div><strong>닉네임:</strong> <span id="nickname">-</span></div>
      <div><strong>카카오 ID:</strong> <span id="kakaoId">-</span></div>
      <div><strong>현재 ORCX:</strong> <span id="orcx">0</span></div>
    </section>

    <section class="resource-status">
      <h2>📦 자원 현황</h2>
      <ul>
        <li>옥수수: <span id="corn">0</span></li>
        <li>소금: <span id="salt">0</span></li>
        <li>설탕: <span id="sugar">0</span></li>
      </ul>
    </section>

    <section class="resource-input">
      <h2>⚙️ 자원 투입</h2>
      <label>옥수수 <input type="number" id="input-corn" min="0" value="0" /></label>
      <label>소금 <input type="number" id="input-salt" min="0" value="0" /></label>
      <label>설탕 <input type="number" id="input-sugar" min="0" value="0" /></label>
    </section>

    <section class="action">
      <button id="run-btn">🔥 뻥튀기 실행</button>
      <div id="status" class="status"></div>
    </section>
  </main>
</body>
</html>
