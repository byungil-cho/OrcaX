
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🍿 뻥튀기 상태 확인 포함</title>
  <style>
    body { background: #0e0f11; color: #eaeaea; font-family: sans-serif; margin: 0; padding: 20px; }
    .wrap { max-width: 720px; margin: auto; }
    .card { background: #18181b; padding: 20px; border-radius: 16px; margin-top: 20px; }
    .result, .reward { margin-top: 10px; border: 1px dashed #2a2a2e; padding: 10px; border-radius: 12px; background: #121214; }
    button { margin-top: 10px; padding: 10px 18px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
    .ready { color: #22c55e; font-weight: bold; }
    .not-ready { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>🍿 뻥튀기 (서버상태+로그인체크)</h2>

    <div>🔌 서버 상태: <span id="serverStatus">확인 중...</span></div>
    <div>👤 로그인 상태: <span id="loginStatus">확인 중...</span></div>

    <div class="card">
      <p>닉네임: <span id="nickname">-</span></p>
      <p>카카오ID: <span id="kakaoId">-</span></p>
      <p>ORCX: <span id="v-orcx">0</span></p>
      <p>소금: <span id="v-salt">0</span></p>
      <p>설탕: <span id="v-sugar">0</span></p>
      <p>옥수수: <span id="v-corn">0</span></p>
      <p>누적 토큰 획득: <span id="v-earned">0</span></p>
      <p>누적 팝콘 수량: <span id="v-popcorn">0</span></p>
      <div class="result" id="resultBox">데이터 로딩 대기중…</div>
      <button id="btnRun" disabled>🌽 뻥튀기 실행</button>
      <div class="reward" id="rewardBox">🎁 보상 내역 없음</div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const set = (id, v) => $(id).textContent = v;
    const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io';
    let user = {}, resources = {}, earnedToken = 0, earnedPopcorn = 0;

    async function checkServer() {
      try {
        const res = await fetch(API_BASE + '/ping');
        set('serverStatus', res.ok ? `연결됨 (${res.status})` : `응답 오류 (${res.status})`);
        return res.ok;
      } catch {
        set('serverStatus', '❌ 서버 연결 실패');
        return false;
      }
    }

    async function loadUserResources(kakaoId) {
      try {
        const res = await fetch(API_BASE + '/api/user/resources', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId })
        });
        const data = await res.json();
        user = data.user || {};
        resources = data.resources || {};
        set('nickname', user.nickname || '-');
        set('v-orcx', user.orcx || 0);
        set('v-salt', resources.salt || 0);
        set('v-sugar', resources.sugar || 0);
        set('v-corn', resources.corn || 0);
        set('v-earned', 0);
        set('v-popcorn', resources.popcorn || 0);
        const ready = (user.orcx >= 30 && resources.salt > 0 && resources.sugar > 0 && resources.corn > 0);
        $('resultBox').innerHTML = ready ? '<span class="ready">✅ 준비 완료 - 뻥튀기 가능</span>' : '<span class="not-ready">❌ 자원 부족</span>';
        $('btnRun').disabled = !ready;
      } catch {
        $('resultBox').textContent = '❌ 자원 로딩 실패';
      }
    }

    async function main() {
      const kakaoId = localStorage.getItem('kakaoId');
      set('kakaoId', kakaoId || '-');
      set('loginStatus', kakaoId ? '✅ 로그인됨' : '❌ 없음');
      if (!kakaoId) return;
      const serverOK = await checkServer();
      if (!serverOK) return;
      await loadUserResources(kakaoId);
    }

    $('btnRun').addEventListener('click', async () => {
      $('btnRun').disabled = true;
      $('resultBox').textContent = '🔥 실행 중...';
      const res = await fetch(API_BASE + '/api/popcorn/burn', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kakaoId: localStorage.getItem('kakaoId') })
      });
      const result = await res.json();
      if (result && result.success) {
        earnedToken += result.token;
        earnedPopcorn += result.popcorn;
        set('v-earned', earnedToken);
        set('v-popcorn', (resources.popcorn || 0) + earnedPopcorn);
        $('rewardBox').innerHTML = `🎁 토큰 +${result.token}, 팝콘 +${result.popcorn}`;
        $('resultBox').textContent = '✅ 완료';
      } else {
        $('rewardBox').innerHTML = '🚨 실패';
        $('resultBox').textContent = '❌ 오류';
      }
    });

    main();
  </script>
</body>
</html>
