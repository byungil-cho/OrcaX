<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뻥튀기 시민에이터</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .section {
      margin-top: 20px;
    }
    .label {
      font-weight: bold;
      margin-top: 10px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    input, select {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      margin-top: 15px;
      background-color: #0077cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .status {
      margin-top: 10px;
      color: green;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌽 뻥튀기 시민에이터</h1>

    <div class="section">
      <div class="label">닉네임: <span id="nickname">-</span></div>
      <div class="label">카카오 ID: <span id="kakao">-</span></div>
      <div class="label">현재 ORCX: <span id="orcx">0</span></div>
    </div>

    <div class="section">
      <div class="label">회원 자원 현황</div>
      <ul>
        <li>옥수수: <span id="water">0</span></li>
        <li>소금: <span id="salt">0</span></li>
        <li>설탕: <span id="sugar">0</span></li>
      </ul>
    </div>

    <div class="section">
      <div class="label">자원 투입</div>
      <div class="input-row">
        <input type="number" id="input-water" placeholder="옥수수" />
        <input type="number" id="input-salt" placeholder="소금" />
        <input type="number" id="input-sugar" placeholder="설탕" />
      </div>
      <div class="input-row">
        <select id="input-grade">
          <option value="A">A급</option>
          <option value="B">B급</option>
          <option value="C">C급</option>
          <option value="D">D급</option>
          <option value="E">E급</option>
          <option value="F">F급</option>
        </select>
        <label><input type="checkbox" id="input-loan" /> 대출 상태</label>
      </div>
      <button id="submit-button">🔥 뻥튀기 실행!</button>
      <div class="status" id="status">(초기화 대기중)</div>
    </div>
  </div>

  <script type="module">
    import { Pung } from 'https://byungil-cho.github.io/OrcaX/js/pung.module.js';

    const kakaoId = localStorage.getItem("kakaoId");
    const nickname = localStorage.getItem("nickname");

    if (!kakaoId || !nickname) {
      document.getElementById("status").textContent = "⚠️ 로그인 정보가 없습니다. index9.html에서 먼저 로그인 해주세요.";
    } else {
      document.getElementById("nickname").textContent = nickname;
      document.getElementById("kakao").textContent = kakaoId;

      document.getElementById("submit-button").addEventListener("click", () => {
        const water = parseInt(document.getElementById("input-water").value) || 0;
        const salt = parseInt(document.getElementById("input-salt").value) || 0;
        const sugar = parseInt(document.getElementById("input-sugar").value) || 0;
        const grade = document.getElementById("input-grade").value;
        const loan = document.getElementById("input-loan").checked;

        const result = Pung.pung({ kakaoId, water, salt, sugar, grade, loan });

        const output = [
          `✅ 뻥튀기 결과:`,
          `- 등급: ${result.grade}`,
          `- 수확 수량: ${result.count}`,
          `- 세전 합계: ${result.totalBeforeTax} ORCX`,
          `- 세후 지급: ${result.totalAfterTax} ORCX`,
          `- 대출 상태: ${result.loan ? "있음 (30% 공제)" : "없음"}`,
          `- 토큰 목록:`,
          ...result.tokens.map((t, i) => `   ${i + 1}. ${t.type} - ${t.value}`)
        ].join("\n");

        document.getElementById("status").textContent = output;
      });
    }
  </script>
</body>
</html>
