
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍿 팝업 최종 뻥튀기</title>
  <meta name="pung-api" content="">
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; padding: 20px; }
    .wrap { max-width: 720px; margin: auto; }
    .card { background: #18181b; border-radius: 16px; padding: 20px; margin-top: 20px; }
    .result, .reward { margin-top: 10px; padding: 10px; border-radius: 12px; background: #222; border: 1px dashed #444; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .ready { color: #22c55e; font-weight: bold; }
    .not-ready { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>🍿 팝업 최종 뻥튀기</h2>

    <div class="card">
      <p>닉네임: <span id="nickname">-</span></p>
      <p>카카오ID: <span id="kakaoId">-</span></p>
      <p>ORCX: <span id="v-orcx">0</span></p>
      <p>소금: <span id="v-salt">0</span></p>
      <p>설탕: <span id="v-sugar">0</span></p>
      <p>옥수수: <span id="v-corn">0</span></p>
      <p>누적 토큰 획득: <span id="v-earned">0</span></p>
      <p>누적 팝콘 수량: <span id="v-popcorn">0</span></p>
      <div class="result" id="resultBox">로딩 중...</div>
      <button id="btnRun" disabled>🌽 뻥튀기 실행</button>
      <div class="reward" id="rewardBox">🎁 보상 내역 없음</div>
    </div>
  </div>

  <script src="pung.module.js"></script>
  <script src="popup.js"></script>
</body>
</html>
