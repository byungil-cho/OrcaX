<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 OrcaX 뻥튀기 시뮬레이터</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="pung.module.js"></script>
</head>
<body>
  <main class="container">
    <h1>🎁 <span class="title-accent">OrcaX</span> 뻥튀기 시뮬레이터</h1>

    <section class="info-box">
      <div class="info-item">닉네임: <span id="nickname">-</span></div>
      <div class="info-item">카카오 ID: <span id="kakaoId">-</span></div>
      <div class="info-item">ORCX: <span id="orcx">0</span></div>
      <div class="info-item">소금: <span id="salt">0</span></div>
      <div class="info-item">설탕: <span id="sugar">0</span></div>
      <div class="info-item">옥수수: <span id="corn">0</span></div>
    </section>

    <section class="resource-ui">
      <h2>자원 투입</h2>
      <label>소금: <input type="number" id="input-salt" min="0" value="0"></label>
      <label>설탕: <input type="number" id="input-sugar" min="0" value="0"></label>
      <label>옥수수: <input type="number" id="input-corn" min="0" value="0"></label>
    </section>

    <section class="status-box">
      <div id="status" class="status-error">
        ❌ 초기화 실패. 콘솔 확인
      </div>
    </section>

    <section class="btn-box">
      <button id="run-btn">🌽 뻥튀기 실행</button>
    </section>
  </main>
</body>
</html>
