<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유저 정보 팝업</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 20px;
    }
    .status {
      padding: 10px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .status.connected { color: #0f0; }
    .status.disconnected { color: #f33; }
    .user-info {
      background: #222;
      padding: 15px;
      border-radius: 8px;
    }
    .user-info div { margin-bottom: 6px; }
    .label { font-weight: bold; color: #ccc; }
  </style>
</head>
<body>

  <div id="serverStatus" class="status">🔄 서버 상태 확인 중...</div>

  <div class="user-info">
    <div><span class="label">닉네임:</span> <span id="nickname">-</span></div>
    <div><span class="label">카카오 ID:</span> <span id="kakaoId">-</span></div>
    <div><span class="label">ORCX 토큰:</span> <span id="orcx">-</span></div>
    <div><span class="label">물:</span> <span id="water">-</span></div>
    <div><span class="label">거름:</span> <span id="fertilizer">-</span></div>
  </div>

  <script>
    const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io'; // 주인님 서버

    async function checkServerStatus() {
      try {
        const res = await fetch(API_BASE + '/api/ping');
        if (res.ok) {
          document.getElementById('serverStatus').textContent = '✅ 서버 연결됨';
          document.getElementById('serverStatus').className = 'status connected';
        } else {
          throw new Error('응답 비정상');
        }
      } catch (e) {
        document.getElementById('serverStatus').textContent = '❌ 서버 끊김';
        document.getElementById('serverStatus').className = 'status disconnected';
      }
    }

    async function loadUserInfo() {
      const kakaoId = localStorage.getItem('kakaoId');
      if (!kakaoId) {
        alert("카카오 로그인 정보가 없습니다.");
        return;
      }

      try {
        const res = await fetch(API_BASE + '/api/user/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId })
        });
        const data = await res.json();

        if (!data || !data.nickname) {
          throw new Error('유저 정보 없음');
        }

        document.getElementById('kakaoId').textContent = kakaoId;
        document.getElementById('nickname').textContent = data.nickname || '-';
        document.getElementById('orcx').textContent = data.wallet?.orcx ?? '-';
        document.getElementById('water').textContent = data.inventory?.water ?? '-';
        document.getElementById('fertilizer').textContent = data.inventory?.fertilizer ?? '-';

      } catch (e) {
        alert('❌ 유저 정보를 불러오는 데 실패했습니다.');
        console.error(e);
      }
    }

    // 초기 실행
    checkServerStatus();
    loadUserInfo();
  </script>
</body>
</html>
