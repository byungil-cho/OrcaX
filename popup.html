<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 시민에이터</title>
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
  <script>
    Kakao.init('YOUR_APP_KEY'); // 카카오 JavaScript 키
  </script>
  <script type="module" src="./pung.module.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    .info {
      margin-bottom: 20px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #fee500;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>OrcaX 시민에이터</h1>

  <div class="info">
    <p>닉네임: <span id="nickname">-</span></p>
    <p>카카오 ID: <span id="kakaoId">-</span></p>
    <p>현재 ORCX: <span id="orcx">0</span></p>
  </div>

  <button onclick="loginWithKakao()">카카오 로그인</button>

  <script>
    function loginWithKakao() {
      Kakao.Auth.login({
        success: function (authObj) {
          Kakao.API.request({
            url: '/v2/user/me',
            success: function (res) {
              const kakaoId = res.id;
              const nickname = res.properties.nickname;

              document.getElementById('nickname').textContent = nickname;
              document.getElementById('kakaoId').textContent = kakaoId;

              // ORCX 서버 연결 후 사용자 초기화
              const apiBase = 'https://climbing-wholly-grouper.jp.ngrok.io';
              const user = { orcx: 0, nickname };

              Pung.init({ kakaoId, user, corn: {}, apiBase });
            },
            fail: function (err) {
              console.error('카카오 사용자 정보 요청 실패:', err);
            },
          });
        },
        fail: function (err) {
          console.error('카카오 로그인 실패:', err);
        },
      });
    }
  </script>
</body>
</html>
