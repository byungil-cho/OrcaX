<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>옥수수 뻥튀기 - OrcaX</title>
  <style>
    body {
      background: linear-gradient(to bottom, #333 0%, #111 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    .popup-box {
      background: rgba(0,0,0,0.8);
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    .resource-info {
      margin: 1rem 0;
    }
    .animation-area {
      position: relative;
      height: 200px;
      margin: 1rem 0;
      overflow: hidden;
    }
    #cornImg {
      height: 80px;
      transition: transform 0.8s ease-out;
    }
    .pop-up {
      transform: translateY(-150px) scale(1.3);
    }
    #tokenRain {
      position: absolute;
      top: 0;
      left: 50%;
      width: 100px;
      height: 100%;
      pointer-events: none;
    }
    .token {
      position: absolute;
      width: 24px;
      height: 24px;
      background: gold;
      border-radius: 50%;
      animation: fall 1.5s linear forwards;
    }
    @keyframes fall {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(250px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="popup-box">
    <h2>🍿 뻥튀기 시뮬레이터</h2>
    <p>닉네임: <strong id="nickname">법고래</strong></p>
    <div class="resource-info">
      🌽 옥수수(<span id="cornType">노랑</span>) 🧂 <span id="salt">1</span> 🍬 <span id="sugar">1</span> 🪙 <span id="tokens">90</span>
    </div>
    <div class="animation-area">
      <img id="cornImg" src="https://cdn-icons-png.flaticon.com/512/2909/2909835.png" alt="옥수수" />
      <div id="tokenRain"></div>
    </div>
    <button id="puffBtn">🔥 뻥튀기!</button>
  </div>
  <audio id="bbyongSound" src="https://upload.wikimedia.org/wikipedia/commons/6/63/Firecracker_bang.ogg" preload="auto"></audio>
  <script>
    const puffBtn = document.getElementById('puffBtn');
    const cornImg = document.getElementById('cornImg');
    const tokenRain = document.getElementById('tokenRain');
    const bbyongSound = document.getElementById('bbyongSound');

    puffBtn.addEventListener('click', () => {
      bbyongSound.currentTime = 0;
      bbyongSound.play();

      cornImg.classList.add('pop-up');
      setTimeout(() => cornImg.classList.remove('pop-up'), 800);

      for (let i = 0; i < 10; i++) {
        const coin = document.createElement('div');
        coin.className = 'token';
        coin.style.left = Math.random() * 80 + 'px';
        tokenRain.appendChild(coin);
        setTimeout(() => coin.remove(), 1500);
      }
    });
  </script>
</body>
</html>
