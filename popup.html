<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🍿 뻥튀기 팝업</title>
  <style>
    :root{ --bg:#0e0e0f; --card:#18181b; --ink:#eaeaea; --muted:#9ca3af; --ok:#22c55e; --bad:#ef4444; --bd:#2a2a2e; }
    html,body{ background:var(--bg); color:var(--ink); margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif; }
    .wrap{ max-width:720px; margin:0 auto; padding:16px 18px 28px; }
    .status{ display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--bd); border-radius:12px; margin:12px 0; }
    .dot{ width:10px; height:10px; border-radius:50%; background:var(--muted); }
    .dot.ok{ background:var(--ok); } .dot.bad{ background:var(--bad); }
    .card{ background:var(--card); border:1px solid var(--bd); border-radius:16px; padding:14px; margin-top:14px; }
    .kv{ display:grid; grid-template-columns:120px 1fr; row-gap:8px; column-gap:8px; font-size:15px; }
    .kv b{ color:#cbd5e1; font-weight:600; }
    .nums{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:10px; }
    .box{ background:#111114; border:1px solid var(--bd); border-radius:12px; padding:12px; text-align:center; }
    .box h4{ margin:2px 0 8px; font-size:13px; color:#cbd5e1; font-weight:600; }
    .big{ font-size:20px; font-weight:800; }
    .cornline{ display:flex; align-items:center; gap:12px; margin-top:8px; }
    .cornline img{ width:40px; height:40px; object-fit:contain; }
    button{ all:unset; background:#2563eb; color:white; padding:12px 16px; border-radius:12px; cursor:pointer; display:inline-block; font-weight:700; }
    button.secondary{ background:#374151; }
    button:disabled{ opacity:.5; cursor:not-allowed; }
    .actions{ display:flex; gap:10px; margin-top:14px; }
    .result{ margin-top:14px; padding:14px; border:1px dashed var(--bd); border-radius:14px; background:#121214; }
    .muted{ color:var(--muted); font-size:13px; }
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .gradepick{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
    .gradepick label{ display:flex; gap:6px; align-items:center; background:#111114; border:1px solid var(--bd); border-radius:10px; padding:6px 10px; font-size:13px; cursor:pointer; }
    .hr{ height:1px; background:var(--bd); margin:12px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>🍿 뻥튀기</h2>

    <!-- 서버 상태 -->
    <div class="status" id="serverStat"><span class="dot" id="dot"></span><span id="svtxt">서버 상태 확인 중…</span></div>

    <!-- 유저 정보 -->
    <div class="card">
      <div class="kv">
        <b>닉네임</b> <div id="nickname">-</div>
        <b>카카오ID</b> <div id="kakaoId">-</div>
        <b>옥수수 색상</b>
        <div class="cornline">
          <img id="cornImg" alt="corn"/>
          <span id="cornColorText">-</span>
        </div>
      </div>

      <div class="nums">
        <div class="box"><h4>ORCX</h4><div class="big" id="v-orcx">-</div></div>
        <div class="box"><h4>소금</h4><div class="big" id="v-salt">-</div></div>
        <div class="box"><h4>설탕</h4><div class="big" id="v-sugar">-</div></div>
        <div class="box"><h4>옥수수</h4><div class="big" id="v-corn">-</div></div>
        <div class="box"><h4>팝콘</h4><div class="big" id="v-pop">-</div></div>
      </div>

      <div class="hr"></div>

      <!-- 등급/수확개수 선택 (백엔드 계산 없을 때를 대비한 클라 계산용) -->
      <div class="grid2">
        <div>
          <div class="muted">등급(백엔드가 결과 주면 무시)</div>
          <div class="gradepick" id="gradePick">
            <!-- A~F -->
            <label><input type="radio" name="grade" value="A" checked/>A</label>
            <label><input type="radio" name="grade" value="B"/>B</label>
            <label><input type="radio" name="grade" value="C"/>C</label>
            <label><input type="radio" name="grade" value="D"/>D</label>
            <label><input type="radio" name="grade" value="E"/>E</label>
            <label><input type="radio" name="grade" value="F"/>F</label>
          </div>
        </div>
        <div>
          <div class="muted">수확 개수</div>
          <div class="gradepick" id="harvestPick">
            <label><input type="radio" name="harvest" value="5" checked/>5개</label>
            <label><input type="radio" name="harvest" value="7"/>7개</label>
            <label><input type="radio" name="harvest" value="9"/>9개</label>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="btnRun" disabled>🎯 뻥튀기 실행</button>
        <button class="secondary" id="btnReload">↻ 다시 불러오기</button>
      </div>

      <div class="result" id="resultBox">조건을 확인 중…</div>
      <div class="muted">※ 소금 1 · 설탕 1 · 옥수수 1이 있어야 실행됩니다.</div>
    </div>
  </div>

  <script>
    // ===== 고정 서버 주소 (주인님 지침)
    const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io';

    // ===== 상태
    const S = {
      kakaoId: localStorage.getItem('kakaoId') || '',
      user: null, // 서버에서 받은 유저 오브젝트
      serverOk: false
    };

    // ===== 서버 핑
    async function pingServer(){
      const dot = document.getElementById('dot');
      const svtxt = document.getElementById('svtxt');
      try{
        const r = await fetch(API_BASE + '/api/ping', { cache:'no-store' });
        if(r.ok){ S.serverOk = true; dot.className='dot ok'; svtxt.textContent='✅ 서버 연결됨'; return; }
        throw 0;
      }catch(e){
        S.serverOk = false; dot.className='dot bad'; svtxt.textContent='❌ 서버 끊김';
      }
    }

    // ===== 유저 상태 불러오기
    async function loadUser(){
      const box = document.getElementById('resultBox');
      if(!S.kakaoId){ paintUser(null); box.textContent='카카오 로그인 정보가 없습니다.'; return; }
      try{
        const res = await fetch(API_BASE + '/api/corn/userdata', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ kakaoId:S.kakaoId })
        });
        const data = await res.json();
        if(!data || !data.nickname) throw 0;
        S.user = data; paintUser(data);
        checkReady();
      }catch(e){
        paintUser(null); box.textContent='❌ 유저 정보를 불러오지 못했습니다.';
      }
    }

    // ===== 렌더
    function paintUser(u){
      document.getElementById('kakaoId').textContent = S.kakaoId || '-';
      const nick = u?.nickname || '-';
      document.getElementById('nickname').textContent = nick;

      const orcx  = Number(u?.wallet?.orcx ?? 0);
      const salt  = Number(u?.inventory?.salt ?? 0);
      const sugar = Number(u?.inventory?.sugar ?? 0);
      const corn  = Number(u?.inventory?.corn ?? 0);
      const pop   = Number(u?.products?.popcorn ?? 0);

      document.getElementById('v-orcx').textContent = orcx;
      document.getElementById('v-salt').textContent = salt;
      document.getElementById('v-sugar').textContent = sugar;
      document.getElementById('v-corn').textContent = corn;
      document.getElementById('v-pop').textContent = pop;

      const color = (u?.inventory?.cornColor || 'yellow').toLowerCase();
      document.getElementById('cornColorText').textContent = color;

      // 주인님 경로 규칙: https://byungil-cho.github.io/OrcaX/img/파일명
      const imgMap = {
        black: 'https://byungil-cho.github.io/OrcaX/img/corn-black.png',
        red:   'https://byungil-cho.github.io/OrcaX/img/corn-red.png',
        yellow:'https://byungil-cho.github.io/OrcaX/img/corn-yellow.png'
      };
      document.getElementById('cornImg').src = imgMap[color] || imgMap.yellow;
      document.getElementById('cornImg').alt = color + ' corn';
    }

    // ===== 실행 가능 여부
    function checkReady(){
      const salt  = Number(S.user?.inventory?.salt ?? 0);
      const sugar = Number(S.user?.inventory?.sugar ?? 0);
      const corn  = Number(S.user?.inventory?.corn ?? 0);

      const ok = salt>=1 && sugar>=1 && corn>=1 && S.serverOk;
      const btn = document.getElementById('btnRun');
      btn.disabled = !ok;

      const box = document.getElementById('resultBox');
      if(ok){
        box.innerHTML = '✅ 조건 충족: 소금 1 · 설탕 1 · 옥수수 1 사용 가능';
      }else{
        box.innerHTML = '❌ 재료/서버 부족 — 소금:'+salt+' 설탕:'+sugar+' 옥수수:'+corn+' / 서버:'+ (S.serverOk?'✅':'❌');
      }
    }

    // ===== 등급/수확 보상표 (엔진_05_종합_03.html 기준)
    // A~F × (5|7|9) → {token, popcorn}
    const REWARD_TABLE = {
      A: { 5:{token:3700, pop:1}, 7:{token:5200, pop:1}, 9:{token:6200, pop:2} },
      B: { 5:{token:2900, pop:1}, 7:{token:4100, pop:1}, 9:{token:5000, pop:2} },
      C: { 5:{token:2100, pop:1}, 7:{token:3000, pop:1}, 9:{token:3700, pop:2} },
      D: { 5:{token:1300, pop:1}, 7:{token:1900, pop:1}, 9:{token:2400, pop:2} },
      E: { 5:{token: 550, pop:1}, 7:{token: 550, pop:1}, 9:{token: 750, pop:2} },
      F: { 5:{token: 260, pop:1}, 7:{token: 280, pop:1}, 9:{token: 370, pop:2} }
    }; // :contentReference[oaicite:0]{index=0}

    function pickGrade(){ return (document.querySelector('input[name="grade"]:checked')?.value || 'A'); }
    function pickHarvest(){ return Number(document.querySelector('input[name="harvest"]:checked')?.value || 5); }

    // ===== 뻥튀기 실행
    async function runPung(){
      const box = document.getElementById('resultBox');
      const grade = pickGrade();
      const harvest = pickHarvest();

      // 기본 보상(클라 계산) — 백엔드가 별도 계산값을 주면 그 값으로 덮어씀
      let reward = REWARD_TABLE[grade]?.[harvest];
      if(!reward){ box.textContent='보상표에 없는 조합입니다.'; return; }

      // 서버에 요청(소금1, 설탕1, 옥수수1 소비 + 보상 반영)
      try{
        const res = await fetch(API_BASE + '/api/corn/pung', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            kakaoId: S.kakaoId,
            use: { salt:1, sugar:1, corn:1 },
            clientCalc: { grade, harvest, token:reward.token, popcorn:reward.pop },
            // 선택적으로 색상 전달(서버 로깅용)
            cornColor: (S.user?.inventory?.cornColor || 'yellow')
          })
        });

        // 서버가 결과 계산을 돌려주면 서버 값을 우선
        if(res.ok){
          const srv = await res.json();
          if(srv?.result){
            reward = {
              token: Number(srv.result.token ?? reward.token),
              pop:   Number(srv.result.popcorn ?? reward.pop)
            };
          }
          // 최신 잔액/수량 반영이 오면 화면 갱신
          if(srv?.user){ S.user = srv.user; paintUser(S.user); }
        }

        box.innerHTML = `
          <b>🎉 뻥튀기 완료</b><br/>
          등급: <b>${grade}</b>, 수확: <b>${harvest}개</b><br/>
          획득: 💰 토큰 <b>${reward.token}</b> · 🍿 팝콘 <b>${reward.pop}</b>
        `;
        // 성공 후 다시 상태 확인 (버튼 활성/비활성 갱신)
        checkReady();
      }catch(e){
        box.textContent = '❌ 뻥튀기 처리 중 오류가 발생했습니다.';
      }
    }

    // ===== 이벤트 바인딩
    document.getElementById('btnRun').addEventListener('click', runPung);
    document.getElementById('btnReload').addEventListener('click', ()=>{ pingServer(); loadUser(); });

    // ===== 초기 로드
    (async function init(){
      if(!S.kakaoId){
        document.getElementById('resultBox').textContent='카카오 로그인 정보가 없습니다.';
      }
      await pingServer();
      await loadUser();
      checkReady();
    })();
  </script>
</body>
</html>
