<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 씨앗/제품 마켓</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: 'Do Hyeon', sans-serif; background: #f6fff8; margin: 0; }
    h2 { margin-top: 2.5rem; color: #197d6b; }
    table { width: 100%; margin-top: 1rem; border-collapse: collapse; }
    th, td { padding: 0.7rem 1.1rem; border-bottom: 1px solid #e0e0e0; text-align: center; }
    th { background: #e7f8ee; }
    .btn { background: #1fc89b; border: none; color: #fff; padding: 0.5rem 1.3rem; border-radius: 10px; cursor: pointer;}
    .btn:active { background: #19b38a; }
    input[type=number] { width: 60px; }
    .current-price { font-weight: bold; color: #1a4d3a;}
    @media (max-width:600px) { th, td {padding:0.4rem 0.2rem;} }
  </style>
</head>
<body>
  <h2>씨앗 관리</h2>
  <table>
    <tr>
      <th>종류</th>
      <th>재고</th>
      <th>현재가격</th>
      <th>새 가격</th>
      <th>변경</th>
    </tr>
    <tr>
      <td>씨감자</td>
      <td id="qty-potato">-</td>
      <td class="current-price" id="price-potato">-</td>
      <td><input type="number" id="input-potato" min="1"></td>
      <td><button class="btn" onclick="AdminMarket.updatePrice('gamja')">변경</button></td>
    </tr>
    <tr>
      <td>씨보리</td>
      <td id="qty-barley">-</td>
      <td class="current-price" id="price-barley">-</td>
      <td><input type="number" id="input-barley" min="1"></td>
      <td><button class="btn" onclick="AdminMarket.updatePrice('bori')">변경</button></td>
    </tr>
  </table>

  <script>
    const API = "https://climbing-wholly-grouper.jp.ngrok.io";
    const AdminMarket = {
      async loadSeeds() {
        try {
          const r = await fetch(API + "/api/seed/status");
          const data = await r.json();
          let potato = data.find(x => x.type === "gamja");
          let barley = data.find(x => x.type === "bori");
          document.getElementById("qty-potato").innerText = potato ? potato.stock : "-";
          document.getElementById("qty-barley").innerText = barley ? barley.stock : "-";
          document.getElementById("price-potato").innerText = potato ? potato.price : "-";
          document.getElementById("price-barley").innerText = barley ? barley.price : "-";
        } catch {
          document.getElementById("qty-potato").innerText = document.getElementById("qty-barley").innerText =
          document.getElementById("price-potato").innerText = document.getElementById("price-barley").innerText = "-";
        }
      },
      async updatePrice(type) {
        let price = type === "gamja" ? document.getElementById("input-potato").value : document.getElementById("input-barley").value;
        if (!price || price < 1) return alert("가격을 입력하세요!");
        await fetch(API + "/api/seed/price", {
          method: "POST",
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, price: Number(price) })
        });
        alert("가격 변경 완료!");
        AdminMarket.loadSeeds();
      }
    };

    // 최초 로딩
    AdminMarket.loadSeeds();
  </script>
</body>
</html>
