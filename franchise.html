<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 가맹점 안내</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    header {
      background-color: #003b6f;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .store-banner {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 40px 20px;
      gap: 30px;
    }

    .store-item {
      text-align: center;
      width: 220px;
    }

    .store-item img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .store-name {
      margin-top: 10px;
      font-weight: bold;
      font-size: 1.1em;
    }

    a {
      text-decoration: none;
      color: inherit;
      display: inline-block;
    }

    /* ✨ 깜빡이는 모집중 스타일 */
    .blink {
      color: #fff;
      background: linear-gradient(45deg, #ff3860, #ff6f61);
      padding: 6px 12px;
      border-radius: 10px;
      display: inline-block;
      font-weight: bold;
      animation: blink 1.2s ease-in-out infinite;
      box-shadow: 0 0 12px rgba(255, 56, 96, 0.6);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.05); }
    }

    .inquiry {
      font-size: 0.9em;
      color: #555;
      margin-top: 5px;
    }

    .inquiry a {
      color: #003b6f;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>OrcaX 가맹점 안내</h1>
    <p>OrcaX 토큰으로 결제 가능한 오프라인 가맹점</p>
  </header>

  <section class="store-banner">
    <div class="store-item">
      <a href="franchise_001.html">
        <img src="images/logo_01.jpg" alt="1호 가맹점 로고" />
        <p class="store-name">1호 가맹점: 로얄 스크린골프</p>
      </a>
    </div>

    <div class="store-item">
      <a href="franchise_002.html">
        <img src="images/logo_01.jpg" alt="2호 가맹점" />
      </a>
      <p class="store-name blink">2호 가맹점: 모집중</p>
      <p class="inquiry">문의: <a href="tel:0314082238">031-408-2238</a></p>
    </div>

    <div class="store-item">
      <a href="franchise_003.html">
        <img src="images/logo_01.jpg" alt="3호 가맹점" />
      </a>
      <p class="store-name blink">3호 가맹점: 모집중</p>
      <p class="inquiry">문의: <a href="tel:0314082238">031-408-2238</a></p>
    </div>

    <div class="store-item">
      <a href="franchise_004.html">
        <img src="images/logo_01.jpg" alt="4호 가맹점" />
      </a>
      <p class="store-name blink">4호 가맹점: 모집중</p>
      <p class="inquiry">문의: <a href="tel:0314082238">031-408-2238</a></p>
    </div>
  </section>
</body>
</html>
