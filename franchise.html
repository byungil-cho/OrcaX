<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 가맹점 안내</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    header {
      background-color: #003b6f;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .store-banner {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 40px 20px;
      gap: 30px;
    }

    .store-item {
      text-align: center;
      width: 220px;
    }

    .store-item img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .store-name {
      margin-top: 10px;
      font-weight: bold;
      font-size: 1.1em;
    }

    a {
      text-decoration: none;
      color: inherit;
      display: inline-block;
    }

    .blink {
      color: #fff;
      background: linear-gradient(45deg, #ff3860, #ff6f61);
      padding: 6px 12px;
      border-radius: 10px;
      display: inline-block;
      font-weight: bold;
      animation: blink 1.2s ease-in-out infinite;
      box-shadow: 0 0 12px rgba(255, 56, 96, 0.6);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.05); }
    }

    .inquiry {
      font-size: 0.9em;
      color: #555;
      margin-top: 5px;
    }

    .inquiry a {
      color: #003b6f;
      font-weight: bold;
    }

    /* 커서 포인터 스타일 */
    #admin-title {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="admin-title">OrcaX 가맹점 안내</h1>
    <p>OrcaX 토큰으로 결제 가능한 오프라인 가맹점</p>
    <p>
      <a href="/OrcaX/apply.html" style="color: #ff3860; font-weight: bold; text-decoration: underline;">
        → 가맹점신청서 바로가기
      </a>
    </p>
  </header>

  <section class="store-banner">
    <div class="store-item">
      <a href="franchise_001.html">
        <img src="images/OrcaX_VVIP_01.jpg" alt="1호 가맹점 로고" />
        <p class="store-name">1호 가맹점: 로얄 스크린골프</p>
      </a>
    </div>

    <div class="store-item">
      <a href="join_orcax_final.html">
        <img src="images/logo_01.jpg" alt="2호 가맹점" />
        <p class="store-name blink">2호 가맹점: 모집중</p>
        <p class="inquiry">문의: <a href="tel:0314082238">031-408-2238</a></p>
      </a>
    </div>

    <div class="store-item">
      <a href="join_orcax_final.html">
        <img src="images/logo_01.jpg" alt="3호 가맹점" />
        <p class="store-name blink">3호 가맹점: 모집중</p>
        <p class="inquiry">문의: <a href="tel:0314082238">031-408-2238</a></p>
      </a>
    </div>

    <div class="store-item">
      <a href="join_orcax_final.html">
        <img src="images/logo_01.jpg" alt="4호 가맹점" />
        <p class="store-name blink">4호 가맹점: 모집중</p>
        <p class="inquiry">문의: <a href="tel:0314082238">031-408-2238</a></p>
      </a>
    </div>
  </section>

  <!-- 관리자 비밀번호 체크 스크립트 -->
  <script>
    document.getElementById("admin-title").addEventListener("click", () => {
      const pass = prompt("🔒 관리자 비밀번호를 입력하세요:");
      if (pass === "orcax2025") {
        window.location.href = "franchise-admin.html";
      } else if (pass) {
        alert("❌ 비밀번호가 틀렸습니다.");
      }
    });
  </script>
  <!-- 기존 위젯 및 스크립트 유지 -->
  <div id="chat-widget" style="position: fixed; right: 20px; bottom: 20px; z-index: 9999;">
    <button onclick="toggleChat()" style="background:#00cc99;color:white;border:none;padding:12px 16px;border-radius:50%;font-size:20px;cursor:pointer;z-index:10000;">💬</button>
    <div id="chat-box" style="display: none; width: 300px; background: white; border-radius: 12px; box-shadow: 0 0 12px rgba(0,0,0,0.2); font-family: Arial, sans-serif; overflow: hidden; margin-top: 10px;">
      <div id="chat-box-header" style="background:#00cc99;color:white;padding:10px;text-align:center;font-weight:bold;display:flex;justify-content:space-between;align-items:center;">
        📎 메시지 보내기
        <span onclick="toggleChat()" style="cursor:pointer;">✖</span>
      </div>
      <div id="chat-form" style="padding:10px;">
        <input id="sender" type="text" placeholder="닉네임" style="width:100%;padding:8px;margin-bottom:6px;border:1px solid #ccc;border-radius:6px;" />
        <input id="message" type="text" placeholder="메시지를 입력하세요" style="width:100%;padding:8px;margin-bottom:6px;border:1px solid #ccc;border-radius:6px;" />
        <button onclick="sendMessage()" style="width:100%;padding:8px;background:#00b894;color:white;border:none;border-radius:6px;font-size:14px;">전송</button>
      </div>
      <div id="chat-log" style="padding:10px;height:180px;overflow-y:auto;font-size:0.9em;background:#f9f9f9;border-top:1px solid #eee;display:flex;flex-direction:column;"></div>
    </div>
  </div>

  <script>
    const apiBase = "https://f07e-210-104-209-108.ngrok-free.app/api/messages";
    const colorMap = {};

    function getColorForUser(user) {
      if (!colorMap[user]) {
        colorMap[user] = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      }
      return colorMap[user];
    }

    function toggleChat() {
      const box = document.getElementById("chat-box");
      const display = box.style.display;
      box.style.display = (display === "none" || display === "") ? "block" : "none";
      if (box.style.display === "block") loadMessages();
    }

    function sendMessage() {
      const sender = document.getElementById("sender").value.trim();
      const message = document.getElementById("message").value.trim();
      if (!sender || !message) return alert("닉네임과 메시지를 입력하세요!");

      fetch(apiBase, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "ngrok-skip-browser-warning": "true"
        },
        body: JSON.stringify({ nickname: sender, content: message, type: 'user' })
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById("message").value = '';
        loadMessages();
      })
      .catch(err => {
        alert("❌ 메시지 전송 실패: " + err.message);
      });
    }

    function loadMessages() {
      fetch(apiBase, {
        headers: { "ngrok-skip-browser-warning": "true" }
      })
      .then(res => res.json())
      .then(messages => {
        const log = document.getElementById("chat-log");
        log.innerHTML = '';
        messages.slice(-10).forEach(msg => {
          const color = getColorForUser(msg.nickname || msg.sender || "익명");
          const nickname = msg.nickname || msg.sender || "익명";
          const content = msg.content || msg.message || "";
          const div = document.createElement('div');
          div.innerHTML = `<strong style="color:${color}">${nickname}:</strong> ${content}`;
          log.appendChild(div);
        });
        log.scrollTop = log.scrollHeight;
      });
    }

    window.onload = function() {
      loadMessages();
      setInterval(loadMessages, 5000);
    };
  </script>
</body>
</html>
