<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 가맹점 안내</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    header {
      background-color: #0a3d62;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 10px;
    }

    .store-banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px;
    }

    .store-link {
      text-decoration: none;
      color: #222;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .store-image {
      width: 100%;
      max-width: 300px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .store-name {
      margin-top: 10px;
      font-size: 1.1em;
      font-weight: 600;
    }

    @media (min-width: 768px) {
      .store-banner {
        flex-direction: row;
        justify-content: center;
        flex-wrap: wrap;
      }

      .store-link {
        margin: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>OrcaX 가맹점 안내</h1>
    <p>OrcaX 토큰으로 결제 가능한 오프라인 가맹점</p>
  </header>

  <section class="store-banner">
    <a href="franchise_1.html" class="store-link">
      <img src="images/logo_01.jpg" alt="OrcaX 로고" class="store-image" />
      <p class="store-name">1호 가맹점: 로얄 스크린골프</p>
    </a>
  </section>
</body>
</html>
