<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 - 씨앗+전광판 제품 관리</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Arial', sans-serif; background: #fffde7; padding: 2rem; color: #333; }
    h1 { text-align: center; color: #4d372d; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #aaa; padding: 0.5rem; text-align: center; }
    th { background-color: #dcedc8; }
    input[type="number"], input[type="text"] { width: 80px; padding: 0.2rem; }
    button { padding: 0.4rem 0.8rem; background-color: #4caf50; color: white; border: none; cursor: pointer; }
    .link { text-align: center; margin-bottom: 1.5rem; }
    .link a { color: #00796b; font-weight: bold; text-decoration: none; }
    .section-title { margin-top: 2.5rem; margin-bottom:0.7rem; color:#4d372d; font-size:1.16rem;}
    .on { color: #27ae60; font-weight: bold;}
    .off { color: #bdbdbd; font-weight: bold;}
  </style>
</head>
<body>
  <h1>🌱 관리자 - 씨앗+전광판(제품) 관리</h1>

  <div class="link">
    <a href="admin-users.html" target="_blank">👤 유저 목록 및 출금 관리 페이지로 이동</a>
  </div>

  <!-- 씨앗 가격/재고 관리 -->
  <div class="section-title">씨앗 재고 · 가격 관리</div>
  <table>
    <thead>
      <tr>
        <th>씨앗 종류</th>
        <th>재고량</th>
        <th>현재 가격</th>
        <th>새 가격 설정</th>
        <th>작업</th>
      </tr>
    </thead>
    <tbody id="seedTableBody">
      <tr>
        <td>씨감자</td>
        <td id="qty-potato">-</td>
        <td id="price-potato">-</td>
        <td><input type="number" id="input-potato" /></td>
        <td><button onclick="updatePrice('seedPotato')">변경</button></td>
      </tr>
      <tr>
        <td>씨보리</td>
        <td id="qty-barley">-</td>
        <td id="price-barley">-</td>
        <td><input type="number" id="input-barley" /></td>
        <td><button onclick="updatePrice('seedBarley')">변경</button></td>
      </tr>
    </tbody>
  </table>

  <!-- 전광판: 제품 관리 영역 -->
  <div class="section-title">전광판(제품) 등록 · 수정 · 삭제</div>
  <table>
    <thead>
      <tr>
        <th>제품명</th>
        <th>가격(ORCX)</th>
        <th>활성</th>
        <th>작업</th>
      </tr>
    </thead>
    <tbody id="productTableBody"></tbody>
    <tfoot>
      <tr>
        <td><input type="text" id="newProductName" placeholder="제품명" /></td>
        <td><input type="number" id="newProductPrice" placeholder="가격" /></td>
        <td>ON</td>
        <td><button onclick="addProduct()">제품 등록</button></td>
      </tr>
    </tfoot>
  </table>

  <script>
    const API_SEED = "/api/seed";
    const API_PRODUCTS = "/api/marketdata"; // 전광판 제품 관리용 (엔드포인트 맞춰주세요!)

    // 씨앗 재고/가격 불러오기
    async function fetchSeedStatus() {
      const res = await fetch(`${API_SEED}/status`);
      const data = await res.json();
      document.getElementById('qty-potato').textContent = data.seedPotato.quantity;
      document.getElementById('price-potato').textContent = data.seedPotato.price;
      document.getElementById('qty-barley').textContent = data.seedBarley.quantity;
      document.getElementById('price-barley').textContent = data.seedBarley.price;
    }
    async function updatePrice(type) {
      const inputId = type === 'seedPotato' ? 'input-potato' : 'input-barley';
      const price = parseInt(document.getElementById(inputId).value);
      if (isNaN(price)) {
        alert("유효한 가격을 입력하세요."); return;
      }
      const res = await fetch(`${API_SEED}/admin/set-price`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, price })
      });
      const result = await res.json();
      if (res.ok) {
        alert(`가격 변경 완료: ${result.newPrice}`);
        fetchSeedStatus();
      } else {
        alert(result.message || '가격 변경 실패');
      }
    }

    // ----- 전광판(제품) 영역 -----
    async function fetchProducts() {
      const res = await fetch(`${API_PRODUCTS}/products`);
      const products = await res.json();
      const tbody = document.getElementById('productTableBody');
      tbody.innerHTML = '';
      products.forEach(prod => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="text" value="${prod.name}" onchange="editProduct('${prod._id}', 'name', this.value)" /></td>
          <td><input type="number" value="${prod.price}" onchange="editProduct('${prod._id}', 'price', this.value)" /></td>
          <td>
            <button onclick="toggleProduct('${prod._id}', ${!prod.active})" class="${prod.active ? 'on' : 'off'}">
              ${prod.active ? 'ON' : 'OFF'}
            </button>
          </td>
          <td>
            <button onclick="deleteProduct('${prod._id}')">삭제</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
    async function addProduct() {
      const name = document.getElementById('newProductName').value.trim();
      const price = parseInt(document.getElementById('newProductPrice').value);
      if (!name || isNaN(price)) {
        alert("제품명과 가격을 입력하세요."); return;
      }
      const res = await fetch(`${API_PRODUCTS}/products`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, active: true })
      });
      if (res.ok) {
        document.getElementById('newProductName').value = '';
        document.getElementById('newProductPrice').value = '';
        fetchProducts();
      } else {
        alert('제품 등록 실패');
      }
    }
    async function editProduct(id, field, value) {
      await fetch(`${API_PRODUCTS}/products/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: value })
      });
      fetchProducts();
    }
    async function toggleProduct(id, newActive) {
      await fetch(`${API_PRODUCTS}/products/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ active: newActive })
      });
      fetchProducts();
    }
    async function deleteProduct(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      await fetch(`${API_PRODUCTS}/products/${id}`, { method: 'DELETE' });
      fetchProducts();
    }

    // 초기 데이터 불러오기
    fetchSeedStatus();
    fetchProducts();
  </script>
</body>
</html>
