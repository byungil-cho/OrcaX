<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🌱 관리자 - 씨감자 · 씨보리 관리</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: #181b1f;
      color: #f2f2f2;
      margin: 0; padding: 0;
    }
    h1 { text-align: center; margin: 1.3rem 0 1rem 0; font-size:2rem; }
    .center-box {
      background: rgba(40, 50, 80, 0.12);
      border-radius: 20px;
      max-width: 540px;
      margin: 0 auto;
      padding: 1.5rem;
      box-shadow: 0 3px 22px #0006;
    }
    table {
      margin: 1rem auto 2rem auto;
      border-collapse: collapse;
      width: 94%;
      font-size: 1.1rem;
      background: #23283a;
      border-radius: 13px;
      overflow: hidden;
    }
    th, td {
      padding: 0.85rem 0.7rem;
      text-align: center;
    }
    th {
      background: #26335c;
      color: #ffe160;
      font-size: 1.08rem;
    }
    td {
      background: #222;
      border-bottom: 1px solid #344060;
    }
    .status-ok { color: #24f065; font-weight: bold;}
    .status-fail { color: #ff3860; font-weight: bold;}
    .status-wait { color: #ffe160; font-weight: bold;}
    .menu-link {
      color: #ffe160; margin: 1rem 1.1rem 0 1.1rem;
      text-decoration: none; font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <h1>🌱 관리자 - 씨감자 · 씨보리 재고 및 가격 관리</h1>
  <div class="center-box">
    <div id="server-status" class="status-wait" style="text-align:center; font-size:1.08rem; margin-bottom:1rem;">
      서버 상태: <span>확인중...</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>구분</th>
          <th>재고</th>
          <th>가격(ORCX)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>씨감자</th>
          <td id="qty-potato">-</td>
          <td id="price-potato">-</td>
        </tr>
        <tr>
          <th>씨보리</th>
          <td id="qty-barley">-</td>
          <td id="price-barley">-</td>
        </tr>
      </tbody>
    </table>
    <div style="margin-top:1.5rem;text-align:center;">
      <a href="gamja-factory.html" class="menu-link">감자 농장</a>
      <a href="gamja-shop.html" class="menu-link">씨앗 상점</a>
      <a href="admin-users.html" class="menu-link">회원 현황</a>
    </div>
  </div>
  <script>
    // 실제 API 경로 맞게 수정 필요!
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api/seed";

    async function fetchSeedStatus() {
      const statusDiv = document.getElementById('server-status');
      try {
        // 서버 상태 & 씨앗 재고/가격 동시 불러오기
        const res = await fetch(`${API_BASE}/status`);
        if (!res.ok) throw new Error('서버 오류');
        const data = await res.json();
        // 정상 연결 시
        statusDiv.innerHTML = '🟢 <span class="status-ok">서버 연결 정상</span>';
        document.getElementById('qty-potato').textContent = data.seedPotato?.quantity ?? '-';
        document.getElementById('price-potato').textContent = data.seedPotato?.price ?? '-';
        document.getElementById('qty-barley').textContent = data.seedBarley?.quantity ?? '-';
        document.getElementById('price-barley').textContent = data.seedBarley?.price ?? '-';
      } catch (e) {
        // 연결 실패 시
        statusDiv.innerHTML = '🔴 <span class="status-fail">서버 연결 실패</span>';
        document.getElementById('qty-potato').textContent = '-';
        document.getElementById('price-potato').textContent = '-';
        document.getElementById('qty-barley').textContent = '-';
        document.getElementById('price-barley').textContent = '-';
      }
    }

    // 페이지 진입시 1회 실행
    fetchSeedStatus();

    // 새로고침 등 추가 필요하면 아래처럼 버튼 추가해서 호출해도 됨
    // <button onclick="fetchSeedStatus()">새로고침</button>
  </script>
</body>
</html>
