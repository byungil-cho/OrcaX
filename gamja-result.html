<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>감자 가공 제품 공장 (실전용)</title>
  <style>
    body {
      background-color: #e5f9d7;
      color: #2b2b2b;
      font-family: sans-serif;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .info-box, .inventory-box {
      background-color: #f0ffe0;
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="text"] {
      padding: 0.5rem;
      width: 200px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-top: 0.5rem;
    }
    button {
      margin-top: 0.5rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background-color: #a7d676;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #2b2b2b;
    }
    button:hover {
      background-color: #8bc34a;
    }
    .green {
      color: green;
    }
    .red {
      color: red;
    }
    #newsTicker {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #333;
      color: white;
      padding: 0.5rem;
      font-weight: bold;
      overflow: hidden;
      white-space: nowrap;
    }
    #newsText span {
      display: inline-block;
      padding-right: 2rem;
      animation: scrollLeft 20s linear infinite;
    }
    @keyframes scrollLeft {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <h1>🥔 감자 가공 제품 공장 (실전용)</h1>
  <div class="info-box">
    <div>환영합니다 <strong id="nickname">-</strong> 님!</div>
    <div>보유 감자: <span id="potatoCount">-</span> 개</div>
    <div>오늘 수확: <span id="harvestCount">-</span> 개</div>
    <div id="statusMsg">⚙️ 전기 공급 상태 확인 중...</div>
  </div>

  <div class="info-box">
    <input type="text" id="productName" placeholder="제품 이름 (예: 칩, 전, 골뱅이)">
    <button onclick="createProduct()">제품 만들기</button>
  </div>

  <div class="inventory-box">
    <h3>📦 보관함 목록</h3>
    <ul id="inventoryList"></ul>
  </div>

  <div id="newsTicker"><div id="newsText"></div></div>

  <script>
    const serverUrl = 'https://climbing-wholly-grouper.ngrok-free.app';

    function updateNews(newsList) {
      const newsText = document.getElementById("newsText");
      while (newsText.firstChild) {
        newsText.removeChild(newsText.firstChild);
      }
      newsList.forEach(msg => {
        const span = document.createElement("span");
        span.textContent = `🆕 ${msg}`;
        newsText.appendChild(span);
      });
    }

    async function checkServerStatus() {
      try {
        const res = await fetch(`${serverUrl}/status`);
        if (!res.ok) throw new Error('응답 없음');
        const data = await res.json();

        document.getElementById("nickname").textContent = data.nickname ?? '-';
        document.getElementById("potatoCount").textContent = data.potatoes ?? '0';
        document.getElementById("harvestCount").textContent = data.harvested ?? '0';
        document.getElementById("statusMsg").innerHTML = '🔌 <span class="green">전기 공급 정상!</span>';

        updateNews(data.news ?? []);
      } catch (err) {
        document.getElementById("statusMsg").innerHTML = '❌ <span class="red">서버 연결 실패</span>';
        updateNews(['서버와 연결할 수 없습니다. 감자 전력 끊김 상태입니다.']);
      }
    }

    checkServerStatus();
    setInterval(checkServerStatus, 5000); // 5초마다 반복 체크로 강제 기상
  </script>
</body>
</html>
