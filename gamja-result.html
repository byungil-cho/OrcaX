
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>감자/보리 가공 공장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: #fff;
    }
    header {
      background-color: rgba(0,0,0,0.5);
      padding: 1rem;
    }
    main {
      padding: 1rem;
    }
    .status-box {
      margin: 10px 0;
      padding: 10px;
      background-color: rgba(255,255,255,0.1);
      border-radius: 10px;
    }
    input, select, button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    nav {
      margin-top: 20px;
    }
    nav button {
      margin: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h2>🛠 감자/보리 가공 공장</h2>
    <div id="nickname">닉네임: </div>
    <div id="status">전원 상태: 🟢 정상</div>
  </header>

  <main>
    <div class="status-box">
      <strong>보유 자원</strong><br>
      감자: <span id="potatoCount">0</span>개 |
      보리: <span id="barleyCount">0</span>말
    </div>

    <div class="status-box">
      <select id="materialType">
        <option value="감자">감자</option>
        <option value="보리">보리</option>
      </select>
      <input type="text" id="productName" placeholder="가공품 이름 입력 (예: 떡)">
      <button onclick="makeProduct()">가공하기</button>
    </div>

    <div class="status-box">
      <h4>📦 내 인벤토리</h4>
      <div id="inventoryDisplay">아직 가공한 제품이 없습니다.</div>
    </div>

    <nav>
      <button onclick="goTo('gamja-market.html')">판매소</button>
      <button onclick="goTo('gamja-farm.html')">농장가기</button>
      <button onclick="goTo('gamja-shop.html')">씨앗 상점</button>
      <button onclick="goTo('index.html')">메인으로</button>
    </nav>
  </main>

  <script>
    const nickname = localStorage.getItem("nickname") || "로그인 필요";
    const potatoCount = parseInt(localStorage.getItem("potatoCount") || "0");
    const barleyCount = parseInt(localStorage.getItem("barleyCount") || "0");
    document.getElementById("nickname").innerText += nickname;
    document.getElementById("potatoCount").innerText = potatoCount;
    document.getElementById("barleyCount").innerText = barleyCount;

    function makeProduct() {
      const material = document.getElementById("materialType").value;
      const name = document.getElementById("productName").value.trim();
      if (!name) return alert("가공품 이름을 입력하세요");

      const inventory = JSON.parse(localStorage.getItem("inventory") || "{}");
      const itemName = material + name;

      if (material === "감자") {
        if (potatoCount < 1) return alert("감자가 부족합니다.");
        localStorage.setItem("potatoCount", potatoCount - 1);
      } else {
        if (barleyCount < 1) return alert("보리가 부족합니다.");
        localStorage.setItem("barleyCount", barleyCount - 1);
      }

      inventory[itemName] = (inventory[itemName] || 0) + 1;
      localStorage.setItem("inventory", JSON.stringify(inventory));
      alert(itemName + " 1개가 가공되었습니다.");
      location.reload();
    }

    function goTo(page) {
      window.location.href = page;
    }

    // 인벤토리 표시
    const inventory = JSON.parse(localStorage.getItem("inventory") || "{}");
    const invBox = document.getElementById("inventoryDisplay");
    if (Object.keys(inventory).length > 0) {
      invBox.innerHTML = Object.entries(inventory).map(([k,v]) => `${k}: ${v}개`).join("<br>");
    }
  </script>
</body>
</html>
