<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 감자 가공공장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #fef9e8;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #504030;
      margin: 1rem 0 0.5rem;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem 0.5rem 0;
      color: #503020;
    }
    .status-box {
      text-align: center;
      font-weight: bold;
      padding: 0.5rem;
      background: #fff;
      border: 2px dashed #aaa;
      margin: 0.5rem auto;
      max-width: 300px;
      color: #333;
    }
    #resourceBox, #factoryBox {
      background: #fff;
      border: 1px solid #ccc;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 400px;
      border-radius: 12px;
    }
    #factoryBox input[type="text"] {
      padding: 0.5rem;
      width: 70%;
      margin-right: 0.5rem;
    }
    #factoryBox label {
      margin-right: 1rem;
    }
    #factoryBox button, .exchange-buttons button, .navigation-buttons a, .exchange-to-token {
      background-color: #a98256;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      margin: 0.3rem;
      cursor: pointer;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
    }
    .exchange-buttons, .navigation-buttons {
      text-align: center;
      margin: 1rem;
    }
    ul#productList {
      list-style: none;
      padding-left: 1rem;
    }
    ul#productList li {
      background: #fff;
      margin: 0.3rem 0;
      padding: 0.4rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    h3 {
      text-align: center;
      color: #504030;
    }
    .container {
      max-width: 800px;
      margin: auto;
    }
    .exchange-to-token {
      display: block;
      margin: 1rem auto;
      background-color: #4d804d;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏭 OrcaX 감자 가공공장</h1>
    <div id="statusBox" class="status-box">🔌 서버 연결 확인 중...</div>
    <div id="nicknameBox"></div>
    <div id="resourceBox">
      <p>🥔 감자: <span id="potatoCount">0</span></p>
      <p>🌾 보리: <span id="barleyCount">0</span></p>
      <p>💧 물: <span id="waterCount">0</span></p>
      <p>🌿 거름: <span id="fertilizerCount">0</span></p>
      <p>🪙 ORCX: <span id="tokenCount">0</span></p>
    </div>
    <div id="factoryBox">
      <div style="margin-bottom: 0.5rem;">
        <label><input type="radio" name="material" value="감자" checked> 감자</label>
        <label><input type="radio" name="material" value="보리"> 보리</label>
      </div>
      <input type="text" id="productNameInput" placeholder="제품 이름 입력" />
      <button onclick="createProduct()">제품 만들기</button>
    </div>
    <div class="exchange-buttons">
      <button onclick="exchange('water')">선택 제품 → 물 교환</button>
      <button onclick="exchange('fertilizer')">선택 제품 → 거름 교환</button>
    </div>
    <h3>🧺 제품 보관소</h3>
    <ul id="productList"></ul>
    <div class="navigation-buttons">
      <a href="gamja-shop.html">🛒 씨감자 상점</a>
      <a href="gamja-exchange.html">🔁 자원 교환소</a>
      <a href="gamja-market.html">💰 거래소 이동</a>
    </div>
    <button class="exchange-to-token" onclick="exchangeToToken()">감자 + 보리 → ORCX 교환하기</button>
  </div>

  <script>
    // 기존 스크립트 유지
  </script>
</body>
</html>
