<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 가공 결과 페이지</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .box {
      background-color: #222;
      padding: 1rem;
      border-radius: 10px;
      margin: 1rem auto;
      max-width: 500px;
    }
    .count {
      font-size: 1.2rem;
      color: #f0c741;
      font-weight: bold;
    }
    input, button {
      padding: 0.5rem;
      font-size: 1rem;
      margin-top: 1rem;
      border-radius: 5px;
    }
    button {
      background-color: #ffaa00;
      color: #000;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff8800;
    }
    ul {
      list-style: none;
      padding: 0;
      text-align: left;
    }
    li {
      padding: 0.2rem 0;
    }
    #server-status {
      margin-top: 1rem;
      color: #00ff88;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🥔 감자 가공 결과 페이지</h1>

  <div class="box">
    <p id="farm-name">농장 이름: -</p>
    <p class="count" id="potato-count">보유 감자: - 개</p>
    <p class="count" id="harvest-count">오늘 수확: - 개</p>

    <input type="text" id="productInput" placeholder="제품명 입력 (예: 칩, 전 등)" />
    <button onclick="makeProduct()">제품 만들기</button>

    <div id="server-status">🔄 전기 공급 상태 확인 중...</div>
  </div>

  <div class="box">
    <h2>📦 보관함</h2>
    <ul id="storage-list">
      <li>불러오는 중...</li>
    </ul>
  </div>

  <script>
    const BASE_URL = "https://orcax-farm-6000.onrender.com";
    let rawPotatoCount = 0;

    const farmName = localStorage.getItem("farmName") || "이름없는농장";
    document.getElementById("farm-name").innerText = `농장 이름: ${farmName}`;

    function updateStorageList(items = []) {
      const ul = document.getElementById("storage-list");
      ul.innerHTML = "";
      if (!items || items.length === 0) {
        ul.innerHTML = "<li>❌ 감자 보관함을 불러올 수 없습니다.</li>";
        return;
      }
      items.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.name}: ${item.count}개`;
        ul.appendChild(li);
      });
    }

    function loadInventory() {
      fetch(`${BASE_URL}/api/gamja`)
        .then(res => res.json())
        .then(data => {
          rawPotatoCount = data.potatoes || 0;
          document.getElementById("potato-count").innerText = `보유 감자: ${rawPotatoCount}개`;
          document.getElementById("harvest-count").innerText = `오늘 수확: ${data.harvested || 0}개`;
          updateStorageList(data.items);
        })
        .catch(err => {
          document.getElementById("storage-list").innerHTML = "<li>❌ 감자 보관함을 불러올 수 없습니다.</li>";
        });
    }

    function makeProduct() {
      const input = document.getElementById("productInput").value.trim();
      if (!input) return alert("제품명을 입력해주세요!");
      if (rawPotatoCount <= 0) return alert("❌ 감자가 부족합니다. 수확한 감자가 없습니다.");

      const productName = input.startsWith("감자") ? input : `감자${input}`;
      fetch(`${BASE_URL}/api/create-product`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: productName, farm: farmName })
      })
        .then(res => res.json())
        .then(data => {
          alert(`✅ ${data.name} 제품이 가공되었습니다!`);
          rawPotatoCount = Math.max(0, rawPotatoCount - 1);
          document.getElementById("potato-count").innerText = `보유 감자: ${rawPotatoCount}개`;
          loadInventory();
        })
        .catch(err => {
          alert("❌ 제품 가공 실패");
        });
    }

    // 서버 상태 확인 및 데이터 불러오기
    fetch(`${BASE_URL}/api/ping`)
      .then(res => {
        if (res.ok) {
          document.getElementById("server-status").innerText = "🟢 공장에 전기 들어왔어요~!";
          loadInventory();
        } else {
          document.getElementById("server-status").innerText = "🔴 공장 전기 끊김";
        }
      })
      .catch(err => {
        document.getElementById("server-status").innerText = "🔴 공장 전기 끊김: 감자 창고가 잠겼습니다!";
      });
  </script>
</body>
</html>
