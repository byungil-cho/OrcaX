<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>홈 감자 가공 공장</title>
  <style>
    body {
      background-color: #f4fff4;
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: #4a752c;
    }
    input, button {
      padding: 0.6rem;
      margin-top: 0.5rem;
      font-size: 1rem;
    }
    button {
      background-color: #ffcc66;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 0.5rem;
    }
    button:hover {
      background-color: #ffb933;
    }
    table { width: 100%; border-collapse: collapse; margin: 2rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
    th { background: #e0ffc4; }
    #electricStatus {
      font-weight: bold;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <h1>🥔 감자 가공 공장</h1>
  <p id="electricStatus">🔌 전기 상태 확인 중...</p>
  <p>수확한 감자 수: <strong id="potatoCount">0</strong> 개</p>
  <p>
    제품 이름 입력: <input type="text" id="productName" placeholder="예: 왕감자칩">
  </p>
  <button id="processBtn">📦 감자 가공 시작</button>
  <div id="nextOptions" style="display:none;">
    <p>감자가 없습니다. 다음 작업을 선택하세요:</p>
    <button onclick="location.href='gamja-main.html'">🌿 농장으로 돌아가기</button>
    <button onclick="location.href='gamja-market.html'">💰 경매장 가기</button>
  </div>

  <h2>📊 감자 시세 전광판 (10분마다 갱신)</h2>
  <table>
    <thead>
      <tr><th>#</th><th>제품명</th><th>총 생산량</th><th>현재 시세</th></tr>
    </thead>
    <tbody id="priceBoard"></tbody>
  </table>

  <script type="module">
    import { getNickname } from './js/gamja-utils.js';

    async function fetchPriceBoard() {
      const res = await fetch(`/api/market/pricelist`);
      const { topProducts } = await res.json();
      const board = document.getElementById("priceBoard");
      board.innerHTML = "";
      topProducts.forEach((item, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td>${item.productName}</td>
          <td>${item.totalCount}</td>
          <td>${item.marketPrice.toFixed(2)} Ⓣ</td>
        `;
        board.appendChild(tr);
      });
    }

    async function checkElectricity() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const statusText = document.getElementById("electricStatus");
        if (data.mongoConnected) {
          statusText.textContent = "🔌 전기 공급 정상 (MongoDB 연결됨)";
          statusText.style.color = "green";
        } else {
          statusText.textContent = "⚡ 전기 공급 안됨 (MongoDB 연결 실패)";
          statusText.style.color = "red";
        }
      } catch (err) {
        const statusText = document.getElementById("electricStatus");
        statusText.textContent = "⚠️ 서버 연결 실패";
        statusText.style.color = "darkred";
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const info = JSON.parse(localStorage.getItem('harvestInfo') || '{}');
      document.getElementById('potatoCount').textContent = info.yield || 0;
      document.getElementById('productName').value = `감자칩_${Date.now()}`;
      await fetchPriceBoard();
      await checkElectricity();

      document.getElementById('processBtn').onclick = async () => {
        if (!info.yield || info.yield <= 0) {
          document.getElementById('processBtn').style.display = 'none';
          document.getElementById('nextOptions').style.display = 'block';
          return;
        }
        const productName = document.getElementById('productName').value;
        const nickname = localStorage.getItem('nickname') || '무명농장';

        const res = await fetch('/api/factory/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nickname,
            count: 1,
            productName,
            metadata: info
          })
        });
        const data = await res.json();
        if (data.success) {
          alert(`'${productName}' 가공 완료! 감자 1개 소비됨.`);
          info.yield -= 1;
          localStorage.setItem('harvestInfo', JSON.stringify(info));
          document.getElementById('potatoCount').textContent = info.yield;
          if (info.yield <= 0) {
            document.getElementById('processBtn').style.display = 'none';
            document.getElementById('nextOptions').style.display = 'block';
          }
        } else {
          alert('가공 실패: ' + (data.message || '알 수 없는 오류'));
        }
      }
    });
  </script>
</body>
</html>
