
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 감자/보리 가공공장</title>
  <style>
    body { font-family: 'Arial', sans-serif; background: #fef9e8; padding: 1rem; margin: 0; }
    h1 { text-align: center; color: #503020; margin-bottom: 0.5rem; }
    #nicknameBox { text-align: right; font-weight: bold; margin: 0.5rem 1rem 0.5rem 0; color: #503020; }
    #container { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .section { background: #fff; border-radius: 10px; padding: 1rem; width: 100%; max-width: 400px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .section h2 { margin: 0 0 0.5rem; font-size: 1.1rem; color: #503020; border-bottom: 1px solid #ccc; padding-bottom: 0.3rem; }
    .info-item { margin: 0.3rem 0; }
    button { padding: 0.5rem 1rem; font-size: 1rem; background-color: #d4a373; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #bc8a5f; }
    label { margin-right: 0.5rem; }
    @media (max-width: 600px) {
      #container { padding: 0 1rem; }
    }
  </style>
</head>
<body>
  <div id="nicknameBox">닉네임: <span id="nickname">-</span></div>
  <h1>🍟 감자/보리 가공공장</h1>
  <div id="container">
    <div class="section">
      <h2>📦 자재 창고 (원재료)</h2>
      <div class="info-item">감자: <span id="potatoCount">-</span></div>
      <div class="info-item">보리: <span id="barleyCount">-</span></div>
      <div class="info-item">물: <span id="water">-</span></div>
      <div class="info-item">거름: <span id="fertilizer">-</span></div>
    </div>

    <div class="section">
      <h2>🍽️ 식품 창고 (가공 제품)</h2>
      <div class="info-item">감자칩: <span id="chips">-</span></div>
      <div class="info-item">보리빵: <span id="bread">-</span></div>
    </div>

    <div class="section">
      <h2>🏦 은행 금고</h2>
      <div class="info-item">ORCX 토큰: <span id="token">-</span></div>
    </div>

    <div class="section">
      <h2>🔧 가공 선택</h2>
      <label><input type="radio" name="material" value="potato" checked /> 감자 → 감자칩</label><br/>
      <label><input type="radio" name="material" value="barley" /> 보리 → 보리빵</label><br/><br/>
      <button onclick="process()">가공하기</button>
    </div>
  </div>

  <script>
    let nickname = localStorage.getItem("nickname");
    if (!nickname) {
      alert("로그인이 필요합니다.");
      location.href = "orcax-farm_000.html";
    }

    document.getElementById("nickname").innerText = nickname;

    async function fetchUserData() {
      const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata?nickname=" + nickname);
      const data = await res.json();
      const user = data.user;

      document.getElementById("potatoCount").innerText = user.potatoCount;
      document.getElementById("barleyCount").innerText = user.barleyCount;
      document.getElementById("water").innerText = user.water;
      document.getElementById("fertilizer").innerText = user.fertilizer;
      document.getElementById("token").innerText = user.token;

      let chips = 0;
      let bread = 0;
      if (user.inventory && Array.isArray(user.inventory)) {
        for (const item of user.inventory) {
          if (item.type === "감자칩") chips += item.count;
          if (item.type === "보리빵") bread += item.count;
        }
      }
      document.getElementById("chips").innerText = chips;
      document.getElementById("bread").innerText = bread;
    }

    async function process() {
      const material = document.querySelector("input[name='material']:checked").value;
      const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/process", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ nickname, material })
      });
      const result = await res.json();
      if (result.success) {
        alert("가공이 완료되었습니다!");
        fetchUserData();
      } else {
        alert("가공 실패: " + result.message);
      }
    }

    fetchUserData();
  </script>
</body>
</html>
