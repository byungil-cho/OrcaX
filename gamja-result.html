<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 감자 가공공장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: 'Do Hyeon', sans-serif; background: #fcfff4; margin: 0;}
    header { background: #585858; color: #fff; padding: 1.5rem 0 1rem 0; text-align: center; font-size: 2.3rem;}
    .main-box { max-width: 580px; margin: 2rem auto; padding: 2rem; border-radius: 30px; background: #fff; box-shadow: 0 2px 18px #d2e5df44;}
    .section { margin-bottom: 2rem; padding: 1.1rem 1.4rem; border-radius: 20px; background: #f2f5f6;}
    .title { font-weight: bold; font-size: 1.25rem; margin-bottom: 1rem; }
    .resource-bar { display: flex; gap: 18px; margin: 0.4rem 0 1rem 0; justify-content: center; font-size: 1.11rem;}
    .res-item { background: #fff; color: #585858; border-radius: 10px; padding: 2px 13px 2px 9px; box-shadow: 0 1px 6px #ddebe822; font-weight: 600;}
    .res-label { font-size: 1rem; color: #1c928d; margin-right: 3px;}
    .item-card { padding: 0.7rem 1.2rem; border-radius: 16px; background: #fff; box-shadow: 0 1px 6px #ddebe844; min-width: 120px; margin-bottom: 7px;}
    .center { text-align: center;}
    .gray { color: #aaa;}
    #log { margin-top: 0.6rem; color: #e67e22;}
    button, .btn { font-family: inherit; border: none; background: #23d160; color: #fff; padding: 7px 18px; border-radius: 12px; font-size: 1rem; cursor: pointer; margin-left: 7px;}
    .btn:disabled { background: #ccc; cursor: default;}
    @media (max-width: 600px) {
      .main-box { padding: 1rem;}
      .item-card { min-width: 80px;}
      .resource-bar { font-size: 0.99rem;}
    }
  </style>
</head>
<body>
  <header>🥔 OrcaX 감자 가공공장</header>
  <div class="main-box">
    <div class="section center">
      <div id="srvStatus" class="gray">서버 연결 확인중...</div>
      <div class="resource-bar">
        <span class="res-item"><span class="res-label">닉네임</span> <span id="nick">-</span></span>
        <span class="res-item"><span class="res-label">물</span> <span id="myWater">-</span></span>
        <span class="res-item"><span class="res-label">거름</span> <span id="myFertilizer">-</span></span>
        <span class="res-item"><span class="res-label">토큰</span> <span id="myToken">-</span></span>
      </div>
    </div>

    <div class="section">
      <div class="title">보관함 (가공식품)</div>
      <div class="inv-list" id="inventory">-</div>
    </div>

    <div class="section">
      <div class="title">가공하기</div>
      <form id="makeForm" class="center">
        <select id="materialSel" required>
          <option value="">원재료 선택</option>
          <option value="potato">감자</option>
          <option value="bori">보리</option>
        </select>
        <select id="productSel" required>
          <option value="">제품 선택</option>
          <option value="감자스넥">감자스넥</option>
          <option value="감자깡">감자깡</option>
          <option value="보리빵">보리빵</option>
          <option value="보리국수">보리국수</option>
        </select>
        <button id="makeBtn">가공</button>
      </form>
      <div id="log"></div>
    </div>

    <div class="section">
      <div class="title">가공 기록</div>
      <div id="processLog" class="gray">-</div>
    </div>
  </div>

  <script>
    // 서버 API 주소
    const BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api/processing";
    const USERDATA_API = "https://climbing-wholly-grouper.jp.ngrok.io/api/userdata";
    const kakaoId = localStorage.getItem("kakaoId") || "";
    const nickname = localStorage.getItem("nickname") || "-";
    document.getElementById("nick").textContent = nickname;

    // 자원 상태
    let myWater = 0, myFertilizer = 0, myToken = 0;

    // Promise.all로 모든 정보를 한 번에 동기화!
    async function fetchUser() {
      try {
        document.getElementById("srvStatus").textContent = "서버 연결 확인중...";
        const [invRes, prodRes, logRes, userRes] = await Promise.all([
          fetch(BASE + "/get-inventory", {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ kakaoId }), cache:"no-store"
          }),
          fetch(BASE + "/get-products", {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ kakaoId }), cache:"no-store"
          }),
          fetch(BASE + "/log", {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ kakaoId }), cache:"no-store"
          }),
          fetch(USERDATA_API, {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ kakaoId }), cache:"no-store"
          }),
        ]);
        const [invData, prodData, logData, userData] = await Promise.all([
          invRes.json(), prodRes.json(), logRes.json(), userRes.json()
        ]);

        // 자원 최신 동기화
        const user = userData.user || userData.users || userData || {};
        myWater =
          user.water ??
          (user.inventory && user.inventory.water) ??
          userData.water ??
          (userData.inventory && userData.inventory.water) ??
          0;
        myFertilizer =
          user.fertilizer ??
          (user.inventory && user.inventory.fertilizer) ??
          userData.fertilizer ??
          (userData.inventory && userData.inventory.fertilizer) ??
          0;
        myToken =
          user.orcx ??
          user.token ??
          userData.orcx ??
          userData.token ??
          0;
        renderMyResource();

        // 보관함 (가공식품)
        const inv = invData.products || {};
        const list = Object.entries(inv)
          .filter(([_, qty]) => qty > 0)
          .map(([name, qty]) => `<div class="item-card">${name} <b>${qty}</b>개</div>`);
        document.getElementById("inventory").innerHTML = list.length ? list.join("") : `<span class="gray">보유 제품 없음</span>`;

        // 가공 기록
        const logs = logData.log || [];
        document.getElementById("processLog").innerHTML =
          logs.length
            ? logs.map(x=>`${x.date||""} <b>${x.product||"-"}</b> (+${x.qty||1})`).join("<br>")
            : `<span class="gray">가공 기록 없음</span>`;

        document.getElementById("srvStatus").textContent = "✅ 서버 연결 성공!";
      } catch (e) {
        document.getElementById("srvStatus").textContent = "❌ 서버 연결 실패!";
        document.getElementById("inventory").innerHTML = "-";
        document.getElementById("processLog").innerHTML = "-";
      }
    }

    function renderMyResource() {
      document.getElementById("myWater").textContent = myWater;
      document.getElementById("myFertilizer").textContent = myFertilizer;
      document.getElementById("myToken").textContent = myToken;
    }

    // 가공폼 제출
    document.getElementById("makeForm").onsubmit = async function(e) {
      e.preventDefault();
      const material = document.getElementById("materialSel").value;
      const product = document.getElementById("productSel").value;
      if (!material || !product) {
        document.getElementById("log").textContent = "원재료와 제품을 선택하세요!";
        return;
      }
      document.getElementById("makeBtn").disabled = true;
      try {
        const res = await fetch(BASE + "/make-product", {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ kakaoId, material, product }),
          cache:"no-store"
        });
        const result = await res.json();
        if(result.success){
          document.getElementById("log").innerHTML = `가공 성공! <b>${product}</b> 1개 추가`;
          await fetchUser(); // 가공 후 반드시 한 번에 동기화!
        } else {
          document.getElementById("log").innerHTML = result.message || "가공 실패";
        }
      } catch {
        document.getElementById("log").textContent = "서버 연결 실패";
      }
      document.getElementById("makeBtn").disabled = false;
    };

    // 뒤로가기/새로고침도 항상 동기화
    window.onload = fetchUser;
    window.onpageshow = fetchUser;
  </script>
</body>
</html>
