<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>항행 감자 가공 공장</title>
  <style>
    body {
      background-color: #e5f9d7;
      color: #2b2b2b;
      font-family: sans-serif;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .info-box, .inventory-box {
      background-color: #f0ffe0;
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="text"] {
      padding: 0.5rem;
      width: 200px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-top: 0.5rem;
    }
    button {
      margin-top: 0.5rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background-color: #a7d676;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #2b2b2b;
    }
    button:hover {
      background-color: #8bc34a;
    }
    .green {
      color: green;
    }
    .red {
      color: red;
    }
  </style>
</head>
<body>
  <h1>🥔 감자 가공 제품 공장</h1>
  <div class="info-box">
    <div>환영합니다 <strong id="nickname">-</strong> 님!</div>
    <div>보유 감자: <span id="potatoCount">-</span> 개</div>
    <div>오늘 수확: <span id="harvestCount">-</span> 개</div>
    <div id="statusMsg">⚙️ 전기 공급 상태 확인 중...</div>
  </div>

  <div class="info-box">
    <input type="text" id="productName" placeholder="제품 이름 (예: 칩, 전 등)">
    <button onclick="createProduct()">제품 만들기</button>
  </div>

  <div class="inventory-box">
    <h3>📦 보관함 목록</h3>
    <ul id="inventoryList"></ul>
  </div>

  <script>
    const serverUrl = 'https://orcax-farm-6000.onrender.com';
    const nickname = localStorage.getItem('nickname') || '이름없는농장';
    document.getElementById('nickname').textContent = nickname;

    async function loadData() {
      try {
        const res = await fetch(`${serverUrl}/api/gamja?nickname=${nickname}`);
        const data = await res.json();
        document.getElementById('potatoCount').textContent = data.potatoCount;
        document.getElementById('harvestCount').textContent = data.harvestCount;
        document.getElementById('statusMsg').innerHTML = '<span class="green">✅ 서버 연결됨</span>';

        const inventoryList = document.getElementById('inventoryList');
        inventoryList.innerHTML = '';
        data.inventory.forEach(item => {
          const li = document.createElement('li');
          li.textContent = `🔹 ${item}`;
          inventoryList.appendChild(li);
        });
      } catch (err) {
        document.getElementById('statusMsg').innerHTML = '<span class="red">❌ 서버 응답 실패</span>';
      }
    }

    async function createProduct() {
      const product = document.getElementById('productName').value.trim();
      if (!product) return alert('제품 이름을 입력해주세요.');

      try {
        const res = await fetch(`${serverUrl}/api/create-product`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname, type: product })
        });
        const result = await res.json();
        alert(result.message || '제품 생성 완료!');
        loadData();
      } catch (err) {
        alert('제품 생성 실패');
      }
    }

    loadData();
  </script>
</body>
</html>
