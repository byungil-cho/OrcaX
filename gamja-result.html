<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 감자 가공공장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #fef9e8;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #504030;
      margin: 1rem 0 0.5rem;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem 0.5rem 0;
      color: #503020;
    }
    .status-box {
      text-align: center;
      font-weight: bold;
      padding: 0.5rem;
      background: #fff;
      border: 2px dashed #aaa;
      margin: 0.5rem auto;
      max-width: 300px;
      color: #333;
    }
    #resourceBox, #factoryBox {
      background: #fff;
      border: 1px solid #ccc;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 400px;
      border-radius: 12px;
    }
    #factoryBox input, #factoryBox select {
      padding: 0.5rem;
      margin-right: 0.5rem;
    }
    #factoryBox button, .exchange-buttons button, .navigation-buttons a, .exchange-to-token {
      background-color: #a98256;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      margin: 0.3rem;
      cursor: pointer;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
    }
    .exchange-buttons, .navigation-buttons {
      text-align: center;
      margin: 1rem;
    }
    ul#inventoryItems {
      list-style: none;
      padding-left: 1rem;
    }
    ul#inventoryItems li {
      background: #fff;
      margin: 0.3rem 0;
      padding: 0.4rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    h3 {
      text-align: center;
      color: #504030;
    }
    .container {
      max-width: 800px;
      margin: auto;
    }
    .exchange-to-token {
      display: block;
      margin: 1rem auto;
      background-color: #4d804d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏭 OrcaX 감자 가공공장</h1>
    <div id="statusBox" class="status-box">🔌 서버 연결 확인 중...</div>
    <div id="nicknameBox"></div>
    <div id="resourceBox">
      <p>🥔 감자: <span id="potatoCount">0</span></p>
      <p>💧 물: <span id="waterCount">0</span></p>
      <p>🌾 보리: <span id="barleyCount">0</span></p>
      <p>🌿 거름: <span id="fertilizerCount">0</span></p>
      <p>🪙 ORCX: <span id="tokenCount">0</span></p>
    </div>
    <div id="factoryBox">
      <label><input type="radio" name="productType" value="감자" checked /> 감자</label>
      <label><input type="radio" name="productType" value="보리" /> 보리</label>
      <input type="text" id="productName" placeholder="제품 이름 입력" />
      <button onclick="processProduct()">제품 가공하기</button>
    </div>
    <div class="exchange-buttons">
      <button onclick="exchange('water')">선택 제품 → 물 교환</button>
      <button onclick="exchange('fertilizer')">선택 제품 → 거름 교환</button>
    </div>
    <h3>📦 가공 제품 보관함</h3>
    <ul id="inventoryItems"></ul>
    <div class="navigation-buttons">
      <a href="gamja-shop.html">🛒 씨감자 상점</a>
      <a href="gamja-exchange.html">🔁 자원 교환소</a>
      <a href="gamja-market.html">💰 거래소 이동</a>
    </div>
    <button class="exchange-to-token" onclick="exchangeToToken()">감자 → ORCX 교환하기</button>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname");
    const farmName = localStorage.getItem("farmName");
    const statusBox = document.getElementById("statusBox");

    document.getElementById("nicknameBox").innerText = `👤 ${nickname} (${farmName}) 님`;

    const userData = {
      nickname,
      water: 0,
      fertilizer: 0,
      token: 0,
      potatoCount: 0,
      barleyCount: 0,
      inventory: []
    };

    async function fetchUserData() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata?nickname=${nickname}`);
        if (!res.ok) throw new Error("연결 실패");
        const data = await res.json();
        if (data.nickname) {
          userData.potatoCount = data.potatoCount ?? 0;
          userData.water = data.water ?? 0;
          userData.fertilizer = data.fertilizer ?? 0;
          userData.token = data.token ?? 0;
          userData.barleyCount = data.barleyCount ?? 0;
          userData.inventory = (data.inventory ?? []).filter(
            item => typeof item.type === "string" && item.type !== "undefined" && item.count > 0
          );
          updateDisplay();
          statusBox.innerText = "✅ 전기 공급 중 (서버 연결됨)";
          statusBox.style.color = "green";
        } else {
          throw new Error("데이터 없음");
        }
      } catch (err) {
        statusBox.innerText = "❌ 전기 공급 끊김 (서버 오류)";
        statusBox.style.color = "red";
        console.error(err);
      }
    }

    function updateDisplay() {
      document.getElementById("potatoCount").innerText = userData.potatoCount;
      document.getElementById("waterCount").innerText = userData.water;
      document.getElementById("fertilizerCount").innerText = userData.fertilizer;
      document.getElementById("tokenCount").innerText = userData.token;
      document.getElementById("barleyCount").innerText = userData.barleyCount;
      const list = document.getElementById("inventoryItems");
      list.innerHTML = "";
      userData.inventory.forEach((item, idx) => {
        const li = document.createElement("li");
        li.innerHTML = `<input type="checkbox" value="${idx}"> ${item.type} × ${item.count}`;
        list.appendChild(li);
      });
    }

    async function processProduct() {
      const name = document.getElementById("productName").value.trim();
      const type = document.querySelector('input[name="productType"]:checked').value;
      if (!name) return alert("제품 이름을 입력하세요.");
      if (type === "감자" && userData.potatoCount <= 0) return alert("감자가 부족합니다.");
      if (type === "보리" && userData.barleyCount <= 0) return alert("보리가 부족합니다.");

      const res = await fetch(`${API_BASE}/api/products`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nickname,
          productName: name,
          productType: type,
          quantity: 1
        })
      });

      if (!res.ok) {
        alert("서버에 제품 저장 실패! 전기만 축내고 있어!");
        return;
      }

      if (type === "감자") userData.potatoCount--;
      if (type === "보리") userData.barleyCount--;
      const existing = userData.inventory.find(i => i.type === name);
      if (existing) existing.count++;
      else userData.inventory.push({ type: name, count: 1 });
      await saveUserData();
    }

    async function exchange(type) {
      const selected = Array.from(document.querySelectorAll("#inventoryItems input[type='checkbox']:checked"));
      if (selected.length === 0) return alert("교환할 제품을 선택하세요.");
      const indexes = selected.map(cb => parseInt(cb.value)).sort((a, b) => b - a);
      let successCount = 0;
      indexes.forEach(i => {
        if (userData.inventory[i]) {
          if (userData.inventory[i].count > 1) {
            userData.inventory[i].count--;
          } else {
            userData.inventory.splice(i, 1);
          }
          successCount++;
        }
      });
      if (type === "water") userData.water += successCount;
      if (type === "fertilizer") userData.fertilizer += successCount;
      await saveUserData();
    }

    async function exchangeToToken() {
      if (userData.potatoCount < 1) return alert("감자가 없습니다!");
      userData.token += userData.potatoCount;
      userData.potatoCount = 0;
      await saveUserData();
    }

    async function saveUserData() {
      await fetch(`${API_BASE}/api/userdata`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(userData)
      });
      await fetchUserData();
    }

    fetchUserData();
  </script>
</body>
</html>
