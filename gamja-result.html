<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 감자 가공공장</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #fdf5e6;
      color: #333;
      text-align: center;
    }
    .status {
      margin-top: 1rem;
      color: green;
      font-weight: bold;
    }
    .info-box {
      margin: 2rem auto;
      padding: 1.5rem;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: #fff;
    }
    .product-box {
      margin-top: 1rem;
      font-weight: bold;
    }
    .form-section {
      margin: 2rem auto;
    }
    input[type="text"] {
      padding: 0.5rem;
      width: 180px;
    }
    button {
      padding: 0.5rem 1rem;
      margin: 0.5rem;
      background-color: #a36b3e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .nav {
      margin-top: 2rem;
    }
    .nav button {
      background-color: #b4885f;
    }
  </style>
</head>
<body>
  <h2>🏭 OrcaX 감자 가공공장</h2>
  <div class="status">✅ 전기 공급 중 (서버 연결됨)</div>
  <div style="position:absolute; top:20px; right:20px; font-weight:bold;">
    <span id="nicknameBox">닉네임 로딩 중...</span>
  </div>

  <div class="info-box" id="assetBox">
    감자: -<br>
    물: -<br>
    보리: -<br>
    거름: -<br>
    ORCX: -<br>
  </div>

  <div class="product-box" id="productBox">
    🍟 감자칩: -개<br>
    🍞 보리빵: -개
  </div>

  <div class="form-section">
    <label><input type="radio" name="type" value="potato" checked> 감자</label>
    <label><input type="radio" name="type" value="barley"> 보리</label>
    <input type="text" id="productName" placeholder="제품 이름 입력" />
    <button onclick="processProduct()">제품 가공하기</button>
  </div>

  <div class="nav">
    <button onclick="location.href='gamja-shop.html'">🧺 씨감자 상점</button>
    <button onclick="location.href='gamja-exchange.html'">🔁 자원 교환소</button>
    <button onclick="location.href='gamja-market.html'">💰 거래소 이동</button>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    const farmName = localStorage.getItem("farmName") || "농장";
    const nicknameBox = document.getElementById("nicknameBox");

    if (!nickname) {
      alert("로그인 정보가 없습니다. 처음 페이지로 이동합니다.");
      location.href = "orcax-farm_000.html";
    } else {
      nicknameBox.textContent = `${nickname} (${farmName}) 님`;
      const encoded = encodeURIComponent(nickname);
      fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata/${encoded}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            const u = data.user;
            document.getElementById("assetBox").innerHTML =
              `감자: ${u.potatoCount}<br>` +
              `물: ${u.water}<br>` +
              `보리: ${u.barleyCount}<br>` +
              `거름: ${u.fertilizer}<br>` +
              `ORCX: ${u.token}`;

            document.getElementById("productBox").innerHTML =
              `🍟 감자칩: ${u.potatoProduct || 0}개<br>` +
              `🍞 보리빵: ${u.barleyProduct || 0}개`;
          }
        });
    }

    function processProduct() {
      const type = document.querySelector("input[name='type']:checked").value;
      const name = document.getElementById("productName").value.trim();
      if (!name) return alert("제품 이름을 입력하세요");

      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/process-product", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ nickname, type, name })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert(`✅ ${data.message}`);
            location.reload();
          } else {
            alert(`❌ ${data.message}`);
          }
        })
        .catch(() => alert("서버 오류로 가공에 실패했습니다."));
    }
  </script>
</body>
</html>
