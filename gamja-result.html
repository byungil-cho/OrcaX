<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 감자/보리 식품 가공공장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      font-family:'Do Hyeon',sans-serif;
      /* 배경 이미지를 절대경로로 적용 */
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      margin:0;
      color: #fff; /* 모든 텍스트 흰색 */
      text-shadow: 0 1px 6px rgba(30,40,70,0.18), 0 1px 8px #0008;
    }
    .wrap {
      max-width: 490px;
      margin:2.3rem auto;
      background:rgba(15,25,34,0.70); /* 더 진하게 가독성↑ */
      border-radius:20px;
      padding:2.5rem 1.1rem 1.8rem 1.1rem;
      box-shadow:0 4px 18px rgba(40,160,90,0.10);
    }
    h1 {
      color:#ffe166;
      margin-bottom:1.4rem;
      text-align:center;
      text-shadow: 0 4px 16px #23457c, 0 2px 16px #000c;
    }
    .menu { text-align:center; margin-bottom:1.6rem;}
    .menu a {
      color:#f7e61e;
      text-decoration:underline;
      margin:0 10px;
      font-size:1.1rem;
      text-shadow: 0 1px 8px #233a50;
    }
    .sys {
      margin-bottom:0.9rem;
      background:rgba(255,255,255,0.13);
      border-radius:10px;
      padding:0.6rem 1rem;
      font-size:1.08rem;
      color: #fff;
    }
    .sys span { margin-right:1.3rem;}
    .market-board-box {
      background:rgba(255,255,255,0.13);
      border-radius:13px;
      margin-bottom:1.2rem;
      padding:1.1rem 1rem 0.6rem 1rem;
      box-shadow:0 2px 8px #c5e8e84b;
    }
    .market-board-title { font-size:1.11rem; color:#ffe166; font-weight:bold; margin-bottom:0.7rem;}
    .market-board-list { display:flex; flex-wrap:wrap; gap:1.1rem;}
    .market-board-item {
      background:rgba(0,0,0,0.12);
      border-radius:10px;
      box-shadow:0 1px 7px #ddebe855;
      min-width:108px; text-align:center;
      padding:0.58rem 0.5rem 0.75rem 0.5rem;
      font-size:1.01rem;
      color: #fff;
    }
    .market-board-name { font-weight:bold; color:#ffe166;}
    .market-board-price { color:#ffe166; font-weight:600;}
    .asset {
      background:rgba(255,255,255,0.10);
      border-radius:10px;
      padding:0.6rem 1.1rem;
      margin:0.6rem 0 1.2rem 0;
    }
    .asset-row { display:flex; justify-content:space-between; margin-bottom:0.3rem;}
    .asset-row b { color:#ffe166;}
    .products-box {
      background:rgba(255,255,255,0.10);
      border-radius:13px;
      padding:0.8rem 0.8rem 1.2rem 0.8rem;
      margin:0.5rem 0 1.4rem 0;
    }
    .products-box h3 {
      margin-top:0.5rem;
      color:#ffe166;
      text-shadow: 0 2px 12px #233a50;
    }
    .prod-list { display:flex; flex-wrap:wrap; gap:1.1rem; margin-top:0.5rem; }
    .prod-card {
      background:rgba(0,0,0,0.11);
      border-radius:8px;
      box-shadow:0 1px 7px #eee;
      min-width:108px; text-align:center;
      padding:0.6rem 0.5rem 0.9rem 0.5rem;
      color: #fff;
    }
    .prod-name { font-size:1.04rem; color:#ffe166; margin-bottom:0.18rem;}
    .prod-count { font-weight:bold; color:#f7e61e;}
    .make-box {
      background:rgba(255,255,255,0.12);
      border-radius:13px;
      padding:1.5rem 1.3rem;
      box-shadow:0 1px 6px #f0efea;
    }
    .make-row { margin-bottom:1.2rem; }
    label { font-size:1.06rem;}
    input[type="text"] {
      padding:0.7rem;
      font-size:1.1rem;
      border-radius:7px;
      border:1px solid #888;
      margin-top:0.5rem;
      width:97%;
      background:rgba(0,0,0,0.12);
      color:#fff;
    }
    select {
      padding:0.5rem;
      font-size:1.1rem;
      border-radius:6px;
      background:rgba(0,0,0,0.10);
      color: #fff;
      border:1px solid #888;
    }
    button {
      background:#ffe166;
      color:#23457c;
      border:none;
      border-radius:8px;
      font-size:1.12rem;
      font-family:inherit;
      padding:0.7rem 2.1rem;
      cursor:pointer;
      margin-top:0.7rem;
      font-weight: bold;
      box-shadow: 0 2px 8px #233a5033;
    }
    button:disabled { opacity: 0.7; }
    .log {
      text-align:center;
      color:#ffe166;
      margin-top:1.3rem;
      text-shadow:0 1px 8px #23457c88;
    }
    @media (max-width:600px){
      .wrap{margin:0.4rem;padding:0.7rem 0.18rem;}
    }
    .gray { color: #ddd; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>감자/보리 식품 가공공장</h1>
    <div class="menu">
      <a href="index9.html">메인</a> |
      <a href="gamja-factory.html">감자농장</a> |
      <a href="auction-house.html">마이페이지</a> |
      <a href="gamja-market.html">마켓</a>
    </div>
    <div class="sys">
      <span>서버연결: <b id="svrStat">⏳</b></span>
      <span>닉네임: <b id="nick">-</b></span>
      <span>농장이름: <b id="farm">-</b></span>
    </div>

    <!-- [전광판 시세 박스 추가: 고객 자재표 위에 위치] -->
    <div class="market-board-box">
      <div class="market-board-title">감자/보리 가공식품 시세 전광판</div>
      <div class="market-board-list" id="priceBoard">-</div>
    </div>

    <div class="asset">
      <div class="asset-row"><b>ORCX</b>: <span id="orcx">0</span></div>
      <div class="asset-row"><b>물</b>: <span id="water">0</span> <b>거름</b>: <span id="fert">0</span></div>
      <div class="asset-row"><b>씨감자</b>: <span id="potatoseed">0</span> <b>씨보리</b>: <span id="barleyseed">0</span></div>
      <div class="asset-row"><b>감자</b>: <span id="potato">0</span> <b>보리</b>: <span id="barley">0</span></div>
    </div>
    <div class="products-box">
      <h3>생산한 가공제품 목록</h3>
      <div class="prod-list" id="prodList">
        <div style="opacity:.4;">아직 가공한 제품이 없습니다.</div>
      </div>
    </div>
    <div class="make-box">
      <form id="makeForm" onsubmit="return false;">
        <div class="make-row">
          <label>가공 원료 선택: 
            <select id="material">
              <option value="potato">감자</option>
              <option value="barley">보리</option>
            </select>
          </label>
        </div>
        <div class="make-row">
          <label>가공 제품명 (직접 입력):<br>
            <input id="productName" type="text" maxlength="18" required placeholder="예: 내마음의감자칩">
          </label>
        </div>
        <button id="makeBtn" type="submit">가공하기</button>
      </form>
      <div class="log" id="log"></div>
    </div>
  </div>
  <script>
    // 전광판 시세 불러오기
    async function loadPriceBoard() {
      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/market/price-board");
        const data = await res.json();
        const board = document.getElementById("priceBoard");
        if (!data.success || !data.priceList || !data.priceList.length) {
          board.innerHTML = `<span class="gray">전광판 없음</span>`;
          return;
        }
        board.innerHTML = data.priceList
          .map(item =>
            `<div class="market-board-item">
              <div class="market-board-name">${item.name}</div>
              <div class="market-board-price">${item.price} ORCX</div>
            </div>`
          ).join("");
      } catch (e) {
        document.getElementById("priceBoard").innerHTML = `<span class="gray">전광판 없음</span>`;
      }
    }

    // 유저 정보 상태
    let userInfo = {
      nickname: "",
      orcx: 0, water: 0, fert: 0,
      potatoseed: 0, barleyseed: 0,
      potato: 0, barley: 0,
      products: {}
    };

    // 서버/DB 인벤토리+제품 불러오기
    async function fetchUser() {
      const kid = localStorage.getItem("kakaoId");
      const farmName = localStorage.getItem("farmName") || "-";
      document.getElementById("farm").textContent = farmName;
      try{
        document.getElementById("svrStat").textContent = "⏳";
        if(!kid){ 
          document.getElementById("svrStat").textContent = "❌";
          document.getElementById("nick").textContent = "-";
          return;
        }
        const res = await fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/processing/get-inventory', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ kakaoId: kid })
        });
        const result = await res.json();
        if(result.success){
          document.getElementById("svrStat").textContent = "✅";
          const u = result.user;
          userInfo.nickname = u.nickname||"-";
          userInfo.orcx = u.orcx||0;
          userInfo.water = u.water||0;
          userInfo.fert = u.fertilizer||0;
          userInfo.potatoseed = u.seedPotato||0;
          userInfo.barleyseed = u.seedBarley||0;
          userInfo.potato = u.storage?.gamja||0;
          userInfo.barley = u.storage?.bori||0;
          userInfo.products = u.products||{};
          renderInfo();
        } else {
          document.getElementById("svrStat").textContent = "❌";
          document.getElementById("nick").textContent = "-";
        }
      }catch{
        document.getElementById("svrStat").textContent = "❌";
        document.getElementById("nick").textContent = "-";
      }
    }

    // 정보 표시
    function renderInfo() {
      document.getElementById("nick").textContent = userInfo.nickname;
      document.getElementById("orcx").textContent = userInfo.orcx;
      document.getElementById("water").textContent = userInfo.water;
      document.getElementById("fert").textContent = userInfo.fert;
      document.getElementById("potatoseed").textContent = userInfo.potatoseed;
      document.getElementById("barleyseed").textContent = userInfo.barleyseed;
      document.getElementById("potato").textContent = userInfo.potato;
      document.getElementById("barley").textContent = userInfo.barley;
      // 제품 목록
      const prod = userInfo.products;
      const prodList = document.getElementById("prodList");
      prodList.innerHTML = "";
      let found = false;
      Object.entries(prod).forEach(([name,count])=>{
        if(count>0){
          found = true;
          const d = document.createElement("div");
          d.className = "prod-card";
          d.innerHTML = `<div class="prod-name">${name}</div><div class="prod-count">${count} 개</div>`;
          prodList.appendChild(d);
        }
      });
      if(!found){
        prodList.innerHTML = `<div style="opacity:.4;">아직 가공한 제품이 없습니다.</div>`;
      }
    }

    // 가공폼 submit (연속 처리 개선)
    document.getElementById("makeForm").onsubmit = async function() {
      const makeBtn = document.getElementById("makeBtn");
      makeBtn.disabled = true;
      makeBtn.textContent = "가공 중...";

      const material = document.getElementById("material").value;
      const product = document.getElementById("productName").value.trim();
      const kid = localStorage.getItem("kakaoId");
      if(!kid || !product){ alert("입력 확인!"); makeBtn.disabled=false; makeBtn.textContent="가공하기"; return; }
      if(product.length<2){ alert("제품명을 2자 이상 입력하세요."); makeBtn.disabled=false; makeBtn.textContent="가공하기"; return; }

      // 12종류 이상 방지(0개는 제외)
      const products = userInfo.products || {};
      const nonZero = Object.entries(products).filter(([_,v])=>v>0).map(([k])=>k);
      if(nonZero.length >= 12 && !products[product]) {
        document.getElementById("log").innerHTML = "제품은 동시에 최대 12종까지 가질 수 있습니다.<br>기존 제품 소진 후 새로운 제품명을 추가하세요.";
        makeBtn.disabled=false; makeBtn.textContent="가공하기";
        return;
      }

      try{
        const res = await fetch('https://climbing-wholly-grouper.jp.ngrok.io/api/processing/make-product', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ kakaoId:kid, material, product })
        });
        const result = await res.json();
        if(result.success){
          document.getElementById("log").innerHTML = `가공 성공! <b>${product}</b> 1개 추가`;
          fetchUser();
        } else {
          document.getElementById("log").innerHTML = result.message || "가공 실패";
        }
      }catch{
        document.getElementById("log").innerHTML = "서버 연결 실패";
      }
      makeBtn.disabled = false;
      makeBtn.textContent = "가공하기";
      document.getElementById("productName").focus();
    };

    window.onload = function() {
      fetchUser();
      loadPriceBoard();
    }
  </script>
</body>
</html>
