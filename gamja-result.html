<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔁 감자·보리 통합거래소</title>
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background-color: #f6f9f4;
      margin: 0;
      color: #2e3b2e;
      text-align: center;
    }
    header {
      background-color: #a5d6a7;
      padding: 1.5rem;
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
      position: relative;
    }
    .power-status {
      position: absolute;
      right: 1rem;
      top: 1.5rem;
      font-size: 0.9rem;
      color: #ffffff;
    }
    .user-info {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #4e944f;
    }
    .token-info {
      font-size: 1rem;
      color: #388e3c;
      margin-bottom: 1rem;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
      max-width: 900px;
      margin: auto;
    }
    .box {
      background: white;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h2 {
      color: #4e944f;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0.5rem 0;
    }
    li {
      margin: 0.3rem 0;
    }
    button {
      background-color: #81c784;
      border: none;
      padding: 0.5rem 1rem;
      margin-top: 0.5rem;
      color: white;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #66bb6a;
    }
  </style>
</head>
<body>
  <header>
    🔁 감자·보리 통합거래소
    <div class="power-status" id="powerStatus">🔌 전기 공급 상태 확인 중...</div>
  </header>
  <div class="user-info">
    🌾 사용자: <span id="nicknameDisplay">-</span> | 농장이름: <span id="farmNameDisplay">-</span>
  </div>
  <div class="token-info">
    💰 보유 토큰: <span id="tokenDisplay">-</span>
  </div>
  <div class="container">
    <div class="box">
      <h2>📦 자재 보관소</h2>
      <ul>
        <li>씨감자: <strong id="seedPotato">-</strong></li>
        <li>씨보리: <strong id="seedBarley">-</strong></li>
        <li>물: <strong id="water">-</strong></li>
        <li>거름: <strong id="fertilizer">-</strong></li>
      </ul>
      <button onclick="exchangeToProduct()">자재 → 제품 교환</button>
    </div>
    <div class="box">
      <h2>🎁 제품 보관소</h2>
      <ul>
        <li>감자칩: <strong id="chips">-</strong></li>
        <li>보리빵: <strong id="bread">-</strong></li>
        <li>씨감자: <strong id="newSeed">-</strong></li>
        <li>씨보리: <strong id="newBarley">-</strong></li>
      </ul>
      <button onclick="exchangeToSeed()">제품 → 자재 교환</button>
    </div>
  </div>
  <script>
    const nickname = localStorage.getItem("nickname");
    const farmName = localStorage.getItem("farmname");

    if (!nickname || !farmName) {
      alert("로그인 또는 농장이름 정보가 없습니다. 처음 페이지로 이동합니다.");
      location.href = "orcax-farm_000.html";
    } else {
      document.getElementById("nicknameDisplay").textContent = nickname;
      document.getElementById("farmNameDisplay").textContent = farmName;
      fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata/${encodeURIComponent(nickname)}`)
        .then(res => {
          document.getElementById("powerStatus").textContent = '🟢 전기 공급 중입니다.';
          return res.json();
        })
        .then(data => {
          const u = data.user;
          document.getElementById("seedPotato").textContent = u.seedPotato;
          document.getElementById("seedBarley").textContent = u.seedBarley;
          document.getElementById("water").textContent = u.water;
          document.getElementById("fertilizer").textContent = u.fertilizer;
          document.getElementById("chips").textContent = u.potatoProduct;
          document.getElementById("bread").textContent = u.barleyProduct;
          document.getElementById("newSeed").textContent = u.seedPotato;
          document.getElementById("newBarley").textContent = u.seedBarley;
          document.getElementById("tokenDisplay").textContent = u.token;
        })
        .catch(() => {
          document.getElementById("powerStatus").textContent = '🔴 전기 공급이 끊겼습니다!';
        });
    }
    function exchangeToProduct() {
      alert("자재 → 제품 교환 처리 로직 필요");
    }
    function exchangeToSeed() {
      alert("제품 → 자재 교환 처리 로직 필요");
    }
  </script>
</body>
</html>
