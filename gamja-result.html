<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 감자 가공공장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #fef9e8;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #504030;
      margin: 1rem 0 0.5rem;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem 0.5rem 0;
      color: #503020;
    }
    .status-box {
      text-align: center;
      font-weight: bold;
      padding: 0.5rem;
      background: #fff;
      border: 2px dashed #aaa;
      margin: 0.5rem auto;
      max-width: 300px;
      color: #333;
    }
    #resourceBox, #factoryBox {
      background: #fff;
      border: 1px solid #ccc;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 400px;
      border-radius: 12px;
    }
    #factoryBox input, #factoryBox select {
      padding: 0.5rem;
      margin-right: 0.5rem;
    }
    #factoryBox button, .navigation-buttons a {
      background-color: #a98256;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      margin: 0.3rem;
      cursor: pointer;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
    }
    .navigation-buttons {
      text-align: center;
      margin: 1rem;
    }
    ul#inventoryItems {
      list-style: none;
      padding-left: 1rem;
      max-width: 300px;
      margin: auto;
    }
    ul#inventoryItems li {
      background: #fff;
      margin: 0.3rem 0;
      padding: 0.4rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    h3 {
      text-align: center;
      color: #504030;
    }
    .container {
      max-width: 800px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏭 OrcaX 감자 가공공장</h1>
    <div id="statusBox" class="status-box">🔌 서버 연결 확인 중...</div>
    <div id="nicknameBox"></div>
    <div id="resourceBox">
      <p>🥔 감자: <span id="potatoCount">0</span></p>
      <p>💧 물: <span id="waterCount">0</span></p>
      <p>🌾 보리: <span id="barleyCount">0</span></p>
      <p>🌿 거름: <span id="fertilizerCount">0</span></p>
      <p>🪙 ORCX: <span id="tokenCount">0</span></p>
    </div>
    <div id="factoryBox">
      <label><input type="radio" name="productType" value="감자" checked /> 감자</label>
      <label><input type="radio" name="productType" value="보리" /> 보리</label>
      <input type="text" id="productName" placeholder="제품 이름 입력" />
      <button onclick="processProduct()">제품 가공하기</button>
    </div>
    <h3>📦 가공 제품 보관함</h3>
    <ul id="inventoryItems"></ul>
    <div class="navigation-buttons">
      <a href="gamja-shop.html">🛒 씨감자 상점</a>
      <a href="gamja-exchange.html">🔁 자원 교환소</a>
      <a href="gamja-market.html">💰 거래소 이동</a>
    </div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname");
    const farmName = localStorage.getItem("farmName");
    const statusBox = document.getElementById("statusBox");

    async function fetchUserData() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata?nickname=${nickname}`);
        if (!res.ok) throw new Error("연결 실패");
        const data = await res.json();
        document.getElementById("nicknameBox").innerText = `👤 ${nickname} (${farmName}) 님`;
        document.getElementById("potatoCount").innerText = data.potatoCount ?? 0;
        document.getElementById("waterCount").innerText = data.water ?? 0;
        document.getElementById("fertilizerCount").innerText = data.fertilizer ?? 0;
        document.getElementById("tokenCount").innerText = data.token ?? 0;
        document.getElementById("barleyCount").innerText = data.barleyCount ?? 0;
        statusBox.innerText = "✅ 전기 공급 중 (서버 연결됨)";
        statusBox.style.color = "green";
      } catch (err) {
        statusBox.innerText = "❌ 전기 공급 끊김 (서버 오류)";
        statusBox.style.color = "red";
        console.error(err);
      }
    }

    async function loadProductStorage(nickname) {
      try {
        const res = await fetch(`${API_BASE}/api/products/${nickname}`);
        const products = await res.json();
        const list = document.getElementById("inventoryItems");
        list.innerHTML = "";

        const merged = {};
        products.forEach(item => {
          if (!item.type || item.count < 1 || typeof item.category !== 'string' || item.category.trim() === '') return;
          const key = item.type + ` (${item.category})`;
          if (merged[key]) {
            merged[key].count += item.count;
          } else {
            merged[key] = { ...item, type: key };
          }
        });

        const mergedList = Object.values(merged);
        if (mergedList.length === 0) {
          const li = document.createElement("li");
          li.textContent = "제품이 없습니다.";
          list.appendChild(li);
          return;
        }

        mergedList.forEach((item, idx) => {
          const li = document.createElement("li");
          li.innerHTML = `<input type="checkbox" value="${idx}"> ${item.type} × ${item.count}`;
          list.appendChild(li);
        });
      } catch (err) {
        console.error("📛 제품 보관소 불러오기 실패:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (!nickname || nickname.trim() === "") {
        alert("로그인 정보가 없습니다. 로그인 페이지로 이동합니다.");
        window.location.href = "orcax-farm_000.html";
      }
      fetchUserData();
      loadProductStorage(nickname);
    });
  </script>
</body>
</html>
