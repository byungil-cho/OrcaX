<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌾 나의 농장 현황판</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #222;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .initial-box {
      background-color: #444;
      padding: 1rem;
      border-radius: 10px;
      max-width: 500px;
      margin: 0 auto 2rem auto;
    }
    #potato-count, #yield-count {
      font-size: 1.2rem;
      color: #f0c741;
      font-weight: bold;
    }
    .input-section {
      margin-bottom: 2rem;
    }
    input[type="text"], button {
      padding: 0.5rem;
      font-size: 1rem;
      width: 100%;
      max-width: 300px;
      border-radius: 5px;
      margin: 0.5rem auto;
      display: block;
    }
    button {
      background-color: #f0c741;
      color: #000;
      border: none;
      cursor: pointer;
    }
    .result-box {
      background-color: #333;
      padding: 1rem;
      border-radius: 10px;
      max-width: 500px;
      margin: 0 auto;
      text-align: left;
    }
    .result-box ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    .result-box li {
      margin: 0.25rem 0;
    }
    #server-status {
      margin-top: 1rem;
      font-weight: bold;
      color: #00ff88;
    }
    #farmNameTag {
      font-weight: bold;
      color: #f0c741;
    }
    @media screen and (max-width: 480px) {
      h1 { font-size: 1.5rem; }
    }
    #news-ticker {
      position: fixed;
      bottom: 0;
      width: 100%;
      background-color: #111;
      color: #f0c741;
      padding: 0.5rem;
      font-size: 1rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
    }
    #news-ticker span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll-left 20s linear infinite;
    }
    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <h1>🌾 <span id="farmNameTag">나의 농장</span> 현황판</h1>
  <div id="cooltime-warning" style="background:#333; color:#fff; padding:1rem; margin-bottom:1rem; border-radius:10px; display:none;"></div>
  <div class="initial-box">
    <p id="potato-count">보유 감자: - 개</p>
    <p id="yield-count">오늘 수확: - 개</p>
  </div>
  <div class="input-section">
    <input type="text" id="productInput" placeholder="제품 종류 (예: 칩, 전, 튀김 등)" />
    <button onclick="makeProduct()">제품 만들기</button>
  </div>
  <div id="server-status">🔄 전기 공급 상태 확인 중...</div>
  <div class="result-box">
    <h2>📦 보관함:</h2>
    <ul id="storage-list">
      <li>데이터 불러오는 중...</li>
    </ul>
  </div>
  <div id="news-ticker"><span id="news-message">🚨 신제품 발표가 곧 이어집니다...</span></div>

  <script>
    const BASE_URL = "https://orcax-farm-6000.onrender.com";
    const HARVEST_INTERVAL = 2 * 60 * 60 * 1000;
    const lastHarvest = parseInt(localStorage.getItem("lastHarvest"), 10);
    const now = Date.now();
    const farmName = localStorage.getItem("farmName") || "이름없는농장";
    document.getElementById("farmNameTag").innerText = `[${farmName}]`;
    let rawPotatoCount = 0;

    function goToFarm() {
      localStorage.removeItem("gamjaHarvested");
      window.location.href = "https://byungil-cho.github.io/OrcaX/gamja-farm-integrated.html";
    }

    if (localStorage.getItem("gamjaHarvested") === "true") {
      if (!lastHarvest || now - lastHarvest >= HARVEST_INTERVAL) {
        localStorage.removeItem("gamjaHarvested");
        localStorage.removeItem("lastHarvest");
      } else {
        const remaining = HARVEST_INTERVAL - (now - lastHarvest);
        const mins = Math.floor(remaining / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);

        const warningBox = document.createElement("div");
        warningBox.style.background = "#333";
        warningBox.style.color = "#fff";
        warningBox.style.padding = "2rem";
        warningBox.style.borderRadius = "10px";
        warningBox.style.maxWidth = "500px";
        warningBox.style.margin = "2rem auto";
        warningBox.style.textAlign = "center";
        warningBox.innerHTML = `
          <h2>⏳ 감자가 쉬고 있어요!</h2>
          <p>이미 수확한 기록이 있어 현재는 생산이 중단되었습니다.<br>
          다음 농사 계절은 <strong>${mins}분 ${secs}초</strong> 후에 시작됩니다.</p>
          <p>⏰ 시간이 지나면 자동으로 다시 농사를 지을 수 있어요!</p>
          <button onclick="goToFarm()" style="margin-top:1rem; padding:0.7rem 1.5rem; background:#ffaa00; border:none; border-radius:8px;">🌱 감자 농장으로 돌아가기</button>
        `;
        document.body.innerHTML = "";
        document.body.appendChild(warningBox);
      }
    } else {
      localStorage.setItem("gamjaHarvested", "true");
    }

    fetch(BASE_URL + "/api/ping")
      .then(res => {
        if (res.ok) {
          document.getElementById("server-status").innerText = "🟢 공장에 전기 들어왔어요~!";
          loadInventory();
        } else {
          document.getElementById("server-status").innerText = "🔴 공장 전기 끊킴";
        }
      })
      .catch(err => {
        document.getElementById("server-status").innerText = "🔴 공장 전기 끊킴: 감자 창고가 잠겼습니다!";
      });

    function loadInventory() {
      fetch(BASE_URL + "/api/gamja")
        .then(res => res.json())
        .then(data => {
          rawPotatoCount = data.potatoes || 0;
          document.getElementById("potato-count").innerText = "보유 감자: " + rawPotatoCount + "개";
          document.getElementById("yield-count").innerText = "오늘 수확: " + (data.harvested || 0) + "개";
          updateStorageList(data.items);
        })
        .catch(err => {
          document.getElementById("storage-list").innerHTML = "<li>❌ 감자 보관함을 불러올 수 없습니다.</li>";
        });
    }

    function updateStorageList(items = []) {
      const ul = document.getElementById("storage-list");
      ul.innerHTML = "";
      items.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.name}: ${item.count}개`;
        ul.appendChild(li);
      });
    }

    function announceNewProduct(productName, farmName) {
      const ticker = document.getElementById("news-message");
      ticker.innerText = `🚨 [${farmName}] ${productName} 신제품 출시!`;
    }

    function containsBadWord(text) {
      const bannedWords = ["보지", "자지", "씨발", "fuck", "shit", "좆", "애널", "섹스", "병신"];
      const cleaned = text.toLowerCase().replace(/\s|[^a-zA-Z가-힣0-9]/g, '');
      return bannedWords.some(word => cleaned.includes(word));
    }

    function makeProduct() {
      const input = document.getElementById("productInput").value.trim();
      if (!input) return alert("제품명을 입력해주세요!");
      if (containsBadWord(input)) return alert("🚫 사용할 수 없는 단어가 포함되어 있습니다!");
      if (rawPotatoCount <= 0) return alert("❌ 감자가 부족합니다. 수확량을 확인해주세요!");

      const formattedName = input.startsWith('감자') ? input : `감자${input}`;

      fetch(BASE_URL + "/api/create-product", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: formattedName, farm: farmName })
      })
        .then(res => res.json())
        .then(data => {
          alert("✅ 제품 제작 완료: " + data.name);
          rawPotatoCount = Math.max(0, rawPotatoCount - 1);
          document.getElementById("potato-count").innerText = "보유 감자: " + rawPotatoCount + "개";
          if (data.isNew) announceNewProduct(data.name, farmName);
          loadInventory();
        })
        .catch(err => alert("❌ 제품 제작 실패"));
    }
  </script>
</body>
</html>
