<!DOCTYPE html><html lang="ko"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>감자 제품 만들기</title>  <style>    body {      margin: 0;      padding: 0;      background-color: #222;      color: #fff;      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;      text-align: center;    }    .container {      padding: 2rem;      max-width: 700px;      margin: auto;    }    h1 {      margin-bottom: 1rem;    }    .info {      margin-bottom: 2rem;      font-size: 1.2rem;    }    .form-group {      margin: 1rem 0;    }    input[type="text"] {      padding: 0.5rem;      font-size: 1rem;      width: 300px;      border-radius: 5px;      border: none;      text-align: center;    }    .button {      margin-top: 1rem;      padding: 1rem 2rem;      font-size: 1.1rem;      background-color: #ffaa00;      color: #000;      border: none;      border-radius: 8px;      cursor: pointer;    }    .button:hover {      background-color: #ff8800;    }    .result {      margin-top: 2rem;      padding: 1rem;      background-color: #333;      border-radius: 10px;    }    .inventory {      margin-top: 1rem;      font-size: 1rem;      background-color: #444;      padding: 1rem;      border-radius: 8px;    }    .exit-options {      margin-top: 2rem;      display: none;    }    .exit-options button {      margin: 0.5rem;      padding: 0.8rem 1.5rem;      font-size: 1rem;      border-radius: 8px;      border: none;      background-color: #ffaa00;      color: #000;      cursor: pointer;    }    .exit-options button:hover {      background-color: #ff8800;    }  </style></head><body>  <div class="container">    <h1>감자 제품 만들기</h1>    <div class="info" id="summary"></div>    <div class="form-group">      <input type="text" id="productInput" placeholder="예: 칩, 전, 튀김, 라떼, 스프...">      <br>      <button class="button" onclick="makeProduct()">제품 만들기</button>    </div>    <div class="result" id="resultBox"></div>    <div class="inventory" id="inventoryBox"></div>    <div class="exit-options" id="exitBox">      <p>감자가 모두 소진되었습니다. 이제 어디로 가시겠습니까?</p>      <button onclick="location.href='orcax-farm_000.html'">농장 입구로 가기</button>      <button onclick="location.href='bori-farm.html'">보리밭으로 가기</button>      <button onclick="location.href='orcax-farm_000.html'">퇴근하기</button>    </div>  </div>  <script>    let potatoName = localStorage.getItem("potatoName") || "";    let potatoCount = parseInt(localStorage.getItem("potatoCount")) || 0;    let productInventory = JSON.parse(localStorage.getItem("productInventory") || '{}');    const summary = document.getElementById("summary");    const resultBox = document.getElementById("resultBox");    const inventoryBox = document.getElementById("inventoryBox");    const exitBox = document.getElementById("exitBox");    function updateInventoryDisplay() {      let html = '<strong>📦 보관함:</strong><br>';      for (let key in productInventory) {        html += `- ${key}: ${productInventory[key]}개<br>`;      }      inventoryBox.innerHTML = html;    }    function makeProduct() {      const input = document.getElementById("productInput").value.trim();      if (!input) {        alert("제품 이름을 입력하세요!");        return;      }      if (potatoCount <= 0) {        alert("더 이상 감자가 없습니다!");        return;      }      const productName = `${potatoName}감자${input}`;      productInventory[productName] = (productInventory[productName] || 0) + 1;      potatoCount--;      localStorage.setItem("potatoCount", potatoCount);      localStorage.setItem("productInventory", JSON.stringify(productInventory));      document.getElementById("count").innerText = potatoCount;      resultBox.innerHTML = `✅ <strong>${productName}</strong> 1개 만들었어요!<br>남은 감자: ${potatoCount}개`;      resultBox.style.display = 'block';      updateInventoryDisplay();      if (potatoCount <= 0) {        exitBox.style.display = 'block';      }    }    summary.innerHTML = `<strong>${potatoName}감자</strong> 수확량: <span id="count">${potatoCount}</span>개`;    updateInventoryDisplay();    if (potatoCount <= 0) {      exitBox.style.display = 'block';    }  </script></body></html>
