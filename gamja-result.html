<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>감자 제품 만들기</title>
  <style>
    body {
      background-color: #222;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .initial-box {
      background-color: #444;
      padding: 1rem;
      border-radius: 10px;
      max-width: 500px;
      margin: 0 auto 2rem auto;
    }
    #initial-yield {
      font-size: 1.2rem;
      color: #f0c741;
      font-weight: bold;
    }
    .input-section {
      margin-bottom: 2rem;
    }
    input[type="text"] {
      padding: 0.5rem;
      font-size: 1rem;
      width: 250px;
      border-radius: 5px;
      border: none;
      margin-right: 0.5rem;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background-color: #f0c741;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .result-box {
      background-color: #333;
      padding: 1rem;
      border-radius: 10px;
      max-width: 500px;
      margin: 0 auto;
      text-align: left;
    }
    .result-box h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    .result-box ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    .result-box li {
      margin: 0.25rem 0;
    }
    #server-status {
      margin-top: 1rem;
      font-weight: bold;
      color: #00ff88;
    }
  </style>
</head>
<body>
  <h1>🥔 감자 제품 만들기</h1>

  <div class="initial-box">
    <p id="initial-yield">들고온 감자 수확량: 6개</p>
  </div>

  <div class="input-section">
    <input type="text" placeholder="제품 종류 (예: 칩, 전, 튀김 등)" />
    <button>제품 만들기</button>
  </div>

  <!-- ✅ 서버 연결 상태 표시 -->
  <div id="server-status">🔄 서버 상태 확인 중...</div>

  <div class="result-box">
    <h2>📦 보관함:</h2>
    <ul>
      <li>감자감자칩: 3개</li>
      <li>감자감자전: 5개</li>
      <li>감자감자고구마: 1개</li>
      <li>감자감자전전: 1개</li>
      <li>OrcaX감자레전: 1개</li>
      <li>OrcaX감자타래: 1개</li>
      <li>OrcaX감자부라보: 1개</li>
      <li>OrcaX감자동통: 1개</li>
      <li>OrcaX감자오뚜기: 1개</li>
      <li>OrcaX감자표범: 1개</li>
      <li>감자목반: 1개</li>
    </ul>
  </div>

  <script>
    // ✅ Render에 연결된 감자 농장 서버로 상태 확인
    fetch("https://orcax-farm-6000.onrender.com/api/ping")
      .then(res => {
        if (res.ok) {
          document.getElementById("server-status").innerText = "🟢 서버 연결 성공: 감자 밭과 통신 중입니다!";
        } else {
          document.getElementById("server-status").innerText = "🔴 서버 응답 없음";
        }
      })
      .catch(err => {
        document.getElementById("server-status").innerText = "🔴 서버 연결 실패: 감자 창고가 잠겼습니다!";
      });
  </script>
</body>
</html>
