<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>감자 가공 제품 공장 (실전용)</title>
  <style>
    body {
      background-color: #e5f9d7;
      color: #2b2b2b;
      font-family: sans-serif;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .info-box, .inventory-box {
      background-color: #f0ffe0;
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="text"] {
      padding: 0.5rem;
      width: 200px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-top: 0.5rem;
    }
    button {
      margin-top: 0.5rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background-color: #a7d676;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #2b2b2b;
    }
    button:hover {
      background-color: #8bc34a;
    }
    .green { color: green; }
    .red { color: red; }
    #newsTicker {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #333;
      color: white;
      padding: 0.5rem;
      font-weight: bold;
      overflow: hidden;
      white-space: nowrap;
    }
    #newsText span {
      display: inline-block;
      padding-right: 2rem;
      animation: scrollLeft 20s linear infinite;
    }
    @keyframes scrollLeft {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .btn-box button {
      margin: 0.3rem;
    }
  </style>
</head>
<body>
  <h1>🥔 감자 가공 제품 공장 (실전용)</h1>
  <div class="info-box">
    <div>환영합니다 <strong id="nickname">-</strong> 님!</div>
    <div>보유 감자: <span id="potatoCount">-</span> 개</div>
    <div>오늘 수확: <span id="harvestCount">-</span> 개</div>
    <div id="statusMsg">⚙️ 전기 공급 상태 확인 중...</div>
    <div class="btn-box" id="fallbackButtons" style="display:none;">
      <button onclick="goToPage('gamja-farm.html')">🌱 감자 농장 가기</button>
      <button onclick="goToPage('gamja-market.html')">💰 판매 시장 가기</button>
      <button onclick="goToPage('gamja-shop.html')">🛒 씨감자 상점 가기</button>
    </div>
  </div>

  <div class="info-box">
    <input type="text" id="productName" placeholder="제품 이름 (예: 칩, 전, 국수)">
    <button onclick="createProduct()">제품 만들기</button>
  </div>

  <div class="inventory-box">
    <h3>📦 보관함 목록</h3>
    <ul id="inventoryList"></ul>
  </div>

  <div id="newsTicker"><div id="newsText"></div></div>

  <script>
    const serverUrl = 'https://climbing-wholly-grouper.ngrok-free.app';
    let nickname = localStorage.getItem('nickname');
    if (!nickname) {
      nickname = prompt("닉네임을 입력해주세요:");
      localStorage.setItem('nickname', nickname);
    }
    document.getElementById('nickname').textContent = nickname;

    const newsList = [];

    function updateNewsTicker() {
      const newsText = document.getElementById("newsText");
      newsText.innerHTML = newsList.map(msg => `<span><신제품> ${msg}</span>`).join('');
    }

    function showNews(message) {
      if (newsList.length >= 5) newsList.shift();
      newsList.push(message);
      updateNewsTicker();
    }

    function goToPage(url) {
      fetch(url, { method: 'HEAD' })
        .then(res => {
          if (res.ok) {
            location.href = url;
          } else {
            alert(`⚠️ 페이지가 존재하지 않습니다: ${url}`);
          }
        })
        .catch(() => {
          alert(`⚠️ 페이지 이동 중 오류 발생: ${url}`);
        });
    }

    async function loadData() {
      try {
        const res = await fetch(`${serverUrl}/api/gamja?nickname=${nickname}`);
        const data = await res.json();
        document.getElementById('potatoCount').textContent = data.potatoCount;
        document.getElementById('harvestCount').textContent = data.harvestCount;

        const statusMsg = document.getElementById('statusMsg');
        const btnBox = document.getElementById('fallbackButtons');

        if (data.potatoCount <= 0) {
          statusMsg.innerHTML = '<span class="red">❌ 감자가 없습니다! 생산이 불가능합니다.</span>';
          btnBox.style.display = 'block';
        } else {
          statusMsg.innerHTML = '<span class="green">✅ 전기가 공급되고있어요.</span>';
          btnBox.style.display = 'none';
        }

        const inventoryList = document.getElementById('inventoryList');
        inventoryList.innerHTML = '';
        data.inventory.forEach(item => {
          const name = item.type || item.name || '이름없음';
          const count = item.count || 0;
          const li = document.createElement('li');
          li.textContent = `🔹 ${name} (${count}개)`;
          inventoryList.appendChild(li);
        });

      } catch (err) {
        document.getElementById('statusMsg').innerHTML = '<span class="red">❌ 서버 응답 실패</span>';
      }
    }

    async function createProduct() {
      const product = document.getElementById('productName').value.trim();
      if (!product) return alert('제품 이름을 입력해주세요.');

      const fullName = `감자 ${product}`;

      try {
        const res = await fetch(`${serverUrl}/api/create-product`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname, type: fullName })
        });
        const result = await res.json();
        alert(result.message || '제품 생성 완료!');
        showNews(`${result.type}이 출시되었습니다!`);
        loadData();
      } catch (err) {
        alert('제품 생성 실패');
      }
    }

    loadData();
  </script>
</body>
</html>
