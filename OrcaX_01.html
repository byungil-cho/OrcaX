
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrcaX 메인 페이지</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      font-family: 'Segoe UI', sans-serif;
      color: #003b6f;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .logo {
      max-width: 300px;
      width: 80%;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    h1 {
      margin-top: 30px;
      font-size: 1.8rem;
    }

    p {
      font-size: 1rem;
      margin: 10px 0 30px;
      color: #555;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.4rem;
      }
      p {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="https://byungil-cho.github.io/OrcaX/index.html">
      <img src="ORCAX.jpg" alt="OrcaX 로고" class="logo" />
    </a>
    <h1>Web3 + Real World</h1>
    <p>OrcaX와 함께 새로운 항해를 시작하세요.<br>범고래 재단과 함께 연결되는 세상으로!</p>
  </div>
</body>
</html>
