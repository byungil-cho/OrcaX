
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaX 농장 입구</title>
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
</head>
<body style="background:#111;color:#fff;text-align:center;font-family:sans-serif;padding-top:100px;">
  <h1>🐳 OrcaX 농장 입구</h1>
  <p id="nicknameDisplay"></p>
  <button id="loginBtn" onclick="goKakaoLogin()" style="margin-top:2rem;padding:1rem 2rem;font-size:1.2rem;">카카오 로그인</button>

  <script>
    Kakao.init("284b798a9d9be8202f9c2e129fa6f329");

    function goKakaoLogin() {
      const client_id = "284b798a9d9be8202f9c2e129fa6f329";
      const redirect_uri = "https://byungil-cho.github.io/OrcaX/kakao-callback.html";
      const url = \`https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=\${client_id}&redirect_uri=\${encodeURIComponent(redirect_uri)}\`;
      window.location.href = url;
    }

    const nickname = localStorage.getItem("nickname");
    if (nickname) {
      document.getElementById("nicknameDisplay").textContent = \`👤 \${nickname}님, 환영합니다!\`;
      document.getElementById("loginBtn").style.display = "none";
    }
  </script>
</body>
</html>
