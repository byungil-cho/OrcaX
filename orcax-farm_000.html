<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌫 OrcaX 농장 입구</title>
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('farm-000.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      color: white;
    }
    .container {
      padding-top: 12vh;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      background-color: rgba(0,0,0,0.6);
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 10px;
    }
    .nickname {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background-color: rgba(0, 0, 0, 0.6);
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 10px;
    }
    .logout-btn {
      margin-top: 1rem;
      background: #bbb;
      color: #000;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      display: none;
    }
    .field-section {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
    }
    .field {
      display: inline-block;
    }
    .field img {
      width: 200px;
      height: auto;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 10px black;
    }
    .field span {
      display: block;
      margin-top: 0.5rem;
      background: rgba(0,0,0,0.5);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-weight: bold;
    }
    .bottom-links {
      margin-top: 3rem;
      font-size: 0.9rem;
    }
    .bottom-links a {
      display: inline-block;
      background: rgba(255,255,255,0.8);
      padding: 0.4rem 0.8rem;
      color: #222;
      margin: 0 0.5rem;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .kakao-btn {
      margin-top: 2.5rem;
      background: #FEE500;
      color: #000;
      border: none;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
      position: relative;
      z-index: 9999;
      pointer-events: auto;
    }
    @media (max-width: 768px) {
      .field img { width: 160px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌫 OrcaX 농장 입구</h1>

    <div id="nicknameDisplay" class="nickname" style="display: none;"></div>
    <button id="logoutBtn" class="logout-btn" onclick="logout()">로그아웃</button>

    <div class="field-section">
      <a href="gamja-farm.html" class="field">
        <img src="farm-101.png" alt="감자 밭">
        <span>🥔 감자 밭</span>
      </a>
      <a href="bori-farm.html" class="field">
        <img src="farm-201.png" alt="보리 밭">
        <span>🌾 보리 밭</span>
      </a>
    </div>

    <div class="bottom-links">
      <a href="index.html">⬅ 농장 밖으로</a>
      <a href="auction-house.html">📊 경매장 입장</a>
    </div>

    <button id="loginBtn" class="kakao-btn" type="button" onclick="popupKakaoLogin()">카카오 로그인</button>
  </div>

  <script>
    Kakao.init("284b798a9d9be8202f9c2e129fa6f329");

    function popupKakaoLogin() {
      Kakao.Auth.login({
        scope: 'profile_nickname',
        throughTalk: false,
        success: function(authObj) {
          Kakao.Auth.setAccessToken(authObj.access_token);
          Kakao.API.request({
            url: '/v2/user/me',
            success: function(response) {
              const kakaoUserId = response.id;
              const kakaoNickname = response.kakao_account.profile.nickname;
              localStorage.setItem("userId", kakaoUserId);
              localStorage.setItem("nickname", kakaoNickname);
              updateLoginUI(kakaoNickname);
            },
            fail: function(error) {
              alert("사용자 정보 요청 실패: " + JSON.stringify(error));
            }
          });
        },
        fail: function(err) {
          alert("로그인 실패: " + JSON.stringify(err));
        }
      });
    }

    function updateLoginUI(nickname) {
      const nicknameEl = document.getElementById("nicknameDisplay");
      nicknameEl.textContent = "👤 " + nickname + "님, 환영합니다!";
      nicknameEl.style.display = "inline-block";
      document.getElementById("loginBtn").style.display = "none";
      document.getElementById("logoutBtn").style.display = "inline-block";
    }

    function logout() {
      Kakao.Auth.logout(function() {
        localStorage.clear();
        alert("\ub85c\uadf8\uc544\uc6c3 \ub418\uc5c8\uc2b5\ub2c8\ub2e4.");
        window.location.reload();
      });
    }

    const storedNickname = localStorage.getItem("nickname");
    if (storedNickname) {
      updateLoginUI(storedNickname);
    }
  </script>
</body>
</html>
