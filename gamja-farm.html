
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>감자 농장 입장</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      margin: 0;
      padding: 0;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.5);
      margin-top: 5%;
      padding: 20px;
      display: inline-block;
      border-radius: 12px;
    }
    .btn {
      margin-top: 20px;
      padding: 15px 30px;
      background-color: #FFD700;
      color: black;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .status {
      margin-top: 20px;
      color: #00FF00;
      font-weight: bold;
    }
    .info-box {
      background-color: #2166d1;
      padding: 8px;
      margin: 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🥔 감자 농장에 오신 걸 환영합니다!</h1>
    <div class="info-box">👤 닉네임: <span id="nickname">-</span></div>
    <div class="info-box">🥔 감자: <span id="potato">0</span> 개</div>
    <div class="info-box">💧 물: <span id="water">0</span> 개</div>
    <div class="info-box">🌱 거름: <span id="fertilizer">0</span> 개</div>
    <div class="info-box">🪙 ORCX: <span id="token">0</span> 개</div>
    <div class="info-box">🥔 씨감자: <span id="seedPotato">0</span> 개</div>
    <div class="info-box">🌾 씨보리: <span id="seedBarley">0</span> 개</div>

    <div class="status" id="serverStatus">⏳ 서버 상태 확인 중...</div>

    <button class="btn" onclick="location.href='gamja-main.html'">🌱 농장이름 짓기 이동</button>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

    async function fetchUserData() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata`);
        const data = await res.json();

        if (data.success) {
          document.getElementById("nickname").textContent = data.nickname || "-";
          document.getElementById("potato").textContent = data.potato || 0;
          document.getElementById("water").textContent = data.water || 0;
          document.getElementById("fertilizer").textContent = data.fertilizer || 0;
          document.getElementById("token").textContent = data.token || 0;
          document.getElementById("seedPotato").textContent = data.seedPotato || 0;
          document.getElementById("seedBarley").textContent = data.seedBarley || 0;
          document.getElementById("serverStatus").textContent = "✅ 서버 전원 ON: 감자밭 연결 완료";
        } else {
          document.getElementById("serverStatus").textContent = "❌ 서버 응답 실패: 로그인 필요";
        }
      } catch (err) {
        document.getElementById("serverStatus").textContent = "❌ 서버 연결 실패";
      }
    }

    fetchUserData();
  </script>
</body>
</html>
