<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장 입장</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      margin: 0;
      padding: 0;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 100px auto;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 28px;
      text-align: center;
      margin-bottom: 20px;
    }
    .info {
      margin-bottom: 10px;
      font-size: 18px;
    }
    .nickname {
      font-weight: bold;
      color: #5a4caf;
    }
    #refreshBtn {
      margin-top: 20px;
      padding: 8px 15px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background-color: #5a4caf;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to 감자 농장!</h1>
    <div class="info">닉네임: <span id="nickname" class="nickname"></span></div>
    <div class="info">농장이름: <span id="farmName"></span></div>
    <hr />
    <div class="info">씨감자: <span id="seedPotato"></span>개</div>
    <div class="info">씨보리: <span id="seedBarley"></span>개</div>
    <div class="info">물: <span id="water"></span>개</div>
    <div class="info">거름: <span id="fertilizer"></span>개</div>
    <div class="info">ORCX: <span id="orcx"></span>개</div>
    <div class="info">보유 감자: <span id="potato"></span>개</div>
    <button id="refreshBtn">🔄 새로고침</button>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

    async function fetchUserData() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata`, {
          credentials: 'include'
        });
        if (!res.ok) throw new Error("서버 응답 오류");
        const data = await res.json();

        document.getElementById("nickname").textContent = data.nickname || '-';
        document.getElementById("farmName").textContent = data.farmName || '-';
        document.getElementById("seedPotato").textContent = data.seedPotato ?? '0';
        document.getElementById("seedBarley").textContent = data.seedBarley ?? '0';
        document.getElementById("water").textContent = data.water ?? '0';
        document.getElementById("fertilizer").textContent = data.fertilizer ?? '0';
        document.getElementById("orcx").textContent = data.ORCX ?? '0';
        document.getElementById("potato").textContent = data.potato ?? '0';
      } catch (err) {
        alert("데이터 불러오기 실패: " + err.message);
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", fetchUserData);
    window.onload = fetchUserData;
  </script>
</body>
</html>
