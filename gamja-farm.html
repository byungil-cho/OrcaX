<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>감자 농장 입장</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      margin: 0;
      padding: 0;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.5);
      margin-top: 5%;
      padding: 20px;
      display: inline-block;
      border-radius: 12px;
    }
    .btn {
      margin-top: 20px;
      padding: 15px 30px;
      background-color: #FFD700;
      color: black;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .status {
      margin-top: 20px;
      color: #00FF00;
      font-weight: bold;
    }
    .info-box {
      background-color: #2166d1;
      padding: 8px;
      margin: 6px;
      border-radius: 6px;
      text-align: left;
    }
  </style>
  <script>
    'use strict';
    const API = "https://climbing-wholly-grouper.jp.ngrok.io/api";
  </script>
</head>
<body>
  <div class="container" role="region" aria-label="감자 농장 대시보드">
    <h1>🥔 감자 농장에 오신 걸 환영합니다!</h1>
    <div class="info-box">👤 닉네임: <span id="nickname">-</span></div>
    <div class="info-box">🥔 감자: <span id="potato">0</span> 개</div>
    <div class="info-box">💧 물: <span id="water">0</span> 개</div>
    <div class="info-box">🌱 거름: <span id="fertilizer">0</span> 개</div>
    <div class="info-box">🪙 ORCX: <span id="token">0</span> 개</div>
    <div class="info-box">🥔 씨감자: <span id="seedPotato">0</span> 개</div>
    <div class="info-box">🌾 씨보리: <span id="seedBarley">0</span> 개</div>
    <div class="info-box">🧺 인벤토리:</div>
    <div id="inventoryBox" class="info-box"></div>
    <div class="status" id="serverStatus" aria-live="polite">⏳ 서버 상태 확인 중...</div>
    <button id="startBtn" class="btn" disabled>🌱 농장이름 짓기 이동</button>
  </div>
  <script>
  const API = "https://climbing-wholly-grouper.jp.ngrok.io/api";
  const nickname = localStorage.getItem("nickname") || "범고래X";
  const farmName = localStorage.getItem("farmName") || "하늘농장";

  document.getElementById("nickname").textContent = nickname;
  document.getElementById("farmName").textContent = farmName;

  async function fetchUserData() {
    try {
      const kakaoId = localStorage.getItem("kakaoId");
      if (!kakaoId) {
        alert("카카오 ID가 없습니다.");
        return;
      }

      const res = await fetch(`${API}/userdata`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ kakaoId }),
      });

      const data = await res.json();
      if (data.success && data.users && data.users.length > 0) {
        const user = data.users[0];

        document.getElementById("nickname").textContent = user.nickname || "알 수 없음";
        document.getElementById("water").textContent = user.water;
        document.getElementById("fertilizer").textContent = user.fertilizer;
        document.getElementById("orcx").textContent = user.orcx;
        document.getElementById("gamja").textContent = user.potato;
        document.getElementById("bori").textContent = user.bori || 0;
        document.getElementById("seedPotato").textContent = user.seedPotato || 0;
        document.getElementById("seedBarley").textContent = user.seedBarley || 0;
      } else {
        alert("유저 정보를 불러올 수 없습니다.");
      }
    } catch (err) {
      console.error("API 오류", err);
      alert("서버 연결에 실패했습니다.");
    }
  }

  fetchUserData();
</script>

</body>
</html>
