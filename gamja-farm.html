<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>감자밭 준비 화면</title>
<style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 20px;
      color: white;
    }
    .container {
      background: rgba(0,0,0,0.6);
      padding: 20px;
      border-radius: 10px;
    }
    h2 {
      margin-top: 0;
    }
    .resource-list p {
      margin: 8px 0;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="container">
<h2>감자밭 입장 전 준비상태</h2>
<p id="serverStatus">🔄 서버 상태 확인 중...</p>
<p id="nickname">👤 사용자: </p>
<div class="resource-list">
<p>🪙 토큰: <span id="token">0</span></p>
<p>🥔 씨감자: <span id="potatoSeed">0</span></p>
<p>🌾 씨보리: <span id="barleySeed">0</span></p>
<p>💧 물: <span id="water">0</span></p>
<p>🌿 거름: <span id="fertilizer">0</span></p>
</div>
<button onclick="goToFarm()">감자농장 가기</button>
</div>
<script>
    async function fetchData() {
      const nickname = localStorage.getItem("nickname");
      if (!nickname) return window.location.href = "index9.html";
      document.getElementById("nickname").textContent = `👤 사용자: ${nickname}`;

      try {
        // ✅ 유저 자동 등록 (없으면 생성됨)
        await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/user/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname }),
        });

        // ✅ 최초 자원 지급 (1회)
        await fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/user/${encodeURIComponent(nickname)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            seed_potato: 2,
            water: 10,
            fertilizer: 10,
            token: 10
          }),
        });

        // ✅ 유저 정보 조회
        const res = await fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/user/${encodeURIComponent(nickname)}`);
        const data = await res.json();

        if (data && data.nickname) {
          document.getElementById("token").textContent = data.token || 0;
          document.getElementById("potatoSeed").textContent = data.seed_potato || 0;
          document.getElementById("barleySeed").textContent = data.seed_barley || 0;
          document.getElementById("water").textContent = data.water || 0;
          document.getElementById("fertilizer").textContent = data.fertilizer || 0;
        } else {
          alert("❌ 사용자 정보 없음");
        }
      } catch {
        alert("서버에서 자원 불러오기 실패");
      }
    }

    async function checkServer() {
      try {
        await fetch("https://climbing-wholly-grouper.jp.ngrok.io/");
        document.getElementById("serverStatus").textContent = "🟢 전기 연결됨";
      } catch {
        document.getElementById("serverStatus").textContent = "🔴 전기 꺼짐";
      }
    }

    function goToFarm() {
      window.location.href = "gamja-main.html";
    }

    fetchData();
    checkServer();
</script>
</body>
</html>
