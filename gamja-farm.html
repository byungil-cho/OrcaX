<!-- gamja-farm.html (최종 복원본: 로그인 연동 & 디자인 유지) -->

<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🥔 감자 농장 - Potato Farm</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    .info-box {
      background: rgba(0,0,0,0.6);
      padding: 20px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 10vh;
    }
    .info-box p {
      margin: 8px 0;
      font-size: 1.1rem;
    }
    .info-box a {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 16px;
      background: #fee500;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="info-box">
    <h1>🌾 감자 농장에 오신 것을 환영합니다!</h1>
    <p><strong>닉네임:</strong> <span id="nickname">로딩중...</span></p>
    <p><strong>카카오 ID:</strong> <span id="kakaoId">로딩중...</span></p>
    <p><strong>보유 ORCX:</strong> <span id="orcx">0</span></p>
    <p>💧 물: <span id="water">0</span> / 🌱 거름: <span id="fertilizer">0</span></p>
    <a href="gamja-main.html" id="enterBtn">👉 농장이름 짓고 입장하기</a>
  </div>

  <script>
    // 로그인 체크
    const kakaoId = localStorage.getItem('kakaoId');
    if (!kakaoId) {
      alert('로그인이 필요합니다.');
      window.location.href = 'index9.html';
    }

    // 로컬 데이터 표시
    document.getElementById('kakaoId').textContent = kakaoId;

    // 서버에서 상세 데이터 조회
    fetch(`/api/userdata?kakaoId=${encodeURIComponent(kakaoId)}`)
      .then(res => {
        if (!res.ok) throw new Error('데이터 조회 실패');
        return res.json();
      })
      .then(data => {
        document.getElementById('nickname').textContent = data.nickname;
        document.getElementById('orcx').textContent     = data.orcx;
        document.getElementById('water').textContent    = data.water;
        document.getElementById('fertilizer').textContent = data.fertilizer;
      })
      .catch(() => {
        // 서버 장애 시 로컬로 대체
        document.getElementById('nickname').textContent = localStorage.getItem('nickname') || '없음';
      });

    // 입장 버튼 활성화 (추가 로직 필요 시)
    document.getElementById('enterBtn').addEventListener('click', e => {
      // 필요 시 추가 체크
    });
  </script>

</body>
</html>
