<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 농장 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      margin: 2rem auto;
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      border-radius: 1rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .section {
      margin-bottom: 1.5rem;
      font-size: 1.2rem;
    }
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background-color: #222;
      padding: 1rem;
      position: fixed;
      width: 100%;
      bottom: 0;
      left: 0;
    }
    .bottom-nav a {
      color: yellow;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>감자 농장 대시보드</h1>
    <p>👨‍🌾 농장주: <span id="nickname">-</span></p>
    <p>📛 농장이름: <span id="farmName">-</span></p>

    <div class="section">
      <h3>📦 농자재 보관함</h3>
      <p>물: <span id="water">-</span></p>
      <p>거름: <span id="fertilizer">-</span></p>
      <p>ORCX: <span id="orcx">-</span></p>
    </div>

    <div class="section">
      <h3>🥔 작물 보관소</h3>
      <p>감자: <span id="potato">-</span></p>
      <p>보리: <span id="barley">-</span></p>
    </div>

    <div class="section">
      <h3>🌱 씨앗 보유 (로컬 기준)</h3>
      <p>씨감자: <span id="seedPotato">-</span></p>
      <p>씨보리: <span id="seedBarley">-</span></p>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="gamja-main.html">🌾 농장 작명소</a>
    <a href="gamja-shop.html">🛒 씨앗 상점</a>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";

    const nickname = localStorage.getItem("nickname") || "-";
    const farmName = localStorage.getItem("farmName") || "-";
    const seedPotato = localStorage.getItem("seedPotato") || 0;
    const seedBarley = localStorage.getItem("seedBarley") || 0;

    document.getElementById("nickname").textContent = nickname;
    document.getElementById("farmName").textContent = farmName;
    document.getElementById("seedPotato").textContent = seedPotato;
    document.getElementById("seedBarley").textContent = seedBarley;

    async function loadData() {
      try {
        const res = await fetch(`${API_BASE}/userdata`);
        if (!res.ok) throw new Error("데이터 불러오기 실패");
        const data = await res.json();
        document.getElementById("water").textContent = data.water ?? 0;
        document.getElementById("fertilizer").textContent = data.fertilizer ?? 0;
        document.getElementById("orcx").textContent = data.orcx ?? 0;
        document.getElementById("potato").textContent = data.potato ?? 0;
        document.getElementById("barley").textContent = data.barley ?? 0;
      } catch (err) {
        console.log("서버 연결 오류:", err);
      }
    }

    loadData();
  </script>
</body>
</html>
