<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 농장 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }
    main {
      padding: 2rem;
      background-color: rgba(0, 0, 0, 0.5);
      margin: 2rem;
      border-radius: 15px;
    }
    h1 {
      margin-bottom: 1rem;
    }
    .status {
      margin-bottom: 2rem;
    }
    .dashboard-section {
      margin: 1rem 0;
    }
    button {
      margin: 1rem 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>감자 농장 대시보드</h1>
    <div class="status" id="status">🔌 서버 연결 상태: 확인 중...</div>

    <div class="dashboard-section">
      <strong>🌱 농장주:</strong> <span id="nickname">-</span><br />
      <strong>💖 농장이름:</strong> <span id="farmName">-</span>
    </div>

    <div class="dashboard-section">
      <h3>🧺 농자재 보관함</h3>
      물: <span id="water">-</span><br />
      거름: <span id="fertilizer">-</span><br />
      ORCX: <span id="orcx">-</span>
    </div>

    <div class="dashboard-section">
      <h3>🥚 작물 보관소</h3>
      감자: <span id="potato">-</span><br />
      보리: <span id="bori">-</span>
    </div>

    <div class="dashboard-section">
      <h3>🌱 씨앗 보유</h3>
      씨감자: <span id="seedPotato">-</span><br />
      씨보리: <span id="seedBarley">-</span>
    </div>

    <div>
      <button onclick="location.href='gamja-main.html'">🌾 농장이름 짓기</button>
      <button onclick="location.href='mypage.html'">📘 마이페이지</button>
      <button onclick="location.href='index.html'">🏠 메인으로</button>
    </div>
  </main>

  <script>
    const kakaoId = localStorage.getItem("kakaoId");
    const farmName = localStorage.getItem("farmName");

    if (!kakaoId || kakaoId === "null") {
      document.getElementById("status").innerText = "⚠️ 유저 정보 없음 또는 초기화 필요";
    } else {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kakaoId }),
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.success) {
            document.getElementById("status").innerText = "✅ 서버 연결 완료";
            const user = data.user;
            document.getElementById("nickname").innerText = user.nickname;
            document.getElementById("water").innerText = user.inventory.water;
            document.getElementById("fertilizer").innerText = user.inventory.fertilizer;
            document.getElementById("orcx").innerText = user.wallet.orcx;
            document.getElementById("potato").innerText = user.storage.gamja;
            document.getElementById("bori").innerText = user.storage.bori;
            document.getElementById("seedPotato").innerText = user.inventory.seedPotato;
            document.getElementById("seedBarley").innerText = user.inventory.seedBarley;
            document.getElementById("farmName").innerText = farmName ?? "-";
          } else {
            document.getElementById("status").innerText = "⚠️ 유저 정보 없음 또는 초기화 필요";
          }
        })
        .catch((err) => {
          console.error("연결 오류", err);
          document.getElementById("status").innerText = "❌ 서버 오류";
        });
    }
  </script>
</body>
</html>
