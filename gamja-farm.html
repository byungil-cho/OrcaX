<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>감자 농장 대시보드</title>
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
    }
    .dashboard {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 2rem;
      margin: 2rem auto;
      width: 90%;
      max-width: 500px;
      border-radius: 1rem;
    }
    h1 { font-size: 2rem; }
    .section {
      margin: 1rem 0;
      text-align: left;
    }
    .section strong {
      display: block;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1>감자 농장 대시보드</h1>
    <div>👩‍🌾 농장주: <span id="nickname">-</span></div>
    <div>💗 농장이름: <span id="farmName">-</span></div>

    <div class="section">
      <strong>📦 농자재 보관함</strong>
      물: <span id="water">-</span><br>
      거름: <span id="fertilizer">-</span><br>
      ORCX: <span id="orcx">-</span>
    </div>

    <div class="section">
      <strong>🥚 작물 보관소</strong>
      감자: <span id="potato">-</span><br>
      보리: <span id="barley">-</span>
    </div>

    <div class="section">
      <strong>🌱 씨앗 보유</strong>
      씨감자: <span id="seedPotato">-</span><br>
      씨보리: <span id="seedBarley">-</span>
    </div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";

    const nickname = localStorage.getItem("nickname") || "범고래X";
    const farmName = localStorage.getItem("farmName") || "하늘농장";
    document.getElementById("nickname").innerText = nickname;
    document.getElementById("farmName").innerText = farmName;

    async function fetchFarmData() {
      try {
        const res = await fetch(`${API_BASE}/userdata`);
        const data = await res.json();
        if (data.success) {
          const u = data.user;
          document.getElementById("water").innerText = u.inventory.water ?? 0;
          document.getElementById("fertilizer").innerText = u.inventory.fertilizer ?? 0;
          document.getElementById("orcx").innerText = u.wallet.orcx ?? 0;
          document.getElementById("potato").innerText = u.storage.potato ?? 0;
          document.getElementById("barley").innerText = u.storage.barley ?? 0;
          document.getElementById("seedPotato").innerText = u.inventory.seedPotato ?? 0;
          document.getElementById("seedBarley").innerText = u.inventory.seedBarley ?? 0;
        } else {
          alert("데이터 불러오기 실패: " + data.message);
        }
      } catch (e) {
        console.error(e);
        alert("서버 연결 실패");
      }
    }

    fetchFarmData();
  </script>
</body>
</html>
