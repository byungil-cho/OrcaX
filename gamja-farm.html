"<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 농장 준비</title>
  <style>
    body {
      background-color: #f9f9f9;
      font-family: 'Arial';
      text-align: center;
      padding: 20px;
    }
    .container {
      border: 2px solid #333;
      border-radius: 10px;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
      background-color: #fff;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
    }
    .nickname {
      font-size: 18px;
      color: #007BFF;
      margin-top: 10px;
    }
    .resources {
      margin-top: 20px;
      text-align: left;
    }
    .next-btn {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #28a745;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">감자 농장 - 준비 완료</div>
    <div id="nicknameDisplay" class="nickname"></div>
    <div class="resources">
      <p>씨감자: <span id="seedPotatoCount">-</span></p>
      <p>씨보리: <span id="seedBarleyCount">-</span></p>
      <p>물: <span id="waterCount">-</span></p>
      <p>거름: <span id="fertilizerCount">-</span></p>
      <p>토큰: <span id="tokenCount">-</span></p>
    </div>
    <button class="next-btn" onclick="goToNext()">다음 단계로</button>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

    async function fetchUserData(nickname) {
      try {
        const res = await fetch(`${API_BASE}/api/userdata?nickname=${nickname}`);
        const data = await res.json();
        if (data.success && data.user) {
          document.getElementById("seedPotatoCount").textContent = data.user.seedPotato || 0;
          document.getElementById("seedBarleyCount").textContent = data.user.seedBarley || 0;
          document.getElementById("waterCount").textContent = data.user.water || 0;
          document.getElementById("fertilizerCount").textContent = data.user.fertilizer || 0;
          document.getElementById("tokenCount").textContent = data.user.token || 0;
        }
      } catch (err) {
        console.error("자산 정보 불러오기 실패:", err);
      }
    }

    function initPage() {
      const nickname = localStorage.getItem("nickname");
      if (!nickname) {
        alert("로그인이 필요합니다.");
        window.location.href = "index9.html";
        return;
      }
      document.getElementById("nicknameDisplay").textContent = "👤 " + nickname + "님 환영합니다!";
      fetchUserData(nickname);
    }

    function goToNext() {
      window.location.href = "gamja-main.html";
    }

    initPage();
  </script>
</body>
</html>
