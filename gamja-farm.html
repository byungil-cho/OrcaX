
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 농장</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .info-box {
      margin-top: 100px;
      background-color: rgba(0,0,0,0.6);
      padding: 20px;
      border-radius: 15px;
      display: inline-block;
    }
    .info-box p {
      font-size: 18px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="info-box">
    <h1>🥔 감자 농장에 오신 것을 환영합니다!</h1>
    <p><strong>닉네임:</strong> <span id="nickname">로딩 중...</span></p>
    <p><strong>카카오 ID:</strong> <span id="kakaoId">로딩 중...</span></p>
    <p><strong>ORCX:</strong> <span id="orcx">0</span></p>
    <p>💧 물: <span id="water">0</span> | 🌱 거름: <span id="fertilizer">0</span></p>
    <p>🥔 씨감자: <span id="seedPotato">0</span></p>
  </div>

  <script>
    const kakaoId = localStorage.getItem('userId');
    const nickname = localStorage.getItem('nickname');
    if (!kakaoId) {
      alert('로그인이 필요합니다.');
      location.href = 'index9.html';
    }

    document.getElementById('kakaoId').textContent = kakaoId;
    document.getElementById('nickname').textContent = nickname;

    fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata?kakaoId=${kakaoId}`)
      .then(res => res.json())
      .then(data => {
        if (!data.success || !data.user) {
          alert("등록된 사용자 정보가 없습니다.");
          localStorage.clear();
          location.href = 'index9.html';
          return;
        }

        const user = data.user;
        document.getElementById('orcx').textContent = user.orcx;
        document.getElementById('water').textContent = user.water;
        document.getElementById('fertilizer').textContent = user.fertilizer;
        document.getElementById('seedPotato').textContent = user.seedPotato;
      })
      .catch(err => {
        console.error("API 호출 실패:", err);
        alert("서버 오류가 발생했습니다.");
      });
  </script>
</body>
</html>
