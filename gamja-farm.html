<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 농장 입장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: url("https://byungil-cho.github.io/OrcaX/farm-101.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    header {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 1rem;
    }
    main {
      padding: 2rem;
    }
    h1 {
      margin-bottom: 1rem;
    }
    .resource-box {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem;
      display: inline-block;
      text-align: left;
    }
    .resource-box span {
      font-weight: bold;
      color: #00e0ff;
    }
    .nav-buttons {
      margin-top: 2rem;
    }
    .nav-buttons a {
      display: inline-block;
      margin: 0 1rem;
      padding: 0.75rem 1.5rem;
      background-color: rgba(0, 224, 255, 0.8);
      border-radius: 10px;
      color: #000;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-buttons a:hover {
      background-color: rgba(0, 224, 255, 1);
    }
  </style>
</head>
<body>
  <header>
    <h1>🐳 감자 농장에 오신 것을 환영합니다!</h1>
    <p>닉네임: <span id="nickname">-</span></p>
  </header>
  <main>
    <div class="resource-box">
      <p>보유 ORCX: <span id="orcx">0</span></p>
      <p>물: <span id="water">0</span></p>
      <p>거름: <span id="fertilizer">0</span></p>
      <p>감자: <span id="potato">0</span></p>
      <p>보리: <span id="bori">0</span></p>
      <p>씨감자: <span id="seedPotato">0</span></p>
      <p>씨보리: <span id="seedBarley">0</span></p>
    </div>

    <div class="nav-buttons">
      <a href="gamja-main.html">🚜 농장이름 짓기</a>
      <a href="index9.html">🏠 메인으로</a>
    </div>
  </main>

  <script>
    async function loadUserData() {
      const kakaoId = localStorage.getItem("kakaoId");
      const nickname = localStorage.getItem("nickname");

      // 로그인 정보 없을 시 강제 리디렉션
      if (!kakaoId || !nickname) {
        alert("로그인이 필요합니다. 메인 페이지로 이동합니다.");
        window.location.href = "index9.html";
        return;
      }

      document.getElementById("nickname").innerText = nickname;

      try {
        const response = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ kakaoId }),
        });

        const data = await response.json();
        const user = data.user;

        if (!user) {
          alert("유저 정보를 찾을 수 없습니다.");
          return;
        }

        document.getElementById("water").innerText = user.water ?? 0;
        document.getElementById("fertilizer").innerText = user.fertilizer ?? 0;
        document.getElementById("orcx").innerText = user.orcx ?? 0;
        document.getElementById("potato").innerText = user.potato ?? 0;
        document.getElementById("bori").innerText = user.bori ?? 0;
        document.getElementById("seedPotato").innerText = user.seedPotato ?? 0;
        document.getElementById("seedBarley").innerText = user.seedBarley ?? 0;

      } catch (error) {
        console.error("유저 데이터를 불러오는 중 오류 발생:", error);
        alert("서버 오류가 발생했습니다. 다시 시도해주세요.");
      }
    }

    window.onload = loadUserData;
  </script>
</body>
</html>
