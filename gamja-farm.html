<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자밭 입구</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
    }
    .enter-box {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }
    .enter-btn {
      background-color: #ffb300;
      color: #000;
      border: none;
      font-size: 1.4rem;
      padding: 16px 32px;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
    }
    .enter-btn:hover {
      background-color: #ffa000;
    }
    .nickname-display {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #ffecb3;
      color: #000;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="nickname-display" id="status">닉네임 불러오는 중...</div>
  <div class="enter-box">
    <button class="enter-btn" onclick="enterFarm()">감자밭 입장</button>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    const farmName = localStorage.getItem("farmName");
    const statusEl = document.getElementById("status");

    if (!nickname || !farmName) {
      statusEl.textContent = "❗ 로그인 정보 없음";
    } else {
      fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata/${nickname}`, {
        cache: "no-store"
      })
      .then(res => res.ok ? res.json() : Promise.reject("서버 응답 실패"))
      .then(data => {
        if (data && data.nickname) {
          statusEl.textContent = `👤 ${data.nickname}`;
        } else {
          statusEl.textContent = `👤 ${nickname} (로컬)`;
        }
      })
      .catch(err => {
        statusEl.textContent = `👤 ${nickname} (로컬)`;
      });
    }

    function enterFarm() {
      if (!nickname || !farmName) {
        alert("로그인 정보가 없습니다. 메인화면으로 이동합니다.");
        window.location.href = "orcax-farm_000.html";
        return;
      }
      window.location.href = "gamja-main.html";
    }
  </script>
</body>
</html>
