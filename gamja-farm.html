<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>감자 농장 입장</title>
  <style>
    body { margin:0; padding:0; font-family:'Pretendard',sans-serif;
      background:url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size:cover; color:white; text-align:center;
    }
    .container{ background:rgba(0,0,0,0.5); margin:5% auto; padding:20px; width:90%; max-width:400px; border-radius:12px; }
    .btn{ margin-top:20px; padding:15px 30px; background:#FFD700; color:#000; font-size:1.2rem; font-weight:bold; border:none; border-radius:10px; cursor:pointer; }
    .status{ margin-top:20px; font-weight:bold; }
    .info-box{ background:#2166d1; padding:8px; margin:6px 0; border-radius:6px; text-align:left; }
  </style>
  <script>
    'use strict';
    const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io';
    const INITIAL_TOKEN = 10;
  </script>
</head>
<body>
  <div class="container" role="region" aria-label="감자 농장 대시보드">
    <h1>🥔 감자 농장에 오신 걸 환영합니다!</h1>
    <div class="info-box">👤 닉네임: <span id="nickname">-</span></div>
    <div class="info-box">🥔 감자: <span id="potato">0</span> 개</div>
    <div class="info-box">💧 물: <span id="water">0</span> 개</div>
    <div class="info-box">🌱 거름: <span id="fertilizer">0</span> 개</div>
    <div class="info-box">🪙 ORCX: <span id="token">0</span> 개</div>
    <div class="info-box">🥔 씨감자: <span id="seedPotato">0</span> 개</div>
    <div class="info-box">🌾 씨보리: <span id="seedBarley">0</span> 개</div>
    <div class="info-box">🧺 인벤토리:</div>
    <div id="inventoryBox" class="info-box"></div>
    <div id="serverStatus" class="status" aria-live="polite">⏳ 서버 상태 확인 중.</div>
    <button id="startBtn" class="btn" disabled>🌱 농장이름 짓기 이동</button>
  </div>

  <script type="module">
    (async () => {
      // 1) localStorage 체크
      const kakaoId  = localStorage.getItem('kakaoId');
      const nickname = localStorage.getItem('nickname');
      if (!kakaoId || !nickname) {
        alert('로그인이 필요합니다.');
        return location.href = 'gamja-login.html';
      }
      document.getElementById('nickname').textContent = nickname;

      // 2) UI 요소 바인딩
      const startBtn     = document.getElementById('startBtn');
      const statusEl     = document.getElementById('serverStatus');
      const invBox       = document.getElementById('inventoryBox');
      const els = {
        potato:     document.getElementById('potato'),
        water:      document.getElementById('water'),
        fertilizer: document.getElementById('fertilizer'),
        token:      document.getElementById('token'),
        seedPotato: document.getElementById('seedPotato'),
        seedBarley: document.getElementById('seedBarley'),
      };

      startBtn.addEventListener('click', () => location.href = 'gamja-main.html');

      // 3) 데이터 로드
      async function loadData() {
        statusEl.textContent = '⏳ 데이터 로딩 중...';
        try {
          const url = `${API_BASE}/api/userdata?kakaoId=${encodeURIComponent(kakaoId)}`;
          console.log('▶ fetching URL:', url);
          const res = await fetch(url, { cache:'no-store' });
          if (!res.ok) throw new Error(await res.text());

          const { success, user } = await res.json();
          if (!success || !user) throw new Error('유저 정보 없음');

          // 값 표시
          els.potato.textContent     = user.potato ?? 0;
          els.water.textContent      = user.water ?? 0;
          els.fertilizer.textContent = user.fertilizer ?? 0;
          els.seedPotato.textContent = user.seedPotato ?? 0;
          els.seedBarley.textContent = user.seedBarley ?? 0;

          let tk = user.orcx ?? 0;
          if (tk === 0) tk = INITIAL_TOKEN;
          els.token.textContent = tk;

          invBox.textContent = '';
          (user.inventory || []).forEach(item => {
            const d = document.createElement('div');
            d.textContent = `- ${item.name || item.type} (${item.count||1}개)`;
            invBox.appendChild(d);
          });

          statusEl.textContent = '✅ 서버 연결 및 데이터 로드 완료';
          startBtn.disabled = false;
        } catch (err) {
          console.error(err);
          statusEl.textContent = '❌ 데이터 로드 실패';
        }
      }

      await loadData();
    })();
  </script>
</body>
</html>
