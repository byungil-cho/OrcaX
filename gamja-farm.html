<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>감자 농장 대시보드</title>
  <style>
    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }
    .dashboard {
      background: rgba(0, 0, 0, 0.6);
      margin: 4rem auto;
      padding: 2rem;
      border-radius: 20px;
      max-width: 500px;
    }
    h1 {
      font-size: 2rem;
    }
    .section-title {
      margin-top: 1.5rem;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .info-line {
      margin: 0.2rem 0;
    }
    .nav-buttons {
      margin-top: 2rem;
    }
    .nav-buttons button {
      margin: 0.4rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #00e0ff;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1>감자 농장 대시보드</h1>
    <p>👩‍🌾 농장주: <span id="nickname">-</span></p>
    <p>💗 농장이름: <span id="farmName">-</span></p>

    <div class="section-title">🌰 농자재 보관함</div>
    <p class="info-line">물: <span id="water">-</span></p>
    <p class="info-line">거름: <span id="fertilizer">-</span></p>
    <p class="info-line">ORCX: <span id="orcx">-</span></p>

    <div class="section-title">🥚 작물 보관소</div>
    <p class="info-line">감자: <span id="potato">-</span></p>
    <p class="info-line">보리: <span id="barley">-</span></p>

    <div class="section-title">🌱 씨앗 보유</div>
    <p class="info-line">씨감자: <span id="seedPotato">-</span></p>
    <p class="info-line">씨보리: <span id="seedBarley">-</span></p>

    <div class="nav-buttons">
      <button onclick="location.href='gamja-main.html'">농장이름 만들기</button>
      <button onclick="location.href='gamja-shop.html'">상점</button>
      <button onclick="location.href='index9.html'">메인으로</button>
    </div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";

    async function loadUserData() {
      try {
        const res = await fetch(`${API_BASE}/userdata`);
        if (!res.ok) throw new Error("유저 데이터를 불러오지 못했습니다.");
        const data = await res.json();

        document.getElementById('nickname').innerText = data.nickname || '-';
        document.getElementById('farmName').innerText = localStorage.getItem("farmName") || '-';

        document.getElementById('water').innerText = data.inventory?.water ?? '-';
        document.getElementById('fertilizer').innerText = data.inventory?.fertilizer ?? '-';
        document.getElementById('orcx').innerText = data.token ?? '-';

        document.getElementById('potato').innerText = data.produce?.potato ?? '-';
        document.getElementById('barley').innerText = data.produce?.barley ?? '-';

        document.getElementById('seedPotato').innerText = data.inventory?.seedPotato ?? '-';
        document.getElementById('seedBarley').innerText = data.inventory?.seedBarley ?? '-';

      } catch (err) {
        console.error("데이터 불러오기 실패:", err);
      }
    }

    loadUserData();
  </script>
</body>
</html>
