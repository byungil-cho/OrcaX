<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자밭 입구</title>
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url('./farm-101.png') no-repeat center center/cover;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.25);
    }
    .label {
      position: absolute;
      top: 5%;
      left: 5%;
      padding: 0.75rem 1.5rem;
      background-color: #ffaa00cc;
      color: #000;
      font-weight: bold;
      font-size: 1.3rem;
      border-radius: 8px;
    }
    .nickname {
      position: absolute;
      top: 5%;
      right: 5%;
      padding: 0.75rem 1.5rem;
      background-color: #fff2a0cc;
      color: #000;
      font-weight: bold;
      font-size: 1.3rem;
      border-radius: 8px;
    }
    .entry-button {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      padding: 1rem 2rem;
      background-color: #ffaa00;
      border: none;
      border-radius: 8px;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
    }
    .entry-button:hover {
      background-color: #ff8800;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="overlay"></div>
    <div class="label">🥔 감자밭 입구</div>
    <div class="nickname" id="nicknameBox" style="display: none;"></div>
    <button class="entry-button" onclick="loginWithKakao()">카카오 로그인하고 감자밭 입장</button>
  </div>

  <script>
    Kakao.init('여기에_자바스크립트_키_입력'); // TODO: 본인 JavaScript 키로 교체

    const nicknameBox = document.getElementById("nicknameBox");

    function loginWithKakao() {
      Kakao.Auth.login({
        success: function(authObj) {
          Kakao.API.request({
            url: '/v2/user/me',
            success: function(res) {
              const nickname = res.kakao_account.profile.nickname;
              localStorage.setItem("nickname", nickname);
              nicknameBox.textContent = `👤 ${nickname}님 환영합니다!`;
              nicknameBox.style.display = "block";

              // 감자 메인으로 이동
              window.location.href = `gamja-main.html?nickname=${encodeURIComponent(nickname)}`;
            },
            fail: function(error) {
              alert("카카오 사용자 정보 요청 실패: " + JSON.stringify(error));
            }
          });
        },
        fail: function(err) {
          alert("카카오 로그인 실패: " + JSON.stringify(err));
        }
      });
    }

    // 로그인 상태 유지 시에도 닉네임 표시
    const nickname = localStorage.getItem("nickname");
    if (nickname) {
      nicknameBox.textContent = `👤 ${nickname}님 환영합니다!`;
      nicknameBox.style.display = "block";
    }
  </script>
</body>
</html>
