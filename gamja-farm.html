<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장</title>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const powerStatus = document.getElementById("power-status");
      const nicknameField = document.getElementById("nickname");
      const statusField = document.getElementById("status");

      const serverUrl = "https://climbing-wholly-grouper.jp.ngrok.io";

      // ✅ 서버 연결 상태 확인
      fetch(serverUrl)
        .then(res => res.text())
        .then(() => {
          powerStatus.textContent = "✅ 전원 연결됨";
          powerStatus.style.background = '#d6f5d6';
          powerStatus.style.color = '#080';
        })
        .catch(() => {
          powerStatus.textContent = "⚡ 전원 차단";
          powerStatus.style.background = '#fdd';
          powerStatus.style.color = '#c00';
        });

      const nickname = localStorage.getItem("nickname");
      if (!nickname) {
        alert("로그인 정보가 없습니다. 감자 농장 입구로 이동합니다.");
        window.location.href = "감자농장입구.html";
        return;
      }

      // ✅ 사용자 정보 불러오기
      fetch(`${serverUrl}/api/userdata/${encodeURIComponent(nickname)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success && data.user) {
            const u = data.user;
            nicknameField.textContent = `👩‍🌾 ${u.nickname} 농장주님 반갑습니다!`;

            statusField.innerHTML = `
              💧 물: ${u.water ?? 0} |
              💩 거름: ${u.fertilizer ?? 0} |
              🪙 토큰: ${u.orcx ?? 0} |
              🥔 씨감자: ${u.seedPotato ?? 0} |
              🌾 씨보리: ${u.seedBarley ?? 0}
            `;
          } else {
            nicknameField.textContent = "❌ 사용자 정보 불러오기 실패";
            statusField.textContent = "";
          }
        })
        .catch(err => {
          nicknameField.textContent = "❌ 사용자 정보 불러오기 실패";
          statusField.textContent = "";
        });
    });
  </script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: #333;
      padding: 20px;
    }
    #power-status, #nickname, #status {
      position: absolute;
      z-index: 100;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
    }
    #power-status { top: 10px; left: 10px; }
    #nickname { top: 10px; right: 10px; background: #dfd; color: #080; }
    #status { top: 50px; right: 10px; background: #fffbe6; color: #333; }
  </style>
</head>
<body>
  <div id="power-status">전원 확인 중...</div>
  <div id="nickname">닉네임 불러오는 중...</div>
  <div id="status">자원 정보 불러오는 중...</div>

  <a href="gamja-main.html" style="
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 28px;
    font-size: 18px;
    background-color: #ffcc00;
    color: #000;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    z-index: 100;
  ">감자밭 입장</a>
</body>
</html>
