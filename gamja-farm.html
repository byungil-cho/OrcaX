
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 감자농장 입장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: url("https://byungil-cho.github.io/OrcaX/farm-101.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    header {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 1rem;
    }
    main {
      padding: 2rem;
    }
    .resource-box {
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem auto;
      width: 80%;
      max-width: 400px;
    }
    .status {
      margin: 1rem 0;
    }
    .nav-links a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.7rem 1.2rem;
      background-color: #00c3ff;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>OrcaX 감자농장 입장</h1>
    <div class="status" id="powerStatus">🔌 서버 전원 상태 확인 중...</div>
    <div>👤 <span id="nickname">닉네임</span>님 환영합니다!</div>
  </header>
  <main>
    <div class="resource-box">
      <h3>보유 자산</h3>
      <p>💧 물: <span id="water">-</span> 개</p>
      <p>💩 거름: <span id="fertilizer">-</span> 개</p>
      <p>🥔 씨감자: <span id="seedPotato">-</span> 개</p>
      <p>🌾 씨보리: <span id="seedBarley">-</span> 개</p>
      <p>💰 ORCX: <span id="orcx">-</span> 개</p>
    </div>

    <div class="nav-links">
      <a href="gamja-main.html">농장으로 입장</a>
      <a href="index9.html">메인으로</a>
    </div>
  </main>

  <script>
    async function fetchUserInfo() {
      const kakaoId = localStorage.getItem("kakaoId");
      const nickname = localStorage.getItem("nickname");
      document.getElementById("nickname").textContent = nickname || "사용자";

      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userinfo?kakaoId=" + kakaoId);
        const data = await res.json();

        if (data.success) {
          const user = data.user;
          document.getElementById("water").textContent = user.water || 0;
          document.getElementById("fertilizer").textContent = user.fertilizer || 0;
          document.getElementById("seedPotato").textContent = user.seedPotato || 0;
          document.getElementById("seedBarley").textContent = user.seedBarley || 0;
          document.getElementById("orcx").textContent = user.orcx || 0;
        }
      } catch (err) {
        console.error("유저 정보 불러오기 실패:", err);
      }
    }

    async function checkPower() {
      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/power");
        const data = await res.json();
        const status = document.getElementById("powerStatus");
        if (data.power === true) {
          status.textContent = "✅ 전기공급 ON";
        } else {
          status.textContent = "❌ 전기공급 OFF";
        }
      } catch (err) {
        document.getElementById("powerStatus").textContent = "⚠️ 전원 상태 확인 실패";
      }
    }

    fetchUserInfo();
    checkPower();
  </script>
</body>
</html>
