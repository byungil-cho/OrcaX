<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>감자 농장 입장</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      margin: 0;
      padding: 0;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }
    .container {
      background: rgba(0, 0, 0, 0.5);
      margin: 50px auto;
      padding: 20px;
      max-width: 400px;
      border-radius: 20px;
    }
    .info-box {
      background: #1976d2;
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🥔 감자 농장에 오신 걸 환영합니다!</h2>
    <div class="info-box">👤 닉네임: <span id="nickname">로딩중...</span></div>
    <div class="info-box">🥔 감자: <span id="potato">0</span> 개</div>
    <div class="info-box">💧 물: <span id="water">0</span> 개</div>
    <div class="info-box">🌱 거름: <span id="fertilizer">0</span> 개</div>
    <div class="info-box">🪙 ORCX: <span id="orcx">0</span></div>
    <div class="info-box">🥔 씨감자: <span id="seedPotato">0</span> 개</div>
    <div class="info-box">🌾 씨보리: <span id="seedBarley">0</span> 개</div>
    <div class="info-box">
      🧺 인벤토리:
      <div id="inventoryBox"></div>
    </div>
  </div>

  <script>
    fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata")
      .then(res => res.json())
      .then(data => {
        const user = data.user;
        document.getElementById("nickname").textContent = user.nickname;
        document.getElementById("potato").textContent = user.potato;
        document.getElementById("water").textContent = user.water;
        document.getElementById("fertilizer").textContent = user.fertilizer;
        document.getElementById("orcx").textContent = user.orcx;
        document.getElementById("seedPotato").textContent = user.seedPotato || 0;
        document.getElementById("seedBarley").textContent = user.seedBarley || 0;

        const inventoryBox = document.getElementById("inventoryBox");
        user.inventory.forEach(item => {
          const label = item.name || item.type || '이름없음';
          const div = document.createElement("div");
          div.textContent = `- ${label} (${item.count}개)`;
          inventoryBox.appendChild(div);
        });
      })
      .catch(err => {
        console.error("불러오기 오류:", err);
      });
  </script>

<button onclick="goToNextPage()">다음 단계로 이동</button>
<script>
  function goToNextPage() {
    window.location.href = 'gamja-main.html';
  }
</script>
</body>
</html>
