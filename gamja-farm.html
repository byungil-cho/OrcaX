<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>감자 농장 입구</title>
  <style>
    body {
      background-image: url('https://byungil-cho.github.io/OrcaX/farm-bg.jpg');
      background-size: cover;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding-top: 80px;
    }
    #enterButton {
      background-color: gold;
      border: none;
      border-radius: 8px;
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🥔 감자 농장에 오신 걸 환영합니다!</h1>
  <p>🔷 닉네임: <span id="nickname">닉네임 불러오는 중...</span></p>
  <p>🥔 감자: - 개 | 💧 물: - 개 | 🪱 거름: - 개 | 🪙 ORCX: - 개</p>
  <p>🌱 씨감자: <span id="seedPotatoCount">-</span> 개 | 🌾 씨보리: <span id="seedBarleyCount">-</span> 개</p>
  <p id="serverStatus">🔌 서버 상태 확인 중...</p>
  <br>
  <button id="enterButton" onclick="goToFarm()">🌾 농장이름 짓기 이동</button>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

    // 서버 상태 확인
    fetch(`${API_BASE}/`)
      .then(res => {
        if (res.ok) {
          document.getElementById("serverStatus").textContent = "✅ 서버 전원 ON: 감자밭 연결 완료";
          document.getElementById("serverStatus").style.color = "lime";
        } else {
          throw new Error();
        }
      })
      .catch(() => {
        document.getElementById("serverStatus").textContent = "❌ 서버 연결 실패!";
        document.getElementById("serverStatus").style.color = "red";
      });

    // 유저 데이터 불러오기
    fetch(`${API_BASE}/api/userdata`, { credentials: 'include' })
      .then(response => response.json())
      .then(user => {
        document.getElementById("nickname").textContent = user.nickname || "닉네임 없음";

        // 인벤토리 개수 정리
        const invMap = {};
        (user.inventory || []).forEach(item => {
          const name = item.name || item.type;
          if (name === "씨감자" || name === "씨보리") {
            invMap[name] = item.count;
          }
        });
        document.getElementById("seedPotatoCount").textContent = invMap["씨감자"] || 0;
        document.getElementById("seedBarleyCount").textContent = invMap["씨보리"] || 0;
      })
      .catch(err => {
        console.error("유저 정보 불러오기 실패", err);
        document.getElementById("nickname").textContent = "로그인 필요";
      });

    function goToFarm() {
      window.location.href = "gamja-main.html";
    }
  </script>
</body>
</html>
