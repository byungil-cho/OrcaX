
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 농장 입장</title>
  <style>
    body {
      background-image: url('https://byungil-cho.github.io/OrcaX/gamja-bg.jpg');
      background-size: cover;
      background-position: center;
      font-family: 'Arial', sans-serif;
      color: white;
      text-align: center;
      padding-top: 80px;
    }
    .resource {
      font-size: 20px;
      margin: 10px 0;
    }
    .button {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 18px;
      background-color: #FFD700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #serverStatus {
      margin-top: 20px;
      color: lightgreen;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🥔 감자 농장에 오신 걸 환영합니다!</h1>
  <div class="resource" id="nickname">닉네임: -</div>
  <div class="resource" id="gamja">감자: - 개</div>
  <div class="resource" id="water">💧 물: - 개</div>
  <div class="resource" id="fertilizer">🌱 거름: - 개</div>
  <div class="resource" id="orcx">🪙 ORCX: - 개</div>
  <div class="resource" id="seedPotato">🥔 씨감자: - 개</div>
  <div class="resource" id="seedBarley">🌾 씨보리: - 개</div>

  <div id="serverStatus">✅ 서버 전원 ON: 감자밭 연결 완료</div>

  <button class="button" onclick="location.href='gamja-main.html'">🌱 농장이름 짓기 이동</button>

  <script>
    async function fetchUserData() {
      try {
        const response = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata");
        const data = await response.json();
        document.getElementById("nickname").textContent = "닉네임: " + (data.nickname || "-");
        document.getElementById("gamja").textContent = "감자: " + (data.gamjaCount || 0) + " 개";
        document.getElementById("water").textContent = "💧 물: " + (data.water || 0) + " 개";
        document.getElementById("fertilizer").textContent = "🌱 거름: " + (data.fertilizer || 0) + " 개";
        document.getElementById("orcx").textContent = "🪙 ORCX: " + (data.token || 0) + " 개";
        document.getElementById("seedPotato").textContent = "🥔 씨감자: " + (data.seedPotato || 0) + " 개";
        document.getElementById("seedBarley").textContent = "🌾 씨보리: " + (data.seedBarley || 0) + " 개";
      } catch (err) {
        console.error("유저 데이터를 불러오는 중 오류 발생:", err);
        document.getElementById("serverStatus").textContent = "❌ 서버 전원 OFF: 연결 실패";
        document.getElementById("serverStatus").style.color = "red";
      }
    }

    fetchUserData();
  </script>
</body>
</html>
