<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장 대시보드</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 5%;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      display: inline-block;
      border-radius: 12px;
    }
    .section {
      background-color: #ffffff20;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
    }
    .footer {
      margin-top: 20px;
    }
    .footer a {
      color: #FFD700;
      font-weight: bold;
      margin: 0 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>감자 농장 대시보드</h1>
    <div id="userInfo">농장주: <span id="nickname">-</span><br>농장이름: <span id="farmName">-</span></div>

    <div class="section">
      <h2>📦 농자재 보관함</h2>
      물: <span id="water">-</span><br>
      거름: <span id="fertilizer">-</span><br>
      ORCX: <span id="orcx">-</span>
    </div>

    <div class="section">
      <h2>🌾 작물 보관소</h2>
      감자: <span id="potato">-</span><br>
      보리: <span id="barley">-</span>
    </div>

    <div class="section">
      <h2>🌱 씨앗 보유 (로컬 임대 중)</h2>
      씨감자: <span id="seedPotato">-</span><br>
      씨보리: <span id="seedBarley">-</span>
    </div>

    <div class="section">
      <h2>📊 농장 활동</h2>
      농사 횟수: <span id="farmingCount">-</span><br>
      레벨: <span id="farmingLevel">-</span>
    </div>

    <div class="footer">
      <a href="gamja-main.html">📛 농장 작명소</a>
      <a href="gamja-shop.html">🛒 씨앗 상점</a>
    </div>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname") || "-";
    const farmName = localStorage.getItem("farmName") || "-";
    const kakaoId = localStorage.getItem("kakaoId") || "unknown";
    const localSeedInventory = JSON.parse(localStorage.getItem("seedInventory") || "{}");

    document.getElementById("nickname").textContent = nickname;
    document.getElementById("farmName").textContent = farmName;

    function getLevelFromFarmingCount(count) {
      if (count >= 50) return "레전드 농부";
      if (count >= 30) return "숙련 농부";
      if (count >= 10) return "초보 농부";
      return "씨앗 뿌리는 중";
    }

    async function fetchDashboardData() {
      try {
        const res = await fetch(`/users/me?kakaoId=${kakaoId}`);
        const data = await res.json();

        document.getElementById("water").textContent = data.water ?? "-";
        document.getElementById("fertilizer").textContent = data.fertilizer ?? "-";
        document.getElementById("orcx").textContent = data.token ?? "-";
        document.getElementById("potato").textContent = data.potato ?? "-";
        document.getElementById("barley").textContent = data.barley ?? "-";

        document.getElementById("seedPotato").textContent = localSeedInventory.seedPotato || 0;
        document.getElementById("seedBarley").textContent = localSeedInventory.seedBarley || 0;

        const farmingCount = data.farmingCount ?? 0;
        document.getElementById("farmingCount").textContent = farmingCount;
        document.getElementById("farmingLevel").textContent = getLevelFromFarmingCount(farmingCount);

      } catch (err) {
        console.error("서버 데이터 로딩 실패", err);
      }
    }

    fetchDashboardData();
  </script>
</body>
</html>
