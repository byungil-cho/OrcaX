<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>감자 농장 입장</title>
<link href="style.css" rel="stylesheet"/>
<style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
      background-image: url('https://byungil-cho.github.io/OrcaX/farm-101.png');
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 80px;
      font-size: 28px;
      font-weight: bold;
    }

    .status {
      margin-top: 20px;
      font-size: 20px;
    }

    .status span {
      margin: 0 10px;
    }

    .nickname {
      margin-top: 30px;
      font-size: 18px;
    }

    .server {
      margin-top: 20px;
      font-weight: bold;
      color: #00ff66;
    }

    .btn-next {
      margin-top: 40px;
    }

    .btn-next button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #ffcc00;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-next button:hover {
      background-color: #ffaa00;
    }
  </style>
</head>
<body>
<h1>🥔 감자 농장에 오신 걸 환영합니다!</h1>
<div class="nickname">
    🧑‍🌾 닉네임: <span id="nickname">불러오는 중...</span>
</div>
<div class="status">
    🥔 감자: <span id="potato">-</span>개 |
    💧 물: <span id="water">-</span>개 |
    🧪 거름: <span id="fertilizer">-</span>개 |
    🪙 ORCX: <span id="token">-</span>개
  </div>
<div class="server" id="serverStatus">서버 상태 확인 중...</div>
<div class="btn-next">
<button onclick="location.href='gamja-main.html'">🌱 농장이름 짓기 이동</button>
</div>
<script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

    async function loadUserData() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata`);
        const data = await res.json();
        if (data.success && data.users.length > 0) {
          const user = data.users[0];
          document.getElementById("nickname").textContent = user.nickname;
          document.getElementById("potato").textContent = user.potatoCount || 0;
          document.getElementById("water").textContent = user.water || 0;
          document.getElementById("fertilizer").textContent = user.fertilizer || 0;
          document.getElementById("token").textContent = user.token || 0;
        } else {
          document.getElementById("nickname").textContent = "(불러오기 실패)";
        }
      } catch (err) {
        document.getElementById("nickname").textContent = "(에러 발생)";
      }
    }

    function checkServerStatus() {
      fetch(`${API_BASE}/`)
        .then(res => {
          if (res.ok) {
            document.getElementById("serverStatus").textContent = "✅ 서버 전원 ON: 감자밭 연결 완료";
          } else {
            document.getElementById("serverStatus").textContent = "❌ 서버 연결 실패";
          }
        })
        .catch(() => {
          document.getElementById("serverStatus").textContent = "❌ 서버 연결 실패";
        });
    }

    loadUserData();
    checkServerStatus();
  </script>
<div id="inventoryBox">
<h2>🌱 농자재 보관소</h2>
<p>씨감자: <span id="seedPotatoCount">0</span>개</p>
<p>씨보리: <span id="seedBarleyCount">0</span>개</p>
<p>물: <span id="waterCount">0</span>개</p>
<p>거름: <span id="fertilizerCount">0</span>개</p>
</div><script>
const nickname = localStorage.getItem("nickname");
fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata")
  .then(res => res.json())
  .then(data => {
    const user = data.users.find(u => u.nickname === nickname);
    if (user && user.inventory) {
      const getItem = (name) => user.inventory.find(i => i.name === name)?.count || 0;
      document.getElementById("seedPotatoCount").textContent = getItem("씨감자");
      document.getElementById("seedBarleyCount").textContent = getItem("씨보리");
      document.getElementById("waterCount").textContent = getItem("물");
      document.getElementById("fertilizerCount").textContent = getItem("거름");
    }
  })
  .catch(err => console.error("자재 불러오기 실패:", err));
</script>
<script>
  const nickname = localStorage.getItem("nickname");
  if (nickname) {
    fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/user/${nickname}`)
      .then(res => res.json())
      .then(data => {
        const inventory = data.user?.inventory || [];
        const getItem = (name) => inventory.find(i => i.name === name)?.count || 0;
        document.getElementById("seedPotatoCount").textContent = getItem("씨감자");
        document.getElementById("seedBarleyCount").textContent = getItem("씨보리");
        document.getElementById("waterCount").textContent = getItem("물");
        document.getElementById("fertilizerCount").textContent = getItem("거름");
      })
      .catch(err => console.error("자재 불러오기 실패:", err));
  }
</script>

</body>
</html>
