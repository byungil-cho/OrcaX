<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>감자 농장 입장</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
      background-image: url('https://byungil-cho.github.io/OrcaX/farm-101.png');
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
    }
    h1 { margin-top: 80px; font-size: 28px; font-weight: bold; }
    .status { margin-top: 20px; font-size: 20px; }
    .status span { margin: 0 10px; }
    .nickname { margin-top: 30px; font-size: 18px; }
    .server { margin-top: 20px; font-weight: bold; color: #00ff66; }
    .btn-next { margin-top: 40px; }
    .btn-next button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #ffcc00;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-next button:hover { background-color: #ffaa00; }
    .inventory {
      margin-top: 30px;
      font-size: 18px;
    }
    .inventory span {
      display: inline-block;
      margin: 0 8px;
    }
  </style>
</head>
<body>
  <h1>🥔 감자 농장에 오신 걸 환영합니다!</h1>

  <div class="nickname">
    🧑‍🌾 닉네임: <span id="nickname">불러오는 중...</span>
  </div>

  <div class="status">
    🥔 감자: <span id="potatoCount">-</span>개 |
    💧 물: <span id="waterCount">-</span>개 |
    🧪 거름: <span id="fertilizerCount">-</span>개 |
    🪙 ORCX: <span id="tokenCount">-</span>개
  </div>

  <div class="inventory">
    🧺 씨감자: <span id="seedPotatoCount">-</span>개 |
    🌾 씨보리: <span id="seedBarleyCount">-</span>개
  </div>

  <div class="server" id="serverStatus">서버 상태 확인 중...</div>

  <div class="btn-next">
    <button onclick="location.href='gamja-main.html'">🌱 농장이름 짓기 이동</button>
  </div>

<script>
  const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

  // 서버 상태 체크
  function checkServerStatus() {
    fetch(`${API_BASE}/`)
      .then(res => {
        const el = document.getElementById("serverStatus");
        if (res.ok) {
          el.textContent = "✅ 서버 전원 ON: 감자밭 연결 완료";
          el.style.color = "lightgreen";
        } else throw new Error();
      })
      .catch(() => {
        const el = document.getElementById("serverStatus");
        el.textContent = "❌ 서버 전원 OFF: 감자밭 연결 실패";
        el.style.color = "red";
      });
  }

  // 사용자 데이터 로드
  async function loadUserData() {
    const nickname = localStorage.getItem("nickname");
    if (!nickname || nickname === "사용자") {
      alert("로그인 정보가 없습니다. 다시 로그인 해주세요.");
      location.href = "kakao-login.html";
      return;
    }
    document.getElementById("nickname").textContent = nickname;

    try {
      const res = await fetch(`${API_BASE}/api/userdata`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
      });
      const data = await res.json();
      if (!data.success || !data.users || !data.users.length) {
        console.error("유저 정보 없음:", data);
        return;
      }
      const user = data.users[0];
      document.getElementById("potatoCount").textContent = user.potatoCount || 0;
      document.getElementById("waterCount").textContent = user.water || 0;
      document.getElementById("fertilizerCount").textContent = user.fertilizer || 0;
      document.getElementById("tokenCount").textContent = user.orcx || 0;

      const invMap = {};
      (user.inventory || []).forEach(item => {
        const name = item.name || item.type;
        invMap[name] = item.count;
      });
      document.getElementById("seedPotatoCount").textContent = invMap["씨감자"] || 0;
      document.getElementById("seedBarleyCount").textContent = invMap["씨보리"] || 0;
    } catch (e) {
      console.error("데이터 로딩 실패:", e);
    }
  }

  loadUserData();
  checkServerStatus();
</script>
</body>
</html>
