<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 농장 입장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: url("https://byungil-cho.github.io/OrcaX/farm-101.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    header {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 1rem;
    }
    main {
      padding: 2rem;
    }
    h1 {
      margin-bottom: 1rem;
    }
    .resource-box {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem;
      display: inline-block;
      text-align: left;
    }
    .resource-box span {
      font-weight: bold;
      color: #00e0ff;
    }
    .status-bar {
      position: fixed;
      top: 0;
      left: 0;
      background: black;
      color: white;
      padding: 5px 10px;
      font-size: 0.9rem;
      z-index: 1000;
    }
    .nav-links {
      margin-top: 2rem;
    }
    .nav-links a {
      display: inline-block;
      margin: 0 10px;
      padding: 10px 15px;
      background: rgba(255,255,255,0.8);
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="status-bar" id="status">🔄 서버 연결 중...</div>
  <header>
    <h1>🐳 감자 농장에 오신 것을 환영합니다!</h1>
    <p>닉네임: <span id="nickname">-</span></p>
  </header>
  <main>
    <div class="resource-box">
      <p>보유 ORCX: <span id="orcx">0</span></p>
      <p>물: <span id="water">0</span></p>
      <p>거름: <span id="fertilizer">0</span></p>
      <p>감자: <span id="potato">0</span></p>
      <p>보리: <span id="bori">0</span></p>
      <p>씨감자: <span id="seedPotato">0</span></p>
      <p>씨보리: <span id="seedBarley">0</span></p>
    </div>

    <div class="nav-links">
      <a href="index9.html">⬅ 메인으로</a>
      <a href="gamja-main.html">🌱 농장이름짓기</a>
    </div>
  </main>

  <script>
    async function loadUserData() {
      const kakaoId = localStorage.getItem("kakaoId");
      if (!kakaoId) {
        alert("로그인이 필요합니다.");
        window.location.href = "index9.html";
        return;
      }

      try {
        const response = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ kakaoId }),
        });

        const data = await response.json();
        console.log("서버 응답:", data);

        if (!data.user) throw new Error("유저 정보 없음");

        const user = data.user;

        document.getElementById("nickname").innerText = user.nickname ?? "-";
        document.getElementById("orcx").innerText = user.wallet?.orcx ?? 0;
        document.getElementById("water").innerText = user.inventory?.water ?? 0;
        document.getElementById("fertilizer").innerText = user.inventory?.fertilizer ?? 0;
        document.getElementById("potato").innerText = user.storage?.gamja ?? 0;
        document.getElementById("bori").innerText = user.storage?.bori ?? 0;
        document.getElementById("seedPotato").innerText = user.inventory?.seedPotato ?? 0;
        document.getElementById("seedBarley").innerText = user.inventory?.seedBarley ?? 0;

        document.getElementById("status").innerText = "✅ 서버 연결됨";
      } catch (error) {
        console.error("유저 데이터를 불러오는 중 오류 발생:", error);
        document.getElementById("status").innerText = "❌ 서버 오류 발생";
        alert("서버 오류가 발생했습니다. 다시 시도해주세요.");
      }
    }

    window.onload = loadUserData;
  </script>
</body>
</html>
