<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 감자농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: url("https://byungil-cho.github.io/OrcaX/farm-101.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    header {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 1rem;
    }
    main {
      padding: 2rem;
    }
    h1 {
      margin-bottom: 1rem;
    }
    .resource-box {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem auto;
      width: 90%;
      max-width: 500px;
      text-align: left;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌱 OrcaX 감자농장 대시보드</h1>
    <p id="nickname">👤 닉네임: 불러오는 중...</p>
  </header>

  <main>
    <div class="resource-box">
      <p>💧 물: <span id="water">-</span></p>
      <p>🪱 거름: <span id="fertilizer">-</span></p>
      <p>🥔 씨감자: <span id="seedPotato">-</span></p>
      <p>🌾 씨보리: <span id="seedBarley">-</span></p>
      <p>💰 토큰: <span id="tokens">-</span> ORCX</p>
    </div>
  </main>

  <script>
    const kakaoId = localStorage.getItem('kakaoId');
    const API_URL = "https://climbing-wholly-grouper.jp.ngrok.io/api/user/v2data/userdata";

    async function fetchUserData() {
      try {
        const response = await fetch(API_URL);
        const result = await response.json();

        if (result.success) {
          const user = result.users.find(u => u.kakaoId === kakaoId);
          if (!user) {
            alert('사용자 정보를 찾을 수 없습니다.');
            return;
          }

          document.getElementById('nickname').innerText = `👤 닉네임: ${user.nickname || '이름없음'}`;
          document.getElementById('water').innerText = user.inventory?.water ?? 0;
          document.getElementById('fertilizer').innerText = user.inventory?.fertilizer ?? 0;
          document.getElementById('seedPotato').innerText = user.inventory?.seedPotato ?? 0;
          document.getElementById('seedBarley').innerText = user.inventory?.seedBarley ?? 0;
          document.getElementById('tokens').innerText = user.tokens ?? 0;

        } else {
          alert("서버에서 데이터를 불러오는 데 실패했습니다.");
        }
      } catch (error) {
        console.error('불러오기 오류:', error);
        alert("네트워크 오류가 발생했습니다.");
      }
    }

    if (kakaoId) {
      fetchUserData();
    } else {
      alert("카카오 ID가 없습니다. 먼저 로그인하세요.");
    }
  </script>
</body>
</html>
