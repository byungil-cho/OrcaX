<!-- gamja-farm.html (기능 추가 및 디자인 유지) -->

<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🥔 감자 농장 - Potato Farm</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: white;
      text-align: center;
    }
    .container {
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 10vh;
    }
    .container h1 {
      margin-top: 0;
      font-size: 2rem;
    }
    .info {
      text-align: left;
      margin: 15px 0;
    }
    .info p {
      margin: 5px 0;
    }
    .btn {
      margin: 10px 5px;
      padding: 8px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-enter {
      background-color: #4CAF50;
      color: white;
    }
    .btn-logout {
      background-color: #f44336;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌾 감자 농장</h1>
    <div class="info">
      <p><strong>닉네임:</strong> <span id="nickname">로딩중...</span></p>
      <p><strong>카카오 ID:</strong> <span id="kakaoId">로딩중...</span></p>
      <p><strong>ORCX:</strong> <span id="orcx">0</span></p>
      <p>💧 물: <span id="water">0</span> / 🌱 거름: <span id="fertilizer">0</span></p>
    </div>
    <button class="btn btn-enter" onclick="goFarmMain()">농장이름 짓고 입장하기</button>
    <button class="btn btn-logout" onclick="logout()">로그아웃</button>
  </div>

  <script>
    // 로그아웃 함수
    function logout() {
      localStorage.clear();
      location.href = 'index9.html';
    }

    // 입장 함수
    function goFarmMain() {
      window.location.href = 'gamja-main.html';
    }

    // 초기화: 로그인 상태 확인 및 데이터 로딩
    (function init() {
      const kakaoId = localStorage.getItem('kakaoId');
      if (!kakaoId) {
        alert('로그인이 필요합니다.');
        location.href = 'index9.html';
        return;
      }
      document.getElementById('kakaoId').textContent = kakaoId;
      document.getElementById('nickname').textContent = localStorage.getItem('nickname') || '없음';
      document.getElementById('orcx').textContent = localStorage.getItem('orcx') || '0';
      document.getElementById('water').textContent = localStorage.getItem('water') || '0';
      document.getElementById('fertilizer').textContent = localStorage.getItem('fertilizer') || '0';
    })();
  </script>

</body>
</html>
