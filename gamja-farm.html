
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>감자 농장 입장</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
      background-image: url('https://byungil-cho.github.io/OrcaX/farm-101.png');
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
    }
    h1 { margin-top: 80px; font-size: 28px; font-weight: bold; }
    .status { margin-top: 20px; font-size: 20px; }
    .status span { margin: 0 10px; }
    .nickname { margin-top: 30px; font-size: 18px; }
    .server { margin-top: 20px; font-weight: bold; color: #00ff66; }
    .btn-next { margin-top: 40px; }
    .btn-next button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #ffcc00;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-next button:hover { background-color: #ffaa00; }
    .inventory {
      margin-top: 30px;
      font-size: 18px;
    }
    .inventory span {
      display: inline-block;
      margin: 0 8px;
    }
  </style>
</head>
<body>
  <h1>🥔 감자 농장에 오신 걸 환영합니다!</h1>

  <div class="nickname">
    🧑‍🌾 닉네임: <span id="nickname">불러오는 중...</span>
  </div>

  <div class="status">
    🥔 감자: <span id="potato">-</span>개 |
    💧 물: <span id="water">-</span>개 |
    🧪 거름: <span id="fertilizer">-</span>개 |
    🪙 ORCX: <span id="token">-</span>개
  </div>

  <div class="inventory">
    🧺 씨감자: <span id="seedPotatoCount">-</span>개 |
    🌾 씨보리: <span id="seedBarleyCount">-</span>개
  </div>

  <div class="server" id="serverStatus">서버 상태 확인 중...</div>

  <div class="btn-next">
    <button onclick="location.href='gamja-main.html'">🌱 농장이름 짓기 이동</button>
  </div>

<script>
  const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

  function checkServerStatus() {
    fetch(`${API_BASE}/`)
      .then(res => {
        if (res.ok) {
          document.getElementById("serverStatus").textContent = "✅ 서버 전원 ON: 감자밭 연결 완료";
        } else {
          throw new Error();
        }
      })
      .catch(() => {
        document.getElementById("serverStatus").textContent = "❌ 서버 전원 OFF: 감자밭 연결 실패";
        document.getElementById("serverStatus").style.color = "red";
      });
  }

  async function loadUserdata() {
    const nickname = localStorage.getItem("nickname");
    if (!nickname || nickname === "사용자") {
      alert("로그인 정보가 없습니다. 다시 로그인 해주세요.");
      location.href = "kakao-login.html";
      return;
    }

    document.getElementById("nickname").textContent = nickname;

    try {
      const res = await fetch(`${API_BASE}/api/userdata/${encodeURIComponent(nickname)}`);
      const data = await res.json();
      const user = data.users[0];

      document.getElementById("potato").textContent = user.potatoCount ?? 0;
      document.getElementById("water").textContent = user.water ?? 0;
      document.getElementById("fertilizer").textContent = user.fertilizer ?? 0;
      document.getElementById("token").textContent = user.orcx ?? 0;

      const inventory = user.inventory || [];
      const invMap = {};
      inventory.forEach(item => {
        const name = item.name || item.type;
        invMap[name] = item.count;
      });

      document.getElementById("seedPotatoCount").textContent = invMap["씨감자"] ?? 0;
      document.getElementById("seedBarleyCount").textContent = invMap["씨보리"] ?? 0;

    } catch (err) {
      console.error("자산 정보 로딩 실패:", err);
    }
  }

  loadUserdata();
  checkServerStatus();
</script>

<script>
  const nickname = localStorage.getItem("nickname") || "사용자";
  document.getElementById("nickname").innerText = "닉네임: " + nickname;
</script>
</body>

</html>
