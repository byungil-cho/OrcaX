<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>감자 농장 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: #fff;
    }
    main {
      padding: 1rem;
      min-height: 100vh;
    }
    header {
      background-color: rgba(0,0,0,0.3);
      padding: 1rem;
      border-radius: 1rem;
      margin: 1rem auto;
      width: 90%;
      max-width: 500px;
    }
    footer a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background: #00e0ff;
      color: #000;
      border-radius: 1rem;
      text-decoration: none;
    }
    #serverStatus {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>감자 농장 대시보드</h1>
      <p>📡 서버 연결 상태: <span id="serverStatus">⏳ 확인 중...</span></p>
      <p>👨‍🌾 농장주: <span id="nickname">-</span></p>
      <p>💖 농장이름: <span id="farmName">-</span></p>

      <h3>🌰 농자재 보관함</h3>
      <p>물: <span id="water">-</span></p>
      <p>거름: <span id="fertilizer">-</span></p>
      <p>ORCX: <span id="orcx">-</span></p>

      <h3>🥚 작물 보관소</h3>
      <p>감자: <span id="gamja">-</span></p>
      <p>보리: <span id="bori">-</span></p>

      <h3>🌱 씨앗 보유</h3>
      <p>씨감자: <span id="seedPotato">-</span></p>
      <p>씨보리: <span id="seedBarley">-</span></p>
    </header>

    <footer>
      <a href="gamja-main.html">➡️ 농장이름 짓기</a>
      <a href="auction-house.html">🏭 마이페이지</a>
      <a href="index9.html">🛒 메인으로</a>
    </footer>
  </main>

  <script>
    const API = "https://climbing-wholly-grouper.jp.ngrok.io/api";
    const kakaoId = localStorage.getItem("kakaoId");
    const nickname = localStorage.getItem("nickname") || "범고래X";
    const farmName = localStorage.getItem("farmName") || "하늘농장";
    const statusEl = document.getElementById("serverStatus");

    document.getElementById("nickname").textContent = nickname;
    document.getElementById("farmName").textContent = farmName;

    async function fetchUserData() {
      try {
        const res = await fetch(`${API}/userdata`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ kakaoId })
        });
        const data = await res.json();

        if (data.success) {
          const user = data.users[0];
          document.getElementById("water").textContent = user.inventory.water ?? 0;
          document.getElementById("fertilizer").textContent = user.inventory.fertilizer ?? 0;
          document.getElementById("orcx").textContent = user.wallet.orcx ?? 0;
          document.getElementById("gamja").textContent = user.storage.gamja ?? 0;
          document.getElementById("bori").textContent = user.storage.bori ?? 0;
          document.getElementById("seedPotato").textContent = user.inventory.seedPotato ?? 0;
          document.getElementById("seedBarley").textContent = user.inventory.seedBarley ?? 0;

          statusEl.textContent = "✅ 정상 연결됨";
          statusEl.style.color = "#00ff99";
        } else {
          statusEl.textContent = "⚠️ 유저 정보 없음";
          statusEl.style.color = "#ffcc00";
        }
      } catch (err) {
        console.error("API 요청 실패", err);
        statusEl.textContent = "❌ 서버 연결 실패";
        statusEl.style.color = "#ff4444";
      }
    }

    fetchUserData();
  </script>
</body>
</html>
