<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 농장 대시보드</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 5%;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      display: inline-block;
      border-radius: 12px;
    }
    .section {
      background-color: #ffffff20;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
    }
    .footer {
      margin-top: 20px;
    }
    .footer a {
      color: #FFD700;
      font-weight: bold;
      margin: 0 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>감자 농장 대시보드</h1>
    <div id="userInfo">농장주: <span id="nickname">-</span><br>농장이름: <span id="farmName">-</span></div>

    <div class="section">
      <h2>🏅 농장주 레벨</h2>
      현재 레벨: <span id="level">-</span><br>
      총 농사 횟수: <span id="harvestCount">-</span>
    </div>

    <div class="section">
      <h2>📦 농자재 보관함</h2>
      물: <span id="water">-</span><br>
      거름: <span id="fertilizer">-</span><br>
      ORCX: <span id="orcx">-</span>
    </div>

    <div class="section">
      <h2>🌾 작물 보관소</h2>
      감자: <span id="potato">-</span><br>
      보리: <span id="barley">-</span>
    </div>

    <div class="section">
      <h2>🌱 씨앗 보유 (로컬 기준)</h2>
      씨감자: <span id="seedPotato">-</span><br>
      씨보리: <span id="seedBarley">-</span>
    </div>

    <div class="footer">
      <a href="gamja-main.html">🌾 농장 작명소</a>
      <a href="gamja-shop.html">🛒 씨앗 상점</a>
    </div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname") || "-";
    const farmName = localStorage.getItem("farmName") || "-";
    const kakaoId = localStorage.getItem("kakaoId") || "unknown";
    const seedInventory = JSON.parse(localStorage.getItem("seedInventory") || "{}");

    document.getElementById("nickname").textContent = nickname;
    document.getElementById("farmName").textContent = farmName;
    document.getElementById("seedPotato").textContent = seedInventory.seedPotato || 0;
    document.getElementById("seedBarley").textContent = seedInventory.seedBarley || 0;

    async function fetchDashboardData() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata?kakaoId=${kakaoId}`, {
          method: "GET",
          cache: "no-store"
        });

        if (!res.ok) throw new Error("서버 응답 실패");
        const data = await res.json();

        const userData = data.user || {};

        document.getElementById("water").textContent = userData.water ?? "-";
        document.getElementById("fertilizer").textContent = userData.fertilizer ?? "-";
        document.getElementById("orcx").textContent = userData.token ?? "-";
        document.getElementById("potato").textContent = userData.potato ?? "-";
        document.getElementById("barley").textContent = userData.barley ?? "-";

        const harvestCount = userData.harvestCount ?? 0;
        const level = Math.floor(harvestCount / 5) + 1;
        document.getElementById("harvestCount").textContent = harvestCount;
        document.getElementById("level").textContent = "LV." + level;
      } catch (err) {
        console.error("❌ 서버 데이터 로딩 실패:", err);
      }
    }

    fetchDashboardData();
  </script>
</body>
</html>
