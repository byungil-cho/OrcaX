
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>감자 농장 입장</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      margin: 0;
      padding: 0;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }
    .container {
      padding: 20px;
    }
    .box {
      background-color: rgba(0, 0, 128, 0.6);
      padding: 10px 15px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">🥔 감자 농장에 오시는 것을 환영합니다!</div>
    <div class="box">👤 닉네임: <span id="nickname">-</span></div>
    <div class="box">🥔 감자: <span id="potato">0</span> 개</div>
    <div class="box">💧 물: <span id="water">0</span> 개</div>
    <div class="box">🌱 거름: <span id="fertilizer">0</span> 개</div>
    <div class="box">🪙 ORCX: <span id="token">0</span> 개</div>
    <div class="box">🥔 씨감자: <span id="seedPotato">0</span> 개</div>
    <div class="box">🌾 씨보리: <span id="seedBarley">0</span> 개</div>
    <div class="box">📦 인벤토리: <span id="inventory">-</span></div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname") || "범고래X";

    document.getElementById("nickname").textContent = nickname;

    fetch(`${API_BASE}/api/userdata?nickname=${encodeURIComponent(nickname)}`)
      .then(response => response.json())
      .then(data => {
        document.getElementById("potato").textContent = data.potato ?? 0;
        document.getElementById("water").textContent = data.water ?? 0;
        document.getElementById("fertilizer").textContent = data.fertilizer ?? 0;
        document.getElementById("token").textContent = data.token ?? 0;
        document.getElementById("seedPotato").textContent = data.seedPotato ?? 0;
        document.getElementById("seedBarley").textContent = data.seedBarley ?? 0;
        document.getElementById("inventory").textContent = data.inventory ?? "-";
      })
      .catch(err => {
        console.error("데이터 불러오기 실패:", err);
      });
  </script>
</body>
</html>
