<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>확인 가상 농장</title>
  <link rel="stylesheet" href="style.css">
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const accessToken = localStorage.getItem("accessToken");
      if (!accessToken) {
        alert("로그인이 필요합니다.");
        window.location.href = "kakao-login.html";
        return;
      }

      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/user/me", {
        headers: { Authorization: `Bearer ${accessToken}` },
      })
        .then((res) => res.json())
        .then((user) => {
          document.getElementById("nickname").innerText = user.nickname;
          document.getElementById("potatoCount").innerText = user.potatoCount;
          document.getElementById("water").innerText = user.water;
          document.getElementById("fertilizer").innerText = user.fertilizer;
          document.getElementById("orcx").innerText = user.orcx;
        })
        .catch((err) => {
          console.error("사용자 정보 로딩 실패", err);
          alert("사용자 정보 로딩 실패");
        });

      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/user/inventory", {
        headers: { Authorization: `Bearer ${accessToken}` },
      })
        .then((res) => res.json())
        .then((inventory) => {
          document.getElementById("seedPotato").innerText = inventory.seedPotato;
          document.getElementById("seedBarley").innerText = inventory.seedBarley;
        })
        .catch((err) => {
          console.error("인벤토리 로딩 실패", err);
        });

      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/status")
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("serverStatus").innerText = data.status === "ok" ? "서버 전원 ON" : "서버 전원 OFF";
        })
        .catch(() => {
          document.getElementById("serverStatus").innerText = "서버 전원 OFF";
        });
    });
  </script>
</head>
<body>
  <h1>🍟 감자 농장에 오시는 것을 환영합니다!</h1>
  <p>🤵닉네임: <span id="nickname">-</span></p>
  <p>🌾감자: <span id="potatoCount">-</span> 개 | 💧물: <span id="water">-</span> 개 | ✂기울: <span id="fertilizer">-</span> 개 | 🏋ORCX: <span id="orcx">-</span> 개</p>
  <p>🥔씨감자: <span id="seedPotato">-</span> 개 | 🌱씨보리: <span id="seedBarley">-</span> 개</p>
  <p>🔌서버 상태: <span id="serverStatus">확인 중...</span></p>
  <button onclick="location.href='farm.html'">🌾 농장이를 지지 이동</button>
</body>
</html>
