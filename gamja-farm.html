
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>감자 농장 입장</title>
  <style>
    body {
      background-image: url('https://byungil-cho.github.io/OrcaX/farm-101.png');
      background-size: cover;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    .status-box {
      background: rgba(0, 0, 0, 0.7);
      display: inline-block;
      padding: 20px;
      border-radius: 10px;
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <h2 id="welcomeMessage">데이터 불러오기 실패</h2>
  <div class="status-box" id="statusBox">
    <p>닉네임: <span id="nickname">-</span></p>
    <p>씨감자: <span id="seedPotato">-</span> 개</p>
    <p>씨보리: <span id="seedBarley">-</span> 개</p>
    <p>물: <span id="water">-</span> 개</p>
    <p>거름: <span id="fertilizer">-</span> 개</p>
    <p>ORCX 토큰: <span id="token">-</span></p>
  </div>

  <script>
    fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata")
      .then((res) => res.json())
      .then((data) => {
        document.getElementById("welcomeMessage").textContent = "어서오세요, " + data.nickname + "님!";
        document.getElementById("nickname").textContent = data.nickname;
        document.getElementById("seedPotato").textContent = data.seedPotato || 0;
        document.getElementById("seedBarley").textContent = data.seedBarley || 0;
        document.getElementById("water").textContent = data.water || 0;
        document.getElementById("fertilizer").textContent = data.fertilizer || 0;
        document.getElementById("token").textContent = data.token || 0;
      })
      .catch((err) => {
        console.error("데이터 불러오기 실패:", err);
      });
  </script>
</body>
</html>
