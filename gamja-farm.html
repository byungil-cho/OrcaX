<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>감자 농장 입장</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      margin: 0;
      padding: 0;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }
    .info-box {
      background: rgba(0,0,0,0.6);
      padding: 20px;
      margin: 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="info-box">
    <h2>🌱 감자 농장 입장</h2>
    <p><strong>닉네임:</strong> <span id="nickname">불러오는 중...</span></p>
    <p><strong>씨감자:</strong> <span id="seedPotato">-</span>개</p>
    <p><strong>물:</strong> <span id="water">-</span>개</p>
    <p><strong>거름:</strong> <span id="fertilizer">-</span>개</p>
    <p><strong>ORCX:</strong> <span id="token">-</span>개</p>
    <p id="serverStatus">서버 상태 확인 중...</p>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

    async function fetchUserData() {
      const kakaoId = localStorage.getItem("userId");

      if (!kakaoId) {
        document.getElementById("serverStatus").textContent = "❌ 로그인 정보 없음";
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/userdata?kakaoId=${encodeURIComponent(kakaoId)}`);
        if (!res.ok) throw new Error(`서버 응답 오류: ${res.status}`);

        const data = await res.json();

        if (data && data.nickname) {
          document.getElementById("nickname").textContent = data.nickname;
          document.getElementById("seedPotato").textContent = data.seedPotato || 0;
          document.getElementById("water").textContent = data.water || 0;
          document.getElementById("fertilizer").textContent = data.fertilizer || 0;
          document.getElementById("token").textContent = data.token || 0;
          document.getElementById("serverStatus").textContent = "✅ 서버 연결 완료";
        } else {
          document.getElementById("serverStatus").textContent = "❌ 유저 정보 없음";
        }
      } catch (err) {
        console.error(err);
        document.getElementById("serverStatus").textContent = "❌ 서버 연결 실패";
      }
    }

    fetchUserData();
  </script>
</body>
</html>
