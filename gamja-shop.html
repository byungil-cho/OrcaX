<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>&#127813; 씨감자•씨보리 상점</title>
  <style>
    body { margin: 0; font-family: 'Do Hyeon', sans-serif; background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center top fixed; background-size: cover; }
    .shop-container { max-width: 500px; margin: 0 auto; padding: 2rem; background: rgba(255, 255, 255, 0.85); border-radius: 1rem; }
    h1 { text-align: center; margin-bottom: 1rem; }
    .server-status { text-align: center; font-weight: bold; margin-bottom: 1rem; color: #ff4444; }
    .balance { text-align: center; font-size: 1.2rem; margin-bottom: 1rem; }
    .item { display: flex; flex-direction: column; align-items: center; margin-bottom: 2rem; padding: 1rem; background: #f0f0f0; border-radius: 1rem; }
    .item h2 { margin: 0.5rem 0; }
    .item button { background: #4caf50; color: white; border: none; padding: 0.75rem 2rem; border-radius: 0.5rem; font-size: 1rem; cursor: pointer; }
    .item button:hover { background: #43a047; }
    .nav { text-align: center; margin-top: 2rem; }
    .nav a { margin: 0 0.5rem; color: #333; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="shop-container">
    <h1>&#127813; 씨감자•씨보리 상점</h1>
    <div class="server-status" id="serverStatus">❌ 서버 연결 실패</div>
    <div class="balance">보유 토큰: <span id="orcx">-</span> ORCX</div>

    <div class="item">
      <h2>씨감자 구매</h2>
      <p>가격: 2 ORCX</p>
      <button onclick="buySeed('seedPotato')">구매하기</button>
      <p>보유 씨감자: <span id="seedPotato">-</span></p>
    </div>

    <div class="item">
      <h2>씨보리 구매</h2>
      <p>가격: 2 ORCX</p>
      <button onclick="buySeed('seedBarley')">구매하기</button>
      <p>보유 씨보리: <span id="seedBarley">-</span></p>
    </div>

    <div class="nav">
      <a href="gamja-main.html">머리로</a>
      <a href="gamja-factory.html">공장으로</a>
      <a href="gamja-farm.html">농장으로</a>
    </div>
  </div>

  <script>
    const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io';
    const kakaoId = localStorage.getItem('userId');
    const nickname = localStorage.getItem('nickname');

    if (!kakaoId || !nickname) {
      alert('로그인이 필요합니다.');
      location.href = 'gamja-login.html';
    }

    const statusEl = document.getElementById('serverStatus');
    const orcxEl = document.getElementById('orcx');

    async function fetchUser() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata?kakaoId=${encodeURIComponent(kakaoId)}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        const user = data.user || (Array.isArray(data.users) ? data.users[0] : null);
        if (user) {
          statusEl.textContent = '✅ 서버 연결 성공';
          orcxEl.textContent = user.orcx || user.token || 0;
          document.getElementById('seedPotato').textContent = user.seedPotato || 0;
          document.getElementById('seedBarley').textContent = user.seedBarley || 0;
        }
      } catch (e) {
        statusEl.textContent = '❌ 서버 연결 실패';
        console.error(e);
      }
    }

    async function buySeed(type) {
      try {
        const res = await fetch(`${API_BASE}/api/update-user`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId, nickname, type })
        });
        if (!res.ok) throw new Error();
        await fetchUser();
      } catch (e) {
        alert('구매 실패');
        console.error(e);
      }
    }

    fetchUser();
  </script>
</body>
</html>
