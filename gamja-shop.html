<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>씨앗 상점</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: #fff;
    }
    main {
      padding: 1rem;
      min-height: 100vh;
    }
    header {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 1rem;
      border-radius: 0 0 10px 10px;
      color: #fff;
    }
    nav a {
      color: #ffdf6c;
      text-decoration: none;
      margin: 0 0.5rem;
    }
    .store-buttons {
      margin-top: 2rem;
    }
    h2 {
      color: #ffffff;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
      font-size: 1.8rem;
    }
    p {
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
      font-size: 1.2rem;
    }
    button {
      font-size: 1.2rem;
      padding: 0.5rem 1rem;
      margin: 0.5rem;
      border-radius: 10px;
      border: none;
      background-color: #6cbb3c;
      color: white;
      cursor: pointer;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }
    button:hover {
      background-color: #519e2c;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌱 씨앗 상점</h1>
    <p>👤 닉네임: <span id="nickname">로딩 중...</span></p>
    <p>🔌 전원: <span id="power">확인 중...</span></p>
    <p>🍀 보유 토큰: <span id="orcx">0</span></p>
    <nav>
      <a href="index9.html">🏡 메인으로</a> |
      <a href="gamja-farm.html">🥔 감자 농장</a> |
      <a href="gamja-exchange.html">🧪 씨앗 관리</a> |
      <a href="admin-users.html">📜 유저 목록</a>
    </nav>
  </header>

  <main>
    <div class="store-buttons">
      <h2>🥔 씨감자</h2>
      <p>남은 수량: <span id="potato-stock">로딩 중...</span></p>
      <button onclick="buySeed('seedPotato')">구매하기</button>

      <h2>🌾 씨보리</h2>
      <p>남은 수량: <span id="barley-stock">로딩 중...</span></p>
      <button onclick="buySeed('seedBarley')">구매하기</button>
    </div>
    <div id="mySeeds" style="text-align:center; font-weight:bold; margin-top:1rem;"></div>
  </main>

  <script>
    const API_BASE = "http://localhost:3060";
    const nickname = localStorage.getItem("nickname") || "알 수 없음";
    document.getElementById("nickname").textContent = nickname;

    const kakaoId = localStorage.getItem("kakaoId");
    if (!kakaoId) {
      alert("로그인이 필요합니다.");
      location.href = "gamja-login.html";
    }

    fetch(`${API_BASE}/api/power-status`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("power").textContent = data.status;
      })
      .catch(() => {
        document.getElementById("power").textContent = "에러";
      });

    fetch(`${API_BASE}/api/userdata?kakaoId=${encodeURIComponent(kakaoId)}`)
      .then(res => res.json())
      .then(data => {
        const user = data.user || (Array.isArray(data.users) ? data.users[0] : null);
        if (user) {
          document.getElementById("orcx").textContent = user.orcx ?? user.token ?? 0;
        }
      });

    fetch(`${API_BASE}/api/seed/status`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("potato-stock").textContent = `${data.seedPotato.quantity} 개`;
        document.getElementById("barley-stock").textContent = `${data.seedBarley.quantity} 개`;
      });

    async function buySeed(type) {
      if (!kakaoId) {
        alert("로그인이 필요합니다.");
        return;
      }
      const quantity = 1;
      try {
        const res = await fetch(`${API_BASE}/seed/purchase`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId, type, quantity })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "구매 실패");

        alert(`${type === 'seedPotato' ? '씨감자' : '씨보리'} 구매 완료!`);

        const inventory = JSON.parse(localStorage.getItem("seedInventory") || "{}");
        inventory[type] = (inventory[type] || 0) + quantity;
        localStorage.setItem("seedInventory", JSON.stringify(inventory));

        updateInventoryUI();
      } catch (err) {
        alert(err.message);
      }
    }

    function updateInventoryUI() {
      const inventory = JSON.parse(localStorage.getItem("seedInventory") || "{}");
      const potato = inventory.seedPotato || 0;
      const barley = inventory.seedBarley || 0;
      document.getElementById("mySeeds").textContent = `내 씨감자: ${potato}개 | 씨보리: ${barley}개`;
    }

    updateInventoryUI();
  </script>
</body>
</html>
