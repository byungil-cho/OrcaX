<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>씨앗 상점</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: #fff;
    }
    main {
      padding: 1rem;
      min-height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
    }
    header {
      background-color: rgba(255, 248, 220, 0.85);
      color: #000;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 10px;
    }
    .info-box {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 1rem;
      margin: 1rem auto;
      max-width: 600px;
      border-radius: 15px;
    }
    .shop-item {
      background-color: rgba(255, 255, 255, 0.1);
      margin: 1rem;
      padding: 1rem;
      border-radius: 10px;
    }
    button {
      background-color: #00e0ff;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
    }
    a {
      display: inline-block;
      margin: 0.5rem;
      color: #00e0ff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h2>🌱 OrcaX 씨앗 상점</h2>
      <div id="nickname">닉네임: -</div>
      <div id="orcx">ORCX 토큰: -</div>
    </header>

    <div class="info-box">
      <h3>씨앗 보관소 재고</h3>
      <div>씨감자 재고: <span id="seedPotatoStock">-</span>개 / 가격: <span id="seedPotatoPrice">-</span> ORCX</div>
      <div>씨보리 재고: <span id="seedBarleyStock">-</span>개 / 가격: <span id="seedBarleyPrice">-</span> ORCX</div>
    </div>

    <div class="info-box">
      <h3>내 보유 씨앗</h3>
      <div>씨감자: <span id="mySeedPotato">-</span>개</div>
      <div>씨보리: <span id="mySeedBarley">-</span>개</div>
    </div>

    <div class="shop-item">
      <h4>씨감자 구매</h4>
      <button onclick="buySeed('potato')">구매하기</button>
    </div>

    <div class="shop-item">
      <h4>씨보리 구매</h4>
      <button onclick="buySeed('barley')">구매하기</button>
    </div>

    <a href="#" onclick="goToSeedAdmin()">🌱 씨앗 관리소</a>
    <a href="gamja-farm.html">← 감자농장으로 돌아가기</a>
  </main>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";

    const userId = localStorage.getItem("kakaoId");
    const nickname = localStorage.getItem("nickname");

    document.getElementById("nickname").innerText = `닉네임: ${nickname || "-"}`;

    async function loadData() {
      try {
        const [userRes, priceRes, statusRes] = await Promise.all([
          fetch(`${API_BASE}/users/info/${userId}`),
          fetch(`${API_BASE}/seed/price`),
          fetch(`${API_BASE}/seed/status`)
        ]);

        const userData = await userRes.json();
        const priceData = await priceRes.json();
        const statusData = await statusRes.json();

        // 유저 정보
        document.getElementById("orcx").innerText = `ORCX 토큰: ${userData.orcx || 0}`;
        document.getElementById("mySeedPotato").innerText = userData.inventory.seedPotato || 0;
        document.getElementById("mySeedBarley").innerText = userData.inventory.seedBarley || 0;

        // 가격 정보
        document.getElementById("seedPotatoPrice").innerText = priceData.seedPotatoPrice || 0;
        document.getElementById("seedBarleyPrice").innerText = priceData.seedBarleyPrice || 0;

        // 재고 정보
        document.getElementById("seedPotatoStock").innerText = statusData.seedPotato || 0;
        document.getElementById("seedBarleyStock").innerText = statusData.seedBarley || 0;
      } catch (err) {
        console.error("데이터 불러오기 실패:", err);
        alert("서버 연결 오류");
      }
    }

    async function buySeed(type) {
      try {
        const res = await fetch(`${API_BASE}/seed/buy`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId: userId, seedType: type })
        });
        const data = await res.json();
        if (data.success) {
          alert("구매 성공!");
          loadData();
        } else {
          alert("구매 실패: " + data.message);
        }
      } catch (err) {
        alert("구매 오류");
      }
    }

    function goToSeedAdmin() {
      const pw = prompt("씨앗 관리소 비밀번호를 입력하세요:");
      if (pw === "7788") {
        window.location.href = "admin-seeds.html";
      } else {
        alert("비밀번호가 틀렸습니다.");
      }
    }

    loadData();
  </script>
</body>
</html>
