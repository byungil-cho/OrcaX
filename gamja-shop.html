<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>씨감자·씨보리 상점</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Pretendard', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: #333;
    }
    nav.nav-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      background: rgba(255,255,255,0.8);
      padding: 12px 0;
    }
    nav.nav-bar a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background .2s;
    }
    nav.nav-bar a:hover { background: rgba(0,0,0,0.1); }
    header {
      text-align: center;
      padding: 16px;
      font-size: 1.5rem;
      font-weight: bold;
      background: rgba(255,255,255,0.8);
      position: relative;
    }
    header .user-name {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
    }
    .status {
      text-align: center;
      padding: 12px;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.7);
    }
    .shop-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 24px;
    }
    .item-card {
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 16px;
      width: 260px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .item-card h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .item-card p { margin: 4px 0; flex-grow: 1; }
    .item-card button {
      background: #4CAF50; color: #fff; border: none;
      border-radius: 6px; padding: 10px; font-size: 1rem;
      cursor: pointer; transition: background .2s;
    }
    .item-card button:disabled { background: #aaa; cursor: not-allowed; }
    .item-card button:hover:not(:disabled) { background: #45A049; }
    @media (max-width: 600px) {
      .shop-container { flex-direction: column; align-items: center; }
      .item-card { width: 90%; }
    }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <a href="gamja-farm.html">🏡 농장으로</a>
    <a href="gamja-factory.html">🏭 공장으로</a>
    <a href="gamja-shop.html">🛒 상점</a>
  </nav>
  <header>
    씨감자·씨보리 상점
    <div class="user-name">— 님</div>
  </header>
  <div class="status">보유 토큰: <span id="tokenCount">—</span> ORCX</div>
  <div class="shop-container">
    <div class="item-card">
      <h2>씨감자 구매</h2>
      <p>가격: 2 ORCX</p>
      <button id="buyPotato">구매하기</button>
      <p>보유 씨감자: <span id="potatoCount">—</span></p>
    </div>
    <div class="item-card">
      <h2>씨보리 구매</h2>
      <p>가격: 2 ORCX</p>
      <button id="buyBarley">구매하기</button>
      <p>보유 씨보리: <span id="barleyCount">—</span></p>
    </div>
  </div>
  <script>
    // 1) index9.html에서 설정한 닉네임 가져오기
    const nickname = localStorage.getItem('nickname');
    if (!nickname) {
      alert('로그인이 필요합니다.');
      return location.href = 'index9.html';
    }
    document.querySelector('header .user-name').textContent = nickname + '님';

    const tokenEl   = document.getElementById('tokenCount');
    const potatoEl  = document.getElementById('potatoCount');
    const barleyEl  = document.getElementById('barleyCount');
    const buyPotato = document.getElementById('buyPotato');
    const buyBarley = document.getElementById('buyBarley');

    // 2) 서버에서 자산 데이터 로드
    async function loadAssets() {
      try {
        const res = await fetch('/api/assets', { credentials: 'include' });
        if (!res.ok) throw new Error('자산 로드 실패');
        const { tokens, potatoes, barleys } = await res.json();
        tokenEl.textContent  = tokens;
        potatoEl.textContent = potatoes;
        barleyEl.textContent = barleys;
        buyPotato.disabled = tokens < 2;
        buyBarley.disabled = tokens < 2;
      } catch (e) {
        console.error(e);
        alert('자산 정보를 불러오는 중 오류가 발생했습니다.');
      }
    }

    // 3) 구매 요청
    async function purchase(item) {
      try {
        const res = await fetch('/api/purchase', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ item })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.message || '구매 실패');
        tokenEl.textContent  = data.tokens;
        potatoEl.textContent = data.potatoes;
        barleyEl.textContent = data.barleys;
        buyPotato.disabled = data.tokens < 2;
        buyBarley.disabled = data.tokens < 2;
        alert('구매가 완료되었습니다.');
      } catch (e) {
        console.error(e);
        alert('구매 중 오류가 발생했습니다.');
      }
    }

    buyPotato.addEventListener('click', () => purchase('potato'));
    buyBarley.addEventListener('click', () => purchase('barley'));

    // 4) 초기 실행
    loadAssets();
  </script>
</body>
</html>
