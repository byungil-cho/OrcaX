<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>씨앗 구매소</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: white;
    }
    main {
      padding: 1rem;
    }
    .box {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 1rem;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      background-color: #4CAF50;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      margin: 0.5rem;
    }
    nav {
      margin-top: 1rem;
    }
    nav a {
      margin: 0 10px;
      color: #ffd700;
      text-decoration: none;
    }
    .status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #00ffcc;
    }
  </style>
</head>
<body>
  <main>
    <div class="box">
      <h3>🥔 씨감자 남은 수량: <span id="potato-stock">...</span></h3>
      <h3>🌾 씨보리 남은 수량: <span id="barley-stock">...</span></h3>
      <h3>🥔 씨감자 가격: <span id="potato-price">...</span> ORCX</h3>
      <h3>🌾 씨보리 가격: <span id="barley-price">...</span> ORCX</h3>
      <h3>🥚 보유 토큰: <span id="user-tokens">0</span> ORCX</h3>

      <nav>
        <a href="gamja-farm.html">🏠 감자 농장</a>
        <a href="admin-seeds.html">🌾 씨앗 관리소</a>
        <a href="gamja-result.html">📁 개인 보관함</a>
      </nav>

      <h2>🥔 씨감자</h2>
      <p>내 보유: <span id="my-potato">0</span>개</p>
      <button onclick="buySeed('potato')">구매하기</button>

      <h2>🌾 씨보리</h2>
      <p>내 보유: <span id="my-barley">0</span>개</p>
      <button onclick="buySeed('barley')">구매하기</button>
      
      <div class="status" id="server-status">🔌 서버 연결 중...</div>
    </div>
  </main>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";

    async function fetchData() {
      try {
        const res = await fetch(`${API_BASE}/userdata`);
        const user = await res.json();
        if (!user || !user.nickname) {
          alert("사용자 없음");
          return;
        }

        document.getElementById("user-tokens").textContent = user.token;
        document.getElementById("my-potato").textContent = user.inventory.seedPotato || 0;
        document.getElementById("my-barley").textContent = user.inventory.seedBarley || 0;
      } catch (err) {
        console.error(err);
        alert("서버 연결 실패");
      }
    }

    async function fetchSeedInfo() {
      try {
        const res1 = await fetch(`${API_BASE}/seed/status`);
        const status = await res1.json();
        document.getElementById("potato-stock").textContent = status.seedPotato;
        document.getElementById("barley-stock").textContent = status.seedBarley;

        const res2 = await fetch(`${API_BASE}/seed/price`);
        const price = await res2.json();
        document.getElementById("potato-price").textContent = price.seedPotato;
        document.getElementById("barley-price").textContent = price.seedBarley;

        document.getElementById("server-status").textContent = "✅ 서버 연결 성공";
      } catch (err) {
        console.error(err);
        document.getElementById("server-status").textContent = "❌ 서버 연결 실패";
      }
    }

    async function buySeed(type) {
      try {
        const res = await fetch(`${API_BASE}/seed-buy`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type })
        });
        const result = await res.json();
        if (result.success) {
          alert(`${type === 'potato' ? '씨감자' : '씨보리'} 구매 성공`);
          fetchData();
          fetchSeedInfo();
        } else {
          alert(result.message || "구매 실패");
        }
      } catch (err) {
        console.error(err);
        alert("에러 발생");
      }
    }

    fetchData();
    fetchSeedInfo();
  </script>
</body>
</html>
