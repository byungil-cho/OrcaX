<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 씨앗 상점</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: #fcf5e5;
      color: #222;
      margin: 0; padding: 0;
    }
    .section {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px #ccc8;
      padding: 2rem;
      max-width: 400px;
      margin: 3rem auto 1.5rem auto;
      font-size: 1.15rem;
    }
    .main-label {
      font-size: 1.25rem;
      margin-bottom: 0.6rem;
      display: block;
    }
    .btn {
      background: #1fc76a;
      color: #fff;
      padding: 0.8rem 2.2rem;
      font-size: 1.15rem;
      border: none;
      border-radius: 0.8rem;
      margin: 1.2rem 0;
      cursor: pointer;
      font-family: 'Do Hyeon', sans-serif;
      transition: background 0.2s;
    }
    .btn:hover { background: #149b4b; }
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(20,20,20,0.98);
      padding: 0.7rem 0 0.5rem 0;
      display: flex;
      justify-content: center;
      z-index: 10;
      gap: 2.5rem;
      font-size: 1.1rem;
    }
    nav a { color: #ffc107; text-decoration: none; }
    .safe-box { margin: 1rem 0 2rem 0; }
    .safe-box label { color: #4e4e4e; }
  </style>
</head>
<body>
  <div class="section">
    <span class="main-label">🌱 OrcaX 씨앗 상점</span>
    <div class="safe-box">
      <label>🪙 보유 토큰 : <span id="orcx">-</span> ORCX</label>
    </div>
    <div>
      🥔 씨감자 재고: <span id="potato-stock">-</span>개<br>
      🥔 씨감자 가격: <span id="potato-price">-</span> ORCX<br>
      <br>
      🌾 씨보리 재고: <span id="barley-stock">-</span>개<br>
      🌾 씨보리 가격: <span id="barley-price">-</span> ORCX
    </div>
  </div>
  <div class="section">
    <h2>🥔 씨감자 구매</h2>
    내 보유: <span id="myPotato">-</span>개<br>
    <button class="btn" onclick="buySeed('potato')">씨감자 구매</button>
  </div>
  <div class="section">
    <h2>🌾 씨보리 구매</h2>
    내 보유: <span id="myBarley">-</span>개<br>
    <button class="btn" onclick="buySeed('barley')">씨보리 구매</button>
  </div>
  <nav>
    <a href="gamja-farm.html">감자 농장</a>
    <a href="gamja-shop.html">씨앗 관리소</a>
    <a href="gamja-storage.html">개인 보관함</a>
  </nav>
  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";
    const kakaoId = localStorage.getItem("kakaoId") || "";
    if (!kakaoId) {
      alert("로그인이 필요합니다. 메인으로 이동합니다.");
      window.location.href = "index9.html";
    }

    // 모든 정보 한 번에 불러오기 (통합 안전 버전)
    async function fetchAll() {
      try {
        // 1. 내 정보 (토큰/씨앗)
        const res1 = await fetch(`${API_BASE}/user/v2data`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId }) // ★ 여기 꼭 kakaoId로!
        });
        const data1 = await res1.json();
        // data1.user 구조 확인 (콘솔)
        // console.log("user:", data1);

        // 토큰 - wallet.orcx 또는 평문 orcx 모두 대응
        const user = data1.user || data1;
        let orcx = 0;
        if (user.wallet && typeof user.wallet.orcx !== "undefined") {
          orcx = user.wallet.orcx;
        } else if (typeof user.orcx !== "undefined") {
          orcx = user.orcx;
        } else if (typeof user.token !== "undefined") {
          orcx = user.token;
        }
        document.getElementById("orcx").textContent = orcx;

        // 내 씨앗
        document.getElementById("myPotato").textContent =
          user.inventory?.seedPotato ?? 0;
        document.getElementById("myBarley").textContent =
          user.inventory?.seedBarley ?? 0;

        // 2. 씨앗 보관소 재고
        const res2 = await fetch(`${API_BASE}/seed/status`);
        const d = await res2.json();
        document.getElementById("potato-stock").textContent = d.seedPotato ?? 0;
        document.getElementById("barley-stock").textContent = d.seedBarley ?? 0;

        // 3. 씨앗 가격
        const res3 = await fetch(`${API_BASE}/seed/price`);
        const price = await res3.json();
        document.getElementById("potato-price").textContent = price.seedPotatoPrice ?? 0;
        document.getElementById("barley-price").textContent = price.seedBarleyPrice ?? 0;
      } catch (err) {
        document.getElementById("orcx").textContent = 0;
        document.getElementById("myPotato").textContent = 0;
        document.getElementById("myBarley").textContent = 0;
        document.getElementById("potato-stock").textContent = 0;
        document.getElementById("barley-stock").textContent = 0;
        document.getElementById("potato-price").textContent = 0;
        document.getElementById("barley-price").textContent = 0;
      }
    }

    // 씨앗 구매 (예시, 실제 서버 구매 API 맞춰 수정 필요)
    async function buySeed(type) {
      alert(`${type === 'potato' ? '씨감자' : '씨보리'} 구매 기능은 서버 연동 후 사용 가능합니다.`);
      // 실제 구매 로직 추가 시 서버와 맞는 API, 파라미터 확인 필요
    }

    fetchAll();
  </script>
</body>
</html>
