<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>씨앗 구매소</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 5%;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      display: inline-block;
      border-radius: 12px;
    }
    h1, h2, h3 {
      margin: 10px 0;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }
    .nav a {
      display: inline-block;
      margin: 10px 15px;
      color: #FFD700;
      font-weight: bold;
      text-decoration: none;
    }
    .status {
      margin-top: 20px;
      font-weight: bold;
      color: #00FF00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🌱 씨앗 구매소</h2>
    <h3>👨‍🌾 닉네임: <span id="nickname">-</span></h3>
    <h3>🥔 씨감자 남은 수량: <span id="seedPotatoStock">로딩 중...</span></h3>
    <h3>🌾 씨보리 남은 수량: <span id="seedBarleyStock">로딩 중...</span></h3>
    <h3>💰 씨감자 가격: <span id="pricePotato">-</span> ORCX</h3>
    <h3>💰 씨보리 가격: <span id="priceBarley">-</span> ORCX</h3>
    <h3>🍀 보유 토큰: <span id="orcx">-</span></h3>

    <div class="nav">
      <a href="index9.html">🏠 메인으로</a>
      <a href="gamja-factory.html">🥔 감자 농장</a>
      <a href="admin-seeds.html">🌱 씨앗 관리소</a>
      <a href="user-list.html">📑 유저 목록</a>
    </div>

    <div>
      <h2>🥔 씨감자</h2>
      <p>내 보유: <span id="myPotato">0</span>개</p>
      <button onclick="buySeed('seedPotato')">구매하기</button>
    </div>

    <div>
      <h2>🌾 씨보리</h2>
      <p>내 보유: <span id="myBarley">0</span>개</p>
      <button onclick="buySeed('seedBarley')">구매하기</button>
    </div>

    <div class="status" id="serverStatus">⏳ 서버 연결 확인 중...</div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";
    const kakaoId = localStorage.getItem("kakaoId") || "unknown";

    async function fetchUserInfo() {
      try {
        const res = await fetch(`${API_BASE}/userdata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId })
        });
        const user = await res.json();

        // 표시
        document.getElementById("nickname").textContent = user.nickname || "-";
        document.getElementById("myPotato").textContent = user.seedPotato ?? 0;
        document.getElementById("myBarley").textContent = user.seedBarley ?? 0;
        document.getElementById("orcx").textContent = user.orcx ?? 0;
        document.getElementById("serverStatus").textContent = "✅ 서버 연결 성공";

        // 저장
        localStorage.setItem("nickname", user.nickname || "-");
        const updatedInventory = {
          seedPotato: user.seedPotato ?? 0,
          seedBarley: user.seedBarley ?? 0
        };
        localStorage.setItem("seedInventory", JSON.stringify(updatedInventory));
      } catch (err) {
        document.getElementById("serverStatus").textContent = "❌ 서버 연결 실패";
      }
    }

    async function fetchSeedStatus() {
      try {
        const res = await fetch(`${API_BASE}/seed/status`);
        const data = await res.json();
        document.getElementById("seedPotatoStock").textContent = data.seed_potato ?? "N/A";
        document.getElementById("seedBarleyStock").textContent = data.seed_barley ?? "N/A";
      } catch (err) {
        document.getElementById("seedPotatoStock").textContent = "❌ 에러";
        document.getElementById("seedBarleyStock").textContent = "❌ 에러";
      }
    }

    async function fetchSeedPrices() {
      try {
        const res = await fetch(`${API_BASE}/seed/price`);
        const data = await res.json();
        document.getElementById("pricePotato").textContent = data.seed_potato ?? "불러오기 실패";
        document.getElementById("priceBarley").textContent = data.seed_barley ?? "불러오기 실패";
      } catch (err) {
        document.getElementById("pricePotato").textContent = "❌";
        document.getElementById("priceBarley").textContent = "❌";
      }
    }

    async function buySeed(seedType) {
      try {
        const res = await fetch(`${API_BASE}/seed/buy`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId, seedType })
        });
        const result = await res.json();
        if (result.success) {
          alert("✅ 구매 성공!");
          fetchSeedStatus();
          fetchUserInfo();
        } else {
          alert(result.message || "구매 실패");
        }
      } catch (err) {
        alert("❌ 서버 오류로 구매 실패");
      }
    }

    // 초기 로딩
    fetchSeedStatus();
    fetchSeedPrices();
    fetchUserInfo();
  </script>
</body>
</html>
