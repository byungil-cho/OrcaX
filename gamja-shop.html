<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>씨앗 구매소</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <style>
    .shop-section {
      padding: 2rem;
      background: #fdfdfd;
      border-radius: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .item-box {
      margin-bottom: 2rem;
      padding: 1rem;
      border: 1px solid #ddd;
      border-radius: 0.5rem;
      background-color: #fff;
    }
    h2 {
      margin-top: 0;
    }
    .resource-display {
      font-weight: bold;
      color: #444;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

<nav class="container-fluid">
  <ul>
    <li><strong>OrcaX Farm</strong></li>
  </ul>
  <ul>
    <li><a href="/index.html">홈</a></li>
    <li><a href="/gamja-farm.html">감자밭</a></li>
    <li><a href="/bori-farm.html">보리밭</a></li>
    <li><a href="#" role="button">내 정보</a></li>
  </ul>
</nav>

<main class="container">
  <h1 style="text-align:center; margin-bottom: 2rem;">🌱 씨앗 구매소</h1>

  <section class="shop-section">

    <div class="item-box">
      <h2>🥔 씨감자</h2>
      <p class="resource-display">보유 씨감자: <span id="seedPotato">0</span></p>
      <button onclick="buySeed('seedPotato')">구매하기</button>
    </div>

    <div class="item-box">
      <h2>🌾 씨보리</h2>
      <p class="resource-display">보유 씨보리: <span id="seedBarley">0</span></p>
      <button onclick="buySeed('seedBarley')">구매하기</button>
    </div>

  </section>
</main>

<script>
const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io"; // 여기에 실제 ngrok 주소 입력

const kakaoId = localStorage.getItem("kakaoId");

async function fetchSeedStatus() {
  try {
    const res = await fetch(`${API_BASE}/users/me?kakaoId=${kakaoId}`);
    const data = await res.json();
    document.getElementById("seedPotato").innerText = data.seedPotato ?? 0;
    document.getElementById("seedBarley").innerText = data.seedBarley ?? 0;
  } catch (err) {
    console.error("씨앗 상태 가져오기 실패", err);
  }
}

async function buySeed(type) {
  try {
    const res = await fetch(`${API_BASE}/users/save-resources`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        kakaoId,
        [type]: 1, // 예: seedPotato: 1
      }),
    });
    const data = await res.json();
    document.getElementById(type).innerText = data[type];
    alert("구매 완료!");
  } catch (err) {
    console.error("구매 실패", err);
    alert("구매 중 오류 발생");
  }
}

fetchSeedStatus();
</script>

</body>
</html>
