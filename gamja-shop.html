<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>씨앗 상점</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 5%;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      display: inline-block;
      border-radius: 12px;
    }
    h1, h2 {
      margin: 10px 0;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }
    .nav a {
      display: inline-block;
      margin: 10px 15px;
      color: #FFD700;
      font-weight: bold;
      text-decoration: none;
    }
    .status {
      margin: 10px 0;
      font-weight: bold;
      color: #00FF00;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ✅ 제목 추가 -->
    <h1>🌱 씨앗 구매소</h1>

    <h2>🧑‍🌾 닉네임: <span id="nickname">-</span></h2>
    <h2>🥔 씨감자 (<span id="pricePotato">-</span> ORCX)</h2>
    <p>남은 수량: <span id="seedPotatoStock">로딩 중...</span></p>

    <h2>🌾 씨보리 (<span id="priceBarley">-</span> ORCX)</h2>
    <p>남은 수량: <span id="seedBarleyStock">로딩 중...</span></p>

    <h3>⚡ 전원: <span id="power">-</span></h3>
    <h3>🍀 보유 토큰: <span id="orcx">-</span></h3>

    <div class="nav">
      <a href="index9.html">🏠 메인으로</a>
      <a href="gamja-factory.html">🥔 감자 농장</a>
      <a href="gamja-shop.html">🌱 씨앗 구매소</a>
      <a href="user-list.html">📑 유저 목록</a>
    </div>

    <div>
      <h2>🥔 씨감자</h2>
      <p>남은 수량: <span id="seedPotatoStock">로딩 중...</span></p>
      <button onclick="buySeed('seedPotato')">구매하기</button>
    </div>

    <div>
      <h2>🌾 씨보리</h2>
      <p>남은 수량: <span id="seedBarleyStock">로딩 중...</span></p>
      <button onclick="buySeed('seedBarley')">구매하기</button>
    </div>

    <p style="margin-top: 20px;">내 씨감자: <span id="myPotato">0</span>개 | 씨보리: <span id="myBarley">0</span>개</p>
    <div class="status" id="serverStatus">⏳ 서버 연결 확인 중...</div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname") || "-";
    const kakaoId = localStorage.getItem("kakaoId") || "unknown";
    const seedInventory = JSON.parse(localStorage.getItem("seedInventory") || "{}");
    const powerStatus = JSON.parse(localStorage.getItem("powerStatus") || "{}");
    const resources = JSON.parse(localStorage.getItem("resources") || "{}");

    document.getElementById("nickname").textContent = nickname;

    async function fetchSeedStatus() {
      try {
        const res = await fetch(`${API_BASE}/api/seed/status`);
        const data = await res.json();
        document.getElementById("seedPotatoStock").textContent = data.seedPotato;
        document.getElementById("seedBarleyStock").textContent = data.seedBarley;
      } catch (err) {
        document.getElementById("seedPotatoStock").textContent = "에러";
        document.getElementById("seedBarleyStock").textContent = "에러";
      }
    }

    async function fetchUserInfo() {
      try {
        const res = await fetch(`${API_BASE}/api/userdata?kakaoId=${kakaoId}`);
        const data = await res.json();
        document.getElementById("myPotato").textContent = data.seedPotato || 0;
        document.getElementById("myBarley").textContent = data.seedBarley || 0;
        document.getElementById("orcx").textContent = data.orcx || 0;
        document.getElementById("power").textContent = data.power || "없음";
        document.getElementById("serverStatus").textContent = "✅ 서버 연결 성공";
      } catch (err) {
        document.getElementById("serverStatus").textContent = "❌ 서버 연결 실패";
      }
    }
// 가격과 재고 모두 불러오는 부분
async function fetchSeedInfo() {
  try {
    const [priceRes, stockRes] = await Promise.all([
      fetch(`${API_BASE}/api/seed/price`),
      fetch(`${API_BASE}/api/seed/status`)
    ]);
    const prices = await priceRes.json();
    const stocks = await stockRes.json();

    document.getElementById("pricePotato").textContent = prices.seedPotato;
    document.getElementById("priceBarley").textContent = prices.seedBarley;

    document.getElementById("seedPotatoStock").textContent = stocks.seedPotato;
    document.getElementById("seedBarleyStock").textContent = stocks.seedBarley;
  } catch (err) {
    document.getElementById("pricePotato").textContent = "에러";
    document.getElementById("priceBarley").textContent = "에러";
    document.getElementById("seedPotatoStock").textContent = "에러";
    document.getElementById("seedBarleyStock").textContent = "에러";
  }
}

// 기존 fetchSeedStatus() 대신 fetchSeedInfo() 호출
window.onload = () => {
  fetchSeedInfo();
  fetchUserInfo();
};

    async function buySeed(seedType) {
      try {
        const res = await fetch(`${API_BASE}/api/seed/buy`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId, seedType })
        });
        const result = await res.json();
        if (result.success) {
          alert("구매 성공!");
          fetchSeedStatus();
          fetchUserInfo();
        } else {
          alert(result.message || "구매 실패");
        }
      } catch (err) {
        alert("서버 오류로 구매 실패");
      }
    }

    fetchSeedStatus();
    fetchUserInfo();
  </script>
</body>
</html>
