
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>씨감자 상점</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: 'Arial', sans-serif; background-color: #fff8dc; padding: 1rem; margin: 0; }
    h1 { text-align: center; color: #333333; }
    .status-box { margin: 1rem auto; padding: 1rem; border: 1px solid #ccc; max-width: 400px; background-color: #fff; border-radius: 12px; }
    .resource { margin: 0.5rem 0; }
    .buttons { text-align: center; margin-top: 1rem; }
    button { margin: 0.5rem; padding: 0.5rem 1rem; }
    .info-box { font-size: 1rem; color: #444; text-align: center; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>🛒 씨감자 상점</h1>
  <div id="nicknameBox" class="info-box">닉네임 불러오는 중...</div>
  <div id="farmNameBox" class="info-box">농장명 불러오는 중...</div>

  <div class="status-box">
    <div class="resource" id="token">🌕 토큰: 불러오는 중...</div>
    <div class="resource" id="seedPotato">🥔 씨감자: 불러오는 중...</div>

    <input type="number" id="buyAmount" placeholder="구매 수량 입력" min="1" style="width: 100%; padding: 0.5rem; margin-top: 1rem;" />
    <button onclick="buySeedPotato()">구매하기</button>
  </div>

  <div class="buttons">
    <button onclick="goToFarm()">🌱 농장 가기</button>
    <button onclick="goToStorage()">📦 저장소 가기</button>
    <button onclick="goToMarket()">📈 거래소 가기</button>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const nickname = localStorage.getItem("nickname");
    const kakaoId = localStorage.getItem("kakaoId");
    const tokenEl = document.getElementById("token");
    const seedPotatoEl = document.getElementById("seedPotato");
    const nicknameBox = document.getElementById("nicknameBox");
    const farmNameBox = document.getElementById("farmNameBox");

    if (!nickname) {
      alert("로그인 정보가 없습니다. 로그인 페이지로 이동합니다.");
      window.location.href = "orcax-farm_000.html";
    } else {
      nicknameBox.textContent = "🐳 닉네임: " + nickname;
      farmNameBox.textContent = "🌾 농장명: " + (localStorage.getItem("farmName") || "없음");
      loadUserData();
    }

    function loadUserData() {
      fetch(`${API_BASE}/api/userdata?nickname=${nickname}`)
        .then(res => res.json())
        .then(user => {
          tokenEl.textContent = "🌕 토큰: " + (user.token ?? 0);
          seedPotatoEl.textContent = "🥔 씨감자: " + (user.seedPotato ?? 0);
        })
        .catch(() => {
          tokenEl.textContent = "토큰: 불러오기 실패";
          seedPotatoEl.textContent = "씨감자: 불러오기 실패";
        });
    }

    function buySeedPotato() {
      const amount = parseInt(document.getElementById("buyAmount").value);
      if (!amount || amount < 1) return alert("구매 수량을 입력하세요");

      fetch(`${API_BASE}/api/buy-seed`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname, kakaoId, amount })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("씨감자 구매 완료!");
          loadUserData();
        } else {
          alert("구매 실패: " + (data.message || "오류"));
        }
      })
      .catch(() => alert("서버 오류로 구매 실패"));
    }

    function goToFarm() {
      location.href = "gamja-factory.html";
    }
    function goToStorage() {
      location.href = "gamja-result.html";
    }
    function goToMarket() {
      location.href = "gamja-market.html";
    }
  </script>
</body>
</html>
