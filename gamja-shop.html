<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 씨앗 상점</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: white;
    }
    main {
      background-color: rgba(0, 0, 0, 0.3);
      margin: 3rem auto;
      padding: 2rem;
      max-width: 480px;
      border-radius: 20px;
    }
    h1 { margin-bottom: 1rem; font-size: 2rem; }
    .info-block { margin: 1.5rem 0; font-size: 1.3rem; }
    .seed-section { margin: 2rem 0; padding: 1rem; background-color: rgba(255,255,255,0.1); border-radius: 10px; }
    button { background-color: #28a745; color: white; border: none; padding: 0.8rem 1.5rem; font-size: 1.2rem; cursor: pointer; border-radius: 8px; }
    button:hover { background-color: #218838; }
    nav { display: flex; justify-content: space-around; padding: 1rem; }
    nav a { color: #ffcc00; text-decoration: none; font-weight: bold; }
    .status { margin-top: 1.5rem; color: #00ff00; }
  </style>
</head>
<body>
  <main>
    <h1>🌱 OrcaX 씨앗 상점</h1>
    <div class="info-block">
      💰 보유 토큰: <span id="orcx">0</span> ORCX
    </div>
    <div class="info-block">
      🥔 씨감자 재고: <span id="leftPotato">-</span>개<br />
      🥔 씨감자 가격: <span id="pricePotato">-</span> ORCX<br /><br />
      🌾 씨보리 재고: <span id="leftBarley">-</span>개<br />
      🌾 씨보리 가격: <span id="priceBarley">-</span> ORCX
    </div>
    <div class="seed-section">
      <h2>🥔 씨감자</h2>
      <button onclick="buySeed('seedPotato')">구매하기</button>
    </div>
    <div class="seed-section">
      <h2>🌾 씨보리</h2>
      <button onclick="buySeed('seedBarley')">구매하기</button>
    </div>
    <nav>
      <a href="gamja-farm.html">감자 농장</a>
      <a href="admin-seeds.html">씨앗 관리소</a>
      <a href="gamja-result.html">개인 보관함</a>
    </nav>
    <div class="status" id="statusMsg">📡 서버 연결 확인 중...</div>
  </main>
  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";
    const kakaoId = localStorage.getItem("kakaoId") || "";
    if (!kakaoId) {
      alert("로그인이 필요합니다. 메인으로 이동합니다.");
      window.location.href = "index9.html";
    }

    // 토큰(ORCX)은 반드시 서버에서 user.wallet.orcx로!
    async function fetchUserToken() {
      try {
        const res = await fetch(`${API_BASE}/userdata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId })
        });
        const data = await res.json();
        const user = data.user;
        document.getElementById("orcx").innerText = user?.wallet?.orcx ?? 0;
      } catch (err) {
        document.getElementById("orcx").innerText = 0;
      }
    }

    // 씨앗 보관소 재고 및 가격 정보
    async function fetchSeedStatus() {
      try {
        const res = await fetch(`${API_BASE}/seed/status`);
        const data = await res.json();
        document.getElementById("leftPotato").innerText = data.seedPotato ?? "-";
        document.getElementById("pricePotato").innerText = data.pricePotato ?? "-";
        document.getElementById("leftBarley").innerText = data.seedBarley ?? "-";
        document.getElementById("priceBarley").innerText = data.priceBarley ?? "-";
        document.getElementById("statusMsg").innerText = data.success ? "✅ 서버 연결 성공" : "❌ 씨앗 정보 없음";
      } catch (err) {
        document.getElementById("statusMsg").innerText = "❌ 서버 연결 실패";
      }
    }

    async function buySeed(type) {
      try {
        const res = await fetch(`${API_BASE}/seed/buy`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId, seedType: type })
        });
        const data = await res.json();
        if (data.success) {
          alert(`${type === 'seedPotato' ? '씨감자' : '씨보리'} 구매 성공!`);
          fetchUserToken();
          fetchSeedStatus();
        } else {
          alert("구매 실패: " + (data.message || "서버 오류"));
        }
      } catch (err) {
        alert("오류 발생: " + err.message);
      }
    }

    // 페이지 로딩 시
    fetchUserToken();
    fetchSeedStatus();
  </script>
</body>
</html>
