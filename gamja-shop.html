<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>씨감자·씨보리 상점</title>
  <!-- 모든 리소스 및 페이지를 OrcaX 경로에서 로드 -->
  <base href="https://byungil-cho.github.io/OrcaX/" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Pretendard', sans-serif;
      background: url('farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: #333;
      text-align: center;
    }
    nav.nav-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      background: rgba(255,255,255,0.8);
      padding: 12px 0;
    }
    nav.nav-bar a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background .2s;
    }
    nav.nav-bar a:hover { background: rgba(0,0,0,0.1); }

    .power-status {
      margin: 0 auto;
      padding: 8px 0;
      background: rgba(255,255,255,0.6);
      font-size: 0.9rem;
    }
    .power-status.ok { color: green; }
    .power-status.err { color: red; }

    header {
      position: relative;
      padding: 16px;
      font-size: 1.5rem;
      font-weight: bold;
      background: rgba(255,255,255,0.8);
    }
    header .user-name {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
    }

    .status {
      padding: 12px;
      background: rgba(255,255,255,0.7);
      font-size: 1.1rem;
    }

    .shop-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 24px;
    }
    .item-card {
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 16px;
      width: 260px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .item-card h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }
    .item-card p {
      margin: 4px 0;
      flex-grow: 1;
    }
    .item-card button {
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s;
    }
    .item-card button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    .item-card button:hover:not(:disabled) {
      background: #45A049;
    }
    @media (max-width: 600px) {
      .shop-container { flex-direction: column; align-items: center; }
      .item-card { width: 90%; }
    }
  </style>
  <script>
    'use strict';
    const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io';
  </script>
</head>
<body>
  <nav class="nav-bar">
    <a href="gamja-farm.html">🏡 농장으로</a>
    <a href="gamja-factory.html">🏭 공장으로</a>
    <a href="gamja-shop.html">🛒 상점</a>
  </nav>
  <div id="powerStatus" class="power-status">⏳ 서버 상태 확인 중...</div>
  <header>
    씨감자·씨보리 상점
    <div id="userName" class="user-name">— 님</div>
  </header>
  <div class="status">
    보유 토큰: <span id="tokenCount">—</span> ORCX
  </div>
  <div class="shop-container">
    <div class="item-card">
      <h2>씨감자 구매</h2>
      <p>가격: 2 ORCX</p>
      <button id="buyPotato">구매하기</button>
      <p>보유 씨감자: <span id="potatoCount">—</span></p>
    </div>
    <div class="item-card">
      <h2>씨보리 구매</h2>
      <p>가격: 2 ORCX</p>
      <button id="buyBarley">구매하기</button>
      <p>보유 씨보리: <span id="barleyCount">—</span></p>
    </div>
  </div>
  <script type="module">
    const nickname = localStorage.getItem('nickname');
    if (!nickname) {
      alert('로그인이 필요합니다.');
      window.location.href = 'index9.html';
    }
    document.getElementById('userName').textContent = nickname + '님';

    const powerEl   = document.getElementById('powerStatus');
    const tokenEl   = document.getElementById('tokenCount');
    const potatoEl  = document.getElementById('potatoCount');
    const barleyEl  = document.getElementById('barleyCount');
    const btnPotato = document.getElementById('buyPotato');
    const btnBarley = document.getElementById('buyBarley');

    async function loadShopData() {
      try {
        const res1 = await fetch(`${API_BASE}/api/userdata?nickname=${encodeURIComponent(nickname)}`);
        if (res1.ok) {
          powerEl.textContent = '✅ 서버 연결 완료'; powerEl.classList.add('ok');
        } else throw new Error();
      } catch {
        powerEl.textContent = '❌ 서버 연결 실패'; powerEl.classList.add('err'); return;
      }
      try {
        const res2 = await fetch(`${API_BASE}/api/userdata?nickname=${encodeURIComponent(nickname)}`);
        const { users } = await res2.json(); const u = users[0];
        tokenEl.textContent  = u.orcx;
        potatoEl.textContent = u.seedPotato;
        barleyEl.textContent = u.seedBarley;
        btnPotato.disabled   = u.orcx < 2;
        btnBarley.disabled   = u.orcx < 2;
      } catch {
        alert('자산 정보를 불러오는 중 오류가 발생했습니다.');
      }
    }
    async function purchase(item) {
      const res = await fetch(`${API_BASE}/api/purchase?nickname=${encodeURIComponent(nickname)}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item })
      });
      if (!res.ok) return alert('구매 실패'); await loadShopData(); alert('구매 완료');
    }
    btnPotato.addEventListener('click', () => purchase('potato'));
    btnBarley.addEventListener('click', () => purchase('barley'));
    loadShopData();
  </script>
</body>
</html>
