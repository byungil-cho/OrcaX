<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>씨앗 구매소</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Gowun Dodum', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: white;
    }
    main {
      padding: 1rem;
    }
    .box {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 1rem;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      background-color: #4CAF50;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      margin: 0.5rem;
    }
    nav {
      margin-top: 1rem;
    }
    nav a {
      margin: 0 10px;
      color: orange;
      text-decoration: none;
      font-size: 1.1rem;
    }
    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #00ff99;
    }
  </style>
</head>
<body>
  <main class="box">
    <h2>🌱 씨앗 구매소</h2>
    <p>🧑 닉네임: <span id="nickname">불러오는 중...</span></p>
    <p>🥔 씨감자 남은 수량: <span id="potatoStock">불러오는 중...</span></p>
    <p>🌾 씨보리 남은 수량: <span id="barleyStock">불러오는 중...</span></p>
    <p>💰 씨감자 가격: <span id="potatoPrice">불러오기 실패 ORCX</span></p>
    <p>💰 씨보리 가격: <span id="barleyPrice">불러오기 실패 ORCX</span></p>
    <p>🍀 보유 토큰: <span id="orcxBalance">0</span></p>

    <nav>
      <a href="index9.html">🏠 메인으로</a>
      <a href="gamja-factory.html">🥔 감자 농장</a>
      <a href="admin-seeds.html">🌱 씨앗 관리소</a>
      <a href="auction-house.html">📁 개인 보관함</a>
    </nav>

    <h3>🥔 씨감자</h3>
    <p>내 보유: <span id="myPotatoSeed">0개</span></p>
    <button onclick="buySeed('seedPotato')">구매하기</button>

    <h3>🌾 씨보리</h3>
    <p>내 보유: <span id="myBarleySeed">0개</span></p>
    <button onclick="buySeed('seedBarley')">구매하기</button>

    <p id="status">✅ 서버 연결 성공</p>
  </main>

  <script>
    const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io/api';

    const nicknameSpan = document.getElementById("nickname");
    const orcxBalance = document.getElementById("orcxBalance");
    const potatoStock = document.getElementById("potatoStock");
    const barleyStock = document.getElementById("barleyStock");
    const potatoPrice = document.getElementById("potatoPrice");
    const barleyPrice = document.getElementById("barleyPrice");
    const myPotatoSeed = document.getElementById("myPotatoSeed");
    const myBarleySeed = document.getElementById("myBarleySeed");

    async function fetchUserData() {
      try {
        const res = await fetch(`${API_BASE}/user/data`);
        const data = await res.json();
        if (data.success) {
          nicknameSpan.textContent = data.nickname || '범고래X';
          orcxBalance.textContent = data.token || 0;
          myPotatoSeed.textContent = `${data.seed_potato || 0}개`;
          myBarleySeed.textContent = `${data.seed_barley || 0}개`;
        } else {
          nicknameSpan.textContent = "불러오기 실패";
        }
      } catch (err) {
        console.error('User fetch error:', err);
        nicknameSpan.textContent = "서버 오류";
      }
    }

    async function fetchSeedStatus() {
      try {
        const res = await fetch(`${API_BASE}/seed/status`);
        const data = await res.json();
        if (data.success) {
          potatoStock.textContent = data.seedPotato || 0;
          barleyStock.textContent = data.seedBarley || 0;
        }
      } catch (err) {
        console.error('Seed status error:', err);
        potatoStock.textContent = "오류";
        barleyStock.textContent = "오류";
      }
    }

    async function fetchSeedPrices() {
      try {
        const res = await fetch(`${API_BASE}/seed/price`);
        const data = await res.json();
        if (data.success) {
          potatoPrice.textContent = `${data.seedPotatoPrice} ORCX`;
          barleyPrice.textContent = `${data.seedBarleyPrice} ORCX`;
        }
      } catch (err) {
        console.error('Seed price error:', err);
        potatoPrice.textContent = "불러오기 실패 ORCX";
        barleyPrice.textContent = "불러오기 실패 ORCX";
      }
    }

    async function buySeed(type) {
      try {
        const res = await fetch(`${API_BASE}/seed/buy`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type })
        });
        const result = await res.json();
        alert(result.message);
        fetchUserData();
        fetchSeedStatus();
      } catch (err) {
        console.error('구매 실패:', err);
        alert("서버 오류로 구매 실패!");
      }
    }

    // 최초 실행
    fetchUserData();
    fetchSeedStatus();
    fetchSeedPrices();
  </script>
</body>
</html>
