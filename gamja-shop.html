<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 씨앗 상점</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css?family=Do+Hyeon&display=swap');
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
      min-height: 100vh;
    }
    main {
      background: rgba(0,0,0,0.36);
      margin: 40px auto 0;
      border-radius: 28px;
      max-width: 560px;
      padding: 38px 20px 32px 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.22);
    }
    h1 {
      margin: 0 0 28px 0;
      font-size: 2.4rem;
      font-weight: bold;
      text-shadow: 2px 3px 16px #000a;
    }
    .token { color: #ffc107; font-size: 1.22rem; }
    .seed-row { margin: 17px 0 0 0; font-size: 1.15rem; text-align:left; }
    .section {
      margin: 38px 0 0 0;
      padding-bottom: 10px;
    }
    .buy-btn {
      display: block;
      width: 90%;
      margin: 15px auto 0;
      background: #26C281;
      color: #fff;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      padding: 15px 0;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: 0 2px 8px #2225;
      transition: 0.13s;
    }
    .buy-btn:hover { background: #20aa69; }
    nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 0.6rem 0 0.3rem 0;
      background: rgba(0,0,0,0.67);
      font-size: 1.13rem;
      z-index: 10;
    }
    nav a {
      color: #ffc107;
      margin: 0 28px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.18s;
    }
    nav a:hover { color: #fffad0; }
    @media (max-width:700px){
      main { max-width:98vw; padding: 13px 2vw 15px 2vw; }
      h1 { font-size: 1.55rem; }
      .seed-row { font-size: 1.01rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>🌱 OrcaX 씨앗 상점</h1>
    <div class="token">
      🪙 보유 토큰 : <span id="orcx">0</span> ORCX
    </div>
    <div class="seed-row" style="margin-top:19px;">
      🥔 씨감자 재고: <span id="stockPotato">0</span>개<br>
      🥔 씨감자 가격: <span id="pricePotato">0</span> ORCX
    </div>
    <div class="seed-row">
      🌾 씨보리 재고: <span id="stockBarley">0</span>개<br>
      🌾 씨보리 가격: <span id="priceBarley">0</span> ORCX
    </div>

    <div class="section">
      <strong style="font-size:1.18rem;">🥔 씨감자 구매</strong><br>
      내 보유: <span id="myPotato">0</span>개
      <button class="buy-btn" id="buyPotatoBtn">씨감자 구매</button>
    </div>
    <div class="section">
      <strong style="font-size:1.18rem;">🌾 씨보리 구매</strong><br>
      내 보유: <span id="myBarley">0</span>개
      <button class="buy-btn" id="buyBarleyBtn">씨보리 구매</button>
    </div>
  </main>
  <nav>
    <a href="gamja-farm.html">감자 농장</a>
    <a href="gamja-shop.html">씨앗 관리소</a>
    <a href="gamja-factory.html">개인 보관함</a>
  </nav>
  <script>
    // 1. 내 토큰 잔액만 /api/userdata 에서 POST로 별도 요청
    function loadOrcx() {
      const kakaoId = localStorage.getItem('kakaoId');
      if (!kakaoId) { document.getElementById("orcx").textContent = "0"; return; }
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kakaoId })
      })
      .then(res => res.json())
      .then(user => {
        let orcx = 0;
        if (user.wallet && user.wallet.orcx !== undefined) orcx = user.wallet.orcx;
        else if (user.orcx !== undefined) orcx = user.orcx;
        document.getElementById("orcx").textContent = orcx || "0";
      })
      .catch(()=>{ document.getElementById("orcx").textContent = "0"; });
    }

    // 2. 씨앗 재고/내보유/가격
    function loadSeedStatus() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/seed/status")
      .then(res => res.json())
      .then(data => {
        document.getElementById("stockPotato").textContent = data.gamja?.stock ?? "0";
        document.getElementById("stockBarley").textContent = data.bori?.stock ?? "0";
        document.getElementById("myPotato").textContent = data.user?.seedPotato ?? "0";
        document.getElementById("myBarley").textContent = data.user?.seedBarley ?? "0";
      }).catch(()=>{
        document.getElementById("stockPotato").textContent = "0";
        document.getElementById("stockBarley").textContent = "0";
        document.getElementById("myPotato").textContent = "0";
        document.getElementById("myBarley").textContent = "0";
      });
    }
    function loadSeedPrice() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/seed/price")
      .then(res => res.json())
      .then(data => {
        document.getElementById("pricePotato").textContent = data.potato ?? "0";
        document.getElementById("priceBarley").textContent = data.barley ?? "0";
      }).catch(()=>{
        document.getElementById("pricePotato").textContent = "0";
        document.getElementById("priceBarley").textContent = "0";
      });
    }

    // 3. 씨앗 구매 버튼(예시)
    document.addEventListener('DOMContentLoaded', () => {
      loadOrcx();
      loadSeedStatus();
      loadSeedPrice();

      document.getElementById("buyPotatoBtn").onclick = () => {
        alert("구매 연동 필요(서버에 POST)!");
      };
      document.getElementById("buyBarleyBtn").onclick = () => {
        alert("구매 연동 필요(서버에 POST)!");
      };
    });
  </script>
</body>
</html>
