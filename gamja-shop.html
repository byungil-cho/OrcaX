<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>씨감자·씨보리 상점</title>
  <style>
    /* 페이지 전체 배경 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Pretendard', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: #333;
    }

    /* 네비게이션 바 */
    nav.nav-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      background: rgba(255,255,255,0.8);
      padding: 12px 0;
    }
    nav.nav-bar a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background .2s;
    }
    nav.nav-bar a:hover {
      background: rgba(0,0,0,0.1);
    }

    /* 전원 상태 표시 */
    .power-status {
      text-align: center;
      padding: 8px 0;
      background: rgba(255,255,255,0.6);
      font-size: 0.9rem;
    }
    .power-status span.ok  { color: green; }
    .power-status span.err { color: red; }

    /* 헤더 */
    header {
      position: relative;
      text-align: center;
      padding: 16px;
      font-size: 1.5rem;
      font-weight: bold;
      background: rgba(255,255,255,0.8);
    }
    header .user-name {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
    }

    /* 자산 상태 */
    .status {
      text-align: center;
      padding: 12px;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.7);
    }

    /* 상점 카드 레이아웃 */
    .shop-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 24px;
    }
    .item-card {
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 16px;
      width: 260px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .item-card h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }
    .item-card p {
      margin: 4px 0;
      flex-grow: 1;
    }
    .item-card button {
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s;
    }
    .item-card button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    .item-card button:hover:not(:disabled) {
      background: #45A049;
    }

    /* 반응형 */
    @media (max-width: 600px) {
      .shop-container {
        flex-direction: column;
        align-items: center;
      }
      .item-card {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <!-- 필요하다면 절대경로로 변경 -->
    <a href="https://byungil-cho.github.io/OrcaX/gamja-farm.html">🏡 농장으로</a>
    <a href="https://byungil-cho.github.io/OrcaX/gamja-factory.html">🏭 공장으로</a>
    <a href="https://byungil-cho.github.io/OrcaX/gamja-shop.html">🛒 상점</a>
  </nav>

  <div class="power-status">
    전원 상태: <span id="powerStatus">—</span>
  </div>

  <header>
    씨감자·씨보리 상점
    <div class="user-name" id="userName">— 님</div>
  </header>

  <div class="status">
    보유 토큰: <span id="tokenCount">—</span> ORCX
  </div>

  <div class="shop-container">
    <!-- 카드들 생략 -->
  </div>

  <script>
    const BASE_URL = 'https://climbing-wholly-grouper.jp.ngrok.io';
    const nickname = localStorage.getItem('nickname');
    if (!nickname) {
      alert('로그인이 필요합니다.');
      return location.href = 'https://byungil-cho.github.io/OrcaX/index9.html';
    }
    document.getElementById('userName').textContent = `${nickname}님`;

    const powerEl   = document.getElementById('powerStatus');
    const tokenEl   = document.getElementById('tokenCount');
    const potatoEl  = document.getElementById('potatoCount');
    const barleyEl  = document.getElementById('barleyCount');
    const btnPotato = document.getElementById('buyPotato');
    const btnBarley = document.getElementById('buyBarley');

    async function checkPower() {
      try {
        const res = await fetch(`${BASE_URL}/api/userdata?nickname=${encodeURIComponent(nickname)}`);
        powerEl.textContent = res.ok ? '정상' : '오류';
        powerEl.className   = res.ok ? 'ok' : 'err';
      } catch {
        powerEl.textContent = '오류';
        powerEl.className   = 'err';
      }
    }

    async function loadAssets() {
      try {
        const res = await fetch(`${BASE_URL}/api/userdata?nickname=${encodeURIComponent(nickname)}`);
        if (!res.ok) throw new Error();
        const { users } = await res.json();
        const me = users[0];
        tokenEl.textContent  = me.orcx;
        potatoEl.textContent = me.seedPotato;
        barleyEl.textContent = me.seedBarley;
        btnPotato.disabled   = me.orcx < 2;
        btnBarley.disabled   = me.orcx < 2;
      } catch {
        alert('자산 정보를 불러오는 중 오류가 발생했습니다.');
      }
    }

    async function purchase(item) {
      try {
        const res = await fetch(
          `${BASE_URL}/api/purchase?nickname=${encodeURIComponent(nickname)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item })
          }
        );
        if (!res.ok) return alert('구매 실패');
        const { users } = await res.json();
        const me = users[0];
        tokenEl.textContent  = me.orcx;
        potatoEl.textContent = me.seedPotato;
        barleyEl.textContent = me.seedBarley;
        btnPotato.disabled   = me.orcx < 2;
        btnBarley.disabled   = me.orcx < 2;
        alert('구매가 완료되었습니다.');
      } catch {
        alert('구매 중 오류가 발생했습니다.');
      }
    }

    btnPotato .addEventListener('click', () => purchase('potato'));
    btnBarley.addEventListener('click', () => purchase('barley'));

    // 초기화
    checkPower();
    loadAssets();
  </script>
</body>
</html>
