<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>씨감자씨보리 구매소</title>
  <style>
    body {
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 1rem;
    }
    .box {
      background: rgba(0,0,0,0.6);
      padding: 1rem 2rem;
      border-radius: 12px;
      max-width: 800px;
      margin: auto;
    }
    h2 { text-align: center; }
    label, select, button {
      display: block;
      margin: 1rem auto;
      font-size: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background-color: #4CAF50;
      border: none;
      color: white;
      cursor: pointer;
    }
    .status {
      background: rgba(255,255,255,0.8);
      color: black;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .links {
      text-align: center;
      margin-top: 2rem;
    }
    .links a {
      color: #00e6e6;
      margin: 0 1rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>🌾 씨감자씨보리 구매소</h2>
    <div class="status">
      <p>👤 닉네임: <span id="nickname">-</span></p>
      <p>🏠 농장이름: <span id="farmName">-</span></p>
      <p>⚡ 전원 상태: <span id="serverStatus">확인중...</span></p>
      <p>💰 토큰: <span id="tokens">0</span></p>
      <p>🥔 씨감자: <span id="potatoSeeds">0</span> / 🌾 씨보리: <span id="barleySeeds">0</span></p>
    </div>

    <label for="item">구매 항목 선택:</label>
    <select id="item">
      <option value="씨감자">🥔 씨감자 (2 ORCX)</option>
      <option value="씨보리">🌾 씨보리 (2 ORCX)</option>
    </select>
    <button onclick="buySeed()">구매하기</button>
    <p id="message"></p>

    <div class="links">
      <a href="gamja-farm.html">🌱 농장으로</a>
      <a href="gamja-exchange.html">🔁 자재 교환소</a>
      <a href="index9.html">🏠 메인페이지로</a>
    </div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";
    const SEED_PRICE = 2;

    async function loadUserData() {
      const nickname = localStorage.getItem("nickname") || "-";
      const farmName = localStorage.getItem("farmName") || "-";
      document.getElementById("nickname").textContent = nickname;
      document.getElementById("farmName").textContent = farmName;

      try {
        const res = await fetch(`${API_BASE}/api/userdata?nickname=${nickname}`);
        const data = await res.json();
        const user = data.users[0];
        document.getElementById("tokens").textContent = user.orcx || 0;
      } catch (err) {
        console.error("ORCX 불러오기 실패", err);
      }

      document.getElementById("potatoSeeds").textContent = localStorage.getItem("씨감자") || 0;
      document.getElementById("barleySeeds").textContent = localStorage.getItem("씨보리") || 0;
    }

    function checkServer() {
      fetch(API_BASE + "/")
        .then(() => {
          document.getElementById("serverStatus").textContent = "🟢 연결되었음";
        })
        .catch(() => {
          document.getElementById("serverStatus").textContent = "🔴 서버 꺼짐";
        });
    }

    async function buySeed() {
      const item = document.getElementById("item").value;
      const tokenName = item === "씨감자" ? "씨감자" : "씨보리";
      const nickname = localStorage.getItem("nickname") || "-";

      // 서버에서 토큰 다시 확인
      let tokens = 0;
      try {
        const res = await fetch(`${API_BASE}/api/userdata?nickname=${nickname}`);
        const data = await res.json();
        tokens = data.users[0].orcx || 0;
      } catch (err) {
        document.getElementById("message").textContent = "❌ 토큰 조회 실패";
        return;
      }

      if (tokens < SEED_PRICE) {
        document.getElementById("message").textContent = "❌ 토큰이 부족합니다.";
        return;
      }

      let current = parseInt(localStorage.getItem(tokenName) || 0);
      if (current >= 2) {
        document.getElementById("message").textContent = `${tokenName}는 최대 2개까지만 보유할 수 있습니다.`;
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/use-token`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, amount: SEED_PRICE })
        });

        const result = await res.json();
        if (!result.success) {
          document.getElementById("message").textContent = "❌ 토큰 차감 실패";
          return;
        }

        localStorage.setItem(tokenName, current + 1);
        document.getElementById("message").textContent = `${tokenName} 1개 구매 완료!`;
        loadUserData();
      } catch (err) {
        console.error("구매 실패", err);
        document.getElementById("message").textContent = "❌ 서버 오류 발생";
      }
    }

    loadUserData();
    checkServer();
  </script>
<script>

document.addEventListener("DOMContentLoaded", function () {
    const nickname = localStorage.getItem("nickname") || "익명";
    const token = parseInt(localStorage.getItem("token") || "0");
    const seedPotato = parseInt(localStorage.getItem("seedPotato") || "0");
    const seedBarley = parseInt(localStorage.getItem("seedBarley") || "0");

    document.getElementById("nickname").textContent = nickname;
    document.getElementById("token").textContent = token;
    document.getElementById("seedPotato").textContent = seedPotato;
    document.getElementById("seedBarley").textContent = seedBarley;

    const select = document.getElementById("item-select");
    const buyBtn = document.getElementById("buy-button");
    const message = document.getElementById("message");

    buyBtn.addEventListener("click", () => {
        const selected = select.value;

        let userToken = parseInt(localStorage.getItem("token") || "0");
        if (userToken < 2) {
            message.textContent = "토큰이 부족합니다!";
            return;
        }

        localStorage.setItem("token", userToken - 2);

        if (selected === "씨감자") {
            const current = parseInt(localStorage.getItem("seedPotato") || "0");
            localStorage.setItem("seedPotato", current + 1);
        } else if (selected === "씨보리") {
            const current = parseInt(localStorage.getItem("seedBarley") || "0");
            localStorage.setItem("seedBarley", current + 1);
        }

        message.textContent = `${selected} 구매 완료!`;
        window.location.reload();
    });
});

</script>
</body>
</html>
