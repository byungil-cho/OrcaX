
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>씨감자 상점</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #fef9e8;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #504030;
      margin: 1rem 0 0.5rem;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem 0.5rem 0;
      color: #503020;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
    }
    .status-box {
      background: #fff;
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 1rem;
      width: 90%;
      max-width: 400px;
    }
    .item {
      margin-bottom: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      margin: 0.25rem;
    }
    button:disabled {
      background: #bbb;
      cursor: not-allowed;
    }
    button:hover:enabled {
      background: #45a049;
    }
    .nav-buttons {
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div id="nicknameBox"></div>
  <h1>🛒 씨감자 상점</h1>

  <div id="container">
    <div class="status-box">
      ⚡ 서버 상태: <span id="serverStatus">확인 중...</span><br/>
      💰 보유 토큰: <span id="tokenBalance">-</span> ORCAX
    </div>

    <div class="status-box item">
      <h2>씨감자 구매</h2>
      <input type="number" id="quantityInput" min="1" value="1" style="width:60px; text-align:center;">
      <button id="buyButton" onclick="buySeed()">구매</button>
    </div>

    <div class="nav-buttons">
      <button onclick="location.href='gamja-factory.html'">🌱 농장으로 가기</button>
      <button onclick="location.href='gamja-result.html'">📦 내 저장소 보기</button>
      <button onclick="location.href='auction-house.html'">📊 거래소 보기</button>
    </div>
  </div>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

    document.addEventListener("DOMContentLoaded", function () {
      const kakaoId = localStorage.getItem("kakaoId");
      const nickname = localStorage.getItem("nickname") || "사용자";
      const buyButton = document.getElementById("buyButton");

      document.getElementById("nicknameBox").textContent = nickname;

      if (!kakaoId || kakaoId === "익명") {
        document.getElementById("tokenBalance").textContent = "로그인 정보 없음";
        buyButton.disabled = true;
        return;
      }

      checkServerStatus();
      fetchToken();
      setInterval(checkServerStatus, 60000);
      setInterval(fetchToken, 60000);

      window.buySeed = async function () {
        const quantity = parseInt(document.getElementById("quantityInput").value);
        if (isNaN(quantity) || quantity < 1) {
          alert("구매 수량을 1 이상으로 입력해주세요.");
          return;
        }

        try {
          const tokenRes = await fetch(`${API_BASE}/api/user/token/${kakaoId}`);
          const tokenData = await tokenRes.json();
          const token = tokenData.token || 0;
          console.log("[🔍 구매용 토큰 응답]", tokenData);

          let ratio = 0.05;
          if (token >= 10000) ratio = 0.10;
          else if (token <= 100) ratio = 0.01;

          const unitPrice = Math.ceil(token * ratio / quantity);
          const totalCost = unitPrice * quantity;

          const res = await fetch(`${API_BASE}/api/shop/buy`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ kakaoId, quantity, price: unitPrice })
          });

          const result = await res.json();
          if (result.success) {
            alert(`구매 성공! 씨감자 ${quantity}개, 개당 ${unitPrice} ORCAX`);
            fetchToken();
          } else {
            alert(result.message || "구매 실패");
          }
        } catch (e) {
          console.error("구매 실패:", e);
          alert("에러 발생");
        }
      };

      async function checkServerStatus() {
        try {
          const res = await fetch(`${API_BASE}/`);
          if (res.ok) {
            document.getElementById("serverStatus").textContent = "✅ 전기 공급 중";
          } else {
            document.getElementById("serverStatus").textContent = "❌ 서버 응답 없음";
          }
        } catch (err) {
          document.getElementById("serverStatus").textContent = "❌ 연결 실패";
        }
      }

      async function fetchToken() {
        try {
          const res = await fetch(`${API_BASE}/api/user/token/${kakaoId}`);
          const data = await res.json();
          console.log("[🔍 토큰 응답]", data);
          document.getElementById("tokenBalance").textContent = data.token || 0;
        } catch (e) {
          console.error("❌ 토큰 불러오기 실패:", e);
          document.getElementById("tokenBalance").textContent = "불러오기 실패";
        }
      }
    });
  </script>
</body>
</html>
