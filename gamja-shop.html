<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 씨앗 상점</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      color: #fff;
    }
    .container {
      background: rgba(30,30,30,0.57);
      border-radius: 32px;
      box-shadow: 0 8px 32px #0005;
      max-width: 530px;
      margin: 44px auto 18px auto;
      padding: 2.1rem 1.6rem 1.7rem 1.6rem;
      text-align: center;
    }
    .shop-title {
      font-size: 2.2rem;
      margin-bottom: 1.4rem;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .token-label {
      font-size: 1.13rem;
      margin-bottom: 1.5rem;
      display: block;
      text-align: left;
      color: #ffdf6d;
      font-weight: 700;
      margin-left: 0.3rem;
    }
    .shop-info {
      margin-bottom: 1.3rem;
      font-size: 1.1rem;
      text-align: left;
    }
    .seed-box {
      margin: 2.2rem 0 1.2rem 0;
      background: rgba(45,45,45,0.3);
      border-radius: 20px;
      padding: 1.2rem 0.4rem 0.9rem 0.4rem;
    }
    .seed-box h2 {
      margin-bottom: 0.6rem;
      font-size: 1.55rem;
      color: #fff;
      letter-spacing: 1px;
    }
    .my-seed {
      margin-bottom: 1rem;
      font-size: 1.13rem;
    }
    .btn-buy {
      background: #22c97d;
      color: #fff;
      padding: 0.8rem 2.6rem;
      font-size: 1.15rem;
      border: none;
      border-radius: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 0.5rem;
      transition: background 0.2s;
    }
    .btn-buy:hover { background: #15924d; }
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(20,20,20,0.97);
      padding: 1rem 0 0.8rem 0;
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      font-size: 1.12rem;
      letter-spacing: 1px;
      z-index: 100;
    }
    nav a { color: #ffd800; text-decoration: none; }
    nav a:visited { color: #ffd800; }
    @media (max-width: 600px) {
      .container { padding: 1.1rem 0.3rem 1.2rem 0.3rem; }
      nav { font-size: 1.02rem; gap: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shop-title">🌱 OrcaX 씨앗 상점</div>
    <span class="token-label">🪙 보유 토큰 : <span id="orcx">-</span> ORCX</span>
    <div class="shop-info">
      🥔 씨감자 재고: <span id="potato-stock">-</span>개<br>
      🥔 씨감자 가격: <span id="potato-price">-</span> ORCX<br><br>
      🌾 씨보리 재고: <span id="barley-stock">-</span>개<br>
      🌾 씨보리 가격: <span id="barley-price">-</span> ORCX
    </div>
    <div class="seed-box">
      <h2>🥔 씨감자 구매</h2>
      <div class="my-seed">내 보유: <span id="myPotato">-</span>개</div>
      <button class="btn-buy" onclick="buySeed('potato')">씨감자 구매</button>
    </div>
    <div class="seed-box">
      <h2>🌾 씨보리 구매</h2>
      <div class="my-seed">내 보유: <span id="myBarley">-</span>개</div>
      <button class="btn-buy" onclick="buySeed('barley')">씨보리 구매</button>
    </div>
  </div>
  <nav>
    <a href="gamja-farm.html">감자 농장</a>
    <a href="gamja-shop.html">씨앗 관리소</a>
    <a href="gamja-storage.html">개인 보관함</a>
  </nav>
  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";
    const kakaoId = localStorage.getItem("kakaoId") || "";
    if (!kakaoId) {
      alert("로그인이 필요합니다. 메인으로 이동합니다.");
      window.location.href = "index9.html";
    }

    // 모든 정보 한 번에 불러오기 (실전 안전버전)
    async function fetchAll() {
      try {
        // 1. 내 정보 (토큰/씨앗)
        const res1 = await fetch(`${API_BASE}/user/v2data`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId })
        });
        const data1 = await res1.json();
        const user = data1.user || data1;
        let orcx = 0;
        if (user.wallet && typeof user.wallet.orcx !== "undefined") {
          orcx = user.wallet.orcx;
        } else if (typeof user.orcx !== "undefined") {
          orcx = user.orcx;
        } else if (typeof user.token !== "undefined") {
          orcx = user.token;
        }
        document.getElementById("orcx").textContent = orcx;

        // 내 씨앗
        document.getElementById("myPotato").textContent =
          user.inventory?.seedPotato ?? 0;
        document.getElementById("myBarley").textContent =
          user.inventory?.seedBarley ?? 0;

        // 2. 씨앗 보관소 재고
        const res2 = await fetch(`${API_BASE}/seed/status`);
        const d = await res2.json();
        document.getElementById("potato-stock").textContent = d.seedPotato ?? 0;
        document.getElementById("barley-stock").textContent = d.seedBarley ?? 0;

        // 3. 씨앗 가격
        const res3 = await fetch(`${API_BASE}/seed/price`);
        const price = await res3.json();
        document.getElementById("potato-price").textContent = price.seedPotatoPrice ?? 0;
        document.getElementById("barley-price").textContent = price.seedBarleyPrice ?? 0;
      } catch (err) {
        document.getElementById("orcx").textContent = 0;
        document.getElementById("myPotato").textContent = 0;
        document.getElementById("myBarley").textContent = 0;
        document.getElementById("potato-stock").textContent = 0;
        document.getElementById("barley-stock").textContent = 0;
        document.getElementById("potato-price").textContent = 0;
        document.getElementById("barley-price").textContent = 0;
      }
    }

    // 씨앗 구매 (예시, 실제 서버 구매 API 맞춰 수정 필요)
    async function buySeed(type) {
      alert(`${type === 'potato' ? '씨감자' : '씨보리'} 구매 기능은 서버 연동 후 사용 가능합니다.`);
    }

    fetchAll();
  </script>
</body>
</html>
