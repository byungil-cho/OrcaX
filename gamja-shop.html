<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>씨앗 구매소</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }
    main {
      background-color: rgba(0, 0, 0, 0.3);
      margin: 1rem auto;
      padding: 1rem;
      border-radius: 20px;
      max-width: 480px;
    }
    button {
      font-size: 1.2rem;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
    .btn-green { background-color: #00e0a0; color: black; }
    .btn-yellow { background-color: #ffe100; color: black; }
    nav a {
      margin: 0 0.5rem;
      text-decoration: none;
      color: #ffcc00;
      font-weight: bold;
    }
    #adminButton {
      margin-top: 1.2rem;
      background-color: #ff5555;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h2>🌱 씨앗 구매소</h2>
    <p>👤 닉네임: <span id="nickname">불러오는 중...</span></p>
    <p>🥔 씨감자 남은 수량: <span id="seedPotato">로딩중...</span></p>
    <p>🌾 씨보리 남은 수량: <span id="seedBarley">로딩중...</span></p>
    <p>💰 씨감자 가격: <span id="Potato">-</span> ORCX</p>
    <p>💰 씨보리 가격: <span id="seedBarleyPrice">-</span> ORCX</p>
    <p>🍀 보유 토큰: <span id="orcx">-</span></p>

    <nav>
      <a href="index9.html">🏠 메인</a>
      <a href="gamja-factory.html">🥔 감자 농장</a>
      <a href="gamja-result.html">🌱 감자 가공공장</a>
      <a href="admin-users.html">📋 씨앗 관리소</a>
    </nav>

    <h3>🥔 씨감자</h3>
    <p>내 보유: <span id="mySeedPotato">0개</span></p>
    <button class="btn-green">구매하기</button>

    <h3>🌾 씨보리</h3>
    <p>내 보유: <span id="mySeedBarley">0개</span></p>
    <button class="btn-yellow">구매하기</button>

    <button id="adminButton">⚙️ 씨앗 관리소 이동</button>

    <p style="color: lightgreen;">✅ 서버 연결 성공</p>
  </main>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";

    async function fetchSeedPrices() {
      try {
        const res = await fetch(`${API_BASE}/seed/price`, { cache: "no-store" });
        const data = await res.json();
        document.getElementById("seedPotatoPrice").innerText = data.seedPotato ?? "-";
        document.getElementById("seedBarleyPrice").innerText = data.seedBarley ?? "-";
      } catch (e) {
        console.error("가격 불러오기 실패", e);
      }
    }

    async function fetchSeedStatus() {
      try {
        const res = await fetch(`${API_BASE}/seed/status`, { cache: "no-store" });
        const data = await res.json();
        document.getElementById("stockPotato").innerText = data.seedPotato ?? "-";
        document.getElementById("stockBarley").innerText = data.seedBarley ?? "-";
      } catch (e) {
        console.error("재고 불러오기 실패", e);
      }
    }

    async function fetchUserInfo() {
      try {
        const res = await fetch(`${API_BASE}/userdata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId: "4235108081" })  // 실제 사용자 ID
        });
        const data = await res.json();
        const user = data.users?.[0];

        if (!user) {
          throw new Error("사용자 없음");
        }

        document.getElementById("nickname").innerText = user.별명 || "닉네임 없음";
        document.getElementById("orcxToken").innerText = user.오크 ?? "0";
        document.getElementById("mySeedPotato").innerText = (user.씨앗감자 || 0) + "개";
        document.getElementById("mySeedBarley").innerText = (user.씨앗보리 || 0) + "개";
      } catch (e) {
        console.error("유저 정보 불러오기 실패", e);
      }
    }

    document.getElementById("adminButton").addEventListener("click", () => {
      const pass = prompt("관리자 비밀번호를 입력하세요:");
      if (pass === "7788") {
        window.location.href = "admin-seeds.html";
      } else {
        alert("비밀번호가 틀렸습니다.");
      }
    });

    fetchSeedPrices();
    fetchSeedStatus();
    fetchUserInfo();
  </script>
</body>
</html>
