<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 씨앗 상점</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css?family=Do+Hyeon&display=swap');
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
      min-height: 100vh;
    }
    main {
      background: rgba(0,0,0,0.35);
      margin: 40px auto 0;
      border-radius: 28px;
      max-width: 530px;
      padding: 36px 20px 30px 20px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.2);
    }
    .section {
      margin-bottom: 28px;
      font-size: 1.18rem;
      text-align: left;
    }
    .section strong { font-size: 1.25rem; }
    h1 {
      margin: 0 0 26px 0;
      font-size: 2.3rem;
      letter-spacing: -2px;
      font-weight: bold;
      text-shadow: 2px 3px 16px #000b;
    }
    .em { font-weight:bold; font-size:1.15em; }
    .token { color: #ffc107; }
    .seed-row { margin: 16px 0 0 0; font-size: 1.13rem; }
    .buy-btn {
      display: inline-block;
      background: #26C281;
      color: #fff;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      padding: 13px 36px;
      font-size: 1.2rem;
      margin: 15px 0 0 0;
      cursor: pointer;
      box-shadow: 0 2px 8px #2225;
      transition: 0.14s;
    }
    .buy-btn:hover { background: #22a56b; }
    nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 0.6rem 0 0.3rem 0;
      background: rgba(0,0,0,0.65);
      font-size: 1.16rem;
      letter-spacing:0.04em;
      z-index: 999;
    }
    nav a {
      color: #ffc107;
      margin: 0 26px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }
    nav a:hover { color: #fffad0; }
    @media (max-width:700px){
      main { max-width:98vw; padding: 15px 2vw 20px 2vw; }
      h1 { font-size: 1.6rem; }
      .section, .seed-row { font-size: 1.02rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>🌱 OrcaX 씨앗 상점</h1>
    <div class="section">
      <span class="token">🪙 보유 토큰 : <span id="orcx">-</span> ORCX</span>
      <div class="seed-row">
        🥔 씨감자 재고: <span id="stockPotato">-</span>개<br>
        🥔 씨감자 가격: <span id="pricePotato">-</span> ORCX
      </div>
      <div class="seed-row">
        🌾 씨보리 재고: <span id="stockBarley">-</span>개<br>
        🌾 씨보리 가격: <span id="priceBarley">-</span> ORCX
      </div>
    </div>

    <div class="section" style="margin-top:36px;">
      <strong>🥔 씨감자 구매</strong><br>
      내 보유: <span id="myPotato">0</span>개<br>
      <button class="buy-btn" id="buyPotatoBtn">씨감자 구매</button>
    </div>
    <div class="section">
      <strong>🌾 씨보리 구매</strong><br>
      내 보유: <span id="myBarley">0</span>개<br>
      <button class="buy-btn" id="buyBarleyBtn">씨보리 구매</button>
    </div>
  </main>
  <nav>
    <a href="gamja-farm.html">감자 농장</a>
    <a href="gamja-shop.html">씨앗 관리소</a>
    <a href="gamja-factory.html">개인 보관함</a>
  </nav>
  <script>
    // 1. 내 토큰 잔액만 /api/userdata 에서 별도 요청
    function loadOrcx() {
      const kakaoId = localStorage.getItem('kakaoId');
      if (!kakaoId) return;
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kakaoId })
      })
      .then(res => res.json())
      .then(user => {
        // user.wallet.orcx 또는 user.orcx
        document.getElementById("orcx").textContent =
          (user.wallet && user.wallet.orcx !== undefined) ? user.wallet.orcx : (user.orcx || 0);
      })
      .catch(()=>{ document.getElementById("orcx").textContent = "0"; });
    }

    // 2. 씨앗 재고/가격은 기존대로
    function loadSeedStatus() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/seed/status")
      .then(res => res.json())
      .then(data => {
        document.getElementById("stockPotato").textContent = data.gamja?.stock ?? "-";
        document.getElementById("stockBarley").textContent = data.bori?.stock ?? "-";
        document.getElementById("myPotato").textContent = data.user?.seedPotato ?? "0";
        document.getElementById("myBarley").textContent = data.user?.seedBarley ?? "0";
      });
    }
    function loadSeedPrice() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/seed/price")
      .then(res => res.json())
      .then(data => {
        document.getElementById("pricePotato").textContent = data.potato ?? "-";
        document.getElementById("priceBarley").textContent = data.barley ?? "-";
      });
    }

    // 3. 씨앗 구매 버튼 예시 (API 연동 필요)
    document.addEventListener('DOMContentLoaded', () => {
      loadOrcx();
      loadSeedStatus();
      loadSeedPrice();

      // 씨감자 구매 (예시)
      document.getElementById("buyPotatoBtn").onclick = () => {
        alert("구매 로직 연동 필요 (서버에 POST)");
      };
      // 씨보리 구매 (예시)
      document.getElementById("buyBarleyBtn").onclick = () => {
        alert("구매 로직 연동 필요 (서버에 POST)");
      };
    });
  </script>
</body>
</html>
