<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>씨앗 상점</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: #fff;
    }
    main {
      padding: 1rem;
      min-height: 100vh;
    }
    header {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 1rem;
      border-radius: 0 0 10px 10px;
      color: #fff;
    }
    nav a {
      color: #ffdf6c;
      text-decoration: none;
      margin: 0 0.5rem;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .store-buttons {
      margin-top: 2rem;
    }
    h2 {
      color: #ffffff;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
      font-size: 1.8rem;
    }
    p {
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
      font-size: 1.2rem;
    }
    button {
      font-size: 1.2rem;
      padding: 0.5rem 1rem;
      margin: 0.5rem;
      border-radius: 10px;
      border: none;
      background-color: #6cbb3c;
      color: white;
      cursor: pointer;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }
    button:hover {
      background-color: #519e2c;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌱 씨앗 상점</h1>
    <p>👤 닉네임: <span id="nickname">로딩 중...</span></p>
    <p>🔌 전원: <span id="power">확인 중...</span></p>
    <p>🍀 보유 토큰: <span id="orcx">0</span></p>
    <nav>
      <a href="index9.html">🏡 메인으로</a> |
      <a href="gamja-farm.html">🥔 감자 농장</a> |
      <a href="gamja-exchange.html">🧪 씨앗 관리</a> |
      <a href="admin-users.html">📜 유저 목록</a>
    </nav>
  </header>

  <main>
    <div class="store-buttons">
      <h2>🥔 씨감자</h2>
      <p>남은 수량: <span id="potato-stock">로딩 중...</span></p>
      <button onclick="buySeed('potato')">구매하기</button>

      <h2>🌾 씨보리</h2>
      <p>남은 수량: <span id="barley-stock">로딩 중...</span></p>
      <button onclick="buySeed('barley')">구매하기</button>
    </div>
  </main>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";

    // 닉네임 표시
    const nickname = localStorage.getItem("nickname") || "알 수 없음";
    document.getElementById("nickname").textContent = nickname;

    // 서버 상태 확인 (전원)
    fetch(`${API_BASE}/power/status`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("power").textContent = data.power === "on" ? "정상" : "꺼짐";
      })
      .catch(() => {
        document.getElementById("power").textContent = "오류";
      });

    // ORCX 토큰 조회
    const kakaoId = localStorage.getItem("kakaoId");
    if (kakaoId) {
      fetch(`${API_BASE}/userdata?kakaoId=${kakaoId}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            document.getElementById("orcx").textContent = data.user.orcx || 0;
          }
        });
    }

    // 씨앗 재고 상태 불러오기
    fetch(`${API_BASE}/seed/status`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("potato-stock").textContent = `${data.seedPotato} 개`;
        document.getElementById("barley-stock").textContent = `${data.seedBarley} 개`;
      })
      .catch(() => {
        document.getElementById("potato-stock").textContent = "에러";
        document.getElementById("barley-stock").textContent = "에러";
      });

    // 구매 버튼 기능 (추후 연결 가능)
    function buySeed(type) {
      alert(`구매 기능(${type})은 아직 구현되지 않았습니다.`);
    }
  </script>
</body>
</html>
