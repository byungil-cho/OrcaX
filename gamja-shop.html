<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OrcaX 씨앗 상점</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
    }
    main {
      padding: 1rem;
      min-height: 100vh;
    }
    header {
      background-color: rgba(0,0,0,0.3);
      padding: 1.5rem 1rem 1rem 1rem;
      border-radius: 1.5rem;
      margin-bottom: 1rem;
    }
    .section {
      background-color: rgba(0,0,0,0.3);
      border-radius: 1rem;
      margin: 1rem auto;
      max-width: 420px;
      padding: 1.2rem;
    }
    .btn {
      background: #1fc76a;
      color: #fff;
      padding: 0.8rem 2.5rem;
      font-size: 1.3rem;
      border: none;
      border-radius: 0.8rem;
      margin: 1.2rem 0;
      cursor: pointer;
      font-family: 'Do Hyeon', sans-serif;
      transition: background 0.2s;
    }
    .btn:hover { background: #149b4b; }
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(20,20,20,0.98);
      padding: 0.7rem 0 0.5rem 0;
      display: flex;
      justify-content: center;
      z-index: 10;
      gap: 2.5rem;
      font-size: 1.1rem;
    }
    nav a { color: #ffc107; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🌱 OrcaX 씨앗 상점</h1>
      <div style="font-size:1.1rem;">
        <span style="font-size:1.2em;">🪙 보유 토큰 : <span id="orcx">-</span> ORCX</span>
      </div>
      <br>
      <div>
        🥔 씨감자 재고: <span id="potato-stock">-</span>개<br>
        🥔 씨감자 가격: <span id="potato-price">-</span> ORCX<br>
        <br>
        🌾 씨보리 재고: <span id="barley-stock">-</span>개<br>
        🌾 씨보리 가격: <span id="barley-price">-</span> ORCX
      </div>
    </header>

    <div class="section">
      <h2>🥔 씨감자</h2>
      <div>내 보유: <span id="myPotato">-</span>개</div>
      <button class="btn" onclick="buySeed('potato')">구매하기</button>
    </div>
    <div class="section">
      <h2>🌾 씨보리</h2>
      <div>내 보유: <span id="myBarley">-</span>개</div>
      <button class="btn" onclick="buySeed('barley')">구매하기</button>
    </div>
  </main>
  <nav>
    <a href="gamja-farm.html">감자 농장</a>
    <a href="gamja-shop.html">씨앗 관리소</a>
    <a href="gamja-storage.html">개인 보관함</a>
  </nav>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";
    const kakaoId = localStorage.getItem("kakaoId") || "";
    if (!kakaoId) {
      alert("로그인이 필요합니다. 메인으로 이동합니다.");
      window.location.href = "index9.html";
    }

    // 유저/씨앗 데이터 한 번에 불러오기
    async function fetchAllData() {
      try {
        // 1. 유저 정보 (내 보유 토큰, 내 씨앗 개수)
        const userRes = await fetch(`${API_BASE}/user/v2data`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: kakaoId })
        });
        const userData = await userRes.json();
        const user = userData.user;

        // 콘솔로 실제 구조 체크
        // console.log("user:", user);

        // 토큰
        document.getElementById("orcx").innerText = user?.wallet?.orcx ?? 0;
        // 내 씨감자/씨보리 개수
        document.getElementById("myPotato").innerText = user?.inventory?.seedPotato ?? 0;
        document.getElementById("myBarley").innerText = user?.inventory?.seedBarley ?? 0;

        // 2. 씨앗 재고/가격 (seedstocks)
        const stockRes = await fetch(`${API_BASE}/seed/status`);
        const stock = await stockRes.json();
        // console.log("stock:", stock);

        document.getElementById("potato-stock").innerText = stock.potato?.stock ?? 0;
        document.getElementById("potato-price").innerText = stock.potato?.price ?? 0;
        document.getElementById("barley-stock").innerText = stock.barley?.stock ?? 0;
        document.getElementById("barley-price").innerText = stock.barley?.price ?? 0;

      } catch (err) {
        document.getElementById("orcx").innerText = 0;
        document.getElementById("myPotato").innerText = 0;
        document.getElementById("myBarley").innerText = 0;
        document.getElementById("potato-stock").innerText = 0;
        document.getElementById("potato-price").innerText = 0;
        document.getElementById("barley-stock").innerText = 0;
        document.getElementById("barley-price").innerText = 0;
      }
    }

    // 씨앗 구매 (예시 함수, 실제 구매 구현 필요시 서버 API 경로 확인!)
    async function buySeed(type) {
      alert(type + " 구매는 서버 연동 후 사용 가능합니다.");
      // 실제 연동은 필요에 따라 추가
    }

    // 최초 진입 시 데이터 불러오기
    fetchAllData();
  </script>
</body>
</html>
