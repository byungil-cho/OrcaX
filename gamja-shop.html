<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <title>⸺ 씨감자 상점 (2 ORCX 교환)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f4fff0;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #3b4a2f;
      margin: 1rem 0;
    }
    #nicknameBox {
      text-align: right;
      font-weight: bold;
      margin: 0.5rem 1rem;
      color: #333;
    }
    .shop-box {
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 400px;
      margin: 2rem auto;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    .shop-box button {
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      background: #60b347;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 1rem;
    }
    .shop-box button:hover {
      background-color: #4a9538;
    }
    .navigation-links {
      text-align: center;
      margin-top: 2rem;
    }
    .navigation-links a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background: #4a74ba;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .navigation-links a:hover {
      background: #365f9c;
    }
  </style>
</head>
<body>
  <div id="infoBox" style="text-align:center; margin: 0.5rem; font-weight: bold;"></div>
  <div id="powerStatus" style="text-align:right; margin: 0.5rem 1rem; font-weight: bold; color: green;">
    🔌 전원 ON - 연결 성공
  </div>
  <div id="nicknameBox"></div>
  <h1>🌾 씨감자 교환 상점</h1>
  <div class="shop-box">
    <p>🔄 ORCX 2개로 씨감자 1개로 교환합니다.</p>
    <button onclick="exchangeSeed()">✔️ 씨감자 교환</button>
    <p id="resultMsg" style="margin-top:1rem; color:green;"></p>
    <p id="seedCount" style="margin-top:0.5rem; font-weight: bold;"></p>
  </div>

  <div class="navigation-links">
    <a href="gamja-factory.html">🌱 감자밭으로 가기</a>
    <a href="gamja-result.html">🏭 감자 가공공장</a>
    <a href="gamja-market.html">💰 거래소 이동</a>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname") || "사이메인";
    const box = document.getElementById("nicknameBox");
    box.textContent = `👤 ${nickname} 님`;

    // 토큰 및 씨감자 수량 표시
    fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata?nickname=${nickname}`)
      .then(res => res.json())
      .then(result => {
        const token = result.token ?? 0;
        const seed = result.seedPotato ?? 0;

        const tokenInfo = document.createElement('p');
        tokenInfo.innerHTML = `💰 ORCX 토큰: <strong>${token}</strong>개`;
        box.appendChild(tokenInfo);

        document.getElementById("seedCount").innerText = `🌾 보유 씨감자: ${seed}개`;
      });

    function exchangeSeed() {
      fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/exchange-seed", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
      })
        .then(res => res.json())
        .then(data => {
          const resultMsg = document.getElementById("resultMsg");
          if (data.success) {
            resultMsg.textContent = `🌾 씨감자 ${data.seedGained}개 획득했습니다.`;
            resultMsg.style.color = "green";

            // 갱신
            fetch(`https://climbing-wholly-grouper.jp.ngrok.io/api/userdata?nickname=${nickname}`)
              .then(res => res.json())
              .then(result => {
                document.getElementById("seedCount").innerText = `🌾 보유 씨감자: ${result.seedPotato ?? 0}개`;
              });
          } else {
            resultMsg.textContent = "❌ 교환 실패: " + data.message;
            resultMsg.style.color = "red";
          }
        });
    }
  </script>
</body>
</html>
