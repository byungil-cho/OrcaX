<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>씨앗 구매소</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      background: url('https://byungil-cho.github.io/OrcaX/farm-101.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }
    main {
      background-color: rgba(0, 0, 0, 0.6);
      margin: 2rem;
      padding: 1rem;
      border-radius: 20px;
    }
    button {
      font-size: 1.2rem;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
    .btn-green {
      background-color: #00e0a0;
      color: black;
    }
    .btn-yellow {
      background-color: #ffe100;
      color: black;
    }
    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #ffcc00;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h2>🌱 씨앗 구매소</h2>
    <p>👤 닉네임: <span id="nickname">불러오는 중...</span></p>
    <p>🥔 씨감자 남은 수량: <span id="stockPotato">로딩중...</span></p>
    <p>🌾 씨보리 남은 수량: <span id="stockBarley">로딩중...</span></p>
    <p>💰 씨감자 가격: <span id="seedPotatoPrice">불러오기 실패</span> ORCX</p>
    <p>💰 씨보리 가격: <span id="seedBarleyPrice">불러오기 실패</span> ORCX</p>
    <p>🍀 보유 토큰: <span id="orcxToken">-</span></p>

    <nav>
      <a href="index9.html">🏠 메인으로</a>
      <a href="gamja-farm.html">🥔 감자 농장</a>
      <a href="gamja-shop.html">🌱 씨앗 관리소</a>
      <a href="admin-users.html">📋 유저 목록</a>
    </nav>

    <h3>🥔 씨감자</h3>
    <p>내 보유: <span id="mySeedPotato">0개</span></p>
    <button class="btn-green">구매하기</button>

    <h3>🌾 씨보리</h3>
    <p>내 보유: <span id="mySeedBarley">0개</span></p>
    <button class="btn-yellow">구매하기</button>

    <p style="color: lightgreen;">✅ 서버 연결 성공</p>
  </main>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io/api";

    async function fetchSeedPrices() {
      try {
        const res = await fetch(`${API_BASE}/seed/price`);
        const data = await res.json();
        document.getElementById("seedPotatoPrice").innerText = data.seedPotato;
        document.getElementById("seedBarleyPrice").innerText = data.seedBarley;
      } catch (e) {
        console.error("가격 불러오기 실패", e);
      }
    }

    async function fetchSeedStatus() {
      try {
        const res = await fetch(`${API_BASE}/seed/status`);
        const data = await res.json();
        document.getElementById("stockPotato").innerText = data.seedPotato;
        document.getElementById("stockBarley").innerText = data.seedBarley;
      } catch (e) {
        console.error("재고 불러오기 실패", e);
      }
    }

    async function fetchUserInfo() {
      try {
        const res = await fetch(`${API_BASE}/userdata`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({}),
        });
        const data = await res.json();
        document.getElementById("nickname").innerText = data.nickname || "닉네임 없음";
        document.getElementById("orcxToken").innerText = data.orcxToken || "0";
        document.getElementById("mySeedPotato").innerText = (data.inventory?.seedPotato || 0) + "개";
        document.getElementById("mySeedBarley").innerText = (data.inventory?.seedBarley || 0) + "개";
      } catch (e) {
        console.error("유저 정보 불러오기 실패", e);
      }
    }

    // 실행
    fetchSeedPrices();
    fetchSeedStatus();
    fetchUserInfo();
  </script>
</body>
</html>
