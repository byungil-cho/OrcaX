<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>공지사항 등록</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 400px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    input, textarea, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 14px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
  <script>
    function checkPasswordAndSubmit(e) {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      if (pw !== '2025') {
        alert('비밀번호가 틀렸습니다!');
        return false;
      }
      // 실제 제출
      e.target.form.submit();
    }
  </script>
</head>
<body>
  <div class="container">
    <h2>공지사항 등록</h2>
    <form method="POST" action="/api/notices">
      <input type="password" id="password" placeholder="비밀번호 입력 (2025)" required />
      <input type="text" name="title" placeholder="제목" required />
      <textarea name="content" placeholder="내용" rows="6" required></textarea>
      <button onclick="checkPasswordAndSubmit(event)">제출</button>
    </form>
  </div>
</body>
</html>
