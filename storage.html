
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감자농장 입구</title>
  <style>
    body {
      background-image: url("farm-101.png");
      background-size: cover;
      background-position: center;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      color: #fff;
      position: relative;
      height: 100vh;
    }
    .title {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 1.5em;
      font-weight: bold;
    }
    .status {
      position: absolute;
      top: 20px;
      right: 20px;
      text-align: right;
      font-size: 0.9em;
    }
    .materials {
      position: absolute;
      bottom: 80px;
      right: 20px;
      font-size: 0.9em;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 10px;
    }
    .entry-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 1em;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
    }
    .entry-button:hover {
      background-color: #218838;
    }
  </style>
  <script>
    async function loadData() {
      try {
        const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata");
        const data = await res.json();
        if (!data || !data.nickname || !data.farmName) throw new Error();

        document.getElementById("nickname").innerText = "닉네임: " + data.nickname;
        document.getElementById("farmName").innerText = "농장명: " + data.farmName;
        document.getElementById("power").innerText = "전원: ✅";
        document.getElementById("materials").innerHTML = `
          감자: ${data.potatoCount}<br>
          물: ${data.water}<br>
          거름: ${data.fertilizer}<br>
          토큰: ${data.token}
        `;
      } catch (err) {
        document.getElementById("power").innerText = "전원: ❌";
        document.getElementById("nickname").innerText = "닉네임: 불러오기 실패";
        document.getElementById("farmName").innerText = "농장명: 불러오기 실패";
      }
    }
    window.onload = loadData;
  </script>
</head>
<body>
  <div class="title">감자농장</div>
  <div class="status">
    <div id="nickname">닉네임:</div>
    <div id="farmName">농장명:</div>
    <div id="power">전원:</div>
  </div>
  <div class="materials" id="materials">로딩 중...</div>
  <a class="entry-button" href="gamja-factory.html">감자농장 입장</a>
</body>
</html>
