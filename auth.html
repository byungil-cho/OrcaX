<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🌰 OrcaX 룰렛</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
  <style>
    body { background-color: #0A0A1A; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
    h1 { margin-top: 40px; }
    #kakaoLoginBtn {
      margin-top: 20px;
      background-color: #FEE500;
      color: #000;
      font-weight: bold;
      padding: 12px 24px;
      font-size: 1.1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    #kakaoLoginBtn:hover {
      background-color: #ffd900;
    }
  </style>
</head>
<body>
  <h1>🌰 OrcaX 로그인</h1>
  <button id="kakaoLoginBtn" onclick="kakaoLogin()">🟡 카카오로 로그인</button>

  <script>
    Kakao.init('a19849cd9ffb167d530478c06b5fcfd0');

    function kakaoLogin() {
      Kakao.Auth.login({
        success: function(authObj) {
          alert('✅ 카카오 로그인 성공!');
          window.opener.postMessage('login-success', '*');
          window.close();
        },
        fail: function(err) {
          alert('❌ 로그인 실패: ' + JSON.stringify(err));
        }
      });
    }
  </script>
</body>
</html>
