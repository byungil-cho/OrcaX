<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>옥수수 농장</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-size: cover;
      background-position: center;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    header, footer {
      background: rgba(0,0,0,0.6);
      padding: 10px;
    }
    main {
      text-align: center;
      padding: 20px;
    }
    #farmBackground {
      width: 100%;
      height: 300px;
      background-size: cover;
      background-position: center;
      border: 2px solid #444;
      border-radius: 10px;
      margin-bottom: 20px;
      position: relative;
    }
    #cornStage {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      max-height: 250px;
    }
    #progress {
      width: 100%;
      height: 20px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #f7e600, #ffcc00);
      transition: width 0.5s;
    }
  </style>
</head>
<body>
  <!-- 상단 자원 표시 -->
  <header>
    <div class="resources">
      💧 물: <span id="water">0</span> |
      🌱 거름: <span id="fertilizer">0</span> |
      🌽 옥수수: <span id="corn">0</span> |
      🍿 팝콘: <span id="popcorn">0</span> |
      🧂 소금: <span id="salt">0</span> |
      🍬 설탕: <span id="sugar">0</span> |
      🪙 토큰: <span id="token">0</span>
    </div>
  </header>

  <!-- 농장 상태 -->
  <main>
    <h2>🌽 옥수수 농장</h2>
    <div id="farmBackground">
      <img id="cornStage" src="img/a_corn_06_01.png" alt="옥수수 단계">
    </div>
    <p id="status-text">아직 씨앗을 심지 않았습니다.</p>
    <div id="progress">
      <div id="progress-bar"></div>
    </div>

    <!-- 조작 버튼 -->
    <div class="controls">
      <button id="btn-plant">씨앗 심기</button>
      <button id="btn-water">물 주기</button>
      <button id="btn-fertilize">거름 주기</button>
      <button id="btn-harvest">수확</button>
      <button id="btn-popcorn">팝콘 튀기기</button>
    </div>
  </main>

  <!-- 하단 닉네임 + 아이콘 -->
  <footer>
    👤 <span id="nickname"></span>
    <img id="corn-icon" src="img/corn-yellow.png" alt="씨앗 상태" style="width:20px; height:20px; margin-left:4px;">
    | Lv.1 농부
  </footer>

  <script type="module" src="js/corn-farm.js"></script>
</body>
</html>
