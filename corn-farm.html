<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장</title>
  <style>
    /* 기존 스타일 유지 */
    .btn-buy{
      border:1px solid var(--bd);
      background:rgba(0,0,0,.25);
      color:#fff;
      border-radius:10px;
      padding:4px 8px;
      font-size:12px;
      cursor:pointer
    }
    .modal{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,.5);
      display:none;align-items:center;justify-content:center;z-index:20;
    }
    .modal-content{
      background:#222;padding:20px;border-radius:10px;color:#fff;text-align:center;
    }
    .modal-content button{
      display:block;margin:6px auto;padding:6px 12px;
      border:1px solid var(--bd);background:rgba(255,255,255,.1);color:#fff;
      border-radius:8px;cursor:pointer
    }
  </style>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <header>
    <div class="topline">
      <span id="netDot" class="status"></span>
      <span id="netTxt">연결 확인 중…</span>
      <span class="nick" id="nick">(로그인 필요)</span>
      <button id="btn-buy" class="btn-buy">구매하기</button>
    </div>
    <div class="res">
      <div class="tag">🌱 씨앗 <b id="r-seeds">0</b></div>
      <div class="tag">💧 물 <b id="r-water">0</b></div>
      <div class="tag">🪴 거름 <b id="r-fert">0</b></div>
      <div class="tag">🌽 옥수수 <b id="r-corn">0</b></div>
      <div class="tag">🍿 팝콘 <b id="r-pop">0</b></div>
      <div class="tag">🧂 소금 <b id="r-salt">0</b></div>
      <div class="tag">🍬 설탕 <b id="r-sugar">0</b></div>
      <div class="tag">🪙 토큰 <b id="r-orcx">0</b></div>
    </div>
  </header>

  <!-- 원형 게이지 -->
  <div class="gauge">
    <div class="gfill" id="gfill" style="--p:0%"></div>
    <div class="gnum" id="gnum">0</div>
  </div>

  <!-- 레벨 캐릭터 박스 -->
  <div class="level-box">
    <img id="levelIconMini" src="https://byungil-cho.github.io/OrcaX/img/mark_01.png" alt="레벨 아이콘" />
    <div>
      <div id="levelText">Lv.1</div>
      <div class="expbar"><span id="expBar"></span></div>
    </div>
  </div>

  <!-- 미니 상태 -->
  <div class="mini-wrap">
    <a class="nav" href="corn-index.html" title="이전">⬅️</a>
    <img id="miniImg" alt="작물 상태" />
    <a class="nav" href="https://byungil-cho.github.io/OrcaX/index9.html" title="감자 농장">🥔</a>
    <div id="miniCap">상태 확인 중…</div>
  </div>

  <!-- 하단 액션 -->
  <div class="actions">
    <button id="btn-plant" class="btn">씨앗 심기</button>
    <button id="btn-water" class="btn">물 주기</button>
    <button id="btn-fert"  class="btn">거름 주기</button>
    <button id="btn-harv"  class="btn" disabled>수확</button>
    <button id="btn-pop"   class="btn" disabled>뻥튀기</button>
    <button id="btn-ex"    class="btn">팝콘↔거름</button>
  </div>

  <div id="toast"></div>

  <!-- 구매 모달 -->
  <div id="buyModal" class="modal">
    <div class="modal-content">
      <h3>구매하기</h3>
      <button onclick="buyItem('salt')">소금 구매</button>
      <button onclick="buyItem('sugar')">설탕 구매</button>
      <button onclick="buyItem('seeds')">씨앗 구매</button>
      <button onclick="closeBuy()">닫기</button>
    </div>
  </div>

  <script defer src="./js/corn-api.js?v=20250814"></script>
</body>
</html>
