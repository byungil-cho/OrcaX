<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장 (업그레이드)</title>
  <style>
    :root {
      --ink:#eef6ee; --glass:rgba(0,0,0,.45); --bd:rgba(255,255,255,.18); --ok:#25d366;
    }
    html, body {
      margin:0; padding:0; height:100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background:#000; color:var(--ink);
    }
    #bg { position:fixed; inset:0; z-index:0; background:url('img/farm_01.png') center/cover no-repeat; }

    header {
      position:fixed; left:10px; right:10px; top:10px; z-index:9;
      backdrop-filter:blur(6px); background:var(--glass); border:1px solid var(--bd);
      border-radius:14px; padding:8px 10px;
    }
    .topline { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .status { width:14px; height:14px; border-radius:50%; background:#ef4444; }
    .status.ok { background:var(--ok); }
    .nick { font-weight:800; max-width:40vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .res { display:grid; gap:6px; margin-top:6px; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); }
    .tag { display:flex; justify-content:space-between; align-items:center; gap:8px;
      padding:6px 8px; border-radius:999px; border:1px solid var(--bd); background:rgba(255,255,255,.08); font-size:12px; }
    .tag b { font-variant-numeric:tabular-nums; }

    .gauge { position:fixed; left:10px; bottom:240px; width:110px; height:110px; z-index:6;
      border-radius:50%; border:1px solid var(--bd); background:rgba(0,0,0,.35);
      display:grid; place-items:center; overflow:hidden; }
    .gfill { position:absolute; inset:0; background:conic-gradient(#8ed36b var(--p,0%), rgba(255,255,255,.12) 0); }
    .gnum { position:relative; font-weight:800; }

    .mini-wrap { position:fixed; left:50%; transform:translateX(-50%); bottom:120px; z-index:7;
      display:flex; align-items:center; gap:10px; width:clamp(280px, 60vw, 460px);
      border:1px solid var(--bd); border-radius:14px; background:rgba(0,0,0,.28); padding:8px 10px; }
    #miniImg { width:120px; height:120px; border-radius:12px; border:1px solid var(--bd); object-fit:cover; background:#000; }
    #miniCap { font-size:12px; opacity:.9; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .actions { position:fixed; left:10px; right:10px; bottom:10px; z-index:8;
      display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
      backdrop-filter:blur(6px); background:var(--glass); border:1px solid var(--bd);
      border-radius:14px; padding:8px; }
    .btn { border:1px solid var(--bd); background:rgba(0,0,0,.25); color:#fff; border-radius:10px;
      padding:10px 8px; font-size:13px; cursor:pointer; }
    .btn[disabled]{ opacity:.55; pointer-events:none; }

    #toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:9999;
      background:rgba(0,0,0,.85); color:#fff; border:1px solid var(--bd); border-radius:10px;
      padding:8px 12px; font-size:13px; display:none; }
    #toast.show{ display:block; }
  </style>
</head>
<body>
  <div id="bg"></div>

  <!-- 상단 영역 -->
  <header>
    <div class="topline">
      <span id="netDot" class="status"></span>
      <span class="nick" id="nick">(로그인 필요)</span>
    </div>
    <div class="res">
      <div class="tag">🌱 씨앗 <b id="r-seeds">0</b></div>
      <div class="tag">💧 물 <b id="r-water">0</b></div>
      <div class="tag">🪴 거름 <b id="r-fert">0</b></div>
      <div class="tag">🌽 옥수수 <b id="r-corn">0</b></div>
      <div class="tag">🍿 팝콘 <b id="r-pop">0</b></div>
      <div class="tag">🧂 소금 <b id="r-salt">0</b></div>
      <div class="tag">🍬 설탕 <b id="r-sugar">0</b></div>
      <div class="tag">🪙 토큰 <b id="r-orcx">0</b></div>
    </div>
  </header>

  <!-- 성장 게이지 -->
  <div class="gauge">
    <div class="gfill" id="gfill" style="--p:0%"></div>
    <div class="gnum" id="gnum">0</div>
  </div>

  <!-- 미니 농장 -->
  <div class="mini-wrap">
    <img id="miniImg" src="img/a_corn_06_01.png" alt="작물 상태" />
    <div id="miniCap">휴경</div>
  </div>

  <!-- 조작 버튼 -->
  <div class="actions">
    <button id="btn-plant" class="btn">씨앗 심기</button>
    <button id="btn-water" class="btn">물 주기</button>
    <button id="btn-fert"  class="btn">거름 주기</button>
    <button id="btn-harv"  class="btn">수확</button>
    <button id="btn-pop"   class="btn">뻥튀기</button>
    <button id="btn-ex"    class="btn">팝콘↔거름</button>
  </div>

  <div id="toast"></div>

  <!-- JS -->
  <script src="js/corn-farm.js"></script>
</body>
</html>
