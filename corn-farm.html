<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🌽 옥수수 농장</title>
  <style>
    body {
      margin: 0;
      background-size: cover;
      background-position: center;
      font-family: Arial, sans-serif;
      color: white;
    }
    #resourceBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      padding: 5px;
      font-size: 14px;
    }
    #resourceBar span { margin: 0 8px; }

    #character {
      position: fixed;
      bottom: 60px;
      left: 10px;
      display: flex;
      align-items: center;
    }
    #character img {
      width: 50px;
      height: 50px;
    }

    #actionBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.8);
      display: flex;
      justify-content: space-around;
      padding: 10px;
    }
    #actionBar button {
      border: none;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    #miniImage {
      position: fixed;
      bottom: 120px;
      right: 20px;
      width: 100px;
      height: 100px;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #miniImage img { width: 80px; height: 80px; }
  </style>
</head>
<body>
  <div id="resourceBar">
    <span>💧 물: <span id="water">0</span></span>
    <span>💩 거름: <span id="fertilizer">0</span></span>
    <span>🪙 토큰: <span id="token">0</span></span>
    <span>🌱 씨옥수수: <span id="seed">0</span></span>
    <span>🧂 소금: <span id="salt">0</span></span>
    <span>🍬 설탕: <span id="sugar">0</span></span>
    <span>🍿 팝콘: <span id="popcorn">0</span></span>
  </div>

  <div id="character">
    <img id="characterImg" src="">
    <span id="nickname">로그인 안됨</span>
  </div>

  <div id="miniImage">
    <img id="cornStage" src="">
  </div>

  <div id="actionBar">
    <button>🌱 씨앗 심기</button>
    <button>💧 물 주기</button>
    <button>💩 거름 주기</button>
    <button>🌽 수확</button>
    <button>🍿 뻥튀기</button>
    <button>🛒 구매</button>
  </div>

  <script>
    const API = "https://climbing-wholly-grouper.jp.ngrok.io/api"; // 네 서버 주소

    // === 이미지 매핑 ===
    function getBackground(season) {
      return `/img/background/farm_${season}.png`; 
    }

    function getCornStage(stage) {
      return `/img/corn/a_corn_${stage}.png`;
    }

    function getCharacter(level) {
      if (level < 5) return "/img/char/a_mark_01.png";
      if (level < 10) return "/img/char/a_mark_02.png";
      if (level < 20) return "/img/char/a_mark_03.png";
      return "/img/char/a_mark_04.png";
    }

    // === 유저 정보 불러오기 ===
    async function loadUser() {
      try {
        const res = await fetch(`${API}/cornfarm`, { credentials: "include" });
        if (!res.ok) {
          document.getElementById("nickname").innerText = "❌ 로그인 안됨";
          return;
        }
        const user = await res.json();

        // 닉네임
        document.getElementById("nickname").innerText = user.nickname;

        // 자원 표시
        document.getElementById("water").innerText = user.water || 0;
        document.getElementById("fertilizer").innerText = user.fertilizer || 0;
        document.getElementById("token").innerText = user.token || 0;
        document.getElementById("seed").innerText = user.seed || 0;
        document.getElementById("salt").innerText = user.salt || 0;
        document.getElementById("sugar").innerText = user.sugar || 0;
        document.getElementById("popcorn").innerText = user.popcorn || 0;

        // 이미지 반영
        if(user.season) document.body.style.backgroundImage = `url(${getBackground(user.season)})`;
        if(user.growthStage) document.getElementById("cornStage").src = getCornStage(user.growthStage);
        if(user.level) document.getElementById("characterImg").src = getCharacter(user.level);

      } catch (err) {
        console.error("❌ loadUser Error", err);
      }
    }

    loadUser();
  </script>
</body>
</html>
