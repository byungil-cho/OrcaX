<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장</title>
  <base href="/OrcaX/">
  <meta name="theme-color" content="#000000" />
  <style>
    :root{--ink:#eef6ee;--panel:rgba(0,0,0,45);--bd:rgba(255,255,255,16);--ok:#25d366;--accent:#8ed36b}
    html,body{height:100%;margin:0;color:var(--ink);background:#000 center/cover no-repeat fixed;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif}
    .glass{backdrop-filter:saturate(1.05) blur(6px);background:var(--panel);border:1px solid var(--bd);border-radius:14px}
    .top{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:10px;align-items:center;padding:10px 12px;z-index:3}
    .title{margin:0;font-size:16px}
    .status{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px}
    .dot{width:10px;height:10px;border-radius:999px;background:#ef4444}.dot.ok{background:var(--ok)}
    .diag{font-size:11px;opacity:.8}
    .bank{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:8px}
    .pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--bd);background:rgba(0,0,0,55);font-size:13px}
    .pill .cnt{font-variant-numeric:tabular-nums}
    .hud-left,hud-right{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));z-index:2}
    .hud-left{left:12px;display:flex;gap:10px;align-items:flex-end}
    .hud-right{right:12px;min-width:min(320px,92vw)}
    .gauge{width:110px;height:110px;border-radius:999px;display:grid;place-items:center;color:#fff;position:relative}
    .gauge .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:22px}
    .gauge .s{position:absolute;bottom:8px;font-size:12px;opacity:.9}
    .panel{padding:10px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0}
    .row-col{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    .btn{cursor:pointer;padding:6px 10px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.08);color:#fff}
    .btn[disabled]{opacity:.55;pointer-events:none}
    .count{font-variant-numeric:tabular-nums}
    .chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid var(--bd);font-size:12px;background:rgba(0,0,0,45)}
    .chip-thin{padding:4px 9px}
    .grid{display:grid;gap:8px}
    .wrap{position:relative;min-height:100vh}
    .mini-wrap{position:fixed;right:12px;top:58px;z-index:2}
    .mini{display:block;width:140px;height:140px;border-radius:14px;border:1px solid var(--bd);background:rgba(0,0,0,35);object-fit:cover}
    .mini-cap{margin-top:6px;font-size:12px;text-align:center;opacity:.9}
    .gate{position:fixed;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:1fr;gap:10px;z-index:40;transform:translateY(6px);opacity:0;pointer-events:none;transition:transform .16s ease, opacity .16s ease}
    .gate.open{transform:translateY(0);opacity:1;pointer-events:auto}
    .gate .panel{padding:10px}
    .gate .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .gate .dock{display:flex;gap:10px}
    .gate-backdrop{position:fixed;inset:0;background:rgba(0,0,0,45);display:none;z-index:39}
    .gate-backdrop.show{display:block}
    .res{display:flex;gap:8px;align-items:center}
    .bar{position:relative;height:120px;width:20px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,8);overflow:hidden}
    .bar .fill{position:absolute;left:0;right:0;bottom:0;background:var(--accent);height:0%}
    .legend{display:flex;gap:8px;flex-wrap:wrap;opacity:.92}
    .tag{display:inline-flex;gap:6px;align-items:center;background:rgba(0,0,0,35);border:1px solid var(--bd);border-radius:999px;padding:4px 8px;font-size:12px}
    .gate-line{position:absolute;left:2px;right:2px;border-top:1px dashed rgba(255,255,255,15)}
    .gate .col{position:relative}
    .gl80{top:24px}.gl50{top:60px}.gl30{top:84px}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:rgba(0,0,0,75);border:1px solid rgba(255,255,255,18);border-radius:10px;padding:8px 12px;font-size:13px;display:none}
    .toast.show{display:block}
    #shop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50}
    #shop .backdrop{position:absolute;inset:0;background:rgba(0,0,0,45)}
    #shop .panel{position:relative;min-width:280px;max-width:92vw;background:rgba(20,20,20,95);border:1px solid rgba(255,255,255,18);border-radius:16px;padding:14px 16px;color:#fff}
  </style>
</head>
<body>
  <header class="top glass">
    <h1 class="title" id="title">(농장이름 미설정) – 옥수수 농장</h1>
    <div class="status">
      <span id="netDot" class="dot"></span><span id="netTxt">연결 확인 중…</span>
      <span class="diag" id="diag"></span>
    </div>
  </header>

  <div class="bank">
    <div class="pill"><span>🪙 토큰</span><b id="bankToken" class="cnt">0</b></div>
    <div class="pill"><span>🍿 팝콘</span><b id="bankPop" class="cnt">0</b></div>
  </div>

  <aside class="hud-left">
    <div class="gate-dock">
      <button id="btnGate" class="chip chip-thin" type="button" aria-expanded="false" aria-controls="gate">성장게이트</button>
      <div id="gauge" class="gauge glass" role="img">
        <div class="v" id="gVal">0</div>
        <div class="s" id="gState">IDLE</div>
      </div>
    </div>
    <div class="panel glass">
      <div style="font-size:13px;opacity:.92">성장 게이지</div>
      <div style="font-size:12px;opacity:.8">씨앗을 심어야 성장이 시작됩니다</div>
      <div class="row">
        <button class="btn" id="plant">씨앗 심기</button>
        <button class="btn" id="harv" disabled>수확</button>
      </div>
      <div class="row"><button class="btn" id="tick">수동 갱신</button></div>
    </div>
  </aside>

  <aside class="hud-right">
    <div class="panel glass">
      <div class="row"><span>씨옥수수(씨앗)</span><span><b id="seed" class="count">0</b> <button class="btn" id="buySeed">구매</button></span></div>
      <hr style="border:none;border-top:1px solid rgba(255,255,255,15);margin:8px 0">
      <div class="row"><span>소금</span><span><b id="saltCount" class="count">0</b> <button class="btn" id="pickSalt">선택/구매</button></span></div>
      <div class="row"><span>설탕</span><span><b id="sugarCount" class="count">0</b> <button class="btn" id="pickSugar">선택/구매</button></span></div>
      <div class="row"><span>보유 옥수수</span><span><b id="c" class="count">0</b></span></div>
      <div class="row"><button class="btn" id="pop">팝콘 튀기기</button><button class="btn" id="syncPotato">감자 저장소 동기화</button></div>
    </div>
  </aside>

  <div class="mini-wrap">
    <img id="mini" class="mini" src="img/corn_0_01_04.png" alt="씨앗 필요">
    <div id="miniCap" class="mini-cap">씨앗 필요</div>
  </div>

  <div id="gate" class="gate">
    <div id="gateBackdrop" class="gate-backdrop"></div>
    <div class="panel glass">
      <div class="grid2">
        <div class="col">
          <div class="res"><span>물</span><div class="bar"><div class="gate-line gl80"></div><div class="gate-line gl50"></div><div class="gate-line gl30"></div><div id="fillW" class="fill" style="height:0%"></div></div> <b id="w">0</b></div>
          <div class="res"><span>거름</span><div class="bar"><div class="gate-line gl80"></div><div class="gate-line gl50"></div><div class="gate-line gl30"></div><div id="fillF" class="fill" style="height:0%"></div></div> <b id="f">0</b></div>
        </div>
        <div class="col">
          <div class="res"><span>성장</span><div class="bar"><div class="gate-line gl80"></div><div class="gate-line gl50"></div><div class="gate-line gl30"></div><div id="fillG" class="fill" style="height:0%"></div></div> <b id="gaugeVal">%</b></div>
        </div>
      </div>
      <div class="legend">
        <span class="tag">정상(+): 물≥50 & 거름≥50</span>
        <span class="tag">경고(-1): 둘 중 하나&lt;50</span>
        <span class="tag">위험(-2): 둘 다&lt;50</span>
      </div>
      <div class="row" style="justify-content:flex-end;gap:8px;">
        <button class="btn" id="btnW">물 -1</button>
        <button class="btn" id="btnF">거름 -1</button>
        <button class="btn" id="closeGate" aria-label="닫기">닫기</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 구매 팝업 -->
  <div id="shop">
    <div class="backdrop" onclick="closeShop()"></div>
    <div class="panel">
      <div style="font-weight:700;margin-bottom:8px">구매</div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
        <label>종류</label>
        <select id="shopItem">
          <option value="seed">씨옥수수</option>
          <option value="salt">소금</option>
          <option value="sugar">설탕</option>
        </select>
        <label style="margin-left:8px;">수량</label>
        <input id="shopQty" type="number" min="1" value="1" style="width:80px;padding:4px 6px;">
      </div>
      <div style="font-size:13px;opacity:.9;margin-bottom:12px;">
        단가 <b id="shopPricePer">30</b> 토큰 × 수량 = 합계 <b id="shopTotal">30</b> 토큰
        <span style="margin-left:8px;opacity:.7;">(보유: <b id="shopOrcx">0</b>)</span>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="closeShop()" class="btn" id="shopCancel">취소</button>
        <button onclick="confirmBuy()" class="btn" id="shopBuyBtn">구매</button>
      </div>
    </div>
  </div>

  <script>
    /* ====== 환경 ====== */
    const BASE_API = localStorage.getItem('orcax:BASE_API') || 'https://climbing-wholly-grouper.jp.ngrok.io';
    const nickname = localStorage.getItem('nickname') || localStorage.getItem('kakaoNickname') || '(로그인 필요)';
    const kakaoId  = localStorage.getItem('kakaoId') || '';

    /* ====== 이미지 맵 ====== */
    const IMG = f => `img/${f}`;
    const BG_BY_GAUGE = [
      {max:0,   file:'farm_05.png', label:'IDLE'},
      {max:29,  file:'farm_05.png', label:'이른 봄(해빙)'},
      {max:59,  file:'farm_07.png', label:'봄 · 초록'},
      {max:79,  file:'farm_09.png', label:'초여름'},
      {max:94,  file:'farm_10.png', label:'한창 성장'},
      {max:100, file:'farm_12.png', label:'수확 준비'}
    ];
    const MINI_BY_GAUGE = [
      {max:20, file:'corn_04_02.png',cap:'파종/발아'},
      {max:50, file:'corn_02_02.png',cap:'생장'},
      {max:80, file:'corn_03_01.png',cap:'수염/이삭 전'},
      {max:95, file:'corn_03_03.png',cap:'이삭'},
      {max:100,file:'corn_01_01.png',cap:'수확 직전'}
    ];

    /* ====== DOM & 상태 ====== */
    const $ = id=>document.getElementById(id);
    const $gVal=$('gVal'), $gState=$('gState'), $harv=$('harv'), $tick=$('tick'), $plant=$('plant');
    const $w=$('w'), $f=$('f'), $c=$('c'), $seed=$('seed');
    const $mini=$('mini'), $miniCap=$('miniCap');
    const $fillW=$('fillW'), $fillF=$('fillF'), $fillG=$('fillG');
    const $pop=$('pop'), $saltCount=$('saltCount'), $sugarCount=$('sugarCount');
    const $pickSalt=$('pickSalt'), $pickSugar=$('pickSugar'), $syncPotato=$('syncPotato'), $buySeed=$('buySeed');
    const $bankToken=$('bankToken'), $bankPop=$('bankPop'), $toast=$('toast');
    const $netDot=$('netDot'), $netTxt=$('netTxt'), $title=$('title'), $diag=$('diag');

    let NET_OK=false;
    let PRICE = { seed:30, salt:10, sugar:20, currency:'ORCX' };
    let S = (()=>{try{
      return Object.assign({phase:'IDLE',g:0,w:0,f:0,c:0,seed:0,salt:0,sugar:0,sel:'salt'},
        JSON.parse(localStorage.getItem('corn_state')||'{}'));
    }catch(e){return {phase:'IDLE',g:0,w:0,f:0,c:0,seed:0,salt:0,sugar:0,sel:'salt'}}})();
    const resPct = x => Math.max(0, Math.min(100, x*20));

    function getPotatoInv(){let inv={water:0,fertilizer:0,salt:0,sugar:0,seed:0,token:0,popcorn:0};try{inv=Object.assign(inv, JSON.parse(localStorage.getItem('potato_inv')||'{}'));}catch(e){};for(const k of Object.keys(inv)){if(typeof inv[k]!=='number') inv[k]=0;}return inv;}
    function setPotatoInv(inv){try{localStorage.setItem('potato_inv', JSON.stringify(inv));}catch(e){}}
    function save(){try{localStorage.setItem('corn_state', JSON.stringify(S));}catch(e){}}

    /* ====== 렌더 ====== */
    function setNet(ok, text){ NET_OK=!!ok; $netDot.classList.toggle('ok', ok); $netTxt.textContent = text || (ok?'온라인':'오프라인'); }
    function applyBG(){ const row = BG_BY_GAUGE.find(r=>S.g<=r.max) || BG_BY_GAUGE.at(-1); document.body.style.backgroundImage = `url('${IMG(row.file)}')`; $gState.textContent = (S.phase==='GROW'?row.label.toUpperCase():S.phase); }
    function applyMini(){
      if(S.phase!=='GROW'){
        // 휴경/씨앗필요 상태는 게이지와 무관하게 고정 이미지로 표기
        $mini.src = IMG('corn_0_01_04.png');
        const cap = (S.phase==='STUBBLE') ? '수확 완료(휴경지)' : '씨앗 필요';
        $mini.alt = cap; $miniCap.textContent = cap;
        return;
      }
      const row = MINI_BY_GAUGE.find(r=>S.g<=r.max) || MINI_BY_GAUGE.at(-1);
      $mini.src = IMG(row.file); $mini.alt = row.cap; $miniCap.textContent = `${row.cap} · Lv.1`;
    }
    function renderGate(){ $fillW.style.height=resPct(S.w)+'%'; $fillF.style.height=resPct(S.f)+'%'; $fillG.style.height=Math.max(0,Math.min(100,S.g))+'%'; }
    function renderRes(){ $w.textContent=S.w; $f.textContent=S.f; $c.textContent=S.c; $seed.textContent=S.seed;
      $saltCount.textContent=S.salt; $sugarCount.textContent=S.sugar;
      $pickSalt.classList.toggle('sel', S.sel==='salt'); $pickSugar.classList.toggle('sel', S.sel==='sugar');
      $pop.disabled = !( S.c>=1 && (S.salt>=1 || S.sugar>=1) );
      $plant.disabled = !(S.phase!=='GROW' && S.seed>=1);
      $harv.disabled = !(S.phase==='GROW' && S.g>=100);
    }
    function renderBank(){ const inv=getPotatoInv(); $bankToken.textContent=inv.token; $bankPop.textContent=inv.popcorn; }
    function renderAll(){ $title.textContent = `${nickname} – 옥수수 농장`;
      $gVal.textContent=S.g.toFixed(0);
      $('gauge').style.background=`conic-gradient(var(--accent) ${Math.max(0,Math.min(100,S.g))}%, rgba(255,255,255,15) 0)`;
      applyBG(); applyMini(); renderGate(); renderRes(); renderBank();
    }

    /* ====== 서버 ====== */
    async function j(path, body={}, method='POST'){
      const r = await fetch(`${BASE_API}${path}`, { method, headers:{'Content-Type':'application/json'}, body: method==='GET'?undefined:JSON.stringify(body) });
      const d = await r.json().catch(()=> ({}));
      if(!r.ok) throw d;
      return d;
    }

    async function loadFromServer(){
      try{
        if(!kakaoId) throw new Error('kakaoId 없음');
        $diag.textContent = `API:${BASE_API} / kakaoId:${kakaoId}`;
        const res = await j('/api/userdata', { kakaoId });
        const u = (res && (res.user || res.data?.user)) || {};
        setNet(true,'온라인');

        const inv = getPotatoInv();
        inv.token   = (u.wallet && u.wallet.orcx) ?? u.orcx ?? inv.token;
        inv.popcorn = u.food?.popcorn ?? inv.popcorn;
        inv.salt    = u.additives?.salt ?? inv.salt;
        inv.sugar   = u.additives?.sugar ?? inv.sugar;
        inv.seed    = (u.agri?.seedCorn ?? u.agri?.seeds ?? inv.seed) | 0;
        inv.water   = u.inventory?.water ?? inv.water;       // 동기화
        inv.fertilizer = u.inventory?.fertilizer ?? inv.fertilizer;
        setPotatoInv(inv);

        S.w = inv.water; S.f = inv.fertilizer;
        S.c = u.agri?.corn ?? S.c;
        S.seed = inv.seed;
        save(); renderAll();

        // 가격표
        try{
          const pb = await j('/api/corn/priceboard', {}, 'GET');
          if(pb?.salt!=null)  PRICE.salt  = pb.salt;
          if(pb?.sugar!=null) PRICE.sugar = pb.sugar;
          if(pb?.seed!=null)  PRICE.seed  = pb.seed;
          if(pb?.currency)    PRICE.currency = pb.currency;
          updateShopCalc();
        }catch(e){}
      }catch(e){ setNet(false,'오프라인/연결 실패'); renderAll(); }
    }

    /* ====== 성장 로직 ====== */
    const RATE_GROW=+1.0, RATE_WARN=-1.0, RATE_DANGER=-2.0;
    function tick(){
      if(S.phase==='GROW'){
        const w=S.w>=50, f=S.f>=50;
        const d = (w&&f)?RATE_GROW: (w||f)?RATE_WARN:RATE_DANGER;
        S.g = Math.max(0, Math.min(100, S.g + d));
      }
      save(); renderAll();
    }

    async function harvest(){
      if(!(S.phase==='GROW' && S.g>=100)) return;
      if(NET_OK){
        try{
          const data = await j('/api/corn/harvest', { kakaoId });
          S.c = (data.agri?.corn!=null) ? data.agri.corn : (S.c + (data.gain||0));
          S.g=0; S.phase='STUBBLE'; save(); renderAll(); toast(`수확 완료 (서버)`); return;
        }catch(e){}
      }
      S.c += 5 + Math.floor(Math.random()*3); S.g=0; S.phase='STUBBLE'; save(); renderAll(); toast('수확 완료(로컬)');
    }

    // *** 핵심: 물/거름은 서버에 먼저 차감, 성공 시 재조회
    async function give(kind){
      const field = kind==='w' ? 'water' : 'fertilizer';
      const have  = kind==='w' ? S.w : S.f;
      if(have<=0) return;

      try{
        const data = await j('/api/user/inventory/use', { kakaoId, type: field, amount: 1 });
        if (typeof data?.inventory?.water === 'number') S.w = data.inventory.water;
        if (typeof data?.inventory?.fertilizer === 'number') S.f = data.inventory.fertilizer;

        // 로컬 저장소도 동기화
        const inv = getPotatoInv();
        inv.water = S.w; inv.fertilizer = S.f; setPotatoInv(inv);

        S.g = Math.min(100, S.g + 5);
        save(); renderAll();

        // 확정 재조회
        await loadFromServer();
        toast(`서버 차감 완료: ${field==='water'?'물':'거름'} -1`);
      }catch(e){
        if (NET_OK) {
          toast('서버 차감 실패: /api/user/inventory/use 확인 필요');
          console.warn('inventory/use error:', e);
          return;
        }
        // 완전 오프라인일 때만 임시 폴백
        if(kind==='w') S.w--; else S.f--;
        const inv = getPotatoInv(); inv.water=S.w; inv.fertilizer=S.f; setPotatoInv(inv);
        S.g = Math.min(100, S.g + 5);
        save(); renderAll();
        toast('오프라인 임시 차감');
      }
    }

    const POP_RATE=0.6, TOKEN_DROP=[1,2,3,5], POP_DROP=[1,2];
    const rndPick = a => a[Math.floor(Math.random()*a.length)];
    async function popCorn(){
      if(S.c<1){ alert('옥수수가 없습니다.'); return; }
      const need=S.sel, other=need==='salt'?'sugar':'salt';
      if(S[need]<1){
        if(S[other]>=1){ S.sel=other; renderRes(); alert('선택한 첨가물이 없어 다른 첨가물을 사용합니다.'); }
        else{ if(confirm('첨가물이 없습니다. 감자 농장으로 이동할까요?')) location.href='https://byungil-cho.github.io/OrcaX/index9.html'; return; }
      }
      if(NET_OK){
        try{
          const data = await j('/api/corn/pop', { kakaoId, use:S.sel });
          const inv=getPotatoInv();
          S.c = (data.agri?.corn!=null) ? data.agri.corn : Math.max(0,S.c-1);
          if(data.additives){ S.salt=data.additives.salt ?? S.salt; S.sugar=data.additives.sugar ?? S.sugar; inv.salt=S.salt; inv.sugar=S.sugar; }
          if(data.result==='popcorn'){ inv.popcorn = data.food?.popcorn ?? (inv.popcorn + (data.qty||0)); toast(`🍿 팝콘 +${data.qty||'?'} (서버)`); }
          else if(data.result==='token'){ inv.token = data.wallet?.orcx ?? (inv.token + (data.qty||0)); toast(`🪙 토큰 +${data.qty||'?'} (서버)`); }
          setPotatoInv(inv); save(); renderAll(); return;
        }catch(e){}
      }
      // 로컬
      const inv=getPotatoInv();
      S.c -= 1; S[need] -= 1;
      if(Math.random()<POP_RATE){ const amt=rndPick(POP_DROP); inv.popcorn+=amt; toast(`🍿 팝콘 +${amt}`); }
      else{ const amt=rndPick(TOKEN_DROP); inv.token+=amt; toast(`🪙 토큰 +${amt}`); }
      inv[need]=Math.max(0,(inv[need]||0)-1);
      setPotatoInv(inv); save(); renderAll();
    }

    function syncFromPotato(){
      const inv=getPotatoInv();
      S.w=inv.water??S.w; S.f=inv.fertilizer??S.f; S.salt=inv.salt??S.salt; S.sugar=inv.sugar??S.sugar; S.seed=inv.seed??S.seed;
      save(); renderAll(); toast('감자 저장소와 동기화 완료');
    }

    /* ====== 구매 팝업 ====== */
    const shop = { el:$('shop'), item:$('shopItem'), qty:$('shopQty'), pricePer:$('shopPricePer'), total:$('shopTotal'), orcx:$('shopOrcx'), btn:$('shopBuyBtn') };
    function openShop(def){ shop.el.style.display='flex'; if(def) shop.item.value=def; const inv=getPotatoInv(); shop.orcx.textContent=inv.token; shop.qty.value=1; updateShopCalc(); shop.btn.disabled=false; }
    function closeShop(){ shop.el.style.display='none'; }
    function unitPrice(kind){ return (kind==='seed')?PRICE.seed:(kind==='salt')?PRICE.salt:PRICE.sugar; }
    function updateShopCalc(){ const kind=shop.item.value, qty=+shop.qty.value||1; shop.pricePer.textContent=unitPrice(kind); shop.total.textContent=unitPrice(kind)*qty; }
    async function confirmBuy(){
      const item=shop.item.value, qty=+shop.qty.value||1;
      const unit=unitPrice(item), need=unit*qty;
      const inv = getPotatoInv();
      if(inv.token < need){ alert('토큰이 부족합니다.'); return; }
      shop.btn.disabled=true;

      if(NET_OK){
        try{
          const data = await j('/api/corn/buy-additive', { kakaoId, item, qty });
          if(data.wallet?.orcx!=null) inv.token = data.wallet.orcx;
          if(item==='seed'){
            inv.seed = data.seeds ?? (inv.seed + qty);
            S.seed = inv.seed;
          }else{
            if(data.additives){ inv.salt=data.additives.salt ?? inv.salt; inv.sugar=data.additives.sugar ?? inv.sugar; }
            S.salt=inv.salt; S.sugar=inv.sugar;
          }
          setPotatoInv(inv); save(); renderAll(); closeShop(); toast('구매 완료'); return;
        }catch(e){}
      }
      // 로컬 폴백
      inv[item] = (inv[item]||0) + qty; inv.token -= need;
      setPotatoInv(inv);
      if(item==='seed') S.seed=inv.seed; else if(item==='salt') S.salt=inv.salt; else S.sugar=inv.sugar;
      save(); renderAll(); closeShop(); toast('구매 완료(로컬)');
    }

    /* ====== UI 바인딩 ====== */
    $('btnW').onclick=()=>give('w'); $('btnF').onclick=()=>give('f'); $('tick').onclick=tick; $('harv').onclick=harvest; $('plant').onclick=plant; $('pop').onclick=popCorn;
    $('pickSalt').onclick=()=>{ if(S.sel==='salt') openShop('salt'); else { S.sel='salt'; renderRes(); save(); } };
    $('pickSugar').onclick=()=>{ if(S.sel==='sugar') openShop('sugar'); else { S.sel='sugar'; renderRes(); save(); } };
    $('syncPotato').onclick=syncFromPotato; $('buySeed').onclick=()=>openShop('seed');

    const $btnGate=$('btnGate'), $gate=$('gate'), $gateBackdrop=$('gateBackdrop'), $closeGate=$('closeGate');
    function openGate(){ $gate.classList.add('open'); $gateBackdrop.classList.add('show'); $btnGate.setAttribute('aria-expanded','true'); }
    function closeGate(){ $gate.classList.remove('open'); $gateBackdrop.classList.remove('show'); $btnGate.setAttribute('aria-expanded','false'); }
    $btnGate.onclick=()=>($gate.classList.contains('open')?closeGate():openGate());
    $closeGate.onclick=closeGate; $gateBackdrop.onclick=closeGate; window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeGate(); });

    document.getElementById('navBack').addEventListener('click', (e)=>{ e.preventDefault(); history.back(); });

    function toast(msg){ $toast.textContent=msg; $toast.classList.add('show'); setTimeout(()=>{$toast.classList.remove('show')},1400); }

    /* ====== 부팅 ====== */
    (function boot(){
      document.body.style.backgroundImage = `url('${IMG('farm_05.png')}')`;
      renderAll();
      setInterval(tick, 5000);
      loadFromServer();
    })();

    /* ====== 심기 ====== */
    function plant(){
      if(S.phase==='GROW'){ alert('이미 성장 중입니다.'); return; }
      if(S.seed<1){ alert('씨앗이 없습니다.'); return; }
      S.seed--; S.phase='GROW'; S.g=0; save(); renderAll(); toast('씨앗을 심었습니다.');
    }
  </script>
</body>
</html>
