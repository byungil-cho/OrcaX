<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>옥수수 농장</title>
<style>
:root{ --ink:#eef6ee; --glass:rgba(0,0,0,.45); --bd:rgba(255,255,255,.18); --ok:#25d366; }
html,body{ height:100%; margin:0; color:var(--ink); background:transparent;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif; }
#bg{ position:fixed; inset:0; z-index:0; background:url('img/a_farm_01.png') center/cover no-repeat; }

header{ position:fixed; left:10px; right:10px; top:10px; z-index:9;
  backdrop-filter:blur(6px); background:var(--glass); border:1px solid var(--bd);
  border-radius:14px; padding:8px 10px; }
.topline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-start; }
.status{ width:8px; height:8px; border-radius:999px; background:#ef4444 }
.status.ok{ background:var(--ok) }
.nick{ font-weight:800; max-width:42vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.badge{ display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; border:1px solid var(--bd); background:rgba(0,0,0,.35); font-size:14px; }
.badge .ico{ font-style:normal; opacity:.9 }
.badge .val{ font-weight:800 }
#btn-shop{ cursor:pointer; padding:6px 10px; border-radius:999px; border:1px solid var(--bd); background:rgba(0,0,0,.35); font-weight:700; }

main{ position:relative; z-index:1; height:100%; display:flex; align-items:flex-end; justify-content:center; }
#hud{ position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:center; }
#hud .panel{ width:min(1024px,96vw); margin:0 auto 18px; border-radius:18px; border:1px solid var(--bd); background:rgba(0,0,0,.35); padding:12px; backdrop-filter:blur(6px); }
.row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.mini{ display:flex; align-items:center; gap:10px; }
.mini .cap{ width:60px; text-align:center; font-weight:900; opacity:.9 }
.mini img{ width:100px; height:100px; object-fit:cover; border-radius:12px; border:1px solid var(--bd); box-shadow:0 4px 16px rgba(0,0,0,.25); background:#000; }
.bars{ display:flex; align-items:center; gap:14px; }
.vbar{ width:10px; height:88px; border-radius:99px; background:rgba(255,255,255,.15); position:relative; overflow:hidden; border:1px solid var(--bd); }
.vbar .fill{ position:absolute; left:0; bottom:0; width:100%; height:var(--p,0%); background:linear-gradient(#9cf, #48f); transition:height .25s ease; }
.vbar .cap{ position:absolute; left:0; right:0; bottom:100%; transform:translateY(-6px); text-align:center; font-size:12px; opacity:.9 }
.gauge .fill{ background:linear-gradient(#3ff, #0dd) }
.water .fill{ background:linear-gradient(#8ec5ff, #4287ff) }
.fert .fill{ background:linear-gradient(#baf7b2, #57c84d) }
#miniCap{ text-align:center; font-weight:800; opacity:.95 }

.controls{ margin-top:10px; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.controls button{ padding:14px 10px; border-radius:12px; border:1px solid var(--bd); background:rgba(0,0,0,.4); color:var(--ink); font-weight:800; cursor:pointer; }
.controls button:disabled{ opacity:.5; cursor:not-allowed; }
@media (max-width: 768px){
  .controls{ grid-template-columns:repeat(2,1fr); }
  .mini img{ width:86px; height:86px; }
}

/* 토스트 */
#toast{ position:fixed; left:50%; bottom:40px; transform:translateX(-50%); z-index:99; }
.toast{ background:rgba(0,0,0,.65); padding:10px 14px; border-radius:10px; border:1px solid var(--bd); margin-top:8px; }

/* 상점 모달 */
#shopModal{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:20; }
#shopModal .box{ width:min(420px,90vw); background:rgba(0,0,0,.6); border:1px solid var(--bd); border-radius:16px; padding:16px; }
#shopModal .row{ gap:12px; }
#shopModal label{ width:36% }
#shopModal select,#shopModal input{ flex:1; padding:8px; border-radius:10px; border:1px solid var(--bd); background:rgba(0,0,0,.4); color:var(--ink) }
#shopTotal{ font-weight:900 }
</style>
</head>
<body>
<div id="bg"></div>

<header>
  <div class="topline">
    <span id="net" class="status"></span>
    <span id="netTxt" class="nick">오프라인</span>

    <span class="badge"><i class="ico">🌱</i> 씨앗 <b id="r-seeds" class="val">0</b></span>
    <span class="badge"><i class="ico">💧</i> 물 <b id="r-water" class="val">0</b></span>
    <span class="badge"><i class="ico">🌱</i> 거름 <b id="r-fert" class="val">0</b></span>
    <span class="badge"><i class="ico">🌽</i> 옥수수 <b id="r-corn" class="val">0</b></span>
    <span class="badge"><i class="ico">🍿</i> 팝콘 <b id="r-pop" class="val">0</b></span>
    <span class="badge"><i class="ico">🧂</i> 소금 <b id="r-salt" class="val">0</b></span>
    <span class="badge"><i class="ico">🍬</i> 설탕 <b id="r-sugar" class="val">0</b></span>
    <span class="badge"><i class="ico">🪙</i> 토큰 <b id="r-orcx" class="val">0</b></span>

    <button id="btn-shop" class="right">구매</button>
  </div>
</header>

<main>
  <div id="hud">
    <div class="panel">
      <div class="row">
        <div class="mini">
          <div class="cap" id="miniCap">휴경</div>
          <img id="mini" src="img/corn_idle.png" alt="mini" />
        </div>

        <div class="bars">
          <div class="vbar gauge"><div id="gfill" class="fill" style="--p:0%"></div><div class="cap"><span id="gnum">0</span></div></div>
          <div class="vbar water"><div id="wfill" class="fill" style="--p:0%"></div><div class="cap">💧</div></div>
          <div class="vbar fert"><div id="ffill" class="fill" style="--p:0%"></div><div class="cap">🌱</div></div>
        </div>
      </div>

      <div class="controls">
        <button id="btn-plant">씨앗 심기</button>
        <button id="btn-water">물 주기</button>
        <button id="btn-fert">거름 주기</button>
        <button id="btn-harv">수확</button>
        <button id="btn-pop">뻥튀기</button>
        <button id="btn-ex">팝콘→거름</button>
      </div>
    </div>
  </div>
</main>

<!-- 상점 모달 -->
<div id="shopModal">
  <div class="box">
    <h3 style="margin-top:0">상점</h3>
    <div class="row"><label>항목</label>
      <select id="shopItem">
        <option value="salt">소금</option>
        <option value="sugar">설탕</option>
        <option value="seed">씨옥수수</option>
      </select>
    </div>
    <div class="row"><label>수량</label><input id="shopQty" type="number" min="1" step="1" value="1" /></div>
    <div class="row"><label>지갑</label><div id="shopWallet">0</div></div>
    <div class="row"><label>합계</label><div id="shopTotal">0</div></div>
    <div class="row" style="justify-content:flex-end; gap:8px">
      <button id="shopClose">닫기</button>
      <button id="shopConfirm">구매</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ===== 유틸 ===== */
const isMobile = matchMedia('(max-width: 768px)').matches;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const H=(h)=>Number(h)*3600*1000;
const LKEY_HARV='orcax:corn:last-harvest';

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=String(msg||''); document.getElementById('toast').appendChild(t); setTimeout(()=>t.remove(),1800); }
function setNet(ok,msg){ const el=document.getElementById('net'); el.classList.toggle('ok',!!ok); const t=document.getElementById('netTxt'); if(t) t.textContent=msg||''; }
function setBG(file){ document.getElementById('bg').style.backgroundImage=`url('${file}')`; }
function setMini(file){ document.getElementById('mini').src=file; }
function dayNumber(ts){ const ms=Date.now()-(new Date(ts||Date.now())).getTime(); return Math.max(1,Math.ceil(ms/(24*3600*1000))); }

/* ===== API ===== */
const DEFAULT_ORIGIN=(localStorage.getItem('orcax:BASE_API')||'').trim() || 'https://climbing-wholly-grouper.jp.ngrok.io';
const BASE_ORIGIN=DEFAULT_ORIGIN.replace(/\/+$/,'').replace(/\/api\/?$/i,'');
const API=(p)=>`${BASE_ORIGIN}/api/${String(p||'').replace(/^\/+/,'')}`;
async function jfetch(url,{method='GET',query,body,headers}={}){
  let u=url;
  if(query && typeof query==='object'){
    const qs=new URLSearchParams(); for(const[k,v] of Object.entries(query)) if(v!==undefined&&v!==null) qs.set(k,String(v));
    const q=qs.toString(); if(q) u+=(u.includes('?')?'&':'?')+q;
  }
  const opts={method,headers:Object.assign({'Accept':'application/json'},headers||{})};
  if(body!==undefined&&body!==null){opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body);}
  const r=await fetch(u,Object.assign(opts,{mode:'cors',cache:'no-store'}));
  const t=await r.text(); const isJson=(r.headers.get('content-type')||'').includes('application/json');
  const data=t?(isJson?JSON.parse(t):{raw:t}):{};
  if(!r.ok){ const err=new Error(`HTTP ${r.status}`); err.status=r.status; err.data=data; throw err; }
  return data;
}

const api={
  userdata:(kakaoId,nickname)=>jfetch(API('userdata'),{method:'POST',body:{kakaoId,nickname}}),
  cornSummary:(kakaoId)=>jfetch(API('corn/summary'),{method:'GET',query:{kakaoId}}),
  plant:(kakaoId)=>jfetch(API('corn/plant'),{method:'POST',body:{kakaoId}}),
  grow:(kakaoId,step=5)=>jfetch(API('corn/grow'),{method:'POST',body:{kakaoId,step}}),
  harvest:(kakaoId)=>jfetch(API('corn/harvest'),{method:'POST',body:{kakaoId}}),
  pop:(kakaoId,cost=30)=>jfetch(API('corn/pop'),{method:'POST',body:{kakaoId,tokenCost:cost}}),
  exchange:(kakaoId,qty=1,dir)=>jfetch(API('corn/exchange'),{method:'POST',body:{kakaoId,qty,dir}}),
  /* ✅ buy-additive: seed(단수)로 전송. 서버가 seeds여도 미들웨어가 seed로 바꿔줌 */
  buyAdditive:(kakaoId,type,qty)=>{
    const item = (type==='seeds' ? 'seed' : type); // 혹시 값이 잘못 들어와도 방어
    return jfetch(API('corn/buy-additive'),{ method:'POST', body:{kakaoId, type:item, item, qty, amount:qty }});
  },
  state:(kakaoId)=>jfetch(API('corn/state'),{method:'GET',query:{kakaoId}}),   // [ADD-ONLY] 폴백용
  priceboard:()=>jfetch(API('corn/priceboard'),{method:'GET'})
};

/* 로그인 */
const kakaoId=localStorage.getItem('kakaoId');
const nickname=localStorage.getItem('nickname')||localStorage.getItem('kakaoNickname');
if(!kakaoId||!nickname){
  document.addEventListener('DOMContentLoaded',()=>{const t=document.getElementById('netTxt'); if(t)t.textContent='로그인 필요';});
  alert('로그인이 필요합니다. (index9.html로 이동)'); location.href='index9.html';
}

/* 페인트 */
function paintFromUser(user){
  if(!user) return; S.user=user;
  document.getElementById('nick').textContent=user.nickname||nickname||'';
  document.getElementById('r-water').textContent=Number(user.inventory?.water||0);
  document.getElementById('r-fert').textContent =Number(user.inventory?.fertilizer||0);
  // ✅ seeds/seed 어느 쪽이 와도 반영
  const seedCount = Number(user.agri?.seeds ?? user.agri?.seed ?? 0);
  document.getElementById('r-seeds').textContent=seedCount;
  document.getElementById('r-corn').textContent =Number(user.agri?.corn||0);
  document.getElementById('r-pop').textContent  =Number(user.food?.popcorn||0);
  document.getElementById('r-salt').textContent =Number(user.additives?.salt||0);
  document.getElementById('r-sugar').textContent=Number(user.additives?.sugar||0);
  const orcx=Number(user.wallet?.orcx ?? user.orcx ?? 0); S.orcx=orcx; document.getElementById('r-orcx').textContent=orcx|0;
}
function paintFromCorn(raw){
  if(!raw) return; const s=normalizeSummary(raw); S.summary=s;
  const g=clamp(Number(s.g||0),0,100);
  document.getElementById('gfill').style.setProperty('--p', g+'%');
  document.getElementById('gnum').textContent=g|0;
  applyVisualsServerFirst(s);

  // [ADD-ONLY] corn summary → 상단 HUD 동기화
  if (s && s.agri) {
    const seedFromSummary = Number(s.agri.seeds ?? s.agri.seed ?? NaN);
    if (!Number.isNaN(seedFromSummary)) document.getElementById('r-seeds').textContent = seedFromSummary|0;
    if (s.agri.corn       != null) document.getElementById('r-corn').textContent = Number(s.agri.corn)|0;
  }
  if (s && s.food && s.food.popcorn != null) { document.getElementById('r-pop').textContent = Number(s.food.popcorn)|0; }
  if (s && s.additives) {
    if (s.additives.salt  != null) document.getElementById('r-salt').textContent  = Number(s.additives.salt)|0;
    if (s.additives.sugar != null) document.getElementById('r-sugar').textContent = Number(s.additives.sugar)|0;
  }

  updateBars(s.meters.growPct,s.meters.waterPct,s.meters.fertPct);
  refreshControls();
}

/* 이벤트 */
async function onPlant(){ try{ const r=await api.plant(kakaoId); localStorage.removeItem(LKEY_HARV); await loadAll(); toast('심기 완료'); }catch(e){ console.error(e); toast(e.data?.error||'심기 실패'); } }
async function onWater(){ try{ await api.grow(kakaoId,5); timersAddWater(); await loadAll(); toast('물 1회'); }catch(e){ console.error(e); toast(e.data?.error||'물 주기 실패'); } }
async function onFert(){ try{ await api.grow(kakaoId,7); timersAddFert(); await loadAll(); toast('거름 1회'); }catch(e){ console.error(e); toast(e.data?.error||'거름 주기 실패'); } }
async function onHarv(){ try{ await api.harvest(kakaoId); localStorage.setItem(LKEY_HARV,String(Date.now())); S.summary=Object.assign({},S.summary||{}, { phase:'STUBBLE', g:0 }); await loadAll(); toast('수확 완료'); }catch(e){ console.error(e); toast(e.data?.error||'수확 실패'); } }
async function onPop(){ try{ await api.pop(kakaoId,30); await loadAll(); toast('팝콘 생산'); }catch(e){ console.error(e); toast(e.data?.error||'뻥튀기 실패'); } }
async function onExchange(){ toast('교환 UI는 추후 적용'); }

document.getElementById('btn-plant').onclick=onPlant;
document.getElementById('btn-water').onclick=onWater;
document.getElementById('btn-fert').onclick=onFert;
document.getElementById('btn-harv').onclick=onHarv;
document.getElementById('btn-pop').onclick=onPop;
document.getElementById('btn-ex').onclick=onExchange;

/* 로드 */
async function loadAll(){
  try{
    const [ud,cs,prices]=await Promise.all([
      api.userdata(kakaoId,nickname),
      api.cornSummary(kakaoId),
      api.priceboard().catch(()=>null)
    ]);
    const user=ud.user||ud.data||ud; paintFromUser(user); paintFromCorn(cs); setNet(true,'온라인');
    // [ADD-ONLY] summary에 씨앗값이 없으면 corn/state로 보강해 HUD 반영
    try {
      if (!cs?.agri || (cs.agri.seeds == null && cs.agri.seed == null)) {
        const st = await api.state(kakaoId);
        if (st && typeof st.seeds === 'number') {
          document.getElementById('r-seeds').textContent = st.seeds|0;
        }
      }
    } catch(_) {}

    // ✅ 가격판 동기화 (seed 우선, 혹시 서버가 seeds로 줄 때도 반영)
    if(prices && prices.price){
      const p=prices.price;
      S.price={
        salt : Number(p.salt  ?? S.price.salt),
        sugar: Number(p.sugar ?? S.price.sugar),
        seed : Number((p.seed ?? p.seeds) ?? S.price.seed)
      };
    }
    updateShopLabels();
  }catch(e){
    setNet(false,'연결 실패'); console.error(e); toast('서버 연결 실패');
    updateShopLabels(); // 오프라인 기본가
  }
}

/* === 상점(구매) === */
const LABEL={salt:'소금',sugar:'설탕',seed:'씨옥수수'}; // ✅ seed 라벨
const shopModal=document.getElementById('shopModal'), shopItem=document.getElementById('shopItem'),
      shopQty=document.getElementById('shopQty'), shopWallet=document.getElementById('shopWallet'),
      shopTotal=document.getElementById('shopTotal');

function updateShopLabels(){
  // 옵션 라벨에 서버 가격 반영
  [...shopItem.options].forEach(opt=>{
    const t=opt.value; const price=S.price?.[t] ?? S.price?.seed;
    if(typeof price==='number' && !Number.isNaN(price)){
      const base=LABEL[t]||t; opt.textContent=`${base} (x1 = ${price})`;
    }
  });
  const orcx=S.orcx|0; shopWallet.textContent=`${orcx}`;
  updateShopTotal();
}
function updateShopTotal(){
  const t=shopItem.value; const q=Number(shopQty.value||1)|0;
  const price=S.price?.[t] ?? S.price?.seed ?? 100;
  shopTotal.textContent=String(price*q);
}
function openShop(){ updateShopLabels(); shopModal.style.display='flex'; }
function closeShop(){ shopModal.style.display='none'; }
async function confirmShop(){
  const item=shopItem.value; const qty=Number(shopQty.value||1)|0;
  if(qty<=0) return;
  try{
    const r=await api.buyAdditive(kakaoId,item,qty);
    if(r && r.ok){
      await loadAll(); toast('구매 완료');
    }else toast('구매 실패');
  }catch(e){
    console.error(e);
    if(e.status===402) toast('잔액 부족');
    else toast(e?.data?.error || e.message || '구매 실패');
  }
}

/* 이벤트 바인딩(상점) */
document.getElementById('btn-shop').addEventListener('click', openShop);
document.getElementById('shopClose').addEventListener('click', closeShop);
document.getElementById('shopConfirm').addEventListener('click', confirmShop);
shopItem.addEventListener('change', updateShopTotal);
shopQty.addEventListener('input', updateShopTotal);

/* 시작 */
document.addEventListener('DOMContentLoaded', async ()=>{
  await loadAll();
  setInterval(async ()=>{ try{ const cs=await api.cornSummary(kakaoId); paintFromCorn(cs); }catch(e){ console.warn('summary poll failed',e); } }, 15000);
});

/* ===== 상태/비주얼 관련 함수들 ===== */
const S={summary:null, user:null, price:{salt:100,sugar:100,seed:100}, orcx:0};

function normalizeSummary(raw){
  const s=raw||{}, assets=s.assets||{};
  return {
    phase:s.phase||'IDLE', g:Number(s.g??0), plantedAt:s.plantedAt||null, season:s.season||null,
    meters:{ waterPct:Number(s.meters?.waterPct??s.waterPct??NaN), fertPct:Number(s.meters?.fertPct??NaN), growPct:Number(s.meters?.growPct??s.g??NaN) },
    assetBg:assets.bg||s.bg||null, assetMini:assets.mini||s.mini||null,
    agri:s.agri||{}, food:s.food||{}, additives:s.additives||{}, wallet:s.wallet||{}
  };
}

/* 비주얼 적용 */
function resolveBgFile(ns){
  if(ns.assetBg) return ns.assetBg;
  if(ns.season && BG_BY_SEASON[ns.season]){const m=BG_BY_SEASON[ns.season]; return isMobile?m.m:m.pc;}
  const harvAt=Number(localStorage.getItem(LKEY_HARV)||0);
  const inRest=(harvAt&&(Date.now()-harvAt)<H(24));
  if(inRest) return (isMobile?BG_FALLBACK.rest.m:BG_FALLBACK.rest.pc);
  if(ns.phase==='IDLE'||ns.phase==='STUBBLE') return (isMobile?BG_FALLBACK.idle.m:BG_FALLBACK.idle.pc);
  const d=dayNumber(ns.plantedAt); if(d===1) return (isMobile?BG_BY_DAY[1].m:BG_BY_DAY[1].pc);
  if(d===2) return (isMobile?BG_BY_DAY[2].m:BG_BY_DAY[2].pc);
  if(d===3) return (isMobile?BG_BY_DAY[3].m:BG_BY_DAY[3].pc);
  if(d===4) return (isMobile?BG_BY_DAY[4].m:BG_BY_DAY[4].pc);
  if(d>=5) return (isMobile?BG_BY_DAY[5].m:BG_BY_DAY[5].pc);
  return (isMobile?BG_FALLBACK.idle.m:BG_FALLBACK.idle.pc);
}

function applyVisualsServerFirst(ns){
  const bg=resolveBgFile(ns); setBG(bg);
  const mini=ns.assetMini || 'img/corn_idle.png'; setMini(mini);
  if(ns.phase==='GROW'){ document.getElementById('miniCap').textContent='성장중'; }
  else if(ns.phase==='STUBBLE'){ document.getElementById('miniCap').textContent='휴농(수확 완료)'; }
  else { document.getElementById('miniCap').textContent='휴경'; }
}
function updateBars(g,w,f){
  const gp=clamp(Number(g||0),0,100), wp=clamp(Number(w||0),0,100), fp=clamp(Number(f||0),0,100);
  document.getElementById('gfill').style.setProperty('--p', gp+'%');
  document.getElementById('wfill').style.setProperty('--p', wp+'%');
  document.getElementById('ffill').style.setProperty('--p', fp+'%');
}
function refreshControls(){ /* 필요한 경우 버튼 enable/disable 추가 */ }

/* 배경 맵 */
const BG_FALLBACK={ idle:{pc:'img/a_farm_01.png',m:'img/m_farm_01.png'}, rest:{pc:'img/a_farm_06.png',m:'img/m_farm_06.png'} };
