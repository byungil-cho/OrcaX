<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>옥수수 엔진 Demo (index8)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>🌽 옥수수 엔진 데모</h1>

  <!-- 농장 배경 -->
  <div id="farm-bg">
    <img id="farmImg" src="img/farm_01.png" alt="farm background">
  </div>

  <!-- 옥수수 성장 -->
  <div id="corn-stage">
    <img id="cornImg" src="img/a_corn_06_01.png" alt="corn stage">
  </div>

  <!-- 캐릭터 -->
  <div id="character">
    <img id="charImg" src="img/a_mark_01.png" alt="character level">
  </div>

  <!-- 게이지 -->
  <div id="gauges">
    <progress id="waterGauge" value="3" max="3"></progress> 물
    <progress id="fertGauge" value="3" max="3"></progress> 거름
    <progress id="growGauge" value="0" max="5"></progress> 성장
  </div>

  <!-- 버튼 -->
  <div id="controls">
    <button onclick="Engine.plant()">씨앗 심기</button>
    <button onclick="Engine.grow()">성장</button>
    <button onclick="Engine.harvest()">수확</button>
    <button onclick="Engine.puff()">뻥튀기</button>
    <button onclick="Engine.exchange()">교환</button>
  </div>

  <!-- 상태 -->
  <div id="status">
    <p>💰 토큰: <span id="tokens">0</span></p>
    <p>🍿 팝콘: <span id="popcorn">0</span></p>
    <p>📈 레벨: <span id="level">1</span></p>
  </div>

  <!-- 로그 -->
  <div id="log"></div>

  <!-- 엔진 모듈 불러오기 -->
  <script src="js/growth.js"></script>
  <script src="js/harvest.js"></script>
  <script src="js/puffed.js"></script>
  <script src="js/exchange.js"></script>
  <script src="js/level.js"></script>
  <script src="js/reward.js"></script>
  <script src="js/engine.js"></script>

  <script>
    // 여기서 Engine 객체가 각 모듈 기능을 호출하도록 연결
    const Engine = {
      plant: () => { Growth.plant(); },
      grow: () => { Growth.advance(); },
      harvest: () => { Harvest.do(); },
      puff: () => { Puffed.run(); },
      exchange: () => { Exchange.run(); }
    };
  </script>
</body>
</html>
