<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장</title>
  <base href="/OrcaX/">
  <meta name="theme-color" content="#000000" />
  <style>
    :root{--ink:#eef6ee;--panel:rgba(0,0,0,.45);--bd:rgba(255,255,255,.16);--ok:#25d366;--accent:#8ed36b}
    html,body{height:100%;margin:0;color:var(--ink);background:#...stem-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif}
    .glass{backdrop-filter:saturate(1.05) blur(6px);background:var(--panel);border:1px solid var(--bd);border-radius:14px}
    .top{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:10px;align-items:center;padding:10px 12px;z-index:3}
    .title{margin:0;font-size:16px}
    .status{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px}
...
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top glass">
      <h1 class="title">옥수수 농장</h1>
      <div class="status"><span id="diag">-</span> <span id="net" class="pill"><span id="netDot" class="dot"></span><span id="netTxt">오프라인</span></span></div>
    </header>

    <aside class="bank">
      <span class="pill">🪙 <b id="bankToken" class="count">0</b></span>
      <span class="pill">🍿 <b id="bankPop" class="count">0</b></span>
    </aside>

    <aside class="hud-left">
      <div class="panel glass gate-dock">
        <button id="btnGate" class="btn">성장 게이트</button>
        <div id="gate" class="gate" aria-hidden="true">
          <div class="card glass">
            <button id="closeGate" class="close">✕</button>
            <h3>성장 게이트</h3>
            <div class="bars">
              <div class="bar w"><div id="fillW" class="fill" style="height:0%"></div></div>
              <div class="bar f"><div id="fillF" class="fill" style="height:0%"></div></div>
              <div class="bar g"><div id="fillG" class="fill" style="height:0%"></div></div>
            </div>
            <div class="row" style="margin-top:6px">
              <span>성장률: <b id="gVal">0</b>%</span>
              <span id="gState" style="opacity:.8">-</span>
            </div>
            <div class="row" style="margin-top:8px;gap:12px;align-items:center">
              <button id="tick" class="btn">⏱️ 시간경과(테스트)</button>
              <div style="position:relative;flex:1">
                <div class="gate-line" style="top:20%"></div>
                <div class="gate-line" style="top:50%"></div>
                <div class="gate-line" style="top:80%"></div>
              </div>
            </div>
            <div id="gatePreview" class="gate-preview"><img id="gatePreviewImg" alt="char" /><div id="gateLv">Lv1</div></div>
          </div>
        </div>
      </div>

      <div class="panel glass">
        <h3>농자재</h3>
        <div class="row"><span>물</span><span><b id="w" class="count">0</b></span></div>
        <div class="row"><span>거름</span><span><b id="f" class="count">0</b></span></div>
        <div class="row"><span>옥수수</span><span><b id="c" class="count">0</b></span></div>
        <div class="row"><span>씨앗</span><span><b id="seed" class="count">0</b></span></div>
        <div class="grid" style="margin-top:8px">
          <button id="plant" class="btn">파종</button>
          <button id="harv" class="btn">수확</button>
          <button id="btnW" class="btn">물 주기</button>
          <button id="btnF" class="btn">거름 주기</button>
        </div>
      </div>
    </aside>

    <aside class="hud-right">
      <div class="panel glass">
        <div class="row"><span>씨옥수수(씨앗)</span><span><b id="seed" class="count">0</b> <button class="btn" id="buySeed">구매</button></span></div>
        <hr style="border:none;border-top:1px solid rgba(255,255,255,.15);margin:8px 0" />
        <div class="row"><span>물</span><span><b id="w" class="count">0</b> <button class="btn" id="btnW">물 주기</button></span></div>
        <div class="row"><span>거름</span><span><b id="f" class="count">0</b> <button class="btn" id="btnF">거름 주기</button></span></div>
        <div class="row"><span>옥수수</span><span><b id="c" class="count">0</b></span></div>
        <hr style="border:none;border-top:1px solid rgba(255,255,255,.15);margin:8px 0" />
        <div class="row-col">
          <div>
            <div style="font-size:13px;opacity:.92;margin-bottom:6px">첨가물 (선택: 클릭 / 구매: 같은 버튼 다시 클릭)</div>
            <div class="row" style="gap:8px;justify-content:flex-start">
              <button id="pickSalt" class="chip">소금 <span id="saltCount" class="count">0</span></button>
              <button id="pickSugar" class="chip">설탕 <span id="sugarCount" class="count">0</span></button>
            </div>
          </div>
          <button class="btn" id="syncPotato">동기화</button>
        </div>
        <div class="row" style="margin-top:8px">
          <span>뻥튀기</span>
          <button class="btn" id="pop" disabled>튀기기</button>
        </div>
      </div>
    </aside>

    <div class="mini-wrap">
      <a class="nav" href="corn-index.html" title="메인으로">🏠</a>
      <img id="mini" class="mini" alt="작물 상태" />
      <a class="nav" title="감자 농장" href="https://byungil-cho.github.io/OrcaX/index9.html">🥔</a>
      <div class="mini-cap" id="miniCap">겨울 · 슬롯1</div>
    </div>
  </div>

  <div id="gateBackdrop" class="backdrop"></div>

  <div id="shop" role="dialog" aria-modal="true" class="glass" style="display:none">
    <h3>구매/첨가물</h3>
    <div class="row"><label>항목</label><select id="shopItem"><option value="seed">씨옥수수</option><option value="salt">소금</option><option value="sugar">설탕</option></select></div>
    <div class="row"><label>수량</label><input id="shopQty" type="number" min="1" value="1" style="width:80px" /><span>개</span></div>
    <div class="row"><span>단가: <b id="shopPricePer" class="count">0</b> ORCX</span><span>총액: <b id="shopTotal" class="count">0</b> ORCX</span></div>
    <div class="row"><span>보유 ORCX: <b id="shopOrcx" class="count">0</b></span></div>
    <div class="row" style="justify-content:flex-end; gap:8px"><button id="shopCancel" class="btn">취소</button><button id="shopBuyBtn" class="btn">구매</button></div>
  </div>

  <div id="toast" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:rgba(0,0,0,.65);backdrop-filter:saturate(1.05) blur(6px);color:#fff;font-size:13px;display:none;z-index:99999"></div>

  <script>
    /* 원본 JS (서버 연동/카카오/닉네임/인벤토리) — 내용 생략 표시(...)는 업로드 본문 그대로 유지 */
    // ... 기존 스크립트 전체가 여기에 있음 ...
  </script>

  <!-- === ADD-ONLY: Mobile Popup Layer (no edits to existing code) === -->
  <style>
  @media (max-width: 900px){
    .top, .bank { display:none !important; }
    #mWrap{
      position:fixed; left:50%; top:10px; bottom:10px; transform:translateX(-50%);
      width:min(480px, calc(100vw - 20px));
      display:flex; flex-direction:column; gap:8px;
      border-radius:18px; border:1px solid rgba(255,255,255,.22);
      background:rgba(0,0,0,.18); backdrop-filter:saturate(1.05) blur(8px);
      box-shadow:0 18px 40px rgba(0,0,0,.45); overflow:hidden; z-index:9999;
    }
    #mHdr{ flex:0 0 auto; padding:8px 10px; border-bottom:1px solid rgba(255,255,255,.18);
           display:flex; align-items:center; justify-content:space-between; gap:8px; color:#fff; font-size:14px; white-space:nowrap; }
    #mHdr .who{ font-weight:700; overflow:hidden; text-overflow:ellipsis; max-width:46vw; }
    #mHdr .pill{ display:inline-flex; gap:6px; align-items:center; padding:4px 8px; border-radius:999px;
                 border:1px solid rgba(255,255,255,.22); background:rgba(0,0,0,.28); font-size:12px; }
    #mHdr .dot{ width:8px; height:8px; border-radius:999px; background:#ef4444 } .dot.ok{ background:#25d366 }

    #mBar{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:8px 10px 0 10px; }
    #mBar .mbtn{ border:1px solid rgba(255,255,255,.22); background:rgba(0,0,0,.28); color:#fff;
                 border-radius:12px; padding:8px 6px; font-size:13px; line-height:1.1; }

    #mBody{ position:relative; flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:8px 10px; }

    #mOverlay{ position:absolute; inset:0; background:rgba(0,0,0,.35);
               opacity:0; pointer-events:none; transition:.18s ease; z-index:70; }
    #mWrap.pop #mOverlay{ opacity:1; pointer-events:auto; }

    .msec{ display:none; }
    .msec.pop{
      display:block; position:absolute; left:50%; transform:translateX(-50%);
      top:56px; bottom:60px; width:min(460px,94vw);
      overflow-y:auto; overflow-x:hidden;
      border-radius:16px; border:1px solid rgba(255,255,255,.22);
      background:rgba(0,0,0,.28); backdrop-filter:saturate(1.05) blur(8px);
      padding:10px; box-shadow:0 18px 40px rgba(0,0,0,.45); z-index:75;
    }

    .hud-left, .hud-right { position:static !important; bottom:auto; left:auto; right:auto; }

    #mSecGate #gate{ position:static !important; display:block !important; }
    #mSecGate .gate .card{ min-width:auto; width:100%; }

    #mMini{ position:sticky; bottom:8px; z-index:80; }
    #mMini .mini-wrap{
      position:static !important; display:grid; justify-items:center;
      background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.22);
      border-radius:16px; padding:8px; width:100%;
    }

    html,body{ overflow-x:hidden; }
  }
  </style>

  <script>
  (function(){
    const mq = window.matchMedia('(max-width: 900px)');
    if(!mq.matches) return;
    if(document.getElementById('mWrap')) return; // once

    const wrap = document.createElement('div'); wrap.id='mWrap';
    const hdr  = document.createElement('div'); hdr.id='mHdr';
    hdr.innerHTML =
      '<span class="who" id="mWho"></span>' +
      '<span style="display:flex;gap:8px;align-items:center">' +
        '<span class="pill">🪙 <b id="mTok">0</b></span>' +
        '<span class="pill">🍿 <b id="mPop">0</b></span>' +
        '<span class="pill"><span id="mDot" class="dot"></span> <span id="mNet">오프라인</span></span>' +
      '</span>';
    const bar  = document.createElement('div'); bar.id='mBar';
    bar.innerHTML =
      '<button class="mbtn" data-tgt="FARM">농사짓기</button>'+
      '<button class="mbtn" data-tgt="GATE">성장게이트</button>'+
      '<button class="mbtn" data-tgt="SHOP">구매/첨가물</button>'+
      '<button class="mbtn" data-tgt="SYNC">동기화</button>';
    const body = document.createElement('div'); body.id='mBody';
    const ov   = document.createElement('div'); ov.id='mOverlay';

    const sFarm = document.createElement('div'); sFarm.id='mSecFarm'; sFarm.className='msec';
    const sGate = document.createElement('div'); sGate.id='mSecGate'; sGate.className='msec';
    const sMini = document.createElement('div'); sMini.id='mMini';
    body.appendChild(sFarm); body.appendChild(sGate); body.appendChild(sMini);

    wrap.appendChild(hdr); wrap.appendChild(bar); wrap.appendChild(body); wrap.appendChild(ov);
    document.body.appendChild(wrap);

    // Move existing DOM (no clone)
    const rightPanel = document.querySelector('.hud-right .panel'); if(rightPanel) sFarm.appendChild(rightPanel);
    const leftPanel  = document.querySelector('.hud-left .panel'); if(leftPanel) sFarm.appendChild(leftPanel);
    const gateDock   = document.querySelector('.hud-left .gate-dock'); if(gateDock) sGate.appendChild(gateDock);
    const gate       = document.getElementById('gate'); if(gate) sGate.appendChild(gate);
    const miniWrap   = document.querySelector('.mini-wrap'); if(miniWrap) sMini.appendChild(miniWrap);

    // Header sync using existing localStorage (no changes to logic)
    function syncHdr(){
      try{
        const name = localStorage.getItem('nickname') || localStorage.getItem('kakaoNickname') || '(로그인 필요)';
        const inv  = JSON.parse(localStorage.getItem('potato_inv')||'{}');
        document.getElementById('mWho').textContent = name;
        document.getElementById('mTok').textContent = inv.token ?? 0;
        document.getElementById('mPop').textContent = inv.popcorn ?? 0;
        const ok = document.getElementById('netDot')?.classList.contains('ok');
        document.getElementById('mDot').classList.toggle('ok', !!ok);
        document.getElementById('mNet').textContent = ok ? '온라인' : '오프라인';
      }catch(e){}
    }
    syncHdr(); setInterval(syncHdr, 800);

    function closeAll(){
      wrap.classList.remove('pop');
      document.querySelectorAll('.msec.pop').forEach(el=>el.classList.remove('pop'));
      const shop = document.getElementById('shop');
      if(shop){ shop.style.display='none'; }
    }
    ov.addEventListener('click', closeAll);
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAll(); });

    bar.addEventListener('click', async (e)=>{
      const btn = e.target.closest('.mbtn'); if(!btn) return;
      const tgt = btn.getAttribute('data-tgt');
      if(tgt==='SYNC'){ if(typeof loadFromServer==='function'){ try{ await loadFromServer(); }catch(e){} } return; }
      closeAll(); wrap.classList.add('pop');
      if(tgt==='FARM'){ sFarm.classList.add('pop'); }
      else if(tgt==='GATE'){ sGate.classList.add('pop'); if(typeof updateGateFace==='function'){ try{ updateGateFace(); }catch(e){} } }
      else if(tgt==='SHOP'){
        const shop = document.getElementById('shop');
        if(shop){
          shop.style.display='flex';
          const c = document.getElementById('shopCancel'); if(c && !c._mBind){ c.addEventListener('click', closeAll); c._mBind = true; }
        }
      }
    });
  })();
  </script>
  <!-- === /ADD-ONLY === -->

</body>
</html>
