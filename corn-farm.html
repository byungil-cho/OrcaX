<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>옥수수 농장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html {
      margin:0; padding:0; height:100%; overflow:hidden;
      font-family:sans-serif;
    }
    /* 배경 꽉 채우기 */
    #farmBackground {
      position:absolute; top:0; left:0;
      width:100%; height:100%;
      object-fit:cover; z-index:-1;
    }

    /* 상단 자원바 */
    #resourceBar {
      position:fixed; top:0; left:0; width:100%;
      background:rgba(0,0,0,0.4); color:#fff;
      display:flex; justify-content:space-around; align-items:center;
      height:40px; font-size:14px; z-index:10;
    }

    /* 하단 버튼바 */
    #actionBar {
      position:fixed; bottom:0; left:0; width:100%;
      background:rgba(255,255,255,0.7);
      display:flex; justify-content:center; gap:10px; padding:10px;
      z-index:10;
    }
    #actionBar button {
      padding:10px 15px; border:none; border-radius:5px;
      cursor:pointer; background:#eee;
    }

    /* 게이지 */
    #circleGauge {
      position:absolute; top:60px; left:20px;
      width:100px; height:100px;
    }
    #verticalGauges {
      position:absolute; top:60px; right:20px;
      display:flex; flex-direction:column; gap:10px;
    }
    .vBar { width:10px; height:120px; background:#ddd; position:relative; border-radius:5px; overflow:hidden; }
    .vFill { position:absolute; bottom:0; width:100%; background:green; }

    /* 캐릭터 + 레벨 게이지 */
    #characterArea {
      position:absolute; bottom:60px; left:20px;
      display:flex; align-items:center; gap:10px;
    }
    #character img { width:60px; }
    #levelGauge { width:150px; height:15px; background:#ccc; border-radius:10px; overflow:hidden; }
    #levelFill { width:0%; height:100%; background:orange; }

    /* 풍선말 */
    #speechBubble {
      position:absolute; top:-35px; left:50%; transform:translateX(-50%);
      background:#fff; border:1px solid #333; padding:5px 10px;
      border-radius:10px; font-size:12px;
      display:none; white-space:nowrap;
      animation: floatUp 3s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity:1; transform:translate(-50%,0); }
      100% { opacity:0; transform:translate(-50%,-40px); }
    }

    /* 팝업 */
    #buyModal {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.5); display:none;
      justify-content:center; align-items:center;
      z-index:20;
    }
    #buyContent {
      background:#fff; padding:20px; border-radius:10px;
      width:300px;
    }
    .buyOption { margin:10px 0; }
    .buyOption input[type="number"] { width:60px; }
    .bubble-salt { background:#d0e7ff; border-color:#1e90ff; }
    .bubble-sugar { background:#ffe0f0; border-color:#ff69b4; }
    .bubble-seed { background:#e0ffd6; border-color:#2e8b57; }
  </style>
</head>
<body>
  <img id="farmBackground" src="img/farm_01.png" alt="Farm">

  <!-- 상단 자원바 -->
  <div id="resourceBar">
    💧 물: <span id="water">0</span> |
    💩 거름: <span id="fertilizer">0</span> |
    🪙 토큰: <span id="tokens">0</span> |
    🌽 씨옥수수: <span id="seed">0</span> |
    🧂 소금: <span id="salt">0</span> |
    🍬 설탕: <span id="sugar">0</span> |
    🍿 팝콘: <span id="popcorn">0</span>
  </div>

  <!-- 게이지 -->
  <canvas id="circleGauge"></canvas>
  <div id="verticalGauges">
    <div class="vBar"><div id="waterFill" class="vFill" style="height:80%"></div></div>
    <div class="vBar"><div id="fertilizerFill" class="vFill" style="height:60%"></div></div>
  </div>

  <!-- 캐릭터 -->
  <div id="characterArea">
    <div id="character">
      <img src="img/a_mark_01.png" alt="캐릭터">
      <div id="speechBubble"></div>
    </div>
    <div id="levelGauge"><div id="levelFill"></div></div>
  </div>

  <!-- 하단 버튼바 -->
  <div id="actionBar">
    <button onclick="plant()">🌱 씨앗 심기</button>
    <button onclick="water()">💧 물 주기</button>
    <button onclick="fertilize()">💩 거름 주기</button>
    <button onclick="harvest()">🌽 수확</button>
    <button onclick="puff()">🍿 뻥튀기</button>
    <button onclick="openBuyModal()">🛒 구매</button>
  </div>

  <!-- 구매 팝업 -->
  <div id="buyModal">
    <div id="buyContent">
      <h3>구매하기</h3>
      <div class="buyOption">
        <input type="radio" name="buyItem" value="salt"> 🧂 소금 (10 토큰)
        수량: <input type="number" id="qtySalt" disabled>
      </div>
      <div class="buyOption">
        <input type="radio" name="buyItem" value="sugar"> 🍬 설탕 (20 토큰)
        수량: <input type="number" id="qtySugar" disabled>
      </div>
      <div class="buyOption">
        <input type="radio" name="buyItem" value="seed"> 🌽 씨옥수수 (100 토큰)
        수량: <input type="number" id="qtySeed" disabled>
      </div>
      <div id="totalCost">총액: 0 토큰</div>
      <button onclick="buyItem()">구매하기</button>
      <button onclick="closeBuyModal()">취소</button>
    </div>
  </div>

  <script>
    // === 팝업 제어 ===
    function openBuyModal(){ document.getElementById("buyModal").style.display="flex"; }
    function closeBuyModal(){ document.getElementById("buyModal").style.display="none"; }
    document.querySelectorAll("input[name=buyItem]").forEach(radio=>{
      radio.addEventListener("change", ()=>{
        document.querySelectorAll("#buyContent input[type=number]").forEach(i=>i.disabled=true);
        if(radio.value==="salt") document.getElementById("qtySalt").disabled=false;
        if(radio.value==="sugar") document.getElementById("qtySugar").disabled=false;
        if(radio.value==="seed") document.getElementById("qtySeed").disabled=false;
      });
    });

    // === 구매 ===
    function buyItem(){
      let item=document.querySelector("input[name=buyItem]:checked");
      if(!item){ alert("구매할 항목을 선택하세요."); return; }
      let qty=0, price=0;
      if(item.value==="salt"){ qty=document.getElementById("qtySalt").value; price=10; }
      if(item.value==="sugar"){ qty=document.getElementById("qtySugar").value; price=20; }
      if(item.value==="seed"){ qty=document.getElementById("qtySeed").value; price=100; }
      if(qty<=0){ alert("수량을 입력하세요."); return; }
      let total=qty*price;
      showSpeechBubble(item.value, qty, total);
      closeBuyModal();
    }

    function showSpeechBubble(item, qty, total){
      const bubble=document.getElementById("speechBubble");
      let icon="", label="", cls="";
      if(item==="salt"){ icon="🧂"; label="소금"; cls="bubble-salt"; }
      if(item==="sugar"){ icon="🍬"; label="설탕"; cls="bubble-sugar"; }
      if(item==="seed"){ icon="🌽"; label="씨옥수수"; cls="bubble-seed"; }
      bubble.className=cls;
      bubble.innerText=`${icon} ${label} ${qty}개 구매 (${total} 토큰)`;
      bubble.style.display="block";
      setTimeout(()=>{ bubble.style.display="none"; }, 3000);
    }

    // === 액션 더미 ===
    function plant(){console.log("씨앗 심기");}
    function water(){console.log("물 주기");}
    function fertilize(){console.log("거름 주기");}
    function harvest(){console.log("수확");}
    function puff(){console.log("뻥튀기");}
  </script>
</body>
</html>
