<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>🌽 Corn Farm</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    header { background: #4CAF50; color: white; padding: 10px; text-align: center; }
    main { padding: 20px; }
    section { background: white; margin-bottom: 20px; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    button { padding: 10px; margin: 5px; cursor: pointer; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .resource { margin: 5px 0; }
  </style>
</head>
<body>
  <header>
    <h1>🌽 Corn Farm</h1>
  </header>
  <main>
    <section>
      <h2>자원 현황</h2>
      <div class="resource">씨옥수수: <span id="r-seeds">0</span></div>
      <div class="resource">물: <span id="r-water">0</span></div>
      <div class="resource">거름: <span id="r-fertilizer">0</span></div>
      <div class="resource">옥수수: <span id="r-corn">0</span></div>
      <div class="resource">팝콘: <span id="r-popcorn">0</span></div>
      <div class="resource">소금: <span id="r-salt">0</span></div>
      <div class="resource">설탕: <span id="r-sugar">0</span></div>
      <div class="resource">토큰: <span id="r-token">0</span></div>
    </section>

    <section>
      <h2>농장 조작</h2>
      <button id="btn-plant" onclick="onPlant()">🌱 씨앗 심기</button>
      <button id="btn-water" onclick="onWater()">💧 물 주기</button>
      <button id="btn-fertilizer" onclick="onFertilizer()">🌿 거름 주기</button>
      <button id="btn-harvest" onclick="onHarvest()">🌾 수확</button>
      <button id="btn-pop" onclick="onPop()">🍿 뻥튀기</button>
    </section>
  </main>

  <script>
    const API = async (path, data) => {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data || { kakaoId: "user123" })
      });
      return res.json();
    };

    // ✅ 자원 표시
    function paintFromUser(user) {
      const seedCount = Number(
        user.agri?.seeds ??
        user.agri?.seed ??
        user.inventory?.seed ?? 
        0
      );
      document.getElementById("r-seeds").textContent = seedCount;

      document.getElementById("r-water").textContent = user.agri?.water ?? 0;
      document.getElementById("r-fertilizer").textContent = user.agri?.fertilizer ?? 0;
      document.getElementById("r-corn").textContent = user.agri?.corn ?? 0;
      document.getElementById("r-popcorn").textContent = user.agri?.popcorn ?? 0;
      document.getElementById("r-salt").textContent = user.agri?.salt ?? 0;
      document.getElementById("r-sugar").textContent = user.agri?.sugar ?? 0;
      document.getElementById("r-token").textContent = user.token ?? 0;
    }

    // ✅ 버튼 활성화 갱신
    function refreshControls(S) {
      const seedAvailable =
        (S.user.agri?.seeds ?? 0) > 0 ||
        (S.user.agri?.seed ?? 0) > 0 ||
        (S.user.inventory?.seed ?? 0) > 0;

      document.getElementById("btn-plant").disabled = !seedAvailable;

      document.getElementById("btn-water").disabled = !(S.summary.phase === "GROW" && S.user.agri?.water > 0);
      document.getElementById("btn-fertilizer").disabled = !(S.summary.phase === "GROW" && S.user.agri?.fertilizer > 0);
      document.getElementById("btn-harvest").disabled = !(S.summary.phase === "HARVEST");
      document.getElementById("btn-pop").disabled = !(S.user.agri?.corn > 0);
    }

    // ✅ 전체 데이터 갱신
    async function loadAll() {
      const user = await API("/api/userdata");
      const summary = await API("/api/corn/summary");
      paintFromUser(user);
      refreshControls({ user, summary });
    }

    // === 액션 ===
    async function onPlant() {
      await API("/api/corn/plant");
      await loadAll();
    }
    async function onWater() {
      await API("/api/corn/grow", { action: "water" });
      await loadAll();
    }
    async function onFertilizer() {
      await API("/api/corn/grow", { action: "fertilizer" });
      await loadAll();
    }
    async function onHarvest() {
      await API("/api/corn/harvest");
      await loadAll();
    }
    async function onPop() {
      await API("/api/corn/pop");
      await loadAll();
    }

    // 첫 로딩
    loadAll();
  </script>
</body>
</html>
