<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>옥수수 농장</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: url("img/farm_winter.png") no-repeat center center fixed;
      background-size: cover;
    }
    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0,0,0,0.5);
      color: #fff;
      display: flex;
      justify-content: space-around;
      padding: 8px;
      font-size: 14px;
    }
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(255,255,255,0.8);
      display: flex;
      justify-content: space-around;
      padding: 10px;
    }
    .profile {
      position: fixed;
      bottom: 80px;
      left: 10px;
      display: flex;
      align-items: center;
    }
    .profile img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }
    .nickname {
      margin-left: 10px;
      background: rgba(255,255,255,0.7);
      padding: 5px 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <!-- 상단 자원바 -->
  <div class="top-bar" id="resource-bar">
    💧물: 0 | 💩거름: 0 | 🪙토큰: 0 | 🌱씨옥수수: 0 | 🧂소금: 0 | 🍭설탕: 0 | 🍿팝콘: 0
  </div>

  <!-- 좌측하단 프로필 -->
  <div class="profile">
    <img src="img/character_lv1.png" alt="캐릭터">
    <div class="nickname" id="nickname">로그인 안됨</div>
  </div>

  <!-- 하단 버튼바 -->
  <div class="bottom-bar">
    <button>🌱 씨앗 심기</button>
    <button>💧 물 주기</button>
    <button>💩 거름 주기</button>
    <button>🌽 수확</button>
    <button>🍿 뻥튀기</button>
    <button>🛒 구매</button>
  </div>

  <script>
    async function loadUserData() {
      try {
        const res = await fetch("/api/userData?userId=testUser"); // 로그인 후 userId 동적 연결
        const data = await res.json();

        document.getElementById("nickname").textContent = data.nickname;

        document.getElementById("resource-bar").textContent =
          `💧물: ${data.resources.water} | 💩거름: ${data.resources.fertilizer} | 🪙토큰: ${data.resources.token} | 🌱씨옥수수: ${data.resources.cornSeed} | 🧂소금: ${data.resources.salt} | 🍭설탕: ${data.resources.sugar} | 🍿팝콘: ${data.resources.popcorn}`;
      } catch (err) {
        console.error("자원 불러오기 실패:", err);
      }
    }

    window.onload = loadUserData;
  </script>
</body>
</html>
