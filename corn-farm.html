<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>옥수수 농장</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }
    header {
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 8px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
      z-index: 1000;
    }
    main {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 100px);
      overflow: hidden;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .actions {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .actions button {
      background: #ffcc00;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
    }
    .actions button:hover {
      background: #ffdd33;
    }
  </style>
</head>
<body>

  <header>
    <div id="water">💧 물: 0</div>
    <div id="fertilizer">🌱 거름: 0</div>
    <div id="corn">🌽 옥수수: 0</div>
    <div id="popcorn">🍿 팝콘: 0</div>
    <div id="salt">🧂 소금: 0</div>
    <div id="sugar">🍬 설탕: 0</div>
    <div id="tokens">💰 토큰: 0</div>
  </header>

  <main>
    <picture>
      <source media="(max-width: 768px)" srcset="a_corn_0_01.png">
      <img src="corn_0_01.png" alt="옥수수 농장 배경">
    </picture>
  </main>

  <div class="actions">
    <button onclick="doAction('seed')">씨앗 심기</button>
    <button onclick="doAction('water')">물 주기</button>
    <button onclick="doAction('fertilize')">거름 주기</button>
    <button onclick="doAction('harvest')">수확</button>
  </div>

  <script>
    let nickname = null; // 카카오 닉네임 저장 변수

    // 카카오 로그인 정보 가져오기 (예시)
    function getKakaoProfile() {
      // 서버 세션이나 로컬스토리지에서 닉네임 가져오는 방식
      // 이 부분은 실제 구현 환경에 맞게 수정 필요
      return localStorage.getItem("kakaoNickname");
    }

    async function loadFarmData() {
      nickname = getKakaoProfile();
      if (!nickname) {
        alert("카카오 로그인 정보가 없습니다.");
        return;
      }

      try {
        const res = await fetch(`/api/corn/status?nickname=${encodeURIComponent(nickname)}`);
        const data = await res.json();

        document.getElementById("water").innerText = `💧 물: ${data.water}`;
        document.getElementById("fertilizer").innerText = `🌱 거름: ${data.fertilizer}`;
        document.getElementById("corn").innerText = `🌽 옥수수: ${data.corn}`;
        document.getElementById("popcorn").innerText = `🍿 팝콘: ${data.popcorn}`;
        document.getElementById("salt").innerText = `🧂 소금: ${data.salt}`;
        document.getElementById("sugar").innerText = `🍬 설탕: ${data.sugar}`;
        document.getElementById("tokens").innerText = `💰 토큰: ${data.tokens}`;
      } catch (err) {
        console.error("농장 데이터 불러오기 실패:", err);
      }
    }

    async function doAction(action) {
      if (!nickname) return;

      try {
        const res = await fetch(`/api/corn/${action}?nickname=${encodeURIComponent(nickname)}`, { method: 'POST' });
        const result = await res.json();
        alert(result.message);
        await loadFarmData(); // UI 갱신
      } catch (err) {
        console.error(`${action} 실행 실패:`, err);
      }
    }

    // 페이지 로드 시 데이터 불러오기
    window.onload = loadFarmData;
  </script>

</body>
</html>
