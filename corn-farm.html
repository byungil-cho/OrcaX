<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>옥수수 농장</title>
<!-- ✅ 디자인/CSS는 손 안 댐 -->
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ✅ UI 부분도 그대로 -->
  <div id="bg" aria-hidden="true"></div>
  <header> ... </header>
  <div class="gauge"> ... </div>
  <div class="level-box"> ... </div>
  <div class="mini-wrap" id="miniWrap"> ... </div>
  <div class="actions"> ... </div>
  <div id="shopModal" class="modal"> ... </div>
  <div id="toast"></div>

<script>
'use strict';

// ✅ 여기서부터 API 관련 수정만 함
const API_BASE = 'https://climbing-wholly-grouper.jp.ngrok.io';
const BASE_ORIGIN = API_BASE;
const API = (p) => `${BASE_ORIGIN}/api/${String(p||'').replace(/^\/+/, '')}`;

async function jfetch(url,{method='GET',query,body,headers}={}){
  let u=url;
  if(query && typeof query==='object'){
    const qs=new URLSearchParams();
    for(const[k,v] of Object.entries(query)) if(v!==undefined&&v!==null) qs.set(k,String(v));
    const q=qs.toString(); if(q) u+=(u.includes('?')?'&':'?')+q;
  }
  const opts={method,headers:Object.assign({'Accept':'application/json'},headers||{})};
  if(body!==undefined&&body!==null){opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body);}
  const r=await fetch(u,Object.assign(opts,{mode:'cors',cache:'no-store'}));
  const t=await r.text(); const isJson=(r.headers.get('content-type')||'').includes('application/json');
  const data=t?(isJson?JSON.parse(t):{raw:t}):{};
  if(!r.ok){ const err=new Error(`HTTP ${r.status}`); err.status=r.status; err.data=data; throw err; }
  return data;
}

// ✅ api 객체 (ngrok 주소만 사용)
const api={
  userdata:(kakaoId,nickname)=>jfetch(API('userdata'),{method:'POST',body:{kakaoId,nickname}}),
  cornSummary:(kakaoId)=>jfetch(API('corn/summary'),{method:'GET',query:{kakaoId}}),
  plant:(kakaoId)=>jfetch(API('corn/plant'),{method:'POST',body:{kakaoId}}),
  grow:(kakaoId,step=5)=>jfetch(API('corn/grow'),{method:'POST',body:{kakaoId,step}}),
  harvest:(kakaoId)=>jfetch(API('corn/harvest'),{method:'POST',body:{kakaoId}}),
  pop:(kakaoId,cost=30)=>jfetch(API('corn/pop'),{method:'POST',body:{kakaoId,tokenCost:cost}}),
  exchange:(kakaoId,qty=1,dir)=>jfetch(API('corn/exchange'),{method:'POST',body:{kakaoId,qty,dir}}),
  buyAdditive:(kakaoId,type,qty)=>{
    const item = (type==='seeds' ? 'seed' : type);
    return jfetch(API('corn/buy-additive'),{ method:'POST', body:{kakaoId, type:item, item, qty, amount:qty }});
  },
  priceboard:()=>jfetch(API('corn/priceboard'),{method:'GET'})
};

/* ==== Corn API – final ==== */
(function () {
  const seedTargets = ['#r-seeds','[data-key="seedCount"]','.seed-count'];
  function setSeed(n){
    for (const s of seedTargets) {
      const el = document.querySelector(s);
      if (el) { el.textContent = String(Number(n||0)); return; }
    }
  }
  function getKakaoId(){
    return (window.kakaoId && String(window.kakaoId))
        || localStorage.getItem('kakaoId')
        || sessionStorage.getItem('kakaoId')
        || '';
  }
  async function fetchJSON(url){
    const r = await fetch(url, { credentials: 'omit', cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP '+r.status);
    const ct = r.headers.get('content-type') || '';
    if(!ct.includes('application/json')) throw new Error('Not JSON');
    return r.json();
  }

  function normSummary(j){
    return {
      water:       Number(j?.water ?? 0),
      fertilizer:  Number(j?.fertilizer ?? 0),
      seeds:       Number(j?.seeds ?? 0),
      growPct:     Number(j?.growPct ?? 0),
    };
  }

  (async () => {
    const kid = getKakaoId();
    if (!kid) return;

    try {
      const s = await fetchJSON(`${API_BASE}/api/corn/seed/${encodeURIComponent(kid)}`);
      if (s?.ok) setSeed(s.seeds);
    } catch (e) {}

    try {
      const j = await fetchJSON(`${API_BASE}/api/corn/summary/${encodeURIComponent(kid)}`);
      window.__cornSummary = normSummary(j);
    } catch (e) {
      window.__cornSummary = normSummary(null);
    }
  })();
})();
</script>
</body>
</html>
