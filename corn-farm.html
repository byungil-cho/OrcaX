<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장</title>
  <style>
    html,body{height:100%;margin:0;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif}
    .bg{position:fixed;inset:0;background:#000 center/cover no-repeat;transition:filter .4s ease}
    .top{position:fixed;left:16px;top:16px;right:16px;display:flex;gap:10px;align-items:center;z-index:3}
    .hud{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;
         background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.15)}
    .badge{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:999px;font-size:13px}
    .ok{color:#7CFF7C}.err{color:#ff7b7b}
    .panel{position:fixed;right:16px;bottom:16px;width:320px;z-index:3}
    .card{padding:14px;border-radius:16px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.15)}
    .row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
    button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:10px}
  </style>
</head>
<body>
  <div id="bg" class="bg" aria-hidden="true"></div>

  <div class="top">
    <div class="hud">
      <img id="mark" src="img/mark_01.png" alt="레벨" style="width:22px;height:22px;border-radius:50%">
      <b id="nick">로그인 확인 중</b>
      <div class="badge">💧 <b id="water">0</b></div>
      <div class="badge">🧺 <b id="fert">0</b></div>
      <div class="badge">🌽씨앗 <b id="seed">0</b></div>
      <div class="badge">🪙 <b id="token">0</b></div>
    </div>
    <div class="hud">
      <span id="sDot" class="err">●</span><span id="sText">오프라인</span>
    </div>
    <div class="hud">
      <button id="toEntrance">입구로</button>
    </div>
  </div>

  <div class="panel">
    <div class="card">
      <div class="row"><span>배경(시즌) 바꾸기</span></div>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <button data-season="winter">겨울</button>
        <button data-season="lateWinter">늦겨울</button>
        <button data-season="spring">봄</button>
        <button data-season="summer">여름</button>
        <button data-season="lateSummer">늦여름</button>
        <button data-season="autumn">가을</button>
        <button data-season="deepWinter">한겨울</button>
      </div>
    </div>
  </div>

<script>
(() => {
  // --- 환경 ---------------------------------------------------------------
  const API_HOST = localStorage.getItem('API_HOST')
                  || localStorage.getItem('KIT_HOST')
                  || 'https://climbing-wholly-grouperjr.ngrok.io';
  const TOKEN = localStorage.getItem('kakaold') || localStorage.getItem('token') || '';

  // 시즌키 ↔ 배경이미지
  const BG = {
    winter     : 'img/farm_01.png',
    lateWinter : 'img/farm_03.png',
    spring     : 'img/farm_05.png',
    summer     : 'img/farm_07.png',
    lateSummer : 'img/farm_09.png',
    autumn     : 'img/farm_10.png',
    deepWinter : 'img/farm_12.png'
  };

  const levelToMark = (lv=1) => {
    if (lv >= 60) return 'img/mark_10.png';
    if (lv >= 50) return 'img/mark_09.png';
    if (lv >= 40) return 'img/mark_08.png';
    if (lv >= 35) return 'img/mark_07.png';
    if (lv >= 30) return 'img/mark_06.png';
    if (lv >= 25) return 'img/mark_05.png';
    if (lv >= 20) return 'img/mark_04.png';
    if (lv >= 15) return 'img/mark_03.png';
    if (lv >= 10) return 'img/mark_02.png';
    return 'img/mark_01.png';
  };

  // --- DOM ---------------------------------------------------------------
  const dom = {
    bg: document.getElementById('bg'),
    mark: document.getElementById('mark'),
    nick: document.getElementById('nick'),
    water: document.getElementById('water'),
    fert: document.getElementById('fert'),
    seed: document.getElementById('seed'),
    token: document.getElementById('token'),
    sDot: document.getElementById('sDot'),
    sText: document.getElementById('sText'),
    toEntrance: document.getElementById('toEntrance')
  };

  function setStatus(ok){
    if(ok){ dom.sDot.classList.remove('err'); dom.sDot.classList.add('ok'); dom.sText.textContent='온라인'; }
    else{ dom.sDot.classList.remove('ok'); dom.sDot.classList.add('err'); dom.sText.textContent='오프라인'; }
  }

  // 시즌 적용 + 입구와 동기화
  function setSeason(key){
    const src = BG[key] || BG.winter;
    dom.bg.style.backgroundImage = `url('${src}')`;
    localStorage.setItem('farmSeason', key); // ★ 입구 썸네일까지 동기화
  }

  // --- 데이터 로딩 --------------------------------------------------------
  async function load(){
    try{
      const res = await fetch(`${API_HOST}/api/userdata`, {
        headers: {'Accept':'application/json', ...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{})},
        credentials:'include'
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();

      dom.nick.textContent = data.nick || data.nickname || '농부';
      dom.mark.src = levelToMark(data.level ?? 1);

      const r = data.resources || {};
      dom.water.textContent = r.water ?? 0;
      dom.fert.textContent  = r.fertilizer ?? 0;
      dom.seed.textContent  = r.cornSeed ?? 0;
      dom.token.textContent = (data.tokens ?? 0).toLocaleString();

      const season = (data.env && data.env.season)
                  || (data.farm && data.farm.season)
                  || localStorage.getItem('farmSeason')
                  || 'winter';
      setSeason(season);

      setStatus(true);
    }catch(e){
      setStatus(false);
      // 오프라인일 땐 저장된 시즌만이라도 반영
      const cachedSeason = localStorage.getItem('farmSeason') || 'winter';
      setSeason(cachedSeason);
    }
  }

  // 버튼들: 시즌 수동 변경(데모)
  document.querySelectorAll('button[data-season]').forEach(btn=>{
    btn.addEventListener('click', ()=> setSeason(btn.dataset.season));
  });

  dom.toEntrance.addEventListener('click', ()=> location.href='corn-index.html');

  load();
})();
</script>
</body>
</html>
