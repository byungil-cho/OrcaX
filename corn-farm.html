<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🌽 옥수수 농장</title>
  <style>
    body {
      margin: 0;
      background-size: cover;
      background-position: center;
      font-family: Arial, sans-serif;
      color: white;
    }
    #resourceBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      padding: 5px;
      font-size: 14px;
    }
    #resourceBar span { margin: 0 8px; }

    #character {
      position: fixed;
      bottom: 60px;
      left: 10px;
      display: flex;
      align-items: center;
    }
    #character img {
      width: 50px;
      height: 50px;
    }

    #actionBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.8);
      display: flex;
      justify-content: space-around;
      padding: 10px;
    }
    #actionBar button {
      border: none;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    #miniImage {
      position: fixed;
      bottom: 120px;
      right: 20px;
      width: 100px;
      height: 100px;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #miniImage img { width: 80px; height: 80px; }
  </style>
</head>
<body>
  <div id="resourceBar">
    <span>💧 물: <span id="water">0</span></span>
    <span>💩 거름: <span id="fertilizer">0</span></span>
    <span>🪙 토큰: <span id="token">0</span></span>
    <span>🌱 씨옥수수: <span id="seed">0</span></span>
    <span>🧂 소금: <span id="salt">0</span></span>
    <span>🍬 설탕: <span id="sugar">0</span></span>
    <span>🍿 팝콘: <span id="popcorn">0</span></span>
  </div>

  <div id="character">
    <img src="https://cdn-icons-png.flaticon.com/512/1995/1995574.png">
    <span id="nickname">로그인 안됨</span>
  </div>

  <div id="miniImage">
    <img id="cornStage" src="https://cdn-icons-png.flaticon.com/512/590/590685.png">
  </div>

  <div id="actionBar">
    <button>🌱 씨앗 심기</button>
    <button>💧 물 주기</button>
    <button>💩 거름 주기</button>
    <button>🌽 수확</button>
    <button>🍿 뻥튀기</button>
    <button>🛒 구매</button>
  </div>

  <script>
    const API = "https://climbing-wholly-grouper.jp.ngrok.io/api"; // ngrok 주소
    const nickname = "testUser"; // 로그인 연동시 교체

    async function loadUser() {
      const res = await fetch(`${API}/userdata?nickname=${nickname}`);
      if (!res.ok) {
        document.getElementById("nickname").innerText = "❌ 유저 없음";
        return;
      }
      const user = await res.json();
      document.getElementById("nickname").innerText = user.nickname;

      document.getElementById("water").innerText = user.water;
      document.getElementById("fertilizer").innerText = user.fertilizer;
      document.getElementById("token").innerText = user.token;
      document.getElementById("seed").innerText = user.seed;
      document.getElementById("salt").innerText = user.salt;
      document.getElementById("sugar").innerText = user.sugar;
      document.getElementById("popcorn").innerText = user.popcorn;

      // 배경 이미지 계절 교체
      document.body.style.backgroundImage = `url('/img/background/${user.season}.png')`;

      // 미니 이미지 (성장단계 교체)
      document.getElementById("cornStage").src = `/img/corn/${user.growthStage}.png`;
    }

    loadUser();
  </script>
</body>
</html>
