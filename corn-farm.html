<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장</title>

  <link rel="stylesheet" href="./css/common.css" />
  <style>
    :root{
      --ink:#eef6ee; --glass:rgba(0,0,0,.45); --bd:rgba(255,255,255,.18);
      --ok:#25d366;
    }
    html,body{
      height:100%;
      margin:0;
      color:var(--ink);
      background:transparent;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif;
    }
    /* 배경 */
    #bg{
      position:fixed; inset:0; width:100%; height:100%;
      z-index:-1;
      background:center / cover no-repeat;
    }

    header{
      position:fixed;left:10px;right:10px;top:10px;z-index:9;
      backdrop-filter:blur(6px);background:var(--glass);border:1px solid var(--bd);
      border-radius:14px;padding:8px 10px;
    }
    .topline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .status{width:8px;height:8px;border-radius:999px;background:#ef4444}
    .status.ok{background:var(--ok)}
    .nick{font-weight:800;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .res{
      display:grid;gap:6px;margin-top:6px;
      grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    }
    .tag{display:flex;justify-content:space-between;align-items:center;gap:8px;
      padding:6px 8px;border-radius:999px;border:1px solid var(--bd);background:rgba(255,255,255,.08);
      font-size:12px}
    .tag b{font-variant-numeric:tabular-nums}

    /* 원형 게이지 */
    .gauge{
      position:fixed;
      left:10px;
      bottom:calc(160px + env(safe-area-inset-bottom));
      z-index:6;
      width:110px;height:110px;border-radius:999px;border:1px solid var(--bd);
      background:rgba(0,0,0,.35);
      display:grid;place-items:center;overflow:hidden;
    }
    .gfill{position:absolute;inset:0;background:
      conic-gradient(#8ed36b var(--p,0%), rgba(255,255,255,.12) 0)}
    .gnum{position:relative;font-weight:800;font-variant-numeric:tabular-nums}

    /* 레벨 캐릭터 박스 */
    .level-box{
      position:fixed;
      left:10px;
      bottom:calc(110px + env(safe-area-inset-bottom));
      z-index:6;
      display:flex;align-items:center;gap:8px;
      padding:6px 10px;
      border:1px solid var(--bd);
      border-radius:10px;
      background:rgba(0,0,0,.35);
    }
    .level-box img{
      width:44px;height:44px;border-radius:999px;border:1px solid var(--bd);background:#000;
    }
    .expbar{width:120px;height:6px;border-radius:999px;border:1px solid var(--bd);background:rgba(255,255,255,.15);overflow:hidden}
    .expbar span{display:block;height:100%;width:0;background:#8ed36b}

    /* 롤러 컨테이너 */
    .mini-roller{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:calc(120px + env(safe-area-inset-bottom));
      z-index:7;
      width:clamp(260px, 50vw, 400px);
      height:150px;
      overflow-y:auto;
      border:1px solid var(--bd);
      border-radius:14px;
      background:rgba(0,0,0,.28);
      padding:8px 10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .mini-item{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .mini-img{
      width:120px;height:120px;
      border-radius:12px;border:1px solid var(--bd);
      object-fit:cover;background:#000;flex:0 0 auto;
    }
    .link-box{
      flex:1;
      border:1px solid var(--bd);
      border-radius:10px;
      padding:10px;
      background:rgba(0,0,0,.35);
      color:#fff;
      text-align:center;
      text-decoration:none;
    }

    .actions{
      position:fixed;left:10px;right:10px;bottom:10px;z-index:8;
      display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
      backdrop-filter:blur(6px);background:var(--glass);border:1px solid var(--bd);
      border-radius:14px;padding:8px;
    }
    .btn{
      border:1px solid var(--bd);background:rgba(0,0,0,.25);color:#fff;border-radius:10px;
      padding:10px 8px;font-size:13px;cursor:pointer
    }
    .btn[disabled]{opacity:.55;pointer-events:none}
  </style>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <!-- 상단 정보 -->
  <header>
    <div class="topline">
      <span id="netDot" class="status"></span>
      <span id="netTxt">연결 확인 중…</span>
      <span class="nick" id="nick">(로그인 필요)</span>
    </div>
    <div class="res">
      <div class="tag">🌱 씨앗 <b id="r-seeds">0</b></div>
      <div class="tag">💧 물 <b id="r-water">0</b></div>
      <div class="tag">🪴 거름 <b id="r-fert">0</b></div>
      <div class="tag">🌽 옥수수 <b id="r-corn">0</b></div>
      <div class="tag">🍿 팝콘 <b id="r-pop">0</b></div>
      <div class="tag">🧂 소금 <b id="r-salt">0</b></div>
      <div class="tag">🍬 설탕 <b id="r-sugar">0</b></div>
      <div class="tag">🪙 토큰 <b id="r-orcx">0</b></div>
    </div>
  </header>

  <!-- 원형 게이지 -->
  <div class="gauge">
    <div class="gfill" id="gfill"></div>
    <div class="gnum" id="gnum">0</div>
  </div>

  <!-- 레벨 박스 -->
  <div class="level-box">
    <img id="levelIconMini" src="" alt="레벨 아이콘" />
    <div>
      <div id="levelText">Lv.1</div>
      <div class="expbar"><span id="expBar"></span></div>
    </div>
  </div>

  <!-- 롤러 컨테이너 -->
  <div class="mini-roller" id="miniRoller">
    <div class="mini-item">
      <img id="miniImg" class="mini-img" alt="작물 상태" />
      <a id="miniLink" class="link-box" href="#">농장 이동</a>
    </div>
  </div>

  <!-- 하단 액션 -->
  <div class="actions">
    <button id="btn-plant" class="btn">씨앗 심기</button>
    <button id="btn-water" class="btn">물 주기</button>
    <button id="btn-fert"  class="btn">거름 주기</button>
    <button id="btn-harv"  class="btn" disabled>수확</button>
    <button id="btn-pop"   class="btn" disabled>뻥튀기</button>
    <button id="btn-ex"    class="btn">팝콘↔거름</button>
  </div>

  <div id="toast"></div>

  <!-- 로직 -->
  <script src="./js/corn-api.js?v=20250813"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 배경 적용
      applyBg();

      // 미니 이미지 + 링크 업데이트
      const miniImg = document.getElementById('miniImg');
      const miniLink = document.getElementById('miniLink');
      const mini = pickMini();
      if(mini){
        miniImg.src = mini.src;
        miniLink.href = mini.link || '#';
      }
    });
  </script>
</body>
</html>
