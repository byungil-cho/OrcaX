<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Corn Farm</title>
  <style>
    body { font-family: sans-serif; }
    #resources { margin: 20px; }
    .stat { margin-right: 20px; }
  </style>
</head>
<body>
  <h2>🌽 옥수수 농장</h2>
  
  <!-- 로그인 -->
  <div>
    <input type="text" id="username" placeholder="닉네임 입력">
    <button onclick="login()">로그인</button>
  </div>

  <!-- 자원 표시 -->
  <div id="resources">
    <span class="stat">💧 물: <span id="water">0</span></span>
    <span class="stat">💩 거름: <span id="fertilizer">0</span></span>
    <span class="stat">🌽 옥수수: <span id="corn">0</span></span>
  </div>

  <script>
    const API = "https://climbing-wholly-grouper.jp.ngrok.io"; // ngrok 주소

    async function login() {
      const username = document.getElementById('username').value;
      if (!username) return alert("닉네임을 입력하세요!");

      await fetch(`${API}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username })
      });

      loadResources(username);
    }

    async function loadResources(username) {
      const res = await fetch(`${API}/api/corn/summary/${username}`, {
        credentials: 'include'
      });
      const data = await res.json();

      document.getElementById("water").innerText = data.water;
      document.getElementById("fertilizer").innerText = data.fertilizer;
      document.getElementById("corn").innerText = data.corn;
    }
  </script>
</body>
</html>
