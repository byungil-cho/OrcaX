<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>옥수수 농장</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }
    header {
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 8px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
      z-index: 1000;
    }
    main {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 100px);
      overflow: hidden;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .actions {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .actions button {
      background: #ffcc00;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
    }
    .actions button:hover {
      background: #ffdd33;
    }
  </style>
</head>
<body>

  <header>
    <div id="water">💧 물: 0</div>
    <div id="fertilizer">🌱 거름: 0</div>
    <div id="corn">🌽 옥수수: 0</div>
    <div id="popcorn">🍿 팝콘: 0</div>
    <div id="salt">🧂 소금: 0</div>
    <div id="sugar">🍬 설탕: 0</div>
    <div id="tokens">💰 토큰: 0</div>
  </header>

  <main>
    <picture>
      <source media="(max-width: 768px)" srcset="img/a_corn_0_01.png">
      <img src="img/corn_0_01.png" alt="옥수수 농장 배경">
    </picture>
  </main>

  <div class="actions">
    <button onclick="doAction('seed')">씨앗 심기</button>
    <button onclick="doAction('water')">물 주기</button>
    <button onclick="doAction('fertilize')">거름 주기</button>
    <button onclick="doAction('harvest')">수확</button>
  </div>

  <script>
    const BASE_API = ''; // 서버 API 베이스 URL (필요시 설정)
    let kakaoId = null;
    let nickname = null;

    // 로그인 정보 확인
    function checkLogin() {
      kakaoId  = localStorage.getItem('kakaoId');
      nickname = localStorage.getItem('nickname') || localStorage.getItem('kakaoNickname');

      if (!kakaoId || !nickname) {
        alert("로그인이 필요합니다.");
        location.href = '/index.html'; // 로그인 페이지 경로
        return false;
      }
      return true;
    }

    // 농장 데이터 불러오기
    async function loadFarmData() {
      if (!checkLogin()) return;

      try {
        const res = await fetch(BASE_API + '/api/userdata', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId: kakaoId })
        });
        const result = await res.json();

        if (result && result.user && result.user.inventory) {
          const inv = result.user.inventory;
          document.getElementById("water").innerText = `💧 물: ${inv.water || 0}`;
          document.getElementById("fertilizer").innerText = `🌱 거름: ${inv.fertilizer || 0}`;
          document.getElementById("corn").innerText = `🌽 옥수수: ${inv.corn || 0}`;
          document.getElementById("popcorn").innerText = `🍿 팝콘: ${inv.popcorn || 0}`;
          document.getElementById("salt").innerText = `🧂 소금: ${inv.salt || 0}`;
          document.getElementById("sugar").innerText = `🍬 설탕: ${inv.sugar || 0}`;
          document.getElementById("tokens").innerText = `💰 토큰: ${inv.tokens || 0}`;
        }
      } catch (err) {
        console.error("농장 데이터 불러오기 실패:", err);
      }
    }

    // 행동 실행
    async function doAction(action) {
      if (!checkLogin()) return;

      try {
        const res = await fetch(BASE_API + `/api/corn/${action}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId: kakaoId })
        });
        const result = await res.json();
        alert(result.message || '작업 완료');
        await loadFarmData();
      } catch (err) {
        console.error(`${action} 실행 실패:`, err);
      }
    }

    // 페이지 로드 시 데이터 불러오기
    window.onload = loadFarmData;
  </script>

</body>
</html>
