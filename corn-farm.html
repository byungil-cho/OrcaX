<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장</title>
  <base href="/OrcaX/">
  <meta name="theme-color" content="#000000" />
  <style>
    :root{--ink:#eef6ee;--panel:rgba(0,0,0,.45);--bd:rgba(255,255,255,.16);--ok:#25d366;--accent:#7dd3fc}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#000;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,Apple Color Emoji,Segoe UI Emoji}
    body{min-height:100svh;background:#000 url('/OrcaX/img/bg/season-winter.jpg') 50% 50%/cover no-repeat fixed;}
    a{color:inherit;text-decoration:none}

    .wrap{position:relative;min-height:100svh;}
    .top{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 10px 8px;border-bottom:1px solid var(--bd);background:rgba(0,0,0,.35);backdrop-filter:saturate(1.05) blur(6px);z-index:30}
    .title{font-weight:800;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hud{display:flex;gap:10px;align-items:center}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--bd);background:rgba(0,0,0,.5);color:#fff;font-size:12px;cursor:pointer}
    .chip.sel{outline:2px solid rgba(255,255,255,.35)}
    .dot{width:8px;height:8px;border-radius:999px;background:#ef4444}
    .dot.ok{background:var(--ok)}

    .bank{position:fixed;left:10px;top:64px;display:flex;gap:8px;align-items:center;z-index:2}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--bd);background:rgba(0,0,0,.45);font-variant-numeric:tabular-nums}

    .hud-left{position:fixed;left:10px;bottom:10px;display:flex;gap:10px;align-items:flex-end;z-index:2}
    .hud-right{position:fixed;right:10px;bottom:10px;display:flex;gap:10px;align-items:flex-end;z-index:2}

    .panel{width:320px;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;border:1px solid var(--bd);background:var(--panel);backdrop-filter:saturate(1.05) blur(8px)}
    .panel h3{margin:0 0 4px 0;font-size:14px;opacity:.9}
    .row{display:flex;gap:8px;align-items:center}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{cursor:pointer;padding:6px 10px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.08);color:#fff}
    .btn[disabled]{opacity:.55;pointer-events:none}
    .count{font-variant-numeric:tabular-nums}

    /* 성장 게이트 */
    .gate{position:fixed;left:12px;bottom:calc(160px + env(safe-area-inset-bottom));z-index:10;display:none}
    .gate.open{display:block}
    .gate .card{min-width:min(360px,92vw);padding:10px;position:relative;border-radius:16px;border:1px solid var(--bd);background:var(--panel);backdrop-filter:saturate(1.05) blur(8px)}
    .gate .close{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:999px;border:1px solid var(--bd);background:rgba(0,0,0,.45);color:#fff;cursor:pointer}
    .bars{display:flex;gap:8px;align-items:flex-end}
    .bar{position:relative;width:48px;height:160px;border:1px solid var(--bd);border-radius:10px;background:rgba(0,0,0,.35);overflow:hidden}
    .fill{position:absolute;left:0;bottom:0;width:100%}
    .bar.w .fill{background:#60a5fa}
    .bar.f .fill{background:#65a30d}
    .bar.g .fill{background:#f59e0b}
    .gate-line{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.25)}

    /* 미니 썸네일 */
    .mini-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto auto auto auto;gap:10px;align-items:center;z-index:2}
    .nav{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:#fff;border:1px solid var(--bd);background:var(--panel)}
    .mini{width:140px;aspect-ratio:1/1;border-radius:12px;border:1px solid var(--bd);object-fit:cover;background:#000}
    .mini-cap{grid-column:1/span 4;text-align:center;font-size:12px;opacity:.9;margin-top:4px}

    /* 구매 팝업 */
    #shop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,94vw);border-radius:18px;border:1px solid var(--bd);background:rgba(0,0,0,.78);backdrop-filter:saturate(1.05) blur(10px);padding:14px;display:none;z-index:50}
    #shop.open{display:block}
    #shop .row{justify-content:space-between}

    /* 백드롭 (PC용) */
    #gateBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:40}
    #gateBackdrop.show{display:block}

    /* === 모바일 거울 레이아웃 (기본 비활성) === */
    @media (max-width:900px){
      .glass{ background: rgba(0,0,0,.22) !important; }
      .top, .bank{ display:none !important; }
      #mirror{ position:fixed; inset:10px; display:flex; flex-direction:column;
               border-radius:18px; border:1px solid rgba(255,255,255,.22);
               background:rgba(0,0,0,.18); backdrop-filter:saturate(1.05) blur(8px);
               box-shadow:0 18px 40px rgba(0,0,0,.45); overflow:hidden; z-index:60; }
      #mirrorHeader{ flex:0 0 auto; padding:8px 10px; border-bottom:1px solid rgba(255,255,255,.18);
                     display:flex; align-items:center; justify-content:space-between; gap:10px; color:#fff; font-size:14px; }
      #mirrorHeader .who{ font-weight:700; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:46vw; }
      #mirrorHeader .line{ display:flex; gap:8px; align-items:center; font-variant-numeric:tabular-nums; }
      #mirrorHeader .pill{ display:inline-flex; gap:6px; align-items:center; padding:4px 8px; border-radius:999px; border:1px solid rgba(255,255,255,.22); background:rgba(0,0,0,.28); font-size:12px; }
      #mirrorHeader .dot{ width:8px; height:8px; border-radius:999px; background:#ef4444 } .dot.ok{ background:#25d366 }
      #mirrorBody{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch }
    }

    /* === OrcaX Mobile Menu & Popup Patch (2025-08-12) === */
    @media (max-width: 900px){
      /* Background stays fixed */
      body{ background-attachment: fixed; }
      /* Mirror container centered with fixed max width */
      #mirror{ inset: auto !important; top: 10px; bottom: 10px; left: 50%; right: auto; transform: translateX(-50%); width: min(480px, calc(100vw - 20px)); }
      #mirrorHeader{ white-space: nowrap; }
      /* Button bar under header */
      #mirrorBar{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 10px 0 10px; }
      #mirrorBar .mbtn{ border: 1px solid rgba(255,255,255,.22); background: rgba(0,0,0,.28); color: #fff; border-radius: 12px; padding: 8px 6px; font-size: 13px; line-height: 1.1; }
      #mirrorBody{ padding-top: 8px; }
      /* Popup shell inside mirror */
      #mOverlay{ position: absolute; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: .18s ease; }
      #mirror.pop #mOverlay{ opacity: 1; pointer-events: auto; }
      .m-sec{ display: none; }
      .m-sec.pop{ display: block; position: absolute; left: 50%; transform: translateX(-50%); top: 56px; bottom: 60px; width: min(460px, 94vw); overflow-y: auto; overflow-x: hidden; border-radius: 16px; border: 1px solid rgba(255,255,255,.22); background: rgba(0,0,0,.28); backdrop-filter: saturate(1.05) blur(8px); padding: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
      /* When gate is inside mobile section, make its internals look nice */
      #mSec4 #gate{ position: static !important; display: block !important; }
      #mSec4 .gate .card{ min-width: auto; width: 100%; }
      /* Sticky mini at bottom center that follows scroll (always visible) */
      #mSec5{ position: sticky; bottom: 8px; z-index: 3; }
      #mSec5 .mini-wrap{ position: static !important; display: grid; justify-items: center; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.22); border-radius: 16px; padding: 8px; width: 100%; }
      /* Ensure only vertical scroll; lock horizontal width */
      html, body{ overflow-x: hidden; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 상단 고정바 (PC) -->
    <div class="top">
      <div class="title" id="title">옥수수 농장</div>
      <div class="hud">
        <span class="chip"><span id="netDot" class="dot"></span><span id="netTxt">오프라인</span></span>
        <span class="chip">🪙 <b id="bankToken">0</b></span>
        <span class="chip">🍿 <b id="bankPop">0</b></span>
      </div>
    </div>

    <!-- 은행(PC) -->
    <div class="bank">
      <span class="pill">🪙 <b id="bankToken2" class="count">0</b></span>
      <span class="pill">🍿 <b id="bankPop2" class="count">0</b></span>
    </div>

    <!-- 좌측(PC) -->
    <div class="hud-left">
      <div class="gate-dock">
        <button id="btnGate" class="chip chip-thin">성장게이트</button>
        <div class="gate" id="gate" aria-hidden="true">
          <div class="card glass">
            <button id="closeGate" class="close">✕</button>
            <h3>성장 게이트</h3>
            <div class="bars">
              <div class="bar w"><div id="fillW" class="fill" style="height:0%"></div></div>
              <div class="bar f"><div id="fillF" class="fill" style="height:0%"></div></div>
              <div class="bar g"><div id="fillG" class="fill" style="height:0%"></div></div>
            </div>
            <div class="row" style="margin-top:6px">
              <span>성장률: <b id="gVal">0</b>%</span>
              <span id="gState" style="opacity:.8">-</span>
            </div>
            <div class="row" style="margin-top:8px;gap:12px;align-items:center">
              <button id="tick" class="btn">⏱️ 시간경과(테스트)</button>
              <div style="position:relative;flex:1">
                <div class="gate-line" style="top:20%"></div>
                <div class="gate-line" style="top:50%"></div>
                <div class="gate-line" style="top:80%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel glass">
        <h3>농자재</h3>
        <div class="row">
          물: <b id="w" class="count">0</b>
          거름: <b id="f" class="count">0</b>
          옥수수: <b id="c" class="count">0</b>
          씨앗: <b id="seed" class="count">0</b>
        </div>
        <div class="grid">
          <button id="plant" class="btn">파종</button>
          <button id="harv" class="btn">수확</button>
          <button id="useW" class="btn">물 사용</button>
          <button id="useF" class="btn">거름 사용</button>
        </div>
      </div>
    </div>

    <!-- 우측(PC) -->
    <div class="hud-right">
      <div class="panel glass">
        <h3>가공/팝콘</h3>
        <div class="row">
          <span class="chip" id="pickSalt">🧂 소금 <b id="saltCount" class="count">0</b></span>
          <span class="chip" id="pickSugar">🧁 설탕 <b id="sugarCount" class="count">0</b></span>
        </div>
        <div class="row">
          <button id="pop" class="btn" disabled>🍿 팝콘 만들기</button>
        </div>
        <div class="row">
          <button id="openShop" class="btn">구매/첨가물</button>
          <button id="sync" class="btn">동기화</button>
        </div>
      </div>
    </div>

    <!-- 미니 썸네일(PC 기본 위치) -->
    <div class="mini-wrap">
      <button class="nav" id="navBack">⟵</button>
      <img id="mini" class="mini" src="/OrcaX/img/mini/default.jpg" alt="mini">
      <button class="nav" id="navNext">⟶</button>
      <div class="mini-cap" id="miniCap">겨울 · 슬롯1</div>
    </div>
  </div>

  <!-- PC 백드롭 -->
  <div id="gateBackdrop"></div>

  <!-- 구매 팝업 -->
  <div id="shop" role="dialog" aria-modal="true">
    <h3>구매/첨가물</h3>
    <div class="row">
      <label>항목</label>
      <select id="shopItem">
        <option value="seed">씨옥수수</option>
        <option value="salt">소금</option>
        <option value="sugar">설탕</option>
      </select>
    </div>
    <div class="row">
      <label>수량</label>
      <input id="shopQty" type="number" min="1" value="1" style="width:80px" />
      <span>개</span>
    </div>
    <div class="row"><span>단가: <b id="shopPricePer" class="count">0</b> ORCX</span><span>총액: <b id="shopTotal" class="count">0</b> ORCX</span></div>
    <div class="row"><span>보유 ORCX: <b id="shopOrcx" class="count">0</b></span></div>
    <div class="row" style="justify-content:flex-end; gap:8px">
      <button id="shopCancel" class="btn">취소</button>
      <button id="shopBuyBtn" class="btn">구매</button>
    </div>
  </div>

  <!-- 토스트 -->
  <div id="toast" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:rgba(0,0,0,.65);backdrop-filter:saturate(1.05) blur(6px);color:#fff;font-size:13px;display:none;z-index:80"></div>

  <script>
    const $ = (id)=>document.getElementById(id);
    const $gate=$('gate'), $btnGate=$('btnGate'), $closeGate=$('closeGate');
    const $gateBackdrop=$('gateBackdrop');
    const $fillW=$('fillW'), $fillF=$('fillF'), $fillG=$('fillG');
    const $gauge=$('gauge'), $gVal=$('gVal'), $gState=$('gState');

    const $w=$('w'), $f=$('f'), $c=$('c'), $seed=$('seed');
    const $plant=$('plant'), $harv=$('harv');
    const $useW=$('useW'), $useF=$('useF');
    const $pop=$('pop');
    const $pickSalt=$('pickSalt'), $pickSugar=$('pickSugar');

    const $openShop=$('openShop'), $sync=$('sync');
    const $shop=$('shop'), $shopItem=$('shopItem'), $shopQty=$('shopQty'), $shopPricePer=$('shopPricePer'), $shopTotal=$('shopTotal'), $shopOrcx=$('shopOrcx'), $shopCancel=$('shopCancel'), $shopBuyBtn=$('shopBuyBtn');

    const $bankToken=$('bankToken'), $bankPop=$('bankPop');
    const $bankToken2=$('bankToken2'), $bankPop2=$('bankPop2');

    const $mini=$('mini'), $miniCap=$('miniCap');

    let NET_OK=true; // 서버 연결 상태(테스트용)

    // ---------------- 공통 유틸 -----------------
    function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',1300); }
    function getPotatoInv(){ try{ const raw=localStorage.getItem('potatoInv'); return raw? JSON.parse(raw):{token:10, popcorn:0, water:10, fertilizer:10}; }catch(e){ return {token:10,popcorn:0,water:10,fertilizer:10}; } }
    function setPotatoInv(v){ localStorage.setItem('potatoInv', JSON.stringify(v)); }

    function save(){ localStorage.setItem('cornS', JSON.stringify(S)); }
    function load(){ try{ const raw=localStorage.getItem('cornS'); return raw? JSON.parse(raw):null; }catch(e){ return null; } }

    function resPct(v){ return Math.max(0, Math.min(100, v)); }

    // 계절/슬롯 배경 이미지
    const IMG={
      bg:{
        winter:['/OrcaX/img/bg/winter_1.jpg','/OrcaX/img/bg/winter_2.jpg','/OrcaX/img/bg/winter_3.jpg','/OrcaX/img/bg/winter_4.jpg','/OrcaX/img/bg/winter_5.jpg'],
        spring:['/OrcaX/img/bg/spring_1.jpg','/OrcaX/img/bg/spring_2.jpg','/OrcaX/img/bg/spring_3.jpg','/OrcaX/img/bg/spring_4.jpg','/OrcaX/img/bg/spring_5.jpg'],
        summer:['/OrcaX/img/bg/summer_1.jpg','/OrcaX/img/bg/summer_2.jpg','/OrcaX/img/bg/summer_3.jpg','/OrcaX/img/bg/summer_4.jpg','/OrcaX/img/bg/summer_5.jpg'],
        autumn:['/OrcaX/img/bg/autumn_1.jpg','/OrcaX/img/bg/autumn_2.jpg','/OrcaX/img/bg/autumn_3.jpg','/OrcaX/img/bg/autumn_4.jpg','/OrcaX/img/bg/autumn_5.jpg']
      },
      mini:{ winter:'/OrcaX/img/mini/winter_slot.jpg', spring:'/OrcaX/img/mini/spring_slot.jpg', summer:'/OrcaX/img/mini/summer_slot.jpg', autumn:'/OrcaX/img/mini/autumn_slot.jpg' },
      charBase:'/OrcaX/img/char/'
    };

    // ---------------- 상태 -----------------
    let S = load() || {
      w:10, f:10, c:0, seed:0,      // 물, 거름, 옥수수, 씨앗
      g:0,                          // 성장률
      phase:'IDLE',                 // IDLE | GROW
      season:'winter',              // winter, spring, summer, autumn
      slot:1,                       // 1~5 (08-23시 3시간 슬롯)
      sel:null,                     // salt | sugar
      salt:0, sugar:0,              // 첨가물
      level:1
    };

    // ---------------- 배경 & 미니 -----------------
    function applyBG(){ const list=IMG.bg[S.season]||IMG.bg.winter; const idx=Math.max(1,Math.min(5,S.slot))-1; document.body.style.background = `#000 url('${list[idx]}') 50% 50%/cover no-repeat fixed`; }
    function applyMini(){ const src=IMG.mini[S.season]||IMG.mini.winter; $mini.src=src; const label={winter:'겨울', spring:'봄', summer:'여름', autumn:'가을'}[S.season]||'겨울'; $miniCap.textContent=`${label} · 슬롯${S.slot}`; }

    // ---------------- 렌더 -----------------
    function renderGate(){ $fillW.style.height=resPct(S.w)+'%'; $fillF.style.height=resPct(S.f)+'%'; $fillG.style.height=Math.max(0,Math.min(100,S.g))+'%'; }
    function renderRes(){ $w.textContent=S.w; $f.textContent=S.f; $c.textContent=S.c; $seed.textContent=S.seed; $saltCount.textContent=S.salt; $sugarCount.textContent=S.sugar; $pickSalt.classList.toggle('sel', S.sel==='salt'); $pickSugar.classList.toggle('sel', S.sel==='sugar'); $pop.disabled = !( S.c>=1 && (S.salt>=1 || S.sugar>=1) ); $plant.disabled = !(S.phase!=='GROW' && S.seed>=1); $harv.disabled = !(S.phase==='GROW' && S.g>=100); }
    function renderBank(){ const inv=getPotatoInv(); $bankToken.textContent=inv.token; $bankPop.textContent=inv.popcorn; $bankToken2.textContent=inv.token; $bankPop2.textContent=inv.popcorn; }
    function renderAll(){ $('title').textContent = `${nickname} – 옥수수 농장`; $gVal.textContent=S.g.toFixed(0); $('gauge') && ($('gauge').style.background=`conic-gradient(var(--accent) ${Math.max(0,Math.min(100,S.g))}%, rgba(255,255,255,.15) 0)`); applyBG(); applyMini(); renderGate(); renderRes(); renderBank(); }

    // ---------------- 이벤트 -----------------
    function openGate(){ $gate.classList.add('open'); $gateBackdrop.classList.add('show'); $btnGate.setAttribute('aria-expanded','true'); }
    function closeGate(){ $gate.classList.remove('open'); $gateBackdrop.classList.remove('show'); $btnGate.setAttribute('aria-expanded','false'); }
    $btnGate.onclick=()=>($gate.classList.contains('open')?closeGate():openGate());
    $closeGate.onclick=closeGate; $gateBackdrop.onclick=closeGate; document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeGate(); });

    $('navBack').onclick=()=>{ S.slot = (S.slot-2+5)%5+1; save(); renderAll(); };
    $('navNext').onclick=()=>{ S.slot = (S.slot%5)+1; save(); renderAll(); };

    $pickSalt.onclick=()=>{ S.sel = (S.sel==='salt'? null:'salt'); save(); renderRes(); };
    $pickSugar.onclick=()=>{ S.sel = (S.sel==='sugar'? null:'sugar'); save(); renderRes(); };

    $useW.onclick=()=>useRes('w');
    $useF.onclick=()=>useRes('f');

    function useRes(kind){ if(kind==='w' && S.w<=0) return toast('물 부족'); if(kind==='f' && S.f<=0) return toast('거름 부족'); if(kind==='w') S.w--; else S.f--; S.g = Math.min(100, S.g + 5); save(); renderAll(); }

    $plant.onclick=()=>{ if(S.seed<=0) return toast('씨앗 필요'); if(S.phase==='GROW') return toast('이미 성장 중'); S.seed--; S.phase='GROW'; S.g=0; save(); renderAll(); toast('파종 완료'); };
    $harv.onclick=()=>{ if(S.phase!=='GROW' || S.g<100) return toast('아직 수확 단계가 아닙니다'); const g=[3,5,7][Math.floor(Math.random()*3)]; S.c+=g; S.phase='IDLE'; S.level=(S.level||0)+1; save(); renderAll(); toast(`수확 완료 (+${g})`); };

    $pop.onclick=()=>{ if(!( S.c>=1 && (S.salt>=1 || S.sugar>=1) )) return; S.c--; if(S.sel==='salt' && S.salt>0) S.salt--; else if(S.sel==='sugar' && S.sugar>0) S.sugar--; const inv=getPotatoInv(); inv.popcorn=(inv.popcorn||0)+1; setPotatoInv(inv); save(); renderAll(); toast('🍿 팝콘 +1'); };

    $openShop.onclick=()=>{ openShop(); };
    $shopCancel.onclick=()=>{ closeShop(); };

    $shopItem.onchange=$shopQty.oninput=()=>updateShopCalc();
    $shopBuyBtn.onclick=()=>shopBuy();

    function priceOf(item){ const base={seed:2, salt:3, sugar:3}; // ORCX
      // 관리자 조정 가능: 레벨에 따라 가중치 예시
      const tier=Math.max(1, Math.min(10, Math.floor((S.level||1)/5)+1));
      return base[item]*1; // 주인님 지시 전까지는 기본가 유지
    }

    function updateShopCalc(){ const inv=getPotatoInv(); const item=$shopItem.value; const qty=Math.max(1, parseInt($shopQty.value||'1',10)); const price=priceOf(item); const total=price*qty; $shopPricePer.textContent=price; $shopTotal.textContent=total; $shopOrcx.textContent=inv.token||0; $shopBuyBtn.disabled = (inv.token||0) < total; }

    function openShop(){ updateShopCalc(); $shop.classList.add('open'); }
    function closeShop(){ $shop.classList.remove('open'); }

    function shopBuy(){ const inv=getPotatoInv(); const item=$shopItem.value; const qty=Math.max(1, parseInt($shopQty.value||'1',10)); const price=priceOf(item); const total=price*qty; if((inv.token||0)<total) return toast('ORCX 부족'); inv.token-=total; if(item==='seed') S.seed+=qty; if(item==='salt') S.salt+=qty; if(item==='sugar') S.sugar+=qty; setPotatoInv(inv); save(); renderAll(); toast('구매 완료'); closeShop(); }

    $('sync').onclick=async()=>{ await loadFromServer(); };

    // ---------------- 서버 연동 (더미) -----------------
    async function loadFromServer(){ try{ // 실제 엔드포인트는 그대로. 여기선 더미 갱신만.
        const ok = NET_OK; $('netDot').classList.toggle('ok', ok); $('netTxt').textContent = ok? '온라인':'오프라인';
        const inv=getPotatoInv(); $bankToken.textContent=$bankToken2.textContent=inv.token||0; $bankPop.textContent=$bankPop2.textContent=inv.popcorn||0; toast('동기화 완료'); }catch(e){ toast('동기화 실패'); } }

    // 초기 렌더
    let nickname = localStorage.getItem('kakaoNickname') || localStorage.getItem('nickname') || '게스트';
    renderAll(); loadFromServer();

    // --- 모바일 거울 DOM 구성 ---
    (function(){ if(window.matchMedia('(max-width:900px)').matches){
      var mirror=document.createElement('div'); mirror.id='mirror';
      var header=document.createElement('div'); header.id='mirrorHeader';
      header.innerHTML = '<span class="who" id="mWho"></span>'
        + '<span class="line">'
        +   '<span class="pill">🪙 <b id="mTok">0</b></span>'
        +   '<span class="pill">🍿 <b id="mPop">0</b></span>'
        +   '<span class="pill"><span id="mDot" class="dot"></span> <span id="mNet">오프라인</span></span>'
        + '</span>';
      var body=document.createElement('div'); body.id='mirrorBody';
      var s2=document.createElement('div'); s2.id='mSec2'; s2.className='m-sec';
      var s3=document.createElement('div'); s3.id='mSec3'; s3.className='m-sec';
      var s4=document.createElement('div'); s4.id='mSec4'; s4.className='m-sec';
      var s5=document.createElement('div'); s5.id='mSec5'; s5.className='m-sec';
      body.appendChild(s2); body.appendChild(s3); body.appendChild(s4); body.appendChild(s5);
      mirror.appendChild(header); mirror.appendChild(body);
      document.body.appendChild(mirror);
      document.documentElement.style.overflowX = 'hidden'; document.body.style.overflowX = 'hidden';

      // 2) 기존 조각 이동
      var rightPanel=document.querySelector('.hud-right .panel'); if(rightPanel) s2.appendChild(rightPanel);
      var leftPanel=document.querySelector('.hud-left .panel'); if(leftPanel) s3.appendChild(leftPanel);
      var gateDock=document.querySelector('.hud-left .gate-dock'); if(gateDock) s4.appendChild(gateDock);
      var gate=document.getElementById('gate'); if(gate) s4.appendChild(gate);
      var miniWrap=document.querySelector('.mini-wrap'); if(miniWrap) s5.appendChild(miniWrap);

      // 3) 상단 상태 동기화 루프
      function syncHeader(){ try{ var name=(window.nickname || localStorage.getItem('nickname') || localStorage.getItem('kakaoNickname') || '(로그인 필요)'); var inv=(typeof getPotatoInv==='function')? getPotatoInv():{token:0,popcorn:0}; var ok=!!window.NET_OK; document.getElementById('mWho').textContent=name; document.getElementById('mTok').textContent=inv.token||0; document.getElementById('mPop').textContent=inv.popcorn||0; document.getElementById('mDot').classList.toggle('ok', ok); document.getElementById('mNet').textContent=ok?'온라인':'오프라인'; }catch(e){} }
      syncHeader(); setInterval(syncHeader, 800);

      // 4) Level character face inside gate (face-only preview)
      function levelToTier(level){ if(typeof level!=='number'){ var g=(window.S&&S.g)||0; level = Math.floor(g/10)*5 + 1; } var t=Math.floor(level/5)+1; if(t<1)t=1; if(t>10)t=10; return t; }
      function ensureGateFace(){ var card = document.querySelector('#mSec4 .gate .card') || document.querySelector('#gate .card'); if(!card || document.getElementById('gateFace')) return; var box=document.createElement('div'); box.style.cssText='position:absolute;right:10px;top:42px;display:flex;flex-direction:column;align-items:center;gap:4px'; box.innerHTML='<img id="gateFace" src="'+(window.IMG?IMG.charBase:'/OrcaX/img/char/')+'tier1.png" style="width:68px;height:68px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:#000;object-fit:cover">' +'<div id="gateLv" style="font-size:12px;font-weight:700;opacity:.95">1v</div>'; card.appendChild(box); }
      function updateGateFace(){ ensureGateFace(); var img=document.getElementById('gateFace'); var lv=document.getElementById('gateLv'); if(!img||!lv) return; var vt=levelToTier(window.S && S.level); img.src = (window.IMG?IMG.charBase:'/OrcaX/img/char/') + 'tier' + vt + '.png'; lv.textContent = 'Lv' + ((window.S && S.level) || vt); }

      // 모바일 내부에서 게이트 열릴 때 갱신
      try{ updateGateFace(); }catch(e){}

      // 팝업 상태를 위한 스타일 보정은 아래 패치 스크립트에서 처리
    }} )();

  </script>

  <!-- === OrcaX Mobile & Gate Face Patch (2025-08-12) === -->
  <style>
  @media (max-width: 900px){
    /* 배경은 고정, 세로 스크롤만 허용 */
    html, body{ overflow-x: hidden; }
    body{ background-attachment: fixed; }

    /* 모바일 컨테이너 너비 보정 */
    #mirror{ inset: auto !important; top: 10px; bottom: 10px; left: 50%; right: auto; transform: translateX(-50%); width: min(480px, calc(100vw - 20px)); }
    #mirrorHeader{ white-space: nowrap; }

    /* 버튼 바 */
    #mirrorBar{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 10px 0 10px; }
    #mirrorBar .mbtn{ border: 1px solid rgba(255,255,255,.22); background: rgba(0,0,0,.28); color: #fff; border-radius: 12px; padding: 8px 6px; font-size: 13px; line-height: 1.1; }
    #mirrorBody{ padding-top: 8px; }

    /* 오버레이 */
    #mOverlay{ position: absolute; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: .18s ease; }
    #mirror.pop #mOverlay{ opacity: 1; pointer-events: auto; }

    .m-sec{ display: none; }
    .m-sec.pop{ display: block; position: absolute; left: 50%; transform: translateX(-50%); top: 56px; bottom: 60px; width: min(460px, 94vw); overflow-y: auto; overflow-x: hidden; border-radius: 16px; border: 1px solid rgba(255,255,255,.22); background: rgba(0,0,0,.28); backdrop-filter: saturate(1.05) blur(8px); padding: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }

    /* 성장게이트 카드 폭 */
    #mSec4 #gate{ position: static !important; display: block !important; }
    #mSec4 .gate .card{ min-width: auto; width: 100%; }

    /* 하단 미니: 항상 보이되 스크롤 따라붙는 느낌 */
    #mSec5{ position: sticky; bottom: 8px; z-index: 3; }
    #mSec5 .mini-wrap{ position: static !important; display: grid; justify-items: center; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.22); border-radius: 16px; padding: 8px; width: 100%; }
  }
  </style>

  <script>
  /* === OrcaX Mobile Menu & Popup Patch (2025-08-12) === */
  (function(){
    const mq = window.matchMedia('(max-width: 900px)');
    function initMobileMenu(){
      if(!mq.matches) return;
      const mirror = document.getElementById('mirror');
      if(!mirror || document.getElementById('mirrorBar')) return; // once

      const bar = document.createElement('div');
      bar.id = 'mirrorBar';
      bar.innerHTML = [
        '<button class="mbtn" data-target="#mSec3">농사짓기</button>',
        '<button class="mbtn" data-target="#mSec4">성장게이트</button>',
        '<button class="mbtn" data-target="#shop">구매/첨가물</button>',
        '<button class="mbtn" data-target="SYNC">동기화</button>'
      ].join('');
      const body = document.getElementById('mirrorBody');
      mirror.insertBefore(bar, body);

      // Overlay for popups
      const ov = document.createElement('div'); ov.id='mOverlay';
      mirror.appendChild(ov);

      function closeAll(){
        mirror.classList.remove('pop');
        document.querySelectorAll('.m-sec.pop').forEach(el=>el.classList.remove('pop'));
        const shop = document.getElementById('shop');
        if(shop){ shop.classList.remove('open'); }
      }
      ov.addEventListener('click', closeAll);

      bar.addEventListener('click', async (e)=>{
        const btn = e.target.closest('.mbtn'); if(!btn) return;
        const tgt = btn.getAttribute('data-target');
        if(tgt === 'SYNC'){
          if(typeof loadFromServer === 'function'){ try{ await loadFromServer(); toast && toast('동기화 완료'); }catch{} }
          return;
        }
        closeAll();
        if(tgt === '#shop'){
          // open existing shop
          const shop = document.getElementById('shop');
          if(shop){
            mirror.classList.add('pop');
            shop.classList.add('open');
            shop.style.position = 'absolute';
            shop.style.left = '50%';
            shop.style.transform = 'translateX(-50%)';
            shop.style.top = '56px'; shop.style.bottom = '60px';
            shop.style.width = 'min(460px,94vw)';
            shop.style.overflowY = 'auto';
            const c1 = document.getElementById('shopCancel');
            if(c1){ c1.onclick = closeAll; }
          }
          return;
        }
        const panel = document.querySelector(tgt);
        if(panel){
          panel.classList.add('pop');
          mirror.classList.add('pop');
          if(tgt==='#mSec4' && typeof updateGateFace==='function'){ updateGateFace(); }
        }
      });

      // Esc key close
      document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeAll(); } });
    }

    // Ensure PC gate shows character face
    const $btnGate = document.getElementById('btnGate');
    if($btnGate){
      const old = $btnGate.onclick;
      $btnGate.onclick = function(ev){
        if(typeof updateGateFace==='function'){ try{ updateGateFace(); }catch(e){} }
        if(typeof old === 'function'){ old.call(this, ev); }
      }
    }

    document.addEventListener('DOMContentLoaded', function(){ if(typeof updateGateFace==='function'){ try{ updateGateFace(); }catch(e){} } initMobileMenu(); });
    setTimeout(initMobileMenu, 600);
    setTimeout(initMobileMenu, 1500);
  })();

  </script>
</body>
