<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장</title>
  <style>
    :root{
      --ink:#eef6ee; --glass:rgba(0,0,0,.45); --bd:rgba(255,255,255,.18);
      --ok:#25d366; --warn:#f59e0b;
    }
    html,body{height:100%;margin:0;color:var(--ink);background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif}
    /* 배경 레이어 */
    #bg{position:fixed;inset:0;background:#000 center/cover no-repeat;z-index:-1}
    /* 상단 리소스 바(모바일 2줄 자동 줄바꿈) */
    header{
      position:fixed;left:10px;right:10px;top:10px;z-index:9;
      backdrop-filter:blur(6px);background:var(--glass);border:1px solid var(--bd);
      border-radius:14px;padding:8px 10px;
    }
    .topline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .status{width:8px;height:8px;border-radius:999px;background:#ef4444}
    .status.ok{background:var(--ok)}
    .nick{font-weight:800;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .res{
      display:grid;gap:6px;margin-top:6px;
      grid-template-columns:repeat( auto-fit, minmax(120px,1fr) );
    }
    .tag{display:flex;justify-content:space-between;align-items:center;gap:8px;
      padding:6px 8px;border-radius:999px;border:1px solid var(--bd);background:rgba(255,255,255,.08);
      font-size:12px}
    .tag b{font-variant-numeric:tabular-nums}
    /* 하단 액션 바 */
    .actions{
      position:fixed;left:10px;right:10px;bottom:10px;z-index:8;
      display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
      backdrop-filter:blur(6px);background:var(--glass);border:1px solid var(--bd);
      border-radius:14px;padding:8px;
    }
    .btn{
      border:1px solid var(--bd);background:rgba(0,0,0,.25);color:#fff;border-radius:10px;
      padding:10px 8px;font-size:13px;cursor:pointer
    }
    .btn[disabled]{opacity:.55;pointer-events:none}
    /* 중앙 하단: 미니 성장 이미지 */
    .mini-wrap{
      position:fixed;left:50%;transform:translateX(-50%);
      bottom:calc(62px + env(safe-area-inset-bottom));z-index:7;
      display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
      width:min(520px,94vw);
      border:1px solid var(--bd);border-radius:14px;background:rgba(0,0,0,.28);
      padding:8px 10px;
    }
    .nav{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:#fff;text-decoration:none;border:1px solid var(--bd);background:rgba(0,0,0,.35)}
    #miniImg{width:120px;height:120px;border-radius:12px;border:1px solid var(--bd);object-fit:cover;background:#000}
    #miniCap{font-size:12px;opacity:.9}
    /* 게이지 + 레벨(좌측 둥근게이지 느낌) */
    .gauge{
      position:fixed;left:10px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:6;
      width:110px;height:110px;border-radius:999px;border:1px solid var(--bd);background:rgba(0,0,0,.35);
      display:grid;place-items:center;overflow:hidden
    }
    .gfill{position:absolute;inset:0;background:
      conic-gradient(#8ed36b var(--p,0%), rgba(255,255,255,.12) 0)}
    .gnum{position:relative;font-weight:800;font-variant-numeric:tabular-nums}
    .lvface{position:absolute;right:10px;bottom:calc(240px + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:8px}
    .lvface img{width:44px;height:44px;border-radius:999px;border:1px solid var(--bd);background:#000}
    .expbar{width:120px;height:6px;border-radius:999px;border:1px solid var(--bd);background:rgba(255,255,255,.15);overflow:hidden}
    .expbar span{display:block;height:100%;width:0;background:#8ed36b}
    /* 토스트 */
    #toast{position:fixed;left:50%;transform:translateX(-50%);top:62px;z-index:10;
      background:rgba(0,0,0,.65);color:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:13px;display:none}
    #toast.show{display:block}
    @media (max-width:680px){
      .actions{grid-template-columns:repeat(2,1fr)}
      #miniImg{width:96px;height:96px}
      .lvface{left:10px;right:auto}
    }
  </style>
</head>
<body>
  <!-- 배경 -->
  <div id="bg" aria-hidden="true"></div>

  <!-- 상단 리소스 바 -->
  <header>
    <div class="topline">
      <span id="netDot" class="status"></span>
      <span id="netTxt">연결 확인 중…</span>
      <span class="nick" id="nick">(로그인 필요)</span>
    </div>
    <div class="res">
      <div class="tag">💧 물 <b id="r-water">0</b></div>
      <div class="tag">🪴 거름 <b id="r-fert">0</b></div>
      <div class="tag">🌽 옥수수 <b id="r-corn">0</b></div>
      <div class="tag">🍿 팝콘 <b id="r-pop">0</b></div>
      <div class="tag">🧂 소금 <b id="r-salt">0</b></div>
      <div class="tag">🍬 설탕 <b id="r-sugar">0</b></div>
      <div class="tag">🪙 토큰 <b id="r-orcx">0</b></div>
    </div>
  </header>

  <!-- 게이지 + 레벨 -->
  <div class="gauge">
    <div class="gfill" id="gfill" style="--p:0%"></div>
    <div class="gnum" id="gnum">0</div>
  </div>
  <div class="lvface">
    <img id="levelIconMini" src="img/mark_01.png" alt="레벨 아이콘" />
    <div>
      <div id="levelText">Lv.1</div>
      <div class="expbar"><span id="expBar"></span></div>
    </div>
  </div>

  <!-- 미니 상태 -->
  <div class="mini-wrap">
    <a class="nav" href="corn-index.html" title="이전">⬅️</a>
    <img id="miniImg" alt="작물 상태" />
    <a class="nav" href="https://byungil-cho.github.io/OrcaX/index9.html" title="감자 농장">🥔</a>
    <div id="miniCap">상태 확인 중…</div>
  </div>

  <!-- 하단 액션 -->
  <div class="actions">
    <button id="btn-plant" class="btn">씨앗 심기</button>
    <button id="btn-water" class="btn">물 주기</button>
    <button id="btn-fert"  class="btn">거름 주기</button>
    <button id="btn-harv"  class="btn" disabled>수확</button>
    <button id="btn-pop"   class="btn" disabled>뻥튀기</button>
    <button id="btn-ex"    class="btn">팝콘↔거름</button>
  </div>

  <div id="toast"></div>
  <!-- API/로직 -->
  <script src="https://climbing-wholly-grouper.jp.ngrok.io/js/corn-api.js"></script>
</body>
</html>
