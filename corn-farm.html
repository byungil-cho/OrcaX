<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>옥수수 농장</title>
  <style>
    body { margin:0; font-family: system-ui, Roboto, Pretendard, sans-serif; background:#0a1020; color:#eaf1ff; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 12px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .status { display:grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap:8px; margin:12px 0; }
    .pill { background:#0f1630; border:1px solid #223459; border-radius:10px; padding:8px; text-align:center; }
    .farm { position:relative; border:1px solid #223459; border-radius:12px; overflow:hidden; background:#0e142c; }
    .farm img.bg { width:100%; display:block; }
    .farm .overlay { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; pointer-events:none; }
    .farm .bottom { width:100%; padding:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .mini-wrap#crop-panel { position:relative; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:8px 44px; display:flex; align-items:center; gap:10px; }
    .mini-wrap .title { position:absolute; top:4px; left:10px; font-size:12px; color:#9fb6d6; }
    .mini-wrap img { width:70px; height:70px; object-fit:contain; }
    .btns { display:flex; gap:6px; flex-wrap:wrap; }
    button { background:#15224a; border:1px solid #223459; color:#eaf1ff; border-radius:10px; padding:8px 10px; cursor:pointer; }
    button.is-disabled, button:disabled { opacity:.5; cursor:not-allowed; }
    .growth-rail { position:relative; height:10px; background:#09122a; border-radius:6px; border:1px solid #223459; overflow:hidden; }
    .growth-rail .fill { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#6cfaa3,#48b3ff); }
    .links { display:flex; gap:8px; align-items:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 style="font-size:18px;margin:0">🌽 옥수수 농장</h1>
      <div class="links">
        <a href="#" title="왼쪽 링크">🔗</a>
        <a href="#" title="오른쪽 링크">🔗</a>
      </div>
    </header>

    <div class="status">
      <div class="pill">씨앗 <b id="val-seed">0</b></div>
      <div class="pill">물 <b id="val-water">0</b></div>
      <div class="pill">거름 <b id="val-fertil">0</b></div>
      <div class="pill">옥수수 <b id="val-corn">0</b></div>
      <div class="pill">팝콘 <b id="val-pop">0</b></div>
      <div class="pill">소금 <b id="val-salt">0</b></div>
      <div class="pill">설탕 <b id="val-sugar">0</b></div>
      <div class="pill">토큰 <b id="val-token">0</b></div>
    </div>

    <div class="farm">
      <img id="farm-bg" class="bg" src="img/farm_01.png" alt="배경">
      <div class="overlay">
        <div class="bottom">
          <div class="mini-wrap" id="crop-panel">
            <span class="title">작물 상태</span>
            <img id="mini-img" src="img/corn_empty.png" alt="작물 상태">
            <!-- 이 영역 우측에 세로 막대(💧/🌱/🌽)가 자동 삽입됩니다 -->
          </div>
          <div style="flex:1; min-width:240px;">
            <div class="growth-rail"><div id="growth-bar" class="fill"></div></div>
            <div id="txt-grade" style="font-size:12px;color:#9fb6d6;margin-top:6px">예상 등급: -</div>
          </div>
          <div class="btns">
            <button id="btn-plant">씨앗 심기</button>
            <button id="btn-water">물 주기</button>
            <button id="btn-fertilize">거름 주기</button>
            <button id="btn-harvest">수확</button>
            <button id="btn-pop">뻥튀기</button>
            <button id="btn-exchange">팝콘↔거름</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast-area"></div>
  </div>

  <!-- === INLINE RUNTIME (All-in-one) + HOTFIX v2 merged === -->
  <script>
  /* 런타임: API 연동 / 등급(A~F) / 뻥튀기 조건(팝콘+소금+설탕+토큰30) / 결과 오버레이 /
     미니 a_이미지 폴백 / 성장%→배경/미니 교체 / 물·거름·성장 세로막대(이모지 아래, 막대 위) */
  const DEFAULT_ORIGIN=(localStorage.getItem('orcax:DEFAULT_ORIGIN')||'https://climbing-wholly-grouper.jp.ngrok.io').replace(/\/+$/,'');
  const RAW_ORIGIN=(localStorage.getItem('orcax:BASE_API')||DEFAULT_ORIGIN).replace(/\/+$/,'');
  const BASE_ORIGIN=RAW_ORIGIN.replace(/\/api\/?$/i,'');
  const API=(p)=>`${BASE_ORIGIN}/api/${String(p||'').replace(/^\/+/,'')}`;
  const H=(n)=>n*60*60*1000,clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  function now(){return new Date()}
  async function jfetch(url,{method='GET',query,body,headers}={}){
    let u=url; if(query){const qs=new URLSearchParams(); Object.entries(query).forEach(([k,v])=>{if(v!=null)qs.set(k,String(v))}); const q=qs.toString(); if(q)u+=(u.includes('?')?'&':'?')+q}
    const opts={method,headers:Object.assign({'Accept':'application/json'},headers||{})}; if(body!=null){opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body)}
    const r=await fetch(u,Object.assign(opts,{mode:'cors',cache:'no-store'})); const t=await r.text(); const j=(r.headers.get('content-type')||'').includes('application/json'); const d=t?(j?JSON.parse(t):{raw:t}):{}; if(!r.ok) throw Object.assign(new Error('HTTP '+r.status),{data:d,status:r.status}); return d;
  }
  function getKakaoId(){return localStorage.getItem('kakao_id')||localStorage.getItem('orcax:kakaoId')||'demo'}
  function ensureLogin(){const id=getKakaoId(); if(!id){ alert('로그인이 필요합니다. index9.html로 이동'); location.href='index9.html'; return false } return id }
  // timers (localStorage)
  const LKEY='orcax:corn:timers'; function L(){try{return JSON.parse(localStorage.getItem(LKEY)||'{}')}catch(e){return{}}} function S(t){localStorage.setItem(LKEY,JSON.stringify(t||{}))}
  function resetTimers(){S({})}
  function timersOnPlant(iso){const t=L(); t.plantedAt=iso; t.waterDepleteAt=0; t.fertilDepleteAt=0; t.shortageMs=0; t.lastTickAt=now().toISOString(); S(t)}
  function timersAddWater(){const t=L(); const cur=now().getTime(); const end=Math.max(cur,t.waterDepleteAt?new Date(t.waterDepleteAt).getTime():0); const remain=Math.max(0,end-cur); const next=cur+Math.min(H(3),remain+H(1)); t.waterDepleteAt=new Date(next).toISOString(); S(t) }
  function timersAddFertil(){const t=L(); t.fertilDepleteAt=new Date(now().getTime()+H(3)).toISOString(); S(t)}
  function timersTick(){const t=L(); if(!t.lastTickAt) return; const s=new Date(t.lastTickAt).getTime(); const e=now().getTime(); if(e<=s) return;
    const w=t.waterDepleteAt?new Date(t.waterDepleteAt).getTime():0; const f=t.fertilDepleteAt?new Date(t.fertilDepleteAt).getTime():0;
    const coveredEnd=Math.min(e,(w||0)||1e20,(f||0)||1e20); const covered=Math.max(0,coveredEnd-s); const dt=e-s; const shortage=dt-covered;
    t.shortageMs=(t.shortageMs||0)+Math.max(0,shortage); t.lastTickAt=new Date(e).toISOString(); S(t);
  }
  function calcGrowth(){const t=L(); if(!t.plantedAt) return null; const planted=new Date(t.plantedAt).getTime(); const eff=(now().getTime()-planted)-(t.shortageMs||0); return clamp(eff/H(120)*100,0,100) }
  function waterPct(){const t=L(); if(!t.waterDepleteAt) return 0; const rem=new Date(t.waterDepleteAt).getTime()-now().getTime(); return clamp(rem/H(3)*100,0,100) }
  function fertilPct(){const t=L(); if(!t.fertilDepleteAt) return 0; const rem=new Date(t.fertilDepleteAt).getTime()-now().getTime(); return clamp(rem/H(3)*100,0,100) }
  function predictedGrade(){const t=L(); if(!t.plantedAt) return null; const days=5+(t.shortageMs||0)/H(24); if(days<5.5)return'A'; if(days<6.5)return'B'; if(days<7.5)return'C'; if(days<8.5)return'D'; if(days<9.5)return'E'; return'F'}
  const $=s=>document.querySelector(s);
  function injectStyle(){ if(document.getElementById('corn-runtime-style')) return; const css=document.createElement('style'); css.id='corn-runtime-style'; css.textContent=`
  .corn-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:9999}
  .corn-overlay .box{background:rgba(8,12,24,.88);border:1px solid #2a3c63;border-radius:14px;padding:16px 18px;min-width:280px;max-width:560px;color:#eaf1ff;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .corn-overlay .box h4{margin:0 0 8px;font-size:16px}
  .corn-overlay .kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
  .corn-overlay .pos{color:#7ee787}.corn-overlay .neg{color:#ff8e8e}
  /* 이모지 아래 + 위로 세로막대 */
  .corn-panel{position:relative}
  .corn-panel #corn-bars{ position:absolute; right:10px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; z-index:5 }
  .corn-panel #corn-bars .meter{ display:flex; flex-direction:column; align-items:center; gap:6px }
  .corn-panel #corn-bars .meter .bar{ width:6px; height:96px; border:1px solid rgba(255,255,255,.25); border-radius:6px; overflow:hidden; background:rgba(0,0,0,.25); position:relative }
  .corn-panel #corn-bars .meter .bar .fill{ position:absolute; left:0; bottom:0; width:100%; height:0 }
  .corn-panel #corn-bars .meter.water .bar .fill{ background:linear-gradient(to top, rgba(120,190,255,.9), rgba(120,190,255,.35)) }
  .corn-panel #corn-bars .meter.fert  .bar .fill{ background:linear-gradient(to top, rgba(255,210,120,.9), rgba(255,210,120,.35)) }
  .corn-panel #corn-bars .meter.grow  .bar .fill{ background:linear-gradient(to top, rgba(140,255,140,.95), rgba(140,255,140,.35)) }
  .corn-panel #corn-bars .meter .emoji{ font-size:16px; line-height:1; text-shadow:0 1px 2px rgba(0,0,0,.6) }
  .corn-panel #corn-link-left, .corn-panel #corn-link-right{ position:absolute; top:50%; transform:translateY(-50%); z-index:6 }
  .corn-panel #corn-link-left{ left:8px } .corn-panel #corn-link-right{ right:40px }
  `; document.head.appendChild(css); }
  function mountBars(){
    var panel=document.getElementById('crop-panel') || (document.getElementById('mini-img') && document.getElementById('mini-img').closest('div'));
    if(!panel) return; panel.classList.add('corn-panel');
    let bars=document.getElementById('corn-bars');
    if(!bars){ bars=document.createElement('div'); bars.id='corn-bars'; panel.appendChild(bars); }
    bars.innerHTML=`
      <div class="meter water"><div class="bar"><div class="fill" id="bar-water"></div></div><div class="emoji">💧</div></div>
      <div class="meter fert"><div class="bar"><div class="fill" id="bar-fert"></div></div><div class="emoji">🌱</div></div>
      <div class="meter grow"><div class="bar"><div class="fill" id="bar-grow"></div></div><div class="emoji">🌽</div></div>
    `;
    const links=[...panel.querySelectorAll('a,button')].filter(el=>!el.closest('#corn-bars'));
    if(links[0] && !document.getElementById('corn-link-left'))  links[0].id='corn-link-left';
    if(links[1] && !document.getElementById('corn-link-right')) links[1].id='corn-link-right';
  }
  function setMiniByGrowth(g){
    let mini=document.getElementById('mini-img'); if(!mini) return;
    const base=(g>=100)?'corn_ready.png':(g>=80)?'corn_70.png':(g>=60)?'corn_50.png':(g>=40)?'corn_30.png':(g>0)?'corn_seedling.png':'corn_empty.png';
    const mobile=(window.matchMedia && matchMedia('(max-width: 640px)').matches) || (window.innerWidth <= 640);
    const srcMini=`img/a_${base}`, srcFull=`img/${base}`;
    mini.onerror=function(){ if(mini.getAttribute('data-a-tried')==='1') return; mini.setAttribute('data-a-tried','1'); mini.src=srcFull };
    mini.setAttribute('data-a-tried', mobile?'0':'1'); mini.src = mobile ? srcMini : srcFull;
  }
  function setSeasonBackground(g){ const idx=(g>=80)?'05':(g>=60)?'04':(g>=40)?'03':(g>=20)?'02':'01'; const target=document.getElementById('farm-bg'); if(!target) return; const next=`img/farm_${idx}.png`; if(target.getAttribute('src')!==next) target.setAttribute('src', next); }
  let state={user:{},summary:{},corn:{}};
  function setText(id,v){const el=document.getElementById(id); if(el) el.textContent=(v??'0')}
  function setDisabled(el,d){ if(!el)return; el.disabled=!!d; el.classList.toggle('is-disabled',!!d) }
  async function loadAll(){
    const kakaoId=ensureLogin(); if(!kakaoId) return;
    try{
      const [user,summary]=await Promise.all([ jfetch(API('userdata'),{method:'POST',body:{kakaoId}}), jfetch(API('corn/summary'),{method:'GET',query:{kakaoId}}) ]);
      state.user=user||{}; state.summary=summary||{}; state.corn=summary?.corn||{};
      const t=L(); const plantedAt=(state.corn.plantedAt||state.summary.plantedAt||state.user.plantedAt||null); if(plantedAt && !t.plantedAt) timersOnPlant(plantedAt);
      render();
    }catch(e){ console.error(e); showToast('서버 연결 실패','error'); }
  }
  function render(){
    injectStyle(); mountBars(); timersTick();
    const u=state.user||{}, s=state.summary||{}, inv=s.inventory||{}, corn=s.corn||{};
    setText('val-seed',inv.seedCorn??inv.seed??0); setText('val-water',u.water??s.water??0); setText('val-fertil',u.fertilizer??s.fertilizer??0); setText('val-corn',s.cornCount??0);
    setText('val-pop',inv.popcorn??s.popcorn??0); setText('val-salt',inv.salt??0); setText('val-sugar',inv.sugar??0); setText('val-token',u.token??s.token??0);
    const g=calcGrowth(); if(g!=null){ const bar=$('#growth-bar'); if(bar) bar.style.width = Math.round(g)+'%'; setMiniByGrowth(g); setSeasonBackground(g);
      const bw=$('#bar-water'), bf=$('#bar-fert'), bg=$('#bar-grow'); if(bw) bw.style.height = Math.round(waterPct())+'%'; if(bf) bf.style.height = Math.round(fertilPct())+'%'; if(bg) bg.style.height = Math.round(g)+'%';
    }
    const grade=predictedGrade(); setText('txt-grade', grade?('예상 등급: '+grade):'예상 등급: -');
    const btnPlant=$('#btn-plant'), btnWater=$('#btn-water'), btnFert=$('#btn-fertilize'), btnHarv=$('#btn-harvest'), btnPop=$('#btn-pop'), btnExch=$('#btn-exchange');
    const hasSeed=(inv.seedCorn??inv.seed??0)>0, hasWater=(u.water??s.water??0)>0, hasFertil=(u.fertilizer??s.fertilizer??0)>0, hasPop=(inv.popcorn??s.popcorn??0)>0;
    const salt=inv.salt??0, sugar=inv.sugar??0, token=u.token??s.token??0, growth=g??0, ready=(growth>=90);
    setDisabled(btnPlant, !(hasSeed && growth===0)); setDisabled(btnWater, !hasWater); setDisabled(btnFert, !hasFertil); setDisabled(btnHarv, !ready); setDisabled(btnPop, !(hasPop && salt>=1 && sugar>=1 && token>=30)); setDisabled(btnExch, !hasPop);
  }
  setInterval(render, 30000);
  function showOverlayDelta(before,after,title,details){
    try{const keys=['seed','water','fertilizer','cornCount','popcorn','salt','sugar','token']; const names={seed:'씨앗',water:'물',fertilizer:'거름',cornCount:'옥수수',popcorn:'팝콘',salt:'소금',sugar:'설탕',token:'토큰'};
      const diff={}; for(const k of keys){ const b=(before[k]??0), a=(after[k]??0); if(a!==b) diff[k]=a-b }
      const wrap=document.createElement('div'); wrap.className='corn-overlay'; const box=document.createElement('div'); box.className='box';
      const kvs=Object.entries(diff).map(([k,v])=>{const cls=v>=0?'pos':'neg'; const sign=v>0?'+':''; return `<div>${names[k]}</div><div class="${cls}">${sign}${v}</div>`}).join('');
      box.innerHTML=`<h4>${title||'결과'}</h4>${details?`<div style="font-size:12px;margin-bottom:6px;color:#9fb6d6">${details}</div>`:''}<div class="kv">${kvs||'<div>변경 사항 없음</div><div></div>'}</div>`;
      wrap.appendChild(box); document.body.appendChild(wrap); setTimeout(()=>wrap.remove(),1800);
    }catch(e){console.warn(e)}
  }
  function snap(){const u=state.user||{}, s=state.summary||{}, inv=s.inventory||{}; return {seed:inv.seedCorn??inv.seed??0, water:u.water??s.water??0, fertilizer:u.fertilizer??s.fertilizer??0, cornCount:s.cornCount??0, popcorn:inv.popcorn??s.popcorn??0, salt:inv.salt??0, sugar:inv.sugar??0, token:u.token??s.token??0}}
  async function act(ep, body, {title, details}={}){
    const kakaoId=ensureLogin(); if(!kakaoId) return; const before=snap();
    try{
      const r=await jfetch(API(ep),{method:'POST',body:Object.assign({kakaoId},body||{})});
      if(ep==='corn/plant'){ timersOnPlant(new Date().toISOString()) } else if(ep==='corn/water'){ timersAddWater() } else if(ep==='corn/fertilize'){ timersAddFertil() } else if(ep==='corn/harvest'){ resetTimers() }
      await loadAll(); const after=snap();
      let det = details||''; if(ep==='corn/pop' && r){ const br=r.breakdown||{}; det=`등급 ${r.grade||'-'} · 토큰(상:${br.hi||0} 중:${br.mid||0} 하:${br.low||0}) · 토큰 +${r.tokenGained||0} · 팝콘 +${br.pop||0}` }
      if(ep==='corn/harvest' && r){ det=`등급 ${r.grade||'-'} · 옥수수 +${r.qty||r.cornGained||0}` }
      showOverlayDelta(before, after, title||ep.toUpperCase(), det);
    }catch(e){ showToast((e?.data?.message)||'요청 실패','error') }
  }
  document.getElementById('btn-plant').onclick = ()=>act('corn/plant', null, {title:'씨앗 심기'});
  document.getElementById('btn-water').onclick = ()=>act('corn/water', null, {title:'물 주기'});
  document.getElementById('btn-fertilize').onclick = ()=>act('corn/fertilize', null, {title:'거름 주기'});
  document.getElementById('btn-harvest').onclick = ()=>act('corn/harvest', null, {title:'수확'});
  document.getElementById('btn-pop').onclick = ()=>act('corn/pop', {tokenCost:30}, {title:'뻥튀기'});
  document.getElementById('btn-exchange').onclick = ()=>act('corn/exchange', {type:'popcorn-to-fertilizer', qty:1}, {title:'교환'});
  function showToast(msg,type){ const el=document.getElementById('toast-area'); const d=document.createElement('div'); d.className=`toast ${type||''}`; d.textContent=msg; (el||document.body).appendChild(d); setTimeout(()=>d.remove(),2500) }
  window.addEventListener('DOMContentLoaded', ()=>{ injectStyle(); mountBars(); loadAll(); });
  </script>
</body>
</html>
