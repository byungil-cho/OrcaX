<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>옥수수 농장</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background: url('img/farm_bg_summer.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      overflow: hidden;
    }
    header, footer {
      position: fixed; left: 0; right: 0;
      background: rgba(0,0,0,0.4);
      padding: 8px 16px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 5;
    }
    header { top: 0; }
    footer { bottom: 0; }
    #nickname { font-weight: bold; color: #ffd700; }

    .resources {
      display: flex; gap: 16px;
    }
    .resource { display: flex; align-items: center; gap: 4px; }

    /* 게이지 */
    .gauges {
      position: fixed;
      bottom: 60px; left: 20px;
      display: flex; gap: 20px;
      align-items: flex-end;
    }
    .bar {
      width: 24px; height: 150px;
      background: #333; border-radius: 6px;
      overflow: hidden; position: relative;
    }
    .bar-fill {
      position: absolute; bottom: 0; left: 0;
      width: 100%; height: 50%;
      transition: height 0.5s;
    }
    .bar.water .bar-fill { background: #00bfff; }
    .bar.fertilizer .bar-fill { background: #228b22; }

    .circular {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 10px solid rgba(255,255,255,0.3);
      position: relative;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 18px;
    }
    .circular .inner {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 50%;
      clip-path: polygon(50% 50%, 50% 0, 100% 0, 100% 100%, 0 100%, 0 0, 50% 0);
      background: rgba(255,215,0,0.6);
      transform-origin: center bottom;
      transform: rotate(0deg);
      transition: transform 1s linear;
    }

    /* 팝업 */
    #popup {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #222; color: #fff;
      padding: 20px; border-radius: 12px;
      display: none; z-index: 10;
    }
    #popup h3 { margin-top: 0; }
    #popup button { margin-top: 10px; padding: 6px 12px; }

    .balloon {
      position: fixed; top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      background: #ffd700; color: #000;
      padding: 8px 12px;
      border-radius: 8px;
      display: none; z-index: 15;
    }
  </style>
</head>
<body>
  <header>
    <div>환영합니다, <span id="nickname"></span> 님</div>
    <div class="resources">
      <div class="resource">💧<span id="water">0</span></div>
      <div class="resource">🌱<span id="fertilizer">0</span></div>
      <div class="resource">🌽<span id="seedCorn">0</span></div>
      <div class="resource">🧂<span id="salt">0</span></div>
      <div class="resource">🍬<span id="sugar">0</span></div>
      <div class="resource">🍿<span id="popcorn">0</span></div>
    </div>
  </header>

  <div class="gauges">
    <div class="bar water"><div class="bar-fill" id="waterBar"></div></div>
    <div class="bar fertilizer"><div class="bar-fill" id="fertilizerBar"></div></div>
    <div class="circular">
      <div class="inner" id="growthCircle"></div>
      <span id="growthText">0/5</span>
    </div>
  </div>

  <footer>
    <button onclick="openPopup()">구매하기</button>
    <div>레벨: <span id="level">1</span></div>
  </footer>

  <div id="popup">
    <h3>구매</h3>
    <button onclick="buyItem('salt',10)">🧂 소금 (10 토큰)</button><br>
    <button onclick="buyItem('sugar',20)">🍬 설탕 (20 토큰)</button><br>
    <button onclick="buyItem('seedCorn',100)">🌽 씨옥수수 (100 토큰)</button><br>
    <button onclick="closePopup()">닫기</button>
  </div>

  <div class="balloon" id="balloon"></div>

  <script>
    let kakaoId = localStorage.getItem("kakaoId");
    let nickname = localStorage.getItem("nickname");

    async function loadData() {
      const res = await fetch('/api/userdata', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ kakaoId })
      });
      const data = await res.json();
      if(data.success){
        document.getElementById('nickname').textContent = data.user.nickname;
        document.getElementById('water').textContent = data.user.inventory.water;
        document.getElementById('fertilizer').textContent = data.user.inventory.fertilizer;
        document.getElementById('seedCorn').textContent = data.user.agri.seedCorn;
        document.getElementById('salt').textContent = data.user.additives.salt;
        document.getElementById('sugar').textContent = data.user.additives.sugar;
        document.getElementById('popcorn').textContent = data.user.food.popcorn;

        updateBars(data.user.inventory.water, data.user.inventory.fertilizer);
        updateGrowth(2); // 테스트용: 2일 진행
      }
    }

    function updateBars(water, fertilizer){
      document.getElementById('waterBar').style.height = Math.min(100, water*10)+'%';
      document.getElementById('fertilizerBar').style.height = Math.min(100, fertilizer*10)+'%';
    }

    function updateGrowth(days){
      let deg = (days/5)*360;
      document.getElementById('growthCircle').style.transform = 'rotate('+deg+'deg)';
      document.getElementById('growthText').textContent = days+'/5';
    }

    function openPopup(){ document.getElementById('popup').style.display='block'; }
    function closePopup(){ document.getElementById('popup').style.display='none'; }

    async function buyItem(type,cost){
      const res = await fetch('/api/corn/buy-additive',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ kakaoId, item:type, cost })
      });
      const data = await res.json();
      if(data.success){
        showBalloon(type+' 구매 완료!');
        loadData();
      } else {
        showBalloon('구매 실패');
      }
      closePopup();
    }

    function showBalloon(msg){
      const b = document.getElementById('balloon');
      b.textContent = msg;
      b.style.display='block';
      setTimeout(()=>b.style.display='none',2000);
    }

    loadData();
  </script>
</body>
</html>
