<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>옥수수 농장</title>
  <style>
    html, body { height:100%; margin:0; background:#000;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif; }
    .wrap{ position:fixed; inset:0; background:url('img/farm_00.png') center/cover no-repeat; }

    .hud{
      position:fixed; left:12px; top:12px; z-index:20; color:#fff;
      background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.2);
      border-radius:14px; padding:10px 12px; backdrop-filter:blur(6px);
      max-width:min(92vw, 560px);
    }
    .hud .nick{ font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
    .hud .nick .status{ width:8px; height:8px; border-radius:999px; background:#e23; }
    .hud .nick.online .status{ background:#3ecf8e; }
    .hud .res{ display:flex; flex-wrap:wrap; gap:8px; }
    .tag{ font-size:12px; line-height:1; padding:6px 8px; border-radius:999px;
      background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); }
    .tag b{ font-weight:700; }

    .panel{
      position:absolute; left:50%; top:55%; transform:translate(-50%,-50%);
      width:min(92vw, 560px); background:rgba(0,0,0,.45); color:#fff;
      border:1px solid rgba(255,255,255,.2); border-radius:16px; padding:16px;
      box-shadow:0 20px 40px rgba(0,0,0,.45);
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .btn{
      font-size:14px; padding:10px 14px; border-radius:10px;
      border:1px solid rgba(255,255,255,.25); background:rgba(0,0,0,.35);
      color:#fff; cursor:pointer;
    }
    .log{ margin-top:12px; font-size:14px; white-space:pre-line; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud" id="hud">
      <div class="nick" id="hudNick"><span class="status"></span><span>(로그인 확인 중)</span></div>
      <div class="res" id="hudRes">
        <span class="tag">💧 물 <b id="r-water">0</b></span>
        <span class="tag">🪴 거름 <b id="r-fert">0</b></span>
        <span class="tag">🌽 옥수수 <b id="r-corn">0</b></span>
        <span class="tag">🍿 팝콘 <b id="r-pop">0</b></span>
        <span class="tag">🧂 소금 <b id="r-salt">0</b></span>
        <span class="tag">🍬 설탕 <b id="r-sugar">0</b></span>
        <span class="tag">🪙 토큰 <b id="r-orcx">0</b></span>
      </div>
    </div>

    <div class="panel">
      <div style="font-weight:700;">옥수수 농장</div>
      <div class="row">
        <button class="btn" id="btnRefresh">새로고침</button>
        <button class="btn" id="btnHarvest">수확하기</button>
        <button class="btn" id="btnPop">팝콘 만들기</button>
        <button class="btn" id="btnBack">메인으로</button>
        <button class="btn" id="btnGoPotato">감자 농장</button>
      </div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    // ===== 설정/공통 =====
    const BASE_API =
      localStorage.getItem('orcax:BASE_API') ||
      'https://<KIT-HOST>:3060'; // ← 실제 3060 HTTPS 주소

    const tokenKeys = ['orcax:token','token','authToken','jwt'];
    const nickKeys  = ['orcax:nick','orcax:nickname','nickname','userNickname','kakaoNickname'];
    const guess = (keys, d='')=>{ for(const k of keys){ const v=localStorage.getItem(k); if(v) return v; } return d; };
    const authToken = guess(tokenKeys, '');
    const localNick = guess(nickKeys, '(로그인 필요)');

    const hudNick = document.getElementById('hudNick');
    const hudRes  = {
      water: document.getElementById('r-water'),
      fert : document.getElementById('r-fert'),
      corn : document.getElementById('r-corn'),
      pop  : document.getElementById('r-pop'),
      salt : document.getElementById('r-salt'),
      sugar: document.getElementById('r-sugar'),
      orcx : document.getElementById('r-orcx'),
    };
    const logEl = document.getElementById('log');

    function setNick(name, online=false){
      hudNick.classList.toggle('online', !!online);
      hudNick.innerHTML = `<span class="status"></span><span>${name||'(로그인 필요)'}</span>`;
    }
    function setRes(x){
      hudRes.water.textContent = x.water ?? 0;
      hudRes.fert .textContent = x.fertilizer ?? 0;
      hudRes.corn .textContent = x.corn ?? 0;
      hudRes.pop  .textContent = x.popcorn ?? 0;
      hudRes.salt .textContent = x.salt ?? 0;
      hudRes.sugar.textContent = x.sugar ?? 0;
      hudRes.orcx .textContent = x.orcx ?? 0;
    }
    function log(t){ logEl.textContent = `${t}\n${logEl.textContent}`.slice(0,4000); }

    setNick(localNick,false); setRes({});

    async function fetchJSON(url, opt={}){
      const headers = {'Content-Type':'application/json', ...(opt.headers||{})};
      const o = { method:'GET', mode:'cors', ...opt, headers };
      const r = await fetch(url, o);
      if(!r.ok) throw new Error(`${r.status}`);
      return r.json();
    }

    async function loadFromServer(){
      try{
        await fetchJSON(`${BASE_API}/api/health`, {cache:'no-store'});
        const me = await fetchJSON(`${BASE_API}/api/user/me`, {
          headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
        });
        const name = me.nickname || me.nick || localNick || '(알 수 없음)';
        setNick(name, true);
        setRes({
          water      : me.inventory?.water ?? 0,
          fertilizer : me.inventory?.fertilizer ?? 0,
          corn       : me.agri?.corn ?? 0,
          popcorn    : me.food?.popcorn ?? 0,
          salt       : me.additives?.salt ?? 0,
          sugar      : me.additives?.sugar ?? 0,
          orcx       : me.wallet?.orcx ?? 0,
        });
        log('서버 연결 성공');
      }catch(e){
        setNick(localNick || '(오프라인)', false);
        const gv = k=>Number(localStorage.getItem(k) || 0);
        setRes({
          water: gv('orcax:inv:water'),
          fertilizer: gv('orcax:inv:fertilizer'),
          corn: gv('orcax:agri:corn'),
          popcorn: gv('orcax:food:popcorn'),
          salt: gv('orcax:add:salt'),
          sugar: gv('orcax:add:sugar'),
          orcx: gv('orcax:wallet:orcx'),
        });
        log('서버 연결 실패 — 로컬값 표시');
      }
    }

    async function doHarvest(){
      try{
        const r = await fetch(`${BASE_API}/api/corn/harvest`, {
          method:'POST', mode:'cors',
          headers:{ 'Content-Type':'application/json', ...(authToken?{'Authorization':`Bearer ${authToken}`}:{}) }
        });
        const data = await r.json();
        if(!r.ok) throw new Error(data?.error||('HTTP '+r.status));
        log(`수확 성공: +${data.gain}`);
        await loadFromServer();
      }catch(e){ log(`수확 실패: ${e.message}`); }
    }

    async function doPop(){
      try{
        const r = await fetch(`${BASE_API}/api/corn/pop`, {
          method:'POST', mode:'cors',
          headers:{ 'Content-Type':'application/json', ...(authToken?{'Authorization':`Bearer ${authToken}`}:{}) }
        });
        const data = await r.json();
        if(!r.ok) throw new Error(data?.error||('HTTP '+r.status));
        if(data.result==='popcorn') log(`팝콘 성공: +${data.qty}`);
        else if(data.result==='token') log(`토큰 보상: +${data.qty}`);
        else log('완료');
        await loadFromServer();
      }catch(e){ log(`팝콘 실패: ${e.message}`); }
    }

    document.getElementById('btnRefresh').addEventListener('click', loadFromServer);
    document.getElementById('btnHarvest').addEventListener('click', doHarvest);
    document.getElementById('btnPop').addEventListener('click', doPop);
    document.getElementById('btnBack').addEventListener('click', ()=>location.href='corn-index.html');
    document.getElementById('btnGoPotato').addEventListener('click', ()=>location.href='https://byungil-cho.github.io/OrcaX/index9.html');

    loadFromServer();
  </script>
</body>
</html>
