<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>옥수수 농장</title>
<style>
  html,body{height:100%; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;}
  body{
    background:#000 url('img/farm_05.png') center/cover no-repeat fixed; /* 배경 기본값 (파종 후 2일차 예시) */
  }

  /* ===== 상단 리소스 바 & 구매 버튼(닉네임 옆) ===== */
  .ox-topbar {
    position: fixed; left: 16px; right: 16px; top: 16px; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
  }
  .ox-chip-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .ox-chip{
    display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:14px;
    background: rgba(0,0,0,.12); color:#fff; font-weight:600; backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.10);
  }
  .ox-nick{ font-size:18px; font-weight:800; }
  .ox-buy-btn{
    padding: 8px 12px; border-radius: 999px; margin-left:10px;
    background: rgba(0,0,0,.18); color:#fff; font-weight:700; border:1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(6px); cursor:pointer;
  }
  .ox-buy-btn:hover{ background: rgba(0,0,0,.22); }

  /* ===== 좌측 HUD(원형 게이지/레벨 카드) ===== */
  .ox-left-hud{
    position: fixed; left: 18px; bottom: 160px; z-index: 40;
  }
  .ox-level-card{
    position: fixed; left: 18px; bottom: 96px; z-index: 40;
    display:flex; align-items:center; gap:10px;
    padding:8px 12px; border-radius:12px;
    background: rgba(0,0,0,.12); color:#fff; border:1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(6px);
  }
  .ox-level-card .avatar{
    width:40px; height:40px; border-radius:50%; background:#c24; flex:0 0 auto;
  }
  .ox-level-card .level{
    width:160px; height:10px; background:rgba(255,255,255,.12); border-radius:999px; overflow:hidden;
  }
  .ox-level-card .level > i{
    display:block; height:100%; width:30%; background:#7dd56f;
  }

  /* ===== 중앙 HUD(미니 이미지 + 세로 3게이지) ===== */
  .ox-center-hud{
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 140px; width: min(720px, 92vw);
    display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px;
    background: rgba(0,0,0,.12); border:1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(6px); color:#fff;
  }
  .mini{
    width:160px; height:160px; border-radius:14px; overflow:hidden; background:#222; flex:0 0 auto;
    border:1px solid rgba(255,255,255,.10);
  }
  .mini img{ width:100%; height:100%; object-fit:cover; }

  .v-gauges{ display:flex; align-items:flex-end; gap:18px; flex:1; height:140px; }
  .v{ position:relative; width:18px; height:100%; background:rgba(255,255,255,.16); border-radius:8px; overflow:hidden; border:1px solid rgba(255,255,255,.10); }
  .v > i{ position:absolute; left:0; bottom:0; width:100%; height:40%; background:linear-gradient(to top, rgba(0,176,255,.9), rgba(0,176,255,.5)); }
  .v.f > i{ background:linear-gradient(to top, rgba(255,190,0,.95), rgba(255,190,0,.5)); }
  .v.g > i{ background:linear-gradient(to top, rgba(66,200,92,.95), rgba(66,200,92,.5)); }

  .icons{ display:flex; gap:14px; align-items:center; }
  .icons .i{ font-size:22px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }

  .ox-grow-label{ margin-left:auto; padding:6px 10px; border-radius:10px; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.12); }

  /* ===== 하단 버튼 바 ===== */
  .ox-bottom-bar{
    position: fixed; left:0; right:0; bottom: 10px; z-index: 45; padding: 0 16px;
    display:grid; grid-template-columns: repeat(4, 1fr); gap:12px;
    background: rgba(0,0,0,.08); /* 연하게 */
    border-top: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(4px);
  }
  .ox-btn{
    height:64px; border-radius:14px; border:1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.12); color:#fff; font-size:18px; font-weight:700;
  }
  .ox-btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* 모바일에서 원형/레벨을 위로 올려서 겹침 해소 */
  @media (max-width: 768px){
    .ox-left-hud { position: fixed; left: 10px; top: calc(70px + 12px); bottom:auto; }
    .ox-level-card{ position: fixed; left: 10px; top: calc(70px + 120px); bottom:auto; }
    .ox-center-hud{ bottom: 110px; }
    .ox-bottom-bar{ grid-template-columns: 1fr 1fr; row-gap:10px; padding-bottom: 12px; }
  }

  /* 구매 시트(모달) */
  .ox-sheet {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: min(560px, 92vw);
    background: rgba(20,20,20,.88);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px; padding: 16px;
    color:#fff; z-index: 100; display:none;
  }
  .ox-sheet.open { display:block; }
  .ox-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; }
  .ox-qty { display:flex; align-items:center; gap:8px; }
  .ox-qty button { width:32px; height:32px; border-radius:8px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#fff; }
  .ox-qty input { width:56px; text-align:center; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); border-radius:8px; color:#fff; padding:6px 8px; }
  .ox-sheet .ox-footer { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
  .ox-primary { padding:10px 14px; border-radius:12px; background:#4CAF50; color:white; font-weight:700; border:none; }
  .ox-secondary { padding:10px 14px; border-radius:12px; background:rgba(255,255,255,.12); color:white; border:1px solid rgba(255,255,255,.18); }
  .ox-hint { font-size:12px; opacity:.85; margin-top:8px; }
  .ox-toast {
    position: fixed; left:50%; bottom: 24px; transform:translateX(-50%);
    background: rgba(20,20,20,.9); color:#fff; padding:10px 14px; border-radius:10px;
    z-index: 120; display:none;
  }
  .ox-toast.show { display:block; }
</style>
</head>
<body>

  <!-- ===== 상단 리소스 바 / 닉네임 + 구매하기(왼쪽) ===== -->
  <div class="ox-topbar">
    <div class="ox-chip-row">
      <div class="ox-chip"><span class="ox-nick" id="nick">온라인 범고래X</span></div>
      <button class="ox-buy-btn" id="btnOpenBuy">구매하기</button>
    </div>
    <div class="ox-chip-row" id="resBar">
      <div class="ox-chip">🌱 씨앗 <b id="r-seed">0</b></div>
      <div class="ox-chip">💧 물 <b id="r-water">0</b></div>
      <div class="ox-chip">🌿 거름 <b id="r-fert">0</b></div>
      <div class="ox-chip">🌽 옥수수 <b id="r-corn">0</b></div>
      <div class="ox-chip">🍿 팝콘 <b id="r-pop">0</b></div>
      <div class="ox-chip">🧂 소금 <b id="r-salt">0</b></div>
      <div class="ox-chip">🍬 설탕 <b id="r-sugar">0</b></div>
      <div class="ox-chip">🪙 토큰 <b id="r-token">0</b></div>
    </div>
  </div>

  <!-- ===== 좌측 원형 게이지(샘플) + 레벨 카드 ===== -->
  <div class="ox-left-hud">
    <svg width="140" height="140" viewBox="0 0 36 36">
      <path d="M18 2.0845
               a 15.9155 15.9155 0 0 1 0 31.831
               a 15.9155 15.9155 0 0 1 0 -31.831"
            fill="none" stroke="rgba(255,255,255,.15)" stroke-width="3"/>
      <path id="pie" d="M18 2.0845
               a 15.9155 15.9155 0 0 1 0 31.831"
            fill="none" stroke="#7dd56f" stroke-width="3" stroke-dasharray="44,56"/>
      <text x="18" y="20" text-anchor="middle" fill="#fff" font-size="6" font-weight="700" id="pieTxt">44</text>
    </svg>
  </div>
  <div class="ox-level-card">
    <div class="avatar"></div>
    <div class="level"><i id="lvBar" style="width:30%"></i></div>
    <div style="font-weight:800;margin-left:8px;" id="lvTxt">Lv.1</div>
  </div>

  <!-- ===== 중앙 HUD: 미니 이미지 + 세로 3게이지 + 성장률 ===== -->
  <div class="ox-center-hud">
    <div class="mini"><img id="miniImg" alt="작물 상태" src="img/a_corn_06_02.png"></div>
    <div class="v-gauges">
      <div class="v"><i id="g-water" style="height:60%"></i></div>
      <div class="v f"><i id="g-fert" style="height:30%"></i></div>
      <div class="v g"><i id="g-grow" style="height:56%"></i></div>
    </div>
    <div class="icons">
      <div class="i">💧</div>
      <div class="i">🌿</div>
      <div class="i">🌱</div>
    </div>
    <div class="ox-grow-label">성장 <b id="growPct">56%</b></div>
  </div>

  <!-- ===== 하단 버튼 바 ===== -->
  <div class="ox-bottom-bar">
    <button class="ox-btn" id="btnPlant">씨앗 심기</button>
    <button class="ox-btn" id="btnWater">물 주기</button>
    <button class="ox-btn" id="btnFert">거름 주기</button>
    <button class="ox-btn" id="btnHarvest">수확</button>
    <button class="ox-btn" id="btnPopSwap" style="grid-column: 1 / -1;">팝콘↔거름</button>
  </div>

  <!-- ===== 구매 시트(모달) ===== -->
  <div class="ox-sheet" id="oxBuySheet" role="dialog" aria-modal="true">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">구매하기</h3>
      <button class="ox-secondary" id="btnCloseBuy">닫기</button>
    </div>

    <div class="ox-row">
      <div>🌽 씨옥수수 <small>개당 100 토큰</small></div>
      <div class="ox-qty">
        <button data-k="seed" data-op="-">−</button>
        <input id="qty-seed" type="number" min="0" value="0">
        <button data-k="seed" data-op="+">+</button>
      </div>
    </div>

    <div class="ox-row">
      <div>🧂 소금 <small>개당 10 토큰</small></div>
      <div class="ox-qty">
        <button data-k="salt" data-op="-">−</button>
        <input id="qty-salt" type="number" min="0" value="0">
        <button data-k="salt" data-op="+">+</button>
      </div>
    </div>

    <div class="ox-row">
      <div>🍬 설탕 <small>개당 20 토큰</small></div>
      <div class="ox-qty">
        <button data-k="sugar" data-op="-">−</button>
        <input id="qty-sugar" type="number" min="0" value="0">
        <button data-k="sugar" data-op="+">+</button>
      </div>
    </div>

    <div class="ox-footer">
      <div>
        합계: <b id="oxTotal">0</b> 토큰
        <div class="ox-hint">구매 확정 시 서버 구매 API로 요청합니다. 실패/404면 구매되지 않으며 안내가 출력됩니다.</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="ox-secondary" id="btnResetBuy">초기화</button>
        <button class="ox-primary" id="btnConfirmBuy">구매 확정</button>
      </div>
    </div>
  </div>

  <div class="ox-toast" id="oxToast"></div>

<script>
/* ====================== 프런트 로직 ====================== */

/** 가격표(프런트 계산용) */
const OX_PRICE = { seed:100, salt:10, sugar:20 };

/** 구매 API 후보 경로들(404 자동 폴백) */
const OX_ENDPOINTS = [
  '/api/store/buy', // 권장
  '/api/shop/buy',  // 예전 경로 호환
  '/api/buy'        // 단순 호환
];

/* ====== 토스트 ====== */
function oxToast(msg, ms=2200){
  const t = document.getElementById('oxToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), ms);
}

/* ====== 리소스 바/UI 갱신 헬퍼 ====== */
function setText(id, v){ const el=document.getElementById(id); if(el) el.textContent = v; }
function refreshTopbar(summary){
  // summary 형식 예시:
  // { token: 52225, inventory: { seed, water, fertilizer, popcorn, salt, sugar, corn }, nickname, level, levelPct }
  if(!summary) return;

  const inv = summary.inventory || {};
  setText('r-seed', inv.seed ?? 0);
  setText('r-water', inv.water ?? 0);
  setText('r-fert', inv.fertilizer ?? 0);
  setText('r-corn', inv.corn ?? 0);
  setText('r-pop', inv.popcorn ?? 0);
  setText('r-salt', inv.salt ?? 0);
  setText('r-sugar', inv.sugar ?? 0);
  setText('r-token', summary.token ?? 0);

  if(summary.nickname){ setText('nick', '온라인 ' + summary.nickname); }
  if(typeof summary.levelPct === 'number'){
    document.getElementById('lvBar').style.width = Math.max(0,Math.min(100,summary.levelPct))+'%';
  }
  if(summary.level){ setText('lvTxt', 'Lv.'+summary.level); }
}

/* ====== 서버 요약 호출(있으면 사용) ====== */
async function loadSummary(){
  try{
    const r = await fetch('/api/corn/summary');
    if(r.ok){ const data = await r.json(); refreshTopbar(data); }
  }catch(e){ /* 서버 없어도 무시 */ }
}

/* ====== 중앙 HUD 게이지 샘플 조작 ====== */
function setGauge(elId, pct){ document.getElementById(elId).style.height = Math.max(0,Math.min(100,pct))+'%'; }
function setGrowPct(p){ setText('growPct', Math.round(p)+'%'); setGauge('g-grow', p); }

/* ====== 하단 버튼: (프로젝트 API에 맞춰 교체 가능) ====== */
async function callApi(path, payload={}){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('API '+path+' '+r.status);
  return r.json().catch(()=> ({}));
}
document.getElementById('btnPlant').addEventListener('click', async ()=>{
  try{
    await callApi('/api/corn/plant');
    oxToast('파종 완료!');
    loadSummary();
    // 상태 이미지/배경 갱신은 프로젝트 로직에 연결
  }catch(e){ oxToast('파종 실패'); }
});
document.getElementById('btnWater').addEventListener('click', async ()=>{
  try{
    await callApi('/api/corn/water');
    oxToast('물을 줬습니다');
    setGauge('g-water', 100);
    loadSummary();
  }catch(e){ oxToast('물 주기 실패'); }
});
document.getElementById('btnFert').addEventListener('click', async ()=>{
  try{
    await callApi('/api/corn/fertilize');
    oxToast('거름을 줬습니다');
    setGauge('g-fert', 100);
    loadSummary();
  }catch(e){ oxToast('거름 주기 실패'); }
});
document.getElementById('btnHarvest').addEventListener('click', async ()=>{
  try{
    await callApi('/api/corn/harvest');
    oxToast('수확 완료!');
    loadSummary();
  }catch(e){ oxToast('수확 실패'); }
});
document.getElementById('btnPopSwap').addEventListener('click', async ()=>{
  try{
    await callApi('/api/corn/swap');
    oxToast('팝콘↔거름 교환 완료!');
    loadSummary();
  }catch(e){ oxToast('교환 실패'); }
});

/* ====== 구매 시트 ====== */
const oxSheet   = document.getElementById('oxBuySheet');
const btnOpen   = document.getElementById('btnOpenBuy');
const btnClose  = document.getElementById('btnCloseBuy');
const btnReset  = document.getElementById('btnResetBuy');
const btnOk     = document.getElementById('btnConfirmBuy');
const totalEl   = document.getElementById('oxTotal');

const qtyEls = {
  seed:  document.getElementById('qty-seed'),
  salt:  document.getElementById('qty-salt'),
  sugar: document.getElementById('qty-sugar')
};
let buyState = { seed:0, salt:0, sugar:0 };

function calcTotal(){
  const sum = (buyState.seed*OX_PRICE.seed) + (buyState.salt*OX_PRICE.salt) + (buyState.sugar*OX_PRICE.sugar);
  totalEl.textContent = String(sum);
  return sum;
}
function syncInputs(){
  qtyEls.seed.value  = buyState.seed;
  qtyEls.salt.value  = buyState.salt;
  qtyEls.sugar.value = buyState.sugar;
  calcTotal();
}
function clamp(v){ v = parseInt(v||0,10); return Math.max(0, isNaN(v)?0:v); }

btnOpen.addEventListener('click', ()=>{ oxSheet.classList.add('open'); syncInputs(); });
btnClose.addEventListener('click', ()=>{ oxSheet.classList.remove('open'); });
btnReset.addEventListener('click', ()=>{ buyState={seed:0,salt:0,sugar:0}; syncInputs(); });

document.querySelectorAll('.ox-qty button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const k = btn.getAttribute('data-k');
    const op = btn.getAttribute('data-op');
    buyState[k] = clamp(buyState[k] + (op==='+'?1:-1));
    syncInputs();
  });
});
Object.entries(qtyEls).forEach(([k,el])=>{
  el.addEventListener('input', ()=>{ buyState[k] = clamp(el.value); calcTotal(); });
});

/* 404 자동 폴백 구매 호출 */
async function fetchWithFallback(payload){
  let lastErr;
  for(const path of OX_ENDPOINTS){
    try{
      const r = await fetch(path, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      if(r.ok){ return { ok:true, path, data: await r.json().catch(()=> ({})) }; }
      if(r.status===404){ lastErr = new Error('404 '+path); continue; }
      const text = await r.text().catch(()=> '');
      return { ok:false, path, status:r.status, text };
    }catch(e){ lastErr = e; }
  }
  return { ok:false, error:lastErr?.message || 'all endpoints failed' };
}

btnOk.addEventListener('click', async ()=>{
  const amount = calcTotal();
  if(amount<=0){ oxToast('구매 수량을 선택하세요.'); return; }

  const payload = { items: { seed: buyState.seed, salt: buyState.salt, sugar: buyState.sugar } };
  btnOk.disabled = true; btnOk.textContent = '구매 중…';
  try{
    const res = await fetchWithFallback(payload);
    if(!res.ok){
      const msg = res.status? `구매 실패(${res.status})` : `구매 실패(${res.error||'네트워크'})`;
      oxToast(msg);
    }else{
      oxToast('구매 완료!');
      buyState={seed:0,salt:0,sugar:0}; syncInputs();
      oxSheet.classList.remove('open');
      // 응답값으로 인벤토리/토큰 반영
      if(res.data){ refreshTopbar(res.data); }
      else{ loadSummary(); }
    }
  }finally{
    btnOk.disabled = false; btnOk.textContent = '구매 확정';
  }
});

/* 초기 로딩 */
loadSummary();
setGrowPct(56);
</script>
</body>
</html>
