<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가맹점 신청</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 30px auto; }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0; }
    button { background: #0066ff; color: white; padding: 10px; border: none; width: 100%; cursor: pointer; }
    #result { margin-top: 20px; font-weight: bold; color: red; }
  </style>
</head>
<body>
  <h2>가맹점 신청</h2>
  <form id="form" enctype="multipart/form-data">
    <input name="name" placeholder="대표자명" required id="name" />
    <input name="phone" placeholder="전화번호" required id="phone" />
    <input name="corpnum" placeholder="사업자번호" required />
    <input name="region" placeholder="지역" required />
    <input name="address" placeholder="주소" required />
    <input name="type" placeholder="업종" required />
    <textarea name="note" placeholder="비고사항"></textarea>
    <input type="file" name="file" />
    <button type="submit">신청하기</button>
  </form>
  <div id="result"></div>

  <script>
    // 로그인 상태 확인
    const nickname = localStorage.getItem("nickname");
    const phone = localStorage.getItem("phone");
    const email = localStorage.getItem("email");

    if (!nickname) {
      alert("로그인이 필요합니다. 로그인 페이지로 이동합니다.");
      window.location.href = "login.html";
    } else {
      // 자동으로 대표자명, 전화번호 채우기 (있다면)
      document.getElementById("name").value = nickname;
      if (phone) document.getElementById("phone").value = phone;
    }

    const form = document.getElementById("form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(form);

      try {
        const response = await fetch("https://orcax-franchise-backend.onrender.com/api/apply", {
          method: "POST",
          body: formData
        });

        if (response.ok) {
          window.location.href = "thankyou.html";
        } else {
          result.textContent = "\u274c 전송 실패! 서버 오류 (" + response.status + ")";
          result.style.color = "red";
        }
      } catch (err) {
        result.textContent = "\u274c 네트워크 오류: " + err.message;
        result.style.color = "red";
      }
    });
  </script>

</body>
</html>
