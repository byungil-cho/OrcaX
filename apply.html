<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 가맹점 신청</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Pretendard:400,700&display=swap" />
  <style>
    body { background: #e3f0fd; font-family: 'Pretendard', sans-serif; margin:0; }
    .container {
      max-width: 400px;
      margin: 60px auto; padding: 32px 24px;
      background: #fff; border-radius: 20px; box-shadow: 0 4px 24px rgba(40,80,160,0.09);
      min-height: 80vh;
    }
    h2 { color: #2196f3; text-align: center; font-size: 2rem; margin-bottom: 8px;}
    #server-status { text-align:center; margin-bottom:24px; font-weight:600; }
    label { display: block; margin:18px 0 8px; color:#247bb7; font-weight:700; }
    input { width:100%; padding:10px; border-radius:8px; border:1px solid #d4e6f9; font-size:1rem; background:#f6fbff; }
    button { width:100%; margin-top:24px; background:linear-gradient(90deg,#5ec3ff,#2196f3); color:#fff; font-size:1.2rem; border:0; border-radius:10px; padding:12px 0; font-weight:700; cursor:pointer; }
    button:active { background: #1976d2;}
  </style>
</head>
<body>
  <div class="container">
    <h2>OrcaX 가맹점 신청</h2>
    <div id="server-status">● 서버 상태 확인 중...</div>
    <form id="applyForm">
      <label for="name">대표자명*</label>
      <input type="text" id="name" required>
      <label for="phone">전화번호*</label>
      <input type="text" id="phone" required>
      <label for="bizNo">사업자번호*</label>
      <input type="text" id="bizNo" required>
      <label for="region">지역</label>
      <input type="text" id="region">
      <label for="address">주소*</label>
      <input type="text" id="address" required>
      <label for="category">업종*</label>
      <input type="text" id="category" required>
      <button type="submit">가맹점 신청</button>
    </form>
  </div>
  <script src="/js/apply.js"></script>
</body>
</html>
