<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 가맹점 신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #23336c 0%, #141925 100%);
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #ffe164;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .apply-container {
      background: rgba(27,32,58,0.97);
      border-radius: 22px;
      box-shadow: 0 8px 36px #0008;
      padding: 42px 32px 34px 32px;
      max-width: 450px;
      width: 96vw;
      margin: 28px 0;
      text-align: center;
    }
    h2 {
      color: #ffe164;
      font-size: 1.7rem;
      margin-bottom: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .apply-form label {
      display: block;
      margin-bottom: 0.35em;
      margin-top: 1.3em;
      color: #fff6ce;
      text-align: left;
      font-weight: 600;
    }
    .apply-form input, .apply-form textarea {
      width: 100%;
      border-radius: 10px;
      border: none;
      margin-bottom: 0.2em;
      padding: 12px;
      font-size: 1.08em;
      background: #222d4d;
      color: #ffe164;
      outline: none;
      box-sizing: border-box;
      border-bottom: 2px solid #28326b;
      transition: border .2s;
    }
    .apply-form input:focus, .apply-form textarea:focus {
      border-bottom: 2px solid #ffe164;
      background: #28326b;
    }
    .apply-form textarea {
      min-height: 70px;
      resize: vertical;
    }
    .apply-form input[type="file"] {
      background: none;
      color: #fff6ce;
      border: none;
      padding: 0;
    }
    .file-preview {
      margin-top: 7px;
      margin-bottom: 8px;
      text-align: left;
      color: #ffe164;
      font-size: 0.95em;
    }
    .submit-btn {
      width: 100%;
      margin-top: 1.8em;
      font-size: 1.13em;
      background: linear-gradient(90deg, #ffe164 30%, #ffd700 90%);
      color: #253056;
      font-weight: bold;
      border: none;
      padding: 13px 0;
      border-radius: 11px;
      cursor: pointer;
      box-shadow: 0 2px 16px #ffe16440;
      transition: background .17s, color .17s;
    }
    .submit-btn:active {
      background: #ffd700;
      color: #222;
    }
    #result {
      margin-top: 24px;
      font-weight: bold;
      font-size: 1.08em;
      min-height: 36px;
      color: #ffe164;
      text-shadow: 0 1px 4px #000a;
      word-break: keep-all;
    }
    @media (max-width: 560px) {
      .apply-container { padding: 19vw 3vw 7vw 3vw; }
      h2 { font-size: 1.28rem; }
      .submit-btn { font-size: 1em; padding: 10px 0;}
    }
  </style>
</head>
<body>
  <div class="apply-container">
    <h2>OrcaX 가맹점 신청</h2>
    <form class="apply-form" id="applyForm" enctype="multipart/form-data" autocomplete="off">
      <label for="name">대표자명*</label>
      <input name="name" id="name" placeholder="대표자명" required />
      <label for="phone">전화번호*</label>
      <input name="phone" id="phone" placeholder="전화번호" required />
      <label for="corpnum">사업자번호*</label>
      <input name="corpnum" id="corpnum" placeholder="사업자번호" required />
      <label for="region">지역*</label>
      <input name="region" id="region" placeholder="지역" required />
      <label for="address">주소*</label>
      <input name="address" id="address" placeholder="주소" required />
      <label for="type">업종*</label>
      <input name="type" id="type" placeholder="업종" required />
      <label for="note">비고사항</label>
      <textarea name="note" id="note" placeholder="비고사항 (선택)"></textarea>
      <label for="file">첨부파일</label>
      <input type="file" name="file" id="file" accept="image/*,.pdf,.doc,.docx" />
      <div class="file-preview" id="filePreview"></div>
      <button class="submit-btn" type="submit" id="submitBtn">신청하기</button>
    </form>
    <div id="result"></div>
  </div>
  <script src="js/apply.js"></script>
</body>
</html>
