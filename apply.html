<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 가맹점 신청</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: auto; }
    input, textarea, button { display: block; width: 100%; margin-bottom: 1rem; padding: 0.5rem; }
    #result { font-weight: bold; margin-top: 1rem; color: red; }
  </style>
</head>
<body>
  <h1>가맹점 신청</h1>
  <form id="applyForm" enctype="multipart/form-data">
    <input name="name" placeholder="상호명" required />
    <input name="phone" placeholder="연락처" required />
    <input name="biznum" placeholder="사업자등록번호" required />
    <input name="region" placeholder="지역" required />
    <input name="address" placeholder="주소" required />
    <input name="type" placeholder="업종" required />
    <textarea name="message" placeholder="비고사항"></textarea>
    <input type="file" name="file" required />
    <button type="submit">신청하기</button>
  </form>
  <div id="result"></div>

  <!-- 👇 apply.js는 같은 폴더에 있으므로 상대 경로로 연결 -->
  <script src="./apply.js"></script>
</body>
</html>
