<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 가맹점 신청서</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: auto; }
    input, textarea, button { display: block; width: 100%; margin-bottom: 1rem; padding: 0.5rem; }
    #result { font-weight: bold; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>가맹점 신청</h1>

  <form id="applyForm" enctype="multipart/form-data">
    <input type="text" name="name" placeholder="상호명" required />
    <input type="text" name="phone" placeholder="연락처" required />
    <input type="text" name="biznum" placeholder="사업자등록번호" required />
    <input type="text" name="region" placeholder="지역" required />
    <input type="text" name="address" placeholder="주소" required />
    <input type="text" name="type" placeholder="업종" required />
    <textarea name="message" placeholder="비고사항"></textarea>
    <input type="file" name="file" required />
    <button type="submit">신청하기</button>
  </form>

  <div id="result"></div>

  <script src="apply.js"></script>
</body>
</html>
