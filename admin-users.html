
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>관리자 - 유저 현황</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 8px;
      text-align: center;
      border: 1px solid #ccc;
    }
    th {
      background-color: #f2f2f2;
    }
    .online {
      background-color: #d4edda;
    }
  </style>
</head>
<body>
  <h2>유저 현황 (관리자 페이지)</h2>
  <table id="userTable">
    <thead>
      <tr>
        <th>닉네임</th>
        <th>물</th>
        <th>거름</th>
        <th>ORCX 토큰</th>
        <th>감자 수</th>
        <th>접속 상태</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function fetchUsers() {
      const res = await fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/userdata/all");
      const users = await res.json();
      const connected = JSON.parse(localStorage.getItem("connectedUsers") || "[]");

      const tbody = document.querySelector("#userTable tbody");
      tbody.innerHTML = "";

      users.forEach(user => {
        const tr = document.createElement("tr");
        if (connected.includes(user.kakaoId)) tr.classList.add("online");

        tr.innerHTML = `
          <td>${user.nickname}</td>
          <td>${user.water}</td>
          <td>${user.fertilizer}</td>
          <td>${user.orcx ?? 0}</td>
          <td>${user.potatoCount}</td>
          <td>${connected.includes(user.kakaoId) ? "온라인" : "오프라인"}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    fetchUsers();
  </script>
</body>
</html>
