<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>관리자 - 유저 관리</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f8f9fa; }
    h1, h2 { text-align: center; }
    .status { font-weight: bold; }
    .green { color: green; }
    .red { color: red; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #eee; }
    .top-menu {
      background: #575757; padding: 0.4rem 0;
      text-align: center; font-size: 1.07rem; margin-bottom: 10px;
    }
    .top-menu a, .top-menu span {
      padding: 0.4rem 1rem; border-radius: 16px; margin: 0 0.12rem; font-weight: bold;
      display: inline-block;
    }
    .top-menu a { color: #fff; text-decoration: none; background: #2ebca0; transition: background 0.15s; }
    .top-menu a:hover { background: #22a6a0; color: #fff; }
    .top-menu .active-menu { background: #888; color: #fff; cursor: default; pointer-events: none; border: 2px solid #fff2; }
    button { padding: 6px 16px; background: #2ebca0; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;}
    button:hover { background: #22a6a0; }
    input[type="number"] { width: 80px; padding: 4px; }
    .complete { background: #b2f6c3; color: #1c714b; font-weight: bold;}
  </style>
</head>
<body>
  <div class="top-menu">
    <a href="index9.html">메인</a>
    <a href="admin-market.html">씨앗관리</a>
    <a href="gamja-shop.html">씨앗상점</a>
    <a href="auction-house.html">마이페이지</a>
    <span class="active-menu">관리자</span>
  </div>
  <h1>🛠 관리자 - 유저 관리 페이지</h1>
  <p style="text-align:center;">서버 전원 상태: <span id="powerStatus" class="status">확인 중...</span></p>

  <h2>👤 가입된 유저 목록 및 자산 현황</h2>
  <table id="userTable">
    <thead>
      <tr>
        <th>닉네임</th>
        <th>카카오ID</th>
        <th>접속 상태</th>
        <th>ORCX<br>(수정/지급)</th>
        <th>물</th>
        <th>거름</th>
        <th>감자</th>
        <th>보리</th>
        <th>씨감자</th>
        <th>씨보리</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>💸 출금 요청 목록</h2>
  <table id="withdrawTable">
    <thead>
      <tr>
        <th>이름</th>
        <th>전화번호</th>
        <th>지갑 주소</th>
        <th>출금금액</th>
        <th>요청 시간</th>
        <th>상태</th>
        <th>관리자 처리</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API_BASE = "https://climbing-wholly-grouper.jp.ngrok.io";

    async function fetchPowerStatus() {
      try {
        const res = await fetch(`${API_BASE}/api/power-status`);
        const data = await res.json();
        const statusEl = document.getElementById('powerStatus');
        if (data.mongo) {
          statusEl.textContent = data.status;
          statusEl.classList.add('green');
        } else {
          statusEl.textContent = data.status;
          statusEl.classList.add('red');
        }
      } catch (err) {
        document.getElementById('powerStatus').textContent = '🔴 오류 발생';
        document.getElementById('powerStatus').classList.add('red');
      }
    }

    async function fetchUsers() {
      const res = await fetch(`${API_BASE}/api/userdata/all`);
      const users = await res.json();
      const tbody = document.querySelector('#userTable tbody');
      tbody.innerHTML = '';
      users.forEach(user => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${user.nickname}</td>
          <td>${user.kakaoId}</td>
          <td>${user.isConnected ? '🟢' : '🔴'}</td>
          <td>
            <input type="number" value="${user.orcx ?? 0}" min="0" id="orcx-${user.kakaoId}">
            <button onclick="updateToken('${user.kakaoId}')">수정/지급</button>
          </td>
          <td>${user.water ?? 0}</td>
          <td>${user.fertilizer ?? 0}</td>
          <td>${user.potatoCount ?? 0}</td>
          <td>${user.barleyCount ?? 0}</td>
          <td>${user.seedPotato ?? 0}</td>
          <td>${user.seedBarley ?? 0}</td>
        `;
        tbody.appendChild(row);
      });
    }

    async function fetchWithdrawals() {
      const res = await fetch(`${API_BASE}/api/withdraw`);
      const data = await res.json();
      const tbody = document.querySelector('#withdrawTable tbody');
      tbody.innerHTML = '';
      data.forEach(w => {
        const completed = !!w.completed; // 출금완료 상태 여부
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${w.name}</td>
          <td>${w.phone}</td>
          <td>${w.wallet}</td>
          <td>${w.amount ?? ''}</td>
          <td>${new Date(w.createdAt).toLocaleString()}</td>
          <td class="${completed ? 'complete' : ''}">${completed ? '완료' : '대기중'}</td>
          <td>
            ${completed
              ? ''
              : `<button onclick="processWithdraw('${w._id}', '${w.nickname}', ${w.amount ?? 0})">출금하기</button>`
            }
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // 관리자에서 직접 ORCX 수정/지급
    async function updateToken(kakaoId) {
      const input = document.getElementById(`orcx-${kakaoId}`);
      const amount = Number(input.value);
      if (isNaN(amount) || amount < 0) return alert("올바른 금액 입력");
      if (!confirm(`토큰 잔액을 ${amount}으로 변경?`)) return;
      try {
        const res = await fetch(`${API_BASE}/api/user/update-token`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kakaoId, orcx: amount })
        });
        const data = await res.json();
        if (data.success) {
          alert("수정 완료");
          fetchUsers();
        } else {
          alert(data.message || "수정 실패");
        }
      } catch {
        alert("서버 오류");
      }
    }

    // 출금신청 내역에서 '출금하기' 클릭 시 자동 차감
    async function processWithdraw(withdrawId, nickname, amount) {
      if (!amount || amount < 1) return alert("출금 금액 오류");
      if(!confirm(`${nickname}님의 토큰을 ${amount}만큼 차감하고 출금처리 하시겠습니까?`)) return;
      try {
        const res = await fetch(`${API_BASE}/api/withdraw/process`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ withdrawId, amount })
        });
        const result = await res.json();
        if (result.success) {
          alert("출금 완료!");
          fetchWithdrawals();
          fetchUsers();
        } else {
          alert(result.message || "처리 실패");
        }
      } catch (err) {
        alert("서버 오류: 처리 실패");
      }
    }

    fetchPowerStatus();
    fetchUsers();
    fetchWithdrawals();
    window.updateToken = updateToken;
    window.processWithdraw = processWithdraw;
  </script>
</body>
</html>
