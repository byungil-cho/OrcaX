<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오 로그인 처리 중...</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f7f8fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
    }
    h2 {
      color: #222;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .status {
      font-size: 1rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h2>⏳ 카카오 로그인 처리 중입니다...</h2>
  <div class="status">잠시만 기다려주세요.</div>

  <script>
    const code = new URL(window.location.href).searchParams.get("code");

    if (code) {
      console.log("✅ 인가코드 수신:", code);

      // 실제 환경에선 여기에 토큰 요청 백엔드 API 호출 필요
      // 예시:
      // fetch("/auth/kakao/token", { method: "POST", body: JSON.stringify({ code }) })

      setTimeout(() => {
        alert("로그인 성공! 인가코드: " + code);
        // 로그인 이후 원하는 페이지로 이동
        window.location.href = "index.html";
      }, 1500);
    } else {
      console.warn("❌ 인가 코드 없음. 로그인 실패 혹은 사용자 취소.");
      document.querySelector(".status").textContent = "로그인 실패 또는 취소됨.";
    }
  </script>
</body>
</html>
