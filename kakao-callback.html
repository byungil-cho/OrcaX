<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카카오 로그인 콜백</title>
</head>
<body>
  <script>
    const code = new URL(window.location.href).searchParams.get("code");

    if (!code) {
      alert("인증 코드가 없습니다. 로그인 페이지로 이동합니다.");
      window.location.href = "https://byungil-cho.github.io/OrcaX/index.html";
    } else {
      const data = new URLSearchParams();
      data.append("grant_type", "authorization_code");
      data.append("client_id", "284b798a9d9be8202f9c2e129fa6f329");
      data.append("redirect_uri", "https://byungil-cho.github.io/OrcaX/kakao-callback.html");
      data.append("code", code);

      fetch("https://kauth.kakao.com/oauth/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: data.toString()
      })
      .then(res => res.json())
      .then(data => {
        const accessToken = data.access_token;
        if (!accessToken) {
          alert("Access token 획득 실패: " + JSON.stringify(data));
          window.location.href = "https://byungil-cho.github.io/OrcaX/index.html";
          return;
        }
        return fetch("https://kapi.kakao.com/v2/user/me", {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
      })
      .then(res => res?.json())
      .then(profile => {
        const nickname = profile?.properties?.nickname || "사용자";
        const userId = profile?.id || "unknown";

        // 저장 성공 여부와 상관없이 로컬에 저장 (원상복구)
        localStorage.setItem("nickname", nickname);
        localStorage.setItem("userId", userId);

        // 서버로 사용자 정보 전송
        fetch("https://orcax-farm-6000.onrender.com/api/saveUser", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            nickname: nickname,
            userId: userId
          })
        })
        .catch(err => {
          console.warn("서버 저장 실패 (무시):", err);
        });

        // 로그인 후 index.html로 바로 이동
        window.location.href = "https://byungil-cho.github.io/OrcaX/index.html?nickname=" + encodeURIComponent(nickname);
      })
      .catch(err => {
        console.error("로그인 중 오류", err);
        alert("로그인 오류 발생. 로그인 페이지로 이동합니다.\n" + err);
        window.location.href = "https://byungil-cho.github.io/OrcaX/index.html";
      });
    }
  </script>
</body>
</html>
