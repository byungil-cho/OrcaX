<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>카카오 로그인 처리</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 3rem;
    }
    #profile {
      margin-top: 2rem;
      font-size: 1.2rem;
      color: #333;
    }
    button {
      margin-top: 1.5rem;
      padding: 10px 20px;
      background: #eee;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>👤 로그인 처리 중...</h1>
  <p id="status">잠시만 기다려주세요...</p>
  <div id="profile" style="display: none;"></div>
  <button id="logoutBtn" style="display: none;" onclick="logout()">로그아웃</button>

  <script>
    const code = new URL(window.location.href).searchParams.get("code");
    const REST_API_KEY = "284b798a9d9be8202f9c2e129fa6f329";
    const REDIRECT_URI = "https://byungil-cho.github.io/OrcaX/kakao-callback.html";

    if (!code) {
      document.getElementById("status").innerText = "❌ 로그인 실패: 인가 코드 없음";
    } else {
      fetch("https://kauth.kakao.com/oauth/token", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
        },
        body: new URLSearchParams({
          grant_type: "authorization_code",
          client_id: REST_API_KEY,
          redirect_uri: REDIRECT_URI,
          code: code,
        }),
      })
      .then(res => res.json())
      .then(data => {
        if (!data.access_token) throw new Error("토큰 발급 실패");
        return fetch("https://kapi.kakao.com/v2/user/me", {
          headers: { Authorization: `Bearer ${data.access_token}` },
        });
      })
      .then(res => res.json())
      .then(profile => {
        const nickname = profile.kakao_account.profile.nickname;
        localStorage.setItem("nickname", nickname);

        document.getElementById("status").style.display = "none";
        document.getElementById("profile").style.display = "block";
        document.getElementById("logoutBtn").style.display = "inline-block";
        document.getElementById("profile").innerText = `안녕하세요, ${nickname}님!`;

        // ✅ 로그인 성공 후 자동 리디렉션
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500); // 1.5초 정도 보여주고 메인으로 이동
      })
      .catch(err => {
        console.error("로그인 실패:", err);
        document.getElementById("status").innerText = "⚠️ 로그인 오류 발생";
      });
    }

    function logout() {
      localStorage.removeItem("nickname");
      location.href = "index.html";
    }
  </script>
</body>
</html>
