<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Kakao Login Callback</title>
</head>
<body>
  <p>로그인 처리 중입니다...</p>

  <script>
    const code = new URLSearchParams(window.location.search).get('code');

    if (!code) {
      alert("로그인 코드가 없습니다.");
      window.location.href = 'signup.html';
    } else {
      // 카카오 서버에 access_token 요청
      fetch("https://kauth.kakao.com/oauth/token", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
          grant_type: "authorization_code",
          client_id: "da9d920093d6529c8474650b3f13d1c2", // 자바스크립트 키
          redirect_uri: "https://byungil-cho.github.io/OrcaX/kakao-callback.html",
          code: code
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.access_token) {
          // 사용자 정보 요청
          return fetch("https://kapi.kakao.com/v2/user/me", {
            method: "GET",
            headers: {
              Authorization: `Bearer ${data.access_token}`
            }
          });
        } else {
          throw new Error("access_token 없음: " + JSON.stringify(data));
        }
      })
      .then(res => res.json())
      .then(userData => {
        console.log("Kakao User:", userData);

        // 로그인 성공 → 로그인 성공 페이지로 이동
        window.location.href = 'login-success.html';
      })
      .catch(err => {
        alert("로그인 실패: " + err.message);
        window.location.href = 'signup.html';
      });
    }
  </script>
</body>
</html>
