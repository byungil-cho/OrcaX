<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>카카오 로그인 처리 중...</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 3rem;
    }
  </style>
</head>
<body>
  <h1>⏳ 카카오 로그인 처리 중입니다...</h1>
  <p>잠시만 기다려주세요.</p>

  <script>
    const code = new URL(window.location.href).searchParams.get("code");
    const REST_API_KEY="284b798a9d9be8202f9c2e129fa6f329";
    const REDIRECT_URI="https://byungil-cho.github.io/OrcaX/kakao-callback.html";

    if (!code) {
      alert("인가 코드가 없습니다. 로그인 실패!");
    } else {
      // 토큰 요청
      fetch("https://kauth.kakao.com/oauth/token", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
        },
        body: new URLSearchParams({
          grant_type: "authorization_code",
          client_id: REST_API_KEY,
          redirect_uri: REDIRECT_URI,
          code: code,
        }),
      })
      .then(res => res.json())
      .then(data => {
        if (data.access_token) {
          // 사용자 정보 요청
          return fetch("https://kapi.kakao.com/v2/user/me", {
            method: "GET",
            headers: {
              Authorization: `Bearer ${data.access_token}`,
            },
          });
        } else {
          throw new Error("토큰 발급 실패");
        }
      })
      .then(res => res.json())
      .then(profile => {
        console.log("🔓 로그인한 사용자:", profile);
        alert(`로그인 성공: ${profile.kakao_account.email || '이메일 없음'}`);
        window.location.href = "/OrcaX/index.html"; // 원하는 페이지로 리다이렉트
      })
      .catch(err => {
        console.error("로그인 실패:", err);
        alert("로그인 중 오류가 발생했습니다.");
      });
    }
  </script>
</body>
</html>
