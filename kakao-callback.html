<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>카카오 로그인 콜백</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
  <p>로그인 처리 중입니다... 🐳</p>

  <script>
    (async () => {
      const code = new URL(location.href).searchParams.get("code");
      if (!code) {
        alert("카카오 인증 코드가 없습니다.");
        return;
      }

      try {
        const response = await fetch(`https://kauth.kakao.com/oauth/token`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: new URLSearchParams({
            grant_type: 'authorization_code',
            client_id: '284b798a9d9be8202f9c2e129fa6f329',
            redirect_uri: 'https://byungil-cho.github.io/OrcaX/kakao-callback.html',
            code: code
          })
        });

        const tokenData = await response.json();
        const accessToken = tokenData.access_token;

        const userRes = await fetch('https://kapi.kakao.com/v2/user/me', {
          headers: {
            Authorization: `Bearer ${accessToken}`
          }
        });

        const userData = await userRes.json();
        const nickname = userData.kakao_account.profile.nickname;
        const userId = userData.id;

        localStorage.setItem("nickname", nickname);
        localStorage.setItem("userId", userId);
        console.log("카카오 로그인 완료:", nickname, userId);

        // ✅ 로그인 완료 후 입구로 이동
        window.location.href = "https://byungil-cho.github.io/OrcaX/orcax-farm-000.html";

      } catch (err) {
        console.error("로그인 중 오류 발생:", err);
        alert("로그인 처리 중 오류가 발생했습니다.");
      }
    })();
  </script>
</body>
</html>
