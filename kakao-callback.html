<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Kakao Login Callback</title>
</head>
<body>
    <p>로그인 처리 중입니다...</p>
    <script>
        async function handleLogin() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (!code) {
                alert("카카오 로그인 코드가 없습니다.");
                return;
            }

            try {
                const response = await fetch("https://kauth.kakao.com/oauth/token", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        grant_type: "authorization_code",
                        client_id: "da9d920093d6529c8474650b3f13d1c2",  // JavaScript 키
                        redirect_uri: "https://byungil-cho.github.io/OrcaX/kakao-callback.html",
                        code: code
                    })
                });

                const data = await response.json();

                if (data.access_token) {
                    localStorage.setItem("kakao_access_token", data.access_token);
                    window.location.href = "/OrcaX/kakao-callback.html ";
                } else {
                    alert("access_token 없음: " + JSON.stringify(data));
                }
            } catch (error) {
                alert("로그인 중 오류 발생: " + error.message);
            }
        }

        handleLogin();
    </script>
</body>
</html>
