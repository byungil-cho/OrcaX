<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 중...</title>
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
</head>
<body>
  <script>
    Kakao.init('284b798a9d9be8202f9c2e129fa6f329');
    const code = new URL(window.location.href).searchParams.get("code");

    if (code) {
      fetch(`https://kauth.kakao.com/oauth/token`, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
          grant_type: "authorization_code",
          client_id: "284b798a9d9be8202f9c2e129fa6f329",
          redirect_uri: "https://byungil-cho.github.io/OrcaX/kakao-callback.html",
          code: code
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.access_token) {
          Kakao.Auth.setAccessToken(data.access_token);
          return Kakao.API.request({ url: '/v2/user/me' });
        } else {
          throw new Error("토큰이 없습니다.");
        }
      })
      .then(response => {
        const userId = response.id;
        const nickname = response.kakao_account.profile.nickname;
        localStorage.setItem("userId", userId);
        localStorage.setItem("nickname", nickname);
        window.location.href = "orcax-farm-000.html";
      })
      .catch(error => {
        alert("로그인 실패: " + error.message);
        window.location.href = "index.html";
      });
    } else {
      alert("인증 코드가 없습니다.");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
