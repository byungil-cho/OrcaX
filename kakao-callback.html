<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 성공 - OrcaX 농장</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('https://byungil-cho.github.io/OrcaX/farm-000_01.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      color: #fff;
    }
    .container {
      padding-top: 20vh;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background-color: rgba(0,0,0,0.6);
      display: inline-block;
      padding: 0.7rem 1.5rem;
      border-radius: 12px;
    }
    p {
      font-size: 1.2rem;
      background-color: rgba(0,0,0,0.5);
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 10px;
    }
    a.button {
      display: inline-block;
      margin-top: 2rem;
      background: #FEE500;
      color: #000;
      font-weight: bold;
      padding: 0.8rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1.1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 OrcaX 농장에 오신 것을 환영합니다!</h1>
    <p>로그인에 성공하셨습니다. 자원 지급 중...</p><br/>
    <a href="index9.html" class="button">🌾 메인 농장으로 이동</a>
  </div>

  <script>
    const nickname = localStorage.getItem("nickname");
    const kakaoId = localStorage.getItem("userId");

    if (!kakaoId || !nickname) {
      alert("로그인 정보가 없습니다. 다시 로그인 해주세요.");
      window.location.href = "index9.html";
    } else {
      fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ kakaoId, nickname })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          const { orcx, water, fertilizer } = data.user;
          localStorage.setItem("orcx", orcx);
          localStorage.setItem("water", water);
          localStorage.setItem("fertilizer", fertilizer);

          fetch("/api/userdata", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ kakaoId, nickname, orcx, water, fertilizer })
          })
          .then(res => res.json())
          .then(saveResp => {
            if (!saveResp.success) {
              console.error("서버 저장 실패:", saveResp.message);
            } else {
              console.log("서버 저장 완료:", saveResp);
            }
          })
          .catch(err => {
            console.error("서버 저장 요청 실패:", err);
          });
        } else {
          alert("사용자 정보가 없습니다. 회원가입 후 이용해주세요.");
          window.location.href = "index9.html";
        }
      })
      .catch(err => {
        alert("서버 연결 실패: " + err.message);
      });
    }
  </script>
</body>
</html>
