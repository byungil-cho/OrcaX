<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OrcaX 계약 완료</title>
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
  <script>
    Kakao.init("284b798a9d9be8202f9c2e129fa6f329");

    function sanitizeNickname(nickname) {
      return nickname.replace(/[^\uAC00-\uD7A3a-zA-Z0-9]/g, '').replace(/\s+/g, '').trim();
    }

    function kakaoLogin() {
      Kakao.Auth.login({
        scope: "profile_nickname",
        success: function(authObj) {
          Kakao.API.request({
            url: '/v2/user/me',
            success: function(res) {
              const rawNickname = res.properties.nickname;
              const cleanedNickname = sanitizeNickname(rawNickname);
              localStorage.setItem("nickname", cleanedNickname);
              alert(`🌱 ${cleanedNickname} 님 환영합니다! 감자농장으로 입장합니다.`);
              window.location.href = "orcax-farm_000.html";
            },
            fail: function(err) {
              alert("❌ 사용자 정보 불러오기 실패");
              console.error(err);
            }
          });
        },
        fail: function(err) {
          alert("❌ 카카오 로그인 실패");
          console.error(err);
        }
      });
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: 'Segoe UI', sans-serif;
      background-color: #fdfdfd;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      color: #333;
    }

    .login-btn {
      background-color: #fee500;
      border: none;
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #191600;
      cursor: pointer;
      margin-top: 2rem;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background 0.3s;
    }

    .login-btn:hover {
      background-color: #ffeb3b;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.5rem;
      }

      p {
        font-size: 1rem;
      }

      .login-btn {
        font-size: 1rem;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <h1>📋 OrcaX 계약 동의 완료</h1>
  <p>이제 카카오톡 계정으로 로그인해주세요.</p>
  <button class="login-btn" onclick="kakaoLogin()">카카오로 로그인</button>
</body>
</html>
