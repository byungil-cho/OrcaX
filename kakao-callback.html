<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OrcaX 로그인 완료</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
  <script>
    Kakao.init("284b798a9d9be8202f9c2e129fa6f329");

    function sanitizeNickname(nickname) {
      return nickname.replace(/[^\uAC00-\uD7A3a-zA-Z0-9]/g, '').replace(/\s+/g, '').trim();
    }

    function loginOnceAndStay() {
      Kakao.Auth.login({
        scope: "profile_nickname",
        success: function(authObj) {
          Kakao.API.request({
            url: "/v2/user/me",
            success: function(res) {
              const nickname = sanitizeNickname(res.properties.nickname);
              localStorage.setItem("nickname", nickname);
              document.getElementById("nickname").innerText = `🌱 ${nickname}님 환영합니다!`;
              document.getElementById("login-section").style.display = "none";
              document.getElementById("nickname-section").style.display = "block";
            },
            fail: function(err) {
              alert("❌ 사용자 정보 요청 실패");
              console.error(err);
            }
          });
        },
        fail: function(err) {
          alert("❌ 로그인 실패");
          console.error(err);
        }
      });
    }

    // 자동으로 로그인 중이면 바로 보여주기
    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("nickname");
      if (saved) {
        document.getElementById("nickname").innerText = `🌱 ${saved}님 환영합니다!`;
        document.getElementById("login-section").style.display = "none";
        document.getElementById("nickname-section").style.display = "block";
      }
    });
  </script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #fdfdfd;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .login-btn {
      background-color: #fee500;
      color: #191600;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-top: 2rem;
    }
    #nickname-section {
      display: none;
      font-size: 1.2rem;
      color: #333;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <h1>📋 OrcaX 계약 동의 완료</h1>
  <p>이제 카카오 계정으로 로그인하고 입장하세요.</p>

  <div id="login-section">
    <button class="login-btn" onclick="loginOnceAndStay()">카카오로 로그인</button>
  </div>

  <div id="nickname-section">
    <div id="nickname">닉네임 불러오는 중...</div>
  </div>
</body>
</html>
