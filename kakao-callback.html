<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kakao Login Callback</title>
</head>
<body>
  <p>로그인 처리 중입니다...</p>

  <script>
    const code = new URL(window.location.href).searchParams.get("code");

    console.log("🔶 받은 code:", code);

    fetch("https://kauth.kakao.com/oauth/token", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded;charset=utf-8",
      },
      body: new URLSearchParams({
        grant_type: "authorization_code",
        client_id: "카카오REST_API_KEY", // ← 실제 앱 키로 교체
        redirect_uri: "https://byungil-cho.github.io/kakao-callback.html",
        code,
        client_secret: "클라이언트_시크릿_있다면" // 없으면 이 줄 제거
      }),
    })
    .then((res) => res.json())
    .then((data) => {
      console.log("🟡 Kakao token response:", data);

      const accessToken = data.access_token;
      if (!accessToken) {
        throw new Error("access_token 없음");
      }

      return fetch("https://kapi.kakao.com/v2/user/me", {
        headers: {
          Authorization: `Bearer ${accessToken}`,
        },
      });
    })
    .then((res) => res.json())
    .then((profile) => {
      console.log("🟢 Kakao profile:", profile);

      const kakaoId = profile.id;
      const nickname = profile.properties?.nickname || "닉네임없음";
      const email = profile.kakao_account?.email || "";

      // 로그인 요청
      return fetch("https://orcax-survey-3060.onrender.com/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ kakaoId }),
      }).then((res) => {
        if (!res.ok) {
          throw new Error("❗ 로그인 실패 또는 유저 없음");
        }
        return res.json();
      }).then((result) => {
        console.log("🔵 Login result:", result);
        localStorage.setItem("userId", kakaoId);
        localStorage.setItem("nickname", nickname);
        localStorage.setItem("email", email);
        window.location.href = "/index9.html";
      });
    })
    .catch((err) => {
      console.error("❌ 에러 발생:", err);
      alert("로그인 중 문제가 발생했습니다: " + err.message);
    });
  </script>
</body>
</html>
