<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카카오 로그인 콜백</title>
</head>
<body>
  <script>
    const code = new URL(window.location.href).searchParams.get("code");

    if (!code) {
      alert("인증 코드가 없습니다.");
    } else {
      fetch(`https://kauth.kakao.com/oauth/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          grant_type: 'authorization_code',
          client_id: '284b798a9d9be8202f9c2e129fa6f329',
          redirect_uri: 'https://byungil-cho.github.io/OrcaX/kakao-callback.html',
          code: code
        })
      })
      .then(res => res.json())
      .then(data => {
        const accessToken = data.access_token;
        return fetch("https://kapi.kakao.com/v2/user/me", {
          headers: { Authorization: `Bearer ${accessToken}` }
        })
        .then(res => res.json())
        .then(profile => {
          const nickname = profile.properties?.nickname;
          const kakaoId = profile.id;

          if (!nickname || nickname === "사용자") {
            alert("닉네임을 불러오지 못했습니다. 다시 로그인 해주세요.");
            return;
          }

          // ✅ 서버로 nickname + kakaoId 전송
          fetch("https://climbing-wholly-grouper.jp.ngrok.io/api/login", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nickname, kakaoId })
          })
          .then(res => res.json())
          .then(result => {
            if (result.success) {
              console.log("서버 저장 성공:", result);
            } else {
              console.warn("서버 응답 오류", result);
            }
          })
          .catch(err => {
            console.error("서버 통신 실패", err);
          });

          // ✅ 로컬Storage에 올바르게 저장 (핵심 수정 부분)
          localStorage.setItem("nickname", nickname);
          localStorage.setItem("kakaoId", kakaoId); // ← 핵심 변경!
          localStorage.setItem("accessToken", accessToken);

          // ✅ 농장 입구로 이동
          window.location.href = "https://byungil-cho.github.io/OrcaX/index9.html";
        });
      })
      .catch(err => {
        console.error("로그인 오류", err);
        alert("로그인 중 오류가 발생했습니다.");
      });
    }
  </script>
</body>
</html>
