<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>카카오 로그인 중...</title>
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
</head>
<body>
  <p>로그인 처리 중입니다...</p>

  <script>
    Kakao.init('284b798a9d9be8202f9c2e129fa6f329');

    Kakao.Auth.login({
      success: function (authObj) {
        Kakao.API.request({
          url: '/v2/user/me',
          success: function (res) {
            const kakaoId = res.id.toString();
            const nickname = res.kakao_account.profile.nickname;

            // ✅ localStorage 저장 (키 통일)
            localStorage.setItem('kakaoId', kakaoId);
            localStorage.setItem('nickname', nickname);

            // ✅ 다음 페이지로 이동
            location.href = 'index9.html';
          },
          fail: function (err) {
            alert("카카오 정보 요청 실패");
            console.error(err);
          }
        });
      },
      fail: function (err) {
        alert("로그인 실패");
        console.error(err);
      }
    });
  </script>
</body>
</html>
