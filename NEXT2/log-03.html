  <style>
    body {

      font-family: 'Noto Sans KR', sans-serif;

      background-size: cover;
      background-repeat: no-repeat;

    }
    .container {

    }
    .images {
      margin: 20px 0;

    .images img {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 20px auto;

      display: flex;

      .container {

      }
      p {
        font-size: 1em;
      }

  <div class="container">
    <h1>나침반</h1>
    <p>바람이 불지 않아도, OrcaX는 방향을 안다.</p>
    <p>바다 위를 항해할 때, 가장 무서운 순간은<br>
    <strong>폭풍이 아니라 무풍(無風)</strong>입니다.</p>
    <p>그저 정지된 수평선 위에서 갈 길을 잃고 표류하는 시간.<br>
    하지만 진짜 항해자는 바람에 흔들리지 않고,<br>
    자신만의 나침반을 믿고 움직입니다.</p>
    <p>OrcaX는 그런 항해자들의 디지털 나침반입니다.<br>
    바람이 불지 않아도, 세상이 혼란스러워도,<br>
    진실한 방향성만은 명확히 알려줍니다.</p>
