<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaX 항해일지 1 - 항해의 시작</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+KR&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      color: #e0e0e0;
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1950&q=80') no-repeat center top fixed;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      text-align: center;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px 20px;
      border-radius: 12px;
      width: 700px;
      max-width: 90%;
      margin: 40px auto;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.5em;
      color: #FFD700;
      margin-bottom: 0.8em;
    }
    p {
      font-size: 1.2em;
      line-height: 1.8;
      margin: 0.6em 0;
      white-space: normal;
    }
    .images {
      margin: 20px 0;
    }
    .images img {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 20px auto;
      border-radius: 8px;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 2em;
    }
    .nav-buttons a {
      padding: 12px 24px;
      border: 2px solid #00bfff;
      color: #00bfff;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s, color 0.3s;
    }
    .nav-buttons a:hover {
      background: #00bfff;
      color: #000;
    }
    @media (max-width: 640px) {
      .container {
        width: 100%;
      }
      h1 {
        font-size: 1.8em;
      }
      p {
        font-size: 1em;
      }
      .images img {
        width: 100%;
      }
      .nav-buttons {
        flex-direction: column;
        gap: 10px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>항해의 시작</h1>
    <p>수평선 너머의 별을 따라, 범고래가 바다를 가르다.</p>
    <p>바다는 늘 말이 없습니다.<br>하지만 그 침묵 속엔 무수한 이야기가 출렁이고 있습니다.</p>
    <p>OrcaX, 그 이름은 단순한 토큰을 넘어 새로운 항로를 여는 나침반입니다.</p>
    <p>이 첫 번째 퍼즐 조각은<br>탑승자에게 “우리의 여정이 이제 막 시작되었음을 알리는 별”과도 같은 신호탄입니다.</p>

    <div class="images">
      <img src="culs_002.jpg" alt="">
    </div>

    <div class="nav-buttons">
      <a href="log-0.html">← 이전 이야기로</a>
      <a href="log-01.html">다음 이야기로 →</a>
    </div>
  </div>
</body>
</html>
