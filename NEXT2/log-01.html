<head>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      color: #e0e0e0;
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1950&q=80') no-repeat center top fixed;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      text-align: center;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px 20px;
      border-radius: 12px;
      width: 700px;
      max-width: 90%;
      margin: 40px auto;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.5em;
      color: #FFD700;
      margin-bottom: 0.8em;
    }
    p {
      font-size: 1.2em;
      line-height: 1.8;
      margin: 0.6em 0;
      white-space: normal;
    }
    .images {
      margin: 20px 0;
    }
    .images img {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 20px auto;
      border-radius: 8px;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 2em;
    }
    .nav-buttons a {
      padding: 12px 24px;
      border: 2px solid #00bfff;
      color: #00bfff;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s, color 0.3s;
    }
    .nav-buttons a:hover {
      background: #00bfff;
      color: #000;
    }
    @media (max-width: 640px) {
      .container {
        width: 100%;
      }
      h1 {
        font-size: 1.8em;
      }
      p {
        font-size: 1em;
      }
      .images img {
        width: 100%;
      }
      .nav-buttons {
        flex-direction: column;
        gap: 10px;
      }
    }

<body>
  <div class="container">
    <h1>기술과 혁신</h1>
    <p>오르카의 지느러미는 혁신의 물결을 읽는다.</p>
    <p>고요한 바다에서 파도는 가장 먼저 지느러미가 감지합니다.<br>
    범고래 Orca는 바다의 변화에 민감하게 반응하며,<br>
    조용히 방향을 틀고, 흐름을 읽고, 거대한 물살 위를 가로지릅니다.</p>
    <p>OrcaX는 단순한 크립토 프로젝트가 아닙니다.<br>
    그 지느러미는 <strong>실물자산(RWA)</strong>과 블록체인 기술, 그리고 Web3 생태계의 미래를 감지하며 움직입니다.</p>
    <p>한 발 앞선 감각, 그것이 바로 혁신의 DNA입니다.</p>
