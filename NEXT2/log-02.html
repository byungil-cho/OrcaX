<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaX 항해일지 3 - 무한 가능성</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+KR&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      color: #e0e0e0;
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1950&q=80') no-repeat center top fixed;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      text-align: center;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px 20px;
      border-radius: 12px;
      width: 700px;
      max-width: 90%;
      margin: 40px auto;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.5em;
      color: #FFD700;
      margin-bottom: 0.8em;
    }
    p {
      font-size: 1.2em;
      line-height: 1.8;
      margin: 0.6em 0;
      white-space: normal;
    }
    .images {
      margin: 20px 0;
    }
    .images img {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 20px auto;
      border-radius: 8px;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 2em;
    }
    .nav-buttons a {
      padding: 12px 24px;
      border: 2px solid #00bfff;
      color: #00bfff;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s, color 0.3s;
    }
    .nav-buttons a:hover {
      background: #00bfff;
      color: #000;
    }
    @media (max-width: 640px) {
      .container {
        width: 100%;
      }
      h1 {
        font-size: 1.8em;
      }
      p {
        font-size: 1em;
      }
      .images img {
        width: 100%;
      }
      .nav-buttons {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>무한 가능성</h1>
    <p>X는 미지의 가능성, 선택은 당신의 몫.</p>
    <p>모든 항해에는 지도에 없는 미지의 장소가 있습니다.<br>
    그곳에는 'X'가 표시되어 있습니다.</p>
    <p>고대의 보물지도가 그랬듯,<br>
    OrcaX의 ‘X’는 단순한 기호가 아닌,<br>
    무한한 가능성과 선택의 갈림길을 뜻합니다.</p>
    <p>‘X’는 물리적인 방향이 아닙니다.<br>
    ‘X’는 당신이 원하는 미래로 향하는<br>
    가장 개인적이며 자유로운 좌표입니다.</p>

    <div class="images">
      <img src="cul_005.jpg" alt="">
      <img src="cul_006.jpg" alt="">
    </div>

    <div class="nav-buttons">
      <a href="log-01.html">← 이전 이야기로</a>
      <a href="log-03.html">다음 이야기로 →</a>
    </div>
  </div>
</body>
</html>
