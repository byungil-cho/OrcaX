<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaX 항해일지 9 - 미래 탐색</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+KR&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      color: #e0e0e0;
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1950&q=80') no-repeat center top fixed;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      text-align: center;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px 20px;
      border-radius: 12px;
      width: 700px;
      max-width: 90%;
      margin: 40px auto;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.5em;
      color: #FFD700;
      margin-bottom: 0.8em;
    }
    p {
      font-size: 1.2em;
      line-height: 1.8;
      margin: 0.6em 0;
      white-space: normal;
    }
    .images {
      margin: 20px 0;
    }
    .images img {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 20px auto;
      border-radius: 8px;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 2em;
    }
    .nav-buttons a {
      padding: 12px 24px;
      border: 2px solid #00bfff;
      color: #00bfff;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s, color 0.3s;
    }
    .nav-buttons a:hover {
      background: #00bfff;
      color: #000;
    }
    @media (max-width: 640px) {
      .container {
        width: 100%;
      }
      h1 {
        font-size: 1.8em;
      }
      p {
        font-size: 1em;
      }
      .images img {
        width: 100%;
      }
      .nav-buttons {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>미래 탐색</h1>
    <p>한 발 한 발, 파도를 딛고 미래로</p>
    <p>바다는 언제나 일정하지 않습니다.<br>
    크고 작은 파도가 우리의 발아래로 밀려옵니다.<br>
    그럼에도 불구하고 우리는 한 발 한 발, 확신을 가지고 전진합니다.</p>
    <p>OrcaX는 단숨에 도착하는 여정이 아닙니다.<br>
    지속적이고, 꾸준한 항해입니다.<br>
    그 발걸음 하나하나에 기술의 진보, 커뮤니티의 의지, 비전의 가치가 담겨 있습니다.</p>
    <p>미래는 막연한 희망이 아니라,<br>
    현재의 발걸음이 만든 구체적 실현입니다.</p>

    <div class="images">
      <img src="cul_007_01.jpg" alt="">
    </div>

    <div class="nav-buttons">
      <a href="log-07.html">← 이전 이야기로</a>
      <a href="log-09.html">다음 이야기로 →</a>
    </div>
  </div>
</body>
</html>
