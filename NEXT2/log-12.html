    <p>혼자가 아닌 함께이기에 우리는 멀리 간다.</p>
    <p>바다는 누구에게나 위대하고 위협적인 공간입니다.<br>
    혼자 떠난 항해는 빠를 수는 있어도,<br>
    멀리 갈 수는 없습니다.</p>
    <p>OrcaX는 혼자의 항해가 아닌, 모두의 항해입니다.<br>
    기술이 기반이지만,<br>
    그 토대를 굳건히 지탱하는 건 사람들 간의 연결, 공동체의 유대입니다.</p>
    <p>함께 노를 저을 때,<br>
